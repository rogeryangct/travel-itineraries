6:40回住宿休息。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Solomon%20Museum%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-solomon">導覽</a></div></div><div class="slot" id="al21-mosques"><div class="time">16:50–17:30</div><div><h3>Bachelors’ Mosque、Lead Mosque與下城</h3><p>依體力選一至兩處外觀；若週日跳過King Mosque／Halveti，優先補那一組，不硬塞全部。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bachelors%20Mosque%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-mosques">導覽</a></div></div><div class="slot" id="al21-sunset"><div class="time">17:35–19:06</div><div><h3>Gorica河岸｜第二次黃昏；山丘僅乾燥時選配</h3><p>預設河岸中長焦拍窗戶與屋頂。若選Gorica Hill，須白天確認合法路徑、天乾且體力足；18:30前下撤，不把日落後走山路當主線。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Gorica%20Bridge%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-sunset">導覽</a></div></div><div class="slot" id="al21-dinner"><div class="time">19:15–21:00</div><div><h3>Berat第二晚｜家庭料理與補給</h3><p>已訂到Lili再依時間赴約；否則Antigoni、Tradita e Beratit或住宿推薦。晚餐後準備9/22行李與早餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Home%20Made%20Food%20Lili%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-dinner">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>計程車往返城堡，優先已開放室內館；取消城牆邊緣、Gorica Hill與陡巷。兩館若未開，改下城宗教建築、住宅外觀與咖啡，勿硬闖關閉古蹟。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Solomon、部分下城清真寺與山丘；保留城堡、已開放Onufri和休息。Osumi Canyon不併入本日，若另選業者活動須按完整接送時長替換文化行程，不能承諾13:30–18:00足夠。</p></div></section><section class="day" id="al22"><span class="tag">2026-09-22</span><h2>Durrës → Laknas → TIFF｜海港考古與當代電影</h2><p>白天Durrës，下午機場周邊住宿整理；TIFF採已公布18:00場次候選，優先提早返回。</p><div class="slot" id="al22-transfer"><div class="time">07:15–10:30</div><div><h3>Berat早餐、退房 → Durrës</h3><p>07:15早餐，07:45短散步可省；08:30出發，約10:30抵達。車停合法有人管理停車區，行李置於看不見處；貴重物隨身。</p><p><b>交通：</b>以主要鋪面道路北上；預留約2–2.5小時與市區停車。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Durres%20Archaeological%20Museum" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="al22-museum"><div class="time">10:30–11:45</div><div><h3>Durrës Archaeological Museum｜港口的物質世界</h3><p>2026/4/28重新開放已有報導；尚未取得可確認9/22的官方即時時段與票價。到門口先核對；關門立刻改遺址步行線。P07：41.311389,19.440278。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.311389%2C19.440278" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-museum">導覽</a></div></div><div class="slot" id="al22-amphi"><div class="time">11:50–12:45</div><div><h3>Roman Amphitheatre｜羅馬娛樂與基督教再利用</h3><p>沿城市街道步行前往，留45–55分鐘；含地下通道及小禮拜空間是否可入依現場。P08：41.31222,19.44500。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.31222%2C19.44500" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-amphi">導覽</a></div></div><div class="slot" id="al22-walls"><div class="time">12:45–13:20</div><div><h3>城牆與Venetian Tower｜海港防線</h3><p>一路步行看城牆與塔樓外觀。P09：41.3097,19.4470；若塔樓展示需排隊則略過。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.3097%2C19.4470" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-walls">導覽</a></div></div><div class="slot" id="al22-lunch"><div class="time">13:20–14:05</div><div><h3>海鮮午餐與海濱短走</h3><p>選菜單價格清楚的餐廳。可共享魚、沙拉、淡菜或小卷，14:05左右出發往Laknas。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Durres%20seaside" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-lunch">導覽</a></div></div><div class="slot" id="al22-laknas"><div class="time">14:05–16:30</div><div><h3>Durrës → Beautifull Apartament, Laknas</h3><p>約15:00–15:30入住，先整理行李、買9/23早餐，確認還車公司07:45接車及接駁。依租約補至所需油量；所有還車確認先完成，再決定影展。</p><p><b>交通：</b>約1–1.5小時加塞車彈性；Laknas不是Tirana市中心。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Beautifull%20Apartament%20Laknas" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>提前安排雙程計程車；只列交通安排，未代叫車或更改還車預約。</p></div></div><div class="slot" id="al22-tiff"><div class="time">16:30–19:10</div><div><h3>計程車進城 → TIFF 18:00紀錄片候選</h3><p>16:30–16:45離開Laknas，目標17:30–17:40抵達Kino Piramida。18:00《The Proletariat’s Platini》／Arian Çuliqi／Albania 2026／57分鐘。按票券核對入口、字幕與入場；片長不含介紹或映後。</p><p><b>費用：</b>票價待確認；計程車以實際報價。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kino%20Piramida%20Tirana" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://tiranafilmfest.org/program-2026/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al22-tiff">導覽</a></div></div><div class="slot" id="al22-pyramid"><div class="time">19:10–21:15</div><div><h3>Pyramid外觀、最後晚餐與返回Laknas</h3><p>P10：41.32306,19.82139。散場短拍外觀，19:30左右晚餐；20:30–20:45搭預約車返回，21:15左右休息。若映後延誤，縮短晚餐／取消攝影。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.32306%2C19.82139" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-pyramid">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>優先已開放考古博物館；競技場通道依現場安全開放。大雨縮短戶外牆段、海濱；Tirana直接車到場館，不登Pyramid。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>Durrës遲於14:30離開則先刪海濱與長午餐；16:30仍未處理好還車／行李就取消TIFF。考古館關門改競技場→城牆→塔樓，拜占庭Forum僅餘裕時外觀；不為未確認Durrës Fest演出延後入住。</p></div></section><section class="day" id="al23"><span class="tag">2026-09-23</span><h2>Laknas → TIA → Bucharest｜提前還車搭機</h2><p>07:10出發、07:45還車、08:25進航廈、11:35起飛。還車時間須租車公司確認；航班依個人訂位複核。</p><div class="slot" id="al23-depart"><div class="time">06:30–07:10</div><div><h3>Laknas早餐、最後檢查與出發</h3><p>06:30起床，06:40–07:00早餐，07:10出發。核對護照、手機、充電器、隨身液體及航空公司訂位；早餐前一晚買好。</p></div></div><div class="slot" id="al23-return"><div class="time">07:25–08:15</div><div><h3>依合約補油 → 07:45還車目標</h3><p>預約07:45，最遲08:00開始；不是08:45才驗車。實際還車點可能在航廈外，必須把接駁算入。若對方未同意早班接車，提前取得書面自助還車流程。</p><a class="guide-link" href="#guide-al23-return">導覽</a></div></div><div class="slot" id="al23-flight"><div class="time">08:15–11:35</div><div><h3>進入TIA航廈 → 托運、安檢 → OTP</h3><p>目標08:15–08:25進航廈；TIA官網建議至少提前3小時，11:35起飛對應08:35以前。依使用者提供為Ryanair TIA→OTP；實際航班、報到與登機截止時間以航空公司訂位為準。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Tirana%20International%20Airport" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.tirana-airport.com/en/article/1121/Important-Announcements-and-Info-for-Passengers" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al23-flight">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>清晨下雨或道路擁塞時再提前出門；不在機場前額外採買。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>刪所有拍照與咖啡，先交車及接駁。若交車延誤，立即依租車公司已確認流程處理，不自行把車棄在未授權位置。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>Onufri一般票</td><td>400 ALL</td><td>人</td><td>官網頁面現列；星期一與當日狀況再確認</td></tr><tr><td>Onufri audio guide ticket</td><td>500 ALL</td><td>票</td><td>官網另列；確認是否含門票，勿直接加400</td></tr><tr><td>Ethnographic</td><td>300 ALL</td><td>人</td><td>官網頁面現列；開館再確認</td></tr><tr><td>Durrës兩處考古參觀</td><td>約1,000 ALL</td><td>人／預留</td><td>規劃額度，非已確認售價</td></tr><tr><td>Berat簡餐</td><td>800–1,500 ALL</td><td>人／餐</td><td>預算</td></tr><tr><td>Berat正式晚餐</td><td>1,500–2,500 ALL</td><td>人／餐</td><td>預算</td></tr><tr><td>Durrës海鮮午餐</td><td>1,500–2,500 ALL</td><td>人／餐</td><td>預算；整魚先確認重量</td></tr><tr><td>Lin／城堡／小館／停車</td><td>另備小額ALL</td><td>按現場</td><td>未確認，不能視為免費</td></tr><tr><td>TIFF與Laknas往返Tirana</td><td>按票務與計程車報價</td><td>兩人</td><td>未購票、未叫車</td></tr></tbody></table></div><p>兩人不含住宿、油費的總額會受餐廳、影展及計程車報價影響；不以未確認的單價拼出假精確總價。博物館官網現有價格為2026/9/19查閱，不等於當日營運保證。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-al20-border"><summary>RUPE退房 → Qafë Thanë／Kjafasan｜導覽</summary><h3>現場看什麼</h3><p>從湖盆逐漸爬向山口，留意道路如何避開陡坡，再把湖岸與西側內陸接起來。現代國境切過同一湖區，自然環境延續，行政、貨幣與招牌卻立刻轉換。</p><h3>歷史背景</h3><p>Ohrid湖區的自然與文化遺產跨越兩國，阿爾巴尼亞一側在2019年納入世界遺產範圍。Lin的早期基督教遺址提醒我們，湖岸的信仰、交易與聚落網絡早於今日國界。</p><h3>相關故事</h3><p>接下來往Librazhd、Elbasan的山谷，讓人容易理解Via Egnatia為何選擇可通行的走廊。古代道路運送的不只有軍隊，也包括陶器、貨幣、書信與思想；今日公路只是部分延續相近交通方向，不代表每段柏油下都是羅馬原路。</p><h3>實用提醒</h3><p>兩國此時都用UTC+2，不需調時鐘。進入Albania後用ALL／lek；導航預估不含邊檢。09:30前入境照常，10:00後Lin縮45分鐘，11:00後略過Lin。</p><a class="guide-return" href="#al20-border">回到行程</a></details><details class="guide-card" id="guide-al20-lin"><summary>Lin湖村與早期基督教遺址｜導覽</summary><h3>現場看什麼</h3><p>先在湖岸看屋舍、庭院、菜園和船，再上坡回望：狹長陸地伸進湖中，聚落沿能通行的岸線與坡度擴展。拍廣景時讓村屋與山體同框，才能表現半島尺度；近拍則找石牆、門框、屋瓦與湖水之間的材質差異。</p><p>遺址內先找平面界線、室內分區與鑲嵌邊框，再辨認鳥類、植物、葡萄藤及幾何紋。被覆蓋的區域是保護措施，不能自行揭開。</p><h3>歷史背景</h3><p>山上的早期基督教教堂及鑲嵌約屬6世紀，見證晚期古代湖岸社群。這與湖中更早的史前樁上聚落是不同年代、不同性質的遺址，不能把眼前教堂說成數千年前的水上村落。</p><p>教堂裝飾沿用古典世界熟悉的自然圖像，又放入新的禮拜空間。建築與圖像的改變，反映宗教制度逐漸成為地方公共生活的重要力量。</p><h3>相關故事</h3><p>葡萄、鳥與植物可以帶出豐饒、生命與天堂的聯想，但不能看到每隻鳥就斷言特定經文。比較有意思的看法是：工匠如何用小石塊的色差做出葉片、羽毛與曲線？在限制很大的材料中，節奏與輪廓比逼真透視更重要。</p><h3>實用提醒</h3><p>09:20朝東湖面可能逆光；改向西拍被晨光照亮的住宅，或保留亮水剪影。上坡約需另留步行時間；雨天只走村內平坦路段。遺址開放與鑲嵌揭示範圍以管理員為準，未核實固定營業時間。</p><a class="guide-return" href="#al20-lin">回到行程</a></details><details class="guide-card" id="guide-al20-drive"><summary>Lin → Librazhd午餐 → Elbasan → Berat｜導覽</summary><h3>現場看什麼</h3><p>觀察湖盆如何收束成山口，再進入Shkumbin流域的交通走廊。道路、河流和聚落常爭取同一片有限平地，這比行政地圖更能解釋城鎮的位置。</p><h3>歷史背景</h3><p>Via Egnatia把亞得里亞海港口與巴爾幹內陸連接，Durrës是其西端的重要門戶之一。Elbasan一帶延續了古代交通節點的功能；本段與9/22海港參觀，可以串成一條從湖區回到地中海的歷史路線。</p><h3>相關故事</h3><p>午餐點byrek、qofte、烤雞、番茄沙拉或dhallë。byrek薄麵皮包餡容易攜帶，dhallë是偏鹹的優格飲；這些食物適合交通城鎮的工作日節奏，不必每餐都吃正式宴席。</p><h3>實用提醒</h3><p>駕駛不飲酒。依現場導航比較主要鋪面道路，Cërrik方向不可盲從狹窄捷徑；下雨時寧可多留幹道時間。</p><a class="guide-return" href="#al20-drive">回到行程</a></details><details class="guide-card" id="guide-al20-king"><summary>King Mosque｜王者清真寺｜導覽</summary><h3>現場看什麼</h3><p>由院落看門廊如何連接街道與禮拜空間。進入後找mihrab壁龕所指的禮拜方向，以及minbar講壇的位置；再抬頭觀察木構與裝飾，而非只拍宣禮塔。</p><p>把視線從大構件移到細部：柱子承托、窗戶引光、天花的重複幾何，分別處理承重、採光與精神秩序。</p><h3>歷史背景</h3><p>這座清真寺與15世紀末鄂圖曼統治的城市建設有關，後來經破壞、重建與修繕。現今看到的材料並非全部出自最初年代，建築的延續更多體現在場所與社群功能。</p><h3>相關故事</h3><p>「King／Sultan」名稱把捐建權力帶進地方地景。清真寺周圍常與教育、商業、供水、慈善生活相連，捐助公共設施既是信仰實踐，也能建立統治者與地方社會的關係。</p><h3>實用提醒</h3><p>男女均遮肩過膝；依指示脫鞋。避開禮拜，不穿越祈禱者前方。庭院可拍不等於室內可拍；先詢問，別為開門等待壓縮河岸黃昏。</p><a class="guide-return" href="#al20-king">回到行程</a></details><details class="guide-card" id="guide-al20-tekke"><summary>Halveti Tekke｜蘇菲修行空間｜導覽</summary><h3>現場看什麼</h3><p>比較剛才的清真寺：Tekke更像聚會、教學與修行的場所。若獲准進入，從門檻、座位與房間關係辨認集體活動空間，再看天花木雕和植物裝飾。</p><p>拍攝時讓門框包住室內，能表現由城市街道走進安靜空間的轉換；不要只把繁複天花裁成失去建築尺度的圖案。</p><h3>歷史背景</h3><p>Halveti是蘇菲傳統中的一支。蘇菲修行強調精神教導、師徒傳承與內在修養，Tekke則是相關社群的聚集場所。阿爾巴尼亞另有Bektashi等傳統；兩者不能因都屬蘇菲文化就混為同一教團。</p><h3>相關故事</h3><p>「隱修／退修」是理解Halveti名稱與修行精神的線索。安靜的空間、反覆的祈禱與集體儀式可以形成社群認同，但不是每個現存房間都每天舉行儀式；應區分建築的歷史功能與今日管理方式。</p><h3>實用提醒</h3><p>服裝端莊、安靜詢問。無管理員或正在宗教活動時只看外觀，不自行推門。室內散射光往往比強烈直射光更適合木雕細節。</p><a class="guide-return" href="#al20-tekke">回到行程</a></details><details class="guide-card" id="guide-al20-mangalem"><summary>Mangalem｜千窗街區｜導覽</summary><h3>現場看什麼</h3><p>先從低處看一整面坡：下層房屋的屋頂，成為上層房屋窗前的視野。再進入巷子，注意地基如何咬合岩坡、石階如何解決高差、窗與門如何避開對望。</p><p>下層較封閉的石構適合儲物與防護，上層較輕的木構、灰泥與成排窗戶增加光線和生活面積。突出上層讓狹小基地向空中擴展，但也需要木作技術與持續維修。</p><h3>歷史背景</h3><p>Berat的山頂Kala、坡地Mangalem及河對岸Gorica共同構成歷史城市。大量18、19世紀住宅保留鄂圖曼—巴爾幹城市生活的痕跡；世界遺產價值來自整體街區、地形與生活延續，不是只有某一棟最漂亮的白屋。</p><h3>相關故事</h3><p>「千窗」是形容層疊立面造成的視覺印象，不是戶籍式窗數統計。富裕家庭的接待空間、裝飾木作與窗戶比例，也會把社會身分寫在住宅外觀上。白牆看似整齊，其實每戶仍有修補、擴建和使用上的差異。</p><h3>實用提醒</h3><p>下午巷內陰影多，曝光以白牆保留紋理為準。手機2倍或中焦可壓縮窗戶層次；不要把相機伸進開窗住宅。雨天石板很滑，減少上下折返。</p><a class="guide-return" href="#al20-mangalem">回到行程</a></details><details class="guide-card" id="guide-al20-gorica"><summary>Gorica Bridge → 南岸千窗黃昏｜導覽</summary><h3>現場看什麼</h3><p>橋的弧線把南岸住宅區與北岸山城接起來。先拍橋拱、河流及城堡的全景，再用中焦拍住宅的重複窗格。若河水流量小或水面被風吹皺，改用橋面行人與岸線構圖，不必執著完美倒影。</p><p>站在南岸向北看，可以讀出一張城市剖面：山頂防禦、山坡住宅、河岸交通，再到平地的新城。</p><h3>歷史背景</h3><p>Gorica Bridge的歷史與鄂圖曼時代的跨河通行相關，橋體經後世修復與重建。橋不只是觀景台，也服務每天過河工作、購物與探親的居民。Gorica與Mangalem的宗教社群歷史不同，但生活往來並不能簡化成固定不變的兩個世界。</p><h3>相關故事</h3><p>黃昏時白牆的反差降低，窗內燈光讓建築重新呈現家庭生活。拍攝的主角由整齊立面轉為人與房子的關係：亮起的一盞燈、開著的窗、走過橋的人，都能讓照片超越建築明信片。</p><h3>實用提醒</h3><p>向北拍Mangalem，10:00–15:00較容易順光；晚間是側光／藍調，不應標為順光。山勢可能在18:40前遮陽。腳架不擋橋，手機夜景模式靠穩欄杆但不探出河岸。</p><a class="guide-return" href="#al20-gorica">回到行程</a></details><details class="guide-card" id="guide-al20-dinner"><summary>傳統晚餐 → Bulevardi Republika xhiro｜導覽</summary><h3>現場看什麼</h3><p>兩人共享tavë kosi、pispili或蔬菜料理、沙拉與橄欖即可，不必一次點完所有地方菜。tavë kosi是羊肉配優格、蛋的焗烤；pispili常以玉米麵與綠葉蔬菜製作，家庭版本不盡相同。</p><h3>歷史背景</h3><p>河谷適合蔬菜、水果、葡萄與橄欖，山區牧業提供羊肉與乳製品。這些食材在Berat餐桌上相遇，能比「哪一國發明某道菜」更具體地說明地方環境。</p><h3>相關故事</h3><p>gliko是一小份糖漬水果，常搭水或咖啡招待客人。xhiro則是晚間散步：人們出門遇熟人、聊天、讓孩子活動，路線可能反覆經過同一段大道。這種社交的目的不一定是購物或抵達某處。</p><h3>實用提醒</h3><p>先問當日有什麼家常菜與份量。若主人提供raki，可以禮貌婉拒；駕駛不喝。超市別等到21:20才假設仍開門，遇到合適店家先買隔日早餐。</p><a class="guide-return" href="#al20-dinner">回到行程</a></details><details class="guide-card" id="guide-al21-morning"><summary>Gorica晨拍與早餐｜導覽</summary><h3>現場看什麼</h3><p>與前晚比較相同的河岸：清晨主角是搬貨、開店、過橋與買早餐的人。用一張廣角交代環境，再用中焦拍人的活動與門窗關係，不必等待街道完全無人。</p><h3>歷史背景</h3><p>活的歷史街區既需要保存，也需要水電、運輸與工作機會。觀光照片常把現代生活裁掉，但居民的日常才說明Berat為何仍是一座城市。</p><h3>相關故事</h3><p>白屋不一定在日出瞬間變金色；山丘可能仍投下大片陰影。此時柔和天空光反而容易保留牆面細節，用畫面氣氛取代對金色光線的期待。</p><h3>實用提醒</h3><p>P02與P03沿用前晚定位。不要為追晨光翻牆或走到河床。早餐可買byrek、優格、水果；上城堡前帶水、帽與有抓地力的鞋。</p><a class="guide-return" href="#al21-morning">回到行程</a></details><details class="guide-card" id="guide-al21-castle"><summary>計程車上山 → Berat Castle城牆與遺址｜導覽</summary><h3>現場看什麼</h3><p>先看主入口的轉折、牆厚與坡度，想像進城的人流如何被放慢、觀察和控制。再找Red Mosque殘存結構與蓄水設施：軍事防禦不只是高牆，也需要水、糧食、燃料與可維修的通道。</p><p>在觀景處把河谷、橋與道路連起來：城堡控制高地，居民和商業則在河岸與坡地下方發展。不同方向的牆面、補砌材料與門洞，提示它不是單次建成的完整作品。</p><h3>歷史背景</h3><p>城堡所在地長期被利用，今天可見的防禦、教堂與住宅包含中世紀及後來多個階段。鄂圖曼時代增添清真寺與行政軍事需求，但原有基督教社群與教堂生活仍有延續。</p><h3>相關故事</h3><p>Red Mosque遺址打破「城堡一定是純東正教區」的簡化印象。蓄水池則提供另一條讀史線索：圍城時最先成為問題的可能是飲水，而不是城牆是否夠雄偉。從實用設施理解歷史，往往比記住戰役年份更有感。</p><h3>實用提醒</h3><p>選計程車上山、步行下山可減少停車與會車壓力；費用先詢價。各城牆、台階開放不同，不跨封鎖線。08:00若入口未開，先在合法外圍等候或早餐，不自行闖入。</p><a class="guide-return" href="#al21-castle">回到行程</a></details><details class="guide-card" id="guide-al21-onufri"><summary>Onufri Iconographic Museum｜聖像的閱讀方法｜導覽</summary><h3>現場看什麼</h3><p>進入原聖母安息教堂後，先用幾分鐘理解空間：信徒區與祭壇區之間的聖像屏、燭台、木雕與出入口共同服務禮拜，不是一幅幅彼此無關的展品。再選三件作品慢看：基督或聖母、敘事場景、較晚期聖像。</p><p>閱讀順序可由臉部、手勢、衣褶到背景。金色弱化日常時間與空間；正面凝視建立信徒與神聖人物的關係；人物身旁的文字、物件與手勢則協助辨認身分。不要只用「畫得像不像真人」評價它。</p><h3>歷史背景</h3><p>Onufri是16世紀重要聖像畫家，作品在既有拜占庭圖像規範中呈現強烈色彩與表情。館藏跨多個世紀與不同畫家，能看出傳承和改變，而不是一間全部由Onufri親手創作的個人展。</p><p>1807年的木雕聖像屏把繁密裝飾與宗教圖像結合；看葡萄藤、葉片、鳥獸或幾何如何引導眼睛，再看主要人物所占的位置。</p><h3>相關故事</h3><p>「Onufri紅」是理解其色彩風格的入口，卻不必相信每種鮮紅都來自失傳祕方。更值得比較的是紅色如何和金色、暗背景、膚色互相襯托，讓衣褶和人物更有情緒。</p><p>Berat抄本的故事連接教堂與文字保存。紫色、金色抄本曾與此城宗教機構密切相關；展板提及的抄本不等於原件就在眼前，先看標籤區分原件、複製與說明。</p><h3>實用提醒</h3><p>預留約55–60分鐘。關掉快門與提示音，遵守禁止攝影；用筆記記下作品名稱更實用。若週日已看完，這一小時改給Kala住宅、城牆與教堂，無須重買票。</p><a class="guide-return" href="#al21-onufri">回到行程</a></details><details class="guide-card" id="guide-al21-trinity"><summary>Holy Trinity Church｜磚石與河谷｜導覽</summary><h3>現場看什麼</h3><p>從稍高、可合法停留的步道先拍教堂與坡地，再靠近看磚與石的交替、拱券、鼓座和屋頂。高差使基座、牆面與天空形成不同層次，建築與地形的關係比單一正面照更鮮明。</p><p>若開門，先讓眼睛適應暗處；依現場規定看圖像，別以手機補光燈照壁畫。</p><h3>歷史背景</h3><p>Holy Trinity是Berat城堡中世紀東正教建築的重要例子。磚石混用同時有結構與裝飾效果，與巴爾幹拜占庭建築的工匠傳統相連。城堡不是只留下軍事設施，也容納日常宗教生活。</p><h3>相關故事</h3><p>從遠處看教堂很小，近看卻能發現屋頂、牆面與不同高度的量體層層組合。這種小建築也能建立莊重感的方式，來自比例與位置，不一定靠巨大尺寸。</p><h3>實用提醒</h3><p>不為同框河谷越過護欄。教堂本身與河谷方向不同，09:00–11:00只能說常有側光，不能保證每一面都順光。入口是否開放由現場管理決定。</p><a class="guide-return" href="#al21-trinity">回到行程</a></details><details class="guide-card" id="guide-al21-kala"><summary>Kala活城堡巷弄、觀景與午餐｜導覽</summary><h3>現場看什麼</h3><p>沿公共巷道觀察房門、院牆、葡萄棚、菜園與小店。石板、門檻及房屋高差展示如何在不規則地形中使用每一塊土地。不要把所有通道都當遊客環線，有些路只通住家。</p><h3>歷史背景</h3><p>城堡的歷史延續不只是建築材料保存，也來自仍居住其中的人。住宅逐代改修、餐館與旅宿進入，帶來生計，也改變原有社區；「活城堡」因此同時是一種吸引力與保護難題。</p><h3>相關故事</h3><p>用「誰住在這裡，怎麼買菜、搬重物、修屋頂？」代替只找最古老的石頭，會發現城市的另一種尺度。晾衣與停車雖不一定符合明信片，卻是生活必需。</p><h3>實用提醒</h3><p>拍人像先詢問、讓居民車輛通行。午餐可用蔬菜派、釀甜椒、湯與沙拉平衡晚餐羊肉；先確認當日供應和份量。13:15後步行下城，濕滑時改搭車。</p><a class="guide-return" href="#al21-kala">回到行程</a></details><details class="guide-card" id="guide-al21-ethno"><summary>Ethnographic Museum｜走進傳統家庭｜導覽</summary><h3>現場看什麼</h3><p>先把房子當展品：樓層怎樣分工，通風與採光從哪裡來，哪些房間面向客人，哪些處理家庭勞作？再看織機、農具、器皿與衣物，想像它們原本被誰、在何時使用。</p><p>開放木廊chardak連接室內外；暖季可工作、休息與聚會。客房較精緻的天花、壁爐、坐墊與櫃子，則展現待客所需的秩序與體面。</p><h3>歷史背景</h3><p>傳統家庭既消費也生產：食物保存、紡織、修補和工具使用都可能發生在家中。館內的市集與手工藝展示，把家庭與城鎮交易連接起來；住宅不是孤立的民俗物件。</p><h3>相關故事</h3><p>可選一件小物深入看：腰扣與刺繡表現穿戴者身分，銅製火盆回應冬季取暖，榨油器連接周邊橄欖種植。物品旁的磨痕往往比裝飾更能說明日常使用。</p><h3>實用提醒</h3><p>約40–50分鐘即可完整看格局；依館方攝影規範，勿坐展示家具。若想比較上午Onufri，可想「宗教空間如何接待神聖，家庭空間如何接待客人」，但不要把兩者功能混同。</p><a class="guide-return" href="#al21-ethno">回到行程</a></details><details class="guide-card" id="guide-al21-solomon"><summary>Solomon Museum候選｜猶太社群與庇護｜導覽</summary><h3>現場看什麼</h3><p>小館適合讀人物、家庭、地名與具體事件，而非快速看完展板標題。若有照片、信件或見證，分辨哪些是當事人記錄，哪些是後來的回憶與紀念敘事。</p><h3>歷史背景</h3><p>館舍以Berat猶太社群及二戰期間的庇護故事為主題。阿爾巴尼亞的公共記憶常把救援行動與besa相連：承諾、保護受託者和待客責任。</p><h3>相關故事</h3><p>最值得記住的是具體家庭如何提供藏身、食物或身分掩護，以及這些選擇帶來什麼風險。besa能幫助理解道德語言，但不應把每個人的行動都歸結成天生的民族性格；歷史是個人在特定情境下的選擇。</p><h3>實用提醒</h3><p>私人小館的時間與票價待確認；不保證隨到隨開。不拍可辨識個人資料的展件特寫，是否可攝影先問管理員。</p><a class="guide-return" href="#al21-solomon">回到行程</a></details><details class="guide-card" id="guide-al21-mosques"><summary>Bachelors’ Mosque、Lead Mosque與下城｜導覽</summary><h3>現場看什麼</h3><p>Bachelors’ Mosque從名稱即可聯想到城市青年與工匠社群；看外牆裝飾、街面入口與周邊商業的關係。Lead Mosque則注意屋頂、量體及院落，比較兩座建築在城市中占據的位置。</p><h3>歷史背景</h3><p>地方宗教建築可能由統治者、富商或特定社群支持。名稱、規模與材料因此反映不同資源網絡；鉛材屋頂也涉及成本、耐候與維護，不能只當外觀色彩。</p><h3>相關故事</h3><p>把今天看過的城堡教堂、下城清真寺與Tekke放在同一張心中地圖，就能看見不同社群如何共享河谷城市。這種並存不代表歷史從無衝突，也不等於每一區自古只住一種宗教人口。</p><h3>實用提醒</h3><p>依現場開放與禮拜情況參觀；外觀足以完成比較。17:30前收尾，別為湊景點在下城來回急走。</p><a class="guide-return" href="#al21-mosques">回到行程</a></details><details class="guide-card" id="guide-al21-sunset"><summary>Gorica河岸｜第二次黃昏；山丘僅乾燥時選配｜導覽</summary><h3>現場看什麼</h3><p>第一晚已完成大景，今晚找較小的畫面：一列亮窗、橋上人物、白牆與紅瓦、老屋與新樓接壤處。固定一個構圖等光線變化，比不停換點更容易看到時間如何改變城市。</p><h3>歷史背景</h3><p>Gorica高處能展現河谷，但遠景也讓居民生活變得抽象。河岸視角能把交通、住宅與人放在一起，兩者是不同閱讀方式，不是越高越好。</p><h3>相關故事</h3><p>同一扇窗在白天是建築比例，黃昏變成光點，夜裡則可能透露一個家庭正在用餐。保持距離，只拍城市整體，不把可辨識的室內生活當題材。</p><h3>實用提醒</h3><p>9/21日落18:39、暮光19:06。河岸穩定取景即可。山丘坡道若濕滑、未確認路線或沒有照明，就取消；不提供未查證的精確登山機位。</p><a class="guide-return" href="#al21-sunset">回到行程</a></details><details class="guide-card" id="guide-al21-dinner"><summary>Berat第二晚｜家庭料理與補給｜導覽</summary><h3>現場看什麼</h3><p>這餐補上前晚沒吃到的家常菜：釀甜椒、pispili、qofte或tavë kosi擇其一兩道。gliko少量收尾；不喜歡葡萄葉包飯就不用為打卡硬點japrak。</p><h3>歷史背景</h3><p>家庭餐館常依採買與事前準備供菜，上菜節奏和大型商業餐廳不同。餐桌上的分享與互動是待客的一部分，但每家營業方式仍不同，不能保證主人一定陪聊。</p><h3>相關故事</h3><p>若想問一個好問題，可以請店家介紹「這道菜在你家怎麼做」，往往會得到比民族起源爭論更具體的回答：誰揉麵、哪種蔬菜當季、節慶才做哪些菜。</p><h3>實用提醒</h3><p>先訂位、問價和份量。明早要開車，酒量保持節制。買水、堅果與早餐，餐後可xhiro但不排深夜活動。</p><a class="guide-return" href="#al21-dinner">回到行程</a></details><details class="guide-card" id="guide-al22-museum"><summary>Durrës Archaeological Museum｜港口的物質世界｜導覽</summary><h3>現場看什麼</h3><p>依年代看完不如沿「港口如何運作」選文物：陶器與運輸容器代表貨物流動，錢幣與銘文呈現權力和交易，墓葬物件顯示家庭財富與來世想像。先讀出土地點與年代，再看材質與用途。</p><p>若有大型雕像或鑲嵌，注意它們原本屬公共場所、私人住宅還是墓葬；離開原位置後，博物館必須靠標籤補回生活背景。展件以當日展陳為準。</p><h3>歷史背景</h3><p>Durrës的古代名稱包括Epidamnos與Dyrrachium。希臘殖民、當地伊利里亞社會及後來羅馬統治共同形塑港口；「殖民者來到」不等於當地人口與文化瞬間消失。</p><p>它是Via Egnatia西端的重要入口，海運貨物從這裡進入內陸道路網；與9/20走過的湖區—山谷交通線恰好相互呼應。</p><h3>相關故事</h3><p>一只普通陶罐也能比帝王雕像講更多日常故事：裝什麼、從哪裡來、如何封口、搬運途中如何保護？海港城市讓外來商品、工匠與語言反覆相遇，文化交流往往發生在這些不起眼的物品上。</p><h3>實用提醒</h3><p>館舍重開不等於每個展廳、互動設施都全天可用。先問本日開放範圍及攝影規則。朝西海面上午較順光，進館前可短拍；不要把博物館座標當停車入口。</p><a class="guide-return" href="#al22-museum">回到行程</a></details><details class="guide-card" id="guide-al22-amphi"><summary>Roman Amphitheatre｜羅馬娛樂與基督教再利用｜導覽</summary><h3>現場看什麼</h3><p>先辨認橢圓競技場、觀眾席坡面與出入通道。和Ohrid半圓劇場比較：theatre主要服務戲劇、音樂等表演；amphitheatre環繞中央場地，更適合大型競技與公共娛樂。</p><p>接著走獲准開放的通道，想像觀眾如何進場、分流、找到座位。留意古代結構與現代住宅的距離，這能直接看出城市如何疊在遺址周圍。</p><h3>歷史背景</h3><p>場地約建於羅馬帝國2世紀，容量估計常見約1.5–2萬人。大型娛樂建築展示城市財富與贊助者地位，座位安排也反映階級。不是每場表演都相同，也不應把所有羅馬遺址一律稱作角鬥士決鬥場。</p><h3>相關故事</h3><p>後來部分空間改作基督教禮拜用途，保存鑲嵌或壁畫痕跡。這段改變值得停下來想：原本由人群觀看表演的場所，如何轉成另一種集體活動空間？改變的不只信仰，還包括人口、資源與城市需要。</p><h3>實用提醒</h3><p>正午光硬，先從南側合法區域向北取景，再找通道內的明暗對比。進暗處先站穩，避免盯螢幕踏空。禮拜堂、馬賽克不保證開放；不可摸牆面或跨欄。</p><a class="guide-return" href="#al22-amphi">回到行程</a></details><details class="guide-card" id="guide-al22-walls"><summary>城牆與Venetian Tower｜海港防線｜導覽</summary><h3>現場看什麼</h3><p>圓塔要和相連牆段一起看：塔樓提供視野與防守角度，城牆控制進出，港口則是防禦網真正保護的經濟核心。不同大小的石塊、修補接縫與開口，可能提示不同工程階段。</p><h3>歷史背景</h3><p>拜占庭、威尼斯與鄂圖曼勢力都曾改變Durrës防禦。晚古代皇帝Anastasius與城市城防歷史相關，威尼斯在中世紀控制港口後又加強防禦；今日所見不是單一朝代的完好軍事模型。</p><h3>相關故事</h3><p>港口的開放與防守看似矛盾：商業需要讓人與貨物進來，城防卻要辨認、管制甚至阻止進入。站在塔旁看現代交通，仍能感受到這種城市邊界功能的延續。</p><h3>實用提醒</h3><p>12:45前後從南側拍北向塔面較容易順光；避開道路和停車動線。若有室內數位展，票務和內容另核對，不以舊票價當現價。</p><a class="guide-return" href="#al22-walls">回到行程</a></details><details class="guide-card" id="guide-al22-lunch"><summary>海鮮午餐與海濱短走｜導覽</summary><h3>現場看什麼</h3><p>從Berat羊肉、乳製品與蔬菜轉到海魚、貝類與燉飯，餐桌立即反映地理改變。問當日供應與做法，比追求一長串必吃名稱更實用。</p><h3>歷史背景</h3><p>亞得里亞海兩岸長期有航運、移民與文化交流，因此義大利式麵飯和海鮮做法在阿爾巴尼亞海岸並不突兀。它們與巴爾幹共享食材並存，不必劃出完全純粹的國菜邊界。</p><h3>相關故事</h3><p>點整條魚時，價格可能以份、100公克或公斤表示。先問重量與估計總價，能避免上桌後才發現計價方式不同。</p><h3>實用提醒</h3><p>回車前上洗手間。餐點超時則刪海濱散步，保留Laknas休息與提早進城。下午西向拍海易逆光，可改拍水面光帶，不必硬追藍海順光。</p><a class="guide-return" href="#al22-lunch">回到行程</a></details><details class="guide-card" id="guide-al22-tiff"><summary>計程車進城 → TIFF 18:00紀錄片候選｜導覽</summary><h3>現場看什麼</h3><p>這場為TIFF官網9/22「Made In ALBANIAn 1」單元，類型是紀錄片／傳記。未核實完整劇情前，不從片名自行推測人物情節。入場前讀官方簡介，觀影後再回想影片如何使用人物、檔案影像與當代場景。</p><h3>歷史背景</h3><p>TIFF是Tirana的國際電影活動，本屆日期9/21–27。對旅人而言，區域電影讓博物館和城市裡的歷史主題轉成個人經驗；但不應把單一導演作品視為整個國家的共同觀點。</p><h3>相關故事</h3><p>可以帶三個觀看問題：誰在說故事？鏡頭讓誰出現、誰缺席？一段私人記憶如何被剪接成公共歷史？這些問題也適用於前幾天看到的民族博物館、宗教遺產與城市改造。</p><h3>實用提醒</h3><p>官網節目已公布，不能再寫成未有片單。英文字幕、票價與座位尚待確認，不推定免費。若車程延誤、售罄或字幕不合，改提早晚餐，不選22:00場。20:00 Millennium另有72分鐘紀錄片《The Bow and the Brush》，僅在能接受較晚返回且確認票務時替換。</p><a class="guide-return" href="#al22-tiff">回到行程</a></details><details class="guide-card" id="guide-al22-pyramid"><summary>Pyramid外觀、最後晚餐與返回Laknas｜導覽</summary><h3>現場看什麼</h3><p>先看巨大斜面與新增樓梯，再看今天使用建築的人：上階梯、聚會、參加活動。19:10後主要靠天空餘光與建築照明；不用等完全黑暗，人物能交代建築尺度。</p><h3>歷史背景</h3><p>Pyramid在1988年作為Enver Hoxha紀念博物館開放，後來用途多次改變，2023年改造後再次向公眾開放。它把領袖紀念建築轉為新的城市公共與教育用途，成為後共產時代如何處理既有建築的例子。</p><h3>相關故事</h3><p>同一座建築的形體可以留下，意義卻因使用方式而轉變。觀察年輕人如何占用台階與周邊空間，會比只把它稱作「共產遺跡」更完整。</p><h3>實用提醒</h3><p>建築座標不等於影廳入口；依TIFF公告與現場指示。雨後台階滑，晚上不必上頂部。回程車先約上車點，別在散場後才臨時尋車。</p><a class="guide-return" href="#al22-pyramid">回到行程</a></details><details class="guide-card" id="guide-al23-return"><summary>依合約補油 → 07:45還車目標｜導覽</summary><h3>現場看什麼</h3><p>交車前拍連續外觀影像：車頭、左右兩側及輪圈、車尾、擋風玻璃、車內、行李廂，再拍里程、油表、停放位置與鑰匙交付。影像留在自己的手機，不上傳公開網站。</p><h3>歷史背景</h3><p>自駕旅程的最後一段是合約與交接。留下清楚證據可讓雙方比較取車與還車狀態，比只口頭說車子沒問題更實用。</p><h3>相關故事</h3><p>可請工作人員書面確認「Vehicle returned with no new damage and correct fuel level.」若對方認為有差異，當場看記錄與合約，留下爭議內容，而不是為趕時間接受不明描述。</p><h3>實用提醒</h3><p>油量按租約，不預設滿油。自助鑰匙箱必須是租車公司明確指示的位置，另問押金解除程序與聯絡方式；此頁沒有替你修改租約。</p><a class="guide-return" href="#al23-return">回到行程</a></details><details class="guide-card" id="guide-al23-flight"><summary>進入TIA航廈 → 托運、安檢 → OTP｜導覽</summary><h3>現場看什麼</h3><p>先完成必要的報到、行李與證照程序，再安排咖啡。候機時可整理這段路線：Lin的湖岸社群、Berat的山城與信仰、Durrës的港口網絡、Tirana的當代文化。</p><h3>歷史背景</h3><p>同一個國家能同時包含山地、河谷、海港與首都，各地在不同年代與外部世界相連。阿爾巴尼亞的歷史因此不能只用共產掩體、低物價或單一宗教形象概括。</p><h3>相關故事</h3><p>用三個問題回顧旅程：建築由誰興建、為誰服務？今天的導覽選擇保存哪些記憶？所謂傳統仍是日常生活，還是已成觀光展示？這些提問能把照片串成有意義的旅行紀錄。</p><h3>實用提醒</h3><p>07:45還車是安排目標；若還車點離航廈遠或接駁慢，出發須再提前。早餐與水前晚準備，安檢液體規定以機場當日要求；保留自己的訂位證明與租車交接紀錄。</p><a class="guide-return" href="#al23-flight">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://muzeumet-berat.al/en/visit/" target="_blank" rel="noopener">Berat Museum Center｜現行時段、票價、攝影規定</a> · 2026-09-19</li><li><a href="https://muzeumet-berat.al/en/onufri-iconographic-museum/" target="_blank" rel="noopener">Onufri｜官方館藏導覽</a> · 2026-09-19</li><li><a href="https://muzeumet-berat.al/en/ethnographic-museum/" target="_blank" rel="noopener">Ethnographic｜官方住宅與館藏介紹</a> · 2026-09-19</li><li><a href="https://whc.unesco.org/en/list/569/" target="_blank" rel="noopener">UNESCO｜Berat與Gjirokastra</a> · 2026-09-19</li><li><a href="https://whc.unesco.org/en/list/99/" target="_blank" rel="noopener">UNESCO｜跨國Ohrid湖區</a> · 2026-09-19</li><li><a href="https://tiranafilmfest.org/program-2026/" target="_blank" rel="noopener">TIFF｜2026逐日節目（9/22場次）</a> · 2026-09-19</li><li><a href="https://www.tirana-airport.com/en/article/1121/Important-Announcements-and-Info-for-Passengers" target="_blank" rel="noopener">TIA｜提前抵達提醒</a> · 2026-09-19</li><li><a href="https://top-channel.tv/video/top-channel-rihapet-muzeu-arkeologjik-investim-i-be-rikthehen-bukuroshen-e-durresit/" target="_blank" rel="noopener">Top Channel｜2026/4/28 Durrës考古館重開報導</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Lin,_Albania" target="_blank" rel="noopener">Lin｜村落座標及遺址背景</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Gorica_Bridge" target="_blank" rel="noopener">Gorica Bridge｜橋址座標</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Berat_Castle" target="_blank" rel="noopener">Berat Castle｜城堡區座標</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Holy_Trinity_Church,_Berat" target="_blank" rel="noopener">Holy Trinity｜教堂座標</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/King_Mosque,_Berat" target="_blank" rel="noopener">King Mosque｜位置</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Durr%C3%ABs_Archaeological_Museum" target="_blank" rel="noopener">Durrës博物館｜館址座標</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Durr%C3%ABs_Amphitheatre" target="_blank" rel="noopener">Durrës競技場｜遺址位置</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Durr%C3%ABs_Castle" target="_blank" rel="noopener">Durrës城防｜塔樓位置</a> · 2026-09-19</li><li><a href="https://en.wikipedia.org/wiki/Pyramid_of_Tirana" target="_blank" rel="noopener">Tirana Pyramid｜建築位置與改造</a> · 2026-09-19</li></ul></section></main></template>
<template id="content-north-macedonia-2026"><nav><a href="#mk17">09-17 Prizren → Skopje｜河流兩岸的首都</a><a href="#mk18">09-18 Matka → Tetovo → Ohrid｜峽谷與彩繪清真寺</a><a href="#mk19">09-19 Ohrid｜世界遺產老城與 Kaneo</a><a href="#mk20">09-20 Ohrid 南岸 → St. Naum → Albania</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="mk-albania-connection"><h2>9/20接續｜阿爾巴尼亞第二段</h2><p>採天氣調整版、9/19已遊南岸者，9/20改07:30由RUPE出發，經Qafë Thanë、Lin前往Berat。下方舊方案保留比較；實際9/20–23住宿、車程與導覽以新段為準。</p><a class="map" target="_blank" rel="noopener" href="https://rogeryangct.github.io/travel-itineraries/#trip/albania-second-2026/al20">前往9/20–23完整行程</a></section><section id="mk-weather-plan-20260918"><h2>天氣調整版｜9/18–9/20</h2><p>方案B：9/18 Matka＋堡壘＋Kaneo黃昏；9/19上午南岸、下午老城室內；9/20由Qafë Thanë北線出境，經Lin至Berat。原方案A完整保留，兩版擇一使用，避免重複排入景點。</p><p>每個景點下方「導覽」收錄看點、歷史背景與相關故事。時間均為當地時間；船班、臨時開放與私人停車依當天現場。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>主線</th><th>住宿</th></tr></thead><tbody><tr><td>9/18（五）</td><td>Matka → Tetovo短停 → 堡壘 → Plaošnik → Kaneo</td><td>RUPE Apartments，第1晚</td></tr><tr><td>9/19（六）</td><td>Bay of Bones → Trpejca → St. Naum → Ohrid老城</td><td>RUPE Apartments，第2晚</td></tr><tr><td>9/20（日）</td><td>Struga → Qafë Thanë → Lin選配 → Berat</td><td>Apartment Geart</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://rogeryangct.github.io/travel-itineraries/#trip/north-macedonia-2026/mk18-weather-b">9/18｜直接看方案B</a><a class="map" target="_blank" rel="noopener" href="https://rogeryangct.github.io/travel-itineraries/#trip/north-macedonia-2026/mk19-weather-b">9/19｜直接看方案B</a><a class="map" target="_blank" rel="noopener" href="https://rogeryangct.github.io/travel-itineraries/#trip/north-macedonia-2026/mk20-weather-b">9/20｜直接看方案B</a></section><section id="mk-stays"><h2>原方案A｜住宿與動線</h2><p>9/17–9/20 北馬其頓完整新版；所有時間均為當地時間（CEST／UTC+2）。住宿共3晚，Ohrid僅2晚。Google Maps為景點搜尋，住宿停車依房東定位。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>住宿</th><th>當日主線</th></tr></thead><tbody><tr><td>9/17（四）</td><td>SKP-091 a&amp;b｜Skopje</td><td>Prizren直達、Skopje步行半日</td></tr><tr><td>9/18（五）</td><td>RUPE Apartments｜Ohrid</td><td>Matka、Tetovo、Ohrid湖岸</td></tr><tr><td>9/19（六）</td><td>RUPE Apartments｜Ohrid</td><td>老城、文化古蹟、Kaneo日落</td></tr><tr><td>9/20（日）</td><td>接續Apartment Geart｜Berat，定位待確認</td><td>退房、南岸、St. Naum、跨境Albania</td></tr></tbody></table></div></section><section id="mk-practical"><h2>出發前只確認這幾項</h2><p>車輛：北馬其頓與阿爾巴尼亞跨境許可、有效保險。住宿：停車入口與入住定位。現金：準備MKD支付門票、船程與零星停車，勿預設各處收歐元。</p><p>AMSM 9/14 12:00道路公告仍列A2 Kičevo–Ohrid施工改道；9/18預留抵達彈性。9/10公布的一站式邊境協議仍屬推進程序，不代表旅遊當天已啟用快速通關。</p><a class="map" target="_blank" rel="noopener" href="https://amsm.mk/sostojba-na-patishta/">AMSM 即時道路</a></section><section id="mk-weather"><h2>原方案A｜9/15天氣資料（歷史快照）</h2><p>9/15查核取得的Meteoblue資料含快取：Skopje頁約9/11、Ohrid頁約9/14，不是當下逐時實況。出發當晨再開下方連結查看降雨、陣風與雷暴。</p><p>目前資料傾向Skopje 9/17約14–28°C；Ohrid 9/18–19約15–27°C、9/20約16–24°C，後段降雨機率增加。船程仍由當日天氣與業者決定。</p><p>9/17–19日落規劃約18:40–18:45，山地遮擋可能更早；藍調抓日落後約20分鐘，不排到19:30才拍。</p><a class="map" target="_blank" rel="noopener" href="https://www.meteoblue.com/en/weather/week/skopje_north-macedonia_785842">Meteoblue｜Skopje</a><a class="map" target="_blank" rel="noopener" href="https://www.meteoblue.com/en/weather/14-days/ohrid_north-macedonia_787487">Meteoblue｜Ohrid</a></section><section id="mk-events"><h2>日期內活動｜選配</h2><p>Manaki Brothers電影節已正式公布：9/19–25，Bitola。與本次Ohrid完整日及跨境日重疊，本表不繞路。</p><p>9/17 20:00，Skopje Mala Stanica「Between Worlds／Меѓу светови」展覽開幕有9/10新聞公告；尚未取得可交叉確認的官方活動頁。想參加先向場館確認，以它替代晚餐後夜景。Ohrid未查得日期與年份一致、可確認的9/18–20晚間演出。</p><a class="map" target="_blank" rel="noopener" href="https://manaki.com.mk/">Manaki 官方日程</a><a class="map" target="_blank" rel="noopener" href="https://denesmagazin.mk/izlozhba-megu-svetovi-na-voskresija-andreevska-vo-natsionalna-galerija/">展覽新聞公告（待場館確認）</a></section><section class="day" id="mk17"><span class="tag">2026-09-17</span><h2>Prizren → Skopje｜河流兩岸的首都</h2><p>住宿 SKP-091 a&amp;b，1 晚。08:30 出發，13:00–14:00 抵達為目標；車程、邊境與停車合計保留約 5 小時。</p><div class="slot" id="mk17-1"><div class="time">08:00–08:30</div><div><h3>早餐、退房與文件</h3><p>從 Skyline Serenity Apartment 出發。備妥護照、車籍、租車合約、北馬其頓與阿爾巴尼亞跨境授權及有效車險；行李置於遮蔽處。</p></div></div><div class="slot" id="mk17-2"><div class="time">08:30–13:00</div><div><h3>R7 → R6 → Hani i Elezit／Blace → Skopje</h3><p>不進 Pristina。Kaçanik 附近視需要休息15–20分鐘；邊境至少保留1小時彈性。</p><p><b>交通：</b>導航先設定 Blace 關口，再接住宿；依現場道路標誌行駛。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Blace%20border%20crossing%20North%20Macedonia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://amsm.mk/sostojba-na-patishta/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mk17-2">導覽</a></div></div><div class="slot" id="mk17-3"><div class="time">13:00–14:00</div><div><h3>SKP-091 a&amp;b｜停車、入住與午餐</h3><p>住宿地址依訂房資料：Dimitrie Chupovski 23。提前取得停車入口、費用及取鑰匙方式；未到入住時間先寄放行李。午餐選附近 burek＋優格或沙拉、湯。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Dimitrie%20Chupovski%2023%20Skopje" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>9/17 入住、9/18 退房；提早停車與寄物待房東確認。</p></div></div><div class="slot" id="mk17-4"><div class="time">14:00–14:40</div><div><h3>Mother Teresa Memorial House</h3><p>參觀家庭照片、個人物件與小教堂。官方頁列平日09:00–20:00、免費；預留40分鐘。</p><p><b>費用：</b>官方公布免費入場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mother%20Teresa%20Memorial%20House%20Skopje" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://motherteresa.mk/memorial-house/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mk17-4">導覽</a></div></div><div class="slot" id="mk17-5"><div class="time">14:40–15:30</div><div><h3>Macedonia Street → Macedonia Square → Stone Bridge</h3><p>沿步行街到廣場，再跨石橋進老巴扎。拍雕像、噴泉與不同年代建築同框。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Macedonia%20Square%20Skopje" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk17-5">導覽</a></div></div><div class="slot" id="mk17-6"><div class="time">15:30–16:40</div><div><h3>Old Bazaar｜Daut Pasha → Kapan Han → Čifte Hamam</h3><p>走浴場、商旅驛站與 Bezisten 周邊巷弄。想看展可擇一入館30分鐘，相應縮短逛街。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Daut%20Pasha%20Hamam%20Skopje" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nationalgallery.mk/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mk17-6">導覽</a></div></div><div class="slot" id="mk17-7"><div class="time">16:40–17:05</div><div><h3>Mustafa Pasha Mosque</h3><p>參觀庭院；非禮拜時段且獲同意再入內。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mustafa%20Pasha%20Mosque%20Skopje" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk17-7">導覽</a></div></div><div class="slot" id="mk17-8"><div class="time">17:10–17:40</div><div><h3>Kale Fortress｜可刪</h3><p>提前看城牆與城市全景；未能入內就直接回河岸，不等待晚間開門。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Skopje%20Fortress" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk17-8">導覽</a></div></div><div class="slot" id="mk17-9"><div class="time">18:00–19:10</div><div><h3>Stone Bridge 河岸黃昏</h3><p>日落約18:40–18:45；18:00起拍暖光，日落後約20分鐘拍倒影與亮燈。遠山與雲層會影響實際見到太陽的時間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Stone%20Bridge%20Skopje" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="mk17-10"><div class="time">19:15–20:45</div><div><h3>Old Bazaar 晚餐與返程</h3><p>共享 tavče gravče、kebapi、shopska salad、ajvar 或烤甜椒。晚餐後沿石橋走回住宿，備好隔天早餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Old%20Bazaar%20Skopje" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk17-10">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>縮短河岸散步，改進紀念館或美術館；清真寺以現場接待安排為準。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪 Kale，再縮短巴扎支巷。保留紀念館、廣場、石橋與晚餐；抵達晚於15:00，整段順延並取消堡壘。</p></div></section><section class="day" id="mk18"><span class="tag">2026-09-18</span><h2>Matka → Tetovo → Ohrid｜峽谷與彩繪清真寺</h2><p>方案B為9/18新增的天氣調整版，原方案A完整保留。以下原日程摘要屬方案A：住宿 RUPE Apartments，第1晚。07:45離開Skopje；Matka限時，Tetovo午前短訪，16:00–17:00抵達Ohrid。</p><nav><a href="#mk18-original-a">方案 A｜原行程</a><a href="#mk18-weather-b">方案 B｜天氣調整版</a></nav><section class="soft" id="mk18-weather-b"><h3>方案 B｜天氣調整版</h3><h3>9/18 路線與住宿</h3><p>Skopje → Matka → Tetovo → RUPE Apartments → Samuel’s Fortress → Plaošnik → Kaneo。住宿：RUPE Apartments，第1晚。上午活動限時，下午以15:30前到堡壘、17:50前到Kaneo上方小徑為目標。</p><p>這是以9/18天氣較佳為前提的調整方案；9/19不視為整天雨。使用者提供的Meteoblue日照約9／5／3小時僅作重排依據，本次取得的頁面有快取，未當作最新逐時預報。雷雨、風浪與船班仍看當晨實況。</p><a class="map" target="_blank" rel="noopener" href="https://www.meteoblue.com/en/weather/week/ohrid_north-macedonia_787487">Meteoblue｜Ohrid</a><a class="map" target="_blank" rel="noopener" href="https://amsm.mk/sostojba-na-patishta/">AMSM｜道路公告</a><h3>07:45–08:20｜Skopje → Matka</h3><p>早餐先吃完，07:45離開。車程先抓35–45分鐘，抵達後另留停車與步行時間；若08:20仍在停車，縮短湖邊停留。導航走一般入口道路，不走Jasen限時山路。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Canyon%20Matka">Google Maps｜Canyon Matka</a><h3>08:20–10:00｜Matka：船程優先、短走湖岸</h3><p>到碼頭先問Vrelo洞穴船是否可立即出發、是否含進洞，以及確切回程時間。只搭09:40前回碼頭的班次；不合就改湖岸步道與St. Andrew。10:00以開車離開為目標。</p><p>費用：私人船班現場報價，問清楚每人或整船、往返及進洞是否包含；不預設能刷卡。不排長步道或正式用餐。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Vrelo%20Cave%20Matka">Google Maps｜Vrelo Cave Matka</a><details><summary>導覽</summary><p>地景導讀｜Treska河切入石灰岩形成峽谷，水壩又將河段變成人工湖。船上看垂直裂隙、岩縫灌木與湖面，便能分辨自然侵蝕和近代水利工程各自留下的形狀。</p><p>洞穴怎麼看｜含碳酸鈣的水滴長期沉積成鐘乳石與石筍。Vrelo包含水下洞穴系統，遊船參觀的是可進入的洞室，並非潛入深處；不以未證實的世界深度排名介紹它。</p><p>St. Andrew｜小教堂創建於14世紀末，與貴族Andrijaš相關。若開放，留意壁畫如何依禮拜空間安排：高處的神聖秩序、牆面的聖經敘事、靠近人眼高度的聖人。</p><p>現場提醒｜雷雨或強風取消船程；濕滑步道只走安全短段。不觸摸洞穴沉積，不在狹窄步道阻擋往來。</p></details><h3>10:00–10:50｜Matka → Tetovo</h3><p>含市區交通與找停車，抓50–60分鐘；若延誤，清真寺縮成外觀短停。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Painted%20Mosque%20Tetovo">Google Maps｜Painted Mosque Tetovo</a><h3>10:50–11:20｜Šarena Džamija 彩繪清真寺</h3><p>最多30分鐘。9/18是星期五，若正在準備主麻禮拜或信徒集中進入，只看外牆與庭院，不等禮拜結束。門票或捐獻依現場告示。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Painted%20Mosque%20Tetovo">Google Maps｜Painted Mosque Tetovo</a><details><summary>導覽</summary><p>建築看點｜外牆像一面面裝裱畫作，花束、藤蔓、幾何框線與風景畫層層排列；入內可找麥加聖地圖像。它的特色是彩繪表面，與常見大圓頂、石材主導的帝國清真寺不同。</p><p>歷史與人物｜原寺傳統上追溯至1438年，與兩位女性Hurside、Mensure的捐助相關；今日主要裝飾來自19世紀Abdurrahman Pasha主持的重建。宗教基金waqf讓捐助者支持公共宗教與慈善設施，女性也能成為地方公共建築的贊助人。</p><p>看懂Tetovo｜城市位於Šar山麓的Polog盆地，阿爾巴尼亞語與馬其頓語、伊斯蘭文化與日常商業交織。脫鞋、遮肩過膝；拍攝先詢問，不對禮拜者拍特寫。</p></details><h3>11:20–11:40｜外帶午餐</h3><p>買burek＋優格或qebapi外帶，補水後出發。若Matka已延誤超過30分鐘，Tetovo改15分鐘外觀，午餐仍以外帶為主。 9/18查閱的AMSM最新公告為9/17 18:00：當時道路乾燥、交通正常；A2 Kičevo–Ohrid仍列多段施工改道。</p><h3>11:40–14:30／15:00｜Tetovo → Ohrid</h3><p>走Gostivar → Kičevo → Ohrid，含短休息抓約3小時，施工或塞車另加緩衝；14:10僅屬順暢時的可能抵達時間。A2沿線按施工標誌行駛，不追趕導航時間。</p><p>先到既訂住宿停車、放行李，採買與洗衣留晚上。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=RUPE%20Apartments%20Ohrid">Google Maps｜RUPE Apartments Ohrid</a><a class="map" target="_blank" rel="noopener" href="https://amsm.mk/sostojba-na-patishta/">AMSM｜A2路況</a><h3>14:40–15:05｜步行上城堡</h3><p>停好車後經老城往Upper Gate／古劇場方向上坡，預留30–40分鐘。不把步行上坡、找入口算成零時間。</p><p>若15:00才辦完入住，直接往堡壘，Plaošnik縮短；若無法15:45前到堡壘入口，取消入場，改外圍景觀後前往Kaneo。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Upper%20Gate%20Ohrid">Google Maps｜Upper Gate Ohrid</a><h3>15:05–15:50｜Samuel’s Fortress</h3><p>官方夏季09:00–16:30、週一休；最晚售票時間未列明，不壓關門才到。沿城牆看湖面與紅瓦，預留45分鐘。票價以窗口MKD標示為準。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Samuel%20Fortress%20Ohrid">Google Maps｜Samuel Fortress Ohrid</a><a class="map" target="_blank" rel="noopener" href="https://muzejohrid.mk/samoilova-tvrdina/">官方時段</a><details><summary>導覽</summary><p>現場看點｜先用城牆作前景拍湖，再看老城屋頂與Galičica山勢。這座高地讓人理解：城堡控制的是聚落、湖面和山口之間的交通，而不只是守住單一建築。</p><p>歷史背景｜城址在古代Lychnidos時期已有防禦設施，現名與10–11世紀Samuil的統治相關。此後不同政權反覆拆修，今日城垛也包含現代修復，不能把每塊石頭都當作同一年代。</p><p>小故事｜Upper Gate附近可見古代建材被後世再利用的城市傳統：舊建築的石材、碑刻常進入新的城防。這種再用讓Ohrid的歷史不是整齊分層，而是嵌在同一面牆裡。</p><p>實用提醒｜雨後石階滑、城牆曝曬；戴帽補水。堡壘關門不影響公共小徑上的Kaneo黃昏。</p></details><h3>15:55–16:30｜Plaošnik／St. Clement and Panteleimon</h3><p>順坡往下，參觀教堂與可開放考古區。今天抓35分鐘；遺址若提早關閉，外觀與湖景短停後續走。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Plaosnik%20Ohrid">Google Maps｜Plaosnik Ohrid</a><a class="map" target="_blank" rel="noopener" href="https://muzejohrid.mk/plaoshnik/">官方遺址導讀</a><details><summary>導覽</summary><p>現場看點｜把眼前分成三層：早期基督教遺址、中世紀宗教活動的位置，以及現代重建教堂。馬賽克若開放，再看幾何、植物與動物紋樣；不要越過考古保護線。</p><p>文字與信仰｜Clement是Cyril、Methodius的門生，在Ohrid推動斯拉夫語教育、翻譯與神職培養。讓人用能理解的語言讀經與受教育，使這座湖城成為知識傳播中心。</p><p>常見誤解｜Cyril與Methodius所創的是格拉哥里字母；早期西里爾字母與其門生及其他學術中心的發展相關，不能說成「Cyril在Ohrid創造西里爾字母」。所謂Ohrid學校也是教育網絡，並非現代學位制大學。</p></details><h3>16:35–17:45｜Kaneo教堂 → 湖岸休息</h3><p>先看教堂及低處岩岬角度，再到Kaneo Beach附近喝水、休息；17:40左右回到教堂後方上坡，不在烈日下原地等兩小時。教堂內部依開放與票務安排。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20Saint%20John%20at%20Kaneo">Google Maps｜Church of Saint John at Kaneo</a><details><summary>導覽</summary><p>建築看點｜小教堂以紅瓦、磚石交替、中央鼓座與圓頂形成清楚輪廓。先近看門窗與砌築，再退到高處看建築如何嵌在湖上岩岬。</p><p>歷史背景｜教堂獻給神學家聖約翰，通常推測為13世紀左右，確切建造年代仍不明。它的代表性主要來自拜占庭式建築與湖岸位置的結合。</p><p>攝影提醒｜教堂門口適合建築細節；經典「紅瓦教堂＋整片湖」要到後上方的小徑。別把教堂平台的搜尋圖釘當成唯一觀景位置，也別為取景跨護欄。</p></details><h3>17:50–19:10｜Kaneo後上方小徑：經典黃昏</h3><p>17:50–18:15拍藍湖與教堂；18:15起觀察暖光，約18:40前後等待夕陽；日落後留到19:05左右看餘暉，再離開。各太陽時間來源相差數分鐘，以18:40–18:45為規劃窗口；山脈可能更早遮住太陽，雲層也不保證出現粉紅或紫色。</p><p>使用者提供的41.11083, 20.78861保留為近似攝影參考，未核實精確站點或通行狀況。到場以教堂後方合法小徑尋找構圖；不是停車位。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Kaneo%20Viewpoint%20Ohrid">Google Maps｜Kaneo Viewpoint</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.11083%2C20.78861">近似攝影參考｜41.11083, 20.78861</a><details><summary>導覽</summary><p>構圖方法｜先用1×鏡頭交代教堂與湖面，再以較長焦段壓縮紅瓦與遠山；把教堂放在畫面下方或側邊，保留湖面的空間感。手機高光稍微壓低，可減少天空過曝。</p><p>日落不一定同框｜經典教堂角度與太陽落山方向不完全一致。可分別拍「教堂＋湖」和「西岸山線＋夕陽」，不用為了把太陽塞入畫面而離開安全小徑。</p><p>光線判斷｜遠山遮陽後，教堂可能先進陰影，天空仍明亮；此時等待雲層餘暉或湖色變化，比持續追逐太陽更適合此地。</p></details><h3>19:10–20:00｜返回老城；20:00後晚餐</h3><p>優先走照明較好的老城街道回Saraiste／市中心。Potpesh木棧道只在乾燥、開放且照明足夠時走；天黑、浪濺或濕滑就改街道，不為串完路線冒險。</p><p>晚餐共享gjomleze、makalo、烤蔬菜或豆鍋；超市若已關門，先買翌日早餐與水，其餘再補。Ohrid魚類選來源清楚的合法供應。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Saraiste%20Beach%20Ohrid">Google Maps｜Saraiste Beach Ohrid</a><h3>延誤與天候處理</h3><p>優先保留Kaneo黃昏；堡壘受16:30關門限制。上午先刪Matka等船與Tetovo停留，下午依抵達時間縮短Plaošnik或取消堡壘，不加速趕路。若雷暴接近，取消城牆、湖船與暴露觀景點，改室內。</p></section><h3 id="mk18-original-a">方案 A｜原行程（保留）</h3><div class="slot" id="mk18-1"><div class="time">07:15–08:20</div><div><h3>早餐、退房 → Matka</h3><p>07:45出發，行車約35–45分鐘另加停車與步行。導航走一般通往Matka入口的道路。</p><p><b>交通：</b>不使用穿越 Jasen 的限時山路捷徑。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Canyon%20Matka" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="mk18-2"><div class="time">08:20–09:00</div><div><h3>Matka 湖邊步道與 St. Andrew</h3><p>從入口沿湖走到修道院／餐廳區。拍岩壁、湖面與小教堂；留意狹窄步道。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Saint%20Andrew%20Monastery%20Matka" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk18-2">導覽</a></div></div><div class="slot" id="mk18-3"><div class="time">09:00–10:15</div><div><h3>Vrelo Cave 船程｜視班次</h3><p>先確認含進洞、往返時間與票價；只搭能在10:15前回碼頭的船。09:15仍無合適班次就取消，改湖邊短走。</p><p><b>費用：</b>兩人船程與咖啡先抓€20–35，並非確認報價。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Vrelo%20Cave%20Matka" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk18-3">導覽</a></div></div><div class="slot" id="mk18-4"><div class="time">10:15–11:15</div><div><h3>Matka → Tetovo</h3><p>回到停車處即出發；含市區交通與找停車保留約1小時。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Painted%20Mosque%20Tetovo" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="mk18-5"><div class="time">11:15–11:50</div><div><h3>Šarena Džamija｜Painted Mosque</h3><p>優先午前參觀；9/18是星期五，若已準備禮拜就只看外牆，不等13:30再返回。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Painted%20Mosque%20Tetovo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk18-5">導覽</a></div></div><div class="slot" id="mk18-6"><div class="time">12:00–12:45</div><div><h3>Tetovo 午餐</h3><p>選 burek＋優格、豆鍋或兩人分一份 Šarska pleskavica。下午仍有山路，不吃過量。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Tetovo%20North%20Macedonia" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="mk18-7"><div class="time">12:45–16:30</div><div><h3>Tetovo → Gostivar → Kičevo → Ohrid</h3><p>途中休息、加油15分鐘。A2 Kičevo–Ohrid仍有施工改道，保留至17:00的抵達彈性；不加Mavrovo或Bitola。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kicevo%20North%20Macedonia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://amsm.mk/sostojba-na-patishta/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mk18-7">導覽</a></div></div><div class="slot" id="mk18-8"><div class="time">16:30–17:30</div><div><h3>RUPE Apartments｜入住、停車與補給</h3><p>9/18–20共兩晚。依訂房資料有廚房與私人停車，入口及取鑰匙以房東定位為準。買水、雞蛋、麵包、優格、水果與白乳酪；入住後到9/20不必移車。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=RUPE%20Apartments%20Ohrid" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>9/18 入住、9/20 退房；停車入口尚需房東確認。</p></div></div><div class="slot" id="mk18-9"><div class="time">17:30–19:10</div><div><h3>Ohrid Port → Saraiste 湖岸夕陽</h3><p>首晚只走平緩湖岸。18:00–18:40拍港口與湖面，約18:40–18:45日落，接著拍20分鐘藍調。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ohrid%20Port" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk18-9">導覽</a></div></div><div class="slot" id="mk18-10"><div class="time">19:15–20:30</div><div><h3>Ohrid 晚餐</h3><p>可試 gjomleze 層烤麵餅、makalo 蒜醬、烤蔬菜與豆鍋。魚類選來源清楚的合法供應；飯後走Old Bazaar再回住宿。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Old%20Bazaar%20Ohrid" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>雷雨、強風或業者停航即取消船程；步道濕滑只走入口。Tetovo仍可停，但尊重週五禮拜。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Matka咖啡與船程，再將Tetovo改為外觀短停；不等待到午后重新入寺。保留Ohrid入住與休息。</p></div></section><section class="day" id="mk19"><span class="tag">2026-09-19</span><h2>Ohrid｜世界遺產老城與 Kaneo</h2><p>方案B為9/18新增的天氣調整版，原方案A完整保留。以下原日程摘要屬方案A：住宿 RUPE Apartments，第2晚。約7–9公里步行，石階多；午后回住宿休息，傍晚再走湖岸。</p><nav><a href="#mk19-original-a">方案 A｜原行程</a><a href="#mk19-weather-b">方案 B｜天氣調整版</a></nav><section class="soft" id="mk19-weather-b"><h3>方案 B｜天氣調整版</h3><h3>9/19 路線與住宿</h3><p>RUPE → Bay of Bones → Trpejca → St. Naum → RUPE／老城。住宿：RUPE Apartments，第2晚。南岸安排上午，下午以教堂、住宅博物館與手工展示為主；不必再追Kaneo日落。</p><h3>08:15–09:00｜出發與Bay of Bones候開</h3><p>沿湖東岸南下，08:50左右抵達，09:00開館後入內。預留停車及入口步行，不在湖岸彎道臨停。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Bay%20of%20Bones%20Museum%20Ohrid">Google Maps｜Bay of Bones Museum Ohrid</a><h3>09:00–09:40｜Bay of Bones Museum</h3><p>官方夏季時段09:00–16:30、週一休；不採草稿中的15:30關門說法。看岸上展品與湖上重建聚落，約40分鐘。票價現場確認。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Bay%20of%20Bones%20Museum%20Ohrid">Google Maps｜Bay of Bones Museum Ohrid</a><a class="map" target="_blank" rel="noopener" href="https://muzejohrid.mk/muzej-na-voda/">官方開放資訊</a><details><summary>導覽</summary><p>真正的遺跡在哪裡｜水下木樁、陶器、工具與動植物遺留提供史前生活證據；湖上房屋是現代考古展示性重建，並非保存至今的原始木屋。</p><p>歷史背景｜遺址屬晚期青銅至早期鐵器時代。湖岸居民可利用漁撈、舟行、農耕與牲畜資源；樁上建築的選擇涉及水位、交通與生活方式，不宜只解釋為躲避野獸。</p><p>現場看點｜站在平台比較水深、岸線與房屋尺度，再看工具和陶器如何補充重建屋舍的想像。木平台遇水較滑，雷雨時別在湖上逗留。</p></details><h3>09:55–10:30｜Trpejca漁村</h3><p>先找安全可停處看村落全景，再下湖岸；含停車與步行只有35分鐘，時間不夠就只選一處。路肩狹窄或找不到合法車位時直接略過。</p><p>40.95483, 20.81219是使用者提供的近似攝影座標，未確認為公共觀景台或停車場，不直接導航車輛駛入小路。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Trpejca%20Ohrid">Google Maps｜Trpejca Ohrid</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.95483%2C20.81219">近似攝影參考｜非已確認停車位</a><details><summary>導覽</summary><p>地景看點｜Galičica山坡幾乎直落湖邊，住宅沿陡坡排列，湖岸形成狹小的生活和船隻停靠空間。高處適合看聚落形狀，湖邊適合看石灘、船與住宅尺度。</p><p>生活故事｜原本以漁業等生計為主的小村，逐漸加入家庭旅館與餐飲。觀察陽台、船隻和餐桌如何共享有限岸線，就能看見生計轉型留下的痕跡。</p></details><h3>10:45–11:30｜St. Naum修道院</h3><p>先參觀教堂、墓室與湖景，保持安靜；內部票務與攝影依現場。這是南岸文化主點，時間不足時先刪Trpejca。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Monastery%20Saint%20Naum">Google Maps｜Monastery Saint Naum</a><details><summary>導覽</summary><p>人物與歷史｜Naum與Clement同屬Cyril、Methodius的教育傳統，推動斯拉夫語宗教文化。修道院傳統上約於905年建立，Naum也葬於此；今日教堂、裝飾歷經後世修建。</p><p>心跳傳說｜信徒相信在墓室可聽見聖人的心跳。這是朝聖傳統的一部分，參觀時安靜觀察，不敲打墓室或大聲測試聲音，也不把傳說當成經證實的物理現象。</p><p>現場看點｜從湖面、泉水與山地的交會理解選址，再看教堂與墓室的禮拜功能。孔雀是此地熟悉的景象，但不要追逐、餵食或逼近自拍。</p></details><h3>11:30–12:15｜St. Naum泉水小船</h3><p>先問出發、返回時間及整船或每人計價；船程約30–45分鐘。雷雨、強風或停航就取消，不等待下一輪；改可安全通行的短步道。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Saint%20Naum%20Springs">Google Maps｜Saint Naum Springs</a><details><summary>導覽</summary><p>水文導覽｜部分Prespa湖水經喀斯特地下通道進入Ohrid湖區，在南端泉水帶湧出。清澈泉池可見水草、倒木與湧流造成的局部擾動。</p><p>流入和流出別混淆｜St. Naum泉水是注入Ohrid湖的水源；黑德林河從湖泊北端Struga流出。旅遊用語「Black Drim Springs」不代表這裡是湖泊出水口。</p><p>船上看點｜看水下植物的層次與岸邊蘆葦，而非只拍透明水面。勿餵魚鳥、不把手伸入泉眼或踩入濕地。</p></details><h3>12:15–14:00｜午餐 → 沿東岸回Ohrid</h3><p>簡餐到13:00，回城抓約1小時另留停車彈性。若午後雷雨提早接近，取消船程或縮短午餐，提早回城。回到RUPE喝水、換乾衣，至少休息20分鐘。</p><h3>14:30–15:15｜Church of Saint Sophia</h3><p>參觀壁畫與中世紀大教堂空間；若臨時關閉，與Robev House對調。室內開放與攝影依現場，不把雨天視為保證開門。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20Saint%20Sophia%20Ohrid">Google Maps｜Church of Saint Sophia Ohrid</a><details><summary>導覽</summary><p>名字的意思｜Sophia在此意為「神聖智慧」，不是一位叫Sophia的女性聖人。這座教堂曾是Ohrid大主教座堂，反映湖城在拜占庭宗教世界的地位。</p><p>壁畫怎麼看｜先讓眼睛適應昏暗，再看祭壇周圍的教父、主教人物和敘事場景。人物的正面性、嚴肅表情和衣褶，用來建立禮拜秩序，不是追求現代肖像式寫實。</p><p>歷史轉折｜鄂圖曼時期曾改作清真寺，壁畫部分遭覆蓋，後來重新發現與修復。如今看到的是不同用途與保存歷程共同形成的空間。禁止觸摸壁畫，不開閃光燈。</p></details><h3>15:20–16:00｜Robev House</h3><p>看住宅、木作與博物館收藏。官方夏季兩班涵蓋09:00–20:00、週一休；仍以當天售票處為準。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Robev%20Family%20House%20Ohrid">Google Maps｜Robev Family House Ohrid</a><a class="map" target="_blank" rel="noopener" href="https://muzejohrid.mk/">Ohrid Museum｜館舍資訊</a><details><summary>導覽</summary><p>住屋如何回應地形｜看厚實底層、向外挑出的上層、窗列與木構。狹窄街道用較小地面面積支撐更大的上層生活空間，是晚期鄂圖曼城市住宅的重要特徵。</p><p>家族故事｜Robev家族經商致富，現有住宅是在1861年火災後重建，原為家族成員共享而分區的居所。雕花木天花板、接待空間與展示藏品呈現富商家庭的資源和品味。</p><p>參觀提醒｜博物館收藏不全是原住戶留下的家具；閱讀標籤區分家族生活、地區考古與後來的博物館展示。</p></details><h3>16:05–16:30｜Handmade Paper Workshop</h3><p>觀看造紙與印刷示範；若未開或無示範就略過，不等待。購物與示範費用先問清楚。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=National%20Workshop%20For%20Handmade%20Paper%20Ohrid">Google Maps｜National Workshop For Handmade Paper Ohrid</a><details><summary>導覽</summary><p>看工藝流程｜植物纖維分散在水中，抄紙網抬起形成濕紙層，再壓水、乾燥。紙張纖維和厚薄差異，會影響墨色與印刷效果。</p><p>與Ohrid的關聯｜這裡適合連結文字、抄寫與知識傳播的主題，但它是現代文化工坊，不能當作從中世紀連續運作至今的原始印刷坊。</p></details><h3>16:30–17:00｜Ancient Theatre｜乾燥才去</h3><p>由湖邊街區往上坡；時間緊或石路濕就取消。若9/18上城堡時已看過，可直接去巴扎。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Ancient%20Theatre%20Ohrid">Google Maps｜Ancient Theatre Ohrid</a><details><summary>導覽</summary><p>歷史背景｜古代Ohrid稱Lychnidos，劇場源於希臘化時期，羅馬時代持續使用並調整用途。它提醒旅客：城市歷史早於中世紀斯拉夫與東正教文化。</p><p>現場看點｜看半圓座位如何利用坡地，從上方想像觀眾與舞台的視線關係。今日仍有表演用途，請尊重搭台、排練與封閉區，不大聲試音。</p></details><h3>17:00後｜Old Bazaar → Chinar → 港口</h3><p>買早餐與補給，湖畔晚餐。若出現晴天空檔可散步拍照，無須再次趕Kaneo。雨勢強就提早回RUPE整理行李。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Chinar%20Tree%20Ohrid">Google Maps｜Chinar Tree Ohrid</a><details><summary>導覽</summary><p>市集與大樹｜懸鈴木提供樹蔭，也是傳統聚會、等候與交易的地標。Ohrid巴扎保有麵包店、咖啡館和日常採買，並非只有觀光商店。</p><p>珍珠小知識｜Ohrid pearl通常是珠體加上以魚鱗乳劑製作的塗層，屬地方工藝而非天然珍珠。買前比較來源和品質，不把祖傳配方當成價格保證。</p></details><h3>雨天與刪減順序</h3><p>先刪Trpejca，再取消泉水船；強降雨時南岸縮成可安全抵達的文化景點，必要時整段改室內。午後先刪劇場、再刪工作坊；保留休息，不把戶外船程寫成必須完成。</p></section><h3 id="mk19-original-a">方案 A｜原行程（保留）</h3><div class="slot" id="mk19-1"><div class="time">07:30–08:30</div><div><h3>港口清晨與早餐</h3><p>拍平靜湖面、船隻與城堡輪廓，再吃burek＋優格。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ohrid%20Port" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="mk19-2"><div class="time">08:30–09:10</div><div><h3>Old Bazaar → Chinar Tree</h3><p>看麵包店、市集與珠寶店的早晨。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Chinar%20Tree%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk19-2">導覽</a></div></div><div class="slot" id="mk19-3"><div class="time">09:15–09:50</div><div><h3>Robev House／手工紙工作坊｜二選一</h3><p>主選Robev House看住宅與木雕；想看示範則改手工造紙工作坊。不要兩間都加。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Robev%20Family%20House%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzejohrid.mk/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mk19-3">導覽</a></div></div><div class="slot" id="mk19-4"><div class="time">10:00–10:40</div><div><h3>Church of Saint Sophia</h3><p>慢看壁畫與禮拜空間，室內攝影依規定。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20Saint%20Sophia%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk19-4">導覽</a></div></div><div class="slot" id="mk19-5"><div class="time">10:50–11:20</div><div><h3>Ancient Theatre</h3><p>沿老城上坡到劇場，停20–30分鐘。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ancient%20Theatre%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk19-5">導覽</a></div></div><div class="slot" id="mk19-6"><div class="time">11:30–12:15</div><div><h3>Samuel’s Fortress</h3><p>夏季官方09:00–16:30，週一休；9/19週六可按公布時段安排。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Samuel%20Fortress%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzejohrid.mk/samoilova-tvrdina/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mk19-6">導覽</a></div></div><div class="slot" id="mk19-7"><div class="time">12:25–13:05</div><div><h3>Plaošnik／St. Pantelejmon</h3><p>看教堂、考古區與湖景；馬賽克區依現場開放。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Plaosnik%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk19-7">導覽</a></div></div><div class="slot" id="mk19-8"><div class="time">13:15–15:30</div><div><h3>午餐與回RUPE休息</h3><p>共享主菜、沙拉與makalo；回住宿補水、洗衣、休息。</p></div></div><div class="slot" id="mk19-9"><div class="time">15:45–16:40</div><div><h3>Saraiste → 木棧道 → Potpesh → Kaneo</h3><p>沿湖慢走；木棧道若封閉或風浪大，改走老城街道。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Potpesh%20Beach%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk19-9">導覽</a></div></div><div class="slot" id="mk19-10"><div class="time">16:40–19:05</div><div><h3>St. John at Kaneo｜教堂與日落</h3><p>先拍教堂外觀，再上後方小徑取經典角度。約18:40日落，18:45–19:05拍餘光後下山。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20Saint%20John%20at%20Kaneo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk19-10">導覽</a></div></div><div class="slot" id="mk19-11"><div class="time">19:30–21:00</div><div><h3>Ohrid 最後一晚</h3><p>湖邊晚餐，買隔天早餐與水；確認Albania車險、南端關口路線與Berat房東定位。</p></div></div><div class="soft"><b>雨天備案</b><p>濕滑時取消城牆及木棧道，改Robev House、造紙示範與聖索菲亞；Kaneo可改乾燥的老城街道前往。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>上午先刪造紙工作坊或Robev House二選一，保留聖索菲亞與湖邊；疲勞時縮短堡壘，不刪午休。</p></div></section><section class="day" id="mk20"><span class="tag">2026-09-20</span><h2>Ohrid → Albania｜原方案南岸／天氣版北線</h2><p>方案B為9/18新增的天氣調整版，原方案A完整保留。以下原日程摘要屬方案A：RUPE退房後不回Ohrid。09:00 Bay of Bones開門；12:30前離開St. Naum，保留跨境與前往Berat的下午。</p><nav><a href="#mk20-original-a">方案 A｜原行程</a><a href="#mk20-weather-b">方案 B｜天氣調整版</a></nav><section class="soft" id="mk20-weather-b"><h3>方案 B｜天氣調整版</h3><h3>9/20 北岸離境｜本方案不走St. Naum關口</h3><p>Ohrid → Struga → Kjafasan／Qafë Thanë → Lin → Librazhd → Elbasan → Berat。上午退房，目標14:00–15:30抵達Apartment Geart；邊境、午餐與道路狀況均會影響時間。北馬其頓與Albania當日同為UTC+2，不用調時差。</p><h3>07:30–08:00｜早餐與RUPE退房</h3><p>確認Albania跨境授權、有效車險、油量、房東入住定位與停車方式。08:00出發，不再加Ohrid市區景點。</p><h3>08:00–09:30｜Struga → Qafë Thanë邊境</h3><p>走湖泊北岸經Struga前往Kjafasan／Qafë Thanë；08:45–09:15是順暢時的到關口窗口，不是通關保證。邊境額外保留30–60分鐘，遇排隊直接刪Lin。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Qafe%20Thane%20border%20crossing">Google Maps｜Qafe Thane border crossing</a><details><summary>導覽</summary><p>沿途地理｜Struga位於Ohrid湖北端，黑德林河在此流出；與昨日St. Naum的入湖泉水形成完整的湖泊水文對照。</p><p>跨國湖泊｜國界改變了行政與語言，湖泊本身仍是同一生態系。2019年世界遺產範圍擴展至Albania側，包含Lin半島等自然與文化景觀。</p></details><h3>約09:30–10:20｜Lin｜天氣允許才停</h3><p>乾燥時走村落、湖岸，再視開放與腳程上教堂遺址；整段抓45–60分鐘。下雨縮成20分鐘村內短走，雷雨或大雨直接略過。</p><p>未查得可確認9/20的官方08:00–20:00開放表；馬賽克可能為保護而覆蓋，即使到場也不保證揭露。票價、管理員在場與通行依現場；不踩入保護區。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Lin%20Albania">Google Maps｜Lin Albania</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/99/">UNESCO｜跨國Ohrid湖區</a><details><summary>導覽</summary><p>村落看點｜狹長半島伸入湖中，房屋沿坡面與水邊排列。先從村內觀察生活尺度，再從可通行高處看半島輪廓；濕滑時不勉強爬坡。</p><p>早期基督教遺產｜山丘上的巴西利卡遺址與約6世紀的馬賽克，讓湖區歷史從中世紀教堂再往前延伸。幾何、植物與動物圖案表現晚期古代的裝飾語彙。</p><p>保存比展示更重要｜馬賽克不是永遠裸露的地板。覆蓋和限制踩踏可降低水分、日照與遊客造成的損害；若未展示，仍可由遺址平面與湖景理解教堂的位置。</p></details><h3>約11:15–12:00｜Librazhd午餐</h3><p>只做補給與用餐，不加景點。出關晚時改外帶，後段休息安排在容易停車的地方。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Librazhd%20Albania">Google Maps｜Librazhd Albania</a><h3>12:00–14:00／15:30｜Elbasan → Berat</h3><p>經Elbasan續往Berat，依即時導航選主要可通行道路；不要為縮短公里數改走陌生山路。14:00–14:45可作順暢時目標，另留至15:30的交通與入住緩衝。</p><p>Apartment Geart：先停好車、放行李再散步，入口以房東定位為準。下午不綁定Berat Castle。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Berat%20Albania">Google Maps｜Berat Albania</a><h3>入住後｜King Mosque → Halveti Tekke</h3><p>天氣穩定且尚開放才入內；否則看外觀與周邊街區。兩處合計40–60分鐘，先詢問票務與宗教活動。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=King%20Mosque%20Berat">Google Maps｜King Mosque Berat</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Halveti%20Tekke%20Berat">Google Maps｜Halveti Tekke</a><details><summary>導覽</summary><p>King Mosque｜又稱Sultan’s Mosque／Xhamia Mbret，起源與15世紀末Sultan Bayezid II時代相關，後經改建。看禮拜空間、木作與清真寺在舊城宗教建築群中的位置，而非只找圓頂。</p><p>Halveti Tekke｜Tekke是蘇菲教團的修行與聚會場所，功能不同於一般清真寺。現存建築主要與18世紀後期Ahmet Kurt Pasha相關，入內若開放，可看雕花木天花板、彩繪和門廊。</p><p>如何理解蘇菲｜蘇菲傳統強調內在修行、師承與宗教實踐，並非所有教團都以旋轉舞表現。這裡不預設有儀式表演；不拍正在祈禱或修行的人。</p></details><h3>傍晚｜Mangalem → Gorica Bridge → 河岸</h3><p>乾燥時沿Osumi河散步，從Gorica一側回望Mangalem層疊白牆與窗列。下雨改平坦街道和咖啡館；濕石板時不登城堡。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Gorica%20Bridge%20Berat">Google Maps｜Gorica Bridge Berat</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/569/">UNESCO｜Berat與Gjirokastra</a><details><summary>導覽</summary><p>城市導讀｜Berat位在Osumi河谷，城堡、Mangalem與對岸Gorica構成不同尺度的城市層次。山坡住宅用石造底層、外挑上層與密集窗列回應地形，形成「千窗之城」的印象。</p><p>世界遺產價值｜Berat與Gjirokastra共同列入世界遺產，重要性在保存的城市住宅與長期生活格局，不只是單一漂亮立面。宗教建築與民居並存，也呈現多個社群留下的歷史。</p><p>橋與照片｜Gorica Bridge連接兩岸生活空間，橋體歷經改建；用橋拱、河流與山坡住宅組合，比只拍一排窗更能交代城市地理。城堡留待乾燥時段慢慢走。</p></details><h3>天候與延誤處理</h3><p>Lin是第一個可刪點；邊境排隊或雨勢增強就直接前往Berat。下午文化建築不保證開門，不能作為躲避雷暴的唯一選項；入住休息與一般室內場所可隨時替代。</p></section><h3 id="mk20-original-a">方案 A｜原行程（保留）</h3><div class="slot" id="mk20-1"><div class="time">07:30–08:50</div><div><h3>早餐、退房 → Bay of Bones</h3><p>08:00左右出發，預留湖岸道路與停車；油量至少半箱，行李遮蔽。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bay%20of%20Bones%20Museum%20Ohrid" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="mk20-2"><div class="time">09:00–09:45</div><div><h3>Bay of Bones Museum</h3><p>官方夏季09:00–16:30、週一休。先看展品，再走湖上聚落；不安排08:35入館。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bay%20of%20Bones%20Museum%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzejohrid.mk/muzej-na-voda/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mk20-2">導覽</a></div></div><div class="slot" id="mk20-3"><div class="time">10:00–10:25</div><div><h3>Trpejca｜短停選配</h3><p>村內與湖邊短走；只在合法、安全停車處拍照，不停狹窄彎道路肩。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Trpejca%20Ohrid" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk20-3">導覽</a></div></div><div class="slot" id="mk20-4"><div class="time">10:45–11:30</div><div><h3>St. Naum Monastery</h3><p>參觀修道院、墓室與湖景；避開禮拜中的動線。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Monastery%20Saint%20Naum" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk20-4">導覽</a></div></div><div class="slot" id="mk20-5"><div class="time">11:30–12:30</div><div><h3>泉水小船＋簡單午餐</h3><p>僅搭能及時返回的短程船，約30分鐘；班次不合就取消，改外帶午餐。12:30離開。</p><p><b>費用：</b>船程＋簡餐兩人先抓€20–35；依當天報價。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Saint%20Naum%20Springs" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mk20-5">導覽</a></div></div><div class="slot" id="mk20-6"><div class="time">12:30–18:30</div><div><h3>Sveti Naum／Tushemisht → Pogradec → Berat</h3><p>依先前訂房紀錄，Apartment Geart接續城市為Berat；完整定位仍以房東提供為準。經南端關口進Albania，沿Pogradec、Librazhd／Elbasan、Lushnjë方向走主要道路。抵達先抓17:30–18:30，不作保證。</p><p><b>交通：</b>導航加入Pogradec與Elbasan途經點，避免自動改走山區捷徑。若南端關口不通或租車公司指定，才改北返Qafë Thanë，並刪南岸選配以補時間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Tushemisht%20border%20crossing%20Albania" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>下雨取消Trpejca停留與泉水船，保留可開放的博物館、修道院；提早跨境。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Trpejca，再刪船程與正式午餐。12:30仍是離開St. Naum的目標，當晚Berat抵達時間依關口和房東定位更新。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>Skopje餐飲</td><td>€30–45</td><td>兩人</td><td>規劃預留，非確認售價</td></tr><tr><td>Matka船／咖啡</td><td>€20–35</td><td>兩人</td><td>規劃預留，非確認售價</td></tr><tr><td>Tetovo午餐</td><td>€15–25</td><td>兩人</td><td>規劃預留，非確認售價</td></tr><tr><td>Ohrid與南岸景點門票</td><td>€25–45</td><td>兩人</td><td>規劃預留，非確認售價</td></tr><tr><td>Ohrid兩晚餐飲</td><td>€55–90</td><td>兩人</td><td>規劃預留，非確認售價</td></tr><tr><td>St. Naum船與簡餐</td><td>€20–35</td><td>兩人</td><td>規劃預留，非確認售價</td></tr><tr><td>超市補給</td><td>€20–30</td><td>兩人</td><td>規劃預留，非確認售價</td></tr><tr><td>公路費、停車與小額支付</td><td>1,500–2,000 MKD</td><td>兩人</td><td>規劃預留，非確認售價</td></tr></tbody></table></div><p>餐飲、活動與門票合計約€185–305，另留1,500–2,000 MKD；不含住宿、油費及Albania段開銷。船程與教堂各自計價，未確認一票通用。 天氣方案B將南岸改為Ohrid往返，另計增加的油費與停車；Lin及Berat入場費未納入原預算。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-mk17-2"><summary>R7 → R6 → Hani i Elezit／Blace → Skopje｜導覽</summary><h3>現場看什麼</h3><p>留意山谷由狹窄交通走廊轉為 Skopje 盆地。</p><h3>歷史背景</h3><p>Kaçanik 與 Vardar 河谷連接 Kosovo 盆地和南方巴爾幹，公路、鐵路與聚落集中在可通行的谷地。</p><h3>實用提醒</h3><p>AMSM 的邊境資訊是當下快照，不能當成抵達當天的等待時間。</p><a class="guide-return" href="#mk17-2">回到行程</a></details><details class="guide-card" id="guide-mk17-4"><summary>Mother Teresa Memorial House｜導覽</summary><h3>現場看什麼</h3><p>先看她在 Skopje 的家庭背景，再看慈善工作與小教堂。</p><h3>歷史背景</h3><p>1910年出生於 Skopje 的德蕾莎修女來自阿爾巴尼亞天主教家庭。現館於2009年開放，位於舊受洗教堂所在地，並非她的出生住宅。</p><h3>實用提醒</h3><p>室內攝影與臨時活動依現場規定。</p><a class="guide-return" href="#mk17-4">回到行程</a></details><details class="guide-card" id="guide-mk17-5"><summary>Macedonia Street → Macedonia Square → Stone Bridge｜導覽</summary><h3>現場看什麼</h3><p>南岸看巨型雕像與新古典立面；跨橋後看小尺度店面、清真寺與巷道。</p><h3>歷史背景</h3><p>1963年地震後，Skopje 在國際協助下重建，丹下健三參與規劃。2010年代 Skopje 2014 計畫又加入雕像和仿古立面，與南斯拉夫現代主義並存。石橋連接現代中心與鄂圖曼巴扎。</p><h3>實用提醒</h3><p>河流兩岸是文化觀察線索，並非截然分隔的族群邊界。</p><a class="guide-return" href="#mk17-5">回到行程</a></details><details class="guide-card" id="guide-mk17-6"><summary>Old Bazaar｜Daut Pasha → Kapan Han → Čifte Hamam｜導覽</summary><h3>現場看什麼</h3><p>Hamam 看多圓頂與採光孔；Kapan Han 看中庭、連續房間與二樓廊道。</p><h3>歷史背景</h3><p>Çarşı 是市集街區；han 結合商人住宿與貨物倉儲；hamam 提供洗浴與社交空間。Daut Pasha 與 Čifte 現由國家美術館使用，呈現歷史公共建築的再利用。</p><h3>實用提醒</h3><p>咖啡壺、香料與甜點適合小額採買；展覽與票價先向入口確認。</p><a class="guide-return" href="#mk17-6">回到行程</a></details><details class="guide-card" id="guide-mk17-7"><summary>Mustafa Pasha Mosque｜導覽</summary><h3>現場看什麼</h3><p>看圓頂、門廊、宣禮塔；室內找指向麥加的 mihrab 壁龕與 minbar 講壇。</p><h3>歷史背景</h3><p>建於1492年的清真寺位在巴扎上方，是仍在使用的鄂圖曼宗教場所。</p><h3>實用提醒</h3><p>脫鞋、遮肩過膝，女性備薄圍巾；不拍正在禮拜的人。</p><a class="guide-return" href="#mk17-7">回到行程</a></details><details class="guide-card" id="guide-mk17-8"><summary>Kale Fortress｜可刪｜導覽</summary><h3>現場看什麼</h3><p>看 Vardar 河、老巴扎屋頂、宣禮塔與南岸新城同框。</p><h3>歷史背景</h3><p>Kale 在土耳其語中意為堡壘。這座戰略高地經歷多個時代，今日城牆也包含修復部分。</p><h3>實用提醒</h3><p>未找到可保證的官方傍晚開放表；夕陽另安排在公共河岸。</p><a class="guide-return" href="#mk17-8">回到行程</a></details><details class="guide-card" id="guide-mk17-10"><summary>Old Bazaar 晚餐與返程｜導覽</summary><h3>現場看什麼</h3><p>豆類陶鍋、烤椒、白乳酪與烤肉是餐桌主角。</p><h3>歷史背景</h3><p>Tavče gravče 是烘烤豆類家常菜；ajvar 以烤紅椒慢煮製成，九月可留意秋季備冬食材。kafana 的用餐節奏較慢，適合共享菜餚。</p><h3>實用提醒</h3><p>Smetka, ve molam：請結帳。Blagodaram：謝謝。</p><a class="guide-return" href="#mk17-10">回到行程</a></details><details class="guide-card" id="guide-mk18-2"><summary>Matka 湖邊步道與 St. Andrew｜導覽</summary><h3>現場看什麼</h3><p>看石灰岩裂隙、岩縫植被，以及教堂貼近湖岸的位置。</p><h3>歷史背景</h3><p>Matka 位於 Treska 河峽谷，湖面由水壩形成。St. Andrew 建於14世紀末，體現峽谷中的東正教修道文化。</p><h3>實用提醒</h3><p>教堂是否開放依現場；不為拍照走出護欄。</p><a class="guide-return" href="#mk18-2">回到行程</a></details><details class="guide-card" id="guide-mk18-3"><summary>Vrelo Cave 船程｜視班次｜導覽</summary><h3>現場看什麼</h3><p>船上觀察岩壁與湖面比例；洞內看水滴沉積形成的鐘乳石。</p><h3>歷史背景</h3><p>含二氧化碳的水沿石灰岩裂隙溶蝕，形成喀斯特洞穴與地下水系。Vrelo 的水下部分仍有探勘，不以未證實的世界深度排名作導覽。</p><h3>實用提醒</h3><p>不觸摸鐘乳石；穿防滑鞋。價格與班次由現場私人業者決定。</p><a class="guide-return" href="#mk18-3">回到行程</a></details><details class="guide-card" id="guide-mk18-5"><summary>Šarena Džamija｜Painted Mosque｜導覽</summary><h3>現場看什麼</h3><p>看花卉、幾何框線、建築風景與麥加圖像，彩繪遍布內外牆。</p><h3>歷史背景</h3><p>原寺傳統上追溯至1438年、由兩位女性捐助。今日主要裝飾與1833年 Abdurrahman Pasha 的重建有關，呈現地方鄂圖曼建築與華麗彩繪。</p><h3>實用提醒</h3><p>Tetovo 位於 Polog 盆地，馬其頓語與阿爾巴尼亞語並用。入寺須同意、脫鞋、遮肩過膝。</p><a class="guide-return" href="#mk18-5">回到行程</a></details><details class="guide-card" id="guide-mk18-7"><summary>Tetovo → Gostivar → Kičevo → Ohrid｜導覽</summary><h3>現場看什麼</h3><p>從開闊 Polog 盆地進入山間交通走廊，再下降至 Ohrid 湖盆。</p><h3>歷史背景</h3><p>西部城市集中於盆地，山坡保留村落與牧業地景。公路沿有限的谷地連接這些聚落。</p><h3>實用提醒</h3><p>AMSM 9/14公告仍列多處施工改道；導航時間只是起點，按現場標誌行駛。</p><a class="guide-return" href="#mk18-7">回到行程</a></details><details class="guide-card" id="guide-mk18-9"><summary>Ohrid Port → Saraiste 湖岸夕陽｜導覽</summary><h3>現場看什麼</h3><p>看紅瓦老城沿山坡上升、碼頭船隻與湖岸居民散步。</p><h3>歷史背景</h3><p>Ohrid 湖區兼具世界遺產的自然與文化價值：古老湖泊生態與歷代城市生活共存。晚間散步是當地日常社交的一部分。</p><h3>實用提醒</h3><p>不餵魚鳥、不留下垃圾；市區湖邊不等同所有水域都可安全下水。</p><a class="guide-return" href="#mk18-9">回到行程</a></details><details class="guide-card" id="guide-mk19-2"><summary>Old Bazaar → Chinar Tree｜導覽</summary><h3>現場看什麼</h3><p>留意懸鈴木下的座位與街巷交會；商業街仍是居民生活空間。</p><h3>歷史背景</h3><p>Ohrid pearl 是人工珠體外覆特殊魚鱗乳劑的地方工藝，不是天然珍珠。</p><h3>實用提醒</h3><p>若購買，確認店家來源與說明；不因祖傳配方宣傳而倉促購買高價款。</p><a class="guide-return" href="#mk19-2">回到行程</a></details><details class="guide-card" id="guide-mk19-3"><summary>Robev House／手工紙工作坊｜二選一｜導覽</summary><h3>現場看什麼</h3><p>看上層外挑、木作與家庭生活空間；造紙工坊則看纖維成紙和印刷示範。</p><h3>歷史背景</h3><p>現有Robev住宅於1861年火災後重建，呈現19世紀富商民居。造紙工作坊屬現代文化展示，不能等同中世紀原址傳承。</p><h3>實用提醒</h3><p>Robev House官方夏季兩班涵蓋09:00–20:00，週一休；工作坊示範依現場。</p><a class="guide-return" href="#mk19-3">回到行程</a></details><details class="guide-card" id="guide-mk19-4"><summary>Church of Saint Sophia｜導覽</summary><h3>現場看什麼</h3><p>看主教與教父人物、嚴肅面容與衣褶，注意圖像如何環繞祭壇。</p><h3>歷史背景</h3><p>Sophia 指神聖智慧。這裡曾是 Ohrid 大主教座堂，保存重要中世紀壁畫；鄂圖曼時期改作清真寺，之後修復。</p><h3>實用提醒</h3><p>不開閃光燈、不碰壁畫；穿遮肩過膝衣物。</p><a class="guide-return" href="#mk19-4">回到行程</a></details><details class="guide-card" id="guide-mk19-5"><summary>Ancient Theatre｜導覽</summary><h3>現場看什麼</h3><p>看半圓座位如何依山坡展開，可輕聲感受聲音傳遞。</p><h3>歷史背景</h3><p>古代 Ohrid 名為 Lychnidos；劇場源於希臘化時期，羅馬時期持續使用，今日也用作演出場地。</p><h3>實用提醒</h3><p>尊重排練、搭台及臨時封閉，不大聲試音。</p><a class="guide-return" href="#mk19-5">回到行程</a></details><details class="guide-card" id="guide-mk19-6"><summary>Samuel’s Fortress｜導覽</summary><h3>現場看什麼</h3><p>以城牆作前景拍湖與紅瓦。湖西側是Albania；北側Struga是黑德林河流出湖泊的方向。</p><h3>歷史背景</h3><p>城址古代已有防禦工事，現名與10–11世紀統治者Samuil相關。現今城垛包含現代修復，中世紀政權與今日國界不能直接畫等號。</p><h3>實用提醒</h3><p>城牆曝曬、階梯不平；雨後避免走濕滑高處。</p><a class="guide-return" href="#mk19-6">回到行程</a></details><details class="guide-card" id="guide-mk19-7"><summary>Plaošnik／St. Pantelejmon｜導覽</summary><h3>現場看什麼</h3><p>分辨早期基督教遺址、歷史建築位置與現代重建教堂。</p><h3>歷史背景</h3><p>Clement與Naum承接Cyril、Methodius的斯拉夫語教育傳統，Ohrid成為翻譯、抄寫與宗教教育中心。Cyril、Methodius所創為格拉哥里字母；不能簡化為Cyril在Ohrid創造西里爾字母。</p><h3>實用提醒</h3><p>以現場考古標示為準，不將所有建築都當成中世紀原件。</p><a class="guide-return" href="#mk19-7">回到行程</a></details><details class="guide-card" id="guide-mk19-9"><summary>Saraiste → 木棧道 → Potpesh → Kaneo｜導覽</summary><h3>現場看什麼</h3><p>看住宅石造底層、外挑白牆、紅瓦與陡坡的關係。</p><h3>歷史背景</h3><p>湖岸和山坡限制土地，Ohrid形成狹窄街巷與向上擴展的傳統民居。</p><h3>實用提醒</h3><p>木板遇水很滑；保留原路或街道返程，不依賴臨時船班。</p><a class="guide-return" href="#mk19-9">回到行程</a></details><details class="guide-card" id="guide-mk19-10"><summary>St. John at Kaneo｜教堂與日落｜導覽</summary><h3>現場看什麼</h3><p>從教堂後上方將紅瓦、圓頂、藍湖與西岸山脈一起入鏡。</p><h3>歷史背景</h3><p>教堂獻給神學家聖約翰，通常推測為13世紀左右；確切建造年代未明。其小巧體量與臨湖岩岬位置構成Ohrid代表景觀。</p><h3>實用提醒</h3><p>遠山可能提早遮住太陽。帶手機照明，勿為構圖走近無護欄懸崖。</p><a class="guide-return" href="#mk19-10">回到行程</a></details><details class="guide-card" id="guide-mk20-2"><summary>Bay of Bones Museum｜導覽</summary><h3>現場看什麼</h3><p>看木樁、平台、房屋與湖岸的關係，再用出土陶器與工具理解生活。</p><h3>歷史背景</h3><p>這裡展示晚期青銅至早期鐵器時代樁上聚落；眼前房屋為2007–08年的考古重建，並非保存數千年的原建築。</p><h3>實用提醒</h3><p>票價向入口確認；館方通用票價表不代表所有景點共用一張票。</p><a class="guide-return" href="#mk20-2">回到行程</a></details><details class="guide-card" id="guide-mk20-3"><summary>Trpejca｜短停選配｜導覽</summary><h3>現場看什麼</h3><p>看小村沿Galičica山坡下降至湖邊的格局。</p><h3>歷史背景</h3><p>漁村逐漸轉為家庭旅館、餐廳與游泳度假地，反映湖區從漁農業轉向旅遊的生活變化。</p><h3>實用提醒</h3><p>停車或下坡耗時就刪除此點，不安排正式午餐。</p><a class="guide-return" href="#mk20-3">回到行程</a></details><details class="guide-card" id="guide-mk20-4"><summary>St. Naum Monastery｜導覽</summary><h3>現場看什麼</h3><p>看教堂、墓室與泉水濕地交會的環境。</p><h3>歷史背景</h3><p>Naum是Ohrid宗教教育傳統的重要人物，修道院傳統上創建於約905年。現有建築與壁畫歷經後世重建，不能全部視作10世紀作品。</p><h3>實用提醒</h3><p>尊重聖人墓室的信仰傳說；不追逐或餵食孔雀。</p><a class="guide-return" href="#mk20-4">回到行程</a></details><details class="guide-card" id="guide-mk20-5"><summary>泉水小船＋簡單午餐｜導覽</summary><h3>現場看什麼</h3><p>看清澈泉池、水草、倒木與水底湧泉。</p><h3>歷史背景</h3><p>部分Prespa水經喀斯特地下通道流向Ohrid湖區。St. Naum泉水在南端注入湖泊；黑德林河則在北端Struga流出湖泊，兩者別混淆。</p><h3>實用提醒</h3><p>保持安靜，不餵魚鳥、不觸摸水下植物。</p><a class="guide-return" href="#mk20-5">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://amsm.mk/sostojba-na-patishta/" target="_blank" rel="noopener">AMSM｜9/14道路公告</a> · 2026-09-15</li><li><a href="https://motherteresa.mk/memorial-house/" target="_blank" rel="noopener">Mother Teresa｜參觀資訊</a> · 2026-09-15</li><li><a href="https://muzejohrid.mk/muzej-na-voda/" target="_blank" rel="noopener">Ohrid Museum｜Bay of Bones時段</a> · 2026-09-15</li><li><a href="https://muzejohrid.mk/samoilova-tvrdina/" target="_blank" rel="noopener">Ohrid Museum｜Samuel Fortress時段</a> · 2026-09-15</li><li><a href="https://muzejohrid.mk/" target="_blank" rel="noopener">Ohrid Museum｜Robev House與票務</a> · 2026-09-15</li><li><a href="https://whc.unesco.org/en/list/99/" target="_blank" rel="noopener">UNESCO｜Ohrid自然與文化遺產</a> · 2026-09-15</li><li><a href="https://manaki.com.mk/" target="_blank" rel="noopener">Manaki Brothers｜2026日期</a> · 2026-09-15</li><li><a href="https://www.meteoblue.com/en/weather/week/skopje_north-macedonia_785842" target="_blank" rel="noopener">Meteoblue｜Skopje（快取日期見天氣段）</a> · 2026-09-15</li><li><a href="https://www.meteoblue.com/en/weather/14-days/ohrid_north-macedonia_787487" target="_blank" rel="noopener">Meteoblue｜Ohrid（快取日期見天氣段）</a> · 2026-09-15</li><li><a href="https://mb.gov.al/en/newsroom/one-stop-ne-pikat-e-kalimit-kufitar-lehtesohet-levizja-mes-shqiperise-dhe-maqedonise-se-veriut/" target="_blank" rel="noopener">Albania內政部｜9/10一站式關口協議進度</a> · 2026-09-15</li><li><a href="https://muzejohrid.mk/samoilova-tvrdina/" target="_blank" rel="noopener">Ohrid Museum｜堡壘夏季09:00–16:30</a> · 2026-09-18｜天氣調整版</li><li><a href="https://muzejohrid.mk/muzej-na-voda/" target="_blank" rel="noopener">Ohrid Museum｜Bay of Bones夏季09:00–16:30</a> · 2026-09-18｜天氣調整版</li><li><a href="https://muzejohrid.mk/plaoshnik/" target="_blank" rel="noopener">Ohrid Museum｜Plaošnik文化層</a> · 2026-09-18｜天氣調整版</li><li><a href="https://whc.unesco.org/en/list/99/" target="_blank" rel="noopener">UNESCO｜Ohrid與Lin跨國湖區</a> · 2026-09-18｜天氣調整版</li><li><a href="https://whc.unesco.org/en/list/569/" target="_blank" rel="noopener">UNESCO｜Berat城市遺產</a> · 2026-09-18｜天氣調整版</li><li><a href="https://www.meteoblue.com/en/weather/week/ohrid_north-macedonia_787487" target="_blank" rel="noopener">Meteoblue｜頁面含快取，不作最新逐時預報</a> · 2026-09-18｜天氣調整版</li><li><a href="https://amsm.mk/sostojba-na-patishta/" target="_blank" rel="noopener">AMSM｜出發前道路查核</a> · 2026-09-18｜天氣調整版</li></ul></section></main></template>
<template id="content-kosovo-2026"><nav><a href="#ks14">09-14 Durmitor → Peja → Rugova 山區住宿</a><a href="#ks15">09-15 08:00 已預約冒險 → Dečani → Prizren</a><a href="#ks16">09-16 Prizren 歷史老城與堡壘黃昏</a><a href="#ks17">09-17 R7＋R6 → Skopje 完整半日</a><a href="#ks18">09-18 Matka Canyon → Ohrid 銜接</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="ks-stays"><h2>住宿與已預約活動｜9/13 整合版</h2><p>本版取代貼文中的 Skyline Apartment 1 舊住宿安排；保留既有 Montenegro 行程與導覽，9/14 起以這份接續版的住宿及抵達安排為準。全部時間為當地時間（UTC+2）。</p><p>9/15 08:00 Via Ferrata 已預約。先前紀錄為保留 BNA（Balkan Natural Adventure）；路線 Shpellat／Ari 依嚮導、能力與天氣決定，MAT 可能施工，不能把原草稿的「固定 Mat」當成最終確認。活動預約時間已確定，不代表 Zipline、接送或早餐已確認。</p><p>BNA 先前回覆私人兩人團 €35／人，共 €70；4 人以上若成功併團為 €30／人。飯店代訂價格與合作業者尚待回覆，沒有把未確認的較低價格取代既有預約。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>住宿</th><th>動線與確認事項</th></tr></thead><tbody><tr><td>9/14–15</td><td>Hotel Chalet Kujta Apartment｜Rugove</td><td>山區住宿；先在 Peja 採買／遊覽，再沿峽谷入住。早餐與集合點尚待確認。</td></tr><tr><td>9/15–17</td><td>Skyline Serenity Apartment｜Prizren</td><td>連住兩晚；請以房東指定停車入口為準。</td></tr><tr><td>9/17–18</td><td>SKP-091 a&amp;b｜Skopje</td><td>市中心住宿；車位、入口與提前寄放行李待房東確認。</td></tr><tr><td>9/18–20</td><td>RUPE Apartments｜Ohrid</td><td>9/18 經 Matka 銜接；此版僅納入移動與入住安排。</td></tr></tbody></table></div></section><section id="ks-booking"><h2>9/15 08:00｜預約與出發前核對</h2><p>固定：9/15（二）08:00 集合。尚未取得可核對的集合定位、嚮導聯絡方式、接送、裝備包含項目與天氣退款文字；以業者最終訊息為準，不把 Edit Durham 辦公室地址當作必然集合點。</p><p>9/14 晚上一次核對：實際路線、集合 pin、是否自行開車、預計結束時間、頭盔／安全帶／雙鉤緩衝繩、Zipline 是否另付、付款方式與雨天處理。</p><p>Chalet Kujta 位於 Rugova 的 Shtupeq i Madh 一帶，並非 Peja 市中心。早餐時段尚未確認；不能預設 07:00 開餐，更不能預設吃完飯店早餐就來得及 08:00。若餐期太晚，前一天買早餐，或請飯店確認能否提前供餐。</p><p>暫定 06:15 起床、06:30 早餐與退房、07:00 左右離開；抓 45–60 分鐘交通及停車緩衝、07:45 到集合點。這是集合 pin 未取得前的保守占位，收到定位後重算，若業者在近處接送則可放寬。</p><p>首次體驗優先請嚮導評估 Ari 或可開放的入門線；Shpellat 不因有健身習慣就自動適合。雷雨、濕滑岩面或強風時讓嚮導決定取消／改線，不自行操作或硬守預約。</p></section><section id="ks-context"><h2>四天看懂巴爾幹｜山地、信仰與城市記憶</h2><p>地景主線：Durmitor 喀斯特高原 → Rugova 石灰岩峽谷 → 西 Kosovo 平原 → Prizren 河岸商業城市 → Skopje 的 Vardar 河谷。每一座城的位置都與水源、交通與山口有關。</p><p>歷史可分五層閱讀：古代 Dardania 與羅馬／拜占庭世界；13–14 世紀塞爾維亞王國與東正教修道院；鄂圖曼巴扎、浴室與清真寺；1878 年阿爾巴尼亞民族政治運動與其後南斯拉夫時期；1998–1999 戰爭及 2008 年宣布獨立後的社會。國家地位在國際上仍有不同立場。</p><p>Peja／Peć、Deçan／Dečani、Gjakovë／Đakovica 是不同語言的地名，不是不同景點。導航可交叉搜尋；阿爾巴尼亞語與塞爾維亞語均為 Kosovo 官方語言。</p><p>UNESCO「Kosovo 中世紀古蹟」含四個組成點：Dečani、Peć、Gračanica 與 Our Lady of Ljeviš。本段可遇到其中三處，不為湊齊四處而繞道。其價值在東西方建築與壁畫交流，也反映活的宗教場所如何承載複雜歷史。</p><p>清真寺遮肩過膝並脫鞋，東正教教堂一般不脫鞋。進修道院帶證件，拍攝內部及信徒前先徵求同意。以開放、尊重的態度理解不同敘事，不需要在現場辯論主權。</p></section><section id="ks-road"><h2>自駕原則與路線衝突修正</h2><p>9/14 保留 Žabljak → Mojkovac → Rožaje → Kula／Kullë → Peja 的方向，但不能忽略前段既有 Tara Bridge／R10 通行限制。Mojkovac 之前走哪條路，應使用 Montenegro 章節的出發日路況核對及備案；本版沒有宣稱封路已解除。</p><p>Bijelo Polje 市中心不是強制途經點。前往 Rožaje 通常應核對 Ribarevine → Berane 的接續，避免為休息繞進 Bijelo Polje；若導航所選實際路線經城區才順停。</p><p>07:30 出發及 6.5–7.5 小時抵達 Peja，只適用順利通行、正常邊境的規劃窗；若必須採 Nikšić／Podgorica 大繞行，改更早出發並刪除下午所有遊覽，不能沿用同一抵達時間。到 Rugova 飯店另留山路時間。</p><p>核對現車車牌一致的車籍、租車書面跨境許可、Kosovo 與 North Macedonia 責任險，以及租車車損／道路救援範圍。少量歐元現金與離線地圖隨車。第三人責任險不等於租車全險；換過車要核對新車資料。</p><p>9/17 固定走 Prizren → R7 → R6 → Ferizaj／Kaçanik → Hani i Elezit／Blace → Skopje。不進 Pristina，不把 Prevalla／Brezovica 景觀山路列入主線；多出的時間留給唯一一晚 Skopje。</p><p>9/18 Matka 留在離開 Skopje 往 Ohrid 當天。北馬其頓公路局 2026/5/11 仍把 Kičevo–Ohrid 列為工程最後階段；這不是 9/18 即時通行保證，當天再核對公路公告，留施工與慢車緩衝。</p></section><section id="ks-rain-options"><h2>活動取消時的北側備案</h2><p>White Drin Waterfall 與 Sleeping Beauty Cave 在 Peja 北側 Radavc 一帶。只有攀爬取消且現場安全才安排，正常活動日不再折返。兩點門票／洞穴導覽時間未確認。</p><p>建議占位：08:30 瀑布、09:30 洞穴、11:30 Peja 午餐、13:05 Dečani。洞穴必須等正式業者帶領；大雨、路滑或停業時兩者一起刪除，改市區咖啡與提早南下。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=White%20Drin%20Waterfall%20Radavc">White Drin Waterfall｜地名搜尋</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Sleeping%20Beauty%20Cave%20Radavc">Sleeping Beauty Cave｜地名搜尋</a></section><section class="day" id="ks14"><span class="tag">2026-09-14</span><h2>9/14 週一｜Durmitor → Peja → Rugova 山區住宿</h2><p>今日先完成跨境與市區補給，再一路往 Chalet Kujta。取消「先入住市區公寓、晚上再逛 Peja」的舊動線。</p><div class="slot" id="ks14-start"><div class="time">07:30｜順利通行方案</div><div><h3>Žabljak 出發 → Mojkovac → Rožaje</h3><p>先核對 Montenegro 前段道路狀態。途中每約 1.5–2 小時短休息；油量須足以完成山口段並有餘量，不因過境就一定在黑山加滿。</p><p><b>費用：</b>油費依現車與實際路線；不在本段餐飲預算內</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Zabljak%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ks14-start">導覽</a></div></div><div class="slot" id="ks14-rest"><div class="time">10:15–10:45｜彈性</div><div><h3>主路休息｜Ribarevine／Berane 方向</h3><p>咖啡、洗手間、補水；不為休息專程繞入 Bijelo Polje 市中心。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ribarevine%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ks14-rest">導覽</a></div></div><div class="slot" id="ks14-lunch"><div class="time">12:00–12:40｜彈性</div><div><h3>Rožaje 簡單午餐</h3><p>Burek 配優格、豆湯／肉湯或少量烤肉；不要安排長餐。最後補水並整理證件。</p><p><b>費用：</b>規劃 €7–13／人</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Rozaje%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ks14-lunch">導覽</a></div></div><div class="slot" id="ks14-border"><div class="time">13:00–15:00｜非預報</div><div><h3>Kula／Kullë → Peja</h3><p>通關、低雲、慢車均可能延誤；不要以現時排隊推算明天。只走正式開放口岸與道路。</p><p><b>交通：</b>總駕駛＋休息＋通關，順利方案到 Peja 約 6.5–7.5 小時；飯店另加車程</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kula%20border%20crossing%20Montenegro%20Kosovo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ks14-border">導覽</a></div></div><div class="slot" id="ks14-peja"><div class="time">約15:00–15:45</div><div><h3>Peja 採買＋老城短走</h3><p>先選方便停車的超市買早餐、水、香蕉、雞蛋、麵包、番茄、小黃瓜、優格及 Rugova 起司。Viva Fresh／ETC 等僅為搜尋選項，以路線上實際店址為準。老巴扎只在準時抵達時走20–30分鐘。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Old%20Bazaar%20Peja" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ks14-peja">導覽</a></div></div><div class="slot" id="ks14-patriarchate"><div class="time">16:00–16:45｜開放才去</div><div><h3>Patriarchate of Peć｜佩奇宗主教修道院</h3><p>先請住宿或業者確認當日可參觀，再沿途停靠；沒有可靠固定開放保證。帶護照，遮肩過膝。</p><p><b>費用：</b>入場／捐獻依現場；未確認</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Patriarchate%20of%20Pec" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://whc.unesco.org/en/list/724/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ks14-patriarchate">導覽</a></div></div><div class="slot" id="ks14-canyon"><div class="time">16:45–17:30｜沿途</div><div><h3>Rugova Canyon → Chalet Kujta</h3><p>沿峽谷往住宿方向，在合法且能完整離開車道的位置短停；不額外深入 Bogë，也不在路彎停車拍照。</p><p><b>交通：</b>Peja 至山區住宿暫留45–60分鐘含少量停靠，收到住宿 pin 後核對</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Rugova%20Canyon" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ks14-canyon">導覽</a></div></div><div class="slot" id="ks14-hotel"><div class="time">17:30–18:30｜視通關</div><div><h3>Hotel Chalet Kujta Apartment 入住</h3><p>在 Rugove 住宿，晚餐就近解決。先整理隔日活動用品與退房行李，確認早餐時間及集合定位。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hotel%20Chalet%20Kujta%20Rugove" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ks14-hotel">導覽</a><p><b>預約：</b>9/14–15 已安排；早餐、接送、活動代訂回覆待確認</p></div></div><div class="soft"><b>雨天備案</b><p>大雨或山口濃霧時優先安全通行；取消峽谷停拍與市區觀光。抵達太晚就直接補給、入住。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪峽谷停拍，再刪老城與修道院。若交通迫使大繞行，改更早出發並重新估算；天黑前無法安全到達時，不硬趕山路。</p></div></section><section class="day" id="ks15"><span class="tag">2026-09-15</span><h2>9/15 週二｜08:00 已預約冒險 → Dečani → Prizren</h2><p>固定預約時間；實際路線由 BNA 確認。Gjakova、Zipline 與北側瀑布洞穴不能同時硬塞。</p><div class="slot" id="ks15-breakfast"><div class="time">06:15–07:00｜暫定</div><div><h3>早餐、退房、前往集合點</h3><p>若飯店早餐太晚，吃前一天買好的早餐；07:45 抵達為目標。收到業者集合 pin 後調整，不假設由飯店接送。</p><p><b>交通
