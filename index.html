燃油預算</td><td>€110–150</td><td>一車</td><td>以約 60–80L 規畫；依實走公里與長繞路增加，非車型實測</td></tr><tr><td>Voli 週末早餐／午餐飲水</td><td>€25–40</td><td>兩人兩天</td><td>估算；週六補週一用品另留 €5–10</td></tr><tr><td>9/11 餐飲＋採買</td><td>€70–115</td><td>兩人／日</td><td>含簡餐與晚餐，不含住宿燃油</td></tr><tr><td>9/12 餐飲＋入園／停車</td><td>€50–85</td><td>兩人／日</td><td>早餐備糧不重算；門票停車為待確認暫估</td></tr><tr><td>9/13 餐飲＋入園</td><td>€55–90</td><td>兩人／日</td><td>自駕環線／一般餐；未含包車或昂貴羊肉大份</td></tr><tr><td>9/14 餐飲</td><td>€35–60</td><td>兩人／日</td><td>不含住宿、保險例外與長繞高速費</td></tr><tr><td>Durmitor 入園</td><td>暫估 €5</td><td>人／日</td><td>本次未取得適用 2026/9 的完整新價目；現場確認</td></tr><tr><td>Black Lake 停車</td><td>暫估 €1</td><td>車／小時</td><td>舊參考；實際看所選停車場</td></tr><tr><td>划船</td><td>舊參考 €10</td><td>船／小時</td><td>未確認現價；本次天氣不列必做</td></tr><tr><td>Piva Monastery</td><td>待確認／自願捐獻</td><td>人</td><td>不把未知門票視為固定免費</td></tr><tr><td>Ring 包車／嚮導</td><td>詢價</td><td>按車／人確認</td><td>舊 €20 van、€30 jeep 不當成可預訂報價</td></tr><tr><td>Tara Zipline</td><td>本次刪除</td><td>—</td><td>施工、接駁與跨境時間未確認，不先付費</td></tr></tbody></table></div><p>兩人四天先留約 €320–500，涵蓋上表一般餐飲、採買、暫估入園停車及 €110–150 燃油；不含住宿、原租車費、額外保險、包車、Zipline 與大繞路高速費。這是留餘裕的旅費範圍，不是已訂服務的總報價。餐飲列每日預算與採買列有重疊說明，合計時不能把採買再次加進去。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-hum"><summary>Hum／Šćepan Polje｜慢山路與跨境｜導覽</summary><h3>現場看什麼</h3><p>留意河谷道路逐步收窄，過境後再找正式停車位置。</p><h3>歷史背景</h3><p>Tara 與 Piva 在 Šćepan Polje 一帶匯成 Drina，河流在這裡既連接山區，也構成國界的一部分。</p><h3>相關故事</h3><p>接下來看到的是 Piva 系統；不要把所有藍綠水面都叫作 Tara。這個匯流點是理解兩天峽谷地理的起點。</p><h3>實用提醒</h3><p>邊境設施內不隨意拍照；租車文件需與現車車牌一致。</p><a class="guide-return" href="#hum">回到行程</a></details><details class="guide-card" id="guide-piva-canyon"><summary>Piva Canyon｜隧道、峽谷與水庫｜導覽</summary><h3>現場看什麼</h3><p>看湖面與峭壁垂直落差、鑿岩隧道，以及水位線。不要為完整大壩照片找危險路肩。</p><h3>歷史背景</h3><p>Piva 自然公園資料把水庫形成記為 1975 年水電工程；這不是天然冰河湖。</p><h3>相關故事</h3><p>水壩改變了河谷、聚落與文化遺產的位置。你現在看到的平靜水面下，原本是一段更深切的河谷景觀。</p><h3>實用提醒</h3><p>雨剛開始時油膜與灰塵可能讓路面更滑；拍照由副駕觀察，駕駛專心。</p><a class="guide-return" href="#piva-canyon">回到行程</a></details><details class="guide-card" id="guide-pluzine"><summary>Plužine｜午餐與湖岸短走｜導覽</summary><h3>現場看什麼</h3><p>從公共湖岸看小城與水面的高度關係。</p><h3>歷史背景</h3><p>水庫工程讓舊聚落居民遷到較高的新城；今日 Plužine 的格局與近代水電開發密切相關。</p><h3>相關故事</h3><p>旅行時很容易只稱讚水色，這裡也適合想一想：新湖景的形成，同時意味著舊家園改變。</p><a class="guide-return" href="#pluzine">回到行程</a></details><details class="guide-card" id="guide-piva-monastery"><summary>Piva Monastery｜會搬家的修道院｜導覽</summary><h3>現場看什麼</h3><p>先看低調的石造外觀，再看室內壁畫如何包覆牆面；不只拍外觀就離開。</p><h3>歷史背景</h3><p>修道院建於 1573–1586 年。為避開水庫蓄水，20 世紀後期把建築拆解、編號與重建，並搬移壁畫，工程在 1982 年完成。</p><h3>相關故事</h3><p>真正值得看的是保存方法：石塊能拆，壁畫卻與灰泥、牆體相連，需要分片處理。今天看似安靜完整的空間，是大量保護工程重新拼合的結果。</p><h3>實用提醒</h3><p>遮肩遮膝、安靜參觀；拍攝先詢問。禮拜時以信眾使用為優先。</p><a class="guide-return" href="#piva-monastery">回到行程</a></details><details class="guide-card" id="guide-savnik"><summary>Jasenovo Polje → Šavnik → Žabljak｜導覽</summary><h3>現場看什麼</h3><p>看河谷、坡地聚落逐漸轉成高原草地與森林。</p><h3>歷史背景</h3><p>Šavnik 是黑山內陸河谷與山地路網的節點。經這裡上 Žabljak，海拔變化是這天景觀的一部分。</p><h3>相關故事</h3><p>這段繞行的價值是把「抵達」與「高山遊覽」分開：今天完成移動，等精神與天氣合格再看山口。</p><a class="guide-return" href="#savnik">回到行程</a></details><details class="guide-card" id="guide-mb-dinner"><summary>Žabljak 晚餐｜Hotel MB 或簡餐｜導覽</summary><h3>現場看什麼</h3><p>高地料理重視乳酪、馬鈴薯、玉米與肉湯，先問份量再點。</p><h3>歷史背景</h3><p>kačamak 常把馬鈴薯與玉米粉煮合再拌乳製品；cicvara 更偏向乳脂與玉米粉煮成的濃稠料理，兩者不必同餐各點一大份。</p><h3>相關故事</h3><p>寒冷山區的食物設計重在飽足。兩人共享一道高熱量主食，通常更能吃到不同菜色。</p><a class="guide-return" href="#mb-dinner">回到行程</a></details><details class="guide-card" id="guide-blacklake-morning"><summary>Black Lake／Crno Jezero｜早晨湖景｜導覽</summary><h3>現場看什麼</h3><p>主入口湖岸看 Međed 山與森林倒影；風起後改拍樹幹、岸線及水面層次。</p><h3>歷史背景</h3><p>黑湖位於冰河塑造的山地，包含相連的大小湖盆，連通狀態隨水位變化。</p><h3>相關故事</h3><p>兩個湖盆不像游泳池固定同一水位；夏末水位降低時，原本不明顯的岸線和連接處會更清楚。湖名不代表水永遠黑色，樹影、深度與光線共同改變觀感。</p><h3>實用提醒</h3><p>完整環湖約 3.6 公里，拍照與濕路抓 1.5–2 小時；入口到湖岸也有步行距離。</p><a class="guide-return" href="#blacklake-morning">回到行程</a></details><details class="guide-card" id="guide-zminje"><summary>Mlinski Potok → Zminje Lake｜導覽</summary><h3>現場看什麼</h3><p>沿溪谷看森林、潮濕地面與湖邊倒木；小湖適合安靜停留，不是追求巨大山峰全景。</p><h3>歷史背景</h3><p>Durmitor 的地形同時受到冰河、流水與石灰岩溶蝕影響。Zminje 隱在森林，與開闊的黑湖形成不同尺度的湖泊經驗。</p><h3>相關故事</h3><p>Mlinski Potok 的名字與磨坊溪相關，提醒這不是只有現代遊客使用的森林；水流也曾是地方日常生產的一部分。</p><h3>實用提醒</h3><p>樹根、濕石很滑。岔路看步道標記與離線健行圖；Google 道路導航不能代替步道圖。</p><a class="guide-return" href="#zminje">回到行程</a></details><details class="guide-card" id="guide-race-watch"><summary>Blacklake Xtreme｜只在公共區域感受氣氛｜導覽</summary><h3>現場看什麼</h3><p>看極限耐力賽如何利用高山湖泊與公路地形；讓出選手、工作人員及救援動線。</p><h3>歷史背景</h3><p>Blacklake Xtreme 是長距離三項賽事，官方項目含 3.8 公里游泳、182 公里自行車與馬拉松。</p><h3>相關故事</h3><p>對旅客而言最有價值的是在地活動氣氛，不是熬夜跟完整場。不要因選手上山，就把當天天氣理解成適合一般遊客健行。</p><a class="guide-return" href="#race-watch">回到行程</a></details><details class="guide-card" id="guide-ring-start"><summary>ViS｜決策、早餐與油量｜導覽</summary><h3>現場看什麼</h3><p>沿線辨識棕色 Panoramic Road 2 指示，但每個岔路仍要確認。</p><h3>歷史背景</h3><p>官方環線資料約 76 公里，加入支線可更長；它是雙向道路。官方音訊導覽按逆時針設計，露營車建議順時針，並不是普通車必須逆時針的交通法規。</p><h3>相關故事</h3><p>不必追求「跟所有車同方向」：對向一定可能有車、牲畜與工作車，慢速並預先看會車位置才重要。</p><h3>實用提醒</h3><p>雨霧、結冰、雷暴警示或在地勸阻任一出現就不跑；四驅也不能改善煞車抓地與能見度。</p><a class="guide-return" href="#ring-start">回到行程</a></details><details class="guide-card" id="guide-mala"><summary>Žabljak → Mala Crna Gora｜導覽</summary><h3>現場看什麼</h3><p>看聚落與夏季草場相隔的尺度，留意木屋、牲畜和山坡利用。</p><h3>歷史背景</h3><p>這一帶高地聚落生活受到季節與交通限制，夏天開闊的道路與牧場，冬天可能是完全不同的生活條件。</p><h3>相關故事</h3><p>它不是供觀光搭建的布景；牧場與家屋仍有使用者。拍人、入院子、靠近牲畜前先尊重居民。</p><a class="guide-return" href="#mala">回到行程</a></details><details class="guide-card" id="guide-susica"><summary>Sušica Canyon → Nedajno｜導覽</summary><h3>現場看什麼</h3><p>由高處看峽谷深度、對岸村落與森林，對比剛剛的高原草地。</p><h3>歷史背景</h3><p>Durmitor 的冰河谷、河流峽谷與喀斯特作用交疊。Sušica 的水文具有季節性，不能保證任何時間都看到充滿水的湖。</p><h3>相關故事</h3><p>最有意思的是尺度轉換：同一條道路會讓人從開闊牧場下降到封閉谷底，再回到高處；不要只在某個「網紅點」找一模一樣的照片。</p><h3>實用提醒</h3><p>不靠近碎石邊緣；峽谷下坡使用合適低檔，會車時先觀察安全退讓處。</p><a class="guide-return" href="#susica">回到行程</a></details><details class="guide-card" id="guide-trsa"><summary>Nedajno → Trsa｜提早午餐｜導覽</summary><h3>現場看什麼</h3><p>看高原牧地與聚落如何相連，試起司、酸奶與一道當地熱食即可。</p><h3>歷史背景</h3><p>這是高地牧業文化的一站，乳製品與耐儲存食物比海岸海鮮更貼近環境。</p><h3>相關故事</h3><p>同一道 kačamak，各家奶製品比例與口感可不同；適合共享比較，不必把菜單每樣點齊。</p><a class="guide-return" href="#trsa">回到行程</a></details><details class="guide-card" id="guide-prutas"><summary>Pišče → Todorov Do／Prutaš｜導覽</summary><h3>現場看什麼</h3><p>Prutaš 的傾斜層狀岩紋與草坡形成對比；用中焦拍層理，比只用超廣角更能看清。</p><h3>歷史背景</h3><p>石灰岩層曾形成於古海洋環境，後來經構造運動抬升、傾斜，再受侵蝕塑形。今天的高山因此也保存海洋沉積的歷史。</p><h3>相關故事</h3><p>山峰條紋像被折起的書頁：這是理解地質時間的線索，不只是奇特花紋。</p><h3>實用提醒</h3><p>只在公路旁安全停靠觀景；今天不是 Prutaš 登頂行程。</p><a class="guide-return" href="#prutas">回到行程</a></details><details class="guide-card" id="guide-sedlo"><summary>Dobri Do → Sedlo｜山口短停｜導覽</summary><h3>現場看什麼</h3><p>看道路曲線、草坡與裸岩山體，車輛與人能提供尺度，但不要站在車道擺拍。</p><h3>歷史背景</h3><p>Sedlo 公路山口約 1,907 公尺；別與旁邊海拔更高的 Sedlena Greda 山峰混淆。</p><h3>相關故事</h3><p>這裡也是高山健行出發區，所以車上看到的「很近的山頂」未必容易走到。Bobotov Kuk 仍屬困難路線，本次不加登頂。</p><h3>實用提醒</h3><p>有雷聲、低雲或強風就不下車久留；不要在山口等待日落。</p><a class="guide-return" href="#sedlo">回到行程</a></details><details class="guide-card" id="guide-tara-view"><summary>Đurđevića Tara｜南岸安全觀景｜導覽</summary><h3>現場看什麼</h3><p>從允許的安全位置看拱橋與峽谷的比例；不追求橋中央的對稱構圖。</p><h3>歷史背景</h3><p>橋建於 1937–1940 年，由五個拱跨組成，全長約 365 公尺，反映當時在深峽谷建立交通連接的工程能力。</p><h3>相關故事</h3><p>二戰期間橋的一部分被破壞以阻止軍事通行，戰後重建。今日又因維修暫停使用，提醒橋梁是持續維護的基礎設施，而非永遠不變的觀景道具。</p><h3>實用提醒</h3><p>Zipline 的起終點、接回停車場方式及施工影響未獲確認，這個跨境日直接刪除。</p><a class="guide-return" href="#tara-view">回到行程</a></details><details class="guide-card" id="guide-mojkovac"><summary>R10／Dobrilovina／Sokolovina → Mojkovac｜導覽</summary><h3>現場看什麼</h3><p>這段在河谷行駛，和前一天從山頂俯視是不同角度。</p><h3>歷史背景</h3><p>Tara 峽谷屬 Durmitor 世界遺產的重要自然景觀；石灰岩山地與河流下切共同塑造長尺度峽谷。</p><h3>相關故事</h3><p>不要把照片裡的一座拱橋當成整個 Tara：真正的主角是穿過不同地貌的河流。</p><a class="guide-return" href="#mojkovac">回到行程</a></details><details class="guide-card" id="guide-rozaje"><summary>Rožaje｜最後補水與油量確認｜導覽</summary><h3>現場看什麼</h3><p>如只經過主路，留意城市清真寺與內陸山地聚落的風貌，不特意穿進市中心。</p><h3>歷史背景</h3><p>這一帶的宗教與文化地景，與黑山西北高地有所不同，反映巴爾幹邊界兩側長期交錯的生活。</p><h3>相關故事</h3><p>今天以實用停靠為主，深入社區導覽留給有時間的行程，避免為文化標籤把跨境日塞滿。</p><a class="guide-return" href="#rozaje">回到行程</a></details><details class="guide-card" id="guide-kula"><summary>Kula／Kulina → Kosovo｜導覽</summary><h3>現場看什麼</h3><p>國界並不是到最高點就立即完成全部查驗，跟著正式口岸動線走。</p><h3>歷史背景</h3><p>BKS 說明 Kosovo 不屬 Green Card 體系，但與 Albania 的有效 MTPL 有互認安排。互認解決第三人責任保障，不自動涵蓋租車車身、底盤、輪胎損傷。</p><h3>相關故事</h3><p>真正容易忽略的是換車：目的地一樣、駕駛一樣，文件上的車牌卻必須跟現在開的車一致。</p><h3>實用提醒</h3><p>租車公司允許入境與保險有效是兩個問題，都要有文件支持。</p><a class="guide-return" href="#kula">回到行程</a></details><details class="guide-card" id="guide-peja"><summary>Peja 抵達｜入住與輕鬆晚餐｜導覽</summary><h3>現場看什麼</h3><p>從山口下降後，留意山地邊緣城市與平地交通的變化。</p><h3>歷史背景</h3><p>Peja／Peć 位於 Rugova 山區入口一帶，是銜接山地與 Kosovo 城市生活的起點。</p><h3>相關故事</h3><p>兩種常見地名在不同語言資料中並存；導航核對同一地點即可，不要把它們誤認成不同城市。</p><a class="guide-return" href="#peja">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://www.gov.me/clanak/od-10-avgusta-potpuna-obustava-saobracaja-preko-mosta-durdevica-tara" target="_blank" rel="noopener">黑山交通管理局：8/10–10/26 Tara Bridge 全面封閉</a> · 2026-09-10</li><li><a href="https://en.vijesti.me/news-b/economy-d/818219/The-Traffic-Administration-published-a-video-of-the-completed-section-of-Zaborje-Jasenovo-Polje." target="_blank" rel="noopener">Vijesti 7/18：Zaborje–Jasenovo Polje 完工</a> · 2026-09-10</li><li><a href="https://bihamk.ba/spi/stanje-na-cesti-u-bih" target="_blank" rel="noopener">BIHAMK 路況（讀取頁面標示 9/9 13:03，不是 9/10 即時）</a> · 2026-09-10</li><li><a href="https://amscg.org/" target="_blank" rel="noopener">AMSCG 路況入口（本次未取得 Sokolovina 當日確認）</a> · 2026-09-10</li><li><a href="https://www.meteo.co.me/" target="_blank" rel="noopener">黑山官方氣象入口；本文城鎮四日數值為 9/10 天氣服務快照</a> · 2026-09-10</li><li><a href="https://www.gov.me/clanak/nove-cijene-goriva-od-08092026" target="_blank" rel="noopener">黑山能源部 9/8 起燃油最高價</a> · 2026-09-10</li><li><a href="https://nafta.hr/cijene-goriva-bih/" target="_blank" rel="noopener">波赫油價比較，全國平均非單站報價</a> · 2026-09-10</li><li><a href="https://kompanija.voli.me/voli-marketi/" target="_blank" rel="noopener">Voli 官方門市表</a> · 2026-09-10</li><li><a href="https://mbturist.com/" target="_blank" rel="noopener">Hotel MB 官方餐廳介紹</a> · 2026-09-10</li><li><a href="https://blackxtri.com/race-info" target="_blank" rel="noopener">Blacklake 賽事日期與時程</a> · 2026-09-10</li><li><a href="https://blackxtri.com/s/BLACKLAKE-Event-manual-2026.pdf" target="_blank" rel="noopener">Blacklake 2026 手冊：注意橋梁路線與封閉公告矛盾</a> · 2026-09-10</li><li><a href="https://zabljak.travel/me/panoramski-putevi/" target="_blank" rel="noopener">Žabljak 官方景觀道路／方向說明</a> · 2026-09-10</li><li><a href="https://nparkovi.me/parks/Durmitor/active_holidays" target="_blank" rel="noopener">Durmitor 國家公園步道與活動</a> · 2026-09-10</li><li><a href="https://parkpiva.com/listing/pivsko-jezero/" target="_blank" rel="noopener">Piva 自然公園：水庫形成與文化資產</a> · 2026-09-10</li><li><a href="https://parkpiva.com/listing/prutas-2393m/" target="_blank" rel="noopener">Piva 自然公園：Prutaš</a> · 2026-09-10</li><li><a href="https://whc.unesco.org/en/list/100/" target="_blank" rel="noopener">UNESCO：Durmitor 世界遺產</a> · 2026-09-10</li><li><a href="https://en.wikipedia.org/wiki/Piva_Monastery" target="_blank" rel="noopener">Piva Monastery 歷史補充</a> · 2026-09-10</li><li><a href="https://en.wikipedia.org/wiki/%C4%90ur%C4%91evi%C4%87a_Tara_Bridge" target="_blank" rel="noopener">Tara Bridge 歷史補充</a> · 2026-09-10</li><li><a href="https://bks-ks.org/pagemodels/open?id=256e0671-2a5a-444e-a3e1-cceffc9b4b8e" target="_blank" rel="noopener">Kosovo BKS 保險互認說明</a> · 2026-09-10</li></ul></section></main></template>
<script>'use strict';
const C=JSON.parse(document.getElementById('catalog').textContent), app=document.getElementById('app-main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const link=(t,id='')=>'#trip/'+encodeURIComponent(t.id)+(id?'/'+encodeURIComponent(id):'');
const country=id=>C.countries.find(c=>c.id===id), trip=id=>C.trips.find(t=>t.id===id);
const storageKey='roger-travel-notebook-v1';let state={saved:[],notes:{},checks:{},large:false},storageOK=true,activeTrip=null,guideReturnHref=null;
try{const p=JSON.parse(localStorage.getItem(storageKey)||'null');if(p&&Array.isArray(p.saved)&&p.notes&&p.checks)state={...state,...p};}catch(e){storageOK=false;}
function toast(s){const n=document.getElementById('toast');n.textContent=s;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),4200);}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state));storageOK=true;return true;}catch(e){storageOK=false;toast('瀏覽器無法儲存，請匯出備份；目前資料仍可暫時使用。');return false;}}
document.body.classList.remove('large-text');
const records=[];
C.trips.forEach(t=>{const temp=document.getElementById('content-'+t.id);temp.content.querySelectorAll('.slot,details.guide-card,section[id]').forEach(el=>{const heading=el.querySelector('h2,h3,summary');if(!heading||!el.id)return;records.push({trip:t.id,id:el.id,title:heading.textContent.trim(),text:el.textContent.replace(/\s+/g,' ').trim(),type:el.matches('details')?'景點導覽':el.matches('.slot')?'行程景點':'行程章節'});});});
const recordKey=r=>r.trip+'::'+r.id;
function crumb(items){return '<div class="crumb"><a href="#home">國家首頁</a>'+items.map(i=>' <span>/</span> '+(i.href?'<a href="'+i.href+'">'+esc(i.label)+'</a>':'<span>'+esc(i.label)+'</span>')).join('')+'</div>';}
function searchForm(q=''){return '<form class="searchform" id="search-form"><input id="search-input" name="q" aria-label="搜尋國家、城市或景點" placeholder="搜尋國家、城市或景點，例如 Sarajevo、刺殺" value="'+esc(q)+'" type="search"><button class="primary" type="submit">搜尋</button></form>';}
function tripCard(t){return '<article class="trip-card"><div class="date-block">'+esc(t.start.slice(5).replace('-','/'))+' — '+esc(t.end.slice(5).replace('-','/'))+'<small>'+esc(t.start.slice(0,4))+' · '+t.days.length+' 天</small></div><div><h3><a href="'+link(t)+'">'+esc(t.title)+'</a></h3><p>'+esc(t.subtitle)+'</p><div>'+t.tags.map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+'<span class="badge">'+esc(t.status)+'</span></div><small>內容查核 '+esc(t.verified)+' · '+t.countries.map(id=>esc(country(id).english)).join(' / ')+'</small></div><a class="btn primary" href="'+link(t)+'">查看行程</a></article>';}
function home(){activeTrip=null;document.title=C.site.title;app.innerHTML='<div class="section-head country-heading"><h2>探索國家</h2><span class="muted">'+C.site.updated+' 更新網站</span></div><div class="countries">'+C.countries.map(c=>{const ts=C.trips.filter(t=>t.countries.includes(c.id));return '<a class="country-card" href="#country/'+c.id+'"><div class="country-top"><span class="country-code">'+esc(c.code)+'</span><span class="country-meta">'+esc(c.region)+' · '+ts.length+' 份行程</span></div><h3>'+esc(c.english)+'</h3><p>'+esc(c.summary)+'</p><div class="country-bottom"><span>'+esc(c.coverage?'查看收錄範圍':ts.map(t=>t.days.length+' 天行程').join('、'))+'</span><b>查看國家 →</b></div></a>';}).join('')+'</div><div class="section-head"><h2>已收錄行程</h2><a href="#saved">我的收藏</a></div>'+C.trips.map(tripCard).join('')+'<div class="panel tint"><h3>行前準備，一起帶著走</h3><p>按日期查閱每日安排，點開地圖與導覽。收藏只儲存在目前瀏覽器。</p><a href="#tools">下載離線版本與備份個人資料 →</a></div>';}
function countryPage(id){const c=country(id);if(!c)return missing();activeTrip=null;document.title=c.english+'｜'+C.site.title;const ts=C.trips.filter(t=>t.countries.includes(id));app.innerHTML=crumb([{label:c.english}])+'<h1>'+esc(c.english)+'</h1><p>'+esc(c.summary)+'</p><div class="country-facts"><div><small>地區</small>'+esc(c.region)+'</div><div><small>貨幣</small>'+esc(c.currency)+'</div><div><small>時區</small>'+esc(c.timeZone)+'</div><div><small>行程</small>'+ts.length+' 份</div></div>'+(c.coverage?'<div class="status-note">'+esc(c.coverage)+'</div>':'')+'<h2>行程規畫</h2>'+ts.map(tripCard).join('')+'<p class="muted">跨國行程會同時列在相關國家；內容共用同一份，方便沿路接續閱讀。</p>';}
function savedButton(r){const yes=state.saved.includes(recordKey(r));return '<button class="bookmark" data-save="'+esc(recordKey(r))+'" aria-pressed="'+yes+'" aria-label="'+(yes?'取消收藏':'收藏')+'：'+esc(r.title)+'">'+(yes?'★ 已收藏':'☆ 收藏')+'</button>';}
function mountTrip(t){activeTrip=t.id;guideReturnHref=null;document.title=t.title+'｜'+C.site.title;
app.innerHTML=crumb([{label:country(t.countries[0]).english,href:'#country/'+t.countries[0]},{label:t.title}])+'<div class="trip-intro"><div class="eyebrow">'+esc(t.start)+' — '+esc(t.end)+'</div><h1>'+esc(t.title)+'</h1></div><div class="trip-toolbar no-print"><select id="day-jump" aria-label="跳到日期"><option value="">選擇日期</option>'+t.days.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.date.slice(5).replace('-','/'))+' · '+esc(d.label)+'</option>').join('')+'</select></div>'+(t.important?'<div class="panel tint"><strong>路線重點</strong><p>'+esc(t.important)+'</p></div>':'')+'<div class="legacy" id="legacy"></div>';
const legacy=document.getElementById('legacy');legacy.append(document.getElementById('content-'+t.id).content.cloneNode(true));
legacy.querySelectorAll('a[href^="#"]').forEach(a=>{const id=a.getAttribute('href').slice(1);if(id.startsWith('trip/'))return;a.href=link(t,id);if(a.classList.contains('guide-link')){const r=records.find(r=>r.trip===t.id&&r.id===id);a.textContent='導覽';a.setAttribute('aria-label','導覽：'+(r?.title||id));a.title=r?.title||'景點導覽';}});
legacy.querySelectorAll('[data-map]').forEach(a=>{a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.dataset.map);a.target='_blank';a.rel='noopener noreferrer';});
const rp=legacy.querySelector('#route');if(rp){['Sarajevo Bosnia and Herzegovina','Foca Bosnia and Herzegovina','Hum border crossing Bosnia Montenegro','Scepan Polje Montenegro','Pluzine Montenegro','Piva Monastery Montenegro','Jasenovo Polje Niksic Montenegro','Savnik Montenegro','Zabljak Montenegro'].forEach((p,i)=>{const a=document.createElement('a');a.className='map';a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p);a.textContent=(i+1)+'. '+p;a.target='_blank';a.rel='noopener noreferrer';rp.append(a);});}
records.filter(r=>r.trip===t.id&&r.type!=='行程章節').forEach(r=>{const el=legacy.querySelector('[id="'+CSS.escape(r.id)+'"]');if(!el)return;const wrap=document.createElement('div');wrap.className='no-print';wrap.innerHTML=savedButton(r);if(el.matches('details'))el.append(wrap);else(el.children[1]||el).append(wrap);});
legacy.querySelectorAll('a[target="_blank"]').forEach(a=>a.rel='noopener noreferrer');
}
function showTarget(id){if(!id){window.scrollTo(0,0);return;}const el=document.getElementById(id);if(!el)return;let p=el;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({block:'start'}));const sel=document.getElementById('day-jump');if(sel)sel.value=trip(activeTrip).days.some(d=>d.id===id)?id:'';}
function resultCard(r){const t=trip(r.trip);return '<article class="result"><div class="result-meta">'+esc(t.title)+' · '+esc(r.type)+'</div><h3><a href="'+link(t,r.id)+'">'+esc(r.title)+'</a></h3><p>'+esc(r.text.slice(0,155))+'…</p>'+savedButton(r)+'</article>';}
function search(q){activeTrip=null;document.title='搜尋｜'+C.site.title;const qs=norm(q.trim()).split(/\s+/).filter(Boolean);const matches=qs.length?records.filter(r=>qs.every(w=>norm(r.title+' '+r.text+' '+trip(r.trip).title+' '+trip(r.trip).countries.map(id=>country(id).name+' '+country(id).english).join(' ')).includes(w))):[];const cs=q.trim()?C.countries.filter(c=>qs.every(w=>norm(c.name+' '+c.english+' '+c.summary).includes(w))):[];app.innerHTML=crumb([{label:'搜尋'}])+'<h1>找一個地方，或一段故事。</h1>'+searchForm(q)+'<p class="search-hint">可用中文、地名原文或關鍵字搜尋全部已收錄內容。</p>'+(q.trim()?'<p role="status" class="muted">找到 '+matches.length+' 筆內容'+(cs.length?'、'+cs.length+' 個國家':'')+'</p>'+cs.map(c=>'<div class="panel"><a href="#country/'+c.id+'">'+esc(c.english)+'</a></div>').join('')+matches.map(resultCard).join('')+(matches.length||cs.length?'':'<div class="empty">沒有符合的內容。試試「Sarajevo」、「刺殺」或「Piva」。</div>'):'<div class="panel"><h3>從這些主題開始</h3><div class="actions">'+['Sarajevo','刺殺','Haggadah','Piva','停車','午餐'].map(q=>'<a class="btn" href="#search?q='+encodeURIComponent(q)+'">'+q+'</a>').join('')+'</div></div>');}
function saved(){activeTrip=null;document.title='收藏｜'+C.site.title;const rs=records.filter(r=>state.saved.includes(recordKey(r)));app.innerHTML=crumb([{label:'我的收藏'}])+'<h1>我的收藏</h1><p class="muted">只儲存在目前瀏覽器；分享網站連結不會包含你的收藏或筆記。</p>'+ (rs.length?rs.map(resultCard).join(''):'<div class="empty"><h2>把想去的地方留在這裡。</h2><p>進入行程，點景點或導覽旁的「☆ 收藏」。</p><a class="btn" href="#home">查看國家</a></div>')+'<a href="#tools">匯出或還原個人資料 →</a>';}
function toolsPage(){activeTrip=null;document.title='旅行工具｜'+C.site.title;app.innerHTML=crumb([{label:'旅行工具'}])+'<h1>行程帶著走。</h1><div class="two-col"><div class="utility-card"><h2>離線行程</h2><p>下載整站 HTML，在支援 JavaScript 的瀏覽器開啟即可閱讀內文。地圖導航、官方網站與即時天氣仍需要網路。</p><button class="primary" data-download>下載整站 HTML</button><p class="muted">手機若只能預覽檔案，可使用瀏覽器的列印功能保存 PDF。下載不會包含個人筆記與收藏。</p></div><div class="utility-card"><h2>個人資料備份</h2><p>收藏及舊版留下的清單、筆記只存在目前瀏覽器。換手機或清除瀏覽資料前，先匯出備份。</p><div class="actions"><button data-export>匯出備份</button><label class="btn" for="import-state">還原備份</label><input hidden id="import-state" type="file" accept="application/json,.json"></div><p class="muted">還原會合併收藏，並以備份內的同名筆記和勾選覆蓋目前內容。</p></div></div><div class="panel"><h2>在旅途中少找一步</h2><ul><li>在每份行程上方選日期，直接跳到當天安排。</li><li>「導覽」可打開景點背景；地圖按鍵可轉到 Google Maps。</li><li>複製瀏覽器網址即可分享目前行程章節。</li><li>若需保存 PDF，可使用瀏覽器的列印功能，導覽內文會自動展開。</li></ul></div>';}
function about(){activeTrip=null;document.title='使用說明｜'+C.site.title;app.innerHTML=crumb([{label:'使用說明'}])+'<h1>把旅行經驗，一份份留下。</h1><div class="panel"><h2>怎麼使用</h2><p>從國家選行程，再按日期看每日安排。跨國行程共用同一份內容，從任一相關國家都能找到。</p><p>時間、門票與天氣均以每份行程標示的查核日期為準。網站不會自動取得最新預報、路況或營業時間；出發前請用內文的官方來源核對。</p><p>收藏僅存在目前瀏覽器，沒有帳號或跨裝置同步；舊版的筆記與清單仍可備份。請定期在「旅行工具」匯出備份。</p></div><div class="panel maintenance"><h2>未來新增國家與行程</h2><p>提供國家、旅行日期、交通方式與原始行程，即可依相同模板整理。每份行程都會包含：</p><ul><li>每日時間表、移動方式與停留時間。</li><li>景點介紹、歷史背景、相關故事及 Google Maps 連結。</li><li>門票與餐飲預算，清楚區分已核實價格與估算。</li><li>預約期限、雨天備案、刪減順序及必要安全提醒。</li><li>資訊查核日期、原始來源與待確認事項。</li></ul><p>後續行程由助理整理並發布到這個網站，國家目錄與搜尋會一起更新。</p><a href="https://github.com/rogeryangct/travel-itineraries" target="_blank" rel="noopener">開啟網站儲存庫</a></div><div class="panel"><h2>功能參考</h2><p>參考 <a href="https://play.google.com/store/apps/details?id=com.wanderlog.android" target="_blank" rel="noopener">Wanderlog</a> 的按日規畫與地圖入口，以及 <a href="https://play.google.com/store/apps/details?id=com.tripit" target="_blank" rel="noopener">TripIt</a> 的集中查閱方式。本網站以輕量文字行程為主。</p></div>';}
function localDate(now,timeZone){const p=new Intl.DateTimeFormat('en-US',{timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const get=k=>p.find(x=>x.type===k).value;return get('year')+'-'+get('month')+'-'+get('day');}
function todayMatches(now=new Date()){return C.trips.flatMap(t=>t.days.filter(d=>d.date===localDate(now,d.timeZone||t.timeZone||country(t.countries[0]).timeZone)).map(d=>({t,d})));}
function todayPage(){const matches=todayMatches();if(matches.length===1){location.replace(link(matches[0].t,matches[0].d.id));return;}activeTrip=null;document.title='今天｜'+C.site.title;app.innerHTML=crumb([{label:'今天'}])+'<h1>今天的行程</h1><p class="muted">以各行程所在地的日期判斷。</p>'+(matches.length?matches.map(({t,d})=>'<article class="panel"><div class="eyebrow">'+esc(d.date)+'</div><h2>'+esc(t.title)+'</h2><p>'+esc(d.label)+'</p><a class="btn primary" href="'+link(t,d.id)+'">查看今天行程</a></article>').join(''):'<div class="empty"><h2>今天沒有已收錄的行程。</h2><p>可以從國家目錄選擇其他日期。</p><a class="btn" href="#home">查看國家</a></div>');window.scrollTo(0,0);}
function missing(){activeTrip=null;app.innerHTML=crumb([{label:'找不到頁面'}])+'<div class="empty"><h1>這一頁還沒收錄。</h1><a class="btn primary" href="#home">回國家首頁</a></div>';}
function route(){let hash;try{hash=decodeURIComponent(location.hash.slice(1));}catch(e){return missing();}const parts=hash.split('/');if(parts[0]==='trip'){const t=trip(parts[1]);if(!t)return missing();if(activeTrip!==t.id)mountTrip(t);showTarget(parts.slice(2).join('/'));return;}if(hash&&document.getElementById('content-'+C.trips[0].id).content.querySelector('[id="'+CSS.escape(hash)+'"]')){location.replace(link(C.trips[0],hash));return;}if(!hash||hash==='home')home();else if(parts[0]==='country')countryPage(parts[1]);else if(hash.startsWith('search'))search(new URLSearchParams(location.hash.split('?')[1]||'').get('q')||'');else if(hash==='today'){todayPage();return;}else if(hash==='saved')saved();else if(hash==='tools')toolsPage();else if(hash==='about')about();else missing();window.scrollTo(0,0);}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function offline(){const doc=document.documentElement.cloneNode(true);doc.querySelector('#app-main').innerHTML='';doc.querySelector('#toast').textContent='';doc.querySelector('#toast').className='';doc.querySelector('body').className='';download('roger-travel-notebook.html','<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8');toast('已準備下載整站 HTML。');}
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();const q=document.getElementById('search-input').value.trim();location.hash='search?q='+encodeURIComponent(q);}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='day-jump'&&el.value)location.hash=link(trip(activeTrip),el.value);if(el.id==='import-state'&&el.files[0]){try{if(el.files[0].size>2e6)throw Error();const data=JSON.parse(await el.files[0].text());if(data.format!=='roger-travel-backup-v1'||!Array.isArray(data.saved)||!data.notes||!data.checks||typeof data.notes!=='object'||typeof data.checks!=='object')throw Error();state.saved=[...new Set([...state.saved,...data.saved.filter(x=>typeof x==='string')])];for(const [k,v] of Object.entries(data.notes))if(typeof v==='string'&&!['__proto__','constructor','prototype'].includes(k))state.notes[k]=v;for(const [k,v] of Object.entries(data.checks))if(typeof v==='boolean'&&!['__proto__','constructor','prototype'].includes(k))state.checks[k]=v;persist();toast('已還原個人資料。');}catch(err){toast('無法還原：請選擇本站匯出的 JSON 備份。');}el.value='';}});
let printOpen=[];
function expandForPrint(){printOpen=[...document.querySelectorAll('.legacy details')].map(d=>[d,d.open]);printOpen.forEach(([d])=>d.open=true);}
addEventListener('beforeprint',expandForPrint);addEventListener('afterprint',()=>{printOpen.forEach(([d,o])=>d.open=o);printOpen=[];});
document.addEventListener('click',async e=>{const anchor=e.target.closest('a');if(anchor?.getAttribute('href')==='#today'){e.preventDefault();if(location.hash==='#today')todayPage();else location.hash='today';return;}if(anchor?.classList.contains('skip')){e.preventDefault();app.focus();app.scrollIntoView();return;}if(anchor?.classList.contains('guide-link')&&activeTrip){const origin=anchor.closest('.slot[id],section[id]');guideReturnHref=link(trip(activeTrip),origin?.id||'');}if(anchor?.classList.contains('guide-return')&&guideReturnHref){e.preventDefault();location.hash=guideReturnHref;return;}const b=e.target.closest('button');if(b?.dataset.save){const k=b.dataset.save;state.saved=state.saved.includes(k)?state.saved.filter(x=>x!==k):[...state.saved,k];persist();document.querySelectorAll('[data-save]').forEach(n=>{if(n.dataset.save!==k)return;const yes=state.saved.includes(k);n.textContent=yes?'★ 已收藏':'☆ 收藏';n.setAttribute('aria-pressed',yes);n.setAttribute('aria-label',(yes?'取消收藏':'收藏')+'：'+(records.find(r=>recordKey(r)===k)?.title||''));});if(location.hash==='#saved')saved();return;}if(b?.hasAttribute('data-download'))offline();if(b?.hasAttribute('data-export'))download('roger-travel-backup.json',JSON.stringify({format:'roger-travel-backup-v1',exported:new Date().toISOString(),saved:state.saved,notes:state.notes,checks:state.checks},null,2),'application/json');const a=e.target.closest('a');if(a?.hash&&a.hash===location.hash&&activeTrip)showTarget(decodeURIComponent(a.hash.split('/').slice(2).join('/')));});
addEventListener('hashchange',route);route();

function measureNavigation(){document.documentElement.style.setProperty('--sitebar-height',document.getElementById('sitebar').getBoundingClientRect().height+'px');}
measureNavigation();if(typeof ResizeObserver!=='undefined')new ResizeObserver(measureNavigation).observe(document.getElementById('sitebar'));else addEventListener('resize',measureNavigation);
</script></body></html>
