/* Compact, persistent R & A navigation. */
:root{--sitebar-height:100px}
#sitebar{position:sticky;top:0;z-index:25;flex-direction:column;align-items:flex-start;gap:0;padding:7px max(20px,calc((100vw - 1180px)/2)) 5px}
.brand{min-height:35px;gap:0}.brand-mark{font:italic 25px/1.2 Georgia,serif;border:0;padding:0;letter-spacing:1px}
.top-actions{display:flex;flex-wrap:wrap;gap:6px 24px}.top-actions a{font-size:14px;min-height:40px;padding:6px 0;display:flex;align-items:center}
#app-main>.searchform:first-child{margin-top:0}.trip-toolbar{top:var(--sitebar-height);z-index:15}
html{scroll-padding-top:calc(var(--sitebar-height) + 155px)}

@media(max-width:760px){#sitebar{padding:6px 16px 4px}.brand-mark{font-size:24px}.top-actions{gap:4px 22px}#app-main{padding-top:20px}.country-card h3{font-size:24px}}

.country-heading{margin-top:0;margin-bottom:16px;flex-wrap:wrap;gap:6px 16px}
.country-heading h2{font-size:18px;font-weight:650;letter-spacing:0}
.country-code{font:600 14px/1.4 system-ui,sans-serif;letter-spacing:1.5px;color:var(--muted)}
.country-top{margin-bottom:16px}

@media(max-width:760px){.country-card{min-height:235px}.top-actions{column-gap:20px}.country-heading h2{font-size:18px}}

.trip-toolbar select{width:100%;min-width:0;max-width:none;height:40px;min-height:40px;font-size:16px;line-height:1.25;padding:7px 10px;border-radius:7px;text-overflow:ellipsis}
.trip-toolbar button{min-height:40px;height:40px;font-size:14px;line-height:1.25;padding:7px 11px;border-radius:7px;white-space:nowrap}

<template id="content-romania-2026"><nav><a href="#ro23">09-23 抵達Bucharest｜老城與王國立面</a><a href="#ro24">09-24 Bucharest｜人民宮、革命與Athenaeum音樂會</a><a href="#ro25">09-25 取車 → Curtea de Argeș → Vidraru湖畔</a><a href="#ro26">09-26 Transfăgărășan｜高山道路與冰斗湖</a><a href="#ro27">09-27 Sibiu＋ASTRA｜城市自治與農村技術</a><a href="#ro28">09-28 Biertan → Sighișoara｜教堂堡壘與行會城牆</a><a href="#ro29">09-29 Clock Tower → Viscri → Rupea → Brașov</a><a href="#ro30">09-30 Libearty＋Seven Ladders｜保育與峽谷</a><a href="#ro01">10-01 Cantacuzino → Peleș → Sinaia｜貴族與王室</a><a href="#ro02">10-02 Sinaia → Bucharest｜還車與Spring Palace</a><a href="#ro03">10-03 Bucharest → Veliko Tarnovo</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="ro-intro"><h2>Romania｜喀爾巴阡山、薩克森城鎮與皇家山城</h2><p>2026/9/23–10/3，共11天。依第四部分修正行程，住宿完全固定。9/25住Vidraru湖畔Hotel Valea cu Pești；9/28時鐘塔只看外觀，9/29登塔後經Viscri、Rupea到Brașov；10/1 Pelișor僅外觀。</p><p>全部時間為羅馬尼亞當地夏令時間EEST（UTC+3），比阿爾巴尼亞快一小時。TIA 11:35 → OTP 14:00為各機場當地時間。航班、住宿與巴士依提供的訂單整理；尚未提供景點票券，不將建議時段當成已訂。</p><p>每站可點「導覽」閱讀現場觀察、歷史與故事，再返回當天行程。座標表可直接開Google Maps；山路與峽谷保留明確的替代動線。查核日期：2026/9/22。</p><div class="tablewrap"><table><thead><tr><th>入住日期</th><th>住宿／城市</th><th>交通重點</th></tr></thead><tbody><tr><td>9/23–25</td><td>Central Comfort Suites - Geo12｜Bucharest</td><td>9/23 Ryanair TIA 11:35 → OTP 14:00</td></tr><tr><td>9/25–26</td><td>Hotel Valea cu Pest（Pești）｜Vidraru湖畔</td><td>SIXT 9/25 09:30取車；門市依合約</td></tr><tr><td>9/26–28</td><td>Zenith Apartament Old Town Piata Mare｜Sibiu</td><td>老城停車入口先問房東</td></tr><tr><td>9/28–29</td><td>Gloria Apartments｜Sighișoara</td><td>停車後步行</td></tr><tr><td>9/29–10/1</td><td>Cosmo Studio｜Brașov</td><td>停車條件依訂單，不預設免費車位</td></tr><tr><td>10/1–2</td><td>Upon Boutique｜Sinaia</td><td>隔日還車時間決定出發時間</td></tr><tr><td>10/2–3</td><td>New Boutique Central 2 camere Chic｜Bucharest</td><td>10/2完成還車</td></tr><tr><td>10/3</td><td>FlixBus 10:10 → Veliko Tarnovo</td><td>09:20到電子票指定站點；不猜車站</td></tr></tbody></table></div></section><section id="ro-unesco"><h2>UNESCO世界遺產｜11項與本次路線對照</h2><p>2026/9/24核對UNESCO正式名錄：羅馬尼亞11項（9文化、2自然）。原主線涵蓋2項：防禦教堂村落群與Sighișoara歷史中心；新增Saschiz仍屬同一村落群。只有實際走Olt備案並到訪Arutela，才再涵蓋第3項「羅馬帝國疆界—達契亞」。此處記錄計畫，不表示你已實際到訪。</p><p>標記說明：「UNESCO｜主線」為已排景點；「UNESCO｜新增短停」為順路加入；「UNESCO｜替代／條件式」只在指定方案採用。固定住宿、高山主線、熊保育導覽及Peleș安排保留。</p><p>UNESCO保護有明確邊界與構成點；在附近行車、遠望山林或參觀同類博物館，不自動算到訪。正式世界遺產、預備名單與非物質文化遺產分開標記。</p><div class="tablewrap"><table><thead><tr><th>項次</th><th>正式項目</th><th>列名</th><th>本次判斷</th><th>日期與安排理由</th></tr></thead><tbody><tr><td>1</td><td>Danube Delta｜多瑙河三角洲</td><td>1991｜自然</td><td>不順路</td><td>位於黑海方向；需要獨立濕地／船遊行程，本次不加。</td></tr><tr><td>2</td><td>Churches of Moldavia｜摩爾達維亞教堂</td><td>1993／2010｜文化</td><td>不順路</td><td>Bucovina在北部；不以Sinaia或Curtea的東正教教堂代替計數。</td></tr><tr><td>3</td><td>Hurezi Monastery｜霍雷祖修道院</td><td>1993｜文化</td><td>可繞但本次不建議</td><td>9/26若改DN7，仍須從Râmnicu Vâlcea向西繞行再返回；連參觀應另留約2.5–3小時規劃緩衝，非即時導航估算。優先安全抵Sibiu。</td></tr><tr><td>4</td><td>Villages with Fortified Churches in Transylvania｜防禦教堂村落</td><td>1993／1999｜文化</td><td>已排＋順道新增</td><td>9/28 Biertan；9/29新增Saschiz外觀、原有Viscri；9/30 Prejmer為替代版。它們是同一項的不同構成村落，不是四項世界遺產。</td></tr><tr><td>5</td><td>Dacian Fortresses of the Orăștie Mountains｜達契亞堡壘</td><td>1999｜文化</td><td>本次不加</td><td>六處包含Căpâlna、Sarmizegetusa Regia等；從Sibiu另走西側且涉及山路／步行，會占用ASTRA日。不是Rupea或羅馬軍營。</td></tr><tr><td>6</td><td>Historic Centre of Sighișoara｜歷史中心</td><td>1999｜文化</td><td>已排</td><td>9/28–29城堡區、街巷與塔樓共同理解；Clock Tower是遺產區內地標，不另計一項。</td></tr><tr><td>7</td><td>Wooden Churches of Maramureș｜木造教堂</td><td>1999｜文化</td><td>不順路</td><td>在北部，不能把ASTRA內任何木教堂都算成八座列名教堂之一。</td></tr><tr><td>8</td><td>Ancient and Primeval Beech Forests｜原始山毛櫸林</td><td>跨國自然遺產；羅馬尼亞2017加入</td><td>地理接近，未排進核心區</td><td>Șinca及Cozia有列名林區，但開過DN7、走Seven Ladders或看見山毛櫸，不等於進入列名地塊。需依保護區規則安排另一次健行，本次不為計數加走。</td></tr><tr><td>9</td><td>Roșia Montană Mining Landscape｜金礦景觀</td><td>2021｜文化</td><td>不順路</td><td>在Apuseni山區，需要另外安排交通及礦坑參觀；本次不加。</td></tr><tr><td>10</td><td>Brâncuși Monumental Ensemble of Târgu Jiu｜雕塑紀念群</td><td>2024｜文化</td><td>不順路</td><td>Târgu Jiu在現有動線以西；不能將Bucharest展覽中的照片或作品複製品視為到訪遺產。</td></tr><tr><td>11</td><td>Frontiers of the Roman Empire – Dacia｜羅馬帝國疆界</td><td>2024｜文化</td><td>條件式可新增</td><td>9/26只在採Olt河谷備案時短停Arutela（1718-237）；9/30 Cumidava雖近Libearty，因未確認訪客入口與路況，只列候選、不排固定。</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/statesparties/ro">UNESCO羅馬尼亞正式名錄</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/596/maps/">七個防禦教堂村落與邊界</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/1718/maps/">達契亞羅馬疆界277個構成點</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/1133/maps/">山毛櫸林列名地塊</a></section><section id="ro-unesco-practical"><h2>怎麼加才順｜時間、地圖與取捨</h2><p>9/29 Saschiz位於Sighișoara往Viscri方向的DN13沿線。新增10:35–10:55外觀短停；Viscri改11:40–12:40、午餐至13:15，再往Rupea，保留Brașov傍晚。這是規劃緩衝，遇塞車先刪Saschiz，不靠加速補時間。</p><p>Saschiz官方旅遊頁列週二、三室內關閉。9/29只在公共街道拍教堂與鐘塔；不等管理員、不新增登山丘避難堡。若臨時開放且想深入，改以它取代Rupea，不能三者都延長。</p><p>9/30若優先世界遺產文化，或峽谷不適合：Libearty 11:00結束 → 交通與午餐 → 13:00–14:15 Prejmer → 15:00後Șchei。這個版本取代Seven Ladders＋Zipline，不是追加在健行後。出發前確認當日教堂開放，聯絡+40 268 362 042。</p><p>9/26 Arutela僅用於Olt河谷備案：Hotel → Curtea de Argeș → Pitești → Râmnicu Vâlcea → Căciulata／Arutela → DN7 → Sibiu。參觀20–30分鐘，另留地方道路進出約20–30分鐘；遺址在河的東側，不可在DN7硬停或自行跨越道路。若天候或工地封閉就略過。</p><p>Saschiz可在上午從東南側公共位置向西北拍，較利顺／側光；Prejmer內院常有深陰影，陰天反而容易拍房間與木廊。Arutela以入口、牆基與河谷關係為重點，不為固定光線時刻趕路。</p><div class="tablewrap"><table><thead><tr><th>景點</th><th>定位／Google Maps</th><th>定位性質</th><th>停留</th></tr></thead><tbody><tr><td>Saschiz</td><td>46.194722,24.956111</td><td>UNESCO村落代表座標，非停車入口</td><td>20分鐘外觀</td></tr><tr><td>Prejmer</td><td>45.722500,25.775556</td><td>UNESCO列名村落代表位置，依現場找教堂入口</td><td>60–75分鐘</td></tr><tr><td>Arutela</td><td>45.276411,24.312425</td><td>UNESCO 1718-237遺址代表位置，非指定車位</td><td>20–30分鐘＋進出緩衝</td></tr><tr><td>Cumidava（候選）</td><td>Google Maps搜尋Castrul Roman Cumidava</td><td>正式構成點1718-246；不是山上的Râșnov中世紀城堡</td><td>未核實訪客進入條件，不排固定</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.194722%2C24.956111">Saschiz村中心</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.722500%2C25.775556">Prejmer教堂村落</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.276411%2C24.312425">Arutela軍營</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Castrul%20Roman%20Cumidava%20Rasnov">Cumidava｜僅供核對位置</a></section><section id="ro-unesco-boundaries"><h2>別把相似景點算成UNESCO｜現場辨識</h2><p>Biertan、Viscri、Saschiz與Prejmer屬同一項七村系列；另外三村是Câlnic、Dârjiu、Valea Viilor。本次不再為集點繞行。七村不能全部簡化成德語薩克森社群，Dârjiu也呈現塞凱伊人的文化背景。</p><p>Sibiu老城、ASTRA、Brașov Black Church、Rupea、Transfăgărășan、Bâlea Lake及Bucharest人民宮，不是這11項正式世界遺產。名氣或美感並不取決於列名；Peleș等Sinaia皇家建築出現在預備名單，不等於正式列入。</p><p>Hurezi與Curtea de Argeș是不同修道院；Stavropoleos可以幫助理解Brâncovenesc語彙，但不能代替到訪Hurezi。Cozia修道院也不是Hurezi，更不是原始山毛櫸林地塊。</p><p>Dacian Fortresses是羅馬征服前的達契亞王國防禦遺產；Arutela、Cumidava是羅馬征服後的帝國軍事網絡。Sarmizegetusa Regia與羅馬城市Ulpia Traiana Sarmizegetusa也不能混為一處。</p><p>掛毯織作、Horezu陶藝、傳統刺繡與放牧遷徙屬非物質文化遺產：保護技藝、知識與傳承。ASTRA能幫助理解相關生活方式，但館內一件掛毯或一棟移建木教堂，不因此成為正式世界遺產構成點。</p><a class="map" target="_blank" rel="noopener" href="https://ich.unesco.org/en/state/romania-RO">UNESCO非物質文化遺產｜Romania</a></section><section id="ro-actions"><h2>票務、住宿與當日決策</h2><p>待預約：9/24人民宮10:00英文導覽；9/24 Athenaeum 19:00 David Kadouch；9/30 Libearty 09:45；10/1 Peleș 12:45入場時窗；10/2 Spring Palace英文導覽。此頁未代購、未聯絡業者。</p><p>Peleș 12:45–14:30是可入場時窗，不等於保證12:45英文導覽席位。官網列12:45英文場、入口依序組團，請提早到入口；門票不可退改。Pelișor 9/28–11/3維護關閉，不能安排室內參觀。</p><p>Viscri官方公告：教堂本體及主塔關閉；可看村落博物館、陶器展、South Bastion上層與Bacon Tower。第四部分寫的Gate Tower改依官方名稱Bacon Tower。成人20 RON；車停村外官方免費停車區。</p><p>SIXT目前只確定取車09:30，還車時間與門市尚缺合約確認。10/2先採09:30還車、06:10離開Sinaia；只有收到延至12:00的書面確認才採晚出發版。延長可能產生額外一天費用，不能假設只收幾小時。</p><p>9/26 06:30重新確認DN7C開放、結冰／積雪、能見度、風勢及租車適用條件。9/22降雪後交通未受影響僅代表當時狀況，不是9/26通車保證。9/30 11:10依官方開放、水勢及雷雨決定是否進Seven Ladders。</p><p>住宿位置與停車以各自訂單及房東入口說明為準；沒有提供的地址、車位與設備不補猜。地圖搜尋同名住宿不能代替訂單定位。</p><a class="map" target="_blank" rel="noopener" href="https://peles.ro/en/program-si-taxe/">Peleș官方時段／門票</a><a class="map" target="_blank" rel="noopener" href="https://millionsoffriends.org/en/amp-libearty/visit-the-sanctuary/">Libearty官方導覽</a><a class="map" target="_blank" rel="noopener" href="https://www.biserica-fortificata-viscri.ro/en/">Viscri修復公告</a><a class="map" target="_blank" rel="noopener" href="https://www.iabilet.ro/bilete-david-kadouch-recital-de-pian-bucharest-international-piano-festival-128514/">David Kadouch售票頁</a><a class="map" target="_blank" rel="noopener" href="https://www.politiaromana.ro/ro/info-trafic">道路查詢｜羅馬尼亞警方Infotrafic</a><a class="map" target="_blank" rel="noopener" href="https://www.meteoromania.ro/">氣象局</a></section><section id="ro-context"><h2>隨身導遊｜先讀懂兩個歷史世界</h2><p>Wallachia（瓦拉幾亞）包含Bucharest、Curtea de Argeș和山脈南坡，歷史主軸是東正教王公、鄂圖曼宗主權、現代王國與共產政權。Transylvania（外西凡尼亞）長期處於匈牙利王國及哈布斯堡政治體系，留下德語薩克森城鎮、匈牙利文化、羅馬尼亞社群與多種基督教傳統。翻越山脈也跨越文化地理邊界。</p><p>羅馬尼亞語屬羅曼語族，宗教傳統以東正教為主；語言、信仰與現代國界不是同一張地圖。薩克森人是歷史社群名稱，移民來自不同德語地區，不全來自今日Saxony。不要用「德國城市」抹去同城其他社群。</p><p>本次導覽將史實、地方傳統與小說分開：Manole妻子入牆、Bridge of Lies測謊、Biertan幾百年只有一對離婚都是傳說或未獲可靠統計支持的故事；Dracula小說也不能當Vlad生平。</p><p>教堂遮肩過膝、男性脫帽，不阻擋禮拜；內部拍攝依現場規定。鄉村院門與晾衣空間是私人生活。山路不跟車超速，下坡用適當檔位控制速度；看到熊保持車窗關閉，不餵食、不下車、不停在牠旁邊拍照。</p></section><section id="ro-photo"><h2>必拍點｜方位、順光時段與Google Maps</h2><p>以下座標沿用提供的GPS，屬地標參考點，未逐一實地勘查，不等於停車入口或精確腳架機位。順光／側光是依地理方向推估；天氣、山影、樹蔭與開放範圍會改變結果。藍調在日落後，不能把日落前半小時稱作藍調。</p><div class="tablewrap"><table><thead><tr><th>地點</th><th>緯度,經度</th><th>本次時段（EEST）</th><th>取景與光線</th></tr></thead><tbody><tr><td>Stavropoleos</td><td>44.431742,26.098789</td><td>9/23 17:30後</td><td>庭院多遮蔭，以均勻散射光拍石雕；不保證晚間開門。</td></tr><tr><td>CEC Palace</td><td>44.4320,26.0965</td><td>9/23 18:20–19:10；日落後20分鐘</td><td>主立面朝東，正面順光較適合上午；晚間拍玻璃、燈光與天空，不稱為夕陽正面順光。</td></tr><tr><td>Athenaeum</td><td>44.441306,26.097306</td><td>9/2 <td>近正午光較硬，以側光拍半木構與塔樓；不承諾整棟順光。</td></tr><tr><td>Sinaia Monastery</td><td>45.35533,25.54962</td><td>10/1 15:45–16:30</td><td>西南側光、庭院可能遮蔭；教堂儀式優先。</td></tr><tr><td>Arcul de Triumf</td><td>44.467278,26.078361</td><td>10/2 16:30</td><td>西南光利西南側立面；只走合法過街處，不到車流中央取景。</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.431742%2C26.098789">Stavropoleos｜44.431742,26.098789</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.4320%2C26.0965">CEC Palace｜44.4320,26.0965</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.441306%2C26.097306">Athenaeum｜44.441306,26.097306</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.15679%2C24.67546">Curtea Monastery｜45.15679,24.67546</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.14204%2C24.67574">Princely Church｜45.14204,24.67574</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.34963%2C24.63293">Poenari parking｜45.34963,24.63293</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.35382%2C24.63521">Poenari Fortress｜45.35382,24.63521</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.36632%2C24.63058">Vidraru Dam｜45.36632,24.63058</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.39163%2C24.62723">Hotel Valea cu Pești｜45.39163,24.62723</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.6033%2C24.6172">Bâlea Lake｜45.6033,24.6172</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.7963%2C24.1518">Piața Mare Sibiu｜45.7963,24.1518</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.75394%2C24.11459">ASTRA｜45.75394,24.11459</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.13694%2C24.52694">Biertan｜46.13694,24.52694</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332">Clock Tower｜46.21929,24.79332</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.0549%2C25.0886">Viscri｜46.0549,25.0886</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.03715%2C25.21241">Rupea｜46.03715,25.21241</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.6410%2C25.5880">Black Church｜45.6410,25.5880</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.6429%2C25.5866">White Tower｜45.6429,25.5866</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.593020%2C25.385220">Libearty｜45.593020,25.385220</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.5674%2C25.64368">Seven Ladders｜45.5674,25.64368</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.41395%2C25.54292">Cantacuzino｜45.41395,25.54292</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.35972%2C25.54278">Peleș｜45.35972,25.54278</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.35533%2C25.54962">Sinaia Monastery｜45.35533,25.54962</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.467278%2C26.078361">Arcul de Triumf｜44.467278,26.078361</a></section><section id="ro-sun"><h2>日出、日落與暮光</h2><p>Astral依座標與Europe/Bucharest時區計算，時間取整分；以無山稜遮擋的標準地平線為基準，山區實際直射光可能早很多消失。此表不是天氣預報。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>地點</th><th>日出</th><th>日落</th><th>民用暮光結束</th></tr></thead><tbody><tr><td>2026-09-23</td><td>Bucharest</td><td>07:03</td><td>19:11</td><td>19:40</td></tr><tr><td>2026-09-24</td><td>Bucharest</td><td>07:05</td><td>19:09</td><td>19:38</td></tr><tr><td>2026-09-25</td><td>Vidraru</td><td>07:12</td><td>19:13</td><td>19:43</td></tr><tr><td>2026-09-26</td><td>Bâlea</td><td>07:13</td><td>19:11</td><td>19:41</td></tr><tr><td>2026-09-27</td><td>Sibiu</td><td>07:16</td><td>19:11</td><td>19:41</td></tr><tr><td>2026-09-28</td><td>Sighișoara</td><td>07:15</td><td>19:06</td><td>19:37</td></tr><tr><td>2026-09-29</td><td>Brașov</td><td>07:13</td><td>19:01</td><td>19:31</td></tr><tr><td>2026-10-01</td><td>Sinaia</td><td>07:15</td><td>18:58</td><td>19:28</td></tr></tbody></table></div></section><section id="ro-food"><h2>料理辨識與點餐</h2><p>兩人通常先共享一份湯、一份主菜與一份蔬菜，再視份量加點。餐廳名稱是沿線候選，沒有代訂、也不保證當天座位。駕駛不飲酒。</p><div class="tablewrap"><table><thead><tr><th>料理</th><th>文化與口感</th><th>點餐方式</th></tr></thead><tbody><tr><td>Ciorbă</td><td>帶酸味的湯；牛肚版常有奶油、蒜與蛋黃</td><td>詢問酸度與配料</td></tr><tr><td>Sarmale／Mămăligă</td><td>酸菜包肉米；玉米糊為農村主食</td><td>搭配酸奶油，共享即可</td></tr><tr><td>Bulz</td><td>牧羊起司與玉米糊，可加蛋或肉</td><td>份量厚重，不再同時點大量主食</td></tr><tr><td>Mici／Tochitură</td><td>烤絞肉條／燉肉，常配芥末或玉米糊</td><td>肉類主菜二選一</td></tr><tr><td>Zacuscă</td><td>烤茄子、甜椒保存醬</td><td>秋季早餐配麵包</td></tr><tr><td>Papanași／Cozonac</td><td>乳酪甜點／節慶甜麵包</td><td>Papanași先點一份兩人分享</td></tr></tbody></table></div></section><section class="day" id="ro23"><span class="tag">2026-09-23</span><h2>抵達Bucharest｜老城與王國立面</h2><p>住宿：Central Comfort Suites - Geo12。抵達日只走平緩老城，依航班與交通延誤縮減。</p><div class="slot" id="ro23-1"><div class="time">11:35–17:20</div><div><h3>TIA → OTP、交通與入住</h3><p>Ryanair 11:35起飛、14:00抵達（各地當地時間）；14:50–15:20預估出關。100號巴士或Bolt／Uber，16:30–17:20入住休息。STB工程公告將100／442機場站調整至Plecări共用站，依機場現場標示找站，勿在原Sosiri站空等。</p><p><b>預約：</b>航班與住宿依提供訂單；接駁及入住時間為估算。</p></div></div><div class="slot" id="ro23-2"><div class="time">17:30–18:00</div><div><h3>Piața Unirii → Manuc’s Inn → Curtea Veche</h3><p>從大廣場進入舊城，王公宮廷遺址以外觀為主。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hanul%20lui%20Manuc%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-2">導覽</a></div></div><div class="slot" id="ro23-3"><div class="time">18:00–18:30</div><div><h3>Stavropoleos → Cărturești Carusel</h3><p>小型教堂、庭院石刻與書店；若已關門只看外觀。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.431742%2C26.098789" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-3">導覽</a></div></div><div class="slot" id="ro23-4"><div class="time">18:30–19:40</div><div><h3>CEC Palace → Macca–Villacrosse Passage</h3><p>CEC外觀與玻璃頂商業廊道；日落後再拍燈光與天空。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.4320%2C26.0965" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-4">導覽</a></div></div><div class="slot" id="ro23-5"><div class="time">19:45後</div><div><h3>晚餐與早餐補給</h3><p>Hanu’ lui Manuc或Caru’ cu Bere擇一，依營業及座位決定；買水、優格、水果與早餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Caru%20cu%20Bere%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>下雨先逛書店、拱廊與餐廳庭院；宗教場所入內依開放。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Unirii繞行與Curtea Veche停留，保留入住、晚餐與一段老城。</p></div></section><section class="day" id="ro24"><span class="tag">2026-09-24</span><h2>Bucharest｜人民宮、革命與Athenaeum音樂會</h2><p>住宿：Central Comfort Suites - Geo12。上午權力建築，晚上文化募款象徵；兩者形成整日主題。</p><div class="slot" id="ro24-1"><div class="time">08:45出門；09:30報到；10:00–11:15</div><div><h3>Palace of Parliament</h3><p>預留安檢，帶實體護照；入口依預約說明，不直接導航到正面廣場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Palace%20of%20Parliament%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-1">導覽</a><p><b>預約：</b>目標10:00英文導覽；依官方確認的入口及報到時間。</p></div></div><div class="slot" id="ro24-2"><div class="time">11:20–14:00</div><div><h3>Constitution Square → 午餐 → Cișmigiu</h3><p>11:20–11:45廣場；12:00–13:00午餐；13:15–14:00公園。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Piata%20Constitutiei%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-2">導覽</a></div></div><div class="slot" id="ro24-3"><div class="time">14:15–16:15</div><div><h3>Revolution Square → 國家美術館／咖啡</h3><p>革命廣場45分鐘；美術館只選一個展區，不安排完整館藏。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Revolution%20Square%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-3">導覽</a></div></div><div class="slot" id="ro24-4"><div class="time">16:30–18:20</div><div><h3>Calea Victoriei向北步行與早晚餐</h3><p>CEC → National Military Circle → Casa Capșa → Revolution Square → Athenaeum；17:30左右吃簡餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Calea%20Victoriei%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-4">導覽</a></div></div><div class="slot" id="ro24-5"><div class="time">18:30入場；19:00演出</div><div><h3>David Kadouch｜Bucharest International Piano Festival</h3><p>Athenaeum鋼琴獨奏，售票頁列9/24 19:00，159.08 RON起；目前未購票。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.441306%2C26.097306" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.iabilet.ro/bilete-david-kadouch-recital-de-pian-bucharest-international-piano-festival-128514/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro24-5">導覽</a><p><b>預約：</b>建議購票，非已訂；庫存及價格依結帳頁。</p></div></div><div class="soft"><b>雨天備案</b><p>公園縮短，增加美術館或咖啡；音樂會與人民宮需先確認票。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪美術館、縮短公園；17:30前吃簡餐，18:30抵達音樂廳。</p></div></section><section class="day" id="ro25"><span class="tag">2026-09-25</span><h2>取車 → Curtea de Argeș → Vidraru湖畔</h2><p>住宿：Hotel Valea cu Pești，位於Vidraru湖沿線。已刪除Central Vibe與Curtea住宿，不在隔天重跑水壩。</p><div class="slot" id="ro25-1"><div class="time">09:00–10:10</div><div><h3>SIXT取車與出城</h3><p>09:30取車，拍車身四角、底緣、輪圈、玻璃、車頂、油表與里程。確認門市、10/2歸還時限、燃油規則、rovinieta、救援及山路使用条件。</p><p><b>預約：</b>攜帶護照、台灣駕照、國際駕照及合約要求的主駕駛信用卡；文件以SIXT書面確認為準。</p></div></div><div class="slot" id="ro25-2"><div class="time">12:15–13:10</div><div><h3>Curtea de Argeș Monastery</h3><p>從Bucharest經Pitești方向前往；城市出城可能延誤。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.15679%2C24.67546" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro25-2">導覽</a></div></div><div class="slot" id="ro25-3"><div class="time">13:20–14:00</div><div><h3>Princely Church of Saint Nicholas</h3><p>舊王公宮廷與教堂；若抵達延誤，以外觀或短訪代替。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.14204%2C24.67574" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro25-3">導覽</a></div></div><div class="slot" id="ro25-4"><div class="time">14:00–14:40</div><div><h3>午餐、加油與高山日補給</h3><p>買水、麵包、起司、冷肉、水果、堅果與熱飲；確認飯店早餐能否外帶。不假設飯店客房有廚房。</p></div></div><div class="slot" id="ro25-5"><div class="time">15:20決定；約15:30–17:30選配</div><div><h3>Poenari Fortress</h3><p>約1,480階，僅在官方團很快成行、天乾且體力足時登頂；含往返至少保留約2小時。等待超過20–30分鐘就跳過。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.34963%2C24.63293" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.cjarges.ro/en/programul-evenimentelor-cultural-artistice-in-perioada-15-23-august-2026" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro25-5">導覽</a></div></div><div class="slot" id="ro25-6"><div class="time">不登堡約16:00；登堡約17:45</div><div><h3>Vidraru Dam → Hotel Valea cu Pești</h3><p>水壩停20–30分鐘；不登堡約17:00入住，登堡約18:30。飯店在湖東岸沿線，並非湖最北端。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.36632%2C24.63058" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro25-6">導覽</a></div></div><div class="slot" id="ro25-7"><div class="time">18:20–19:10視抵達；晚餐後早睡</div><div><h3>湖畔露台與隔日路況準備</h3><p>看夕照、整理防風保暖層，確認外帶早餐；明早06:30決策，不預設高山健行。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.39163%2C24.62723" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>Poenari取消登階；修道院後補給，再沿正式道路抵湖畔住宿。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>第一個刪Poenari登頂，其次縮短Princely Church；保留補給、加油、白天山路與休息。</p></div></section><section class="day" id="ro26"><span class="tag">2026-09-26</span><h2>Transfăgărășan｜高山道路與冰斗湖</h2><p>住宿：Zenith Apartament Old Town Piata Mare，Sibiu。高山段只在正式開放且當日條件適合時通行；不安排必走Capra Saddle。</p><div class="slot" id="ro26-1"><div class="time">06:30–07:10</div><div><h3>Go／No-Go與早餐</h3><p>查警方／道路單位公告、Bâlea即時溫度、降雪結冰、風勢與能見度。9/22初雪後路況正常只是歷史快照。若封路沒有明確上午恢復時間，直接南返走DN7備案。</p><p><b>預約：</b>已設定9/26 06:30羅馬尼亞當地時間檢查提醒；現場告示與官方管制優先。</p></div></div><div class="slot" id="ro26-2"><div class="time">07:10–09:15</div><div><h3>Vidraru沿湖北上</h3><p>07:10離店，水壩已於前日看過。彎道、路面與野生動物可能使車速很低。</p><a class="guide-link" href="#guide-ro26-2">導覽</a></div></div><div class="slot" id="ro26-3"><div class="time">09:45–11:00</div><div><h3>Capra Waterfall與南坡地形</h3><p>瀑布短停約25分鐘，再往高山；時間是彈性窗口，依道路實況調整。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cascada%20Capra%20Romania" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro26-3">導覽</a></div></div><div class="slot" id="ro26-4"><div class="time">11:00–12:45</div><div><h3>Bâlea Lake</h3><p>簡短湖邊散步與自備午餐；不預設完整環湖或上Capra Saddle，結冰及封閉步段不走。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.6033%2C24.6172" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro26-4">導覽</a></div></div><div class="slot" id="ro26-5"><div class="time">12:50–15:00</div><div><h3>山頂隧道 → 北側髮夾彎 → Bâlea Cascadă</h3><p>13:00–14:15觀景；14:30–15:00咖啡與洗手間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Balea%20Cascada" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro26-5">導覽</a></div></div><div class="slot" id="ro26-6"><div class="time">16:30–17:30入住；18:30晚餐</div><div><h3>Sibiu入住與夜景</h3><p>Crama Sibiul Vechi可作晚餐候選，先確認座位。劇場節若有適合語言及時間的節目才加入，不為活動壓縮山路。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.7963%2C24.1518" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="ro26-unesco-arutela"><div class="time">僅Olt河谷備案｜途中20–30分鐘</div><div><h3>UNESCO條件式新增｜Arutela羅馬軍營</h3><p>僅當DN7C不適合而南返改走DN7時加入；高山版不去。Arutela為「羅馬帝國疆界—達契亞」構成點1718-237，可讓本次路線多涵蓋一項正式世界遺產。時間取決於改道，勿與Bâlea排在同一天。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.276411%2C24.312425" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://romania-atractiva.ro/ro/profiles/castrul-roman-arutela" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro26-unesco-arutela">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>道路關閉或積雪結冰、強風濃霧不宜通行：Hotel → Curtea de Argeș → Pitești → Râmnicu Vâlcea → DN7 Olt Valley → Sibiu。當天也查DN7施工與管制，按導航加入休息，直接前往住宿。 可在Căciulata附近加入Arutela20–30分鐘（另留進出緩衝）；晚出發、雨勢大或施工限制就直接赴Sibiu。不加入Hurezi繞路。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪高處步道，再縮短湖邊停留；道路條件不適合就改線，不以已付款住宿作為冒險理由。</p></div></section><section class="day" id="ro27"><span class="tag">2026-09-27</span><h2>Sibiu＋ASTRA｜城市自治與農村技術</h2><p>住宿：Zenith Apartament Old Town Piata Mare。ASTRA保留約4小時45分鐘；不與17:00音樂會重疊。</p><div class="slot" id="ro27-1"><div class="time">07:10–08:00；08:30早餐</div><div><h3>Piața Mare → Council Tower → Piața Mică</h3><p>先拍空景與屋頂眼睛；登塔留到正式開放後。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.7963%2C24.1518" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro27-1">導覽</a></div></div><div class="slot" id="ro27-2"><div class="time">09:00–11:30</div><div><h3>Huet Square、Lutheran Cathedral與Lower Town</h3><p>Council Tower視開放登塔 → Bridge of Lies → Huet → Evangelical Cathedral → Passage of Stairs → Lower Town。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bridge%20of%20Lies%20Sibiu" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro27-2">導覽</a></div></div><div class="slot" id="ro27-3"><div class="time">11:45–12:20</div><div><h3>午餐與前往ASTRA</h3><p>Piata Mica簡餐；開車或叫車到露天博物館，勿把步行路程算成市中心景點距離。</p></div></div><div class="slot" id="ro27-4"><div class="time">12:30–17:15</div><div><h3>ASTRA Museum</h3><p>選水力／風力、牧民住宅、木教堂與湖畔路線，預留步行距離。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.75394%2C24.11459" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzeulastra.ro/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro27-4">導覽</a></div></div><div class="slot" id="ro27-5"><div class="time">選配17:00；主線18:15–19:15</div><div><h3>Duo Noema或老城黃昏</h3><p>Duo Noema「Beethoven &amp; Enescu」9/27 17:00 Sala Oglinzilor，主辦方列免費。要參加需15:45離ASTRA；主線則17:15離館後回老城拍照。</p><a class="map" href="https://stagiuneacamerala.ro/event/odae-cum-harmoniis-duo-noema/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="soft"><b>雨天備案</b><p>老城以教堂與咖啡休息穿插；ASTRA可看有開放的室內展示，雷雨時縮短露天段。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>保留ASTRA重點，先刪音樂會選項與重複夜景；如很想聽Enescu，15:45離館。</p></div></section><section class="day" id="ro28"><span class="tag">2026-09-28</span><h2>Biertan → Sighișoara｜教堂堡壘與行會城牆</h2><p>住宿：Gloria Apartments。Biertan星期一可依公布時段參觀；Clock Tower室內改明早。</p><div class="slot" id="ro28-1"><div class="time">08:20出發；10:00–12:00</div><div><h3>UNESCO｜Biertan Fortified Church</h3><p>【主線｜第4項防禦教堂村落群】09:50抵達。市政府列9–10月每天10–17，13–14午休；12–13午餐與村落散步，13:10離開。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.13694%2C24.52694" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://comunabiertan.ro/turism/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro28-1">導覽</a></div></div><div class="slot" id="ro28-2"><div class="time">14:20–14:40入住；15:00–16:15</div><div><h3>UNESCO｜Sighișoara歷史中心與Clock Tower外觀</h3><p>【主線｜第6項歷史中心】Citadel Square → Vlad Dracul House → Venetian House → 行會塔樓。今天星期一不安排History Museum內部。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro28-2">導覽</a></div></div><div class="slot" id="ro28-3"><div class="time">16:15–18:20</div><div><h3>Covered Scholars’ Stairs → Church on the Hill → Saxon Cemetery</h3><p>先確認教堂當日最後入場，關閉則外觀；下山拍彩色屋頂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20on%20the%20Hill%20Sighisoara" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro28-3">導覽</a></div></div><div class="slot" id="ro28-4"><div class="time">18:20–19:30</div><div><h3>Clock Tower與廣場黃昏、晚餐</h3><p>日落前拍側光，日落後拍藍調；Joseph T、Alte Post或Casa Georgius Krauss作餐廳候選，依當天營業。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>村落步行縮短，教堂按開放參觀；墓園與陡階濕滑時跳過。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>午餐縮短，不拖到13:00才進Biertan；Sighișoara優先城堡主街與教堂，塔內留明早。</p></div></section><section class="day" id="ro29"><span class="tag">2026-09-29</span><h2>Clock Tower → Viscri → Rupea → Brașov</h2><p>住宿：Cosmo Studio。Viscri按修復狀況縮短；Rupea保留為可刪支線，保住Black Church室內。 新增Saschiz20分鐘外觀，Viscri與午餐稍縮短。</p><div class="slot" id="ro29-1"><div class="time">07:15–08:00晨拍；09:00–10:00</div><div><h3>Clock Tower／History Museum</h3><p>【第6項歷史中心內的地標，非獨立一項】早餐、退房後參觀，行李寄放或安全收妥；10:10出發。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://visitmures.com/sighisoara/patrimoniu/muzee/muzeul-de-istorie-sighisoara" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro29-1">導覽</a></div></div><div class="slot" id="ro29-unesco-saschiz"><div class="time">10:35–10:55｜新增外觀短停</div><div><h3>UNESCO｜Saschiz防禦教堂村落</h3><p>10:10離開Sighișoara後沿DN13短停；9/29星期二，官方頁列室內關閉，只看公共街道可見的St. Stephen教堂及鐘塔。10:55離開，約11:40到Viscri。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.194722%2C24.956111" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://turism.saschiz.ro/locatii/biserica-sfantul-stefan" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro29-unesco-saschiz">導覽</a></div></div><div class="slot" id="ro29-2"><div class="time">11:40–12:40；12:40–13:15午餐</div><div><h3>UNESCO｜Viscri村落與修復中的防禦教堂</h3><p>【主線｜第4項防禦教堂村落群】主教堂及主塔關閉。看村落博物館、陶器展、South Bastion上層、Bacon Tower；成人20 RON，村外官方停車免費。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.0549%2C25.0886" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.biserica-fortificata-viscri.ro/en/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro29-2">導覽</a></div></div><div class="slot" id="ro29-3"><div class="time">14:00–15:00</div><div><h3>Rupea Fortress</h3><p>新增山丘堡壘，15:10前離開；約16:20到Brașov。公布時段需購票前再核對，遇延誤可整站刪除。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.03715%2C25.21241" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro29-3">導覽</a></div></div><div class="slot" id="ro29-4"><div class="time">17:00–18:00</div><div><h3>Black Church室內</h3><p>停車入住後步行／叫車进老城；週二公布時段至19:00，宗教活動可能調整，先入館再拍廣場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.6410%2C25.5880" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro29-4">導覽</a></div></div><div class="slot" id="ro29-5"><div class="time">18:10–19:05</div><div><h3>White Tower → Council Square</h3><p>天乾且有體力才走上觀景步道，否則在廣場拍夕照。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.6429%2C25.5866" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro29-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Rupea高處濕滑或雷雨則取消；Viscri看可開放展示與短村街。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Saschiz短停，再刪Rupea；保留Viscri短訪與Brașov Black Church入館，不能為新增景點壓縮行車安全。</p></div></section><section class="day" id="ro30"><span class="tag">2026-09-30</span><h2>Libearty＋Seven Ladders｜保育與峽谷</h2><p>住宿：Cosmo Studio。上午導覽先訂；下午戶外依當日開放與天候，不把長程模型寫成確定晴雨。</p><div class="slot" id="ro30-1"><div class="time">08:15出發；09:45–11:00</div><div><h3>Libearty Bear Sanctuary</h3><p>官方Classic Tour週二至日09:45／11:15，約75分鐘、2公里；成人95 RON起，語言與日期購票選定。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.593020%2C25.385220" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://millionsoffriends.org/en/amp-libearty/visit-the-sanctuary/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro30-1">導覽</a><p><b>預約：</b>建議09:45英文場；尚未購票，容量有限。</p></div></div><div class="slot" id="ro30-2"><div class="time">11:10決策；約12:00起登</div><div><h3>Dâmbul Morii → Seven Ladders入口</h3><p>先吃自備簡餐，查當日峽谷／滑索開放。正常潮濕不等於必須取消，但持續雨、雷暴、水勢異常及工作人員警告均不進入。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Dambul%20Morii%20Seven%20Ladders%20trailhead" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro30-2">導覽</a></div></div><div class="slot" id="ro30-3"><div class="time">13:00–14:00；14:00–16:00返程</div><div><h3>Seven Ladders Canyon與可選Zipline</h3><p>全程抓3–4小時，不把峽谷本體長度當成總健行距離。滑索依當天時間、體重限制與營運確認。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.5674%2C25.64368" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro30-3">導覽</a></div></div><div class="slot" id="ro30-4"><div class="time">替代峽谷｜13:00–14:15 Prejmer；15:00後Șchei</div><div><h3>UNESCO替代版｜Prejmer＋Șchei</h3><p>【第4項防禦教堂村落群】Libearty後經交通與午餐，改走Prejmer。雨天或想優先完整防禦教堂都可採用；與Seven Ladders互斥。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.722500%2C25.775556" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://kirchenburgen.org/en/location/tartlau-prejmer/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro30-4">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Libearty後改Prejmer Fortified Church → Șchei → First Romanian School／St. Nicholas；各館依開放。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先取消Zipline，再縮短峽谷外步道；有雷暴、持續雨、水量警告或官方封閉，整段峽谷取消。</p></div></section><section class="day" id="ro01"><span class="tag">2026-10-01</span><h2>Cantacuzino → Peleș → Sinaia｜貴族與王室</h2><p>住宿：Upon Boutique。Cantacuzino 10:00才入場；Pelișor室內維護關閉，外觀移至Peleș結束後，時間不重疊。</p><div class="slot" id="ro01-1"><div class="time">07:45退房；08:20出發；09:25–09:55</div><div><h3>Brașov → Bușteni</h3><p>咖啡與山景；道路時間留彈性，未到開門時間不安排入館。</p></div></div><div class="slot" id="ro01-2"><div class="time">10:00–11:00</div><div><h3>Cantacuzino Castle</h3><p>週一至四10:00開始，室內票依當期展示選擇；11:00離開前往Sinaia。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.41395%2C25.54292" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.cantacuzinocastle.com/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro01-2">導覽</a></div></div><div class="slot" id="ro01-3"><div class="time">11:00–11:50交通；11:50–12:35外觀</div><div><h3>Peleș庭園與入場準備</h3><p>包含停車及步行，先拍外觀，提早到售票指定入口。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.35972%2C25.54278" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro01-3">導覽</a></div></div><div class="slot" id="ro01-4"><div class="time">12:45–14:30</div><div><h3>Peleș Castle室內</h3><p>100 RON成人參考。12:45–14:30為入場時窗；目標12:45英文導覽，依入口組團與票務規則，非已預約成功。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.35972%2C25.54278" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://peles.ro/en/program-si-taxe/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro01-4">導覽</a><p><b>預約：</b>需購票；英文12:45組團不等於購買時窗就保證席位。</p></div></div><div class="slot" id="ro01-5"><div class="time">14:30–14:50；14:50–15:30午餐</div><div><h3>Pelișor僅外觀</h3><p>2026/9/28–11/3全館清潔及預防性維護；不安排室內，也不與Peleș導覽重疊。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Pelisor%20Castle%20Sinaia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://peles.ro/en/anunturi/in-perioada-28-septembrie-3-noiembrie-2026-castelul-pelisor-va-fi-inchis-pentru-curatenie-generala-si-conservare-preventiva/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro01-5">導覽</a></div></div><div class="slot" id="ro01-6"><div class="time">15:45–16:30</div><div><h3>Sinaia Monastery</h3><p>午餐後參觀，16:45–17:15入住。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.35533%2C25.54962" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro01-6">導覽</a></div></div><div class="slot" id="ro01-7"><div class="time">17:30–19:00</div><div><h3>Dimitrie Ghica Park與Casino外觀</h3><p>步行散步、晚餐；隔天09:30還車版需早睡。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sinaia%20Casino" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro01-7">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>山景看不到仍可看建築；庭園縮短、優先已訂Peleș時窗。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>若DN1延誤，先縮短或刪Cantacuzino，保留Peleș；下午再刪Casino散步。</p></div></section><section class="day" id="ro02"><span class="tag">2026-10-02</span><h2>Sinaia → Bucharest｜還車與Spring Palace</h2><p>住宿：New Boutique Central 2 camere Chic。預設09:30還車；延至12:00須已有SIXT書面確認，不能把建議當成已修改。</p><div class="slot" id="ro02-1"><div class="time">05:50起床；06:10出發；09:30完成</div><div><h3>SIXT還車｜主方案</h3><p>08:30–08:45補至合約要求油量，08:45–09:00到指定門市，09:30完成。DN1車流與事故留彈性；記錄車況、里程油量並保留交車文件。</p><p><b>預約：</b>確切門市、截止時間、燃油及費用以租约為準。</p></div></div><div class="slot" id="ro02-2"><div class="time">替代：07:30早餐；08:15出發</div><div><h3>僅限已確認12:00還車</h3><p>約11:30–12:00還車，12:30後才寄放行李及午餐；Spring Palace應改14:30或15:00且先取得票。不能套用主方案10:30寄物時間。</p></div></div><div class="slot" id="ro02-3"><div class="time">主方案10:30–12:45</div><div><h3>寄放行李、咖啡與午餐</h3><p>提早寄物需住宿同意，不預設房間已能入住。準備下午導覽票及翌日巴士站點。</p></div></div><div class="slot" id="ro02-4"><div class="time">主方案13:30–14:30</div><div><h3>Spring Palace／Ceaușescu Mansion</h3><p>Bulevardul Primăverii 50；隨英文或羅文導覽，約45分鐘，留報到緩衝。室內不攝影，依當日館規。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Casa%20Ceausescu%20Bulevardul%20Primaverii%2050" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://casaceausescu.ro/en/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro02-4">導覽</a><p><b>預約：</b>需確認英文場與報到時間。</p></div></div><div class="slot" id="ro02-5"><div class="time">15:15–17:15</div><div><h3>King Michael I Park → Arcul de Triumf</h3><p>公園休息後看凱旋門外觀；18:00後回勝利大道晚餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.467278%2C26.078361" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro02-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>公園與凱旋門縮短，保留已預訂室內導覽；沒票則美術館／咖啡。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>還車優先於觀光。若延時還車版拖晚，改晚一場Spring Palace或取消，不趕路。</p></div></section><section class="day" id="ro03"><span class="tag">2026-10-03</span><h2>Bucharest → Veliko Tarnovo</h2><p>FlixBus 10:10。電子票完整站名、地址與營運更新為唯一上車點依據，本站不猜Militari或Filaret。</p><div class="slot" id="ro03-1"><div class="time">07:30–09:20</div><div><h3>早餐、退房與抵達票面站點</h3><p>07:30起床、08:00早餐、08:40退房；08:45–09:00叫車為市區估算，先按電子票地址重新計算。最晚09:20到站。</p><a class="guide-link" href="#guide-ro03-1">導覽</a></div></div><div class="slot" id="ro03-2"><div class="time">10:10</div><div><h3>FlixBus出發</h3><p>發車時間依提供車票；到達時間未提供，不補猜。羅馬尼亞與保加利亞當時同為UTC+3。</p></div></div><div class="soft"><b>雨天備案</b><p>雨天提前叫車，行李防水；車站候車條件依票面站點。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>取消所有早餐後觀光，保留最晚09:20到站；遠郊站點或交通差需再提早。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>人民宮</td><td>約85 RON</td><td>成人</td><td>提供資料參考，預約再確認</td></tr><tr><td>Kadouch獨奏會</td><td>159.08 RON起</td><td>每人</td><td>9/22售票頁；未購票</td></tr><tr><td>Poenari</td><td>約30 RON</td><td>成人</td><td>參考；團體與開放再確認</td></tr><tr><td>Viscri修復期間</td><td>20 RON</td><td>成人</td><td>官方公告；主教堂與主塔關閉</td></tr><tr><td>Libearty Classic</td><td>95 RON起</td><td>成人</td><td>官方價格起點；依日期語言結帳</td></tr><tr><td>Peleș</td><td>100 RON</td><td>成人</td><td>官網；指定時窗，不可退改</td></tr><tr><td>Biertan、Clock Tower、Rupea、ASTRA、Black Church</td><td>依各場館現場／購票頁</td><td>每人</td><td>不沿用未核實舊票價</td></tr><tr><td>Seven Ladders與Zipline</td><td>依路線與當日營運報價</td><td>每人</td><td>未預訂，滑索非必選</td></tr><tr><td>SIXT延時還車</td><td>依書面報價</td><td>每筆合約</td><td>未申請變更，可能按租車日計費</td></tr></tbody></table></div><p>使用RON結帳並保留適量現金。景點、停車、餐飲與租車延時分開計算；住宿與交通已訂不代表活動門票已訂。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-ro23-2"><summary>Piața Unirii → Manuc’s Inn → Curtea Veche｜導覽</summary><h3>現場看什麼</h3><p>在Unirii先看巨大街廓與整治河道，再走入Manuc庭院：環形走廊把住宿、貨物與商人活動包在可控制的空間裡。Curtea Veche注意宮廷與市場距離，理解城市如何圍繞王公據點生長。</p><h3>歷史背景</h3><p>Bucharest老城結合瓦拉幾亞宮廷、巴爾幹市場與後來的銀行商業街。Vlad Țepeș與Bucharest王公據點有歷史聯繫；他處在鄂圖曼、匈牙利與本地貴族競爭的政治環境。</p><h3>相關故事</h3><p>Manuc的商旅驛站格局可和Skopje的han比較：防護貨物、集中旅客與商業交易都比今天的飯店休閒功能重要。Dracula是19世紀小說角色，不能拿來解釋15世紀所有政治暴力。</p><h3>實用提醒</h3><p>庭院餐廳可能需消費或受活動限制；遺址內部不預設開放。</p><a class="guide-return" href="#ro23-2">回到行程</a></details><details class="guide-card" id="guide-ro23-3"><summary>Stavropoleos → Cărturești Carusel｜導覽</summary><h3>現場看什麼</h3><p>Stavropoleos由柱頭、拱廊、纏繞植物石雕開始看，再看尺度緊湊的庭院。書店則看修復後的採光、樓梯與舊商業樓層如何轉為文化零售。</p><h3>歷史背景</h3><p>Brâncovenesc風格將東正教空間、巴爾幹裝飾與文藝復興語彙結合，與17至18世紀瓦拉幾亞王公文化相關。今天書店代表的是21世紀老城再利用，而非中古圖書館。</p><h3>相關故事</h3><p>庭院保存的碑石與建築碎片提醒人，城市遺產經歷拆除、地震與重建；精緻小教堂常比巨型建築更能保留工匠手藝。</p><h3>實用提醒</h3><p>禮拜中不拍信徒；書店樓梯留通行空間。</p><a class="guide-return" href="#ro23-3">回到行程</a></details><details class="guide-card" id="guide-ro23-4"><summary>CEC Palace → Macca–Villacrosse Passage｜導覽</summary><h3>現場看什麼</h3><p>CEC看穹頂、柱式與銀行立面的對稱性；廊道看黃玻璃如何把自然光變暖，店面連續排列如何延長街道生活。</p><h3>歷史背景</h3><p>19世紀末的銀行、旅館與大道，是羅馬尼亞王國借用法國城市語言表現現代化的方式。「小巴黎」指特定時期的菁英文化，不代表整座城完全仿巴黎。</p><h3>相關故事</h3><p>有頂商業街在雨雪與泥濘年代提供遮蔽的購物、社交空間；今天水煙、餐飲與觀光則是另一層使用史。</p><h3>實用提醒</h3><p>CEC朝東主立面早晨較順光，今晚重點是藍調而非正面夕照。</p><a class="guide-return" href="#ro23-4">回到行程</a></details><details class="guide-card" id="guide-ro23-5"><summary>晚餐與早餐補給｜導覽</summary><h3>現場看什麼</h3><p>兩人可共享酸湯、sarmale與mici，再決定是否加甜點。Caru’ cu Bere可觀察木作、彩繪與歷史餐廳空間。</p><h3>歷史背景</h3><p>Ciorbă的酸味可來自發酵麥麩液、醋或酸菜汁；mămăligă是玉米主食，sarmale反映巴爾幹共享飲食。</p><h3>相關故事</h3><p>Papanași是乳酪麵糰甜點，酸奶油與果醬平衡油炸口感；通常先點一份共享。</p><h3>實用提醒</h3><p>餐廳未預訂；先看菜單與總份量。</p><a class="guide-return" href="#ro23-5">回到行程</a></details><details class="guide-card" id="guide-ro24-1"><summary>Palace of Parliament｜導覽</summary><h3>現場看什麼</h3><p>進門後比較樓梯寬度、天花高度與人的尺度。觀察石材、地毯、木作與水晶：材料來源與巨大用量本身就是政治訊息。</p><h3>歷史背景</h3><p>1977年地震後，Ceaușescu政權推動大規模都市改造，拆除舊街區、住宅及宗教建築。人民宮與Civic Centre建立可供集會與權力展示的首都軸線。</p><h3>相關故事</h3><p>普通居民面臨能源與消費限制時，國家把大量資源投入宏大工程；參观只見建築一部分，也足以比較公共口號與實際資源分配。</p><h3>實用提醒</h3><p>約85 RON為提供資料參考價，購票再核對。小團需提前電話確認；尚未預約。</p><a class="guide-return" href="#ro24-1">回到行程</a></details><details class="guide-card" id="guide-ro24-2"><summary>Constitution Square → 午餐 → Cișmigiu｜導覽</summary><h3>現場看什麼</h3><p>從廣場回望巨大軸線，再在公園看彎曲步道、長椅與湖岸。兩種公共空間如何對待人的尺度，現場很容易比較。</p><h3>歷史背景</h3><p>廣場服務政治儀式與建築視線；19世紀城市公園則與公共衛生、休閒和市民生活相關。</p><h3>相關故事</h3><p>公園下棋、遛狗與長時間聊天的居民，是首都歷史之外仍在延續的日常。</p><h3>實用提醒</h3><p>人民宮東面上午較利正面光；不在車道中央取景。</p><a class="guide-return" href="#ro24-2">回到行程</a></details><details class="guide-card" id="guide-ro24-3"><summary>Revolution Square → 國家美術館／咖啡｜導覽</summary><h3>現場看什麼</h3><p>辨認Royal Palace、舊共產黨中央大樓與革命紀念物，三者分別代表王國、威權政權與轉型後記憶。</p><h3>歷史背景</h3><p>1989年12月21日，Ceaușescu公開演說遭到騷動與噓聲，直播中的失控打破受安排的支持場景；次日他從屋頂搭直升機離開。</p><h3>相關故事</h3><p>同一廣場的建築不是和諧年代陳列，而是不同行政與政治制度留下的空間。紀念物如何詮釋革命，也属于後來的公共討論。</p><h3>實用提醒</h3><p>若人民宮延誤，美術館改咖啡，保留晚上入場緩衝。</p><a class="guide-return" href="#ro24-3">回到行程</a></details><details class="guide-card" id="guide-ro24-4"><summary>Calea Victoriei向北步行與早晚餐｜導覽</summary><h3>現場看什麼</h3><p>比較相鄰法式宮殿、共產公寓與當代玻璃店面，留意立面後方建築實際深度。</p><h3>歷史背景</h3><p>勝利大道前身是連接王宮與外圍道路的交通線，王國時期成為飯店、精品、政治與文化機構聚集的社交舞台。</p><h3>相關故事</h3><p>Casa Capșa等咖啡餐飲場所曾讓文人、政治人物與商界共用一個公共客廳；喝咖啡也能是觀察社會的方式。</p><h3>實用提醒</h3><p>不為追完整日落耽誤音樂會。</p><a class="guide-return" href="#ro24-4">回到行程</a></details><details class="guide-card" id="guide-ro24-5"><summary>David Kadouch｜Bucharest International Piano Festival｜導覽</summary><h3>現場看什麼</h3><p>入場看圓形音樂廳的環形歷史壁畫與座席如何包圍舞台，再以聲音感受建築。節目包括Chopin、Liszt、Ravel、Fauré、Barber、Tchaikovsky，實際曲目以主辦方當日為準。</p><h3>歷史背景</h3><p>Athenaeum於19世紀末興建，是羅馬尼亞王國文化認同的象徵。公共募款口號「給Athenaeum一個leu」表達文化建設也需要社會參與。</p><h3>相關故事</h3><p>與上午人民宮比較：兩者都表現國家形象，但募款音樂殿堂與獨裁政權的巨型工程，在資源來源與公民關係上很不同。</p><h3>實用提醒</h3><p>若不購票，改查當日白天參觀時段；不能假設可於演出前免費參觀。演出結束時間依節目，不虛設21:00準時結束。</p><a class="guide-return" href="#ro24-5">回到行程</a></details><details class="guide-card" id="guide-ro25-2"><summary>Curtea de Argeș Monastery｜導覽</summary><h3>現場看什麼</h3><p>先繞外牆看幾何雕刻、裝飾帶與扭轉塔，再看王室墓葬的敘事。把石雕當成細工閱讀，比只拍整棟更能理解工藝。</p><h3>歷史背景</h3><p>16世紀Neagoe Basarab時期的修道院連結瓦拉幾亞王權與東正教；後來王室修復、安葬於此，把現代王國與中世紀正統相接。</p><h3>相關故事</h3><p>Master Manole為讓牆不再倒塌而犧牲妻子Ana，是民間傳說，不是建築史紀錄。其「創作以生命換永恆」的母題，在巴爾幹其他地方也可見。</p><h3>實用提醒</h3><p>與10/1 Peleș比較：此處是王室死亡與國家記憶，Peleș則是生活、外交和國家形象。</p><a class="guide-return" href="#ro25-2">回到行程</a></details><details class="guide-card" id="guide-ro25-3"><summary>Princely Church of Saint Nicholas｜導覽</summary><h3>現場看什麼</h3><p>看教堂空間與殘存宮廷位置，內部若開放，留意壁畫人物層次與統治者形象。</p><h3>歷史背景</h3><p>Curtea意為宮廷；14世紀城市是瓦拉幾亞政治與宗教中心，1359年設立都主教座。後來政治重心轉移，仍留下早期國家形成的證據。</p><h3>相關故事</h3><p>與裝飾華麗的修道院相比，王公教堂更接近早期王庭的政治核心；大小不等於歷史重要性。</p><h3>實用提醒</h3><p>不得以閃光燈拍壁畫；內部開放依現場。</p><a class="guide-return" href="#ro25-3">回到行程</a></details><details class="guide-card" id="guide-ro25-5"><summary>Poenari Fortress｜導覽</summary><h3>現場看什麼</h3><p>從河谷看山脊如何控制通道，登頂後辨認城牆與坡度的配合；防禦視野比豪華室內更重要。</p><h3>歷史背景</h3><p>此處有較早堡壘基礎，Vlad Țepeș在15世紀加固、使用它，與Vlad的聯繫比Bran的小說包裝直接。</p><h3>相關故事</h3><p>山頂堡壘需要糧食、水與守軍補給，最陡不一定最實用；把樓梯當成今天的進出條件，也能想像過去運輸的成本。</p><h3>實用提醒</h3><p>官方2026年8月公告10:00–18:00、最後上山17:00、僅組織團體；9/25出發前再確認。不能自己湊人便擅自上山。30 RON為參考，現場核對。</p><a class="guide-return" href="#ro25-5">回到行程</a></details><details class="guide-card" id="guide-ro25-6"><summary>Vidraru Dam → Hotel Valea cu Pești｜導覽</summary><h3>現場看什麼</h3><p>壩的一側是平靜蓄水湖，另一側是深谷；看弧形壩如何把水壓傳至兩側山體。</p><h3>歷史背景</h3><p>1966年完工的水力工程體現社會主義工業化、能源與控制水系的企圖。今日休閒湖景來自人造蓄水，而非天然高山湖。</p><h3>相關故事</h3><p>從水壩到隔天冰斗湖，能比較兩種完全不同的湖泊生成方式：工程阻水與冰河侵蝕。</p><h3>實用提醒</h3><p>只在正式停車處停靠；若登堡後延誤，不為湖畔夕照加速。</p><a class="guide-return" href="#ro25-6">回到行程</a></details><details class="guide-card" id="guide-ro26-2"><summary>Vidraru沿湖北上｜導覽</summary><h3>現場看什麼</h3><p>留意森林帶、河谷與聚落逐漸消失；在合法休息點觀察坡度，不在盲彎臨停。</p><h3>歷史背景</h3><p>Transfăgărășan主要在1970–1974年間興建，兼具軍事交通、山區基礎建設與政權展示功能，常與1968年後的國防焦慮相聯。</p><h3>相關故事</h3><p>把它簡化成領袖為觀光蓋的路會倒置歷史；風景公路是後來的第二生命，工程背後還有艱苦施工與人命代價。</p><h3>實用提醒</h3><p>熊可能把汽車與食物連結。保持車窗關閉、不要跟停餵食，也不要靠近熊後再找角度拍照。</p><a class="guide-return" href="#ro26-2">回到行程</a></details><details class="guide-card" id="guide-ro26-3"><summary>Capra Waterfall與南坡地形｜導覽</summary><h3>現場看什麼</h3><p>由闊葉林、針葉林、矮灌木到草甸與裸岩，觀察海拔變化如何縮短植物生長季。</p><h3>歷史背景</h3><p>山脈既是自然屏障，也是瓦拉幾亞與外西凡尼亞歷史交通的阻隔；公路打通的是地形，也是區域交流。</p><h3>相關故事</h3><p>山下舒適不代表山頂同樣溫暖。風、陰影和雨雪會讓短短數百公尺的步行也成為不同等級的活動。</p><h3>實用提醒</h3><p>沒合法停車空間就略過瀑布；不跨護欄、不進行車線。</p><a class="guide-return" href="#ro26-3">回到行程</a></details><details class="guide-card" id="guide-ro26-4"><summary>Bâlea Lake｜導覽</summary><h3>現場看什麼</h3><p>先看湖後方碗狀山壁、碎石坡與樹線，再看湖泊與隧道的位置。這是閱讀冰斗地形的最佳停點。</p><h3>歷史背景</h3><p>冰河在山谷上端侵蝕出盆狀凹地，冰退後水留在凹地形成湖泊。約2,000公尺高度的低溫、短生長季與強風限制高大樹木。</p><h3>相關故事</h3><p>與昨天Vidraru對照：一座湖由人築壩形成，一座由長時間地質作用形成；兩者都改變交通與人的使用方式。</p><h3>實用提醒</h3><p>有能見度就拍，不硬等夕照。鞋底抓地、保暖防風；路面結冰與天候警告不是可用熱情克服的條件。</p><a class="guide-return" href="#ro26-4">回到行程</a></details><details class="guide-card" id="guide-ro26-5"><summary>山頂隧道 → 北側髮夾彎 → Bâlea Cascadă｜導覽</summary><h3>現場看什麼</h3><p>穿隧道後看公路如何以髮夾彎消化高度，山谷突然開闊；用車輛作比例尺，但只在安全公共觀景區構圖。</p><h3>歷史背景</h3><p>北側開始進入Transylvania的文化地理。公路的工程幾何和冰河地形共同形成今天經典畫面。</p><h3>相關故事</h3><p>照片常讓人以為彎道可以隨便停車；實際是仍在使用的交通線，攝影者只是短暫訪客。</p><h3>實用提醒</h3><p>不跨護欄、不把車停在彎道或入口。雲霧遮擋時縮短停留，安全下山。</p><a class="guide-return" href="#ro26-5">回到行程</a></details><details class="guide-card" id="guide-ro26-unesco-arutela"><summary>UNESCO條件式新增｜Arutela羅馬軍營｜導覽</summary><h3>現場看什麼</h3><p>辨認城門、低矮牆基與軍營布局，再看Olt河谷通道。現存可辨識部分包含現代重建，不把完整門樓當作未曾改動的羅馬原件。</p><h3>歷史背景</h3><p>軍營屬羅馬占領Dacia後的邊疆交通與防禦網絡。國家文化旅遊平台記載其建立於Hadrian時代，任務與控制Cozia通道有關。</p><h3>相關故事</h3><p>平台介紹曾有來自敘利亞的弓箭部隊在此服務，提醒人羅馬軍隊與邊疆社會是跨地域流動的系統。它和征服前的達契亞山堡是不同歷史階段。</p><h3>實用提醒</h3><p>平台同時標示可參觀及修復中，列自由入場、附近停車，但非當日全面開放保證。以施工圍設為準，受限則僅看合法可見區或跳過。GPS是遺址中心，不是安全停車點。</p><a class="guide-return" href="#ro26-unesco-arutela">回到行程</a></details><details class="guide-card" id="guide-ro27-1"><summary>Piața Mare → Council Tower → Piața Mică｜導覽</summary><h3>現場看什麼</h3><p>大廣場看市政、貴族宅邸、教會與商業功能相鄰；小廣場看底層拱廊與狹长店屋。</p><h3>歷史背景</h3><p>Sibiu德名Hermannstadt。中世紀匈牙利王室招募德語移民發展邊境城鎮，商業、工匠、自治制度與教會共同塑造城市。</p><h3>相關故事</h3><p>屋頂眼睛本質是閣樓通風口，幫助儲存商品、穀物與物品，並控制雨雪進入；不是監視居民的秘密機關。</p><h3>實用提醒</h3><p>每個立面不同朝向，清晨先選受光面；不把所有廣場都稱為順光。</p><a class="guide-return" href="#ro27-1">回到行程</a></details><details class="guide-card" id="guide-ro27-2"><summary>Huet Square、Lutheran Cathedral與Lower Town｜導覽</summary><h3>現場看什麼</h3><p>看Upper與Lower Town高差、教堂尖塔與通道；拱廊為交易遮雨，階梯把象徵權力中心與生產運輸區相接。</p><h3>歷史背景</h3><p>16世紀宗教改革讓德語社群轉向路德宗，禮拜語言、教育與城市身份一起改變。行會既管品質、學徒與市場，也分擔防禦責任。</p><h3>相關故事</h3><p>Bridge of Lies讓說謊者墜落的故事屬城市傳說；真正可看的，是19世紀鑄鐵橋如何跨越通往下城的道路。</p><h3>實用提醒</h3><p>教堂礼拜可能限制參觀；若想登塔，先確認票務與樓梯狀況。</p><a class="guide-return" href="#ro27-2">回到行程</a></details><details class="guide-card" id="guide-ro27-4"><summary>ASTRA Museum｜導覽</summary><h3>現場看什麼</h3><p>每棟建築問四題：能源從哪裡來？水如何取得？食物如何保存？這戶靠什麼維生？比較磨坊的傳動系統，不只看外形。</p><p>水車與風車把自然能量轉成磨麵、鋸木、處理羊毛或製油的勞動；牧民住宅則反映季節移動與乳製品保存。</p><h3>歷史背景</h3><p>博物館以不同地區移建及保存的建築、工具與工坊呈現工業化前的生產系統。農戶不只是消費者，也生產衣物、食物與日用品。</p><h3>相關故事</h3><p>木教堂除了禮拜，也是婚喪、消息與社群記憶中心。磨坊控制者在地方經濟中往往重要，因為許多人的糧食加工都依賴它。</p><h3>實用提醒</h3><p>9月露天區長時段開放不等於每棟室內全天開門。園區大，先看入口當日圖與展示開放；17:15返程保留晚餐。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro27-4">回到行程</a></details><details class="guide-card" id="guide-ro28-1"><summary>UNESCO｜Biertan Fortified Church｜導覽</summary><h3>現場看什麼</h3><p>由外牆、塔樓、坡度、儲藏空間依序看到中央教堂；聖器室門的多點鎖具說明教堂也保管重要財產與文書。</p><h3>歷史背景</h3><p>現存晚期哥德教堂及環繞防禦系統服務村落避難，1572–1867為薩克森路德宗主教座所在地。居民無法每戶築城，便集中保護公共核心。</p><h3>相關故事</h3><p>「婚姻監獄」適合用來理解宗教社群的調解與社會壓力；網路流傳幾百年只有一對離婚，不能當可靠統計。</p><h3>實用提醒</h3><p>午休前完成室內；高地石階濕時放慢。從院落往下看長形農舍與田地，不只拍紅瓦。</p><a class="guide-return" href="#ro28-1">回到行程</a></details><details class="guide-card" id="guide-ro28-2"><summary>UNESCO｜Sighișoara歷史中心與Clock Tower外觀｜導覽</summary><h3>現場看什麼</h3><p>認出Tailors、Butchers、Tinsmiths等塔名，把城牆當成一張行會責任地圖；時鐘塔同時是城門、市政權力與公共時間的象徵。</p><h3>歷史背景</h3><p>世界遺產城堡區仍有人居住、上學與經商。工匠行會控制學徒、商品品質與市場，也維修城市特定防禦段落。</p><h3>相關故事</h3><p>黃色Vlad Dracul House是與家族歷史相關的地方傳統；Vlad出生於此城的說法，不等於可精確證明現有房間就是出生房。</p><h3>實用提醒</h3><p>不要為吸血鬼情境消費犧牲歷史街區；登塔票明早處理。</p><a class="guide-return" href="#ro28-2">回到行程</a></details><details class="guide-card" id="guide-ro28-3"><summary>Covered Scholars’ Stairs → Church on the Hill → Saxon Cemetery｜導覽</summary><h3>現場看什麼</h3><p>有頂階梯連接學校、教堂與墓園，雨雪季仍能通行。教堂看哥德拱頂、壁畫殘跡與宗教改革後的改動。</p><h3>歷史背景</h3><p>德文墓碑保存家族的世代記憶。20世紀戰爭、遷徙與1989年後移民改變薩克森人口，但不能把今日城鎮想成無人的德語遺址。</p><h3>相關故事</h3><p>教育、宗教與死亡在同一條山路上相連，反映社群生活比觀光景點分類更緊密。</p><h3>實用提醒</h3><p>墓園保持安靜；不用恐怖或吸血鬼框架理解墓地。</p><a class="guide-return" href="#ro28-3">回到行程</a></details><details class="guide-card" id="guide-ro29-1"><summary>Clock Tower／History Museum｜導覽</summary><h3>現場看什麼</h3><p>先看城市模型，再從高處辨認昨日的城門、教堂、學校和行會防禦線。機械人偶把宗教與公共時間變成可見的城市秩序。</p><h3>歷史背景</h3><p>塔樓不只為看風景而建；報時協調交易、禮拜與社會活動，也展示市政機構對公共生活的管理。</p><h3>相關故事</h3><p>昨天在巷弄看的零碎點，今天從高處連成完整城市結構。這比只拍屋頂更能讀懂城堡城。</p><h3>實用提醒</h3><p>區域旅遊資料列星期二09:00開，星期一閉館；臨時維修依現場。</p><a class="guide-return" href="#ro29-1">回到行程</a></details><details class="guide-card" id="guide-ro29-unesco-saschiz"><summary>UNESCO｜Saschiz防禦教堂村落｜導覽</summary><h3>現場看什麼</h3><p>看教堂外部扶壁、上方防禦層與獨立鐘塔，再把街道住宅一起拍入。這次不爬遠處山丘避難堡；從村中心就能比較宗教核心與聚落關係。</p><h3>歷史背景</h3><p>Saschiz是「特蘭西瓦尼亞防禦教堂村落」七個列名構成村之一。中世紀晚期，宗教建築兼有避難、防守功能，與Biertan的多重院牆形成不同的空間解法。</p><h3>相關故事</h3><p>鐘塔容易讓人想到剛離開的Sighișoara；把兩座放在一起看，可理解小村落如何借用區域中心的城市形象。不要把同一項中的多個村落算成多項世界遺產。</p><h3>實用提醒</h3><p>官方旅遊頁列週二、三室內閉館，無需為此次外觀短停預設購票。若交通延誤先刪這站；若要入內且現場例外開放，須用Rupea時間交換。上午東南方光，沿公共道路找側順光，勿站DN13車流中。</p><a class="guide-return" href="#ro29-unesco-saschiz">回到行程</a></details><details class="guide-card" id="guide-ro29-2"><summary>UNESCO｜Viscri村落與修復中的防禦教堂｜導覽</summary><h3>現場看什麼</h3><p>按「街道→立面→大門→院落→穀倉→長形地塊」觀察，每戶其實是一個生產單位。高大木門讓馬車、牲畜與農產品通行。</p><h3>歷史背景</h3><p>Viscri德名Weisskirch，村落的防禦教堂把宗教、储糧與避難集中；社區修復與傳統工藝延續比單棟藍房子更重要。</p><h3>相關故事</h3><p>移民後的村落曾面臨人口與維護問題，保育和旅遊帶來收入，也改變房屋用途。暫時關閉修復是保存工作的一部分，不是世界遺產失去價值。</p><h3>實用提醒</h3><p>GPS指教堂範圍，不能直接開入居民道路。照村外停車指示，勿推開私人院門。</p><a class="guide-return" href="#ro29-2">回到行程</a></details><details class="guide-card" id="guide-ro29-3"><summary>Rupea Fortress｜導覽</summary><h3>現場看什麼</h3><p>由下往上看不同高度防禦區、城牆轉折與玄武岩基座；觀察它如何利用孤立丘體控制附近交通。</p><h3>歷史背景</h3><p>與村落教堂不同，Rupea是依山丘地形發展的防禦聚落，分期擴張讓不同高度形成多層保護。</p><h3>相關故事</h3><p>比較四種防禦：Viscri農村避難、Biertan宗教中心、Sighișoara城鎮行會、Rupea山丘交通控制。它們不是四次重複看城牆。</p><h3>實用提醒</h3><p>風大、雨後石路滑時不上高處。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro29-3">回到行程</a></details><details class="guide-card" id="guide-ro29-4"><summary>Black Church室內｜導覽</summary><h3>現場看什麼</h3><p>先找鄂圖曼／安納托利亞地毯，再看哥德空間、管風琴與商人捐贈。地毯出現在路德宗教堂，正說明宗教邊界不等於商業邊界。</p><h3>歷史背景</h3><p>Brașov德名Kronstadt，靠跨山貿易富裕。16世紀Johannes Honterus推動宗教改革，德語教育與教會制度也隨之轉變。</p><h3>相關故事</h3><p>Black Church之名通常與1689年大火後建築外觀相聯；真正值得看的並不只是顏色，而是商業財富如何轉成宗教藝術。</p><h3>實用提醒</h3><p>攝影與音樂會另依館規；勿為拍外觀錯過最後入場。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro29-4">回到行程</a></details><details class="guide-card" id="guide-ro29-5"><summary>White Tower → Council Square｜導覽</summary><h3>現場看什麼</h3><p>向東南看廣場、紅瓦與Tâmpa，城市緊貼山體；與較開闊的Sibiu比較自然地形如何限制城市。</p><h3>歷史背景</h3><p>城牆曾控制貿易與居住權。Catherine’s Gate、Șchei Gate另一側的羅馬尼亞社區，補足德語老城之外的歷史。</p><h3>相關故事</h3><p>Rope Street窄巷與消防、通行需求相關，不必追逐「歐洲最窄」排名；城市密度與居民使用更有意義。</p><h3>實用提醒</h3><p>White Tower向東南拍，傍晚太陽在側後方；山影可能早於天文日落。</p><a class="guide-return" href="#ro29-5">回到行程</a></details><details class="guide-card" id="guide-ro30-1"><summary>Libearty Bear Sanctuary｜導覽</summary><h3>現場看什麼</h3><p>觀察森林、水池與動物能否自行退開；保育中心的空間不應迫使熊為每位付費觀眾表演。</p><h3>歷史背景</h3><p>園區接納曾遭私人圈養、展演或不當飼養的熊。長期圈養可能造成傷病、依賴人工餵養與失去對人的警戒，並非所有救援動物都適合野放。</p><h3>相關故事</h3><p>看不到近距離熊不代表服務失敗，反而可能表示牠能按自己的行為選擇隱蔽處。保育是改善一生的福利，不只是放回森林的單一結局。</p><h3>實用提醒</h3><p>不叫喊、餵食、引誘或使用閃光；相機規則與額外費用購票時核對。</p><a class="guide-return" href="#ro30-1">回到行程</a></details><details class="guide-card" id="guide-ro30-2"><summary>Dâmbul Morii → Seven Ladders入口｜導覽</summary><h3>現場看什麼</h3><p>林間步道到狹谷可感受局部微氣候：日照減少、空氣變涼、石面長期潮濕。</p><h3>歷史背景</h3><p>水沿石灰岩裂隙侵蝕，形成狹窄通道、瀑布與垂直落差；人工梯和平台只是讓人穿越地貌的工具。</p><h3>相關故事</h3><p>主角不是「七」這個數字，而是流水、岩層與時間；梯子則讓安全條件受水量與摩擦力直接影響。</p><h3>實用提醒</h3><p>此站地圖搜尋步道起點，下一站GPS是峽谷。不要開車導航到峽谷座標。</p><a class="guide-return" href="#ro30-2">回到行程</a></details><details class="guide-card" id="guide-ro30-3"><summary>Seven Ladders Canyon與可選Zipline｜導覽</summary><h3>現場看什麼</h3><p>金屬梯旁看瀑布、水蝕凹槽與層理；穩定站位才拍照，不一邊爬梯一邊操作手機。</p><h3>歷史背景</h3><p>狹谷撤退空間有限，降雨會同時改變水量、落石、金屬表面摩擦力與保暖條件。</p><h3>相關故事</h3><p>滑索提供橫越森林的另一種感受，但不是必須完成的第二張門票；留下體力安全返回比湊滿活動重要。</p><h3>實用提醒</h3><p>穿抓地鞋，雙手保持可用；雨衣和保暖層收在防水袋，裝備與路線遵循現場人員。</p><a class="guide-return" href="#ro30-3">回到行程</a></details><details class="guide-card" id="guide-ro30-4"><summary>UNESCO替代版｜Prejmer＋Șchei｜導覽</summary><h3>現場看什麼</h3><p>先穿入口通道，看厚重圍牆內多層家庭房間與儲藏室，再走允許開放的木廊。教堂本體由外圍巨大防禦圈保護，與Viscri直接強化教堂的方式比較。室內留意哥德式翼狀祭壇。</p><h3>歷史背景</h3><p>Prejmer把避難與儲糧高度制度化；Șchei的宗教及教育傳統提醒人，城牆內外曾有不同居住與經濟權利。</p><h3>相關故事</h3><p>三座防禦教堂可比較規模：Viscri農村、Biertan主教中心、Prejmer大型避難系統。</p><h3>實用提醒</h3><p>出發前致電+40 268 362 042確認9/30開放；此次不寫未核實的新票價。走廊昏暗、木階窄，拍照先讓人通行。票價與房間開放依現場。</p><a class="guide-return" href="#ro30-4">回到行程</a></details><details class="guide-card" id="guide-ro01-2"><summary>Cantacuzino Castle｜導覽</summary><h3>現場看什麼</h3><p>看拱廊、柱式、石雕、木作與家族徽章，再從露台向西望Bucegi。上午較利看清山壁，雲層仍可能完全遮擋。</p><h3>歷史背景</h3><p>1911年完成的貴族宮邸屬Gheorghe Grigore Cantacuzino，不是王室夏宮。Neo-Romanian從Brâncovenesc、修道院與傳統建築提取國家風格。</p><h3>相關故事</h3><p>富有主人被稱為Nabob；《Wednesday》取景是今日附加故事，影集畫面還包含影像製作，不等於現場每一棟建築。</p><h3>實用提醒</h3><p>與Bucharest的法式宮殿比較：前者尋求國際西化，Neo-Romanian則追問本國現代建築應有何種樣貌。</p><a class="guide-return" href="#ro01-2">回到行程</a></details><details class="guide-card" id="guide-ro01-3"><summary>Peleș庭園與入場準備｜導覽</summary><h3>現場看什麼</h3><p>看陡屋頂、半木構、塔樓與山林莊園意象；與Cantacuzino拱廊語彙比較，不把兩棟都簡化成同樣的城堡。</p><h3>歷史背景</h3><p>Carol I出身Hohenzollern-Sigmaringen，Peleș的德國新文藝復興語彙反映王朝背景，也服務羅馬尼亞新王國的歐洲形象。</p><h3>相關故事</h3><p>它既是家，也是外交舞台；來訪者看到的工藝、收藏與技術都傳遞統治者的文化權威。</p><h3>實用提醒</h3><p>正午光較硬，找局部側光與木作細節；勿在拍照中錯過時窗。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro01-3">回到行程</a></details><details class="guide-card" id="guide-ro01-4"><summary>Peleș Castle室內｜導覽</summary><h3>現場看什麼</h3><p>Honor Hall看木雕與垂直尺度；Armoury看收藏如何建立軍事與騎士形象；各國風格房間比較木作、玻璃與裝飾。</p><p>電力、暖氣及其他現代設備則顯示王室希望同時擁有歷史感與技術進步。</p><h3>歷史背景</h3><p>19世紀末王國需要國內合法性與歐洲承認。收藏多國藝術和先進設備，是向外交訪客展示國家穩定、文明與現代化的方式。</p><h3>相關故事</h3><p>「房間很多、國王有錢」只描述表面；更值得問哪些房間給誰看、如何引導訪客，以及私人生活如何被安排在公開權力形象後面。</p><h3>實用提醒</h3><p>依實際導覽結束時間調整午餐；指定時窗票不可退改，先確認交通再購買。</p><a class="guide-return" href="#ro01-4">回到行程</a></details><details class="guide-card" id="guide-ro01-5"><summary>Pelișor僅外觀｜導覽</summary><h3>現場看什麼</h3><p>從較小尺度及住宅感理解它與Peleș的差別，現場只看開放外圍。</p><h3>歷史背景</h3><p>Pelișor與Queen Marie的Art Nouveau、拜占庭與凱爾特美學相關，呈現比Carol I正式國家舞台更私人的王室世界。</p><h3>相關故事</h3><p>不能進去時，保留這個比較就足夠：不是每一處歷史都必須透過當天入內才有意義。</p><h3>實用提醒</h3><p>施工圍設及禁行區以現場為準。</p><a class="guide-return" href="#ro01-5">回到行程</a></details><details class="guide-card" id="guide-ro01-6"><summary>Sinaia Monastery｜導覽</summary><h3>現場看什麼</h3><p>比較兩個庭院與不同時期教堂；門牆、封閉院落與宗教空間也反映山路上的保護與接待需求。</p><h3>歷史背景</h3><p>Mihail Cantacuzino於1695年創建修道院，名稱源自西奈山聖凱薩琳修道院，城鎮後來以它命名。</p><h3>相關故事</h3><p>皇家山城並非先有宮殿才有歷史；修道院是王國旅遊與避暑興起前的重要節點。</p><h3>實用提醒</h3><p>不打斷禮拜；看17世紀舊教堂與19世紀大教堂的差異。</p><a class="guide-return" href="#ro01-6">回到行程</a></details><details class="guide-card" id="guide-ro01-7"><summary>Dimitrie Ghica Park與Casino外觀｜導覽</summary><h3>現場看什麼</h3><p>看公園、旅館、Casino與車站如何共同服務避暑社交生活。</p><h3>歷史背景</h3><p>1913年落成的Casino代表王室、政治與富裕階層的山城娛樂，Sinaia既是自然避暑地，也是身分展示場。</p><h3>相關故事</h3><p>今天悠閒公園背後曾有音樂、舞會、博彩與精英社交網絡。</p><h3>實用提醒</h3><p>不預設Casino室內開放；Kuib或其他餐廳依當日營業選擇。</p><a class="guide-return" href="#ro01-7">回到行程</a></details><details class="guide-card" id="guide-ro02-4"><summary>Spring Palace／Ceaușescu Mansion｜導覽</summary><h3>現場看什麼</h3><p>看家庭成員房間、泳池、服務與生活動線，不只數昂貴家具與浴室。住宅如何隔離一般社會，本身就是權力結構。</p><h3>歷史背景</h3><p>最高統治家庭享有和一般配給、能源限制不同的生活條件。它與人民宮互補：一個是對外公共權力舞台，一個是封閉私人特權。</p><h3>相關故事</h3><p>昨天Peleș公開以王室工藝及科技展示國家；今天住宅讓人比較另一種制度如何安排統治者生活。兩者皆豪華，並不代表政治意義相同。</p><h3>實用提醒</h3><p>未訂票；若12:00還車採14:30以後場次。無票改美術館，不到門口賭導覽名額。</p><a class="guide-return" href="#ro02-4">回到行程</a></details><details class="guide-card" id="guide-ro02-5"><summary>King Michael I Park → Arcul de Triumf｜導覽</summary><h3>現場看什麼</h3><p>公園看居民慢跑、遛狗與湖岸生活，凱旋門則看法式紀念形式如何用於本國歷史。</p><h3>歷史背景</h3><p>Herăstrău公園更名為King Michael I，反映後共產時代重新評估王室記憶；凱旋門連結戰爭、統一與王國時代首都形象。</p><h3>相關故事</h3><p>從Athenaeum到銀行宮殿再到凱旋門，現代國家透過文化、金融與軍事紀念形成一套城市語言。</p><h3>實用提醒</h3><p>不要越過圓環車道拍照。晚間買巴士用水、食物與少量現金，不囤需冷藏食品。</p><a class="guide-return" href="#ro02-5">回到行程</a></details><details class="guide-card" id="guide-ro03-1"><summary>早餐、退房與抵達票面站點｜導覽</summary><h3>現場看什麼</h3><p>護照、手機、行動電源、藥物與貴重品放隨身包，車牌、目的地與司機確認後再放大行李。</p><h3>歷史背景</h3><p>羅馬尼亞與保加利亞同属東正教傳統影響的區域，但前者以羅曼語為主，後者以斯拉夫語為主。共同經歷帝國、王國與社會主義，不代表歷史認同完全一樣。</p><h3>相關故事</h3><p>從Bucharest前往Veliko Tarnovo，可把接下來的中世紀保加利亞國家敘事，與羅馬尼亞王國及瓦拉幾亞故事比較。</p><h3>實用提醒</h3><p>不因邊境常規檢查變動而把護照放行李艙；承運人及警方仍可能查驗身份。</p><a class="guide-return" href="#ro03-1">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://www.biserica-fortificata-viscri.ro/en/" target="_blank" rel="noopener">Viscri官方｜修復與部分開放</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://peles.ro/en/program-si-taxe/" target="_blank" rel="noopener">Peleș官方｜時段、英文導覽、票價</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://peles.ro/en/anunturi/in-perioada-28-septembrie-3-noiembrie-2026-castelul-pelisor-va-fi-inchis-pentru-curatenie-generala-si-conservare-preventiva/" target="_blank" rel="noopener">Pelișor官方｜9/28–11/3關閉</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://millionsoffriends.org/en/amp-libearty/visit-the-sanctuary/" target="_blank" rel="noopener">Libearty官方｜新時段</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://www.iabilet.ro/bilete-david-kadouch-recital-de-pian-bucharest-international-piano-festival-128514/" target="_blank" rel="noopener">Kadouch正式售票頁</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://comunabiertan.ro/turism/" target="_blank" rel="noopener">Biertan市政府｜秋季每日開放與午休</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://visitmures.com/sighisoara/patrimoniu/muzee/muzeul-de-istorie-sighisoara" target="_blank" rel="noopener">Mureș區域旅遊｜Sighișoara博物館</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://www.stb.ro/info.php?P=9" target="_blank" rel="noopener">STB｜機場站工程調整公告</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://tvrinfo.ro/prima-ninsoare-pe-transfagarasan-drumarii-spun-ca-nu-a-fost-nevoie-sa-intervina-iar-traficul-nu-este-afectat/" target="_blank" rel="noopener">TVR 9/22｜初雪當時未影響交通</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://www.cjarges.ro/en/programul-evenimentelor-cultural-artistice-in-perioada-15-23-august-2026" target="_blank" rel="noopener">Argeș官方8月公告｜Poenari團體參觀</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://stagiuneacamerala.ro/event/odae-cum-harmoniis-duo-noema/" target="_blank" rel="noopener">Duo Noema主辦方｜9/27 17:00</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://muzeulastra.ro/" target="_blank" rel="noopener">ASTRA官方</a> · 2026-09-22｜前11項已查核；其餘為官方後續查詢入口。歷史導覽整合使用者提供文本，GPS沿用提供座標。</li><li><a href="https://www.cantacuzinocastle.com/" target="_blank" rel="noopener">Cantacuzino官方｜出發前確認售票</a> · 預約前再確認，未把提供時段當作當日保證</li><li><a href="https://casaceausescu.ro/en/" target="_blank" rel="noopener">Spring Palace官方｜英文導覽確認</a> · 預約前再確認，未把提供時段當作當日保證</li><li><a href="https://whc.unesco.org/en/statesparties/ro" target="_blank" rel="noopener">UNESCO｜Romania正式名錄</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/596/maps/" target="_blank" rel="noopener">UNESCO｜七村構成點</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/902/" target="_blank" rel="noopener">UNESCO｜Sighișoara</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/597/" target="_blank" rel="noopener">UNESCO｜Hurezi</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/1718/maps/" target="_blank" rel="noopener">UNESCO｜羅馬疆界構成點與座標</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/1133/maps/" target="_blank" rel="noopener">UNESCO｜山毛櫸林邊界</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://turism.saschiz.ro/locatii/biserica-sfantul-stefan" target="_blank" rel="noopener">Saschiz官方旅遊中心｜週二三閉館</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://kirchenburgen.org/en/location/tartlau-prejmer/" target="_blank" rel="noopener">防禦教堂基金會｜Prejmer</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://romania-atractiva.ro/ro/profiles/castrul-roman-arutela" target="_blank" rel="noopener">國家文化旅遊平台｜Arutela</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://ich.unesco.org/en/state/romania-RO" target="_blank" rel="noopener">UNESCO非物質文化遺產｜Romania</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準 <template id="content-albania-second-2026"><nav><a href="#al20">09-20 Ohrid → Lin → Berat｜湖岸與千窗黃昏</a><a href="#al21">09-21 Berat｜活城堡、聖像與住宅城市</a><a href="#al22">09-22 Durrës → Laknas → TIFF｜海港考古與當代電影</a><a href="#al23">09-23 Laknas → TIA → Bucharest｜提前還車搭機</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="al-overview"><h2>阿爾巴尼亞第二段｜湖村、千窗山城與羅馬港口</h2><p>2026/9/20–9/23。銜接北馬其頓天氣調整版：9/19已遊Ohrid南岸；9/20 07:30由Ohrid北線出境，經Lin前往Berat。Berat住兩晚，9/22經Durrës至Laknas，9/23搭機。全部時間為當地夏令時間CEST（UTC+2）。</p><p>這段保留Berat完整文化日，不加入Gjirokastër。Lin是跨境日的彈性停點；TIFF是已公布場次、尚未購票的晚間選項。每站「導覽」可展開歷史、現場看法與故事，拍照位置集中於下方攝影表。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>主線</th><th>住宿</th></tr></thead><tbody><tr><td>9/20（日）</td><td>Ohrid → Qafë Thanë → Lin → Berat</td><td>Apartment Geart｜9/20–22，Berat，Rruga Petrit Lulo一帶</td></tr><tr><td>9/21（一）</td><td>Berat Castle、Onufri、Kala、下城與Gorica</td><td>Apartment Geart｜第2晚</td></tr><tr><td>9/22（二）</td><td>Durrës → Laknas → TIFF候選場次</td><td>Beautifull Apartament｜9/22–23，Laknas，Rruga Gryka e Kaçanikut一帶</td></tr><tr><td>9/23（三）</td><td>07:45還車目標 → 08:25航廈 → 11:35 TIA–OTP</td><td>航班時間依使用者提供；出發前以航空公司訂位核對</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Apartment%20Geart%20Berat">Apartment Geart（核對房東提供入口）</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Beautifull%20Apartament%20Laknas">Beautifull Apartament（核對訂單位置）</a></section><section id="al-practical"><h2>入住、票務與交通要點</h2><p>住宿名稱與日期按已提供預訂整理；公開搜尋可能有同名房源。停車入口、車位是否保留、提早入住及行李寄放以各自房東訊息為準，Google Maps搜尋結果不能代替訂單定位。</p><p>Onufri與Ethnographic：博物館中心官網列5/1–9/30 09:00–18:00，但夏季欄未明列星期一。9/20請住宿協助確認9/21；電話+355 32 232224。若星期一無法確認且週日15:30前抵達，改在9/20 15:45–16:45先看Onufri，King Mosque／Halveti移到9/21。</p><p>TIFF官網已公布2026節目。9/22 18:00 Kino Piramida：《The Proletariat’s Platini》，Arian Çuliqi，57分鐘，阿爾巴尼亞紀錄片。票價、英文字幕、入場與映後活動須購票前確認；不是已預約。</p><p>9/23以07:45到還車點、08:15–08:25進航廈為目標。這是待租車公司確認的新時間，不是已修改完成。汽油補至租約要求的歸還油量；若合約為同油量歸還，不必盲目加滿。</p><p>9/20車程是含過境及休息的規劃時窗，不是即時路況保證。導航優先正式鋪面幹道；Elbasan後經Cërrik／Belsh方向須按當日路況選路，雨天或小路不明時比較經Rrogozhinë／Lushnjë幹道方案，避免跟隨未鋪面捷徑。</p><a class="map" target="_blank" rel="noopener" href="https://muzeumet-berat.al/en/visit/">Berat博物館中心｜時段與票價</a><a class="map" target="_blank" rel="noopener" href="https://tiranafilmfest.org/program-2026/">TIFF 2026逐日節目</a><a class="map" target="_blank" rel="noopener" href="https://www.tirana-airport.com/en/article/1121/Important-Announcements-and-Info-for-Passengers">TIA出發提醒</a></section><section id="al-photo"><h2>必拍點｜Google Maps座標、方向與順光時間</h2><p>座標以公開地標位置為導航參考，精度依來源而異；P03借用Gorica Bridge作步行起點，不冒充已勘查的精確機位。各連結可直接開Google Maps；到場只在公開道路及開放步道取景。Lin半島遺址、Gorica Hill未取得可靠精確機位，不提供猜測座標。</p><p>順光＝太陽在攝影者背後；側光適合表現石材與住宅層次；朝太陽方向為逆光；藍調是日落後天空光。表列是依日期、地理方位推算的攝影建議，並非雲量預報或現場日照保證。Berat山丘可能提早遮住低角度太陽。</p><p>Astral天文計算（地平線無遮擋）：Berat 9/20日出06:25、日落18:40、民用暮光結束19:08；9/21日出06:26、日落18:39、暮光19:06。Lin 9/20日出06:22、日落18:38；Durrës 9/22日出06:29、日落18:39。時間取整分；拍建築暖光應比日落更早就位。</p><div class="tablewrap"><table><thead><tr><th>拍攝點</th><th>緯度,經度</th><th>站位／朝向</th><th>順光與側光建議（CEST）</th><th>本次使用</th></tr></thead><tbody><tr><td>P01 Lin湖村</td><td>41.06611,20.63861</td><td>村落定位；由公共湖岸取景，向西／西北拍住宅</td><td>09:20–10:30可獲順／側光；向東拍湖與對岸則多為逆光</td><td>9/20上午；遺址按現場標示上坡，不把此點當鑲嵌入口</td></tr><tr><td>P02 Gorica Bridge</td><td>40.703,19.944</td><td>橋體定位；移至南端公共河岸，向北／東北拍橋與山城</td><td>約09:00–11:00較順／側光；17:30後偏側逆光</td><td>9/20 17:35、9/21 06:35；清晨主打無人街景，非保證照亮白屋</td></tr><tr><td>P03 Mangalem千窗全景</td><td>40.703,19.944</td><td>以Gorica橋作導航起點，沿南岸向東找公開步道，鏡頭向北</td><td>10:00–15:00較順光；15:00–17:00側光；暮光不是順光</td><td>9/20 18:00–19:08；9/21午休前可補白牆順光。座標非精確腳架位</td></tr><tr><td>P04 King Mosque院落</td><td>40.7056,19.9521</td><td>清真寺定位；由南側可通行區朝北拍，室內依許可</td><td>10:00–14:00較順光；下午轉西／西南側取景可有側光</td><td>9/20 15:45；院落陰影依建築遮蔽，室內不依日落安排</td></tr><tr><td>P05 Berat Castle高處</td><td>40.708,19.945</td><td>城堡區定位，入內沿標示到開放觀景處，南向拍河谷</td><td>上午偏側光；11:00–14:00南向易逆光；下午西南光可側逆光</td><td>9/21 08:00–12:15；改向北／西拍城牆可得較順光</td></tr><tr><td>P06 Holy Trinity Church</td><td>40.70472,19.94667</td><td>教堂定位；上方合法步道取景，教堂與坡地同框</td><td>09:00–11:00以側光造型為主，是否順光取決於所站一側</td><td>9/21 10:00–10:40；禁止為構圖越過護欄</td></tr><tr><td>P07 Durrës考古博物館／近岸</td><td>41.311389,19.440278</td><td>館址定位；公共海濱朝西拍海，進館按攝影規定</td><td>09:00–11:00朝西海景較順光；午後對海漸轉逆光</td><td>9/22 10:30；海濱照片可在入館前花5分鐘完成</td></tr><tr><td>P08 Durrës Amphitheatre</td><td>41.31222,19.44500</td><td>遺址定位；南側獲准通道朝北拍橢圓觀眾席</td><td>10:00–12:30朝北較順光；地下通道光差大</td><td>9/22 11:50–12:45；避免正午強光過曝，畫面納入城市住宅</td></tr><tr><td>P09 Venetian Tower</td><td>41.3097,19.4470</td><td>塔樓定位；南側公共空間向北拍塔身</td><td>11:00–14:00較順光；換東西側可拍立體側光</td><td>9/22 12:45–13:20；不站車道，登塔非必要</td></tr><tr><td>P10 Tirana Pyramid</td><td>41.32306,19.82139</td><td>建築定位；片場入口另依票券標示</td><td>西側朝東拍立面，16:30–18:00較順／側光；入夜改拍照明</td><td>9/22 17:30進場前或19:15散場後；不為攝影遲到</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.06611%2C20.63861">P01 Lin湖村｜41.06611,20.63861</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944">P02 Gorica Bridge｜40.703,19.944</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944">P03 Mangalem千窗全景｜40.703,19.944</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.7056%2C19.9521">P04 King Mosque院落｜40.7056,19.9521</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.708%2C19.945">P05 Berat Castle高處｜40.708,19.945</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.70472%2C19.94667">P06 Holy Trinity Church｜40.70472,19.94667</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.311389%2C19.440278">P07 Durrës考古博物館／近岸｜41.311389,19.440278</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.31222%2C19.44500">P08 Durrës Amphitheatre｜41.31222,19.44500</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.3097%2C19.4470">P09 Venetian Tower｜41.3097,19.4470</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.32306%2C19.82139">P10 Tirana Pyramid｜41.32306,19.82139</a></section><section id="al-food"><h2>採買、點餐與口袋語句</h2><p>Berat兩晚採買：雞蛋、優格、白起司、麵包／byrek、番茄、小黃瓜、葡萄或無花果、飲水與堅果。選住宿附近營業中的SPAR、Big Market或小店，依實際位置與時間，不為連鎖品牌繞路。</p><p>9/22抵達Laknas前買齊隔天06:40早餐；不要假設清晨住宅區有早餐店。市場、停車、小館備ALL現金；刷卡前看幣別，歐元現付先問清匯率。</p><p>Faleminderit＝謝謝；Mirëdita＝日安；Ju lutem＝請；Faturën, ju lutem＝請給帳單。拍照先以手勢與簡單詢問取得同意，宗教場所穿著遮肩過膝。</p><p>可替換活動：Osumi Canyon須按業者確認的9月水況、路程與出團內容另排；不把泛舟、溯溪、tubing混成同一活動，也不保證半天下午能往返。這次完整Berat日優先保留文化主線。</p></section><section class="day" id="al20"><span class="tag">2026-09-20</span><h2>Ohrid → Lin → Berat｜湖岸與千窗黃昏</h2><p>07:30出發；Lin依過境時間取捨。下午入城後以步行為主，兩晚住Apartment Geart。</p><div class="slot" id="al20-border"><div class="time">07:00–09:10</div><div><h3>RUPE退房 → Qafë Thanë／Kjafasan</h3><p>07:00早餐裝車，07:30出發。08:10–09:10作過境時窗；依排隊調整。護照、駕照及國際駕照、車籍、租約、書面跨境許可與適用阿爾巴尼亞的車險放隨手處。</p><p><b>交通：</b>Ohrid北線經Struga方向至口岸；不再南下St. Naum。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Qafe%20Thane%20Border%20Crossing" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-border">導覽</a></div></div><div class="slot" id="al20-lin"><div class="time">09:20–10:35</div><div><h3>Lin湖村與早期基督教遺址</h3><p>停在村口合法車位，步行湖岸、石屋巷弄，再依標示上坡看遺址與半島。若遺址未開，保留村落及湖景，不等待。P01：41.06611,20.63861為村落定位。</p><p><b>費用：</b>遺址票價、停車費待現場確認；備ALL現金。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Lin%20Albania" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-lin">導覽</a></div></div><div class="slot" id="al20-drive"><div class="time">10:35–14:45</div><div><h3>Lin → Librazhd午餐 → Elbasan → Berat</h3><p>12:00–12:45簡餐、洗手間、補水；後段預留市鎮慢車與彎道。14:45是目標，延誤先刪下午小點。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Librazhd%20Albania" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-drive">導覽</a></div></div><div class="slot" id="al20-checkin"><div class="time">14:45–15:20</div><div><h3>Apartment Geart｜入住與停車</h3><p>放行李、換抓地鞋、帶水薄外套。取得房東停車指引；確認兩座博物館星期一營業及Lili等晚餐候選。若Onufri週一無法確認，啟用週日下午替換。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Apartment%20Geart%20Berat" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>住宿依既有預訂；餐廳與博物館確認尚待自行辦理。</p></div></div><div class="slot" id="al20-king"><div class="time">15:45–16:05</div><div><h3>King Mosque｜王者清真寺</h3><p>先看院落、柱廊與木作；入內須取得許可。P04：40.7056,19.9521。若下午先去Onufri，本點移9/21。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.7056%2C19.9521" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-king">導覽</a></div></div><div class="slot" id="al20-tekke"><div class="time">16:05–16:30</div><div><h3>Halveti Tekke｜蘇菲修行空間</h3><p>與King Mosque相鄰，依開門狀況看內部木雕、壁畫及住宅尺度的空間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Halveti%20Tekke%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-tekke">導覽</a></div></div><div class="slot" id="al20-mangalem"><div class="time">16:30–17:35</div><div><h3>Mangalem｜千窗街區</h3><p>從下城沿公共巷道慢走，安排40–60分鐘坡道；不要走入私人院落。拍窗戶、突出上層、門廊與石板街。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mangalem%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-mangalem">導覽</a></div></div><div class="slot" id="al20-gorica"><div class="time">17:35–19:08</div><div><h3>Gorica Bridge → 南岸千窗黃昏</h3><p>17:35看橋，17:50沿南岸找公開站位。18:00前先拍仍有光的白屋；18:40日落，18:45–19:08拍亮窗與天空。P02／P03導航起點：40.703,19.944。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-gorica">導覽</a></div></div><div class="slot" id="al20-dinner"><div class="time">19:15–21:20</div><div><h3>傳統晚餐 → Bulevardi Republika xhiro</h3><p>Antigoni可作景觀晚餐候選；Lili或Tradita e Beratit可留明晚。20:45散步，補給早餐、飲水、水果。餐廳未代訂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bulevardi%20Republika%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-dinner">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Lin只走安全湖岸，取消濕滑遺址上坡；Berat改博物館或宗教建築（須開放），河岸短拍，不上Gorica Hill。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>10:00後過境Lin縮45分鐘，11:00後直接Berat。入住晚於16:00，刪宗教建築與部分巷弄，保留河岸黃昏、晚餐與休息。Onufri週一未確認且週日抵達早，先看Onufri再去河岸。</p></div></section><section class="day" id="al21"><span class="tag">2026-09-21</span><h2>Berat｜活城堡、聖像與住宅城市</h2><p>上午上城堡，下午博物館與午休，晚間河岸。Onufri／Ethnographic星期一以實際確認為前提；09:00–18:00為官網夏季時段。</p><div class="slot" id="al21-morning"><div class="time">06:35–07:45</div><div><h3>Gorica晨拍與早餐</h3><p>日出06:26，但山丘遮陽會延後直射光。06:35–07:15拍空橋、街道甦醒；07:15早餐。若疲累可直接07:15起床。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-morning">導覽</a></div></div><div class="slot" id="al21-castle"><div class="time">07:50–09:00</div><div><h3>計程車上山 → Berat Castle城牆與遺址</h3><p>07:50由住宿叫車到城堡入口附近，08:00開始戶外區；城門收費與可進時段依現場。先看城牆、Red Mosque與蓄水設施。P05：40.708,19.945為城堡區定位。</p><p><b>費用：</b>城堡可能另收門票；不包含於Onufri票的假設中。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Berat%20Castle" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-castle">導覽</a></div></div><div class="slot" id="al21-onufri"><div class="time">09:00–10:00</div><div><h3>Onufri Iconographic Museum｜聖像的閱讀方法</h3><p>以已確認星期一營業為前提；夏季官網09:00–18:00。一般票400 ALL；audio guide ticket列500 ALL，先確認是否含門票，不直接相加900。館內依官網禁一般攝影錄影。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Onufri%20Iconographic%20Museum%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzeumet-berat.al/en/onufri-iconographic-museum/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al21-onufri">導覽</a></div></div><div class="slot" id="al21-trinity"><div class="time">10:00–10:40</div><div><h3>Holy Trinity Church｜磚石與河谷</h3><p>沿開放步道到教堂周邊；外觀即值得。P06：40.70472,19.94667。上午以側光表現磚石和屋頂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.70472%2C19.94667" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-trinity">導覽</a></div></div><div class="slot" id="al21-kala"><div class="time">10:40–13:15</div><div><h3>Kala活城堡巷弄、觀景與午餐</h3><p>10:40–12:15慢走住宅與城牆，12:15在城堡內午餐。若早上已疲累，提早坐下，不再增加教堂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kala%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-kala">導覽</a></div></div><div class="slot" id="al21-rest1"><div class="time">13:15–14:00</div><div><h3>下山與短休息</h3><p>返回下城補水；晴天且有餘力，可由Gorica南岸補拍Mangalem白牆順光，最多15分鐘。博物館營業未確認時依上午結果調整。</p></div></div><div class="slot" id="al21-ethno"><div class="time">14:00–14:50</div><div><h3>Ethnographic Museum｜走進傳統家庭</h3><p>開館已確認才入內；夏季官網09:00–18:00，300 ALL。看住宅格局、手工業與家庭生活；若關門改Mangalem住宅外觀導覽。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ethnographic%20Museum%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzeumet-berat.al/en/ethnographic-museum/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al21-ethno">導覽</a></div></div><div class="slot" id="al21-solomon"><div class="time">15:00–15:40</div><div><h3>Solomon Museum候選｜猶太社群與庇護</h3><p>先由住宿確認營業；未確認或閉館直接咖啡，不等待。之後15:40–1
