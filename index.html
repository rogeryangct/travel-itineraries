<template id="content-bulgaria-2026"><nav><a href="#bg03">10-03 Bucharest → Veliko Tarnovo｜河谷山城與聲光秀</a><a href="#bg04">10-04 Veliko Tarnovo → Arbanasi｜帝國與商人住宅</a><a href="#bg05">10-05 Veliko Tarnovo → Plovdiv｜06:50直達車與城市散步</a><a href="#bg06">10-06 Plovdiv｜羅馬劇場、復興宅邸與馬賽克</a><a href="#bg07">10-07 Plovdiv → Sofia｜Serdica地下城市與礦泉街區</a><a href="#bg08">10-08 Sofia｜國家歷史、週四美術館與芭蕾</a><a href="#bg09">10-09 SOF取車 → Dupnitsa → Sapareva Banya</a><a href="#bg10">10-10 Seven Rila Lakes A／Rila Monastery B｜當晨決策</a><a href="#bg11">10-11 Rila Monastery轉移日／Bansko完整日｜避開Vihren賽事</a><a href="#bg12">10-12 Pirin短走 → Sofia｜13:00左右北返</a><a href="#bg13">10-13 Sofia Airport還車 → ATH → CAI</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="bg-stays"><h2>住宿與路線｜11天、10晚</h2><p>2026/10/3–10/13；全程使用保加利亞當地時間 Europe/Sofia（本段為 UTC+3）。住宿依你的訂單保留；交通、門票與演出列為建議，未代購。10/10 兩份訂房只代表同一晚的替代方案，不能算成兩晚。</p><p>先查看兩份10/10訂單的免費取消期限、當地截止時刻與違約金。只有期限允許，才等10/8–9天氣較可靠時二選一；若提早到期，依取消成本與山區不確定性決定，不假定兩間可以一直免費保留。</p><div class="tablewrap"><table><thead><tr><th>入住—退房</th><th>住宿</th><th>安排</th></tr></thead><tbody><tr><td>10/3–5</td><td>Aleko Apartments City Center</td><td>Veliko Tarnovo，2晚</td></tr><tr><td>10/5–7</td><td>2BD Heart of Plovdiv Boheme Flat</td><td>Plovdiv，2晚</td></tr><tr><td>10/7–9</td><td>Luxury Apartments 1</td><td>Sofia，2晚</td></tr><tr><td>10/9–10</td><td>Апартаменти ЗДРАВЕ</td><td>Sapareva Banya，1晚</td></tr><tr><td>10/10–11</td><td>Апартаменти ЗДРАВЕ 或 Ski Nomad Bansko</td><td>A七湖成功續住Sapareva；B改修道院後到Bansko，二擇一</td></tr><tr><td>10/11–12</td><td>Ski Nomad Bansko</td><td>Bansko，1晚</td></tr><tr><td>10/12–13</td><td>N9 Studentski Loft</td><td>Sofia，1晚</td></tr></tbody></table></div></section><section id="bg-decisions"><h2>已核對的調整與仍需決定的事項</h2><p>查核日期2026/9/27。10/3 20:00聲光秀、10/8 19:00《Romeo and Juliet》芭蕾已列入官方節目；有節目不代表已持票，座位與售價以付款頁為準，不固定寫剩餘張數。</p><p>七湖官網5/22公告08:30–17:30，但另一票價頁仍寫08:30–18:30，並夾有8/19特別延長資訊。這是官方頁面不一致，不能直接宣稱10/10末班已確認。規劃採較早17:30上限，目標16:30回上站；前晚與當晨分別詢問最後上行、最後下行及停風標準。纜車售票電話 +359 884 163 479。</p><p>10/11 Vihren Vertical Kilometer賽事已公布，起點在Vihren Hut；因此把Pirin短走移到10/12。預期較忙是行程判斷，並非已確認道路封閉。</p><p>Top Rent機場航廈櫃檯標準08:30–21:00；10/13要07:45–08:00還車，須先改預約、取得有人接車或鑰匙交回方式的書面確認。官網列改到非標準時段收€32，最終依公司對你合約的報價。</p><p>10/10尚在可靠逐時山區預報範圍以外。9月下雪紀錄只能提示季節風險，不能當成10月10日必有雪或無雪。10/8晚檢查已保留，10/9晚與10/10當晨仍需重查。</p></section><section id="bg-context"><h2>先讀懂保加利亞</h2><p>地理把行程分成四段：Yantra峽谷中的Tarnovo王都；Maritsa平原交通樞紐Plovdiv；靠Vitosha山的Sofia盆地；Rila與Pirin高山。不同城市的坡度、材料、商路與防禦方式都與地形相關。</p><p>保加利亞文化不是單一來源：古代色雷斯遺產、斯拉夫語言人口與早期保加爾政權逐步交會。681年是第一帝國形成的重要紀年；9世紀基督教化與斯拉夫書面文化建立，改變國家的宗教、教育與外交。西里爾字母與格拉哥里字母不是同一套；早期西里爾文字的發展與第一帝國文學學派密切相關。</p><p>1185年Asen、Petar起義開啟第二帝國，Tarnovo成為核心。1393年王都陷落並不表示所有保加利亞政權同日消失。18–19世紀民族復興涉及貿易、學校、印刷、語言與教會組織；本次老城豪宅多屬這個時期，不是中世紀皇宮。</p><p>1878年戰爭後建立的是仍與鄂圖曼帝國保有名義從屬關係的自治公國；1885年統一與1908年完全獨立又是不同階段。10/4四十殉道者教堂與10/8Nevsky可串起「中世紀王權—1878解放—1908獨立」三種記憶。</p><p>東正教教堂先看聖像屏、圓頂全能基督、捐獻者像與壁畫層次。信徒親吻聖像、點蠟燭時讓出動線；不跨越祭壇界線，攝影依每處規則，禁止閃光燈。清真寺禮拜時不作一般觀光入內。</p><p>2026年已採歐元，本頁以€表示。Sirene是鹽水白起司，Kashkaval是黃色起司；kiselo mlyako是優格。Shopska沙拉的國民料理形象與20世紀旅遊推廣有關，不必把每種傳統都追溯到古代。</p></section><section id="bg-photo"><h2>攝影與地圖使用</h2><p>以下是晴天光向建議，不是保證有直射光。順光指陽光從攝影者背後照向主體；夕陽、逆光與藍調另行區分。山丘、窄巷和高山可能比平地日落提早進入陰影。各站Google Maps以完整地名定位，住宿與租車入口以訂單地址為準，不捏造私人公寓座標。</p><div class="tablewrap"><table><thead><tr><th>景點</th><th>建議時段／光線</th><th>現場構圖</th></tr></thead><tbody><tr><td>Tsarevets→西側老城</td><td>10/4 09:00–10:30，朝西拍較接近順光</td><td>河谷、城牆與層疊住宅；面朝東拍入口則可能逆光</td></tr><tr><td>Gurko／Asenevtsi</td><td>10/3–4 17:30–18:30側光；日落後藍調</td><td>河彎、紀念碑、老屋同框；谷底提早失光</td></tr><tr><td>Ancient Theatre</td><td>10/6 09:30–10:30斜光</td><td>柱列與石階有明暗層次；不是整座劇場都順光</td></tr><tr><td>Nebet Tepe</td><td>10/5–6 17:45–18:45夕照</td><td>向東的屋頂較易順光；朝西落日屬逆光</td></tr><tr><td>Alexander Nevsky</td><td>10/8 08:30拍東側；16:00–17:00拍西側</td><td>早晨西入口不保證順光；選擇受光立面</td></tr><tr><td>Seven Lakes</td><td>10/10 10:00–14:00視能見度</td><td>高處朝北俯看湖盆多為順／側光；不為照片上結冰坡</td></tr><tr><td>Rila Monastery</td><td>10:00–12:00院內斜光</td><td>拱廊陰影與教堂亮部反差大；不開閃光</td></tr><tr><td>Pirin／Bansko</td><td>10/12上午山區；老城下午側光</td><td>森林、古樹、岩峰分層；樹根與護欄外不站人</td></tr></tbody></table></div></section><section id="bg-food"><h2>地方飲食、採買與合理預算</h2><p>城市早餐：Banitsa起司酥餅＋優格；兩人正餐可先點一份沙拉、一湯、一主菜再加。Tarator是冷優格小黃瓜湯，怕冷可改熱豆湯。Lyutenitsa是甜椒番茄抹醬；Sharenа sol是香料鹽。看成分、產地與每公斤單價，比只買觀光包裝划算。</p><p>Veliko Tarnovo與Plovdiv只買早餐、水果；Sofia 10/8只補隔日早餐，不扛大袋去機場。10/9 Dupnitsa集中買山區食物，Bansko按實際住一或兩晚採買，避免取消住宿後留太多冷藏品。</p><p>€7–12午餐、€12–22晚餐、€2–6咖啡或飲料屬規劃估算，不是店家報價。停車、溫泉、館票與演出另計；汽油依實際路線、車型和油價，不能用固定€45保證全段足夠。</p><p>保留少量歐元現金供小店與停車，主要城市常能刷卡但不保證每處。駕駛日不喝酒，不用「少量品酒」當安全標準。</p></section><section class="day" id="bg03"><span class="tag">2026-10-03</span><h2>Bucharest → Veliko Tarnovo｜河谷山城與聲光秀</h2><p>住宿：Aleko Apartments City Center。10:10巴士為你的既定安排；跨境抵達時間以票面與當天交通為準。</p><div class="slot" id="bg03-s1"><div class="time">10:10–下午</div><div><h3>FlixBus → 入住</h3><p>至少提前30–45分鐘到Bucharest票面站點。約4小時10分只是最快路線參考，不承諾14:20到。抵達後正式計程車至公寓；保加利亞與羅馬尼亞本段同時區。</p><p><b>交通：</b>Veliko Tarnovo公開站點為Hristo Botev 74；電子票變更優先。這不是10/5的West Bus Station。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Veliko%20Tarnovo%20Hristo%20Botev%2074" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>住宿門牌與可入住時間用訂房確認；尚未到入住時間須先確認寄放。</p></div></div><div class="slot" id="bg03-s2"><div class="time">17:00–17:50</div><div><h3>Samovodska Charshia＋Hadji Nikoli Inn</h3><p>先沿工藝街走一圈，再挑一間有製作活動的工坊停留；買小件陶器、銅器或地方食品，避免只有進口紀念品的店。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Samovodska%20Charshia%20Veliko%20Tarnovo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg03-s2">導覽</a></div></div><div class="slot" id="bg03-s3"><div class="time">18:00–18:35</div><div><h3>General Gurko Street與Asenevtsi河谷視角</h3><p>先走有護欄的觀景路段，拍河彎、老屋與紀念碑。18:35開始往晚餐方向移動，不跨谷追第二個拍攝點。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=General%20Gurko%20Street%20Veliko%20Tarnovo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg03-s3">導覽</a></div></div><div class="slot" id="bg03-s4"><div class="time">18:45–19:20</div><div><h3>簡單晚餐</h3><p>兩人共享Shopska、Kavarma或烤肉，加Parlenka。向店家說明需19:20離開；出餐慢就選簡餐。</p><a class="guide-link" href="#guide-bg03-s4">導覽</a></div></div><div class="slot" id="bg03-s5"><div class="time">19:30報到／20:00開演</div><div><h3>Tsarevets Sound &amp; Light｜已公布場次、尚未代購</h3><p>官方列10/3星期六20:00。購票後依票面集合點；官方觀賞區在6 Nikola Pikolo Street、聖母誕生主教座堂後方，不是走進城堡看。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=6%20Nikola%20Pikolo%20Street%20Veliko%20Tarnovo" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://soundandlight.bg/en" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg03-s5">導覽</a><p><b>預約：</b>建議由你確認票種後購票；若售罄／取消，改老城夜景。</p></div></div><div class="soft"><b>雨天備案</b><p>小雨先工坊、咖啡館；聲光秀是否取消依主辦方，雨衣比遮住後方視線的傘合適。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>延誤先刪Gurko長線與正式晚餐，保留入住、簡餐和已購票的入場緩衝。</p></div></section><section class="day" id="bg04"><span class="tag">2026-10-04</span><h2>Veliko Tarnovo → Arbanasi｜帝國與商人住宅</h2><p>住宿：Aleko Apartments City Center。上午城堡、下午先進Nativity教堂；晚間確認06:50巴士並預約清晨計程車。</p><div class="slot" id="bg04-s1"><div class="time">08:30出門／09:00–11:30</div><div><h3>Tsarevets Fortress</h3><p>主門→皇宮牆基→宗主教堂→視體力繞Baldwin Tower。10月官方09:00–18:00，停止入場17:00；山頂展館可另有開放安排。</p><p><b>費用：</b>€7.67／成人；四十殉道者相關館票€5.11、Nativity與Konstantsalieva各€7.67。官方兩日多館票€20.45，買前確認包含這四處。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Tsarevets%20Fortress%20entrance" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.museumvt.com/en/catalog/architectural-reserve--tsarevets-)" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg04-s1">導覽</a></div></div><div class="slot" id="bg04-s2"><div class="time">12:00–12:45</div><div><h3>午餐與休息</h3><p>城堡外吃湯、麵包或烤肉，補水後往Asenova區；預約13:45計程車。</p></div></div><div class="slot" id="bg04-s3"><div class="time">13:00–13:35</div><div><h3>Holy Forty Martyrs Church</h3><p>留30–40分鐘看銘文與王權記憶；10月下午不要拖至最後入場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Holy%20Forty%20Martyrs%20Church%20Veliko%20Tarnovo" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.museumvt.com/en/sites" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg04-s3">導覽</a></div></div><div class="slot" id="bg04-s4"><div class="time">13:45–14:00</div><div><h3>計程車到Arbanasi</h3><p>事先約回程16:30，避免在村裡臨時等車；費用上車前確認。</p><p><b>交通：</b>車程約15–20分鐘，依接送點；不是舒適的平路步行銜接。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20the%20Nativity%20Arbanasi" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="bg04-s5"><div class="time">14:00–15:00</div><div><h3>Church of the Nativity</h3><p>先進內部壁畫區，再去宅邸。官方10月時段至17:00，最後入場16:30。</p><p><b>費用：</b>€7.67／成人；已有適用多館票則不重買。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20the%20Nativity%20Arbanasi" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://tickets.museumvt.com/en/sites-tickets/church-of-the-nativity-in-arbanasi" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg04-s5">導覽</a></div></div><div class="slot" id="bg04-s6"><div class="time">15:10–16:30</div><div><h3>Konstantsalieva House＋村落</h3><p>宅邸約50分鐘、村街約30分鐘；16:30回城。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Konstantsalieva%20House%20Arbanasi" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg04-s6">導覽</a></div></div><div class="slot" id="bg04-s7"><div class="time">17:15–20:00</div><div><h3>河谷黃昏、晚餐、隔日車票</h3><p>選Gurko或Asenevtsi一處。買隔日早餐、飲水，確認West Bus Station、行李規則與06:50班次。營運商電話+359 884 280 478，辦公室週日可能不營業，宜提前線上訂妥。</p><a class="map" href="https://ppbachvarovi.com/produkt/gorna-oriahovitsa-plovdiv-ponedelnik-sybota/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="soft"><b>雨天備案</b><p>雨勢大縮短城牆，保留教堂與Arbanasi宅邸；計程車點對點，不在濕石坡硬走。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪村落咖啡與第二段河岸；保住Nativity開館時段。</p></div></section><section class="day" id="bg05"><span class="tag">2026-10-05</span><h2>Veliko Tarnovo → Plovdiv｜06:50直達車與城市散步</h2><p>住宿：2BD Heart of Plovdiv Boheme Flat。提早抵達先寄行李，入住時間仍依房東。</p><div class="slot" id="bg05-s1"><div class="time">06:15出門／06:50–約10:30</div><div><h3>West Bus Station → Plovdiv North</h3><p>營運商Bachvarovi正式列週一至六06:50由VT出發，終點Автогара Север。10/5星期一適用；提早確認10/5可售座位與上車月台。</p><p><b>交通：</b>到Plovdiv North後搭正式計程車至公寓；不是南側火車站巴士群。</p><p><b>費用：</b>€12.78／成人，官網路線票價；行李及日期差異另確認。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=West%20Bus%20Station%20Veliko%20Tarnovo" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://ppbachvarovi.com/produkt/gorna-oriahovitsa-plovdiv-ponedelnik-sybota/" target="_blank" rel="noopener">官方資訊</a><p><b>預約：</b>尚未代購。營運商班表是路線資訊，不等於你的票。</p></div></div><div class="slot" id="bg05-s2"><div class="time">11:00–13:00</div><div><h3>寄行李、午餐、Tsar Simeon Garden</h3><p>預留行李與休息；花園只短走，不把第一天下午塞滿室內館。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Tsar%20Simeon%20Garden%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg05-s2">導覽</a></div></div><div class="slot" id="bg05-s3"><div class="time">14:00–15:00</div><div><h3>Roman Stadium＋Dzhumaya Mosque</h3><p>沿主步行街走到Dzhumaya廣場，下望競技場北端；清真寺非禮拜且允許才入內。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Roman%20Stadium%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.visitplovdiv.com/en/node/598" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg05-s3">導覽</a></div></div><div class="slot" id="bg05-s4"><div class="time">15:15–17:00</div><div><h3>Kapana工藝巷、咖啡與入住休息</h3><p>選一條巷慢走，找街頭藝術、設計小店與咖啡。Pavaj、Aylyakria列候選，當天營業與座位另確認。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kapana%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg05-s4">導覽</a></div></div><div class="slot" id="bg05-s5"><div class="time">17:45–18:45</div><div><h3>Nebet Tepe黃昏</h3><p>沿老城公共步道上坡，拍屋頂和平原，天黑前回有人活動的街道；19:15晚餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Nebet%20Tepe%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg05-s5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>改咖啡、可開放宅邸或Basilica，Nebet Tepe濕滑則取消；不站古牆。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>巴士延誤保留Stadium、Kapana與晚餐；花園和山丘擇一。</p></div></section><section class="day" id="bg06"><span class="tag">2026-10-06</span><h2>Plovdiv｜羅馬劇場、復興宅邸與馬賽克</h2><p>住宿：2BD Heart of Plovdiv Boheme Flat。步行日，石板坡路穿防滑鞋；選兩棟宅邸即可。</p><div class="slot" id="bg06-s1"><div class="time">09:30–10:30</div><div><h3>Ancient Theatre</h3><p>09:30到場。管理機構Old Plovdiv列4–10月每日09:30–18:00，12:30–13:00午休；臨時布台可能限制部分區域。</p><p><b>費用：</b>€3.58／成人單點；五點聯票€10.74，不含大小Basilica。依購票頁最終售價。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ancient%20Theatre%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://oldplovdiv.bg/en/sights/3" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg06-s1">導覽</a></div></div><div class="slot" id="bg06-s2"><div class="time">10:40–12:30</div><div><h3>Hisar Kapia → Hindliyan House／Balabanov House</h3><p>城門外觀後選1–2棟宅邸；民族誌博物館可取代其中一棟，不能全部追加。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hindliyan%20House%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://oldplovdiv.bg/en/tickets" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg06-s2">導覽</a></div></div><div class="slot" id="bg06-s3"><div class="time">12:45–13:45</div><div><h3>Kapana午餐</h3><p>湯＋主菜共享，午后保留專注力看馬賽克；休息後步行到Basilica。</p></div></div><div class="slot" id="bg06-s4"><div class="time">14:15–15:45</div><div><h3>Bishop’s Basilica of Philippopolis</h3><p>本日室內重點，預留90分鐘。管理機構列每日09:00–18:00；原稿17:15最後入場未在本次讀取的管理頁重獲確認，故不靠近閉館才到。</p><p><b>費用：</b>英文官方頁寫€7.57／成人但同列舊價15BGN，折算數字不一致；按即時售票頁／現場歐元價，預留約€8。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bishop%20Basilica%20Philippopolis" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://oldplovdiv.bg/en/tickets" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg06-s4">導覽</a></div></div><div class="slot" id="bg06-s5"><div class="time">16:00–17:00</div><div><h3>Forum＋Odeon</h3><p>辨認廣場與小型會議／表演空間，再找咖啡休息。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Roman%20Odeon%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg06-s5">導覽</a></div></div><div class="slot" id="bg06-s6"><div class="time">17:30–晚間</div><div><h3>Nebet Tepe或Bunardzhika二選一</h3><p>體力普通回Nebet；想換角度才上Bunardzhika。晚餐後用BDZ確認10/7列車、施工與巴士備案。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bunardzhika%20Plovdiv" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.bdz.bg/en" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg06-s6">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>劇場有雨縮短，延長Hindliyan與Basilica；下午山丘取消。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪第二棟宅邸、藝廊與Bunardzhika，保留劇場和Basilica。</p></div></section><section class="day" id="bg07"><span class="tag">2026-10-07</span><h2>Plovdiv → Sofia｜Serdica地下城市與礦泉街區</h2><p>住宿：Luxury Apartments 1。車次以10/7 BDZ日期查詢結果為準；目前不把舊班表當確定票。</p><div class="slot" id="bg07-s1"><div class="time">上午／目標14:00前入住或寄放</div><div><h3>直達火車優先、巴士備案</h3><p>選約2.5–3.5小時且無不合理轉乘的直達車；有施工接駁或時間不佳改直達巴士。訂票時核對目的地Sofia與Plovdiv上車站，不用猜班次。</p><p><b>交通：</b>Sofia Central Railway／Central Bus Station抵達後，行李多可叫正式計程車；公寓門牌依訂單。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Plovdiv%20railway%20station" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://razpisanie.bdz.bg/en" target="_blank" rel="noopener">官方資訊</a></div></div><div class="slot" id="bg07-s2"><div class="time">15:00–15:45</div><div><h3>Ancient Serdica Archaeological Complex</h3><p>先看羅馬道路、排水與地基，再抬頭看現代政府大樓和地鐵。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ancient%20Serdica%20Complex%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg07-s2">導覽</a></div></div><div class="slot" id="bg07-s3"><div class="time">15:50–16:30</div><div><h3>St George Rotunda＋Presidency</h3><p>繞進庭院看圓形教堂；如舉行儀式，安靜等候或只看外觀。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20of%20St%20George%20Rotunda%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg07-s3">導覽</a></div></div><div class="slot" id="bg07-s4"><div class="time">16:35–17:00</div><div><h3>Sveta Nedelya</h3><p>廣場與教堂短訪。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sveta%20Nedelya%20Church%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg07-s4">導覽</a></div></div><div class="slot" id="bg07-s5"><div class="time">17:10–18:15</div><div><h3>Banya Bashi → Central Mineral Baths → Central Market Hall</h3><p>主要看外觀；中央市場作採買與休息。猶太會堂若想入內需另確認時段和安檢，今天不保證趕得到。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Central%20Mineral%20Baths%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg07-s5">導覽</a></div></div><div class="slot" id="bg07-s6"><div class="time">18:30–20:00</div><div><h3>Vitosha Boulevard晚餐</h3><p>看步行街盡頭的Vitosha山輪廓，買早餐與水；晚上不再安排跨城移動。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Vitosha%20Boulevard%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg07-s6">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>中央浴場歷史館或考古館替代露天長線；教堂與咖啡穿插。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>抵達晚保留Serdica、Rotunda、Vitosha；其餘移10/8午后但不擠壓已購演出。</p></div></section><section class="day" id="bg08"><span class="tag">2026-10-08</span><h2>Sofia｜國家歷史、週四美術館與芭蕾</h2><p>住宿：Luxury Apartments 1。19:00《Romeo and Juliet》已公布，未代購。下午考古館與Kvadrat 500二選一。</p><div class="slot" id="bg08-s1"><div class="time">08:30–09:10</div><div><h3>Alexander Nevsky Cathedral</h3><p>先外觀後主殿；早晨東側較受光，西入口不保證順光。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Alexander%20Nevsky%20Cathedral%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg08-s1">導覽</a></div></div><div class="slot" id="bg08-s2"><div class="time">09:15–09:55</div><div><h3>St Sofia Church</h3><p>先地面紅磚教堂；地下墓葬如已開放再看，若尚未開門可與Crypt交換。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Saint%20Sofia%20Church%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg08-s2">導覽</a></div></div><div class="slot" id="bg08-s3"><div class="time">10:00–10:50</div><div><h3>Alexander Nevsky Crypt｜Christian Art Museum</h3><p>週四National Gallery分館票價官方列€2。主殿與Crypt不同入口／票制；臨時特展條件以館方為準。</p><p><b>費用：</b>€2／人／館，週四一般票規則。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Museum%20of%20Christian%20Art%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nationalgallery.bg/ticket-prices-for-visiting-the-national-gallery-from-10-08-202607-08-2026/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg08-s3">導覽</a></div></div><div class="slot" id="bg08-s4"><div class="time">11:00–12:00</div><div><h3>Russian Church＋黃色石磚街區</h3><p>看外觀與周邊近代城市建築；有信徒排隊時地下只短訪，12:00午餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Russian%20Church%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg08-s4">導覽</a></div></div><div class="slot" id="bg08-s5"><div class="time">13:30–16:00</div><div><h3>National Archaeological Museum 或 Kvadrat 500</h3><p>歷史優先選考古館；藝術優先選Kvadrat 500週四€2＋Goya「Dreams of a Keen Mind」（官方8/4–10/21）。兩館不全部塞入。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=National%20Archaeological%20Museum%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nationalgallery.bg/exhibitions/francisco-goya-dreams-of-a-keen-mind/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg08-s5">導覽</a></div></div><div class="slot" id="bg08-s6"><div class="time">17:15晚餐／18:30入場／19:00–約22:10</div><div><h3>Sofia Opera and Ballet｜Romeo and Juliet</h3><p>Prokofiev芭蕾，Grand Hall，Vrabcha 1。官方長度3小時10分、兩次中場；不是歌劇，不需要理解唱詞。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sofia%20Opera%20and%20Ballet%20Vrabcha%201" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.operasofia.bg/repertoire/1056" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg08-s6">導覽</a><p><b>預約：</b>使用官方購票連結選10/8 19:00；未代購。</p></div></div><div class="soft"><b>雨天備案</b><p>本日以室內為主；Nevsky外觀在雨停空檔補拍，不追加遠郊山區。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>刪Russian Church或縮短第二個藝術館；17:15晚餐、18:30進劇院不變。</p></div></section><section class="day" id="bg09"><span class="tag">2026-10-09</span><h2>SOF取車 → Dupnitsa → Sapareva Banya</h2><p>住宿：Апартаменти ЗДРАВЕ。08:30 TOP租車；取車地點以voucher為準。</p><div class="slot" id="bg09-s1"><div class="time">約07:30出門／08:15抵達／08:30辦理</div><div><h3>Top Rent Sofia Airport取車</h3><p>航廈櫃檯和距機場約2.5km的Head office是不同地點。先看voucher再叫車，不預設一定T2櫃檯；標準櫃檯08:30才開始。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sofia%20Airport%20Top%20Rent%20A%20Car" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://toprentacar.bg/en/office-sofia-airport" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg09-s1">導覽</a><p><b>預約：</b>提前還車尚需你與公司確認；本頁未修改租約。</p></div></div><div class="slot" id="bg09-s2"><div class="time">約09:30–12:15</div><div><h3>Sofia → Dupnitsa採買</h3><p>依當日導航走主要公路；含出城與超市停留約2.5–3小時。Lidl／Kaufland等以地圖當日營業店為準。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=supermarket%20Dupnitsa%20Bulgaria" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg09-s2">導覽</a></div></div><div class="slot" id="bg09-s3"><div class="time">12:30–16:30</div><div><h3>Sapareva Banya入住、Geyser與St Nicholas</h3><p>先確認可入住或寄行李；下午短走，再選有營業的溫泉設施。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Geyser%20Sapareva%20Banya" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg09-s3">導覽</a></div></div><div class="slot" id="bg09-s4"><div class="time">17:30晚餐／19:00決策</div><div><h3>七湖A/B條件與取消期限</h3><p>看纜車當日公告、PSS山區資訊、2000–2500m風雪與能見度、即時影像時間戳、夜間凍融。確認住宿取消最後期限，不把手機晴天圖示當步道乾燥證據。</p><a class="map" href="https://rilskiezera.bg/ново-работно-време/" target="_blank" rel="noopener">官方資訊</a><p><b>預約：</b>若退款期限較早，必須按訂單提早決定或接受成本；不自動取消任一間。</p></div></div><div class="soft"><b>雨天備案</b><p>平地採買與溫泉照常；不為看山改走小路。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>取車延誤刪市區散步，不刪採買、住宿與翌日山區查核。</p></div></section><section class="day" id="bg10"><span class="tag">2026-10-10</span><h2>Seven Rila Lakes A／Rila Monastery B｜當晨決策</h2><p>住宿二擇一：A續住Апартаменти ЗДРАВЕ；B到Ski Nomad Bansko。10/10是一個旅行日、一晚住宿，不能重複計數。</p><nav><a href="#bg10-original-a">方案 A｜原行程</a><a href="#bg10-b">方案 B｜七湖不適合：Rila Monastery → Bansko</a></nav><section class="soft" id="bg10-b"><h3>方案 B｜七湖不適合：Rila Monastery → Bansko</h3><h3>08:00出發 → 10:00–12:30修道院 → 午餐 → 約16:00–17:00 Bansko</h3><p>必須確認道路可通行；Sapareva與Rila Monastery在不同山谷，車行需繞山西側，沒有穿過七湖的直接公路。行車時間是含緩衝規劃，依當日導航調整。</p><p>修道院導覽見10/11同名站；本分支把該參觀提前一天，10/11不再重複去。保留Ski Nomad 10/10–12兩晚，Sapareva第二晚由你依取消條款處理。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Rila+Monastery">Rila Monastery 地圖</a></section><h3 id="bg10-original-a">方案 A｜原行程（保留）</h3><div class="slot" id="bg10-s1"><div class="time">06:30確認／07:30出發</div><div><h3>A：纜車和路面雙重通過才上山</h3><p>山屋與纜車員工確認可行後前往下站，預留45–60分鐘山路、停車與排隊，08:30首批只是目標。不要沿用「約10公里就到下站」的過度簡化。</p><p><b>交通：</b>只走開放鋪面道路，山路有冰且車胎不適合就取消；不開越野車抄步道。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Rila%20Lakes%20chairlift%20lower%20station" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://rilskiezera.bg/ново-работно-време/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="slot" id="bg10-s2"><div class="time">08:30–09:00</div><div><h3>Rila Lakes Chairlift</h3><p>公開票價頁成人來回€16；時段頁不一致，現場重問最後下行。票內乘客意外保障不能當成山區救援保險。</p><p><b>費用：</b>成人來回€16，9/27官方頁列價；10/10票價與營運再確認。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Rila%20Lakes%20chairlift" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://rilskiezera.bg/удължено-работно-време/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="slot" id="bg10-s3"><div class="time">09:00–13:00</div><div><h3>Rila Lakes Hut → Twin／Kidney｜標準目標</h3><p>依園區開放標示選主步道與合適環線，不把全部低湖逐一繞完再追高點。含拍照、午餐約3.5–4.5小時；能見度變差立即縮短。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=The%20Kidney%20Seven%20Rila%20Lakes" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg10-s3">導覽</a></div></div><div class="slot" id="bg10-s4"><div class="time">最早13:00前決定／最多加走至14:00</div><div><h3>Eye／Tear高處｜條件式，不是標準行程</h3><p>只有地面乾燥無冰、新雪未覆蓋路線、風況穩定且視野清楚才考慮。依現場路線牌與你們速度倒推回程；14:00無論到哪裡都開始返向山屋。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=The%20Eye%20Seven%20Rila%20Lakes" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg10-s4">導覽</a></div></div><div class="slot" id="bg10-s5"><div class="time">16:00目標／16:30最晚回上站</div><div><h3>下行 → Sapareva溫泉與晚餐</h3><p>以16:30回上站為保守目標，視現場末班再提早；17:30不是你可以17:29才回來的保證。回程後休息，翌日修道院與轉移仍要精神。</p><a class="map" href="https://www.pss-bg.bg/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg10-s5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>纜車停駛、雨雪冰層、雷暴、濃霧、強風或官方警告，採B。平地也有惡劣天氣則先留安全城鎮，不強行轉移。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>A優先刪Eye、Tear，Kidney或Twin折返；不刪回上站緩衝。B刪沿途支線直接到Bansko。</p></div></section><section class="day" id="bg11"><span class="tag">2026-10-11</span><h2>Rila Monastery轉移日／Bansko完整日｜避開Vihren賽事</h2><p>住宿：Ski Nomad Bansko。A昨天七湖成功，今天看Rila；B昨天已看Rila，今天留Bansko，不重複繞山。</p><nav><a href="#bg11-original-a">方案 A｜原行程</a><a href="#bg11-b">方案 B｜昨天已到Bansko：民族復興老城日</a></nav><section class="soft" id="bg11-b"><h3>方案 B｜昨天已到Bansko：民族復興老城日</h3><h3>09:30教堂 → 10:30宅邸 → 午餐 → 14:00博物館 → 16:00老街</h3><p>Holy Trinity → Velyanova House → Mehana午餐 → Nikola Vaptsarov Museum或Neofit Rilski House → Pirin Street。星期日各館個別開放請住宿協助確認；關門就用老街與咖啡替代，不把外觀說成已入館。</p><p>10/11山屋有登高賽，留城內可避免停車與道路可能擁擠；賽事不等於官方封路公告。文化解說見下方Bansko站。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Bansko+Old+Town">Bansko 老城</a></section><h3 id="bg11-original-a">方案 A｜原行程（保留）</h3><div class="slot" id="bg11-s1"><div class="time">08:00–約10:00</div><div><h3>A：Sapareva Banya → Rila Monastery</h3><p>早餐、退房、裝車後繞山西側公路；不經七湖。</p><p><b>交通：</b>抓約2小時含緩衝；當日導航与道路公告優先。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Rila%20Monastery" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="bg11-s2"><div class="time">10:00–12:30</div><div><h3>Rila Monastery｜UNESCO文化遺產</h3><p>外牆與院落→主教堂外廊→Hrelyo塔外觀→博物館Rafail十字架。各館季節開放、儀式與票價依官方；不預設10月可登塔。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Rila%20Monastery" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://whc.unesco.org/en/list/216/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg11-s2">導覽</a></div></div><div class="slot" id="bg11-s3"><div class="time">12:30–13:15</div><div><h3>山谷午餐</h3><p>Mekitsa配優格、起司，加湯或正餐補足；不要只吃甜麵餅當長途駕駛午餐。</p></div></div><div class="slot" id="bg11-s4"><div class="time">13:15–16:30</div><div><h3>Rila → Bansko；Stob只作可刪支線</h3><p>直接到Bansko最穩。Stob Earth Pyramids需另留停車與步行至少1小時；乾燥、體力好且能在天黑前到住宿才加。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Stob%20Earth%20Pyramids" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg11-s4">導覽</a></div></div><div class="slot" id="bg11-s5"><div class="time">17:00–20:00</div><div><h3>Bansko Old Town、Holy Trinity與Mehana</h3><p>入住先確認Ski Nomad停車位置。A只看教堂可開放區和街景；B白天可深入宅邸與博物館。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Holy%20Trinity%20Church%20Bansko" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg11-s5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>修道院可看外廊和館藏；Bansko選開放室內館。道路有管制依官方指示，不因訂房冒險。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>A刪Stob支線；B少看一間館，不把10/12高山行程挪回賽事日。</p></div></section><section class="day" id="bg12"><span class="tag">2026-10-12</span><h2>Pirin短走 → Sofia｜13:00左右北返</h2><p>住宿：N9 Studentski Loft。Pirin公路與步道安全才上；不登Vihren峰。最重要是日間回Sofia、補油與打包。</p><nav><a href="#bg12-original-a">方案 A｜原行程</a><a href="#bg12-c">方案 C｜Melnik＋Rozhen：僅低海拔天氣、道路較好且願意多開車</a></nav><section class="soft" id="bg12-c"><h3>方案 C｜Melnik＋Rozhen：僅低海拔天氣、道路較好且願意多開車</h3><h3>07:30出發 → 09:00–12:30修道院與老村 → 午餐 → 最晚13:30北返</h3><p>山區不適合不代表Melnik必晴。需確認當地乾燥、無強降雨／道路警告，預留返回Sofia約3–4小時及塞車餘裕；疲累就直接回Sofia。此方案完全取代Pirin，不串在同一天。</p><p>駕駛者不品酒；同行者可短品飲或買瓶帶走。酒窖參觀、砂岩觀景與修道院不能全部長停。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Melnik+Bulgaria">Melnik地圖</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Rozhen+Monastery">Rozhen Monastery地圖</a><details><summary>導覽</summary><p>Melnik的砂岩與黏土質沉積物受侵蝕形成尖塔，雨後坡面易鬆滑，不自行越過邊緣取景。Kordopulov House把地下酒窖、生產與上層富商住宅組合，呈現葡萄酒貿易和跨文化裝飾。</p><p>Shiroka Melnishka Loza是地方代表葡萄。Rozhen規模與氣氛較偏區域性修道院，可和Rila的國家文化象徵比較；不能用「比較小」等同歷史不重要。</p></details></section><h3 id="bg12-original-a">方案 A｜原行程（保留）</h3><div class="slot" id="bg12-s1"><div class="time">07:45退房／08:00–09:00</div><div><h3>Bansko → Baikushev’s Pine</h3><p>當晨確認Vihren方向公路、停車與冰雪。走鋪面開放道路，停合法車位；禁止通行就原路回城。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Baikushevs%20pine%20Bansko" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg12-s1">導覽</a></div></div><div class="slot" id="bg12-s2"><div class="time">09:15–11:00</div><div><h3>Vihren Hut周邊｜Pirin UNESCO自然遺產</h3><p>以山屋、溪谷與森林到高山帶的短走為限，約1–2小時。山屋營業與餐飲不保證，自備水和點心。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Vihren%20Hut%20Bulgaria" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://whc.unesco.org/en/list/225/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg12-s2">導覽</a></div></div><div class="slot" id="bg12-s3"><div class="time">11:45–13:00</div><div><h3>Bansko午餐 → 北返</h3><p>吃簡單正餐後出發；導航抓交通緩衝，不超速追回山區耽誤。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bansko%20Bulgaria" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="bg12-s4"><div class="time">約16:30–18:00</div><div><h3>N9 Studentski Loft入住、加油與採買</h3><p>依當日路況抵達，停車位置請房東確認。核對明日機場還車入口、非營業時間接車書面指示、航廈與航班。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Studentski%20Grad%20Sofia" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bg12-s4">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>預設Bansko早餐後直接回Sofia室內活動／休息。Melnik是天氣與道路都較好時的C方案，不是所有雨天的自動替代。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>山路延誤只看古樹或直接離山；不等雲開、不追加高山湖和纜車。</p></div></section><section class="day" id="bg13"><span class="tag">2026-10-13</span><h2>Sofia Airport還車 → ATH → CAI</h2><p>你的航班資料：Aegean 10:55出發、經Athens到Cairo；航班號、航廈及轉機安排以電子票為準。</p><div class="slot" id="bg13-s1"><div class="time">06:45起床／07:10出門</div><div><h3>早餐、裝車、補油</h3><p>前晚選好加油站；保留最後加油收據，拍油表和里程，不把早餐留到路上找餐廳。</p><p><b>交通：</b>道路與入口依voucher，不只導航航廈大門。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sofia%20Airport" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="bg13-s2"><div class="time">07:45–08:00到場</div><div><h3>Top Rent提前還車｜需書面確認</h3><p>這個時間必須已獲公司同意。確認接車人、停車位或鑰匙箱、車況檢查和是否需要接駁；若仍是08:30合約，立刻在出發前要求可行安排。</p><p><b>費用：</b>預計提前時段變更費€32／訂單，須公司確認。</p><a class="map" href="https://toprentacar.bg/en/office-sofia-airport" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-bg13-s2">導覽</a></div></div><div class="slot" id="bg13-s3"><div class="time">目標08:20–08:30進航廈／10:55起飛</div><div><h3>SOF → ATH → CAI</h3><p>留足托運、安檢與登機步行；確認同一張票行李是否直掛、Athens轉機門與證件需求。機場報到／登機截止以Aegean票面規則，08:30不是最晚保證。</p><a class="map" href="https://en.aegeanair.com/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="soft"><b>雨天備案</b><p>下雨或晨間交通增加便更早離開；不留最後一刻才找加油站。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>不排任何景點。還車服務未獲書面確認時，提前和公司處理；不能當日賭有人提早上班。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>VT四處文化景點</td><td>單買約€28.12；兩日多館票€20.45</td><td>每人</td><td>9/27官方價；聯票須確認包含欲去四處</td></tr><tr><td>Plovdiv單點／五點聯票</td><td>€3.58／€10.74</td><td>成人</td><td>管理機構官網；聯票排除大小Basilica</td></tr><tr><td>VT→Plovdiv Bachvarovi</td><td>€12.78</td><td>成人單程</td><td>9/27官方路線頁；10/5座位待購</td></tr><tr><td>National Gallery週四</td><td>€2</td><td>每人／館</td><td>官方8/10起公告；10/8適用一般規則</td></tr><tr><td>七湖纜車</td><td>€16</td><td>成人來回</td><td>9/27官方票價頁；時段頁互有衝突</td></tr><tr><td>Top Rent改非標準時段</td><td>€32</td><td>每訂單</td><td>官方條款；個人訂單需書面報價</td></tr><tr><td>Sound &amp; Light／芭蕾</td><td>依座位即時票價</td><td>每人</td><td>場次已公布；未代購</td></tr><tr><td>Plovdiv館票日</td><td>約€15–25</td><td>每人</td><td>預算，不是已查得套票價</td></tr><tr><td>溫泉</td><td>約€10–25</td><td>每人</td><td>依設施與票種，預算</td></tr><tr><td>停車</td><td>約€3–10</td><td>每天</td><td>規劃餘額，依現場標示</td></tr></tbody></table></div><p>住宿、租車與跨國航班依你的訂單；頁面不把未確認票價寫成免費。查核日2026/9/27；山區10/10狀態必須臨近再確認。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-bg03-s2"><summary>Samovodska Charshia＋Hadji Nikoli Inn｜導覽</summary><h3>現場看什麼</h3><p>看狹窄店面如何容納深長工坊：工作檯靠街、上層住宅、貨物展示與排水石溝。客棧庭院可觀察客房、倉庫和交易空間如何集中。</p><h3>歷史背景</h3><p>19世紀周邊農民與工匠來此交易。Charshia是鄂圖曼城市市集概念；商店按工種集中，形成價格、信用與技術傳承的網絡。</p><h3>相關故事</h3><p>Hadji Nikoli Inn屬商旅客棧文化。貨物安全、牲畜停放與消息交換和睡一晚同樣重要。今日餐飲、展覽用途是歷史空間的再利用。</p><h3>實用提醒</h3><p>拍手藝人的工作先詢問；沒有正在示範不代表店家有義務表演。工坊關門便改街景，不延誤晚間演出。</p><a class="guide-return" href="#bg03-s2">回到行程</a></details><details class="guide-card" id="guide-bg03-s3"><summary>General Gurko Street與Asenevtsi河谷視角｜導覽</summary><h3>現場看什麼</h3><p>從街道看房屋可能僅兩層，轉向河谷卻成多層；看石造基座承托木構挑出的上樓。選河谷和Asenevtsi同框，讀出城市的垂直結構。</p><h3>歷史背景</h3><p>民族復興住宅依坡面擴建，底層偏倉儲與承重，上層利用較輕木構增加採光和生活空間。今日山城輪廓主要不是中世紀遺存。</p><h3>相關故事</h3><p>Asenevtsi建於1985年，紀念1185起義800週年；四名騎馬統治者與高聳中央構造，把中世紀史轉成20世紀國家紀念語言。</p><h3>實用提醒</h3><p>黃昏是側光／藍調題材，不保證順光。石板濕滑，別為取景站上牆頂；樓窗與院子屬居民私領域。</p><a class="guide-return" href="#bg03-s3">回到行程</a></details><details class="guide-card" id="guide-bg03-s4"><summary>簡單晚餐｜導覽</summary><h3>現場看什麼</h3><p>Sirene刨在番茄、小黃瓜和甜椒上；Kavarma的陶鍋保溫，肉與洋蔥甜椒慢燉。Kebapche是長條肉，Kyufte是圓肉餅。</p><h3>歷史背景</h3><p>沙拉、發酵乳、烤甜椒與烤肉體現巴爾幹共享飲食。菜餚並非每一道都只屬一個國家。</p><h3>相關故事</h3><p>Rakia可作餐前社交飲品，但不必喝。用餐未必整桌同步出菜。</p><h3>實用提醒</h3><p>今晚有演出不點需長時間製作的大陶鍋；詢問份量再加菜。</p><a class="guide-return" href="#bg03-s4">回到行程</a></details><details class="guide-card" id="guide-bg03-s5"><summary>Tsarevets Sound &amp; Light｜已公布場次、尚未代購｜導覽</summary><h3>現場看什麼</h3><p>把整座山看作舞台：燈光勾出城牆、山脊與權力中心，音樂和鐘聲連結帝國興衰。白天的考古地形會在夜間變成敘事。</p><h3>歷史背景</h3><p>節目起源於1985年紀念活動，以近代視聽技術重新講述中世紀與民族復興；它是當代歷史詮釋，不是對古代事件的原樣重現。</p><h3>相關故事</h3><p>先認識1185與1393兩個節點，隔天實地找出宮殿、宗主教山頂與入口，更容易把表演和空間對上。</p><h3>實用提醒</h3><p>演出時不用閃光；確認票種觀賞位置、退款與天候政策。庫存與售價會變，不把官網可售當成已保留座位。</p><a class="guide-return" href="#bg03-s5">回到行程</a></details><details class="guide-card" id="guide-bg04-s1"><summary>Tsarevets Fortress｜導覽</summary><h3>現場看什麼</h3><p>第一站回看狹窄入口山脊，理解守軍如何控制通道。皇宮區要按複合院落看：行政、禮儀、居住與防衛，而非想像只有一個大殿。再比較宗教與王權所在高點。</p><h3>歷史背景</h3><p>第二帝國都城同時容納宮廷、教會、工匠、住宅與水源設施。1393年陷落改變政治中心；今日城牆、教堂有大規模現代修復，不能把每塊外觀完整的石材當作中世紀原件。</p><h3>相關故事</h3><p>宗主教堂內Theofan Sokerov的現代壁畫用暗色、變形人物與戰爭場景處理民族記憶。Baldwin I於1205年被俘是真實歷史背景，現存塔樓和確切囚禁房間的對應則不能當成確證。</p><h3>實用提醒</h3><p>09:00–10:30向西拍老城較順光。穿抓地鞋、帶防風層；城牆边無護欄處不靠近。山頂內部是否拍照及另收費看現場。</p><a class="guide-return" href="#bg04-s1">回到行程</a></details><details class="guide-card" id="guide-bg04-s3"><summary>Holy Forty Martyrs Church｜導覽</summary><h3>現場看什麼</h3><p>重點找刻字石柱，不只看祭壇。銘文記錄勝利、建築與君主形象，是統治者留下的政治文本；閱讀展板，分辨原件、移置與重建。</p><h3>歷史背景</h3><p>Ivan Asen II以1230年Klokotnitsa戰役勝利為建堂背景。較早Omurtag等銘文被納入後來的宗教空間，使第一、第二帝國的王權在同一建築中對話。</p><h3>相關故事</h3><p>1908年9月22日完全獨立宣言與此地相連。1878自治並不等於1908主權獨立；這是全程最值得記清的年代差別。</p><h3>實用提醒</h3><p>教堂位於谷底，從城堡下來仍有坡路；別按直線距離估步行。儀式優先，拍照依管理指示。</p><a class="guide-return" href="#bg04-s3">回到行程</a></details><details class="guide-card" id="guide-bg04-s5"><summary>Church of the Nativity｜導覽</summary><h3>現場看什麼</h3><p>讓眼睛先適應低光。按空間順序看聖經敘事、祖先譜系與道德圖像；Tree of Jesse呈現宗教血脈，Wheel of Life把人生循環和權勢無常放在一起。</p><h3>歷史背景</h3><p>壁畫經多次繪製，反映鄂圖曼時代商人社群的捐獻、宗教教育與跨區域畫工技藝。樸素外觀與密集內部並存，不宜用一條「所有教堂都被禁止華麗」概括數百年制度變化。</p><h3>相關故事</h3><p>壁畫相當於公共視覺教材，但不是每幅都只為不識字的人設計；熟悉宗教經文的觀眾也能從人物位置、手勢和畫面對照得到意義。</p><h3>實用提醒</h3><p>不使用閃光燈；攝影许可與小空間導覽限制依館方。先問能否解說關鍵畫面，比急著拍全景更有效。</p><a class="guide-return" href="#bg04-s5">回到行程</a></details><details class="guide-card" id="guide-bg04-s6"><summary>Konstantsalieva House＋村落｜導覽</summary><h3>現場看什麼</h3><p>先看高牆、小街窗和大門，再看院落、水井、儲物區與正式客廳。外部防守、內部舒適，說明房子兼具財產保護與身分展示。</p><h3>歷史背景</h3><p>Arbanasi靠區域貿易繁榮。居民和商人連結多語言的鄂圖曼市場，住宅的木雕、坐榻和接待禮儀不能簡化為封閉單一民族的樣式。</p><h3>相關故事</h3><p>和Gurko住宅比較：前者利用城市陡坡擴張空間；這裡較能以高牆包住獨立院落。同樣富裕，建築答案因地形和安全需求而不同。</p><h3>實用提醒</h3><p>館內開放依現場；若宅邸關門，保留村街與咖啡，不等待到影響回程。私人庭院不推門。</p><a class="guide-return" href="#bg04-s6">回到行程</a></details><details class="guide-card" id="guide-bg05-s2"><summary>寄行李、午餐、Tsar Simeon Garden｜導覽</summary><h3>現場看什麼</h3><p>從平坦街道看遠處孤立山丘，再進花園看林蔭、湖面與市民長椅。和Tarnovo的峽谷坡城相比，Plovdiv更像平原上散布幾座城市高點。</p><h3>歷史背景</h3><p>Maritsa河與穿越巴爾幹的交通走廊讓城市長期繁榮。Philippopolis、Trimontium與Filibe等名稱反映不同时期的統治與城市形象。</p><h3>相關故事</h3><p>Aylyak是當地常用來表達放慢節奏的生活語彙。花園與咖啡館就是觀察它的地方，不需要另找一個「文化表演」。</p><h3>實用提醒</h3><p>抵達早不等於可提早入住；行李安排先談好。噴泉演出不列固定節目，未核實日期不等待。</p><a class="guide-return" href="#bg05-s2">回到行程</a></details><details class="guide-card" id="guide-bg05-s3"><summary>Roman Stadium＋Dzhumaya Mosque｜導覽</summary><h3>現場看什麼</h3><p>競技場露出的是彎曲北端座席；沿步行街想像長條賽道延伸到現代商店下方。再看旁邊九圓頂清真寺，古代與鄂圖曼城市軸線直接重疊。</p><h3>歷史背景</h3><p>羅馬Stadium服務體育競技和公共活動，不同於半圓Theatre，更不是橢圓角鬥場。Dzhumaya今日主要建築與Murad II時代相關，修正舊稿誤寫Murad I重建。</p><h3>相關故事</h3><p>城市考古常不是挖出完整空地：現代道路、地基與商業生活仍在上面運作。局部露出也能讓你讀出古代尺度。</p><h3>實用提醒</h3><p>清真寺是活躍信仰場所；入內看指示脫鞋、遮肩膝，不拍信徒近照。考古區開放範圍以當日為準。</p><a class="guide-return" href="#bg05-s3">回到行程</a></details><details class="guide-card" id="guide-bg05-s4"><summary>Kapana工藝巷、咖啡與入住休息｜導覽</summary><h3>現場看什麼</h3><p>抬頭看招牌、窄地塊與上層窗戶，再看店面如何改為咖啡、設計與餐饮。巷道不規則，反映逐步形成的商業區。</p><h3>歷史背景</h3><p>Kapana名稱有「陷阱」之意，常與密集巷路連結；昔日工匠分業形成的街區，近年借文化活動和都市更新重獲使用。</p><h3>相關故事</h3><p>保留街巷不等於保留原產業：今日消費與夜生活能支持維修，也會抬高租金、改變居民組成。觀察誰在使用空間，比只找彩色裝飾更有意思。</p><h3>實用提醒</h3><p>入店拍商品先問；熱門餐館訂位。不為餐廳名氣多等一小時，今晚仍要上坡看景。</p><a class="guide-return" href="#bg05-s4">回到行程</a></details><details class="guide-card" id="guide-bg05-s5"><summary>Nebet Tepe黃昏｜導覽</summary><h3>現場看什麼</h3><p>看城牆不同石材、接縫和新舊修復，再把Maritsa平原、老城屋頂與現代公寓納入視野。山丘提供監視商路與河谷的優勢。</p><h3>歷史背景</h3><p>此處保存多時期聚落和防禦層，不能把所有牆都標為同一個色雷斯時代。考古可見度和新修步道是現代保存工作的結果。</p><h3>相關故事</h3><p>從這裡看到的是一座仍擴張的城市，並非與現代隔離的遺址公園。明日宅邸與劇場就在这些山丘與坡地中。</p><h3>實用提醒</h3><p>夕照朝東拍較順光；向西拍天空屬逆光。不要爬古牆與未開放區；依現場入口與關閉時間提早離開。</p><a class="guide-return" href="#bg05-s5">回到行程</a></details><details class="guide-card" id="guide-bg06-s1"><summary>Ancient Theatre｜導覽</summary><h3>現場看什麼</h3><p>由高處看半圓座席與舞台後方柱式立面，再近看石塊接合與銘文。Scaenae frons不是單純背景，而把神祇、皇帝與城市權威放在觀眾面前。</p><h3>歷史背景</h3><p>羅馬時期公共表演同時是政治儀式，座位與群體身分有關。考古與20世紀復原利用原構件重組，今天能看见的完整舞台包含保存工作的選擇。</p><h3>相關故事</h3><p>比較昨天的Stadium：長條跑道與半圓劇場服務不同活動。這座劇場今日仍用於演出，現代設備不代表古蹟失去價值，而是需要平衡使用與保護。</p><h3>實用提醒</h3><p>沿指定階梯走；濕石階不跨越。09:30斜光能看柱列與階梯立體感，但朝南背景可能較亮。</p><a class="guide-return" href="#bg06-s1">回到行程</a></details><details class="guide-card" id="guide-bg06-s2"><summary>Hisar Kapia → Hindliyan House／Balabanov House｜導覽</summary><h3>現場看什麼</h3><p>Hisar Kapia看住宅如何靠城防牆建造。宅邸看上層外挑、對稱接待廳、木雕天花與壁畫；比較公開客廳和私密生活區的動線。</p><h3>歷史背景</h3><p>18–19世紀Plovdiv富商活躍在多語言、多宗教貿易網絡。Hindliyan裝飾中的遠方城市與精緻生活設備，反映主人與外界的聯繫；Balabanov現貌則是依歷史資料重建，兩者真實性層次不同。</p><h3>相關故事</h3><p>所謂民族復興風格不是與外界隔絕的產物：鄂圖曼室內生活、歐洲裝飾趣味與地方木工石工相互混合。房屋本身就是商人財富的展示。</p><h3>實用提醒</h3><p>博物館進入順序可依開門情況交換。禁止觸摸彩繪與木雕；宅邸樓梯狹窄，不背大型包摩擦牆面。</p><a class="guide-return" href="#bg06-s2">回到行程</a></details><details class="guide-card" id="guide-bg06-s4"><summary>Bishop’s Basilica of Philippopolis｜導覽</summary><h3>現場看什麼</h3><p>先用展示圖理解建築長軸、入口、會眾與祭壇，再看不同時期馬賽克。比較鳥類的姿態、邊框、幾何重複與修補處，避免只找最大或最鮮豔的鳥。</p><h3>歷史背景</h3><p>晚期羅馬帝國基督教化後，大型教堂承接城市公共空間的重要地位。不同地坪層揭示建築曾被重新鋪設和使用；宗教藝術沿用古典自然圖案，又加入新的信仰語境。</p><h3>相關故事</h3><p>鳥類可以與天堂、靈魂和永生相關，但不是每種鳥都有唯一固定密碼。先讀館內解說，再把圖像放回它所在的圖案和教堂位置。</p><h3>實用提醒</h3><p>採無閃光攝影並遵守標誌。這座Basilica不在本頁計為已登錄UNESCO世界遺產；候選名單不等於正式列名。</p><a class="guide-return" href="#bg06-s4">回到行程</a></details><details class="guide-card" id="guide-bg06-s5"><summary>Forum＋Odeon｜導覽</summary><h3>現場看什麼</h3><p>Forum是一片由道路、店鋪與公共建築圍成的中心；Odeon較小，和上午劇場的觀眾尺度不同。從殘牆、門道與座席重建人如何進出。</p><h3>歷史背景</h3><p>城市公共生活包括交易、市議會、宗教與表演，並非全部集中一座娛樂建築。Odeon用途曾變化，反映城市制度與空間重新使用。</p><h3>相關故事</h3><p>把今日商店和行人放入視野，可以對照古今公共中心的延續，但不能據此假定每條現代道路都與古道重合。</p><h3>實用提醒</h3><p>不要跨圍欄走到牆基；照現場開放動線。</p><a class="guide-return" href="#bg06-s5">回到行程</a></details><details class="guide-card" id="guide-bg06-s6"><summary>Nebet Tepe或Bunardzhika二選一｜導覽</summary><h3>現場看什麼</h3><p>Bunardzhika看城市散布山丘的地形，以及Alyosha士兵雕像在天際線中的支配位置。</p><h3>歷史背景</h3><p>蘇聯紀念物連結二戰和戰後社會主義政權。今日對它的保留、移除或重新解釋存在不同看法。</p><h3>相關故事</h3><p>同一座雕像可被理解為反法西斯記憶，也可被視為蘇聯控制的象徵；導覽不應把全部居民說成只有一種態度。</p><h3>實用提醒</h3><p>坡路較長，傍晚下坡預留光線；疲累便用咖啡和晚餐代替。</p><a class="guide-return" href="#bg06-s6">回到行程</a></details><details class="guide-card" id="guide-bg07-s2"><summary>Ancient Serdica Archaeological Complex｜導覽</summary><h3>現場看什麼</h3><p>觀察道路鋪面、排水、門檻和房間配置。不是所有可踩表面都是原羅馬街道，依展示動線辨認原件與保護性鋪設。</p><h3>歷史背景</h3><p>Serdica位於交通交會與礦泉區，晚期羅馬時代地位重要。現代建設與地鐵工程讓部分地下層得以展示，同時也要求城市交通繼續運作。</p><h3>相關故事</h3><p>「Serdica是我的羅馬」常被歸給君士坦丁，名句傳播和史料確證應區分。即使不依賴名言，道路與建築規模仍能說明城市的重要。</p><h3>實用提醒</h3><p>露天區和室內展区可能不同票制及時間；不把地鐵通道全天可走等同博物館全天開放。</p><a class="guide-return" href="#bg07-s2">回到行程</a></details><details class="guide-card" id="guide-bg07-s3"><summary>St George Rotunda＋Presidency｜導覽</summary><h3>現場看什麼</h3><p>看圓形紅磚主體、周邊古建築牆基，再觀察壁畫多層疊繪。圓頂與牆面不是同一年代一次完成。</p><h3>歷史背景</h3><p>4世紀建築在後來基督教及鄂圖曼時代多次改變用途。周圍20世紀大體量建築把它圍成內院，使古代宗教空間與現代權力直接相鄰。</p><h3>相關故事</h3><p>保存不一定表現為開闊廣場：這座小教堂藏在大樓後，尺度差異比單獨看建築照片更強烈。</p><h3>實用提醒</h3><p>服裝遮肩膝，壁畫攝影依規定；不要擋住信徒出入。</p><a class="guide-return" href="#bg07-s3">回到行程</a></details><details class="guide-card" id="guide-bg07-s4"><summary>Sveta Nedelya｜導覽</summary><h3>現場看什麼</h3><p>先看今天重建後的大圓頂與城市路口，再留意紀念1925事件的資訊。</p><h3>歷史背景</h3><p>1925年教堂葬禮期間的政治爆炸造成大量死傷，目標涉及國家政軍菁英。今日建築經重建，不能把整體外觀都當成爆炸前原貌。</p><h3>相關故事</h3><p>宗教建築也可能是政治暴力記憶場所；這使Sofia不只有「和平共存」一種故事。</p><h3>實用提醒</h3><p>參觀期間遇禮拜不穿過儀式人群。</p><a class="guide-return" href="#bg07-s4">回到行程</a></details><details class="guide-card" id="guide-bg07-s5"><summary>Banya Bashi → Central Mineral Baths → Central Market Hall｜導覽</summary><h3>現場看什麼</h3><p>比較清真寺圓頂、浴場彩色立面與現代市場用途；再看居民取礦泉水的地方，理解水源如何長期組織生活。</p><h3>歷史背景</h3><p>Banya意指浴場，Sofia礦泉在羅馬、鄂圖曼和近代城市都重要。中央浴場現作歷史博物館；附近不同宗教建築的共存是多個歷史時期留下的結果。</p><h3>相關故事</h3><p>「宗教寬容廣場」是今日城市詮釋，不能抹去過去不同群體遭遇的限制和衝突。市場翻修後的零售功能也不是舊時市場原樣重現。</p><h3>實用提醒</h3><p>別直接飲用過燙泉水，也不假定任何取水點都適合每個人飲用。清真寺拍照避開信徒。</p><a class="guide-return" href="#bg07-s5">回到行程</a></details><details class="guide-card" id="guide-bg07-s6"><summary>Vitosha Boulevard晚餐｜導覽</summary><h3>現場看什麼</h3><p>大道視線朝山，說明首都其實緊靠高地。露台、商店與行人尺度和政府區巨型廣場形成差異。</p><h3>歷史背景</h3><p>Sofia成為近代首都後經王國、社會主義與當代建設改變，街區風格不統一正是多次重建的結果。</p><h3>相關故事</h3><p>保加利亞語使用西里爾字母；找店時同時保留拉丁轉寫與原名，避免把相近英文翻譯認成同一家。</p><h3>實用提醒</h3><p>Zdraveyte為你好，Blagodarya為謝謝，Molya可表示請或不客氣；付款可直接詢問card／cash。</p><a class="guide-return" href="#bg07-s6">回到行程</a></details><details class="guide-card" id="guide-bg08-s1"><summary>Alexander Nevsky Cathedral｜導覽</summary><h3>現場看什麼</h3><p>看金色大圓頂與層疊半圓頂，再進低光主殿比較吊燈、聖像屏、石材和煙燻表面。東正教空間強調圖像與儀式，不是只以窗光塑造室內。</p><h3>歷史背景</h3><p>主教座堂興建於20世紀初，以1877–78戰爭犧牲者和解放記憶為核心。1878自治公國與1908完全獨立要分開；「解放者」敘事也包含保加利亞與俄羅斯後來複雜的政治關係。</p><h3>相關故事</h3><p>第一次世界大戰期間兩國關係改變，教堂曾改名，顯示宗教紀念物名稱也會回應政治。</p><h3>實用提醒</h3><p>主殿與地下聖像館分開管理；攝影規則和費用不要混為一談。儀式時先讓信徒。</p><a class="guide-return" href="#bg08-s1">回到行程</a></details><details class="guide-card" id="guide-bg08-s2"><summary>St Sofia Church｜導覽</summary><h3>現場看什麼</h3><p>上層看樸素磚造量體，下層看墓葬、舊教堂遺構及馬賽克。年代與功能不同，不能把地下每一室都稱為同一座教堂。</p><h3>歷史背景</h3><p>Sofia的名稱與Holy Wisdom神聖智慧有關，不是以某位女性Sofia命名。此區的墓園和宗教建築使你能看見近代首都以前的城市邊界與信仰生活。</p><h3>相關故事</h3><p>旁邊Nevsky是近代紀念性建築；St Sofia是城市名稱與早期基督教歷史的線索，兩者並看比只拍金頂完整。</p><h3>實用提醒</h3><p>地下台階與光線較暗；入口時段和票價現場核對，約40分鐘不勉強看完所有墓室。</p><a class="guide-return" href="#bg08-s2">回到行程</a></details><details class="guide-card" id="guide-bg08-s3"><summary>Alexander Nevsky Crypt｜Christian Art Museum｜導覽</summary><h3>現場看什麼</h3><p>挑三件不同年代聖像，比較人物目光、手勢、服飾和金色背景。聖像屏中的位置決定觀看方式，博物館單件展示會改變原本禮儀脈絡。</p><h3>歷史背景</h3><p>保加利亞聖像傳統連結拜占庭、地方畫派與民族復興時期的工坊。風格變化不是單線從「原始」走向「寫實」，而是信仰規範與藝術選擇的調整。</p><h3>相關故事</h3><p>與Rila實際教堂對照：這裡能近看筆法和年代，修道院則能體驗圖像仍在信仰空間裡運作。</p><h3>實用提醒</h3><p>官方8/10起價格公告：週四各分館€2。先確認售票人員對當日票種的說明，不假定一次可通行全部分館。</p><a class="guide-return" href="#bg08-s3">回到行程</a></details><details class="guide-card" id="guide-bg08-s4"><summary>Russian Church＋黃色石磚街區｜導覽</summary><h3>現場看什麼</h3><p>比較洋蔥形金頂與Nevsky層疊圓頂。此處的俄羅斯復興風格明顯不同，不能把所有東正教教堂說成相同。</p><h3>歷史背景</h3><p>20世紀初使館與僑民宗教生活形成這座教堂；地下Saint Seraphim崇敬延伸到居民個人祈禱。</p><h3>相關故事</h3><p>祈禱紙條是信仰實踐，不是保證願望實現的觀光儀式。觀察時尊重正在祈求健康和家事的人。</p><h3>實用提醒</h3><p>不拍他人的祈禱內容與近距離表情；地下人多便讓位。</p><a class="guide-return" href="#bg08-s4">回到行程</a></details><details class="guide-card" id="guide-bg08-s5"><summary>National Archaeological Museum 或 Kvadrat 500｜導覽</summary><h3>現場看什麼</h3><p>考古館按史前／色雷斯、希臘羅馬、基督教化、中世紀四層閱讀。挑金屬工藝、石雕碑刻與日常用品各一組，對照技術、權力和生活，不只追金器。</p><p>Kvadrat 500則看聖像與近現代繪畫如何改變主題；Goya版畫可留意黑白明暗、諷刺與幻象，不把21件展品當作完整《Caprichos》套組。</p><h3>歷史背景</h3><p>考古館本身是鄂圖曼大型清真寺建築。近代國家把前帝國宗教空間轉作考古館，是展示與重新組織歷史的行動；拱頂和牆體也是展品的一部分。</p><h3>相關故事</h3><p>兩種選擇都合理：考古館建立旅程歷史架構，Goya展則是日期吻合的藝術機會。不同館的優惠不能互相套用。</p><h3>實用提醒</h3><p>考古館票價依官方現場；Goya展日期已核對，不保證所有藏品永遠在展。16:00後回住宿短休息。</p><a class="guide-return" href="#bg08-s5">回到行程</a></details><details class="guide-card" id="guide-bg08-s6"><summary>Sofia Opera and Ballet｜Romeo and Juliet｜導覽</summary><h3>現場看什麼</h3><p>看群舞的家族衝突與雙人舞的私人情感如何對照；銅管與節奏強烈的段落表現權威，抒情旋律則讓人物心理在沒有台詞下成立。</p><h3>歷史背景</h3><p>故事源於莎士比亞悲劇，Prokofiev音樂把家族仇恨、青春與死亡轉成20世紀舞台語言。演出也呈現Sofia長期累積的音樂與舞蹈機構文化。</p><h3>相關故事</h3><p>先掌握Montague與Capulet兩家、相遇、決鬥、誤傳死訊即可，不必逐場背劇情。中場看劇院空間，避免上演時用手機照亮旁人。</p><h3>實用提醒</h3><p>依票面座位與入場規則；約22:10結束後直接回住宿，隔天要取車。沒票或不想看則改晚餐和休息，不列成已完成活動。</p><a class="guide-return" href="#bg08-s6">回到行程</a></details><details class="guide-card" id="guide-bg09-s1"><summary>Top Rent Sofia Airport取車｜導覽</summary><h3>現場看什麼</h3><p>驗車拍四面、輪圈、玻璃、車顶、保桿底緣、油量和里程；舊傷記入合約。核對燃料種類、補油規則、e-vignette是否涵蓋全部租期、救援電話、押金和CDW／竊盜自負額。</p><h3>歷史背景</h3><p>秋季山區路況可能和Sofia完全不同。車輛能上公路不等於適合積雪結冰；保險是否涵蓋特定道路、輪胎與底盤損傷，需要按合約理解。</p><h3>相關故事</h3><p>確認輪胎種類與胎紋，若預報有雪冰詢問冬季適用胎、雪鏈可用尺寸及安裝限制。雪鏈不是讓不合適輪胎或封閉道路變安全的通行證。</p><h3>實用提醒</h3><p>同時處理10/13提前還車：要求07:45–08:00與確切入口、接車方式及€32是否適用的書面確認。未確認前不要期待07:50一定有人。</p><a class="guide-return" href="#bg09-s1">回到行程</a></details><details class="guide-card" id="guide-bg09-s2"><summary>Sofia → Dupnitsa採買｜導覽</summary><h3>現場看什麼</h3><p>買兩天早餐、健行午餐、水、起司、麵包、水果、堅果、巧克力、垃圾袋與紙巾。冷藏品最後買，用保冷袋。</p><h3>歷史背景</h3><p>Dupnitsa是周邊山村的行政、醫療與補給中心；把主要採買放在這裡能降低山區小店選擇不足的問題。</p><h3>相關故事</h3><p>秋季水果可看蘋果、梨、葡萄與李子實際產地和成熟度；地方果醬、蜂蜜與lyutenitsa適合補給，但不是所有市售罐都本地手工。</p><h3>實用提醒</h3><p>明日每人至少1.5公升水，依氣候、體力增加；不要把湖水直接當飲水。超市定位不是保證某分店有停車空位。</p><a class="guide-return" href="#bg09-s2">回到行程</a></details><details class="guide-card" id="guide-bg09-s3"><summary>Sapareva Banya入住、Geyser與St Nicholas｜導覽</summary><h3>現場看什麼</h3><p>看小鎮如何圍繞熱水、浴場和療養形成生活；St Nicholas可比較中世紀磚石結構與Sofia近代大教堂尺度。</p><h3>歷史背景</h3><p>古羅馬Germania與此地相關。Banya表示浴場，礦泉並非當代SPA才出現；市中心高溫泉與可泡的調溫池是不同設施。</p><h3>相關故事</h3><p>山區溫泉也是居民理療、家庭休閒與健行後休息的地方，不必都以豪華度假村理解。</p><h3>實用提醒</h3><p>原泉可極高溫，不能觸碰、涉入或任意飲用。SPA價格、毛巾、泳帽與置物櫃要求現場確認；泡湯後補水。</p><a class="guide-return" href="#bg09-s3">回到行程</a></details><details class="guide-card" id="guide-bg10-s3"><summary>Rila Lakes Hut → Twin／Kidney｜標準目標｜導覽</summary><h3>現場看什麼</h3><p>由山屋看湖盆、圓弧山壁與岩屑坡，再沿標示步道辨認湖水由高向低相連。這是冰河侵蝕後留下的階梯湖盆，並不是人工挖出的七個水池。</p><h3>歷史背景</h3><p>七湖約在2100–2500公尺範圍。低至高常稱Lower、Fish、Trefoil、Twin、Kidney、Eye、Tear；Twin面積大，Eye以深度著名，名稱描述形狀和特性，不代表都必須逐一踏到湖岸。</p><h3>相關故事</h3><p>20世紀Peter Deunov相關White Brotherhood把此處視為精神場所，夏季paneurhythmy圓形群舞並非東正教禮拜。10月不預期大型白衣儀式。</p><h3>實用提醒</h3><p>只走核准路線，不踩湖岸濕地、不下水、不以洗手或洗餐具污染湖水。10月可能新雪和透明冰，實際步道報告比「通常幾月結冰」更有用。</p><a class="guide-return" href="#bg10-s3">回到行程</a></details><details class="guide-card" id="guide-bg10-s4"><summary>Eye／Tear高處｜條件式，不是標準行程｜導覽</summary><h3>現場看什麼</h3><p>較高處可同時看多個湖盆，湖群像階梯排列；朝北俯拍常有较好的順側光，但山壁陰影可能使下層湖比天空暗很多。</p><h3>歷史背景</h3><p>海拔提高後樹木消失，生長季、低溫與風共同限制植被。沒有森林遮蔽的坡面也讓人體暴露在風寒下。</p><h3>相關故事</h3><p>景觀展開不代表難度只增加一點：Kidney以上坡度、暴露和冰雪影響可能明顯不同。兩座湖之間的短距離不能代替路况評估。</p><h3>實用提醒</h3><p>遇冰、積雪遮路或風吹到難穩站就折返。普通登山杖、防水鞋不等於具備冬季登山能力；不以加雪鏈或臨時買簡易裝備取代經驗。</p><a class="guide-return" href="#bg10-s4">回到行程</a></details><details class="guide-card" id="guide-bg10-s5"><summary>下行 → Sapareva溫泉與晚餐｜導覽</summary><h3>現場看什麼</h3><p>裝備：防滑防水健行鞋、防風防水層、保暖中層、手套毛帽、登山杖、離線地圖、頭燈、行動電源、午餐水與急救用品。</p><h3>歷史背景</h3><p>山區條件看路面、風、能見度和交通一起判斷。無纜車時從山腳加走可能變成完全不同強度，本行程不採用。</p><h3>相關故事</h3><p>若只走到Twin或Kidney仍能看到冰斗地形；景點數不是判斷旅程成敗的尺度。</p><h3>實用提醒</h3><p>PSS山救與園區當日公告優先；緊急狀況112。事前確認保險涵蓋活動海拔與山區救援，不靠手機訊號保證安全。</p><a class="guide-return" href="#bg10-s5">回到行程</a></details><details class="guide-card" id="guide-bg11-s2"><summary>Rila Monastery｜UNESCO文化遺產｜導覽</summary><h3>現場看什麼</h3><p>先比較堡壘式外牆和開放內院；再看Hrelyo塔、主教堂外廊、聖像屏與博物館。外廊最後審判與善惡圖像按區域閱讀，人物和文字共同組成道德教材。</p><h3>歷史背景</h3><p>修道傳統追溯至10世紀Saint Ivan of Rila。現存中世紀Hrelyo塔建於1334–35年；院落大部分建築與1833火災後的19世紀重建相關，不能把全部都稱為千年原建築。1983年列入UNESCO世界遺產。</p><h3>相關故事</h3><p>鄂圖曼統治期間，此處持續作宗教、藝術、文學與朝聖中心；19世紀又成為民族復興和歷史延續的重要象徵。這並不等於保加利亞文化只靠一座修道院保存。</p><p>Rafail木雕十字架以極小人物與場景呈現精密工藝和長期修行。不要只追逐「雕到失明」的傳奇，先看材料、尺度與敘事安排；故事性細節依館方說明。</p><h3>實用提醒</h3><p>遮肩膝；教堂內攝影和博物館票制分開核對。塔樓不保證10月可登。停車、洗手間與用餐共留30–45分鐘；Mekitsa炸麵餅配優格或起司可當簡餐。</p><a class="guide-return" href="#bg11-s2">回到行程</a></details><details class="guide-card" id="guide-bg11-s4"><summary>Rila → Bansko；Stob只作可刪支線｜導覽</summary><h3>現場看什麼</h3><p>土柱與尖塔來自較鬆散沉積物的差異侵蝕，和Rila冰斗、Pirin大理岩山脊不同。看山坡排水溝如何逐步切割出形狀。</p><h3>歷史背景</h3><p>這種地貌持續變化，不能把照片中每座尖塔當作永久不變的紀念物。</p><h3>相關故事</h3><p>旅行中可比較冰河侵蝕、水流侵蝕和風化，但不要把所有尖峰都叫冰河地形。</p><h3>實用提醒</h3><p>雨後泥滑或行程落後便跳過。今天上山支線不優先於安全抵達。</p><a class="guide-return" href="#bg11-s4">回到行程</a></details><details class="guide-card" id="guide-bg11-s5"><summary>Bansko Old Town、Holy Trinity與Mehana｜導覽</summary><h3>現場看什麼</h3><p>教堂看聖像屏、庭院與後來的鐘樓如何成為地標。老屋看厚石牆、窄街門、上層接待室；Velyanova內部彩繪與防禦性外觀形成反差。</p><h3>歷史背景</h3><p>Holy Trinity完成於1835年，集資和取得建堂許可展現商人社群組織能力。Bansko在滑雪產業以前已有跨區域貿易、學校和文化活動。</p><h3>相關故事</h3><p>Paisius的1762《斯拉夫保加利亞史》連結語言與歷史認同；Neofit Rilski代表教育改革。Vaptsarov是20世紀詩人，不能把不同年代人物全歸同一場民族復興。</p><p>Kapama把肉、酸菜和米長時間燉煮；Chomlek是肉、馬鈴薯與洋蔥等慢燉；Bob chorba豆湯反映家庭與冬季保存飲食。</p><h3>實用提醒</h3><p>Mehana只是傳統餐馆类型，不保證所有店都手工現做。Kapama有些需預訂；詢問份量及製作時間，駕駛者不喝酒。</p><a class="guide-return" href="#bg11-s5">回到行程</a></details><details class="guide-card" id="guide-bg12-s1"><summary>Bansko → Baikushev’s Pine｜導覽</summary><h3>現場看什麼</h3><p>看古樹樹冠、幹部紋理和周圍森林，不跨護欄接近根系。古樹生長不是每年等速，樹齡約千餘年屬估算。</p><h3>歷史背景</h3><p>Bosnian pine能在薄土、寒冷和強風環境中長期存活。Pirin生態的價值來自整個棲地與演化，不只是單棵「最老的樹」。</p><h3>相關故事</h3><p>比較城市紀念碑與古樹：前者由人決定形式，後者的形態是氣候、土壤與生長累積的結果。</p><h3>實用提醒</h3><p>接近Banderitsa山屋一帶，停車到樹仍需短走台階；路滑就止步。不摸樹皮、不踩表土根系。</p><a class="guide-return" href="#bg12-s1">回到行程</a></details><details class="guide-card" id="guide-bg12-s2"><summary>Vihren Hut周邊｜Pirin UNESCO自然遺產｜導覽</summary><h3>現場看什麼</h3><p>從森林邊緣看岩峰、碎石坡與谷地。Pirin不同區域有花崗岩與大理岩；Vihren白色岩體和森林暗色對照，不是整座山脈都只有一種石頭。</p><h3>歷史背景</h3><p>Pirin National Park1983年列入UNESCO，重點含冰河地形、高山湖、森林與生態；世界遺產正式範圍和滑雪開發區不能混為一談。</p><h3>相關故事</h3><p>山屋是登山者住宿、補給與交換路況的節點，但淡季不能假設每間都隨時有人。Vihren2914m峰頂與「到山屋看看」是不同等級行程。</p><h3>實用提醒</h3><p>霧、雨雪、結冰或強風出現立即縮短；不把賽事選手可登頂推論為一般旅客也適合。11:00開始下山，13:00左右離Bansko。</p><a class="guide-return" href="#bg12-s2">回到行程</a></details><details class="guide-card" id="guide-bg12-s4"><summary>N9 Studentski Loft入住、加油與採買｜導覽</summary><h3>現場看什麼</h3><p>Studentski Grad以大學、宿舍、新公寓、小超市和餐飲為主。這裡較能看當代年輕人口的生活，而非首都紀念性建築。</p><h3>歷史背景</h3><p>城市外圍新住宅與舊宿舍並置，反映教育、人口流動與房地產變化。最後一晚住此區以交通和生活機能為主要價值。</p><h3>相關故事</h3><p>國家文化不只在古蹟：便利商店、外送、健身房與學生咖啡館同樣呈現今天的保加利亞。</p><h3>實用提醒</h3><p>今晚不再進歷史中心。整理行李、買早餐、確認還車油量政策；住宅區車位不能因有空就認為免費。</p><a class="guide-return" href="#bg12-s4">回到行程</a></details><details class="guide-card" id="guide-bg13-s2"><summary>Top Rent提前還車｜需書面確認｜導覽</summary><h3>現場看什麼</h3><p>再次拍車身四面、輪圈玻璃、油表里程與停車位置；取回私人物品，依指示交钥匙。要求收車紀錄與新損傷狀態，保存押金解除說明。</p><h3>歷史背景</h3><p>機場租車「在機場」可能指航廈櫃檯，也可能是外站接駁；地點與服務時間會直接影響能否按時進航廈。</p><h3>相關故事</h3><p>提前抵達是時間管理，但不會自行改變合約或營業時間。先安排服務，比到了現場才問更可靠。</p><h3>實用提醒</h3><p>公司官網非標準時段變更費€32；個別訂單報價與書面安排優先。無人還車須有明確授權和流程，不能任意把車鑰匙留車內。</p><a class="guide-return" href="#bg13-s2">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://soundandlight.bg/en" target="_blank" rel="noopener">Sound &amp; Light官方場次</a> · 2026-09-27；動態頁出發前再查</li><li><a href="https://www.operasofia.bg/repertoire/1056" target="_blank" rel="noopener">Sofia Opera 10/8芭蕾</a> · 2026-09-27；動態頁出發前再查</li><li><a href="https://toprentacar.bg/en/office-sofia-airport" target="_blank" rel="noopener">Top Rent機場時段與非標準時間費</a> · 2026-09-27；動態頁出發前再查</li><li><a href="https://toprentacar.bg/en/office-sofia-sofiyska-sveta-gora" target="_blank" rel="noopener">Top Rent獨立Head office</a> · 2026-09-27；動態頁出發前再查</li><li><a href="https://ppbachvarovi.com/produkt/gorna-oriahovitsa-plovdiv-ponedelnik-sybota/" target="_blank" rel="noopener">Bachvarovi 週一至六巴士</a> · 2026-09-27；動態頁出發前再查</li><li><a href="https://razpisanie.bdz.bg/en" target="_blank" rel="noopener">BDZ日期時刻</a> · 2026-09-27；動態頁出發前再查</li><li><a href="https://www.bdz.bg/bg/c/live-updates" target="_blank" rel="noopener">BDZ即時異動</a> · 2026-09-27；動態頁出發前再查</li><li><a href="https://www.museumvt.com/en/sites" target="_ .en.html" target="_blank" rel="noopener">ECB保加利亞採歐元</a> · 2026-09-27；動態頁出發前再查</li></ul></section></main></template>
<template id="content-romania-2026"><nav><a href="#ro23">09-23 抵達Bucharest｜老城與王國立面</a><a href="#ro24">09-24 Bucharest｜人民宮、革命與Athenaeum音樂會</a><a href="#ro25">09-25 取車 → Curtea de Argeș → Vidraru湖畔</a><a href="#ro26">09-26 Transfăgărășan｜高山道路與冰斗湖</a><a href="#ro27">09-27 Sibiu＋ASTRA｜城市自治與農村技術</a><a href="#ro28">09-28 Biertan → Sighișoara｜教堂堡壘與行會城牆</a><a href="#ro29">09-29 Clock Tower → Viscri → Rupea → Brașov</a><a href="#ro30">09-30 Libearty＋Seven Ladders｜保育與峽谷</a><a href="#ro01">10-01 Cantacuzino → Peleș → Sinaia｜貴族與王室</a><a href="#ro02">10-02 Sinaia → Bucharest｜還車與Spring Palace</a><a href="#ro03">10-03 Bucharest → Veliko Tarnovo</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="ro-intro"><h2>Romania｜喀爾巴阡山、薩克森城鎮與皇家山城</h2><p>2026/9/23–10/3，共11天。依第四部分修正行程，住宿完全固定。9/25住Vidraru湖畔Hotel Valea cu Pești；9/28時鐘塔只看外觀，9/29登塔後經Viscri、Rupea到Brașov；10/1 Pelișor僅外觀。</p><p>全部時間為羅馬尼亞當地夏令時間EEST（UTC+3），比阿爾巴尼亞快一小時。TIA 11:35 → OTP 14:00為各機場當地時間。航班、住宿與巴士依提供的訂單整理；尚未提供景點票券，不將建議時段當成已訂。</p><p>每站可點「導覽」閱讀現場觀察、歷史與故事，再返回當天行程。座標表可直接開Google Maps；山路與峽谷保留明確的替代動線。查核日期：2026/9/22。</p><div class="tablewrap"><table><thead><tr><th>入住日期</th><th>住宿／城市</th><th>交通重點</th></tr></thead><tbody><tr><td>9/23–25</td><td>Central Comfort Suites - Geo12｜Bucharest</td><td>9/23 Ryanair TIA 11:35 → OTP 14:00</td></tr><tr><td>9/25–26</td><td>Hotel Valea cu Pest（Pești）｜Vidraru湖畔</td><td>SIXT 9/25 09:30取車；門市依合約</td></tr><tr><td>9/26–28</td><td>Zenith Apartament Old Town Piata Mare｜Sibiu</td><td>老城停車入口先問房東</td></tr><tr><td>9/28–29</td><td>Gloria Apartments｜Sighișoara</td><td>停車後步行</td></tr><tr><td>9/29–10/1</td><td>Cosmo Studio｜Brașov</td><td>停車條件依訂單，不預設免費車位</td></tr><tr><td>10/1–2</td><td>Upon Boutique｜Sinaia</td><td>隔日還車時間決定出發時間</td></tr><tr><td>10/2–3</td><td>New Boutique Central 2 camere Chic｜Bucharest</td><td>10/2完成還車</td></tr><tr><td>10/3</td><td>FlixBus 10:10 → Veliko Tarnovo</td><td>09:20到電子票指定站點；不猜車站</td></tr></tbody></table></div></section><section id="ro-unesco"><h2>UNESCO世界遺產｜11項與本次路線對照</h2><p>2026/9/24核對UNESCO正式名錄：羅馬尼亞11項（9文化、2自然）。原主線涵蓋2項：防禦教堂村落群與Sighișoara歷史中心；新增Saschiz仍屬同一村落群。只有實際走Olt備案並到訪Arutela，才再涵蓋第3項「羅馬帝國疆界—達契亞」。此處記錄計畫，不表示你已實際到訪。</p><p>標記說明：「UNESCO｜主線」為已排景點；「UNESCO｜新增短停」為順路加入；「UNESCO｜替代／條件式」只在指定方案採用。固定住宿、高山主線、熊保育導覽及Peleș安排保留。</p><p>UNESCO保護有明確邊界與構成點；在附近行車、遠望山林或參觀同類博物館，不自動算到訪。正式世界遺產、預備名單與非物質文化遺產分開標記。</p><div class="tablewrap"><table><thead><tr><th>項次</th><th>正式項目</th><th>列名</th><th>本次判斷</th><th>日期與安排理由</th></tr></thead><tbody><tr><td>1</td><td>Danube Delta｜多瑙河三角洲</td><td>1991｜自然</td><td>不順路</td><td>位於黑海方向；需要獨立濕地／船遊行程，本次不加。</td></tr><tr><td>2</td><td>Churches of Moldavia｜摩爾達維亞教堂</td><td>1993／2010｜文化</td><td>不順路</td><td>Bucovina在北部；不以Sinaia或Curtea的東正教教堂代替計數。</td></tr><tr><td>3</td><td>Hurezi Monastery｜霍雷祖修道院</td><td>1993｜文化</td><td>可繞但本次不建議</td><td>9/26若改DN7，仍須從Râmnicu Vâlcea向西繞行再返回；連參觀應另留約2.5–3小時規劃緩衝，非即時導航估算。優先安全抵Sibiu。</td></tr><tr><td>4</td><td>Villages with Fortified Churches in Transylvania｜防禦教堂村落</td><td>1993／1999｜文化</td><td>已排＋順道新增</td><td>9/28 Biertan；9/29新增Saschiz外觀、原有Viscri；9/30 Prejmer為替代版。它們是同一項的不同構成村落，不是四項世界遺產。</td></tr><tr><td>5</td><td>Dacian Fortresses of the Orăștie Mountains｜達契亞堡壘</td><td>1999｜文化</td><td>本次不加</td><td>六處包含Căpâlna、Sarmizegetusa Regia等；從Sibiu另走西側且涉及山路／步行，會占用ASTRA日。不是Rupea或羅馬軍營。</td></tr><tr><td>6</td><td>Historic Centre of Sighișoara｜歷史中心</td><td>1999｜文化</td><td>已排</td><td>9/28–29城堡區、街巷與塔樓共同理解；Clock Tower是遺產區內地標，不另計一項。</td></tr><tr><td>7</td><td>Wooden Churches of Maramureș｜木造教堂</td><td>1999｜文化</td><td>不順路</td><td>在北部，不能把ASTRA內任何木教堂都算成八座列名教堂之一。</td></tr><tr><td>8</td><td>Ancient and Primeval Beech Forests｜原始山毛櫸林</td><td>跨國自然遺產；羅馬尼亞2017加入</td><td>地理接近，未排進核心區</td><td>Șinca及Cozia有列名林區，但開過DN7、走Seven Ladders或看見山毛櫸，不等於進入列名地塊。需依保護區規則安排另一次健行，本次不為計數加走。</td></tr><tr><td>9</td><td>Roșia Montană Mining Landscape｜金礦景觀</td><td>2021｜文化</td><td>不順路</td><td>在Apuseni山區，需要另外安排交通及礦坑參觀；本次不加。</td></tr><tr><td>10</td><td>Brâncuși Monumental Ensemble of Târgu Jiu｜雕塑紀念群</td><td>2024｜文化</td><td>不順路</td><td>Târgu Jiu在現有動線以西；不能將Bucharest展覽中的照片或作品複製品視為到訪遺產。</td></tr><tr><td>11</td><td>Frontiers of the Roman Empire – Dacia｜羅馬帝國疆界</td><td>2024｜文化</td><td>條件式可新增</td><td>9/26只在採Olt河谷備案時短停Arutela（1718-237）；9/30 Cumidava雖近Libearty，因未確認訪客入口與路況，只列候選、不排固定。</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/statesparties/ro">UNESCO羅馬尼亞正式名錄</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/596/maps/">七個防禦教堂村落與邊界</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/1718/maps/">達契亞羅馬疆界277個構成點</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/1133/maps/">山毛櫸林列名地塊</a></section><section id="ro-unesco-practical"><h2>怎麼加才順｜時間、地圖與取捨</h2><p>9/29 Saschiz位於Sighișoara往Viscri方向的DN13沿線。新增10:35–10:55外觀短停；Viscri改11:40–12:40、午餐至13:15，再往Rupea，保留Brașov傍晚。這是規劃緩衝，遇塞車先刪Saschiz，不靠加速補時間。</p><p>Saschiz官方旅遊頁列週二、三室內關閉。9/29只在公共街道拍教堂與鐘塔；不等管理員、不新增登山丘避難堡。若臨時開放且想深入，改以它取代Rupea，不能三者都延長。</p><p>9/30若優先世界遺產文化，或峽谷不適合：Libearty 11:00結束 → 交通與午餐 → 13:00–14:15 Prejmer → 15:00後Șchei。這個版本取代Seven Ladders＋Zipline，不是追加在健行後。出發前確認當日教堂開放，聯絡+40 268 362 042。</p><p>9/26 Arutela僅用於Olt河谷備案：Hotel → Curtea de Argeș → Pitești → Râmnicu Vâlcea → Căciulata／Arutela → DN7 → Sibiu。參觀20–30分鐘，另留地方道路進出約20–30分鐘；遺址在河的東側，不可在DN7硬停或自行跨越道路。若天候或工地封閉就略過。</p><p>Saschiz可在上午從東南側公共位置向西北拍，較利顺／側光；Prejmer內院常有深陰影，陰天反而容易拍房間與木廊。Arutela以入口、牆基與河谷關係為重點，不為固定光線時刻趕路。</p><div class="tablewrap"><table><thead><tr><th>景點</th><th>定位／Google Maps</th><th>定位性質</th><th>停留</th></tr></thead><tbody><tr><td>Saschiz</td><td>46.194722,24.956111</td><td>UNESCO村落代表座標，非停車入口</td><td>20分鐘外觀</td></tr><tr><td>Prejmer</td><td>45.722500,25.775556</td><td>UNESCO列名村落代表位置，依現場找教堂入口</td><td>60–75分鐘</td></tr><tr><td>Arutela</td><td>45.276411,24.312425</td><td>UNESCO 1718-237遺址代表位置，非指定車位</td><td>20–30分鐘＋進出緩衝</td></tr><tr><td>Cumidava（候選）</td><td>Google Maps搜尋Castrul Roman Cumidava</td><td>正式構成點1718-246；不是山上的Râșnov中世紀城堡</td><td>未核實訪客進入條件，不排固定</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.194722%2C24.956111">Saschiz村中心</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.722500%2C25.775556">Prejmer教堂村落</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.276411%2C24.312425">Arutela軍營</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Castrul%20Roman%20Cumidava%20Rasnov">Cumidava｜僅供核對位置</a></section><section id="ro-unesco-boundaries"><h2>別把相似景點算成UNESCO｜現場辨識</h2><p>Biertan、Viscri、Saschiz與Prejmer屬同一項七村系列；另外三村是Câlnic、Dârjiu、Valea Viilor。本次不再為集點繞行。七村不能全部簡化成德語薩克森社群，Dârjiu也呈現塞凱伊人的文化背景。</p><p>Sibiu老城、ASTRA、Brașov Black Church、Rupea、Transfăgărășan、Bâlea Lake及Bucharest人民宮，不是這11項正式世界遺產。名氣或美感並不取決於列名；Peleș等Sinaia皇家建築出現在預備名單，不等於正式列入。</p><p>Hurezi與Curtea de Argeș是不同修道院；Stavropoleos可以幫助理解Brâncovenesc語彙，但不能代替到訪Hurezi。Cozia修道院也不是Hurezi，更不是原始山毛櫸林地塊。</p><p>Dacian Fortresses是羅馬征服前的達契亞王國防禦遺產；Arutela、Cumidava是羅馬征服後的帝國軍事網絡。Sarmizegetusa Regia與羅馬城市Ulpia Traiana Sarmizegetusa也不能混為一處。</p><p>掛毯織作、Horezu陶藝、傳統刺繡與放牧遷徙屬非物質文化遺產：保護技藝、知識與傳承。ASTRA能幫助理解相關生活方式，但館內一件掛毯或一棟移建木教堂，不因此成為正式世界遺產構成點。</p><a class="map" target="_blank" rel="noopener" href="https://ich.unesco.org/en/state/romania-RO">UNESCO非物質文化遺產｜Romania</a></section><section id="ro-actions"><h2>票務、住宿與當日決策</h2><p>待預約：9/24人民宮10:00英文導覽；9/24 Athenaeum 19:00 David Kadouch；9/30 Libearty 09:45；10/1 Peleș 12:45入場時窗；10/2 Spring Palace英文導覽。此頁未代購、未聯絡業者。</p><p>Peleș 12:45–14:30是可入場時窗，不等於保證12:45英文導覽席位。官網列12:45英文場、入口依序組團，請提早到入口；門票不可退改。Pelișor 9/28–11/3維護關閉，不能安排室內參觀。</p><p>Viscri官方公告：教堂本體及主塔關閉；可看村落博物館、陶器展、South Bastion上層與Bacon Tower。第四部分寫的Gate Tower改依官方名稱Bacon Tower。成人20 RON；車停村外官方免費停車區。</p><p>SIXT目前只確定取車09:30，還車時間與門市尚缺合約確認。10/2先採09:30還車、06:10離開Sinaia；只有收到延至12:00的書面確認才採晚出發版。延長可能產生額外一天費用，不能假設只收幾小時。</p><p>9/26 06:30重新確認DN7C開放、結冰／積雪、能見度、風勢及租車適用條件。9/22降雪後交通未受影響僅代表當時狀況，不是9/26通車保證。9/30 11:10依官方開放、水勢及雷雨決定是否進Seven Ladders。</p><p>住宿位置與停車以各自訂單及房東入口說明為準；沒有提供的地址、車位與設備不補猜。地圖搜尋同名住宿不能代替訂單定位。</p><a class="map" target="_blank" rel="noopener" href="https://peles.ro/en/program-si-taxe/">Peleș官方時段／門票</a><a class="map" target="_blank" rel="noopener" href="https://millionsoffriends.org/en/amp-libearty/visit-the-sanctuary/">Libearty官方導覽</a><a class="map" target="_blank" rel="noopener" href="https://www.biserica-fortificata-viscri.ro/en/">Viscri修復公告</a><a class="map" target="_blank" rel="noopener" href="https://www.iabilet.ro/bilete-david-kadouch-recital-de-pian-bucharest-international-piano-festival-128514/">David Kadouch售票頁</a><a class="map" target="_blank" rel="noopener" href="https://www.politiaromana.ro/ro/info-trafic">道路查詢｜羅馬尼亞警方Infotrafic</a><a class="map" target="_blank" rel="noopener" href="https://www.meteoromania.ro/">氣象局</a></section><section id="ro-context"><h2>隨身導遊｜先讀懂兩個歷史世界</h2><p>Wallachia（瓦拉幾亞）包含Bucharest、Curtea de Argeș和山脈南坡，歷史主軸是東正教王公、鄂圖曼宗主權、現代王國與共產政權。Transylvania（外西凡尼亞）長期處於匈牙利王國及哈布斯堡政治體系，留下德語薩克森城鎮、匈牙利文化、羅馬尼亞社群與多種基督教傳統。翻越山脈也跨越文化地理邊界。</p><p>羅馬尼亞語屬羅曼語族，宗教傳統以東正教為主；語言、信仰與現代國界不是同一張地圖。薩克森人是歷史社群名稱，移民來自不同德語地區，不全來自今日Saxony。不要用「德國城市」抹去同城其他社群。</p><p>本次導覽將史實、地方傳統與小說分開：Manole妻子入牆、Bridge of Lies測謊、Biertan幾百年只有一對離婚都是傳說或未獲可靠統計支持的故事；Dracula小說也不能當Vlad生平。</p><p>教堂遮肩過膝、男性脫帽，不阻擋禮拜；內部拍攝依現場規定。鄉村院門與晾衣空間是私人生活。山路不跟車超速，下坡用適當檔位控制速度；看到熊保持車窗關閉，不餵食、不下車、不停在牠旁邊拍照。</p></section><section id="ro-photo"><h2>必拍點｜方位、順光時段與Google Maps</h2><p>以下座標沿用提供的GPS，屬地標參考點，未逐一實地勘查，不等於停車入口或精確腳架機位。順光／側光是依地理方向推估；天氣、山影、樹蔭與開放範圍會改變結果。藍調在日落後，不能把日落前半小時稱作藍調。</p><div class="tablewrap"><table><thead><tr><th>地點</th><th>緯度,經度</th><th>本次時段（EEST）</th><th>取景與光線</th></tr></thead><tbody><tr><td>Stavropoleos</td><td>44.431742,26.098789</td><td>9/23 17:30後</td><td>庭院多遮蔭，以均勻散射光拍石雕；不保證晚間開門。</td></tr><tr><td>CEC Palace</td><td>44.4320,26.0965</td><td>9/23 18:20–19:10；日落後20分鐘</td><td>主立面朝東，正面順光較適合上午；晚間拍玻璃、燈光與天空，不稱為夕陽正面順光。</td></tr><tr><td>Athenaeum</td><td>44.441306,26.097306</td><td>9/2 <td>近正午光較硬，以側光拍半木構與塔樓；不承諾整棟順光。</td></tr><tr><td>Sinaia Monastery</td><td>45.35533,25.54962</td><td>10/1 15:45–16:30</td><td>西南側光、庭院可能遮蔭；教堂儀式優先。</td></tr><tr><td>Arcul de Triumf</td><td>44.467278,26.078361</td><td>10/2 16:30</td><td>西南光利西南側立面；只走合法過街處，不到車流中央取景。</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.431742%2C26.098789">Stavropoleos｜44.431742,26.098789</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.4320%2C26.0965">CEC Palace｜44.4320,26.0965</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.441306%2C26.097306">Athenaeum｜44.441306,26.097306</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.15679%2C24.67546">Curtea Monastery｜45.15679,24.67546</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.14204%2C24.67574">Princely Church｜45.14204,24.67574</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.34963%2C24.63293">Poenari parking｜45.34963,24.63293</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.35382%2C24.63521">Poenari Fortress｜45.35382,24.63521</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.36632%2C24.63058">Vidraru Dam｜45.36632,24.63058</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.39163%2C24.62723">Hotel Valea cu Pești｜45.39163,24.62723</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.6033%2C24.6172">Bâlea Lake｜45.6033,24.6172</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.7963%2C24.1518">Piața Mare Sibiu｜45.7963,24.1518</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.75394%2C24.11459">ASTRA｜45.75394,24.11459</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.13694%2C24.52694">Biertan｜46.13694,24.52694</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332">Clock Tower｜46.21929,24.79332</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.0549%2C25.0886">Viscri｜46.0549,25.0886</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=46.03715%2C25.21241">Rupea｜46.03715,25.21241</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.6410%2C25.5880">Black Church｜45.6410,25.5880</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.6429%2C25.5866">White Tower｜45.6429,25.5866</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.593020%2C25.385220">Libearty｜45.593020,25.385220</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.5674%2C25.64368">Seven Ladders｜45.5674,25.64368</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.41395%2C25.54292">Cantacuzino｜45.41395,25.54292</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.35972%2C25.54278">Peleș｜45.35972,25.54278</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=45.35533%2C25.54962">Sinaia Monastery｜45.35533,25.54962</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=44.467278%2C26.078361">Arcul de Triumf｜44.467278,26.078361</a></section><section id="ro-sun"><h2>日出、日落與暮光</h2><p>Astral依座標與Europe/Bucharest時區計算，時間取整分；以無山稜遮擋的標準地平線為基準，山區實際直射光可能早很多消失。此表不是天氣預報。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>地點</th><th>日出</th><th>日落</th><th>民用暮光結束</th></tr></thead><tbody><tr><td>2026-09-23</td><td>Bucharest</td><td>07:03</td><td>19:11</td><td>19:40</td></tr><tr><td>2026-09-24</td><td>Bucharest</td><td>07:05</td><td>19:09</td><td>19:38</td></tr><tr><td>2026-09-25</td><td>Vidraru</td><td>07:12</td><td>19:13</td><td>19:43</td></tr><tr><td>2026-09-26</td><td>Bâlea</td><td>07:13</td><td>19:11</td><td>19:41</td></tr><tr><td>2026-09-27</td><td>Sibiu</td><td>07:16</td><td>19:11</td><td>19:41</td></tr><tr><td>2026-09-28</td><td>Sighișoara</td><td>07:15</td><td>19:06</td><td>19:37</td></tr><tr><td>2026-09-29</td><td>Brașov</td><td>07:13</td><td>19:01</td><td>19:31</td></tr><tr><td>2026-10-01</td><td>Sinaia</td><td>07:15</td><td>18:58</td><td>19:28</td></tr></tbody></table></div></section><section id="ro-food"><h2>料理辨識與點餐</h2><p>兩人通常先共享一份湯、一份主菜與一份蔬菜，再視份量加點。餐廳名稱是沿線候選，沒有代訂、也不保證當天座位。駕駛不飲酒。</p><div class="tablewrap"><table><thead><tr><th>料理</th><th>文化與口感</th><th>點餐方式</th></tr></thead><tbody><tr><td>Ciorbă</td><td>帶酸味的湯；牛肚版常有奶油、蒜與蛋黃</td><td>詢問酸度與配料</td></tr><tr><td>Sarmale／Mămăligă</td><td>酸菜包肉米；玉米糊為農村主食</td><td>搭配酸奶油，共享即可</td></tr><tr><td>Bulz</td><td>牧羊起司與玉米糊，可加蛋或肉</td><td>份量厚重，不再同時點大量主食</td></tr><tr><td>Mici／Tochitură</td><td>烤絞肉條／燉肉，常配芥末或玉米糊</td><td>肉類主菜二選一</td></tr><tr><td>Zacuscă</td><td>烤茄子、甜椒保存醬</td><td>秋季早餐配麵包</td></tr><tr><td>Papanași／Cozonac</td><td>乳酪甜點／節慶甜麵包</td><td>Papanași先點一份兩人分享</td></tr></tbody></table></div></section><section class="day" id="ro23"><span class="tag">2026-09-23</span><h2>抵達Bucharest｜老城與王國立面</h2><p>住宿：Central Comfort Suites - Geo12。抵達日只走平緩老城，依航班與交通延誤縮減。</p><div class="slot" id="ro23-1"><div class="time">11:35–17:20</div><div><h3>TIA → OTP、交通與入住</h3><p>Ryanair 11:35起飛、14:00抵達（各地當地時間）；14:50–15:20預估出關。100號巴士或Bolt／Uber，16:30–17:20入住休息。STB工程公告將100／442機場站調整至Plecări共用站，依機場現場標示找站，勿在原Sosiri站空等。</p><p><b>預約：</b>航班與住宿依提供訂單；接駁及入住時間為估算。</p></div></div><div class="slot" id="ro23-2"><div class="time">17:30–18:00</div><div><h3>Piața Unirii → Manuc’s Inn → Curtea Veche</h3><p>從大廣場進入舊城，王公宮廷遺址以外觀為主。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hanul%20lui%20Manuc%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-2">導覽</a></div></div><div class="slot" id="ro23-3"><div class="time">18:00–18:30</div><div><h3>Stavropoleos → Cărturești Carusel</h3><p>小型教堂、庭院石刻與書店；若已關門只看外觀。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.431742%2C26.098789" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-3">導覽</a></div></div><div class="slot" id="ro23-4"><div class="time">18:30–19:40</div><div><h3>CEC Palace → Macca–Villacrosse Passage</h3><p>CEC外觀與玻璃頂商業廊道；日落後再拍燈光與天空。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.4320%2C26.0965" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-4">導覽</a></div></div><div class="slot" id="ro23-5"><div class="time">19:45後</div><div><h3>晚餐與早餐補給</h3><p>Hanu’ lui Manuc或Caru’ cu Bere擇一，依營業及座位決定；買水、優格、水果與早餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Caru%20cu%20Bere%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro23-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>下雨先逛書店、拱廊與餐廳庭院；宗教場所入內依開放。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Unirii繞行與Curtea Veche停留，保留入住、晚餐與一段老城。</p></div></section><section class="day" id="ro24"><span class="tag">2026-09-24</span><h2>Bucharest｜人民宮、革命與Athenaeum音樂會</h2><p>住宿：Central Comfort Suites - Geo12。上午權力建築，晚上文化募款象徵；兩者形成整日主題。</p><div class="slot" id="ro24-1"><div class="time">08:45出門；09:30報到；10:00–11:15</div><div><h3>Palace of Parliament</h3><p>預留安檢，帶實體護照；入口依預約說明，不直接導航到正面廣場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Palace%20of%20Parliament%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-1">導覽</a><p><b>預約：</b>目標10:00英文導覽；依官方確認的入口及報到時間。</p></div></div><div class="slot" id="ro24-2"><div class="time">11:20–14:00</div><div><h3>Constitution Square → 午餐 → Cișmigiu</h3><p>11:20–11:45廣場；12:00–13:00午餐；13:15–14:00公園。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Piata%20Constitutiei%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-2">導覽</a></div></div><div class="slot" id="ro24-3"><div class="time">14:15–16:15</div><div><h3>Revolution Square → 國家美術館／咖啡</h3><p>革命廣場45分鐘；美術館只選一個展區，不安排完整館藏。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Revolution%20Square%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-3">導覽</a></div></div><div class="slot" id="ro24-4"><div class="time">16:30–18:20</div><div><h3>Calea Victoriei向北步行與早晚餐</h3><p>CEC → National Military Circle → Casa Capșa → Revolution Square → Athenaeum；17:30左右吃簡餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Calea%20Victoriei%20Bucharest" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro24-4">導覽</a></div></div><div class="slot" id="ro24-5"><div class="time">18:30入場；19:00演出</div><div><h3>David Kadouch｜Bucharest International Piano Festival</h3><p>Athenaeum鋼琴獨奏，售票頁列9/24 19:00，159.08 RON起；目前未購票。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.441306%2C26.097306" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.iabilet.ro/bilete-david-kadouch-recital-de-pian-bucharest-international-piano-festival-128514/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro24-5">導覽</a><p><b>預約：</b>建議購票，非已訂；庫存及價格依結帳頁。</p></div></div><div class="soft"><b>雨天備案</b><p>公園縮短，增加美術館或咖啡；音樂會與人民宮需先確認票。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪美術館、縮短公園；17:30前吃簡餐，18:30抵達音樂廳。</p></div></section><section class="day" id="ro25"><span class="tag">2026-09-25</span><h2>取車 → Curtea de Argeș → Vidraru湖畔</h2><p>住宿：Hotel Valea cu Pești，位於Vidraru湖沿線。已刪除Central Vibe與Curtea住宿，不在隔天重跑水壩。</p><div class="slot" id="ro25-1"><div class="time">09:00–10:10</div><div><h3>SIXT取車與出城</h3><p>09:30取車，拍車身四角、底緣、輪圈、玻璃、車頂、油表與里程。確認門市、10/2歸還時限、燃油規則、rovinieta、救援及山路使用条件。</p><p><b>預約：</b>攜帶護照、台灣駕照、國際駕照及合約要求的主駕駛信用卡；文件以SIXT書面確認為準。</p></div></div><div class="slot" id="ro25-2"><div class="time">12:15–13:10</div><div><h3>Curtea de Argeș Monastery</h3><p>從Bucharest經Pitești方向前往；城市出城可能延誤。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.15679%2C24.67546" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro25-2">導覽</a></div></div><div class="slot" id="ro25-3"><div class="time">13:20–14:00</div><div><h3>Princely Church of Saint Nicholas</h3><p>舊王公宮廷與教堂；若抵達延誤，以外觀或短訪代替。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.14204%2C24.67574" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro25-3">導覽</a></div></div><div class="slot" id="ro25-4"><div class="time">14:00–14:40</div><div><h3>午餐、加油與高山日補給</h3><p>買水、麵包、起司、冷肉、水果、堅果與熱飲；確認飯店早餐能否外帶。不假設飯店客房有廚房。</p></div></div><div class="slot" id="ro25-5"><div class="time">15:20決定；約15:30–17:30選配</div><div><h3>Poenari Fortress</h3><p>約1,480階，僅在官方團很快成行、天乾且體力足時登頂；含往返至少保留約2小時。等待超過20–30分鐘就跳過。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.34963%2C24.63293" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.cjarges.ro/en/programul-evenimentelor-cultural-artistice-in-perioada-15-23-august-2026" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro25-5">導覽</a></div></div><div class="slot" id="ro25-6"><div class="time">不登堡約16:00；登堡約17:45</div><div><h3>Vidraru Dam → Hotel Valea cu Pești</h3><p>水壩停20–30分鐘；不登堡約17:00入住，登堡約18:30。飯店在湖東岸沿線，並非湖最北端。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.36632%2C24.63058" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro25-6">導覽</a></div></div><div class="slot" id="ro25-7"><div class="time">18:20–19:10視抵達；晚餐後早睡</div><div><h3>湖畔露台與隔日路況準備</h3><p>看夕照、整理防風保暖層，確認外帶早餐；明早06:30決策，不預設高山健行。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.39163%2C24.62723" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>Poenari取消登階；修道院後補給，再沿正式道路抵湖畔住宿。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>第一個刪Poenari登頂，其次縮短Princely Church；保留補給、加油、白天山路與休息。</p></div></section><section class="day" id="ro26"><span class="tag">2026-09-26</span><h2>Transfăgărășan｜高山道路與冰斗湖</h2><p>住宿：Zenith Apartament Old Town Piata Mare，Sibiu。高山段只在正式開放且當日條件適合時通行；不安排必走Capra Saddle。</p><div class="slot" id="ro26-1"><div class="time">06:30–07:10</div><div><h3>Go／No-Go與早餐</h3><p>查警方／道路單位公告、Bâlea即時溫度、降雪結冰、風勢與能見度。9/22初雪後路況正常只是歷史快照。若封路沒有明確上午恢復時間，直接南返走DN7備案。</p><p><b>預約：</b>已設定9/26 06:30羅馬尼亞當地時間檢查提醒；現場告示與官方管制優先。</p></div></div><div class="slot" id="ro26-2"><div class="time">07:10–09:15</div><div><h3>Vidraru沿湖北上</h3><p>07:10離店，水壩已於前日看過。彎道、路面與野生動物可能使車速很低。</p><a class="guide-link" href="#guide-ro26-2">導覽</a></div></div><div class="slot" id="ro26-3"><div class="time">09:45–11:00</div><div><h3>Capra Waterfall與南坡地形</h3><p>瀑布短停約25分鐘，再往高山；時間是彈性窗口，依道路實況調整。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cascada%20Capra%20Romania" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro26-3">導覽</a></div></div><div class="slot" id="ro26-4"><div class="time">11:00–12:45</div><div><h3>Bâlea Lake</h3><p>簡短湖邊散步與自備午餐；不預設完整環湖或上Capra Saddle，結冰及封閉步段不走。</p><a class="map" href="https://www.google.com/maps/search/?api
