/* Compact, persistent R & A navigation. */
:root{--sitebar-height:100px}
#sitebar{position:sticky;top:0;z-index:25;flex-direction:column;align-items:flex-start;gap:0;padding:7px max(20px,calc((100vw - 1180px)/2)) 5px}
.brand{min-height:35px;gap:0}.brand-mark{font:italic 25px/1.2 Georgia,serif;border:0;padding:0;letter-spacing:1px}
.top-actions{display:flex;flex-wrap:wrap;gap:6px 24px}.top-actions a{font-size:14px;min-height:40px;padding:6px 0;display:flex;align-items:center}
#app-main>.searchform:first-child{margin-top:0}.trip-toolbar{top:var(--sitebar-height);z-index:15}
html{scroll-padding-top:calc(var(--sitebar-height) + 155px)}
.legacy section,.legacy .guide-card,.legacy .slot{scroll-margin-top:calc(var(--sitebar-height) + 155px)}
@media(max-width:760px){#sitebar{padding:6px 16px 4px}.brand-mark{font-size:24px}.top-actions{gap:4px 22px}#app-main{padding-top:20px}.country-card h3{font-size:24px}}

/* Quiet country labels; search lives beside travel tools. */
.country-heading{margin-top:0;margin-bottom:16px;flex-wrap:wrap;gap:6px 16px}
.country-heading h2{font-size:18px;font-weight:650;letter-spacing:0}
.country-code{font:600 14px/1.4 system-ui,sans-serif;letter-spacing:1.5px;color:var(--muted)}
.country-top{margin-bottom:16px}
.country-card{min-height:245px}
@media(max-width:760px){.country-card{min-height:235px}.top-actions{column-gap:20px}.country-heading h2{font-size:18px}}

/* Small, stable itinerary controls in both reading sizes. */
.trip-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:8px 0;margin-bottom:16px;align-items:center}
.trip-toolbar select{width:100%;min-width:0;max-width:none;height:40px;min-height:40px;font-size:16px;line-height:1.25;padding:7px 10px;border-radius:7px;text-overflow:ellipsis}
.trip-toolbar button{min-height:40px;height:40px;font-size:14px;line-height:1.25;padding:7px 11px;border-radius:7px;white-space:nowrap}
.trip-toolbar button[data-large][aria-pressed=true]{background:#e0f2f1;border-color:#77aaa8;color:#005b5d}
body.large-text .legacy button,body.large-text .legacy .btn,body.large-text .legacy .map,body.large-text .legacy .guide-link,body.large-text .legacy .guide-return,body.large-text .legacy nav{font-size:14px}
html{scroll-padding-top:calc(var(--sitebar-height) + 72px)}
.legacy section,.legacy .guide-card,.legacy .slot{scroll-margin-top:calc(var(--sitebar-height) + 72px)}
@media(max-width:380px){.trip-toolbar{gap:6px}.trip-toolbar button{padding:7px 8px}.trip-toolbar select{padding-inline:7px}}

/* Date-only itinerary toolbar. */
.trip-toolbar{grid-template-columns:minmax(0,1fr);padding:7px 0;margin-bottom:12px}
.trip-toolbar select{height:40px;min-height:40px;max-width:440px;background:#fff}
.trip-intro{padding:12px 0 4px}.trip-intro h1{margin-bottom:12px}

.history-years a[aria-current]{background:#112d46;color:white}
.history-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
.history-stats>div{background:#112d46;color:white;border-radius:12px;padding:20px}
.history-stats strong{display:block;font-size:38px;line-height:1.4;font-variant-numeric:tabular-nums}

.history-date{flex:0 0 72px;align-self:flex-start;text-align:center;background:#edf3f6;border-radius:9px;padding:15px 7px;color:#183951}
.history-date strong,.history-date small{display:block}.history-date strong{font-size:20px}
.history-body{min-width:0;flex:1}.history-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.history-card details{margin-top:14px}.history-card li{margin:8px 0}.history-card .btn{margin:5px 8px 5px 0}

.flag-panel{padding:0;overflow:hidden}.flag-table{width:100%;border-collapse:collapse;text-align:left}.flag-table th{background:#112d46;color:#fff;padding:14px 18px}.flag-table td{padding:12px 18px;border-bottom:1px solid #dce4e9}.flag-table tbody tr:nth-child(even){background:#f4f7fa}.flag-table td:first-child{width:55px;color:#536578}.flag-table td:nth-child(2){width:115px;white-space:nowrap}.country-flag{font-size:32px;vertical-align:middle;margin-right:8px}.flag-table td:last-child{font-weight:600}@media(max-width:450px){.flag-table th,.flag-table td{padding:10px}.flag-table td:nth-child(2){width:85px}.country-flag{font-size:28px}.flag-table td small{font-size:11px}}

<template id="content-egypt-2026"><nav><a href="#eg1013">10-13 SOF → ATH → CAI｜抵達與吉薩入住</a><a href="#eg1014">10-14 GEM｜14:00–21:00完整隨身導覽＋原吉薩方案保留</a><a href="#eg1015">10-15 GEM｜從王權到日常生活的完整博物館日</a><a href="#eg1016">10-16 Saqqara → Memphis → Dahshur｜金字塔如何被發明</a><a href="#eg1017">10-17 Giza → Bahariya → Black &amp; White Desert｜綠洲與古海床</a><a href="#eg1018">10-18 White Desert日出 → Cairo／Zamalek</a><a href="#eg1019">10-19 Egyptian Museum → Downtown｜考古史與近代開羅</a><a href="#eg1020">10-20 Coptic Cairo＋NMEC｜基督教、伊斯蘭與木乃伊</a><a href="#eg1021">10-21 Historic Cairo｜堡壘、馬穆魯克與工藝街</a><a href="#eg1022">10-22 Manial＋Nilometer → Zamalek｜王室品味與尼羅河數據</a><a href="#eg1023">10-23 Cairo → Aswan｜尼羅河第一瀑布與努比亞門戶</a><a href="#eg1024">10-24 Aswan｜Philae、花崗岩與努比亞博物館</a><a href="#eg1025">10-25 Elephantine＋Felucca｜河流、社群與慢旅行</a><a href="#eg1026">10-26 Aswan → Abu Simbel｜納瑟湖邊住一晚</a><a href="#eg1027">10-27 Abu Simbel晨光 → Aswan｜帝國宣傳與保存工程</a><a href="#eg1028">10-28 Aswan → Kom Ombo → Edfu → Luxor｜包車神廟日</a><a href="#eg1029">10-29 Dendera → Luxor Temple夜景｜Hathor與王權更新</a><a href="#eg1030">10-30 Luxor West Bank｜帝王谷、女性法老與工匠</a><a href="#eg1031">10-31 熱氣球候選＋Karnak＋Luxor Museum｜旅程收束</a><a href="#eg1101">11-01 LXR → CAI → AMM｜離開埃及</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="eg-route"><h2>已訂版本｜20天19晚，住宿與航班優先</h2><p>本頁依2026/10/12提供的第一部分訂單重排，附件的歷史文化內容保留並補充；舊稿3晚河輪、Hurghada、KaiSol與11/6離境已不屬本次正式行程。10/26住Abu Simbel，10/27回Aswan，10/28包車到Luxor，11/1飛往Amman。</p><p>Abu Simbel改為過夜後晨光參觀；10/24–25留給Aswan。Kom Ombo與Edfu集中10/28，Dendera提前10/29，Karnak放10/31。Luxor兩筆住宿合計4晚，10/29是否需換房請住宿確認。</p><p>時間是含休息與交通的規劃視窗，不是已確認班次。航班與住宿依使用者資料；門票、包車、演出和沙漠團是否已付款未明者，清楚標成待確認。所有地圖為景點搜尋／地理參考，住宿使用你的訂單定位。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>住宿</th><th>地區</th><th>晚數／備註</th></tr></thead><tbody><tr><td>10/13–17</td><td>Brassbell | By the Pyramids</td><td>Giza</td><td>4晚</td></tr><tr><td>10/17–18</td><td>黑白沙漠露營</td><td>Western Desert</td><td>1晚；團商與包含專案依訂單確認</td></tr><tr><td>10/18–23</td><td>Studio 18 Airbnb_Abu Al Feda</td><td>Cairo／Zamalek</td><td>5晚</td></tr><tr><td>10/23–26</td><td>Pajama Hostel Nile View</td><td>Aswan</td><td>3晚</td></tr><tr><td>10/26–27</td><td>Hllol Hotel Abu Simbel</td><td>Abu Simbel</td><td>1晚</td></tr><tr><td>10/27–28</td><td>Pajama Hostel Nile View</td><td>Aswan</td><td>1晚</td></tr><tr><td>10/28–11/1</td><td>Temple &amp; Nile view</td><td>Luxor</td><td>4晚；兩筆訂單，確認10/29是否須換房</td></tr></tbody></table></div></section><section id="eg-field-guide"><h2>先讀懂埃及｜河流、王權與多層文明</h2><p>尼羅河是文明的結構：農業、人口和交通長期集中在狹長河谷與三角洲。古代洪水帶來淤泥，黑色沃土Kemet與紅色沙漠Deshret形成鮮明對照。高壩建成後年度洪水被調節，今日河岸並非古代原狀。</p><p>上埃及在南方、下埃及在北方，名稱依上游與下游，不是地圖上下。白冠代表上埃及、紅冠代表下埃及，雙冠是統一王權；法老透過名字、服飾與建築反覆宣告合法性。</p><p>神廟主要是神的居所和國家儀式中心，最內層未必對一般民眾開放；祭司代表國王供養神像。陵墓讓ka接受供養、ba往返，假門、食物圖、咒文和棺槨都服務來世延續。</p><p>浮雕不是新聞紀錄。國王擊敵、獻祭、接受ankh的畫面使「秩序持續發生」；Ma’at含真理、公正與宇宙平衡。看戰爭壁面時，把軍事結果與王室宣傳分開。</p><p>埃及不是單一不變文化：努比亞、黎凡特、希臘與羅馬都有交流與衝突；科普特、伊斯蘭與現代社會不是附屬尾聲。GEM、古蹟搬遷與沙漠保護，也屬於今日埃及的歷史。</p><p>年代速讀：古王國看Djoser、Sneferu、Khufu；中王國關注國王形象與底比斯崛起；新王國看Hatshepsut、Tutankhamun、Ramesses II／III與帝王谷；托勒密／羅馬看Philae、Kom Ombo、Edfu、Dendera。行程不是嚴格年代順序，請用這條線串聯。</p></section><section id="eg-symbols"><h2>神祇與影象速查｜站在浮雕前就能用</h2><p>先辨人物頭部、王冠、手持物與動作，再讀王名框；同一神有多種形態，不能只憑一個動物頭就保證身份。損壞可能來自改刻、宗教變化、風化或後世施工，不全部歸咎於盜墓。</p><div class="tablewrap"><table><thead><tr><th>名稱／形象</th><th>意義</th><th>本次在哪裡比較</th></tr></thead><tbody><tr><td>ankh／環圈十字</td><td>生命與生命氣息，常由神交給王</td><td>各神廟門楣與獻祭</td></tr><tr><td>was／長權杖</td><td>支配與秩序</td><td>神祇手持物</td></tr><tr><td>djed／多橫線柱</td><td>穩定、Osiris與再生</td><td>Dendera、棺槨</td></tr><tr><td>cartouche／王名框</td><td>包圍國王名字的保護符號</td><td>吉薩、Karnak、Abu Simbel</td></tr><tr><td>uraeus／額前眼鏡蛇</td><td>王權保護、Wadjet</td><td>王冠與面具</td></tr><tr><td>Amun／Amun-Ra</td><td>底比斯主神、創造與太陽力量</td><td>Karnak／Luxor</td></tr><tr><td>Ra／Ra-Horakhty</td><td>太陽及地平線形態</td><td>Abu Simbel</td></tr><tr><td>Osiris／Isis／Horus</td><td>死亡再生、王位繼承、母性保護</td><td>Philae／Edfu／墓室</td></tr><tr><td>Seth</td><td>風暴、混亂與某些情境的保護力</td><td>Edfu河馬儀式</td></tr><tr><td>Hathor／牛角日輪、人面柱頭</td><td>天空、音樂、母性與王室</td><td>Nefertari小殿／Dendera</td></tr><tr><td>Ptah</td><td>工匠與創造</td><td>Memphis／Abu Simbel</td></tr><tr><td>Sobek／鱷魚頭</td><td>水域、力量、繁殖</td><td>Kom Ombo</td></tr><tr><td>Khnum／公羊頭</td><td>陶輪塑造生命、水源</td><td>Elephantine／Esna背景</td></tr><tr><td>Anubis／胡狼頭</td><td>防腐、墓地與引導亡者</td><td>NMEC／棺槨／墓畫</td></tr><tr><td>Nut／彎身天空女神</td><td>天空與太陽每日再生</td><td>KV9／Dendera</td></tr></tbody></table></div></section><section id="eg-operations"><h2>票務、時間與攝影｜實際執行邊界</h2><p>查核日期2026/10/12。部會介紹頁、官方售票系統與現場有時不同：Giza部會列08:00–16:00，舊稿07:00未當成保證；Abu Simbel部會基本750而舊稿822，須看當日專案；Hatshepsut官方不同頁有360／440。費用區保留差異，不把舊價冒充現價。</p><p>GEM現行官方入口由visit-gem.com轉至tickets.gem.eg。週四展廳09:00–18:00，票列含圖坦卡門、主展廳與古夫船館；個別限制區仍禁拍。手機私人拍攝也要依展區標示，不用閃光、自拍棒或三腳架。</p><p>各古蹟使用護照相符票種；基本票不等於所有墓室／地下室／屋頂。埃及多處採卡或電子票，保留可用實體卡、小額現金與離線票；不接受靠「電子票不能打洞」違反入場次數。</p><p>10/29跨10/30，Africa/Cairo由UTC+3回UTC+2。10/30起的鬧鐘、熱氣球與11/1航班全部核對新當地時間；手機自動更新時不要再手動減一小時。</p><p>攝影時間為方向與日程建議，不是晴天保證：Giza獅身與Abu Simbel東向立面偏上午，西南金字塔全景偏下午；沙漠日出日落側光、Luxor Temple由白天轉夜燈、墓室以現場許可低光觀看。</p><p>沒有對10月下旬作即時天氣保證；每個沙漠、帆船、熱氣球活動在前一晚與當晨確認風沙及正式放行。取消時用館舍與休息替代。</p></section><section id="eg-food"><h2>生活、飲食與補給｜不用每天追名店</h2><p>Giza：第一晚只買水、優格、水果與早餐，Carrefour／麵包店以地圖及營業時間為準；10/16補沙漠零食、溼紙巾與保暖物。Zamalek：Seoudi、Alfa或住處附近超市補早餐和水果，不必每天大量自炊。Aswan買椰棗、幹洛神花、香料、芝麻花生點心；Luxor留最後一晚買機場點心。</p><p>早餐ful是蠶豆料理，taameya常以蠶豆製成，配aish baladi麵餅；koshari以米、麵、豆、炸洋蔥和醬料組合；hawawshi是調味肉餡餅；molokhiya是黏滑葉菜湯，常配米飯及肉。烤鴿先確認價格與配菜，骨頭多宜慢吃；karkade是洛神花飲。</p><p>店名是候選而非現時品質保證。Abou Tarek適合第一次koshari，Zööba可嘗試埃及小吃；烤魚、烤雞、豆湯和家常料理未必要景觀餐廳。問清整份／每公斤、稅與服務費，整魚秤重前確認總價。</p><p>baksheesh是小費，但不代表每位主動幫忙者都必須接受。不要服務就立即說La, shukran；需要服務先談總價。標價超市與官方票口不議價，市集可禮貌比較。</p><p>宗教場所遮肩過膝，女性覆髮依清真寺要求；不從祈禱者前方穿過，不未經同意近拍人。科普特、穆斯林、努比亞與現代都市生活各有差異，不以單次攬客經驗概括全國。</p><p>常用語：Shukran謝謝；La, shukran不用謝謝；Kam?多少錢；Min fadlak／min fadlik請（對男／女）；Hammam fein?廁所在哪裡。價格、接送與行李用訊息再確認一次，比只聽my friend更實用。</p></section><section id="eg-heritage"><h2>世界遺產與當代活動</h2><p>本路線包含四個UNESCO世界文化遺產專案：Memphis及其墓地金字塔群（Giza、Saqqara、Dahshur）；Historic Cairo；Nubian Monuments from Abu Simbel to Philae；Ancient Thebes with its Necropolis（Luxor、Karnak與西岸）。同一系列裡的多個景點不重複算多項世界遺產。</p><p>GEM、NMEC、Dendera與White Desert各有文化自然價值，不因著名就自動算UNESCO世界遺產。白沙漠保護區與UNESCO名錄是不同身分。</p><p>已查到官方活動：10/20 20:00 Cairo Opera Main Hall阿拉伯音樂節開幕；10/22 20:00 Small Hall音樂節場次。只能確認日期與場地，票價、餘票和演出者另核對。10/19詩歌晚會語言門檻較高，不優先；不再以「10月全部未公佈」概括。</p><p>10/22 Abu Simbel太陽節不在你們當地住宿日期，不重排已訂航班。El Gouna與紅海相關活動已不在本版動線，沒有為它加回Hurghada。</p><a class="map" target="_blank" rel="noopener" href="https://cairoopera.org/en/calendar/opening-ceremony-of-arab-music-festival-conference-34th-edition/">10/20音樂節官方場次</a><a class="map" target="_blank" rel="noopener" href="https://cairoopera.org/en/calendar/arab-music-festival-and-conference-22-10-2026/">10/22小廳官方場次</a></section><section class="day" id="eg1013"><span class="tag">2026-10-13</span><h2>SOF → ATH → CAI｜抵達與吉薩入住</h2><p>住宿：Brassbell | By the Pyramids。Aegean A3981／A3934，10:55–19:05依已訂票；全程時間採各地當地時間。今晚以入境和休息為主。</p><div class="slot" id="eg1013-1"><div class="time">10:55–19:05</div><div><h3>Sofia → Athens → Cairo</h3><p>依航空公司登機證轉機；19:05為CAI預定抵達時間，非已查得當日準點保證。航班變更以航空公司通知為準。</p><p><b>交通：</b>SOF取車還車請沿保加利亞頁面與租車公司書面安排。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20International%20Airport" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1013-2"><div class="time">19:05–21:00</div><div><h3>入境、行李、提款與SIM</h3><p>護照、入境所需簽證／檔案先備妥；取行李後到正式電信櫃臺確認GB、有效期、通話、熱點與含稅總價，現場測試再離開。預留約1.5–2小時，排隊可能更久。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20International%20Airport" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1013-2">導覽</a></div></div><div class="slot" id="eg1013-3"><div class="time">21:00–22:30</div><div><h3>機場 → Brassbell</h3><p>Uber／事先安排接送，按實際路況約60–100分鐘作規劃；直接使用訂單的住宿定位，不以同名搜尋結果代替。先確認晚到入住，當晚只補水和早餐。</p><a class="guide-link" href="#guide-eg1013-3">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>優先保留當日主景點與住宿移動；延誤先刪自由散步、購物和次要外觀，門票最後入場前留緩衝。</p></div></section><section class="day" id="eg1014"><span class="tag">2026-10-14</span><h2>GEM｜14:00–21:00完整隨身導覽＋原吉薩方案保留</h2><p>2026-10-14更新：依附件加入今日GEM七小時完整導覽，含55個閱讀站、30支影片摘要與勘誤。原10/14吉薩方案保留於下方折疊區；原10/15 GEM安排為較早版本，今日參觀請以本附件為準。金字塔改期尚未指定。住宿：Brassbell | By the Pyramids。</p><section class="gem-guide" id="gem-full-guide">

<section id="gem-today"><h2>今天怎麼走</h2><p class="lead">先船館、再圖坦卡門，晚間把主展廳串成歷史。</p><p>這是一條<strong>以必看文物優先的七小時精選路線</strong>。全館逐件細讀需要遠超過一天；本安排把2.5小時給圖坦卡門、約2小時給十二主展廳。移動時間是規劃估算，不是實測。</p><div class="panel"><strong>已確認的時間與權限</strong><p>官方票務：週三展廳09:00–21:00、園區08:30–22:00，最晚入場為展廳閉館前一小時。門票時段是入場窗口，不限制入館後可停留的時長。一般入場票列有圖坦卡門、主展廳、大廳、大階梯及胡夫船館。</p><p class="sources"><a href="https://tickets.gem.eg/">官方票務與參觀條款</a>。船館獨立建築的當日末班動線／最後進入時間尚未核實，所以不排在晚上。</p></div>
<div class="route"><time>13:30–14:00</time><div><h3>抵達、安檢、票券與洗手間</h3><p>此段是14:00前的準備，不計入七小時。確認電子票、入場時段和是否有另外集合的導覽服務。不要將憑證當成已核實有效入場票。</p></div></div>
<div class="route"><time>14:00–14:20</time><div><h3>入口廣場 → Grand Hall</h3><p>懸空方尖碑5分；拉美西斯二世10分；大廳其他像與問路5分。立刻問船館今日截止時間、交通方式、圖坦卡門排隊與再入展區規則。</p></div></div>
<div class="route"><time>14:20–15:05</time><div><h3>Khufu’s Boats Museum</h3><p>預留往返與定位15分，第一船20分，第二船／修復展示10分。此時去可避免把獨立船館押在晚上。</p></div></div>
<div class="route"><time>15:05–15:40</time><div><h3>Grand Stairs → 金字塔窗景</h3><p>六個精選閱讀點：女王像、獅身人面像、門框、三尊像、女神護王、建築石棺群；單件約3–4分，留5分看窗景。可用電扶梯／電梯配合。</p></div></div>
<div class="route"><time>15:40–15:50</time><div><h3>坐下休息、洗手間</h3><p>進圖坦卡門前先處理；關閉相機閃光，手機低耗電。</p></div></div>
<div class="route"><time>15:50–16:15</time><div><h3>圖坦卡門：發現與少年王</h3><p>入口的考古脈絡、生活用品和寶座。以现场單向箭頭為準，不為配合本表逆行。</p></div></div>
<div class="route"><time>16:15–16:40</time><div><h3>圖坦卡門：移動、狩獵與王權</h3><p>戰車、匕首（若展出）、扇子及武器群；先結構後裝飾。</p></div></div>
<div class="route"><time>16:40–17:05</time><div><h3>圖坦卡門：門檻與守護</h3><p>黑金守護像、阿努比斯、四女神內臟神龕。</p></div></div>
<div class="route"><time>17:05–17:35</time><div><h3>圖坦卡門：身體與多層保護</h3><p>內臟石箱、小金棺、大型鍍金神龕、三層人形棺。</p></div></div>
<div class="route"><time>17:35–18:05</time><div><h3>圖坦卡門：面具與細讀</h3><p>黃金面具至少15分；其餘時間給剛才最想再看的同一動線物件。若面具實際位於前段，到達時就看，不刻意等到此刻。</p></div></div>
<div class="route"><time>18:05–18:20</time><div><h3>圖坦卡門：小物與排隊緩衝</h3><p>頭枕、蓮花杯、花盒、香膏器或葬床模型。此15分亦吸收排隊延誤。</p></div></div>
<div class="route"><time>18:20–18:55</time><div><h3>館內用餐、坐下休息</h3><p>確認用餐後可返回展廳的路線；不要穿過整個園區最外面的離場出口。採快速餐，避免正餐等位耗時。</p></div></div>
<div class="route"><time>18:55–19:25</time><div><h3>Main Galleries 1–3：史前至古王國</h3><p>先了解國家形成，再優先赫特菲勒斯三件、書吏米特里；卡伊合像有時間再看。</p></div></div>
<div class="route"><time>19:25–19:50</time><div><h3>Main Galleries 4–6：中王國</h3><p>梅塞赫提面具與外棺是核心，日用品順路。比较地方官與法老的來世準備。</p></div></div>
<div class="route"><time>19:50–20:25</time><div><h3>Main Galleries 7–9：新王國</h3><p>阿蒙—拉／圖特摩斯三世、拉美西斯頭像，以及現場阿瑪爾納相關展示。把剛才圖坦卡門放回帝國歷史。</p></div></div>
<div class="route"><time>20:25–20:45</time><div><h3>Main Galleries 10–12：後期至希臘羅馬</h3><p>木碑、沙布提、丹德拉銀像；看傳統如何延續與轉化。</p></div></div>
<div class="route"><time>20:45–21:00</time><div><h3>收尾並離開展廳</h3><p>不再開新支線。按館員清場指示往出口。購物如仍營業可留展廳關閉後，園區官方週三至22:00。</p></div></div>
<div class="notice"><strong>動線調整，不靠猜</strong><p>入場先取紙本地圖，問服務台：「Is the boat museum included and open now? What is its last admission today? Can we return to the galleries after dining inside the complex?」如果船館有指定時段，依館員指示換位。圖坦卡門內的時間表是<strong>閱讀分配</strong>，不是已核實的展櫃順序；遇單向動線就順走，先遇面具就先看。</p></div><div class="grid"><div class="panel"><h3>落後30–45分鐘</h3><p>使用圖坦卡門最後15分鐘緩衝；省略大廳順路群像、小型花盒與重複同類器。主展廳保留赫特菲勒斯、米特里與梅塞赫提，再快速通過後期段落。不要刪掉用餐休息。</p></div><div class="panel"><h3>體力下降時</h3><p>大階梯搭配電梯／扶梯，只看女王像與三尊像；主展廳以各時代一至兩件作代表。不要為找一件未定位的小物在不同廳反覆折返。黃金面具、寶座、內臟葬具、船與古王國家具仍是核心。</p></div></div></section>
<section id="gem-knowledge"><h2>進場前，先裝進腦中的八把鑰匙</h2><div class="grid">
<article class="panel"><h3>用三條線讀整座館</h3><p>社會 Society：誰生產、誰記帳、誰能消費？王權 Kingship：誰能統治、如何證明合法？信仰 Beliefs：身體、名字和宇宙秩序如何延續？十二主展廳交織這三條線。不要把每件器物都只解釋成「法老很有錢」。</p></article>
<article class="panel"><h3>尼羅河、上下埃及與兩頂冠</h3><p>尼羅河往北流，上埃及是南方河谷，下埃及是北方三角洲。白冠連結上埃及、紅冠連結下埃及，合冠宣示兩地統一；植物、雙神與王名也能重複同一理念。展品的東西方位又可與日出、日落及再生相聯，但不可把每個方向都機械套成單一答案。</p></article>
<article class="panel"><h3>神明可以有多種形象與重疊功能</h3><p>阿蒙關聯底比斯；拉是太陽神；卜塔與孟菲斯及工匠相聯；奧西里斯關聯死後再生；伊西斯是重要守護女神；荷魯斯常以隼形出現並連結王權；阿努比斯常呈胡狼形，關聯防腐與墓地；哈托爾常有牛耳／牛角日輪；塞赫美特為獅首女神。冠飾、銘文、姿態與出土脈絡要一起判斷。</p></article>
<article class="panel"><h3>瑪阿特不是一位專門「判刑」的神而已</h3><p>Maat同時指真理、正義、秩序與女神。稱心場景把亡者的心與瑪阿特羽毛相衡量，阿努比斯與托特等參與；奧西里斯主宰冥界。這是宗教圖像，不是考古學證明的死後制度。法老自稱維護瑪阿特，所以戰勝敵人與供奉諸神常被放在一起。</p></article>
<article class="panel"><h3>ka、ba、名字與身體</h3><p>ka常被譯為生命力，需要供養；ba常以人頭鳥呈現，表達能移動的個體面向；名字ren與身體也是延續存在的重要部分。這些概念不能完全等同現代單一「靈魂」。保存木乃伊、給予食物、保護王名、製作替身像，因而可以同時有必要。</p></article>
<article class="panel"><h3>三種死亡文本，不要全叫亡靈書</h3><p>《金字塔文》首先見於古王國晚期王室金字塔；《棺槨文》常與中王國棺具相聯；《亡靈書》是由不同咒語構成、可選擇組合的文本傳統，不是每人相同的一本書。《阿姆杜阿特》等王室冥界文本描述太陽夜間旅程。圖像中的十二小時，不是現代鐘點導覽表。</p></article>
<article class="panel"><h3>圖坦卡門為何比更偉大的法老有名</h3><p>他約在公元前14世紀末統治，年少即位、統治約九年。阿肯那頓時代的阿頓改革後，王名由Tutankhaten轉向Tutankhamun，反映宗教政策回歸。1922年墓葬重新發現，使大量葬具被保存、記錄與展示。它並非完全未被古代盜入；死亡原因與王后後續經歷也有未解之處。</p></article>
<article class="panel"><h3>今天看到的是原物、復原，還是展示解釋？</h3><p>展品可包含原件、修復材料、現代支架或數位復原。尤其船、木家具與破碎雕像，應看出土脈絡及保存說明。完整外觀不代表每一寸都是古代原料；殘缺也不一定是敵人故意破壞。這樣看會比追逐「未解之謎」更接近文物本身。</p></article>
</div><div class="tablewrap panel"><table><thead><tr><th>大致時期</th><th>今天用誰記住</th><th>理解重點</th></tr></thead><tbody><tr><td>古王國：約前2686–2181</td><td>胡夫、赫特菲勒斯、米特里</td><td>金字塔、王室工程、行政與供養</td></tr><tr><td>中王國：約前2055–1650</td><td>梅塞赫提、阿蒙涅姆赫特、塞努斯雷特</td><td>重新整合國家、地方菁英、棺具與文本</td></tr><tr><td>新王國：約前1550–1069</td><td>哈特謝普蘇特、圖坦卡門、拉美西斯</td><td>帝國、神廟、阿瑪爾納改革與王室葬具</td></tr><tr><td>之後至希臘羅馬</td><td>晚期祭司與托勒密王室</td><td>政權更迭，埃及宗教持續與融合</td></tr></tbody></table><p class="muted">年代為常用近似值；不同年代學會有差異。主展廳1–3、4–6、7–9、10–12的大分組用於定位，物件精確展櫃仍需現場地圖。</p></div>
<div class="panel"><h3>一分鐘符號辨識</h3><p><strong>Ankh ☥：</strong>生命。<strong>Djed：</strong>穩固、持續。<strong>Tyet：</strong>常與伊西斯保護相聯。<strong>Wedjat：</strong>荷魯斯之眼、完好與保護。<strong>Uraeus：</strong>額前直立眼鏡蛇、王權守護。<strong>王名圈 Cartouche：</strong>環繞部分王名的橢圓框。<strong>聖甲蟲 Scarab：</strong>可連結太陽與再生；並非每隻都代表同一段咒文。</p><p>遇到不認識的展品，依序問：<strong>它由什麼做？原本用在哪裡？誰有資格用？上面的圖文要達成什麼？</strong></p></div></section>
<section id="gem-objects"><h2>站在展品前，這樣看</h2><p>每張卡有辨識線索、解說、觀察重點、意義與易混淆處。<strong>「必看」優先，其餘依時間選讀。</strong>有館方編號就用它核對；沒有編號的群組卡不冒充單件作品。</p><div class="searchbar"><input id="gem-q" type="search" aria-label="搜尋展品" placeholder="搜尋：面具、寶座、GEM 8、Hetepheres…"><button class="button" id="gem-expand">全部展開</button><button class="button" id="gem-collapse">全部收起</button><button class="button" id="gem-clear">清除搜尋</button></div><p id="gem-count" class="muted"></p>
<div class="objectgroup" id="gem-arrival"><h2 class="sectionhead">01 · 入口與大廳</h2><p class="groupnote">14:00–14:20｜先讀王的形象</p>
<details class="card" id="gem-item1"><summary><span class="num">READING STOP 01</span><span class="badge ">精選</span><h3>懸空方尖碑</h3><div class="meta">Hanging Obelisk<br>入口廣場｜拉美西斯二世｜第十九王朝</div><p class="one">先找碑底的王名圈，再抬頭看向天空的尖端。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>這座來自塔尼斯的方尖碑，以架高的現代展示方式，讓人得以看見平常被底座遮住的王名。方尖碑把太陽崇拜、王的名字與永久紀念結合在同一件石造物上；今天的「懸空」是博物館展示設計，不是古代施工方式。</p><div class="look"><strong>現場找這三處</strong><p>① 底部王名圈；② 碑身的文字排列；③ 石體與現代支架的分界。</p></div><span class="label">看懂它的意義</span><p>古埃及留下名字，是延續存在的一種方式。王名不是署名而已，也是把王權放進神聖世界。</p><span class="label">別混淆</span><p>碑的來源地不必然等於最初製作或豎立的地點。</p><div class="sources"><a href="https://www.experienceegypt.eg/en/attraction-details/346/the-grand-egyptian-museum-gem" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：博物館設計；二：法老五名（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item2"><summary><span class="num">READING STOP 02</span><span class="badge must">必看</span><h3>拉美西斯二世巨像</h3><div class="meta">Colossal Statue of Ramesses II<br>Grand Hall｜GEM 1｜花崗岩｜高約11.35公尺</div><p class="one">這尊像原本守護孟菲斯的卜塔神廟。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>館方指出，巨像原本立在孟菲斯卜塔神廟外，兼具王權象徵與接受祈願的神聖形象。它曾長期立在開羅火車站前，如今轉入室內保存。最容易被宏偉比例掩蓋的，是王腿後方兩位王室子女：卡姆瓦塞特王子與賓特阿娜特公主。</p><div class="look"><strong>現場找這三處</strong><p>① 王腿後的小人物；② 王冠、假鬍鬚及王名；③ 退遠看身體與大廳的比例。</p></div><span class="label">看懂它的意義</span><p>人物大小表達的是身分與神聖等級，不是實際身高。這個方法在壁畫、寶座和戰爭場景會反覆出現。</p><span class="label">別混淆</span><p>不是孟菲斯露天博物館那尊平躺的拉美西斯巨像；不要混成同一件。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/colossal-statue-of-ramesses-ii" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：六：阿布辛貝；三：博物館設計（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item3"><summary><span class="num">READING STOP 03</span><span class="badge ">順路</span><h3>梅倫普塔紀功柱與海底王室像</h3><div class="meta">Victory Column / Ptolemaic Royal Statues<br>Grand Hall｜群組導讀</div><p class="one">大廳把不同時代的王權放在同一個迎賓空間。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>紀功柱延續法老把功業刻在永久材料上的傳統；托勒密王室像則提醒你：希臘出身的統治者也會使用埃及王權的視覺語言。館方旅遊介紹將梅倫普塔柱及來自赫拉克利翁沉沒古城的托勒密王、后像列在大廳。</p><div class="look"><strong>現場找這三處</strong><p>① 哪些冠飾仍是埃及式；② 柱上文字而非只看高度；③ 海底出土標籤與表面狀況。</p></div><span class="label">看懂它的意義</span><p>統治者可以改變，合法性的表達方式卻能延續。</p><span class="label">別混淆</span><p>梅倫普塔紀功柱不等於常被稱作「以色列碑」的那塊石碑；未核實人物姓名，不把王后像直接叫克麗奧佩脫拉。</p><div class="sources"><a href="https://www.experienceegypt.eg/en/attraction-details/346/the-grand-egyptian-museum-gem" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：五、六：王權與神殿（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
</div>
<div class="objectgroup" id="gem-boat"><h2 class="sectionhead">02 · 胡夫船館</h2><p class="groupnote">14:20–15:05｜古王國的工程與來世</p>
<details class="card" id="gem-item4"><summary><span class="num">READING STOP 04</span><span class="badge must">必看</span><h3>胡夫第一艘船</h3><div class="meta">Khufu’s First Boat<br>Khufu’s Boats Museum｜第四王朝｜全長42.32公尺</div><p class="one">從側面看整艘船，再近看木板接合。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>1954年，在大金字塔南側發現兩座封閉船坑，內有拆解木構件。第一艘花了十年以上重新組裝，2021年以整船方式運往GEM。它讓金字塔時代從抽象的石造工程，變成可以觀察木材、曲線與接合技術的具體世界。</p><div class="look"><strong>現場找這三處</strong><p>① 船首船尾上揚的輪廓；② 船板接縫及固定方式；③ 船艙與槳的相對位置。</p></div><span class="label">看懂它的意義</span><p>「太陽船」是常用名稱；它可能與王的喪葬運輸、陪伴太陽神的來世航行有關。真正用途仍有討論。</p><span class="label">別混淆</span><p>不要把推測寫成已證實的航行紀錄。船館在獨立建築內，先問當日接駁／步行入口及截止時間。</p><div class="sources"><a href="https://gem.eg/collection/khufus-boats-museum/" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：金字塔與附屬建築（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item5"><summary><span class="num">READING STOP 05</span><span class="badge ">精選</span><h3>胡夫第二艘船與修復展示</h3><div class="meta">Khufu’s Second Boat<br>同一船館｜展示狀態以現場為準</div><p class="one">看「文物如何變回一艘船」，不只看成品。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>第二艘船的木件歷經提取、保存及運送。館方規劃讓觀眾看見持續修復與重建的過程；它與第一艘完整船體構成很好的對照：考古發現只是開始，辨識、編號、穩定材質與復原才讓物件能被理解。</p><div class="look"><strong>現場找這三處</strong><p>① 原木與支撐構件的區別；② 修復說明上的編號；③ 破損如何限制復原。</p></div><span class="label">看懂它的意義</span><p>博物館呈現的是證據與保存決策，不是把所有缺口任意補漂亮。</p><span class="label">別混淆</span><p>不保證你到場時有人正在操作；若局部不可看，不要因此拖延圖坦卡門展區。</p><div class="sources"><a href="https://gem.eg/collection/khufus-boats-museum/" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：古代工程（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
</div>
<div class="objectgroup" id="gem-stairs"><h2 class="sectionhead">03 · 大階梯</h2><p class="groupnote">15:05–15:40｜王與神相遇</p>
<details class="card" id="gem-item6"><summary><span class="num">READING STOP 06</span><span class="badge must">必看</span><h3>哈特謝普蘇特立像</h3><div class="meta">Statue of Queen Hatshepsut<br>Grand Stairs｜GEM 2205｜第十八王朝｜紅花崗岩</div><p class="one">找女性面部與男性王權符號如何共存。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>哈特謝普蘇特先任攝政，後以國王身分統治。這尊1928年出土於代爾巴哈里祭廟的像，結合較柔和的面部、王室頭巾、假鬍鬚與短裙。雙手沿裙伸展的姿勢，承接更早的王室雕像傳統。</p><div class="look"><strong>現場找這三處</strong><p>① 假鬍鬚；② nemes條紋頭巾；③ 手掌與裙子的關係。</p></div><span class="label">看懂它的意義</span><p>她採用的是「國王」的制度化形象；不能單憑男性服飾推論她在日常生活中掩飾性別。</p><span class="label">別混淆</span><p>不要把所有無名女性像都認作哈特謝普蘇特；請核對英文標籤或GEM 2205。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/statue-of-queen-hatshepsut" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：六：哈特謝普蘇特（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item7"><summary><span class="num">READING STOP 07</span><span class="badge ">精選</span><h3>阿蒙涅姆赫特三世獅身人面像</h3><div class="meta">Sphinx of King Amenemhat III<br>Grand Stairs｜中王國｜第十二王朝</div><p class="one">比較王的臉與獅子的身體如何形成權威。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>獅身人面像把人類統治者的智慧與猛獸的力量結合。中王國王室藝術的臉部，有時呈現比古王國理想化笑容更沉著的效果；這是藝術選擇，不能直接當成國王疲憊或憂鬱的醫學紀錄。</p><div class="look"><strong>現場找這三處</strong><p>① 臉部輪廓；② 獅鬃與前肢；③ 題名是否有不同時代的刻痕。</p></div><span class="label">看懂它的意義</span><p>古物可能被後來國王重新題名或利用；原製作年代和現存銘文年代未必一致。</p><span class="label">別混淆</span><p>同類石像不只一件，先看展牌。此卡解釋辨識方法，不指定未核實的展台編號。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/sphinx-of-king-amenemhat-iii" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：王權；三：金字塔文化（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item8"><summary><span class="num">READING STOP 08</span><span class="badge ">精選</span><h3>阿蒙涅姆赫特一世門框</h3><div class="meta">Doorway of King Amenemhat I<br>Grand Stairs｜第十二王朝｜花崗岩</div><p class="one">門框也能記錄一百年後的政治接力。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>館方記錄這組門框石塊出土於東部三角洲。其一面說阿蒙涅姆赫特一世建立紀念物，另一面提到約百年後的塞努斯雷特三世更新它。這不是單純「古老建築殘片」，而是後王藉修復連結前王功業的文字證據。</p><div class="look"><strong>現場找這三處</strong><p>① 門的尺度；② 不同面的文字；③ 修復、重用與原物的區別。</p></div><span class="label">看懂它的意義</span><p>修復先王建築，可以同時是宗教義務、政治宣告與歷史繼承。</p><span class="label">別混淆</span><p>原先是否出自附近某座王宮，館方措辭是推測，不能說已找到完整王宮。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/doorway-of-king-amenemhat-i" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：四：神殿的政治宣告（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item9"><summary><span class="num">READING STOP 09</span><span class="badge must">必看</span><h3>卜塔、拉美西斯二世與塞赫美特三尊像</h3><div class="meta">Ptah, Ramesses II and Sekhmet<br>Grand Stairs｜GEM 45815｜第十九王朝</div><p class="one">先認神，再看王站在哪裡。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>左、右神祇與中央法老共同構成王權圖像。卜塔以緊裹身形與帽子出現；塞赫美特為獅首女神。中央拉美西斯二世的肌肉、王冠與權杖特別醒目。館方指出，銘文還揭露神祇形象曾被改動的歷史。</p><div class="look"><strong>現場找這三處</strong><p>① 卜塔包裹式身形；② 塞赫美特獅首和日輪；③ 王與神接觸的手。</p></div><span class="label">看懂它的意義</span><p>法老的力量被放在神祇支持之中；不是僅靠一位人的武勇。</p><span class="label">別混淆</span><p>不要將所有獅首像都視為男性獅神，也不要把這組像和其他拉美西斯三尊像混淆。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/statue-of-god-ptah-king-ramesses-ii-and-sekhmet" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：各地宗教；六：阿布辛貝（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item10"><summary><span class="num">READING STOP 10</span><span class="badge ">精選</span><h3>拉美西斯二世與女神</h3><div class="meta">King Ramesses II and a Goddess<br>Grand Stairs｜GEM 20084｜紅花崗岩</div><p class="one">留意女神碰觸王冠與手臂的動作。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>這件組像的碎片於1825年在塔尼斯阿蒙大神廟發現。女神一手碰王冠，另一手扶王的手臂，藉親近動作表達神聖保護。館方認為女神可能是外來戰神阿娜特；「可能」必須保留。</p><div class="look"><strong>現場找這三處</strong><p>① 女神的手；② 兩張臉的比例；③ 石塊接縫和殘缺。</p></div><span class="label">看懂它的意義</span><p>埃及宗教不是完全封閉的系統，外來神祇也能被納入保護法老的角色。</p><span class="label">別混淆</span><p>無銘文直接提供女神身分；不要把阿娜特的辨識說成沒有爭議。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/king-ramesses-ii-and-a-goddess" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：古埃及神明（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item11"><summary><span class="num">READING STOP 11</span><span class="badge must">必看</span><h3>大階梯的建築、石棺與金字塔窗景</h3><div class="meta">Grand Stairs: Architecture and Eternity<br>Grand Stairs｜群組閱讀站</div><p class="one">把階梯當作「王—神—永生」的展示，而不是趕路通道。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>階梯展陳聚集王像、建築構件、神像與石棺。看門框、柱頭時，想像原來神殿內外如何分隔；看石棺時，觀察永久材料如何成為保護身體的容器。頂端看向吉薩，讓館內物件和原來的地景接起來。</p><div class="look"><strong>現場找這三處</strong><p>① 棕櫚／植物柱頭；② 石棺表面的神像與文字；③ 頂端窗景和遠方金字塔。</p></div><span class="label">看懂它的意義</span><p>埃及神殿不是現代公眾禮拜堂；內部神聖空間的進入權有層級。</p><span class="label">別混淆</span><p>這是群組導讀，不把現場任何無名石棺硬指認成某位法老。午後先拍窗景；夜間玻璃反光通常更強。</p><div class="sources"><a href="https://gem.eg/collection/grand-stairs/" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：四、五、六：神殿與墓葬（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
</div>
<div class="objectgroup" id="gem-tut"><h2 class="sectionhead">04 · 圖坦卡門</h2><p class="groupnote">15:50–18:20｜第十八王朝，從生活走向再生</p>
<details class="card" id="gem-item12"><summary><span class="num">READING STOP 12</span><span class="badge must">必看</span><h3>圖坦卡門黃金面具</h3><div class="meta">Golden Burial Mask<br>Tutankhamun Galleries｜GEM 8｜第十八王朝</div><p class="one">它把死去的王轉化為具有神性、可永存的形象。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>面具原覆蓋木乃伊頭部和肩部。金色身體連結太陽神，深藍色材料連結神聖的頭髮；王以奧西里斯式的死而復生形象呈現。背面銘文把臉部各部分與不同神祇連結，作用是保護，不只是裝飾。</p><div class="look"><strong>現場找這三處</strong><p>① 額前眼鏡蛇與禿鷲；② 眼線、嵌材和假鬍鬚；③ 若動線允許，背面的保護文字。</p></div><span class="label">看懂它的意義</span><p>你看到的是理想化王者與神的融合，不是一張可直接當作真人照片的肖像。</p><span class="label">別混淆</span><p>是否能拍照以此展區標誌為準。耳洞或局部工藝差異，不能單獨證明面具原屬另一位王。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/the-golden-burial-mask-of-tutankhamun" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：面具與棺槨（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item13"><summary><span class="num">READING STOP 13</span><span class="badge must">必看</span><h3>最外層人形棺</h3><div class="meta">Outer Coffin<br>Tutankhamun Galleries｜GEM 7590｜木、石膏、金箔</div><p class="one">先記住：金色不代表整件都是實心黃金。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>三層人形棺中，這件是最外層。棺體採木材，配合石膏、亞麻與薄金箔；臉、耳、頸和手部則使用較厚的金片塑形。交叉的雙手把王連結到木乃伊化的奧西里斯形象。</p><div class="look"><strong>現場找這三處</strong><p>① 面部與棺身不同的金工效果；② 交叉雙手；③ 棺蓋和棺底的接合。</p></div><span class="label">看懂它的意義</span><p>工藝讓不同材料合成一個永恆身體。現場比較材質，比記住金價更有收穫。</p><span class="label">別混淆</span><p>外棺、中棺、內棺與外面的石棺是不同層次；不要統稱為三個金棺。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/outer-coffin" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：三層人形棺（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item14"><summary><span class="num">READING STOP 14</span><span class="badge must">必看</span><h3>中層與內層棺：讀懂包覆系統</h3><div class="meta">Middle and Inner Coffins<br>Tutankhamun Galleries｜成組導讀，依現場展牌辨識</div><p class="one">看材料、羽翼紋和保護層次，不只看大小。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>圖坦卡門的葬具以重重包覆組成：大型木質神龕、石棺、三層人形棺，以及木乃伊與面具。內層棺以金製成，中層則是精密鑲嵌的木質棺。每一層都將保護神、王名與理想化身體連在一起。</p><div class="look"><strong>現場找這三處</strong><p>① 中、內棺材質差異；② 羽毛式圖案；③ 胸前權杖與連續王名。</p></div><span class="label">看懂它的意義</span><p>重複的形象不等於多餘；它把身體、名字、神祇與咒文的保護疊加。</p><span class="label">別混淆</span><p>此卡為結構說明，不保證所有原物依套疊方式陳列；木乃伊與原墓地石棺不要預設在此。</p><div class="sources"><a href="https://tutankhamun.griffith.ox.ac.uk/" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：棺槨與面具（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item15"><summary><span class="num">READING STOP 15</span><span class="badge must">必看</span><h3>大型鍍金神龕</h3><div class="meta">Gilded Burial Shrines<br>Tutankhamun Galleries｜第四、第三等套層按現場標籤</div><p class="one">這些像房間的金色構造，是棺槨外面的神聖建築。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>四層套疊的木質鍍金神龕原先環繞王的石棺。拆開展示後，才容易看清原來藏在層與層之間的圖文。它把墓室化為小型神聖宇宙，讓死王有保護、有路徑，也有再生的可能。</p><div class="look"><strong>現場找這三處</strong><p>① 尺度與門扇；② 神祇、翅膀與蛇的排列；③ 各層圖像是否相同。</p></div><span class="label">看懂它的意義</span><p>不要將所有冥界文字都叫《亡靈書》；王室葬具也會使用其他太陽與冥界文本。</p><span class="label">別混淆</span><p>不能由看見某個圖案，就自行報出未核對的章節或宣稱解開詛咒。</p><div class="sources"><a href="https://gem.eg/en/whats-on/news/the-grand-egyptian-museum-receives-the-inner-shrine-of-golden-king" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：來世十二境域與棺槨（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item16"><summary><span class="num">READING STOP 16</span><span class="badge must">必看</span><h3>黃金寶座</h3><div class="meta">Golden Throne<br>Tutankhamun Galleries｜GEM 4573｜木胎包金、鑲嵌</div><p class="one">先看王后對王的動作，再找上方阿頓太陽圓盤。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>椅背讓圖坦卡門與王后安克赫塞娜蒙處在親密的互動中，上方仍有阿頓日輪光線。側面以有翼眼鏡蛇與王名構成。這件早期王室家具，讓宗教改革、婚姻形象與王權連在一起，而不只是昂貴座椅。</p><div class="look"><strong>現場找這三處</strong><p>① 王后的手與王的肩；② 太陽光線末端；③ 扶手的翼蛇、嵌材與王名。</p></div><span class="label">看懂它的意義</span><p>圖坦卡門時代是從阿頓改革回歸阿蒙及傳統諸神的過渡期；器物可保留過渡的痕跡。</p><span class="label">別混淆</span><p>圖像可有親密與宗教雙重意義；「黃金情書」是文學比喻，不是出土文件的正式名稱。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/golden-throne" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：黃金寶座；二：阿肯那頓改革（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item17"><summary><span class="num">READING STOP 17</span><span class="badge must">必看</span><h3>兩尊黑金守護像</h3><div class="meta">Guardian Statues: Nemes and Khat<br>Tutankhamun Galleries｜GEM 5、GEM 4</div><p class="one">兩尊很像，差別藏在頭巾。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>兩尊近真人大小的王像原立在墓室封門兩側。黑色不代表魔鬼，而與尼羅河肥沃黑土和再生相關；金色飾件把王的神性凸顯出來。其中一尊戴nemes頭巾，另一尊為khat式頭巾。</p><div class="look"><strong>現場找這三處</strong><p>① 比較頭巾形狀；② 手中的長杖與權杖；③ 黑色身體與金色服飾對比。</p></div><span class="label">看懂它的意義</span><p>它們守住的是生者空間通往死王領域的門檻。跨過門，不只走進另一個房間，也是進入另一種存在狀態。</p><span class="label">別混淆</span><p>通常稱守護像，但不要把兩尊說成兩位不同法老。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/guardian-statue-with-nemes-headcloth" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：木乃伊與王權（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item18"><summary><span class="num">READING STOP 18</span><span class="badge must">必看</span><h3>阿努比斯神龕箱</h3><div class="meta">Anubis on a Chest<br>Tutankhamun Galleries｜GEM 6</div><p class="one">黑色胡狼守在箱上，箱子本身也像神殿入口。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>這件器物原在寶庫入口內側。上方是阿努比斯胡狼像，下面的箱體如神殿塔門，安置在有抬杆的鍍金木橇上。箱內分隔容納宗教物品與珠寶；它結合守護、儲存與儀式搬運。</p><div class="look"><strong>現場找這三處</strong><p>① 豎耳、眼睛和垂尾；② 抬杆與橇；③ 箱體的塔門輪廓。</p></div><span class="label">看懂它的意義</span><p>阿努比斯關聯防腐、墓地守護與亡者過渡；奧西里斯則是冥界王，角色不同。</p><span class="label">別混淆</span><p>不要稱它為「詛咒箱」；網路常見死亡詛咒句不是此器物已核實的銘文。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/anubis-on-a-chest" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：木乃伊、陰間審判（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item19"><summary><span class="num">READING STOP 19</span><span class="badge must">必看</span><h3>四女神守護的內臟神龕</h3><div class="meta">Canopic Shrine on a Sledge<br>Tutankhamun Galleries｜GEM 9</div><p class="one">繞看四位女神張開的雙臂。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>鍍金木質外龕保護王的防腐內臟。上方一排眼鏡蛇結合玻璃色彩，下方四位女神伊西斯、奈芙蒂斯、塞爾凱特與奈特伸臂守護。內部原有石製內臟箱及小金棺，形成另一組套層。</p><div class="look"><strong>現場找這三處</strong><p>① 四女神的頭飾；② 張臂姿態；③ 橇與上下兩排護衛蛇。</p></div><span class="label">看懂它的意義</span><p>保護不只是寫在文字上，也被做成立體形象，從四方圍住需要完整保存的身體部分。</p><span class="label">別混淆</span><p>這是內臟系統的外龕，不是包住整具人形棺的大型神龕。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/canopic-shrine-on-a-sledge" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：器官收藏（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item20"><summary><span class="num">READING STOP 20</span><span class="badge must">必看</span><h3>雪花石膏內臟箱</h3><div class="meta">Canopic Chest<br>Tutankhamun Galleries｜GEM 10｜埃及雪花石膏／方解石類石材</div><p class="one">四個王頭蓋，對應箱內四個圓柱形空間。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>石箱原藏在鍍金內臟神龕裡。四個孔穴各放入一具小金棺，上方以精雕王頭作塞蓋。四角女神浮雕延續外層的守護；底部可找代表穩固的djed柱與保護性的tyet結。</p><div class="look"><strong>現場找這三處</strong><p>① 人頭塞蓋；② 石材半透明質感；③ 四角女神和下緣符號。</p></div><span class="label">看懂它的意義</span><p>圖像、材料和方向共同構成防護；內臟並未隨意丟棄，而被精心保存。</p><span class="label">別混淆</span><p>這組蓋子為王的人頭，不能硬套成今天紀念品常見的四種動物頭蓋。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/canopic-chest" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：器官收藏（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item21"><summary><span class="num">READING STOP 21</span><span class="badge must">必看</span><h3>內臟小金棺</h3><div class="meta">Canopic Coffinette<br>Tutankhamun Galleries｜GEM 11（館方單件記錄）</div><p class="one">縮小的王形棺，工藝並沒有縮水。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>四具小棺分別容納經防腐處理的內臟。薄金板錘製成形，表面以羽毛紋、紅玉髓和有色玻璃裝飾，王戴頭巾並交持權杖。館方此件記錄與奈芙蒂斯女神相聯。</p><div class="look"><strong>現場找這三處</strong><p>① 細小的羽片鑲嵌；② 額前保護神；③ 若可見，內側圖文。</p></div><span class="label">看懂它的意義</span><p>由整個人到個別器官，所有部分都能以相同的王者與神聖形象獲得保護。</p><span class="label">別混淆</span><p>不要把四具全標GEM 11；此編號對應館方頁面記錄的那一件。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/canopic-coffinette" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：器官與葬具（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item22"><summary><span class="num">READING STOP 22</span><span class="badge must">必看</span><h3>戰車群</h3><div class="meta">Chariots<br>Tutankhamun Galleries｜共六輛出土，依展出狀態觀看</div><p class="one">先看木骨架與輪子，最後才看金飾。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>牛津保存的考古記錄記載墓中發現六輛戰車，包含不同用途與裝飾程度。它們揭示輕量結構、木工、皮革與金工的整合；車乘也表達王的速度、威望與軍事力量。</p><div class="look"><strong>現場找這三處</strong><p>① 輪輻；② 車廂底部與車軸；③ 儀仗式華麗車與較簡潔結構的差別。</p></div><span class="label">看懂它的意義</span><p>戰車是一套複合技術，也是一種王者形象。裝飾不等於曾上戰場的證據。</p><span class="label">別混淆</span><p>墓中有車不能證明他死於車禍；狩獵與戰爭圖像也不能直接當作本人實戰紀錄。</p><div class="sources"><a href="https://tutankhamun.griffith.ox.ac.uk/scientific-notes/taa-i38-chariots/taa-i3810" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：黃金戰車、弓箭、盾牌（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item23"><summary><span class="num">READING STOP 23</span><span class="badge must">必看</span><h3>隕鐵匕首</h3><div class="meta">Meteoric Iron Dagger<br>圖坦卡門藏品｜確切展櫃請詢問館員</div><p class="one">這把刀最珍貴的故事藏在金屬成分。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>2016年研究以非破壞性分析支持刀刃來自隕鐵；2022年研究再次從鎳、鈷等成分得到一致證據。它出現在青銅時代王室葬具中，顯示稀有材料能跨越遠距離交換與工藝網絡。</p><div class="look"><strong>現場找這三處</strong><p>① 鐵刃與金柄材質反差；② 刀鞘裝飾；③ 與旁邊另一把金匕首的區別。</p></div><span class="label">看懂它的意義</span><p>「來自天空」在此有材料科學支持，並不表示外星文明製作。</p><span class="label">別混淆</span><p>這是短匕首，不是長劍。材料來源較有把握，製造地與如何到達埃及仍須保留討論；當日是否展出須現場確認。</p><div class="sources"><a href="https://onlinelibrary.wiley.com/doi/10.1111/maps.13787" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：天鐵寶劍（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item24"><summary><span class="num">READING STOP 24</span><span class="badge ">精選</span><h3>獵鴕鳥金扇</h3><div class="meta">Ostrich Hunt Fan<br>Tutankhamun Galleries｜GEM 284</div><p class="one">同一把扇子，兩面是一段完整狩獵敘事。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>原來的鴕鳥羽毛受蟲蛀，未能保存完整。扇面一側描繪王駕車追逐鴕鳥，另一側是慢行歸來與侍從抬獵物。文字把羽毛的來源連結至赫利奧波利斯東部沙漠的狩獵。</p><div class="look"><strong>現場找這三處</strong><p>① 出發追逐和回程的節奏差；② 狗與隨從；③ 原來插羽毛的位置。</p></div><span class="label">看懂它的意義</span><p>普通的納涼用品也能變成展示王者能力的紀念物。讀兩面，比只拍一張更完整。</p><span class="label">別混淆</span><p>不要把同區所有羽扇都認為是這一把；核對GEM 284。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/ostrich-hunt-fan" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：王的狩獵與武器（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item25"><summary><span class="num">READING STOP 25</span><span class="badge ">精選</span><h3>舒神與雙獅頭枕</h3><div class="meta">Lions Headrest<br>Tutankhamun Galleries｜GEM 270｜象牙</div><p class="one">枕頭變成一個小型宇宙模型。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>中央跪姿的空氣神舒，用上舉的手臂支撐弧形枕面，兩側為獅子。頭置於其上，就像天體被支撐、穿越夜晚並在清晨重新升起；頭枕的實用與宗教意義結合。</p><div class="look"><strong>現場找這三處</strong><p>① 中央人形神上舉的手；② 左右獅子；③ 弧形托頭處。</p></div><span class="label">看懂它的意義</span><p>睡眠和死亡都可被理解為等待再醒的狀態，因而共享保護與重生的語言。</p><span class="label">別混淆</span><p>這不是所有埃及頭枕的通用造型，請先核對象牙雙獅這件。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/lions-headrest" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：護身符與來世（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item26"><summary><span class="num">READING STOP 26</span><span class="badge ">精選</span><h3>蓮花杯</h3><div class="meta">Lotus Cup<br>Tutankhamun Galleries｜GEM 36｜雪花石膏</div><p class="one">把器物當成一朵打開的花。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>蓮花造型把杯的實用外形與再生意象結合。古埃及圖像中的「蓮花」多涉及睡蓮；花開與水面出現的形態，能連結太陽升起和生命重現。王名與祝願語，使日常飲用器也進入永生的語彙。</p><div class="look"><strong>現場找這三處</strong><p>① 中央白色睡蓮花杯；② 兩側花莖上跪姿的永恆神Heh；③ 杯口文字。</p></div><span class="label">看懂它的意義</span><p>看到植物，不要只當裝飾。生命、地方象徵與王權，常被藏在花形之中。</p><span class="label">別混淆</span><p>不要把整段網路流傳祝詞當成此杯銘文的逐字翻譯。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/lotus-cup" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：創世與太陽神（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item27"><summary><span class="num">READING STOP 27</span><span class="badge ">精選</span><h3>花紋髮盒</h3><div class="meta">Floral Hair Box<br>Tutankhamun Galleries｜GEM 255｜小型容器</div><p class="one">從宏大的王權，回到人的身體與私人物品。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>盒蓋有植物花束，側面是連續花瓣紋。此類小物讓人看見王室器物的尺度差異：同一墓裡有能包住棺槨的神龕，也有容納少量個人物品的細緻盒子。館方對髮絲可能的歸屬使用推測語氣。</p><div class="look"><strong>現場找這三處</strong><p>① 花束的不同植物；② 側面重複花瓣；③ 開合方式與細小尺度。</p></div><span class="label">看懂它的意義</span><p>親密生活與儀式保存不一定互斥；個人物品也可能被賦予象徵意義。</p><span class="label">別混淆</span><p>不能把可能來自王與王后的頭髮，說成已用DNA證實。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/floral-hair-box" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一：王室生活與婚姻（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item28"><summary><span class="num">READING STOP 28</span><span class="badge ">精選</span><h3>華麗香膏容器</h3><div class="meta">Fancy Perfume Vase<br>Tutankhamun Galleries｜GEM 47｜香膏與植物符號</div><p class="one">找蓮花、紙莎草和戴冠眼鏡蛇。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>兩位人格化尼羅河的哈皮神，正把蓮花與紙莎草繫在瓶頸上，象徵河谷和三角洲結合。館方指出蓮花、紙莎草徽飾上有戴上下埃及王冠的眼鏡蛇。香膏可涉及身體護理、地位展示和宗教儀式，不能只用現代香水瓶理解。</p><div class="look"><strong>現場找這三處</strong><p>① 兩種植物；② 眼鏡蛇頭上的不同冠飾；③ 容器本身與附加裝飾。</p></div><span class="label">看懂它的意義</span><p>上下埃及統一的概念，不只出現在巨型王像，也進入手邊器物。</p><span class="label">別混淆</span><p>不憑外形推定裡面是哪種精油，或宣稱古代配方已完整還原。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/fancy-perfume-vase" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：符號與神聖身體（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item29"><summary><span class="num">READING STOP 29</span><span class="badge ">精選</span><h3>臥在葬床上的圖坦卡門模型</h3><div class="meta">Model of Tutankhamun on a Funerary Bed<br>Tutankhamun Galleries｜木質模型</div><p class="one">模型的功能，是把儀式縮成可攜帶的永恆場景。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>館方記錄這件木模型包在亞麻布中，置於石棺形盒內，並與五件沙布提工具同出。它提醒觀眾，墓中的模型不是兒童玩具；縮小的器物能在宗教觀念中承擔真實功能。</p><div class="look"><strong>現場找這三處</strong><p>① 臥姿人物；② 床與盒的形制；③ 附近標籤記錄的出土關係。</p></div><span class="label">看懂它的意義</span><p>考古學重視「和什麼一起被發現」，這往往比單件外形更能說明用途。</p><span class="label">別混淆</span><p>不要把所有葬床模型都當作真實木乃伊，也不要替未核對的小鳥或神像任意命名。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/model-of-tutankhamun-on-a-funerary-bed" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：木乃伊、入葬儀式（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
</div>
<div class="objectgroup" id="gem-main"><h2 class="sectionhead">05 · 十二主展廳</h2><p class="groupnote">18:55–20:45｜由史前、古王國走到希臘羅馬</p>
<details class="card" id="gem-item30"><summary><span class="num">READING STOP 30</span><span class="badge ">精選</span><h3>史前工具、調色板與早期國家</h3><div class="meta">Prehistory and Early State Formation<br>Main Galleries 1–3｜類型導讀</div><p class="one">先看工具與標記，國家不是突然出現的。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>打製石器、陶器、磨製工具與調色板，把生產、交換、身體裝飾和象徵秩序放在眼前。材料技術發展與行政組織相互影響，最後才能支撐大規模王室工程。不要將幾千年的史前發展壓縮成一個「法老時代」。</p><div class="look"><strong>現場找這三處</strong><p>① 製作痕跡；② 實用器與象徵器形；③ 展牌時間尺度。</p></div><span class="label">看懂它的意義</span><p>從小工具開始，可以更理解後來巨型工程需要的人力、糧食和知識。</p><span class="label">別混淆</span><p>這是類型卡，不聲稱納爾邁調色板原件在GEM；不要為找名物跳過展牌辨識。</p><div class="sources"><a href="https://gem.eg/collection/main-galleries/" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：金字塔工藝背景（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item31"><summary><span class="num">READING STOP 31</span><span class="badge must">必看</span><h3>赫特菲勒斯王后的抬椅</h3><div class="meta">Carrying Chair of Queen Hetepheres I<br>Main Galleries｜GEM 6362｜第四王朝</div><p class="one">胡夫母親的家具，把金字塔時代變得有生活感。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>抬椅出自大金字塔旁G7000X墓的王后葬具。長杆讓侍從扛抬，金銀覆飾與背面稱號標示主人身分。館方明示部分木材經修復；今天完整外形不是所有木料都以同樣狀態保存了四千多年。</p><div class="look"><strong>現場找這三處</strong><p>① 長抬杆；② 背面王后名字和頭銜；③ 原有金飾與修復木結構。</p></div><span class="label">看懂它的意義</span><p>大金字塔代表死後紀念，這張椅子則讓你想像王室生前的出行與侍從體系。</p><span class="label">別混淆</span><p>不要把它和同組扶手椅、床或床帳框架混為一件。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/carrying-chair-of-queen-hetepheres-i" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：金字塔、古王國（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item32"><summary><span class="num">READING STOP 32</span><span class="badge ">精選</span><h3>赫特菲勒斯頭枕</h3><div class="meta">Headrest of Queen Hetepheres I<br>Main Galleries｜第四王朝｜胡夫母親</div><p class="one">與剛才圖坦卡門的雙獅頭枕做一次跨千年的比較。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>頭枕支持的是頭頸，並非柔軟枕頭。館方將這件物品與保護睡眠的信仰連結。即使造型較簡潔，也能把王后日常休息與死後安穩連接起來。</p><div class="look"><strong>現場找這三處</strong><p>① 接觸頭部的弧面；② 支柱和底座；③ 與新王國象牙頭枕的繁簡差異。</p></div><span class="label">看懂它的意義</span><p>物品用途可以延續很久，形式和宗教表達卻會變。這是比較兩位王室人物最直觀的方式。</p><span class="label">別混淆</span><p>不要把古人睡頭枕的經驗，直接等同現代人以同一姿勢睡整晚。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/headrest-of-queen-hetepheres-i" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：睡眠、身體保護（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item33"><summary><span class="num">READING STOP 33</span><span class="badge must">必看</span><h3>赫特菲勒斯內臟箱</h3><div class="meta">Canopic Chest of Queen Hetepheres I<br>Main Galleries｜GEM 6363｜第四王朝</div><p class="one">回想圖坦卡門的華麗套龕：相同需求，已有更早版本。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>王后石製內臟箱藏在墓室西壁的壁龕。箱內四個分格仍留有經防腐處理的內臟殘跡，館方對具體器官使用「可能」的說法。和圖坦卡門相比，形式簡潔得多，保存身體完整性的需求卻早已存在。</p><div class="look"><strong>現場找這三處</strong><p>① 四分格；② 石材；③ 與圖坦卡門四個王頭蓋的不同。</p></div><span class="label">看懂它的意義</span><p>跨時代比較，比單獨背誦年代更能理解木乃伊技術與葬具的發展。</p><span class="label">別混淆</span><p>不要由四個格子就說能確定每格器官，也不要假設當時已具有新王國完全相同的神祇配對。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/canopic-chest-of-queen-hetepheres-i" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：一、二：器官保存與木乃伊（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item34"><summary><span class="num">READING STOP 34</span><span class="badge must">必看</span><h3>書吏米特里坐像</h3><div class="meta">Statue of the Scribe Mitri<br>Main Galleries｜GEM 1128｜第五王朝｜彩繪木</div><p class="one">這位古代行政菁英，靠的是讀寫與管理能力。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>米特里盤腿而坐，腿上放半展開的紙莎草，嵌眼石讓目光鮮活。基座列出職銜，包括行政管理、瑪阿特女神祭司與書吏主管。這不是普通抄寫員，而是能將文字轉化為治理權力的人。</p><div class="look"><strong>現場找這三處</strong><p>① 腿上的紙莎草；② 嵌眼；③ 基座的姓名與職銜。</p></div><span class="label">看懂它的意義</span><p>稅收、土地、倉儲、祭品與工程都需要記錄。讀寫能力是國家運作的核心資產。</p><span class="label">別混淆</span><p>不是羅浮宮那尊著名盤腿書吏；木材與GEM 1128是辨識線索。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/statue-of-the-scribe-mitri" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：博物館文物解析主題（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item35"><summary><span class="num">READING STOP 35</span><span class="badge ">精選</span><h3>卡伊與子女合像</h3><div class="meta">Group Statue of Kai and Family<br>Main Galleries｜古王國｜以英文展牌核對</div><p class="one">看女兒抱著父親的腿，親情和身分一起被刻下來。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>館方記錄這組像1992年出土於吉薩G1741。卡伊坐著，兒子站在一側，女兒跪抱父親的腿；文字列出多項祭司、行政與書寫職銜。合像既保存家庭關係，也保存主人的社會資格。</p><div class="look"><strong>現場找這三處</strong><p>① 子女姿態；② 嵌眼；③ 人物大小與身分層級。</p></div><span class="label">看懂它的意義</span><p>與法老被神守護的組像相比，這裡是家庭形成另一種持續存在的網絡。</p><span class="label">別混淆</span><p>不是矮人官員塞涅布一家，也不是拉霍特普與諾芙蕾特夫妻像。</p><div class="sources"><a href="https://gem.eg/en/search?pi=15&amp;query=%D8%A7%D8%A8%D8%AF%D8%A3+%D9%85%D9%86+%D9%87%D9%86%D8%A7" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：三：人物雕像（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item36"><summary><span class="num">READING STOP 36</span><span class="badge ">精選</span><h3>梅塞赫提彩繪面具</h3><div class="meta">Mummy Mask of Mesehti<br>Main Galleries｜GEM 39209｜第十一王朝</div><p class="one">面具不一定是黃金；保護身分的需求卻相同。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>梅塞赫提是阿斯尤特地方長官。面具以cartonnage複合材料製成，彩繪出鬍鬚、眼線、假髮與花紋頭帶。它保護亡者頭部，也提供理想化、可辨識的面貌。</p><div class="look"><strong>現場找這三處</strong><p>① 小鬍子與濃鬍鬚；② 花紋頭帶；③ 材料、顏色與圖坦卡門面具的差別。</p></div><span class="label">看懂它的意義</span><p>死亡與再生信仰並非只屬法老；不同社會地位用不同資源準備來世。</p><span class="label">別混淆</span><p>不要把cartonnage簡化為現代紙板；這是多層材料結合的製作方式。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/mummy-mask-of-mesehti" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：木乃伊等級（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item37"><summary><span class="num">READING STOP 37</span><span class="badge must">必看</span><h3>梅塞赫提外棺</h3><div class="meta">Exterior Coffin of Mesehti<br>Main Galleries｜GEM 9293｜第十一王朝｜木</div><p class="one">棺壁上的眼睛，讓亡者仍能面向世界。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>這位地方長官擁有雙層木棺，反映地位。外棺銘文部分承接《金字塔文》，棺上嵌入wedjat眼；館方認為這可能讓亡者與生者世界保持聯繫。葬具因此不只是密封，而是有選擇地建立通道。</p><div class="look"><strong>現場找這三處</strong><p>① 成對的眼睛；② 橫直行文字；③ 外棺形狀與後來人形棺的不同。</p></div><span class="label">看懂它的意義</span><p>文字曾集中於王室墓葬，後來的使用者與形式逐漸擴展；不能簡單說所有人從此平等。</p><span class="label">別混淆</span><p>對眼睛的具體功能仍有解釋空間，應保留「可能」。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/exterior-coffin-of-mesehti" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：來世、死亡文本（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item38"><summary><span class="num">READING STOP 38</span><span class="badge ">順路</span><h3>梅塞赫提的鏡子、鞋與權杖</h3><div class="meta">Mesehti’s Mirror, Sandals and Sceptre<br>Main Galleries｜同一墓葬群組</div><p class="one">把官員當作會整理儀容、穿鞋出行的人。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>銅鏡、鞋、木杖與其他日用品延續生前生活需要。權杖又能結合身分與象徵權能。觀看同一人的多件葬具，可以避免把每個小物拆成孤立謎語，反而看見一套身體、職位與生活的延續。</p><div class="look"><strong>現場找這三處</strong><p>① 銅鏡原來靠拋光反射；② 鞋子的材料與形狀；③ 普通手杖與象徵性was杖。</p></div><span class="label">看懂它的意義</span><p>來世並不只是抽象靈魂世界，也被想像為仍要行走、生活和維持身分的地方。</p><span class="label">別混淆</span><p>不是現代玻璃背鍍銀鏡；同櫃物件是否同一主人，請依標籤。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/mirror-of-mesehti" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：身體與生活用品（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item39"><summary><span class="num">READING STOP 39</span><span class="badge ">精選</span><h3>阿蒙—拉與圖特摩斯三世合像</h3><div class="meta">Amun-Re and Thutmose III<br>Main Galleries尋找新王國區｜GEM 3781</div><p class="one">看王與神親近的姿勢，也看被破壞之處。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>組像出土於卡納克埋藏坑。王坐在寶座上，一手環繞較小的阿蒙神像，座側有上下埃及統一符號，腳下是代表敵人的九弓。早期研究者將阿蒙像損傷與阿肯那頓時期連結。</p><div class="look"><strong>現場找這三處</strong><p>① 王與神的尺度；② 座側統一圖案；③ 腳下九弓。</p></div><span class="label">看懂它的意義</span><p>圖像中的支配、保護與宗教改革，能在同一件石像上留下不同層次。</p><span class="label">別混淆</span><p>損傷原因是研究判讀，不是每一處缺口都能確定為阿肯那頓下令。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/statue-of-amun-re-and-thutmose-iii" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：阿肯那頓；五：卡納克（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item40"><summary><span class="num">READING STOP 40</span><span class="badge ">精選</span><h3>拉美西斯二世巨型頭像</h3><div class="meta">Colossal Head of Ramesses II<br>Main Galleries｜GEM 2191｜第十九王朝</div><p class="one">看複雜王冠，而不只看一張俊美的臉。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>頭像1888年出土於布巴斯提斯巴斯特神廟。卷髮、日輪、羽毛、角與護衛蛇形成繁複的神聖冠飾；殘存部分顯示它原可能屬持神聖標幟的巨像。</p><div class="look"><strong>現場找這三處</strong><p>① 王冠各層；② 卷髮與額前蛇；③ 殘存標幟。</p></div><span class="label">看懂它的意義</span><p>同一位王有許多不同形象，用於不同神廟和政治宗教情境。</p><span class="label">別混淆</span><p>不要將任何拉美西斯頭像都視為大廳巨像的斷頭；這是另一件。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/colossal-head-of-ramesses-ii" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：六：阿布辛貝、王權（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item41"><summary><span class="num">READING STOP 41</span><span class="badge ">精選</span><h3>奈斯孔蘇彩繪木碑</h3><div class="meta">Stela of Neskhonsu<br>Main Galleries｜晚期段落尋找｜木質彩繪碑</div><p class="one">從王的永生，轉向個人的敬神與被接納。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>圓頂木碑出自代爾巴哈里蒙圖祭司墓區。中央場景將女主人與瑪阿特、拉—荷拉赫提及西方女神連結，展示亡者被神聖秩序接納的願望。木質彩繪使圖像與文字呈現另一種親近尺度。</p><div class="look"><strong>現場找這三處</strong><p>① 人物面向誰；② 舉手禮拜與擁抱；③ 祭桌、色彩及上下分層。</p></div><span class="label">看懂它的意義</span><p>看懂一塊碑可用固定順序：誰、向誰、做什麼、求什麼。</p><span class="label">別混淆</span><p>不要把所有圓頂碑都叫墓碑，或只憑名字相近就認作同一歷史人物。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/stela-of-neskhons" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：瑪阿特與來世審判（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item42"><summary><span class="num">READING STOP 42</span><span class="badge ">精選</span><h3>丹德拉銀女神像</h3><div class="meta">Silver Goddess, Dendera Hoards<br>Main Galleries｜希臘羅馬段落｜銀</div><p class="one">銀色也有神聖價值；神祇身分可能並不唯一。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>這類銀像出自丹德拉神廟附近的奉獻埋藏群。館方對其中女神的身分寫作「可能為伊西斯或哈托爾」。丹德拉的宗教、金工與跨時代延續，在一件小像裡相遇。</p><div class="look"><strong>現場找這三處</strong><p>① 冠飾與姿態；② 銀表面氧化；③ 同組相似像的細微差別。</p></div><span class="label">看懂它的意義</span><p>考古學有時能確定材料與出土脈絡，卻不能百分之百確定神名；這也是可靠導覽該保留的界線。</p><span class="label">別混淆</span><p>不把氧化後深色外觀當作原來的顏色，也不強行選定女神身分。</p><div class="sources"><a href="https://gem.eg/en/collection/artefacts/silver-statue-of-a-goddess-dendera-treasure-hoards" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：四：丹德拉；六：菲萊與伊西斯（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
<details class="card" id="gem-item43"><summary><span class="num">READING STOP 43</span><span class="badge ">精選</span><h3>沙布提與沙布提盒</h3><div class="meta">Shabtis and Shabti Boxes<br>Main Galleries｜類型導讀，依主人姓名區分</div><p class="one">這些小人是替亡者應召勞動的「回應者」。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>沙布提常持農具，部分刻有與《亡靈書》第六章相關的文字，要求小像在主人被召去耕作或搬運時代替出工。盒子負責存放這組來世勞動者；不同年代、主人與階級，數量和配置都不同。</p><div class="look"><strong>現場找這三處</strong><p>① 手中工具；② 身上文字；③ 工作者與監督者的形象差異。</p></div><span class="label">看懂它的意義</span><p>古埃及理想來世仍和糧食、生產及土地連結，永生也需要持續供應。</p><span class="label">別混淆</span><p>不是陪葬活人的證據，也不是墓中每人固定365尊。外部參考館藏只用於解釋功能，不代表那件原物在GEM。</p><div class="sources"><a href="https://www.metmuseum.org/art/collection/search/544763" target="_blank" rel="noopener">核對來源 ↗</a><br>影片對照：二：來世；五：塞提一世（完整字幕已讀取，摘要與勘誤見影片章節）。館方收藏頁確認館藏歸屬，不能保證此刻未暫移修復。</div></div></details>
</div>
<div class="objectgroup" id="gem-video-objects"><h2>06 · 影片補充器物辨識卡</h2><p class="groupnote">圖坦卡門段落優先選讀；心臟聖甲蟲與棋具可在主展廳遇到同類時使用。這12張依字幕補足，未獨立核實今日單件位置；不要為尋找它們打亂主線。前三張分開解說三種獸形床，後面部分為器物類型。</p>
<details class="card" id="gem-item44"><summary><span class="num">READING STOP 44</span><span class="badge">補充／位置待核</span><h3>獅形儀式床</h3><div class="meta">Lion-shaped ritual couch</div><p class="one">獅形支架把家具轉化為葬禮中的守護者。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>這不是只供休息的床。獸形外框與抬高的承托面，把國王的身體放進神聖保護空間。獅子的力量與地平線、日夜交界的聯想，使它適合重生的儀式脈絡。</p><div class="look"><strong>現場怎麼看</strong><p>看頭尾方向、獅爪與身體承托面的接合；不要只看金色表層。</p></div><span class="label">別混淆</span><p>與日常睡床分開；具體神名請以展牌為準，不把所有獅形物都叫同一位神。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=FQky_vEc36U">原影片</a>；<a href="#gem-v-FQky_vEc36U">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item45"><summary><span class="num">READING STOP 45</span><span class="badge">補充／位置待核</span><h3>牛形儀式床</h3><div class="meta">Bovine ritual couch</div><p class="one">牛形將承托身體與天界、母性及再生聯繫。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>古埃及牛形女神的形象可指向天穹、養育與太陽再生。這類器物讓葬禮中的國王被置於宇宙秩序之內；家具本身也能成為宗教圖像。</p><div class="look"><strong>現場怎麼看</strong><p>看牛角、耳、軀幹及床框是否由不同結構組合；比較另外兩床的動物形態。</p></div><span class="label">別混淆</span><p>不要看到牛就一律認作哈索爾；本組的神學身分需結合銘文核對。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=FQky_vEc36U">原影片</a>；<a href="#gem-v-FQky_vEc36U">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item46"><summary><span class="num">READING STOP 46</span><span class="badge">補充／位置待核</span><h3>複合獸形儀式床</h3><div class="meta">Composite-animal ritual couch</div><p class="one">看似奇異的複合身體，是集合保護力量的方法。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>圖坦卡門墓中的第三類獸形床結合不同動物特徵。解讀重點不在它能否真實存在，而在每一個身體部位如何表達力量與守護，並與死者的轉變相連。</p><div class="look"><strong>現場怎麼看</strong><p>分別辨頭、腿、背與尾；與牛形、獅形兩床比較。</p></div><span class="label">別混淆</span><p>不能只因河馬外觀就確定是塞特或塔沃瑞特；各圖像的名稱不宜互換。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=FQky_vEc36U">原影片</a>；<a href="#gem-v-FQky_vEc36U">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item47"><summary><span class="num">READING STOP 47</span><span class="badge">補充／位置待核</span><h3>小金神龕：王與王后的互動</h3><div class="meta">Small golden shrine</div><p class="one">親密的王室形象，也服務於王權與再生。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>木質神龕外覆金片，門扉與側面呈現國王、王后互動，包括狩獵及照料等場景。把神龕當成一個小建築看：外層圖像、門與內部原本各有功能。影片以「黃金情書」形容其情感氣氛。</p><div class="look"><strong>現場怎麼看</strong><p>看人物手勢、兩人相對位置及王名圈，再看底部滑橇狀構件。</p></div><span class="label">別混淆</span><p>這件與金寶座不同；浪漫比喻不能證明每一幕都是實際發生的私人事件。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=FQky_vEc36U">原影片</a>；<a href="#gem-v-FQky_vEc36U">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item48"><summary><span class="num">READING STOP 48</span><span class="badge">補充／位置待核</span><h3>透光石燈</h3><div class="meta">Translucent calcite lamp</div><p class="one">材質與照明一起，改變圖像如何被看見。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>方解石可讓光透過；影片介紹的燈具把器形、王室圖像及象徵長久的元素結合。觀看時想像古代光源與今天展示照明的差別，比單純欣賞「神奇透明」更有意思。</p><div class="look"><strong>現場怎麼看</strong><p>看石壁厚薄與透光、兩側支架和隱約圖像；依現場燈光觀察。</p></div><span class="label">別混淆</span><p>勿自行用強光照射或碰觸；若展場未展示透光效果，不保證可看到影片相同景象。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=FQky_vEc36U">原影片</a>；<a href="#gem-v-FQky_vEc36U">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item49"><summary><span class="num">READING STOP 49</span><span class="badge">補充／位置待核</span><h3>短柄象牙羽扇</h3><div class="meta">Ivory-handled fan</div><p class="one">柔軟羽毛與堅硬扇柄，留下不同的保存命運。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>影片把短柄羽扇與其他長柄儀仗扇並列。扇既有降溫用途，也可與侍奉國王及清新氣息相連；易腐羽毛的存留，使這類器物有別於只剩扇柄的作品。</p><div class="look"><strong>現場怎麼看</strong><p>看扇柄彎曲處、羽毛固定區與現代支撐；比較長柄鴕鳥狩獵扇。</p></div><span class="label">別混淆</span><p>不要與GEM 284長柄狩獵扇混為一件；今日羽毛保存及展出狀態依展牌。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=FQky_vEc36U">原影片</a>；<a href="#gem-v-FQky_vEc36U">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item50"><summary><span class="num">READING STOP 50</span><span class="badge">補充／位置待核</span><h3>彩繪木箱：戰鬥與狩獵</h3><div class="meta">Painted chest</div><p class="one">畫面中的勝利，是國王恢復秩序的宣告。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>箱面將戰鬥、狩獵及王的強大形象安排在不同區域。比較國王、馬匹、獵物與敵人的尺度，能看出畫面如何把君王置於視覺中心。可與梅迪涅特哈布及阿布辛貝的王權宣傳互讀。</p><div class="look"><strong>現場怎麼看</strong><p>找弓的方向、車輪下方與邊框；比較整齊的王與混亂的敵人。</p></div><span class="label">別混淆</span><p>不能因戰鬥畫面就斷定圖坦卡門親自參戰；木箱與金寶座是不同作品。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=FQky_vEc36U">原影片</a>；<a href="#gem-v-FQky_vEc36U">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item51"><summary><span class="num">READING STOP 51</span><span class="badge">補充／位置待核</span><h3>弓與箭筒</h3><div class="meta">Bows and quivers</div><p class="one">同一套武器，兼具技術、身分與圖像意義。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>弓的形態、不同材料的結合及箭筒裝飾，提供新王國武器與工藝線索。裝飾可以講國王的狩獵或征服理想，實用部件則讓人思考張力、重量及攜帶。</p><div class="look"><strong>現場怎麼看</strong><p>比較弓身曲線與接合、弓弦是否留存、箭筒外壁人物。</p></div><span class="label">別混淆</span><p>這是群組辨識卡；不把每一件都說成同一材質、同一用途或有實戰使用證據。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=F4vhITtJonQ">原影片</a>；<a href="#gem-v-F4vhITtJonQ">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item52"><summary><span class="num">READING STOP 52</span><span class="badge">補充／位置待核</span><h3>鐮形刀／彎刃劍</h3><div class="meta">Khopesh</div><p class="one">輪廓比名稱更容易記：短柄連接外彎刀身。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>這種武器在新王國軍事形象中很醒目。與直匕首相比，它把持握部與彎曲刃部區分得更清楚；王或神持武器的圖像，也可以表達授予勝利。</p><div class="look"><strong>現場怎麼看</strong><p>先看刃口在哪一側，再看刀身彎曲與手柄連接。</p></div><span class="label">別混淆</span><p>不要與隕鐵直匕首混稱；材料與是否開刃以該件展牌為準。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=F4vhITtJonQ">原影片</a>；<a href="#gem-v-F4vhITtJonQ">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item53"><summary><span class="num">READING STOP 53</span><span class="badge">補充／位置待核</span><h3>實心與鏤空盾牌</h3><div class="meta">Shields</div><p class="one">能擋住攻擊的形制，與呈現勝利的形制不完全相同。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>影片比較覆皮實心盾及帶有王、獅子或獅身人面形象的鏤空盾。實心面提供防護，鏤空圖像則讓力量與征服成為主題；以此理解實用器與儀式器的差異。</p><div class="look"><strong>現場怎麼看</strong><p>看盾緣、背部握持方式與正面圖像；比較孔洞對防護的影響。</p></div><span class="label">別混淆</span><p>片中討論的數量不等於墓中或今日展場所有盾牌的總數。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=F4vhITtJonQ">原影片</a>；<a href="#gem-v-F4vhITtJonQ">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item54"><summary><span class="num">READING STOP 54</span><span class="badge">補充／位置待核</span><h3>心臟聖甲蟲</h3><div class="meta">Heart scarab</div><p class="one">護符要保護的，也包括死者在審判中如何被評斷。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>某些較大型聖甲蟲與心臟及死後審判相關，銘文常連結《亡靈書》第30B章，希望心不要作出不利於主人的證言。它與一般小型印章聖甲蟲的用途不能一概而論。</p><div class="look"><strong>現場怎麼看</strong><p>看尺寸、平底銘文與穿孔；有標籤時核對是否明稱heart scarab。</p></div><span class="label">別混淆</span><p>此為類型解讀，未核實今日特定展櫃；不是所有甲蟲護符都刻同一咒文。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=_dhikVgc4HU">原影片</a>；<a href="#gem-v-_dhikVgc4HU">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
<details class="card" id="gem-item55"><summary><span class="num">READING STOP 55</span><span class="badge">補充／位置待核</span><h3>塞尼特棋</h3><div class="meta">Senet</div><p class="one">棋盤可以屬於娛樂，也能在墓葬圖像中連結死後旅程。</p></summary><div class="cardbody"><span class="label">它的故事</span><p>影片以妮菲塔莉墓的下棋場面，連接死後的行動能力與命運。若在館內遇棋具，先把棋盤、棋子與投擲用具分開觀察，再思考日常遊戲如何被帶進葬禮。</p><div class="look"><strong>現場怎麼看</strong><p>找三列十格的盤面、特殊格與兩組棋子；核對是否為塞尼特。</p></div><span class="label">別混淆</span><p>墓室下棋圖仍在QV66；古代完整規則沒有單一確定重建，本卡不冒充當日已定位單件。</p><div class="sources">字幕來源：<a href="https://www.youtube.com/watch?v=moeqWksJ6aU">原影片</a>；<a href="#gem-v-moeqWksJ6aU">本片摘要與限制</a>。圖坦卡門物件可另查<a href="https://tutankhamun.griffith.ox.ac.uk/">Griffith考古檔案</a>。</div></div></details>
</div></section>
<section id="gem-videos"><h2>30支影片：內容整合與今天怎麼用</h2><p>每支均讀取完整文字轉錄。以下為原創精簡整理，不是逐字稿，也沒有虛構時間碼。片名是本導覽的主題簡稱；點連結可回原片。器物細節請搭配前面的55張閱讀卡。<strong>這些影片提供跨古埃及背景，並非每支都在GEM拍攝。</strong></p><div class="panel"><h3>排除的三支</h3><p><a href="https://www.youtube.com/watch?v=zhTc-kUgjyI">孔翁坡神廟</a>：偏重外地神廟；<a href="https://www.youtube.com/watch?v=ESEBoeIyqL0">菲萊神廟</a>：偏重阿斯旺行程；<a href="https://www.youtube.com/watch?v=fPZqvyPOHoQ">夜間金字塔</a>：偏重另一時段的景點體驗。三者對今日GEM器物辨識的新增幫助較少，僅排除本次整理，未刪除任何YouTube內容。</p></div>
<article class="panel" id="gem-v-m4bgPb4u70s"><div class="kicker">VIDEO 01 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=m4bgPb4u70s" target="_blank" rel="noopener">圖坦卡門墓與死亡疑雲 ↗</a></h3><p>以KV62壁畫、開口儀式及王后相關故事串起王室葬禮；觀看重點是死者如何被接入神的世界。</p><p><strong>今天怎麼用：</strong>對照守護像、棺槨與面具；墓室壁畫仍在盧克索。</p><p class="muted"><strong>核對／保留：</strong>謀殺、強迫婚姻及某人放置護符的情節，不能當作已證實的死因與現場紀錄。</p></article>
<article class="panel" id="gem-v-LnwZT_2dLMU"><div class="kicker">VIDEO 02 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=LnwZT_2dLMU" target="_blank" rel="noopener">四重神龕、三重棺與黃金面具 ↗</a></h3><p>由外到內拆解葬具：四重鍍金神龕、石棺、三重人形棺、木乃伊與面具；反覆出現的翅膀、眼鏡蛇與護符構成多層守護。</p><p><strong>今天怎麼用：</strong>先記套層關係，再比較木質鍍金、金屬、玻璃鑲嵌；面具不只是肖像。</p><p class="muted"><strong>核對／保留：</strong>石棺為石英岩；官方資料記內棺金重110.4公斤。影片重量與一生僅戴兩次頭巾的說法不採用。</p></article>
<article class="panel" id="gem-v-FQky_vEc36U"><div class="kicker">VIDEO 03 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=FQky_vEc36U" target="_blank" rel="noopener">內臟葬具、寶座與王室生活 ↗</a></h3><p>連接內臟神龕、獸形儀式床、金寶座、小金神龕、透光燈、羽扇及彩繪箱；器物把王室生活與死後重生編在一起。</p><p><strong>今天怎麼用：</strong>看四位女神伸臂、寶座上的阿頓光線、神龕夫妻互動，分辨日用品與儀式器。</p><p class="muted"><strong>核對／保留：</strong>影片所稱黃金情書主要指小金神龕，不應直接等同金寶座；親密圖像不等於婚姻生活的完整實錄。</p></article>
<article class="panel" id="gem-v-O9g_PiLArXM"><div class="kicker">VIDEO 04 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=O9g_PiLArXM" target="_blank" rel="noopener">太陽在冥界的十二小時 ↗</a></h3><p>講述太陽入夜、穿越冥界、與奧西里斯連結、戰勝阿波菲斯，再以新生太陽出現；重點是循環更新。</p><p><strong>今天怎麼用：</strong>棺槨上的船、蛇、聖甲蟲與守門神都可放回這個架構理解。</p><p class="muted"><strong>核對／保留：</strong>《冥界書》與《亡靈書》不是同一本；不同時代文本不能硬套成唯一固定劇本。</p></article>
<article class="panel" id="gem-v-F4vhITtJonQ"><div class="kicker">VIDEO 05 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=F4vhITtJonQ" target="_blank" rel="noopener">戰車、弓、匕首與盾牌 ↗</a></h3><p>以輕巧戰車、弓箭、箭筒、隕鐵匕首、彎刀及盾牌說明國王的軍事形象，並比較實用裝備與象徵性裝飾。</p><p><strong>今天怎麼用：</strong>找被束縛敵人、獅子與獅身人面形象；反覆問「實戰工具，還是征服圖像？」</p><p class="muted"><strong>核對／保留：</strong>有武器不證明少年國王親自指揮戰役；圖坦卡門墓有皮革甲記錄，不能推論埃及沒有盔甲。</p></article>
<article class="panel" id="gem-v-_dhikVgc4HU"><div class="kicker">VIDEO 06 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=_dhikVgc4HU" target="_blank" rel="noopener">死後審判、心臟與靈魂 ↗</a></h3><p>串起生命力量、可活動的靈魂、稱心審判、否定告白、心臟聖甲蟲與沙布提，說明身分如何延續。</p><p><strong>今天怎麼用：</strong>看護符和替身俑時，想像它們分別負責保護、發聲與勞役。</p><p class="muted"><strong>核對／保留：</strong>Akh不是善良情緒，影子也不是邪惡情緒；沙布提數量不是所有人固定402尊。</p></article>
<article class="panel" id="gem-v-84kket7ELHk"><div class="kicker">VIDEO 07 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=84kket7ELHk" target="_blank" rel="noopener">法老五名與王權標誌 ↗</a></h3><p>從荷魯斯名、兩女神名、金荷魯斯名、登基名與出生名解讀法老身分，再辨王冠、王名圈與權杖。</p><p><strong>今天怎麼用：</strong>巨像、方尖碑、金寶座、棺具都能找王名；用同一位王在不同器物上的名字建立連結。</p><p class="muted"><strong>核對／保留：</strong>Nebkheperure是圖坦卡門的登基名；Tutankhamun是出生名形式，意為阿蒙的活形象。字幕中的兩者不可照抄。</p></article>
<article class="panel" id="gem-v-vA9jXRyziDA"><div class="kicker">VIDEO 08 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=vA9jXRyziDA" target="_blank" rel="noopener">木乃伊與葬禮 ↗</a></h3><p>以奧西里斯神話引入身體保存、包裹、護符與開口儀式，核心是讓死者能重新活動及接受供養。</p><p><strong>今天怎麼用：</strong>對照內臟器、面具和人形棺；今日重點看葬具，皇家木乃伊群在NMEC。</p><p class="muted"><strong>核對／保留：</strong>防腐程序會隨年代與資源而異；電影酷刑、詛咒及現代醫療推想不能當作古代證據。</p></article>
<article class="panel" id="gem-v-lXPFs72m0gg"><div class="kicker">VIDEO 09 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=lXPFs72m0gg" target="_blank" rel="noopener">阿肯那頓與阿瑪爾納改革 ↗</a></h3><p>介紹阿頓、遷都、新的王室藝術形象，以及圖坦卡門時期回復傳統宗教的背景。</p><p><strong>今天怎麼用：</strong>金寶座上伸出小手的太陽光線，是觀察宗教變動最直觀的線索。</p><p class="muted"><strong>核對／保留：</strong>不能用風格化雕像診斷國王患特定疾病；改革的受眾、排他程度及實際宗教生活需要細分。</p></article>
<article class="panel" id="gem-v-6t7tzba0aJA"><div class="kicker">VIDEO 10 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=6t7tzba0aJA" target="_blank" rel="noopener">醫療、魔法與護符 ↗</a></h3><p>介紹醫學紙草及生命、穩固、完好等符號，呈現古埃及人如何把實際照護、文字與神力並用。</p><p><strong>今天怎麼用：</strong>護符不是隨意裝飾；找材質、佩戴位置與銘文，理解其預期保護功能。</p><p class="muted"><strong>核對／保留：</strong>影片提到的醫學紙草不因此成為GEM展品；古代處方也不是現代治療建議。</p></article>
<article class="panel" id="gem-v-9rvdy8lHAFM"><div class="kicker">VIDEO 11 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=9rvdy8lHAFM" target="_blank" rel="noopener">四種創世傳統與眾神 ↗</a></h3><p>比較赫利奧波利斯、孟菲斯、赫爾摩波利斯與底比斯的神學，指出眾神會融合，也有地方脈絡。</p><p><strong>今天怎麼用：</strong>在雕像群中辨阿蒙、卜塔、塞赫麥特；看到不同創世故事不用急著選唯一正解。</p><p class="muted"><strong>核對／保留：</strong>神的身分要綜合銘文、姿態、冠飾及脈絡，不能只憑動物頭或單一冠形。</p></article>
<article class="panel" id="gem-v-UrjlnaImJg0"><div class="kicker">VIDEO 12 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=UrjlnaImJg0" target="_blank" rel="noopener">階梯金字塔與墓葬空間 ↗</a></h3><p>由馬斯塔巴、左塞爾與伊姆霍特普談大型石造建築，並介紹塞爾達布密室、假門及供養觀念。</p><p><strong>今天怎麼用：</strong>把主展廳的雕像、供桌與墓葬器物想成原本有功能的空間組件。</p><p class="muted"><strong>核對／保留：</strong>薩卡拉不在今天路線；石工精度不能直接支持異次元或沒有金屬工具的說法。</p></article>
<article class="panel" id="gem-v-Bm-UtovQ2HQ"><div class="kicker">VIDEO 13 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=Bm-UtovQ2HQ" target="_blank" rel="noopener">金字塔群與建造 ↗</a></h3><p>連接斯尼夫魯、吉薩三王、谷廟、堤道及獅身人面像，讓金字塔成為完整的王室葬祭系統。</p><p><strong>今天怎麼用：</strong>船館與大階梯眺望窗配合閱讀；船不是孤立珍寶，而是金字塔景觀的一部分。</p><p class="muted"><strong>核對／保留：</strong>不存在「完全沒有建造記錄」的前提；梅勒紙草提供胡夫時代運石證據。極端精度數字需另有測量依據。</p></article>
<article class="panel" id="gem-v-bj4eAr84BTI"><div class="kicker">VIDEO 14 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=bj4eAr84BTI" target="_blank" rel="noopener">GEM建築與博物館沿革 ↗</a></h3><p>從埃及博物館發展談GEM建築、與金字塔的視線關係、懸空方尖碑及大廳巨像。</p><p><strong>今天怎麼用：</strong>入口用20分鐘讀空間；到大階梯上端再看建築如何把古代景觀納入參觀。</p><p class="muted"><strong>核對／保留：</strong>影片製作時的開幕預期、票務及展示數量不沿用；今日規則以官方票務為準。</p></article>
<article class="panel" id="gem-v-g5Bry_ff9oE"><div class="kicker">VIDEO 15 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=g5Bry_ff9oE" target="_blank" rel="noopener">博物館名物：先分清館址 ↗</a></h3><p>談胡夫船、卡夫拉坐像、書吏、納爾邁調色板、胡夫小像、拉霍特普夫婦、梅杜姆鵝、霍爾卡像、水鐘及羅塞塔石碑。</p><p><strong>今天怎麼用：</strong>胡夫船接本日路線；其餘名物見下方「跨館辨識」，不要照影片名單全館找。</p><p class="muted"><strong>核對／保留：</strong>舊埃博、GEM與外國博物館分開；影片中的羅塞塔石碑為複製品，原件在大英博物館。</p></article>
<article class="panel" id="gem-v-xboSjqiBcUQ"><div class="kicker">VIDEO 16 · 已讀完整轉錄</div><h3><a href="https://www.youtube.com/watch?v=xboSjqiBcUQ" target="_blank" rel="noopener">阿匹斯聖牛與塞拉皮翁 ↗</a></h3><p>以聖牛的選定、祭祀、葬禮及巨大石棺，呈現動物如何成為神在世間的具體形象。</p><p><strong>今天怎麼用：</strong>遇動物神像與石棺，先問其宗教角色，別把動物崇拜理解成單純喜愛動物。</p><p class="muted"><strong>核對／保留：</strong>地點是薩卡拉；超高精度、真空或現代機器才做得到的敘事，不能替代考古測量。</p></article>

<section id="gem-corrections"><h2>讀影片時，保留這些重要修正</h2><p>作者用故事提高可讀性，但導覽需要把可核實資料、宗教觀念和推測分開。以下不是否定影片的啟發，而是避免把比喻帶成現場知識。</p><div class="tablewrap"><table><tr><th>主題</th><th>本導覽採用</th></tr>
<tr><td>名字</td><td>圖坦卡門的登基名是Nebkheperure；Tutankhamun意為阿蒙的活形象。 <a href="https://www.metmuseum.org/art/collection/search/549200">來源</a></td></tr>
<tr><td>葬具</td><td>石棺為石英岩；三重人形棺中的最內棺用金110.4公斤，外層並非都為純金。 <a href="https://egymonuments.gov.eg/en/news/gilded-coffin-of-king-tutankhamun/">來源</a></td></tr>
<tr><td>面具</td><td>以館方材料與護身銘文說明為準；不採用影片的11.5公斤數字。 <a href="https://gem.eg/en/collection/artefacts/the-golden-burial-mask-of-tutankhamun">來源</a></td></tr>
<tr><td>盔甲</td><td>圖坦卡門墓有皮革甲記錄（Carter 587a）；不能由影片推成埃及沒有盔甲。 <a href="https://www.griffith.ox.ac.uk/perl/gi-ca-qmakedeta.pl?dfnam=408&qno=1&sid=587a-c587a-2">來源</a></td></tr>
<tr><td>金字塔</td><td>梅勒紙草涉及胡夫時代運輸；建造研究有文獻和考古線索，不是完全沒有記錄。 <a href="https://aeraweb.org/">來源</a></td></tr>
<tr><td>王后與女王</td><td>哈特謝普蘇特以國王制度的服飾表達統治權；不能由男裝推論她隱瞞性別，也不是唯一女法老。 <a href="https://gem.eg/en/collection/artefacts/statue-of-queen-hatshepsut">來源</a></td></tr>
<tr><td>靈魂</td><td>Ka、Ba、Akh是不同但互相關聯的存在面向，不可簡化成善惡情緒。 <a href="https://book-of-the-dead.fitzmuseum.cam.ac.uk/explore/book-of-the-dead/the-soul-in-ancient-egypt">來源</a></td></tr>
<tr><td>圖像不是病歷或戰報</td><td>風格化王像不能單獨診斷遺傳病；擊敵與狩獵畫面不能單獨證明圖坦卡門參戰。 <a href="https://tutankhamun.griffith.ox.ac.uk/">來源</a></td></tr>
</table></div><div class="panel"><h3>一句話讀懂死後世界</h3><p>身體保存讓身分有依託；名字讓人持續被辨識；供物維持存在；護符與文本提供保護；審判關乎秩序；太陽每天重生，使死亡可以被想像成轉變。</p><h3>十二夜時的閱讀速記</h3><p>入夜 → 穿越冥界地域 → 深夜與奧西里斯相連 → 制伏混亂 → 預備新生 → 黎明以太陽再現。影片逐時解說可當故事索引，現場先掌握這條循環，不必背下所有神名。蛇可能守護、更新，也可能代表威脅，須看文字與場景。</p></div></section><section id="gem-crossmuseum"><h2>跨館辨識：影片提到，卻不能照單在GEM找</h2><p>以下承接「博物館名物」一片。館藏歸屬與即時展出不是同一件事；未確認者直接標示，避免浪費現場時間。</p>
<article class="panel"><h3>卡夫拉坐像（著名鷹神護首像）</h3><p class="kicker">解放廣場埃及博物館</p><p>從正面看王的穩定姿勢，再從側面辨荷魯斯護住頭部，理解王與神的結合。不要把GEM其他卡夫拉藏品與這尊混為一件。</p><a class="sources" href="https://egyptianmuseumcairo.eg/artefacts/statue-of-khafre/">核對來源</a></article>
<article class="panel"><h3>納爾邁調色板</h3><p class="kicker">解放廣場埃及博物館</p><p>雙面圖像把王冠、擊敵與秩序連在一起。它是具有儀式意義的物件；不能把每一幅都視為統一過程的攝影式紀錄。</p><a class="sources" href="https://egymonuments.gov.eg/collections/narmer-palette-1/">核對來源</a></article>
<article class="panel"><h3>胡夫象牙小像</h3><p class="kicker">解放廣場埃及博物館</p><p>巨大金字塔與小型王像形成尺度反差；小不等於不重要。辨坐姿、王冠與座側銘文，不要與船館的胡夫工程混作同一展區。</p><a class="sources" href="https://egymonuments.gov.eg/en/museums/egyptian-museum/">核對來源</a></article>
<article class="panel"><h3>拉霍特普與諾芙列特坐像</h3><p class="kicker">解放廣場埃及博物館</p><p>看白色座椅、膚色處理、髮式與鑲嵌眼睛。眼睛材料包括水晶、方解石與銅，不能據此宣稱發明玻璃。</p><a class="sources" href="https://egyptianmuseumcairo.eg/artefacts/rahotep-and-nofret/">核對來源</a></article>
<article class="panel"><h3>梅杜姆群鵝壁畫</h3><p class="kicker">解放廣場埃及博物館</p><p>辨鳥的方向、羽色及整體排列；它原屬墓室裝飾，放回供養與自然資源的語境。不要憑顏料外觀宣稱最早蛋彩。</p><a class="sources" href="https://egyptianmuseumcairo.eg/artefacts/meidum-geese/">核對來源</a></article>
<article class="panel"><h3>霍爾一世的卡像</h3><p class="kicker">館藏資料列開羅舊埃博；未另核實即時展出</p><p>頭上高舉雙臂的符號指向Ka；它是理解生命力量及替代身體的重要作品，不是情緒化的「善靈」圖像。</p><a class="sources" href="https://www.globalegyptianmuseum.org/detail.aspx?id=14835">核對來源</a></article>
<article class="panel"><h3>影片中的書吏像</h3><p class="kicker">字幕不足以唯一辨識，當日所在地未確認</p><p>重點看盤坐、腹部、書寫姿態與專注目光。不能把片中200鎊紙鈔所指作品自動認成GEM米特里、開羅另一位書吏或羅浮宮書吏。</p><a class="sources" href="https://www.youtube.com/watch?v=g5Bry_ff9oE">核對來源</a></article>
<article class="panel"><h3>阿蒙霍特普三世水鐘</h3><p class="kicker">今日館址與展櫃未獨立確認</p><p>器內刻度配合水流測時，不同月份可有不同刻度安排。它把時間、天文及神廟作息連起來；在本日路線只作背景知識。</p><a class="sources" href="https://www.youtube.com/watch?v=g5Bry_ff9oE">核對來源</a></article>
<article class="panel"><h3>羅塞塔石碑</h3><p class="kicker">原件在倫敦大英博物館；影片提到複製品</p><p>關鍵是兩種語言、三種文字：埃及語以聖書體和世俗體書寫，另有希臘文。可比較同一法令的文字版本，不是三種不同語言。</p><a class="sources" href="https://www.britishmuseum.org/collection/object/Y_EA24">核對來源</a></article>
<div class="notice"><strong>其他原址內容</strong><p>KV62、KV34、KV17、KV11與QV66墓壁；薩卡拉階梯金字塔及塞拉皮翁；阿拜多斯、丹德拉、卡納克、盧克索、代爾巴哈里、梅迪涅特哈布、艾德夫及阿布辛貝神廟，全部當作理解GEM器物的背景，沒有安排為館內停靠點。主展廳看到移入的構件時，仍須逐件核對標籤。</p></div></section><section id="gem-limits"><h2>現場使用與資料界線</h2><div class="grid"><div class="panel"><h3>入場前確認</h3><ul class="checklist"><li>票上日期與14:00入場窗口、姓名。</li><li>若買平台導覽，確認集合點與是否先換票。</li><li>大包超過40×40公分須依規定寄放。</li><li>下載本檔、票券截圖、帶行動電源。</li><li>13點前先吃午餐，晚餐留館內。</li></ul></div><div class="panel"><h3>館內規則</h3><ul class="checklist"><li>一般可私人攝影，圖坦卡門指定區例外。</li><li>禁止閃光、腳架、自拍棒與直播。</li><li>官方條款原則禁止外食飲料入園；展廳條款另容許小水瓶，入園水瓶規定請現場確認。</li><li>離開整個園區後不得再次入場。</li><li>園區22:00關閉不代表展廳也開到22:00。</li></ul></div></div>
<div class="notice"><strong>不要跨館找錯地方</strong><p>GEM（吉薩新館）、解放廣場 Egyptian Museum（舊埃博）、NMEC（文明博物館）是不同機構。皇家木乃伊群不是本日GEM路線；圖坦卡門墓KV62與原址壁畫在盧克索帝王谷。影片裡的神殿、王陵或舊館名物，不因為影片討論它，就代表今天可在GEM找到。</p></div>
<div class="panel"><h3>事實、解釋、未知，分開讀</h3><p><strong>可核實：</strong>館藏名稱、部分GEM號、出土脈絡、材料、官方開放時間。<strong>導覽解釋：</strong>如何用眼睛觀察、跨時代比較、用哪些問題理解物件。<strong>仍未知：</strong>今天個別展櫃的位置與臨時撤展、船館獨立截止時間、即時排隊長度、影片中未被口述辨識的背景物件、沒有時間碼的段落位置。</p><p>「謀殺疑雲」、「異次元」、「第一個」、「黃金情書」等影片標題，不自動成為歷史結論。宗教文本與神話是古人的世界觀，不應當作現代科學或醫療事實。圖坦卡門的確切死亡原因、某些器物的原主人與轉用問題，需按個別研究保留不確定性。</p></div>
<h3 style="margin-top:32px">主要參考與核對順序</h3><ol class="checklist"><li><a href="https://tickets.gem.eg/">GEM官方票務與參觀條款</a>：今日時間、票券涵蓋、拍照與單次入場規則。</li><li><a href="https://gem.eg/en/collection/">GEM官方館藏</a>：每張文物卡的來源連結；官方館藏編號不是展櫃位置。</li><li><a href="https://gem.eg/collection/main-galleries/">GEM主展廳</a>與<a href="https://gem.eg/collection/khufus-boats-museum/">胡夫船館</a>：主題與船的背景。</li><li><a href="https://www.experienceegypt.eg/en/attraction-details/346/the-grand-egyptian-museum-gem">埃及旅遊部門介紹</a>：大廳與館區背景；其舊營業時間與部分年代未採用，時間以當前票務頁為準。</li><li><a href="https://tutankhamun.griffith.ox.ac.uk/">牛津大學 Griffith Institute 圖坦卡門考古檔案</a>：出土記錄與戰車資料。</li><li><a href="https://onlinelibrary.wiley.com/doi/10.1111/maps.13787">Matsui等，2022，隕鐵匕首研究</a>及<a href="https://onlinelibrary.wiley.com/doi/full/10.1111/maps.12664">Comelli等，2016</a>：區分材料分析與推論。</li><li><a href="https://www.metmuseum.org/art/collection/search/544763">Met沙布提解說</a>：一般宗教功能，並非把紐約藏品列為GEM展品。</li><li><a href="https://book-of-the-dead.fitzmuseum.cam.ac.uk/explore/book-of-the-dead/the-soul-in-ancient-egypt">劍橋Fitzwilliam Museum：古埃及的靈魂觀</a>與<a href="https://egyptianmuseumcairo.eg/artefacts/funerary-papyrus-part-of-the-book-of-the-dead/">埃及博物館：稱心審判圖像</a>：入門知識的宗教背景。</li><li>史噹瑪克7份播放清單：去重33支，選取30支完整文字轉錄，2026-10-14取得；每支附原片連結、應用與保留事項。3支排除名單見影片章節。未提供時間碼，不偽造影片段落定位。</li></ol>
<div class="end"><p class="lead">今天最值得記住的，不是黃金有多少，<br>而是人如何用物件保存身分、秩序與希望。</p><p><a href="#gem-top">回到封面 ↑</a></p><footer>GEM 中文隨身導覽 · 2026-10-14 · 為14:00–21:00參觀規劃。獨立整理，非館方官方導覽。正文可離線使用；請尊重現場動線、展品保護與攝影限制。</footer></div></section></main>
