/* Compact, persistent R & A navigation. */
:root{--sitebar-height:100px}
#sitebar{position:sticky;top:0;z-index:25;flex-direction:column;align-items:flex-start;gap:0;padding:7px max(20px,calc((100vw - 1180px)/2)) 5px}
.brand{min-height:35px;gap:0}.brand-mark{font:italic 25px/1.2 Georgia,serif;border:0;padding:0;letter-spacing:1px}
.top-actions{display:flex;flex-wrap:wrap;gap:6px 24px}.top-actions a{font-size:14px;min-height:40px;padding:6px 0;display:flex;align-items:center}
#app-main>.searchform:first-child{margin-top:0}.trip-toolbar{top:var(--sitebar-height);z-index:15}
html{scroll-padding-top:calc(var(--sitebar-height) + 155px)}
.legacy section,.legacy .guide-card,.legacy .slot{scroll-margin-top:calc(var(--sitebar-height) + 155px)}
@media(max-width:760px){#sitebar{padding:6px 16px 4px}.brand-mark{font-size:24px}.top-actions{gap:4px 22px}#app-main{padding-top:20px}.country-card h3{font-size:24px}}

/* Quiet country labels; search lives beside travel tools. */
.country-heading{margin-top:0;margin-bottom:16px;flex-wrap:wrap;gap:6px 16px}
.country-heading h2{font-size:18px;font-weight:650;letter-spacing:0}
.country-code{font:600 14px/1.4 system-ui,sans-serif;letter-spacing:1.5px;color:var(--muted)}
.country-top{margin-bottom:16px}
.country-card{min-height:245px}
@media(max-width:760px){.country-card{min-height:235px}.top-actions{column-gap:20px}.country-heading h2{font-size:18px}}

/* Small, stable itinerary controls in both reading sizes. */
.trip-toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:8px 0;margin-bottom:16px;align-items:center}
.trip-toolbar select{width:100%;min-width:0;max-width:none;height:40px;min-height:40px;font-size:16px;line-height:1.25;padding:7px 10px;border-radius:7px;text-overflow:ellipsis}
.trip-toolbar button{min-height:40px;height:40px;font-size:14px;line-height:1.25;padding:7px 11px;border-radius:7px;white-space:nowrap}

<template id="content-balkans-2026"><header><div class="eyebrow">Bosnia & Herzegovina → Montenegro · 自駕雙人旅行</div><h1>Sarajevo 的兩張面孔，<br>與前往群山的一天。</h1><p>2026 年 9 月 9–11 日｜把較晴的一天留給街巷與 Trebević，把雨天留給城市記憶。9/11 07:00 出發，固定經 Šavnik，不走 Trsa／Sedlo。</p><span class="pill">核查日期 2026/9/8</span><span class="pill">全程當地時間 CEST · UTC+2</span><span class="pill">兩位成人 · 自有租車</span></header>
<nav><a href="#changes">關鍵修正</a><a href="#weather">天氣</a><a href="#d9">9/9 城市與山</a><a href="#d10">9/10 博物館</a><a href="#d11">9/11 跨境</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main>
<section id="changes"><h2>這份行程值得保留，但順序要改</h2><p>原案的歷史脈絡很好，主要弱點是把纜車押在可能有雷雨的傍晚、把十一個市區點塞進 105 分鐘，以及仍把「7 月查詢結果」當成 9 月現況。本版集中處理尚未出發的 9/9–9/11；Mostar、Kravica、Konjic、Tito’s Bunker 等已過日期不再重算或排入。</p>
<div class="tablewrap"><table><tr><th>原案</th><th>修正與原因</th></tr><tr><td>9/10 傍晚上 Trebević</td><td><b>改 9/9 14:45–17:30</b>。9/10 下午預报有雨及雷暴；9/9 也不是山上必晴保證，但目前更適合戶外。</td></tr><tr><td>19:15 搭纜車下山</td><td>官網現列週二至週日 <b>09:00–19:00</b>。本版 17:15 左右開始回程，不押末班，更不在山上等約 19 時的日落。<a href="https://www.zicara.ba/bs/servisne-informacije">官方時間</a></td></tr><tr><td>Haggadah 必須三天前預約，且含導覽</td><td>官網票價頁寫：週四 12:00–13:00 普通票可看、<b>無導覽</b>；館員特別導覽另行預約。5/27 公告措辭不同，須向館方確認，不能直接判定沒訂就看不到。<a href="https://zemaljskimuzej.ba/en/information-for-visitors/tickets/">票價頁</a></td></tr><tr><td>聯票優惠到 8/31</td><td>9/3 公告主文改為至 <b>12/31，非居民 35 KM／人</b>，但頁尾仍留有 8/31 舊文。先在纜車售票處確認，按同一天使用安排。<a href="https://www.zicara.ba/bs/promotivna-ponuda">更新公告</a></td></tr><tr><td>Svrzo’s House 只是疲倦時可刪</td><td>9/4–10/4 有「三百年住宅史」特展，值得升級為優先選配；放到 9/10 下午，取代多餘的第二間戰爭館。<a href="https://www.muzejsarajeva.ba/en/2026/09/04/otvorena-izlozba-od-doma-do-bastine/">展覽公告</a></td></tr><tr><td>9/14 固定從東北離開</td><td><b>暫不能成立。</b>9/8 黑山路況報導指 Tara 大橋全面封閉至 10/26 12:00，含行人。9/11 經 Šavnik 不受該橋影響；9/14 若須過橋，必須重排。<a href="https://www.dan.co.me/crna-gora/na-vise-dionica-izmijenjen-rezim-saobracaja-najavljene-obustave/">DAN 引述 AMSCG</a></td></tr></table></div></section>
<section id="weather"><h2>天氣決定優先順序</h2><div class="grid"><div class="card"><span class="tag">9/9 · Sarajevo</span><strong>15–32°C</strong><p>晴時多雲、偏熱；預報附中午至約 17 時高溫黃色警示。</p><p>街景提早拍，午間市政廳＋午餐避曬，下午上山但先看雲況。</p></div><div class="card"><span class="tag">9/10 · Sarajevo</span><strong>15–29°C</strong><p>早上局部陣雨，下午間歇降雨及雷暴。</p><p>隧道＋國家博物館為主軸；取消固定山上日落。</p></div><div class="card"><span class="tag">9/11 · Sarajevo → 山區</span><strong>提早走，少停留</strong><p>Sarajevo 約 15–29°C，下午有雷暴可能。不能把首都預報套用到 Piva／Žabljak。</p><p>07:00 出發；前晚與出發當晨重看山區雷雨警示。</p></div></div><p class="muted">天氣為 9/8 查詢回傳的 Sarajevo 逐日預報快照；山區查詢只回傳未清楚標示日期的逐時資料，未把它冒充 9/11 精準預報，也不虛構降雨百分比。查詢更新：<a href="https://www.fhmzbih.gov.ba/">波赫氣象局</a>／<a href="https://www.meteo.co.me/">黑山氣象局</a>。日落暫以約 19:05–19:10 作安排窗口，本次未取得可核實的逐日天文表；山脊會讓實際失去直射光更早。</p><div class="soft"><b>上山判斷：</b>山頂能見度尚可、纜車正常且附近無雷雨才上山。若聽到雷聲或營運暫停，直接採市區備案；纜車站的天氣判斷優先於市區看起來晴朗。室內館舍不等於保證有冷氣，午休可回住宿，或現場確認咖啡館冷氣。</div></section>
<section id="d9" class="day"><span class="tag">WEDNESDAY · 9 SEPTEMBER</span><h2>9/9｜1914、帝國交界與奧運之山</h2><p>早晨慢慢走城市，中午看建築，下午看城市的地形。預估總步行 7–10 公里；不走完整雪橇道、不再加入 War Childhood Museum。</p>
<div class="slot" id="stop-1"><div class="time">07:30–08:15</div><div><h3>Latin Bridge 與刺殺地點</h3><div class="guide-buttons"><a class="guide-link" href="#guide-assassination">導覽</a><a class="guide-link" href="#guide-river">導覽</a></div><p>比原案提早約 45 分鐘，降低人車干擾。先從人行道拍橋的斜側面，再到北岸博物館外的刺殺轉角；不是在橋中央發生刺殺。沿河補 Emperor’s Mosque 外觀。河水不是為攝影保持靜止，倒影以現場水位和風況為準。</p><p>1914 年刺殺是危機的導火線；從事件走到世界大戰，仍須理解帝國競爭、民族主義、軍備與同盟決策。這樣走進下一間博物館才有意義。</p><span class="tag">免費</span><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Latin%20Bridge%20Sarajevo" data-map="Latin Bridge Sarajevo">Latin Bridge 地圖</a><a class="guide-link" href="#guide-latin">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Emperor%27s%20Mosque%20Sarajevo" data-map="Emperor's Mosque Sarajevo">Emperor’s Mosque 地圖</a><a class="guide-link" href="#guide-emperor">導覽</a></div></div>
<div class="slot" id="stop-2"><div class="time">08:15–09:00</div><div><h3>早餐與河岸休息</h3><p>麵包／burek 配優格或咖啡，兩人估 15–25 KM。不用特意跑名店。08:55 回到 Museum Sarajevo 1878–1918 門口。</p></div></div>
<div class="slot" id="stop-3"><div class="time">09:00–09:45</div><div><h3>Museum Sarajevo 1878–1918</h3><p>45 分鐘重點看奧匈城市建設、日常生活與政治衝突。小館適合有主題地看，不必把每塊說明都讀完。</p><p><b>暫按原案 09:00 開門、5 KM／人規劃；本次官網分館頁未列現行時間及票價，屬待核。</b>若 09:00 沒開，先走老城，11:10 回館，市政廳順延到 12 時左右，午餐稍後。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Museum%20Sarajevo%201878%201918" data-map="Museum Sarajevo 1878 1918">博物館地圖</a><a class="guide-link" href="#guide-museum1914">導覽</a><a href="https://www.muzejsarajeva.ba/en/Depandansi/muzej-sarajevo/">官方分館資料</a></div></div>
<div class="slot" id="stop-4"><div class="time">09:45–11:20</div><div><h3>鄂圖曼老城：只走一個清楚的街區</h3><div class="guide-buttons"><a class="guide-link" href="#guide-bezistan">導覽</a><a class="guide-link" href="#guide-brusa">導覽</a></div><p><b>Sebilj → Kazandžiluk → Morića Han → Gazi Husrev-beg Mosque → Gazi Husrev-beg Bezistan → Meeting of Cultures。</b>不再把西側的教堂、永恆之火與市場全塞進來；那些留給明天下午。</p><p>Sebilj 是老市集的公共水亭；Kazandžiluk 看銅器敲打與手工紋樣；Morića Han 看商旅住宿如何圍繞庭院。清真寺、學校、慈善設施與商業空間共同構成城市生活，並非各自孤立的景點。</p><p>清真寺內部可安排約 10:30–10:55：官方夏季上午參觀窗 09:00–12:00，官網列 3 KM／人，聽從現場禮拜安排。女性備頭巾，男女遮肩膝、入內脫鞋。<a href="https://begovadzamija.ba/turizam/">官方參觀資訊</a></p><p><b>注意兩個 Bezistan 不同：</b>這裡逛的是 Gazi Husrev-beg 的商業長廊；Brusa Bezistan 是另一棟博物館，本版不額外購票入內。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sebilj%20Sarajevo" data-map="Sebilj Sarajevo">Sebilj</a><a class="guide-link" href="#guide-sebilj">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kazandziluk%20Sarajevo" data-map="Kazandziluk Sarajevo">銅匠街</a><a class="guide-link" href="#guide-copper">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Morica%20Han%20Sarajevo" data-map="Morica Han Sarajevo">Morića Han</a><a class="guide-link" href="#guide-morica">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Gazi%20Husrev%20beg%20Mosque%20Sarajevo" data-map="Gazi Husrev beg Mosque Sarajevo">清真寺</a><a class="guide-link" href="#guide-gazi">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Meeting%20of%20Cultures" data-map="Sarajevo Meeting of Cultures">帝國交界標誌</a><a class="guide-link" href="#guide-cultures">導覽</a></div></div>
<div class="slot" id="stop-5"><div class="time">11:20–12:45</div><div><h3>先買聯票，再看 Vijećnica</h3><p>11:20–11:45 步行到 Hrvatin 纜車下站售票處，確認今天營運與 <b>35 KM 非居民 Duo 聯票</b>；說明先看市政廳、下午再搭纜車，請售票員確認順序可行。之後走回市政廳，約 12:00–12:45 參觀。</p><p>若聯票不能按此順序使用，或優惠實際未執行，直接分開買票，預留共 40–45 KM／人；不要為省少量票差浪費半小時。這個額外步行是換取同日聯票的代價。</p><p>看六角中庭、彩玻璃、樓梯與幾何裝飾。摩爾復興式外觀是奧匈時期對「東方」的建築詮釋。1992 年焚毀與後來修復，使它同時是城市美學和文化記憶的場所。官網每日 09:00–17:00。<a href="https://www.vijecnica.ba/en/home">市政廳官網</a></p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Cable%20Car%20Hrvatin" data-map="Sarajevo Cable Car Hrvatin">下站售票处</a><a class="guide-link" href="#guide-cable">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20City%20Hall%20Vijecnica" data-map="Sarajevo City Hall Vijecnica">市政廳</a><a class="guide-link" href="#guide-hall">導覽</a></div></div>
<div class="slot" id="stop-6"><div class="time">12:45–14:15</div><div><h3>Aščinica 午餐＋坐下來休息</h3><p>Hadžibajrić 或 ASDŽ，選現場有菜、少排隊的一間。兩人先點 <b>1 份 begova čorba＋2 種小份熟食＋麵包</b>，例如 sogan-dolma 洋蔥鑲肉、bosanski lonac 肉蔬燉鍋；klepe 肉餃留到另一餐。原案四菜加湯對兩人可能太多。</p><p>午餐兩人估 30–45 KM，咖啡／飲水另估 10–15 KM。沒有取得這兩店可核實的 9 月完整價目，因此此處是預算，不是菜單報價。餐點可能售罄，先看菜再坐下。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ascinica%20Hadzibajric%20Sarajevo" data-map="Ascinica Hadzibajric Sarajevo">Hadžibajrić</a><a class="guide-link" href="#guide-food">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=ASDZ%20Sarajevo" data-map="ASDZ Sarajevo">ASDŽ</a><a class="guide-link" href="#guide-food">導覽</a></div></div>
<div class="slot" id="stop-7"><div class="time">14:15–17:30</div><div><h3>Trebević 纜車＋雪橇道短段</h3><p>14:15 步行往下站，14:45 左右搭乘；15:00–15:30 上站觀景，15:30–16:30 沿指示步道前往 1984 冬奧雪橇道，選一段塗鴉彎道體驗，16:30 原路回上站，17:15 左右搭車下山。森林散步約 2–4 公里，依實際入口縮短；不一路走到雪橇道最底端再辛苦爬回來。</p><p>1984 冬奧代表南斯拉夫時期的國際化；圍城期間，這座山的制高位置又有截然不同的角色。從高處看城市狹長的河谷，比只讀圍城文字更容易理解地形。拍城市全景宜在到站時先拍，不把所有照片押到最後。</p><p>纜車上站不是 1,627 公尺的 Trebević 主峰，本次也不登頂。只走有標示的遊客步道及開放雪橇道入口，不鑽軍事廢墟、跨封鎖或走草叢捷徑。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Trebevic%20cable%20car%20upper%20station" data-map="Trebevic cable car upper station">上站</a><a class="guide-link" href="#guide-cable">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Olympic%20Bobsleigh%20and%20Luge%20Track" data-map="Sarajevo Olympic Bobsleigh and Luge Track">雪橇道景點定位</a><a class="guide-link" href="#guide-track">導覽</a><small>地圖顯示景點；實際步行依上站現場指示，不按直線穿林。</small></div></div>
<div class="slot" id="stop-8"><div class="time">17:30–20:15</div><div><h3>晚餐，黃堡日落二選一</h3><p><b>舒適版：</b>18:00–19:15 Dveri 晚餐，兩人估 60–90 KM；之後沿河拍市政廳亮燈，早點回去。Dveri 的吸引力是小空間與家常濃郁菜式，近期評論方向仍正面，但不保證臨時有座。<a href="https://www.tripadvisor.com/Restaurant_Review-g294450-d1524643-Reviews-Dveri-Sarajevo_Sarajevo_Canton_Federation_of_Bosnia_and_Herzegovina.html">旅客評論</a></p><p><b>仍想夕陽版：</b>17:45 簡單吃，18:20–18:40 到 Yellow Fortress，待約 19:15。這是額外上坡，不是必做；如果今晚 9/8 已看過滿意夕陽，明天直接刪除。目標是城市層疊屋頂及西側天空，不保證清真寺一定順光或能見度完美。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Dveri%20Sarajevo" data-map="Dveri Sarajevo">Dveri</a><a class="guide-link" href="#guide-food">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Yellow%20Fortress%20Sarajevo" data-map="Yellow Fortress Sarajevo">黃堡</a><a class="guide-link" href="#guide-yellow">導覽</a></div></div>
<details><summary>9/9 纜車停駛或山上雷雨怎麼換？</summary><p>改 14:30–15:20 Svrzo’s House（先核對開館），15:30–17:00 War Childhood Museum。9/10 下午則只保留西側市區與休息，不再重複兩館。尚未買票就別為了聯票先付不可用的纜車費；已買票則詢問停駛處理政策。</p></details></section>
<section id="d10" class="day"><span class="tag">THURSDAY · 10 SEPTEMBER</span><h2>9/10｜圍城生命線、猶太手抄本與生活記憶</h2><p>開車處理郊區，其餘留在市中心。固定保護正午 Haggadah 時窗；下午每一項都有可刪空間。</p>
<div class="note"><b>9/9 早上先打給國家博物館：<a href="tel:+38733586330">+387 33 586 330</a>。</b>詢問 9/10 12:00 普通票參觀真跡是否可直接入場、是否需要登記，以及是否另收費。票價頁與 5/27 公告對預約／館員陪同寫法不同。尚未有你的預約確認，這裡保留的是參觀時窗，不是已訂妥導覽。若需特別館員導覽，票價頁列少於 5 人整組 150 KM，且需提前三天；兩人預算旅行不建議為此臨時追求私人場。<a href="https://zemaljskimuzej.ba/en/the-sarajevo-haggadah-available-for-visits-again/">5/27 公告</a></div>
<div class="slot" id="stop-9"><div class="time">07:45–09:00</div><div><h3>早餐、出發前往 Tunnel of Hope</h3><p>08:00 左右離開住宿，預留 45–60 分鐘含交通與停車；住宿位置未提供，這不是精確導航車程。導航設 Butmir 的 Tunnel of Hope／Tunel spasa，別開到機場航廈。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Tunnel%20of%20Hope%20Tunel%20spasa" data-map="Sarajevo Tunnel of Hope Tunel spasa">Tunnel of Hope</a><a class="guide-link" href="#guide-tunnel">導覽</a></div></div>
<div class="slot" id="stop-10"><div class="time">09:00–10:15</div><div><h3>Tunnel of Hope</h3><p>從民宅入口、地圖與運輸設備理解機場跑道下的生命線。現存 25 公尺原始段，另有約 100 公尺原隧道管線經結構更新的展示段；不宜一概稱為全新複製隧道。<a href="https://www.mcsarajevo.ba/tunel-spasa">館方說明</a></p><p><b>成人 20 KM；語音導覽 3 KM。4–10 月 08:30–17:00，最後入場 16:30。只收 KM 現金，不收信用卡或外幣。</b>兩人帶至少 46 KM 供門票與語音，停車另備零錢。雨天穿止滑鞋，有些銜接區域不是完全室內。</p><p>10:15 準時離開；若上午堵車或隧道臨時關閉，放棄隧道，直奔國家博物館。</p></div></div>
<div class="slot" id="stop-11"><div class="time">10:15–11:40</div><div><h3>Marijin Dvor 停車＋提早報到</h3><p>往國家博物館，預留 45–60 分鐘含停車，找鄰近合法收費位／商場停車場，再步行至館。停車兩人共用車估 8–15 KM，非已確認費率。車內不留顯眼行李；11:15 左右到館，先確認真跡入場集合位置，再看考古展。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=National%20Museum%20of%20Bosnia%20and%20Herzegovina" data-map="National Museum of Bosnia and Herzegovina">國家博物館</a><a class="guide-link" href="#guide-national">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Parking%20Marijin%20Dvor%20Sarajevo" data-map="Parking Marijin Dvor Sarajevo">周邊停車搜尋</a></div></div>
<div class="slot" id="stop-12"><div class="time">11:40–13:45</div><div><h3>National Museum＋12:00 Haggadah</h3><div class="guide-buttons"><a class="guide-link" href="#guide-haggadah">導覽</a><a class="guide-link" href="#guide-stecci">導覽</a></div><p><b>12:00–13:00 是公開參觀窗口，不代表每位遊客會有整整一小時解說。</b>提前到，依館方安排參觀。手抄本承載中世紀塞法迪猶太逾越節傳統，其流轉與保存故事連結西班牙、猶太社群和 Sarajevo。</p><p>其他只選：stećci 中世紀墓碑、考古展、民族誌住宅／服飾、植物園。stećci 應放在巴爾幹中世紀不同社群共同的文化背景理解，不簡化成單一宗教專屬遺產。</p><p>普通成人票 20 KM／人；週二至週日 10:00–19:00。如真跡當天不可看，仍可保留約 90 分鐘看其他收藏，提早午餐；不在入口無限等待。</p></div></div>
<div class="slot" id="stop-13"><div class="time">13:45–15:00</div><div><h3>午餐、把車停回住宿</h3><p>Marijin Dvor 一帶簡單吃湯／烤肉／麵包，兩人估 25–40 KM。14:30 左右回住宿停車、放下雨具以外的物品；依住宿實際位置调整。下午不再為市區每一站找車位。</p></div></div>
<div class="slot" id="stop-14"><div class="time">15:00–15:50</div><div><h3>Svrzo’s House：值得加，但以開館為前提</h3><p>9/4–10/4「From Home to Heritage」特展適逢住宅三百周年。木造房間、庭院、接待與家庭空間能讓歷史回到日常尺度，是戰爭主題之間很好的緩衝。</p><p>本次確認展期，未取得現行售票時段；<b>9/9 請 1878–1918 分館櫃台核對隔日 15 時能否入內及票價</b>。暫估 5–10 KM／人。如果最後入場早於 15 時，直接刪除，別把它排到 16:50 碰運氣。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Svrzo%27s%20House%20Sarajevo" data-map="Svrzo's House Sarajevo">Svrzo’s House</a><a class="guide-link" href="#guide-svrzo">導覽</a></div></div>
<div class="slot" id="stop-15"><div class="time">16:00–17:15</div><div><h3>War Childhood Museum：選配，取決於精神</h3><div class="guide-buttons"><a class="guide-link" href="#guide-gallery">導覽</a></div><p>用一件玩具、一件衣服與一段證言理解戰爭如何改變童年。這是情緒濃度高的館，不必追求看完每則故事。上午看過隧道若已感負荷，直接改咖啡休息；Gallery 11/07/95 不再加進同一天。</p><p>成人 15 KM，11:00–19:00，最後入場 18:30，可刷卡；當月免費時段是 9/24 17:00–19:00，這趟用不到。<a href="https://warchildhood.org/visitor-information/">官方參觀頁</a></p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=War%20Childhood%20Museum%20Sarajevo" data-map="War Childhood Museum Sarajevo">War Childhood Museum</a><a class="guide-link" href="#guide-childhood">導覽</a></div></div>
<div class="slot" id="stop-16"><div class="time">17:15–18:15</div><div><h3>雨停才走：多宗教街區的西半段</h3><div class="guide-buttons"><a class="guide-link" href="#guide-ferhadija">導覽</a><a class="guide-link" href="#guide-markale">導覽</a></div><p><b>舊猶太會堂外觀 → Sacred Heart Cathedral → Orthodox Cathedral → Ferhadija／Markale 市場建築 → Eternal Flame。</b>每站只選外觀與街景，約 1.5–2 公里，遇雨縮成 Ferhadija 一小段。此時市場攤商可能收攤，這段是看城市，不以生鮮採買作承諾。</p><p>比較清真寺的庭院、市集小巷與較寬街道、對稱立面及教堂廣場。多宗教共存是城市的重要歷史，但不把它美化成各時期都沒有衝突。永恆之火是二戰解放紀念，不是專為 1990 年代圍城而建。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Jewish%20Museum%20Sarajevo" data-map="Jewish Museum Sarajevo">舊猶太會堂</a><a class="guide-link" href="#guide-jewish">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sacred%20Heart%20Cathedral%20Sarajevo" data-map="Sacred Heart Cathedral Sarajevo">天主教主教座堂</a><a class="guide-link" href="#guide-catholic">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cathedral%20Church%20of%20the%20Nativity%20of%20the%20Theotokos%20Sarajevo" data-map="Cathedral Church of the Nativity of the Theotokos Sarajevo">東正教主教座堂</a><a class="guide-link" href="#guide-orthodox">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Eternal%20Flame%20Sarajevo" data-map="Eternal Flame Sarajevo">永恆之火</a><a class="guide-link" href="#guide-flame">導覽</a></div></div>
<div class="slot" id="stop-17"><div class="time">18:15–20:00</div><div><h3>早晚餐、加油與跨境準備</h3><p>晚餐選 klepe＋湯／沙拉，或 burek＋優格；兩人估 25–45 KM。想坐久些可選 Zara iz Duvara，想市政廳景觀可看 Inat Kuća，但未核實當日菜單與空位。</p><p><b>今晚就在 Sarajevo 補足油，別把 Foča 補滿當成必要任務。</b>買好明早早餐、水及少量密封零食；水果和乳製品以今天吃完為主，不為跨境囤生鮮。整理護照、駕照、車籍、租約、跨境授權及適用黑山的保險文件。下載離線地圖，明早只需裝車出發。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Zara%20iz%20Duvara%20Sarajevo" data-map="Zara iz Duvara Sarajevo">Zara iz Duvara</a><a class="guide-link" href="#guide-food">導覽</a><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Inat%20Kuca%20Sarajevo" data-map="Inat Kuca Sarajevo">Inat Kuća</a><a class="guide-link" href="#guide-inat">導覽</a></div></div>
<details><summary>如果最想逛市場，怎麼改？</summary><p>把 9/9 早餐後的 1878–1918 博物館換成 08:30–09:15 Markale＋Gradska Tržnica；博物館移到 9/10 下午並取代 Svrzo’s House。市場適合當季水果、起司與乳脂製品，但既要早市又要所有博物館，會犧牲山上的時間。本版優先保留你原本的歷史主題。</p></details></section>
<section id="d11" class="day"><p class="soft"><strong>此日已有新版：</strong><a href="#trip/montenegro-north-2026/mn11">開啟 9/10 查核版本：06:45 出發、補給與接續四日行程</a>。以下為先前規畫，移動時以新版為準。</p><span class="tag">FRIDAY · 11 SEPTEMBER</span><h2>9/11｜07:00 上路，經 Šavnik 抵達 Žabljak</h2><p><b>Sarajevo → Foča → Hum／Šćepan Polje → Plužine → Jasenovo Polje → Šavnik → Žabljak。</b>保留你的明確限制：不走 Trsa／Sedlo，不加 Sarajevo 半日觀光。</p><div class="note"><b>已核查的路況，不等於未來通行保證：</b>BIHAMK 9/8 20:11 報告列 Dobro Polje–Miljevina 只准 3.5 噸以下車輛通行；一般 ix35 小客車應屬此範圍，仍以車籍／現場標誌為準。9/8 的「邊境約 30 分鐘內」是全國概況，不是 9/11 Hum 的等待承諾。<a href="https://bihamk.ba/spi/stanje-na-cesti-u-bih">BIHAMK 即時頁</a></div>
<div class="tablewrap"><table><tr><th>時間窗口</th><th>行動與重點</th><th>停留規則</th></tr><tr><td>06:15–07:00</td><td>早餐、退房、装車；檢查即時路況。</td><td>07:00 車輪開動。</td></tr><tr><td>07:00–09:15</td><td>Sarajevo → Trnovo／Dobro Polje → Miljevina → Foča 方向。</td><td>約 2–2¼ 小時規劃，山路／管制可拉長。</td></tr><tr><td>09:15–09:35</td><td>Foča 周邊洗手間、短休；只有油量不足才加油。</td><td>不用為加油站優惠繞市中心。</td></tr><tr><td>09:35–11:30</td><td>往 Hum，完成波赫出境與黑山入境。</td><td>含窄路慢行及約 30–60 分鐘邊境預留；可能超出。</td></tr><tr><td>11:30–12:30</td><td>Šćepan Polje → Piva 峽谷 → Plužine。</td><td>彎道、隧道、落石與會車優先，不把所有湖景都停一次。</td></tr><tr><td>12:30–13:15</td><td>Plužine 午餐與湖岸短走。</td><td>雨大就只吃飯／上廁所，晴時才拍 10–15 分鐘。</td></tr><tr><td>13:15–14:00</td><td>選配 Piva Monastery，含短程接近與約 20–30 分鐘參觀。</td><td>有延誤、雨勢增強即刪除。</td></tr><tr><td>14:00–16:30</td><td>Jasenovo Polje → Šavnik → Žabljak。</td><td>預留約 2–2½ 小時含短休，別因導航縮時改高山小路。</td></tr><tr><td>16:30–17:30</td><td>入住、休息、簡單採買。</td><td>17:30 為目標緩衝，非承諾到達時間。</td></tr><tr><td>18:00 以後</td><td>鎮上晚餐，查看翌日 Durmitor 天氣。</td><td>今天不加 Black Lake 或高山日落。</td></tr></table></div>
<h3>這段路看什麼才值得？</h3><div class="guide-buttons"><a class="guide-link" href="#guide-piva">導覽</a><a class="guide-link" href="#guide-monastery">導覽</a><a class="guide-link" href="#guide-durmitor">導覽</a></div><p><b>Piva 峽谷：</b>旅程特色是高聳岩壁、人工水庫與鑿山道路的尺度。湖色取決於雲量、水位與角度，灰天仍有層次，不必追求明信片式藍綠。只在真正可完全離開行車道的合法停車處拍攝。</p><p><b>Plužine：</b>讓峽谷行車中斷的一個舒適補給點。午餐選有營業、能迅速出餐的湖邊餐館；兩人預留 €25–40，魚料理先問按份還是按重量。此日不安排遊船或 zipline。</p><p><b>Piva Monastery：</b>看樸素外觀與內部壁畫的反差，也理解水壩工程背景下文化資產搬遷保存的故事。預留捐獻／可能門票 €0–5／人，現行費用與當日開門未核實；有禮拜、關門就直接離開。</p>
<h3>分段導航：每一段都檢查道路</h3><p>以下是地名搜尋連結，不是精確停車入口或路肩定位；不提供未核實經緯度。先完成當前一段，再啟動下一段。Foča 的城市中心只是地理錨點，實際可選主路沿線休息點以免繞路。</p><div id="route"></div><p><b>Plužine 離開前，下一站必須設 Jasenovo Polje（Nikšić 方向），之後設 Šavnik。</b>如果地圖出現 Trsa、Sedlo、P14 高山線，就退回重設；不要只按最短時間。沿此主路進 Žabljak，重點是走 Šavnik 路廊，無需把入城方位硬稱為「西南」。</p>
<div class="tablewrap"><table><tr><th>現場狀態</th><th>具體處理</th></tr><tr><td>Plužine 13:30 後才到</td><td>午餐限 30 分鐘，取消修道院。</td></tr><tr><td>14:30 還在 Plužine／累計晚 90 分鐘</td><td>外帶或簡單補給，直接經 Jasenovo Polje／Šavnik，取消所有觀景支線。</td></tr><tr><td>豪雨、落石、能見度差</td><td>在城鎮、加油站或合法停車場等候改善；不在隧道口、橋面或無護欄路肩停車。比準點入住更重要的是安全。</td></tr><tr><td>出發前道路封閉</td><td>先查 BIHAMK／AMSCG 的正式替代路線與時數；不自行接受導航推薦的地方小路。若必須大繞路，放棄當日 Piva 觀光。</td></tr><tr><td>導航想改走 Tara 大橋</td><td>拒絕這個替代。現有 9/8 報導指全封閉，不能當跨河備援。9/14 需跨橋的安排另行修正。</td></tr></table></div>
<p class="muted">9/11 全日抓約 9½–10½ 小時，包含吃飯、通關與緩衝；這是規劃估計，未取得此精確分段路線的即時導航里程。全程不是高速公路，無須為此路線額外安排高速公路票；通行標誌及當日收費以現場為準。波赫、黑山同時區，過境不調時鐘。</p></section>
<section id="budget"><h2>兩人費用：把確認票價與預算分開</h2><p>KM＝BAM；換算採 €1 ≈ 1.95583 KM。以下不含已付住宿、租車、跨境保險與紀念品；餐飲、停車和油費均為規劃估算，不能當即时报價。</p><div class="tablewrap"><table><tr><th>項目</th><th>每人</th><th>兩人合計</th><th>核查狀態</th></tr><tr><td>1878–1918 博物館</td><td>暫估 5 KM</td><td>10 KM</td><td>原案數字，本次未重新證實</td></tr><tr><td>Gazi Husrev-beg Mosque</td><td>3 KM</td><td>6 KM</td><td>官網列價，頁面無明確更新日</td></tr><tr><td>市政廳＋纜車 Duo</td><td>35 KM</td><td>70 KM</td><td>9/3 官方公告；舊頁尾衝突，櫃台確認</td></tr><tr><td>若需分開買市政廳＋纜車</td><td>預留 40–45 KM</td><td>80–90 KM</td><td>替代預算，不與聯票重複計入</td></tr><tr><td>Tunnel of Hope</td><td>20 KM</td><td>40 KM</td><td>官方確認；KM 現金</td></tr><tr><td>隧道語音導覽選配</td><td>3 KM</td><td>6 KM</td><td>官方確認</td></tr><tr><td>National Museum</td><td>20 KM</td><td>40 KM</td><td>官方確認；正規 Haggadah 時窗列在普通票下</td></tr><tr><td>Svrzo’s House 選配</td><td>估 5–10 KM</td><td>10–20 KM</td><td>特展存在已確認；票價待核</td></tr><tr><td>War Childhood 選配</td><td>15 KM</td><td>30 KM</td><td>官方確認</td></tr><tr><td>Piva Monastery 選配</td><td>估 €0–5</td><td>€0–10</td><td>捐獻／票費預留，待核</td></tr></table></div>
<div class="soft"><b>核心門票合計：兩人 166 KM（約 €85）。</b>計算為 10＋6＋70＋40＋40。加入 Svrzo’s House、War Childhood 與隧道語音後，為 <b>212–222 KM（約 €108–114）</b>。這個合計含尚待核的 1878 票價及需櫃台確認的聯票，因此是可用預算，不是「全部已確認總額」。若聯票不能用，另加 10–20 KM／兩人。五館聯票即使仍為 20 KM／人，本版只看兩分館也不值得預買。</div>
<div class="tablewrap"><table><tr><th>日期</th><th>兩人預算</th><th>包含什麼</th></tr><tr><td>9/9</td><td>201–261 KM（約 €103–133）</td><td>核心門票 86；早餐 15–25；午餐 30–45；飲料 10–15；Dveri 晚餐 60–90。</td></tr><tr><td>9/10</td><td>209–280 KM（約 €107–143）</td><td>隧道、國家館、兩個選配館及語音 126–136；早餐 15–25；午餐 25–40；晚餐 25–45；停車 8–15；市區油耗 10–19。</td></tr><tr><td>9/11</td><td>€92–152</td><td>餐飲 €60–95；路線油費預留 €30–45；停車／小額支出 €2；修道院 €0–10。</td></tr></table></div>
<div class="card"><div class="tag">三天完整版本 · 兩人 · 不含住宿與租車</div><div class="budget">約 €302–429</div><p>舒服抓 <b>€350–430</b>；若聯票無法使用，再加約 €5–10。跳過 War Childhood／Svrzo’s House 或以簡餐取代 Dveri，可再省約 €35–60。</p></div><p>9/11 油費只是預留，不是精確測算：山路油耗暫以約 7–9 L/100 km 作情境；本次未取得可靠即時柴油單價與路線里程，不宣稱 Foča 必定比 Sarajevo 便宜。補滿油箱的現金支出也不等於這一天實際消耗。</p></section>
<section><h2>活動與最後準備</h2><p>已確認 Svrzo’s House 特展橫跨你的停留日期。9/8 官方貼文另提 9/12 20:00 Svrzo’s House 免費歌劇獨唱與合唱節目，但你 9/11 已離開，因此不為此打亂自駕。未取得能可靠列入 9/9 或 9/10 晚上的演出；原案「9/14 前都沒有節目」也不能再沿用。<a href="https://www.muzejsarajeva.ba/en/2026/09/08/poetski-performans-sarajevo-s-ljubavlju/">官方活動更新</a></p><ul><li><b>9/9 上午：</b>致電國家館確認 Haggadah 普通票入場；在 1878 分館核對 Svrzo 的下午開放。</li><li><b>9/9 聯票櫃台：</b>確認 35 KM、同日使用順序與纜車當日最後回程；不用波赫居民折扣。</li><li><b>9/10 晚：</b>加油、早餐、離線地圖與跨境文件備好；用現金付完隧道票後，留少量 KM，黑山用歐元。</li><li><b>9/11 06:30：</b>查看 BIHAMK 與黑山最新道路／雷雨訊息；保留 Šavnik 主路方案。</li><li><b>9/14：</b>凡涉及過 Tara 大橋的路線均先視作不可用；需依你的下一晚目的地重新選路，不能在不知道目的地時給一條假裝通用的繞行。</li></ul><p class="muted">本次沒有替你發信、訂位、付款或建立預約。所有地圖按鈕皆為 Google Maps 地名搜尋，便於現場核對；不把搜尋點當成已驗證的停車入口。</p></section>
<section id="guidebook"><span class="tag">POCKET GUIDE · 隨身中文導覽</span><h2>34 篇可點開的景點導覽</h2><p>行程旁點「導覽故事」即跳到對應文章並展開；讀完可返回剛才位置。每篇包含歷史背景、現場觀察與故事。史料、地方傳說和導覽解讀分開說明。主行程外的分館只供理解或替代，不代表新增必去景點。</p><div class="guide-index"><a class="guide-link" href="#guide-inat">導覽</a><a href="#guide-assassination" class="guide-link">導覽</a><a href="#guide-latin" class="guide-link">導覽</a><a href="#guide-river" class="guide-link">導覽</a><a href="#guide-emperor" class="guide-link">導覽</a><a href="#guide-museum1914" class="guide-link">導覽</a><a href="#guide-sebilj" class="guide-link">導覽</a><a href="#guide-copper" class="guide-link">導覽</a><a href="#guide-morica" class="guide-link">導覽</a><a href="#guide-gazi" class="guide-link">導覽</a><a href="#guide-bezistan" class="guide-link">導覽</a><a href="#guide-cultures" class="guide-link">導覽</a><a href="#guide-hall" class="guide-link">導覽</a><a href="#guide-cable" class="guide-link">導覽</a><a href="#guide-track" class="guide-link">導覽</a><a href="#guide-yellow" class="guide-link">導覽</a><a href="#guide-tunnel" class="guide-link">導覽</a><a href="#guide-national" class="guide-link">導覽</a><a href="#guide-haggadah" class="guide-link">導覽</a><a href="#guide-stecci" class="guide-link">導覽</a><a href="#guide-svrzo" class="guide-link">導覽</a><a href="#guide-childhood" class="guide-link">導覽</a><a href="#guide-jewish" class="guide-link">導覽</a><a href="#guide-catholic" class="guide-link">導覽</a><a href="#guide-orthodox" class="guide-link">導覽</a><a href="#guide-ferhadija" class="guide-link">導覽</a><a href="#guide-markale" class="guide-link">導覽</a><a href="#guide-flame" class="guide-link">導覽</a><a href="#guide-piva" class="guide-link">導覽</a><a href="#guide-monastery" class="guide-link">導覽</a><a href="#guide-durmitor" class="guide-link">導覽</a><a href="#guide-food" class="guide-link">導覽</a><a href="#guide-brusa" class="guide-link">導覽</a><a href="#guide-gallery" class="guide-link">導覽</a></div><details class="guide-card" id="guide-assassination"><summary>01 · 刺殺現場｜一個街角如何連到世界大戰</summary><div class="guide-body"><p class="guide-lead">先找博物館外的轉角，不要站在橋中央尋找槍擊點。</p><h4>歷史背景</h4><p>今天 Museum Sarajevo 1878–1918 所在的建築，當年是 Schiller 商店。槍擊位置在 Latin Bridge 北端、河岸路與今日 Zelenih beretki 街交會的街角。當年的河岸路稱 Appel Quay，轉入的街稱 Franz Joseph Street。地標約 43.85792, 18.42886；座標用於找到街角，不代表能定位到槍手雙腳的厘米位置。</p><h4>站在現場，看這些</h4><p>站在人行道看三個方向：①南側橋與河；②東側市政廳方向，皇儲車隊在接待後由那邊回來；③北向街道，車隊在這裡轉彎。找牆上紀念牌，比找『原始腳印』可靠；歷代腳印、碑牌曾被更換或移除，不能當作一直保存至今的案發痕跡。</p><h4>導覽故事與理解角度</h4><h4>人物與背景</h4><p>Franz Ferdinand 是奧匈皇位繼承人，同行者是妻子 Sophie。刺客 Gavrilo Princip 是波士尼亞塞族青年，與反抗奧匈統治、主張南斯拉夫統合的青年波士尼亞運動有關。1878 年奧匈取得波赫的占領與行政管理權，1908 年再正式併吞；帝國擴張與南斯拉夫民族主義在此碰撞。刺殺組織獲得塞爾維亞軍方秘密網絡人士協助，但不能直接把它等同『塞爾維亞全體國民或政府一致下令』。</p><h4>1914/6/28：不是只有一次襲擊</h4><ol><li><b>上午約 10:10，炸彈未擊中目標。</b>同謀 Čabrinović 在河岸車隊路線投擲炸彈，皇儲夫婦倖免，後車及旁人受傷。</li><li><b>車隊仍到市政廳。</b>原本的歡迎儀式突然變成遇襲後的接待。你今日參觀的市政廳，也在刺殺當天的故事裡。</li><li><b>接待後打算探望傷者。</b>新路線要沿河前往醫院，但改道資訊沒有妥善傳給司機。</li><li><b>車子在橋頭轉角減速、停下修正。</b>Princip 近距離開槍，皇儲與 Sophie 遭致命傷。『司機轉錯彎』能解釋機會如何出現，不能解釋為何有人帶槍等候。</li></ol><h4>為什麼不是當天就爆發世界大戰？</h4><p>兩聲槍響後還有一個月的『七月危機』：7 月初德國承諾支持奧匈；7/23 奧匈向塞爾維亞提出最後通牒；塞方接受多數要求但未全盤照辦；7/28 奧匈宣戰。俄國動員、德國向俄法宣戰，以及德軍入侵比利時後英國參戰，使地方危機擴為歐洲大戰，再透過殖民帝國與其他參戰國擴至全球。<b>同盟不是完全自動的骨牌：領袖的威脅判斷、動員計畫與選擇都很重要。</b></p><h4>兩個常見誤解</h4><p><b>『一個三明治改變世界』：</b>Princip 買三明治後巧遇皇儲的說法很流行，但 Smithsonian 的史料追查指出缺乏可靠同期證據，不宜當真實細節講述。<b>『英雄還是恐怖分子？』：</b>Princip 的紀念方式隨政治時代改變。可理解他的反帝國動機，也應正視政治暗殺奪走兩條生命；不必為了把故事講得好聽而替他貼單一標籤。</p><p><b>現場最後問自己：</b>如果沒有這次刺殺，1914 年的戰爭是否仍會發生？歷史無法驗證這種假設，但它提醒我們：長期緊張使戰爭可能，具體事件與決策決定它如何發生。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Gavrilo_Princip">Princip 生平與運動背景</a> · <a href="https://en.wikipedia.org/wiki/Sarajevo_City_Hall">市政廳的當日接待</a> · <a href="https://en.wikipedia.org/wiki/Assassination_of_Archduke_Franz_Ferdinand" target="_blank" rel="noopener">事件與地點</a> · <a href="https://en.wikipedia.org/wiki/Museum_of_Sarajevo_1878%E2%80%931918" target="_blank" rel="noopener">博物館與紀念牌變遷</a> · <a href="https://en.wikipedia.org/wiki/July_Crisis" target="_blank" rel="noopener">七月危機</a> · <a href="https://www.smithsonianmag.com/history/gavrilo-princips-sandwich-79480741/" target="_blank" rel="noopener">三明治故事考證</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Museum%20Sarajevo%201878%201918" data-map="Museum Sarajevo 1878 1918">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-latin"><summary>02 · Latin Bridge｜名字比槍聲更古老</summary><div class="guide-body"><p class="guide-lead">先看石橋的圓拱，再問：為何一座鄂圖曼橋叫 Latin？</p><h4>歷史背景</h4><p>Latin 指與拉丁禮天主教社群相連的地名背景，不是古羅馬留下的橋。橋經過洪水與多次修復，現在看到的是累積改建的結果。南斯拉夫時期曾改名 Princip Bridge，後來恢復 Latin Bridge。</p><h4>站在現場，看這些</h4><p>从岸邊斜看橋拱及橋墩上方的圓形開孔。開孔與橋拱共同形成輕巧輪廓；請在行人空間觀察，不下河找角度。</p><h4>導覽故事與理解角度</h4><p>同一座橋，在不同年代可從交通建築變成政治紀念，再回到較早名稱。先讀它的名字，就能開始理解這座城市如何重述自己的過去。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Latin_Bridge" target="_blank" rel="noopener">橋梁歷史</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Latin%20Bridge%20Sarajevo" data-map="Latin Bridge Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-river"><summary>03 · Miljacka 河岸｜城市的長軸</summary><div class="guide-body"><p class="guide-lead">這條河不大，卻把兩岸生活、帝國工程與圍城地理串起來。</p><h4>歷史背景</h4><p>Sarajevo 沿狹長河谷向西擴展，老市集與早期行政、宗教核心集中在東側。帝國更替帶來護岸、道路與交通建設；河岸因此成為解讀城市發展的連續路線。</p><h4>站在現場，看這些</h4><p>抬頭看兩側山坡，再望向河谷延伸方向。比較橋梁連接的街道：橋不只是拍照背景，也是市場、住宅與宗教場所的通道。</p><h4>導覽故事與理解角度</h4><p>明天在隧道館看圍城地圖時，回想今天兩側的山：高地與狹長城市的關係，是理解圍城處境的起點。這是地形觀察，不表示每個山頭都曾是同一軍隊的陣地。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sarajevo" target="_blank" rel="noopener">城市地理與發展</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Miljacka%20Sarajevo" data-map="Miljacka Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-emperor"><summary>04 · Emperor’s Mosque｜Sarajevo 的早期核心</summary><div class="guide-body"><p class="guide-lead">名字中的皇帝是鄂圖曼蘇丹，別與奧匈皇帝混淆。</p><h4>歷史背景</h4><p>創建可追溯至 15 世紀的 Isa-beg 城市建設，早期清真寺與 Mehmed II 有關；現存建築的重要重建階段在 16 世紀蘇萊曼時期。清真寺周邊的浴場、橋與商業收益共同維繫公共生活。</p><h4>站在現場，看這些</h4><p>看單一大穹頂、宣禮塔與院落的比例，再留意它與河橋的關係。若只拍對岸外觀，也能看出宗教核心與交通節點相鄰。</p><h4>導覽故事與理解角度</h4><p>它的價值是讓你把 Sarajevo 的開端想像成一整套生活設施：洗浴、過河、交易與禮拜同時發生。後來宏大的 Gazi Husrev-beg 建設，是另一階段的擴展。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Emperor%27s_Mosque" target="_blank" rel="noopener">建築沿革</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Emperor%27s%20Mosque%20Sarajevo" data-map="Emperor&#x27;s Mosque Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-museum1914"><summary>05 · 1878–1918 博物館｜現代化與統治的兩面</summary><div class="guide-body"><p class="guide-lead">把時間軸從槍擊往前移 36 年，才看得懂這個小館。</p><h4>歷史背景</h4><p>1878 到 1918 是波赫在奧匈統治下的年代。行政、教育、公共衛生與建築改變了城市；同時，誰有權治理、民族如何定位的矛盾也持續累積。</p><h4>站在現場，看這些</h4><p>看城市舊照片的街道尺度、制服與行政形象，再接回窗外街角。展品以當日標籤為準，不預設槍械、汽車或特定物件一定是原件。</p><h4>導覽故事與理解角度</h4><p>建議帶著一個問題參觀：『現代化建設是否就會讓被統治者認同帝國？』道路與學校可以改善生活，但不會自動解決政治代表權與民族認同。這是導覽的閱讀角度，非館方單一結論。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://www.muzejsarajeva.ba/en/Depandansi/muzej-sarajevo/" target="_blank" rel="noopener">分館官方介紹</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Museum%20Sarajevo%201878%201918" data-map="Museum Sarajevo 1878 1918">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-sebilj"><summary>06 · Sebilj｜喝水、相遇與城市象徵</summary><div class="guide-body"><p class="guide-lead">這不是宮殿，而是一座把公共飲水變成城市中心的水亭。</p><h4>歷史背景</h4><p>Sebilj 屬鄂圖曼公共供水傳統。此處早期水亭與 18 世紀建設有關，但今天的造型亦經 19 世紀末重建；不能把現存每塊木頭都當作 1753 年原物。</p><h4>站在現場，看這些</h4><p>看亭頂、木構格柵與下方取水位置，再站遠一點，看它如何讓廣場四周的人流產生中心。拍鴿子時不要追逐牠們。</p><h4>導覽故事與理解角度</h4><p>『喝了這裡的水就會再回 Sarajevo』是地方傳說，不是歷史事實或水質保證。即使不喝水，也能感受公共泉亭作為相約地點的功能。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sebilj_in_Sarajevo" target="_blank" rel="noopener">水亭沿革與傳說</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sebilj%20Sarajevo" data-map="Sebilj Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-copper"><summary>07 · Kazandžiluk｜從日用品看手藝</summary><div class="guide-body"><p class="guide-lead">聽見敲打聲時，先看師傅手裡的工具，再看櫥窗。</p><h4>歷史背景</h4><p>Baščaršija 的商業街巷有按工藝聚集的傳統，銅器街讓原料、加工與販售靠近。咖啡壺、托盤等日用品承載地方生活方式，今日也面向觀光市場。</p><h4>站在現場，看這些</h4><p>比較手工錘紋的細微差異、接縫與把手處理。可以問『這件是否在店裡製作？』，但不能只因表面不規則就斷定手工，也不能把所有亮銅色商品都視為純銅。</p><h4>導覽故事與理解角度</h4><p>買不買都可以停下看製作。它最有趣的地方是讓你看見：一杯咖啡背後不只烘豆，還有壺、杯、托盤及一整套待客文化。拍攝工匠前先詢問。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://de.wikipedia.org/wiki/Ba%C5%A1%C4%8Dar%C5%A1ija" target="_blank" rel="noopener">老市集背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kazandziluk%20Sarajevo" data-map="Kazandziluk Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-morica"><summary>08 · Morića Han｜商隊版的旅館與交流中心</summary><div class="guide-body"><p class="guide-lead">進門後想像：庭院停的不是遊客，而是商隊與馬匹。</p><h4>歷史背景</h4><p>這座 caravanserai 屬 Gazi Husrev-beg 的宗教慈善基金財產。官網把起源放在 16 世紀末至 17 世紀初；它多次失火重建，1957 年嚴重受損後於 1970 年代修復。</p><h4>站在現場，看這些</h4><p>看入口上方、底層儲藏空間與上層房間的分工：管理人要看進出，馬匹貨物在下，人住在上。庭院同時方便搬貨、管理與交換消息。</p><h4>導覽故事與理解角度</h4><p>館方說明其往昔可容約 300 名旅客和 70 匹馬。咖啡空間亦是商人與地方人士議事之所；因此它不只是『古代旅館』，也像城市的商業客廳。現今空間用途不同，不走入私人辦公室。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://begovadzamija.ba/morica-han/" target="_blank" rel="noopener">Vakuf 官方歷史</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Morica%20Han%20Sarajevo" data-map="Morica Han Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-gazi"><summary>09 · Gazi Husrev-beg Mosque｜一座清真寺背後的制度</summary><div class="guide-body"><p class="guide-lead">先看庭院的安靜，再看外面市場的繁忙：它們原本就互相支持。</p><h4>歷史背景</h4><p>16 世紀的 Gazi Husrev-beg 透過 vakuf 捐贈制度資助清真寺、學校、慈善與商業設施。收益可支持公共服務，建築群因此是長期運作的城市系統。</p><h4>站在現場，看這些</h4><p>入內看 mihrab 朝拜龕、minbar 講壇與穹頂下的空間；它們各有禮拜用途。外面看淨身泉亭和附近鐘樓，觀察宗教生活如何安排一天的節奏。</p><h4>導覽故事與理解角度</h4><p>市場的店租與宗教教育看似不同領域，在這裡卻由基金制度連接。對熟悉資產管理的人，可以把它想成以持續收益維持公共目的的歷史制度，但不能完全套用現代法人規則。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://begovadzamija.ba/" target="_blank" rel="noopener">官方建築與基金介紹</a> · <a href="https://begovadzamija.ba/turizam/" target="_blank" rel="noopener">官方參觀資訊</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Gazi%20Husrev%20beg%20Mosque%20Sarajevo" data-map="Gazi Husrev beg Mosque Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-bezistan"><summary>10 · Gazi Husrev-beg Bezistan｜有屋頂的商業街</summary><div class="guide-body"><p class="guide-lead">這裡先看長廊與店面排列，不急著看紀念品。</p><h4>歷史背景</h4><p>Bezistan 是有頂市場的一種。它與 Gazi Husrev-beg 基金支持的城市商業體系有關，遮蔭、可管理的商業空間讓貨物交易較穩定。</p><h4>站在現場，看這些</h4><p>看狹長動線、連續店鋪與厚實牆體如何把街上的熱與光變得柔和。今日販售商品未必與歷史時期相同。</p><h4>導覽故事與理解角度</h4><p>別和 Brusa Bezistan 混淆：後者是另一座建築，現在屬 Sarajevo 博物館分館。你今日走的是市場長廊；不必為了同一個『Bezistan』名字誤買另一館門票。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://begovadzamija.ba/" target="_blank" rel="noopener">基金建築體系</a> · <a href="https://www.muzejsarajeva.ba/en/" target="_blank" rel="noopener">博物館分館區別</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Gazi%20Husrev%20beg%20Bezistan%20Sarajevo" data-map="Gazi Husrev beg Bezistan Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-cultures"><summary>11 · Meeting of Cultures｜用腳讀建築</summary><div class="guide-body"><p class="guide-lead">在地面標誌旁轉身兩次，比只拍腳踩標誌更有意思。</p><h4>歷史背景</h4><p>這是當代標示城市文化交會的裝置，不是奧匈與鄂圖曼曾在此設下的國界。Sarajevo 的帝國更替是歷史進程，不是同時存在的兩國在街中央劃線。</p><h4>站在現場，看這些</h4><p>向東看小尺度市集屋頂，向西看 Ferhadija 的較高立面與街道視線；留意住宅、商店、咖啡館的尺度變化。</p><h4>導覽故事與理解角度</h4><p>最好的讀法是『風格與生活方式在相鄰街區重疊』。市政廳恰好提醒你：奧匈也會建造東方風格外觀，所以不能把每棟建築簡單二分。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sarajevo" target="_blank" rel="noopener">城市歷史背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Meeting%20of%20Cultures" data-map="Sarajevo Meeting of Cultures">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-hall"><summary>12 · Vijećnica｜皇儲最後的接待與被焚毀的書</summary><div class="guide-body"><p class="guide-lead">在中庭站定，先想像兩個時間：1914 的接待，與 1992 的火災。</p><h4>歷史背景</h4><p>1896 年啟用的奧匈市政廳採摩爾復興式語彙，後來曾作國家暨大學圖書館。1992 年圍城砲擊引發大火，大量典藏被毀；經長期修復，2014 年重新開放。</p><h4>站在現場，看這些</h4><p>由中庭看彩玻璃與多層拱廊，再尋找展覽中的火災、殘牆與修復影像。華美外觀是歷史風格的選擇，不表示由鄂圖曼興建。</p><h4>導覽故事與理解角度</h4><p>1914/6/28 皇儲夫婦躲過第一次炸彈攻擊後，仍來到這裡接受接待，離開後才在 Latin Bridge 附近遇刺。走回橋頭時，你就走進同一日上午最後一段城市空間。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sarajevo_City_Hall" target="_blank" rel="noopener">建築、圖書館與接待歷史</a> · <a href="https://www.vijecnica.ba/en/home" target="_blank" rel="noopener">市政廳官方網站</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20City%20Hall%20Vijecnica" data-map="Sarajevo City Hall Vijecnica">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-cable"><summary>13 · Trebević 纜車｜城市重新連回山</summary><div class="guide-body"><p class="guide-lead">纜車的故事，是市民重新找回近郊生活的故事。</p><h4>歷史背景</h4><p>原纜車 1959 年開通，戰爭期間遭破壞，2018 年恢復營運。山不只是遊客觀景點，也曾是市民日常休閒的一部分。</p><h4>站在現場，看這些</h4><p>上升時看密集屋頂逐漸退成河谷輪廓，留意你並沒有前往 Trebević 主峰。上站附近的全景已能讀出城與山的關係。</p><h4>導覽故事與理解角度</h4><p>重建交通不只恢復運量，也讓家庭再次能花一個下午上山。這是理解戰後復原很具體的方式：生活重新多出可以選擇的去處。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sarajevo_Cable_Car" target="_blank" rel="noopener">纜車沿革</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Cable%20Car%20Hrvatin" data-map="Sarajevo Cable Car Hrvatin">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-track"><summary>14 · 冬奧雪橇道｜混凝土、塗鴉與森林</summary><div class="guide-body"><p class="guide-lead">彎道高度令人驚訝：這是讓高速運動員過彎的設計，不是普通步道。</p><h4>歷史背景</h4><p>雪橇道為 1984 冬奧建造。1990 年代戰爭損害場地，戰後部分路段成為城市探訪、藝術塗鴉與運動記憶交會的地方。</p><h4>站在現場，看這些</h4><p>在開放入口看彎道外側的高牆、坡度與排水，想像運動員低伏滑行。今日散步的速度與原本競賽速度，產生強烈反差。</p><h4>導覽故事與理解角度</h4><p>不要把每一個洞都說成槍孔，也不要把每幅塗鴉都說成政治抗議，沒有標示就保留未知。森林包圍人工曲線，是看得見的時間痕跡；但破損結構與濕滑表面不是拍照道具。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sarajevo_Olympic_Bobsleigh_and_Luge_Track" target="_blank" rel="noopener">雪橇道沿革</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Olympic%20Bobsleigh%20and%20Luge%20Track" data-map="Sarajevo Olympic Bobsleigh and Luge Track">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-yellow"><summary>15 · Yellow Fortress｜從防禦城牆到日落客廳</summary><div class="guide-body"><p class="guide-lead">別只等太陽落下，先看腳下墓園、山坡住宅與河谷。</p><h4>歷史背景</h4><p>黃堡是 Vratnik 防禦系統的一部分，主要形成於 18 世紀，1878 年抵抗奧匈進軍時亦具防禦功能。現存形態歷經損壞與修復。</p><h4>站在現場，看這些</h4><p>朝城市方向分辨近處 Kovači 墓園、老城屋頂與更遠現代街區。墓園是悼念場所，拍照保持尊重。</p><h4>導覽故事與理解角度</h4><p>防禦工事選址追求視野，如今相同的視野吸引人看日落。用途改變了，地形沒有改變；從這裡容易理解為何山坡在 Sarajevo 的不同戰爭中如此重要。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/%C5%BDuta_Tabija" target="_blank" rel="noopener">黃堡歷史</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Yellow%20Fortress%20Sarajevo" data-map="Yellow Fortress Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-tunnel"><summary>16 · Tunnel of Hope｜城市如何呼吸</summary><div class="guide-body"><p class="guide-lead">先看跑道與包圍線地圖，才走進低矮隧道。</p><h4>歷史背景</h4><p>1993 年投入使用的 D–B 隧道從機場跑道下方連接 Dobrinja 與 Butmir，讓物資及人員通行。機場由聯合國控制不等於居民能安全自由穿越跑道。</p><h4>站在現場，看這些</h4><p>比較原始 25 公尺段與約 100 公尺經結構更新的展示段；看照明、軌道或運輸說明，體會彎腰通過的勞動。當日開放範圍以館方為準。</p><h4>導覽故事與理解角度</h4><p>如果只能帶一批東西進城，糧食、藥物、燃料、通訊與人員如何分配？隧道的重要性不只是挖通，而是維持持續運輸。也別把『希望』浪漫化成舒適或人人都能隨意通過的通道。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://www.mcsarajevo.ba/tunel-spasa" target="_blank" rel="noopener">紀念中心官方歷史</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sarajevo%20Tunnel%20of%20Hope%20Tunel%20spasa" data-map="Sarajevo Tunnel of Hope Tunel spasa">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-national"><summary>17 · National Museum｜把一個國家放進四座館舍</summary><div class="guide-body"><p class="guide-lead">先看整個院落，再決定你今天要讀哪幾章。</p><h4>歷史背景</h4><p>館創立於 1888 年，現在的館舍群於 1913 年落成，結合考古、民族誌與自然史。它呈現的不只有政治年代，也包括土地、物種與日常文化。</p><h4>站在現場，看這些</h4><p>先看四座展館圍繞植物園的安排；在考古館讀物件產地，在民族誌展看用途，避免只按年代快速掃過。</p><h4>導覽故事與理解角度</h4><p>同一天看古代器物、住宅陳設與植物，會發現『國家的故事』比民族政治更大。建館本身也反映 19 世紀歐洲透過蒐藏與分類理解世界的方式。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/National_Museum_of_Bosnia_and_Herzegovina" target="_blank" rel="noopener">博物館沿革</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=National%20Museum%20of%20Bosnia%20and%20Herzegovina" data-map="National Museum of Bosnia and Herzegovina">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-haggadah"><summary>18 · Sarajevo Haggadah｜一本跨越迫害與戰火的書</summary><div class="guide-body"><p class="guide-lead">它是逾越節晚餐中講述故事的手抄本，不是整部《希伯來聖經》。</p><h4>歷史背景</h4><p>手稿約成於 14 世紀中葉的伊比利半島，常歸於加泰隆尼亞傳統。Haggadah 的意思與『敘述』有關，內容服務於逾越節儀式；2017 年列入 UNESCO 世界記憶名錄，與世界遺產建築名錄是不同制度。</p><h4>站在現場，看這些</h4><p>看彩繪人物、敘事連續性與文字布局；現場通常只能看到指定開頁，不能要求自由翻頁。珍貴不只在金色裝飾，也在它曾被使用、閱讀與保存。</p><h4>導覽故事與理解角度</h4><p>1894 年手稿由 Kohen 家族售予博物館。二戰時館員 Derviš Korkut 等人參與保護；1990 年代圍城期間又被轉存保護。細節在不同記述中有差異，不能把每個藏書傳說都當確證。最值得記住的是：一部猶太禮書能保存下來，靠的不只同一信仰的人。Geraldine Brooks 的《People of the Book》受此啟發，但小說補寫的人生不是可直接引用的史實。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://www.unesco.org/en/memory-world/sarajevo-haggadah-manuscript" target="_blank" rel="noopener">UNESCO 世界記憶登錄</a> · <a href="https://en.wikipedia.org/wiki/Sarajevo_Haggadah" target="_blank" rel="noopener">流轉與保存背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=National%20Museum%20of%20Bosnia%20and%20Herzegovina" data-map="National Museum of Bosnia and Herzegovina">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-stecci"><summary>19 · Stećci 墓碑｜中世紀巴爾幹的石刻語言</summary><div class="guide-body"><p class="guide-lead">先找一個圖案，而不是先背哪位國王統治。</p><h4>歷史背景</h4><p>Stećci 是約 12–16 世紀的區域性墓碑傳統，在波赫及鄰近國家分布。它被不同基督教社群使用，不能全數歸為單一教派。</p><h4>站在現場，看這些</h4><p>比較平板、箱形、屋脊形墓碑，再找人物、裝飾紋樣或銘文。不要把每個符號解讀成固定密碼；有些解釋仍有爭論。</p><h4>導覽故事與理解角度</h4><p>UNESCO 登錄的是指定原址墓園的跨國系列遺產，不代表國家博物館裡每一塊搬來的石碑本身就是同一登錄點。博物館適合近看雕刻，原址墓園則讓人理解山野與墓地的關係。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://whc.unesco.org/en/list/1504/" target="_blank" rel="noopener">UNESCO：年代、形制與跨宗教使用</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=National%20Museum%20of%20Bosnia%20and%20Herzegovina" data-map="National Museum of Bosnia and Herzegovina">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-svrzo"><summary>20 · Svrzo’s House｜門檻如何安排一家人的生活</summary><div class="guide-body"><p class="guide-lead">一進院子，先觀察街道的喧鬧如何被隔在外面。</p><h4>歷史背景</h4><p>這是一處富裕穆斯林家庭住宅的保存案例；院落、接待與家庭生活空間，反映隱私、待客與季節的安排。它不是所有波士尼亞家庭生活的平均樣本。</p><h4>站在現場，看這些</h4><p>看從街到院、從院到室內的層層轉換，以及木構、座席與窗戶。公共接待和較私密生活區有別，但不要把每間房硬說成永久『男人房／女人房』。</p><h4>導覽故事與理解角度</h4><p>住宅最動人的故事通常沒有戰爭：客人在哪裡喝咖啡，家人如何避暑，光線怎麼進房。你正好遇上三百周年特展，可把修復與保存本身也當作展覽的一部分。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://www.muzejsarajeva.ba/en/2026/09/04/otvorena-izlozba-od-doma-do-bastine/" target="_blank" rel="noopener">官方特展與住宅介紹</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Svrzo%27s%20House%20Sarajevo" data-map="Svrzo&#x27;s House Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-childhood"><summary>21 · War Childhood Museum｜物件如何替記憶說話</summary><div class="guide-body"><p class="guide-lead">先挑一件讓你有感覺的物品，讀完它的故事再往下走。</p><h4>歷史背景</h4><p>博物館從蒐集戰爭童年記憶的計畫發展而來，透過個人物件與證言保存經驗。展覽不是軍事勝負總表，也不應把單一人的回憶當成所有兒童共同經歷。</p><h4>站在現場，看這些</h4><p>試著對照『物件原本用途』與『戰爭中獲得的意義』：普通玩具、衣物或日記如何成為安全感與失落的載體。展品會調整，不保證遇到某件網路照片裡的物件。</p><h4>導覽故事與理解角度</h4><p>導覽最好的節奏是停頓：不需要讀遍每張卡片，也不必立刻得出大道理。離館前留兩分鐘，想想你原本以為戰爭只影響什麼，現在多看見了哪些日常。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://warchildhood.org/the-idea-mission-and-vision/" target="_blank" rel="noopener">館方理念</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=War%20Childhood%20Museum%20Sarajevo" data-map="War Childhood Museum Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-jewish"><summary>22 · 舊猶太會堂｜塞法迪人的新家</summary><div class="guide-body"><p class="guide-lead">這座低調院落，是多宗教 Sarajevo 很重要的一頁。</p><h4>歷史背景</h4><p>會堂建於 16 世紀末，現在作為波赫猶太博物館。塞法迪社群的歷史與伊比利流亡、鄂圖曼世界及 Ladino 語文化相連。</p><h4>站在現場，看這些</h4><p>若入館，看宗教器物與社群生活資料，也要看二戰對社群造成的斷裂。外觀停留時先找院落與周圍商業街的關係。</p><h4>導覽故事與理解角度</h4><p>不要把舊會堂與 Haggadah 真跡存放地混淆：手抄本在國家博物館。這裡補的是『誰在這座城市生活』，明天看到的古書則是跨世紀流轉的另一條線。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Jewish_Museum_of_Bosnia_and_Herzegovina" target="_blank" rel="noopener">博物館背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Jewish%20Museum%20Sarajevo" data-map="Jewish Museum Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-catholic"><summary>23 · Sacred Heart Cathedral｜中歐立面走進 Sarajevo</summary><div class="guide-body"><p class="guide-lead">抬頭看雙塔與玫瑰窗，城市的視覺語言在這裡明顯改變。</p><h4>歷史背景</h4><p>Josip Vancaš 設計的天主教主教座堂於 1889 年祝聖，主要採哥德復興風格。它與奧匈時期城市擴建相連，但不能把當地天主教歷史全算作奧匈才帶來。</p><h4>站在現場，看這些</h4><p>看雙塔的垂直線、尖拱與玫瑰窗，和清真寺的穹頂、庭院做比較；內部有禮拜時保持安靜，別從外觀推定可自由參觀。</p><h4>導覽故事與理解角度</h4><p>把照片裡的人留一點比例：教堂立面塑造廣場，也塑造人對城市的尺度感。附近若見紅色填補的砲擊痕跡，要視作紀念性痕跡，不當裝飾背景。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sacred_Heart_Cathedral,_Sarajevo" target="_blank" rel="noopener">主教座堂歷史</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sacred%20Heart%20Cathedral%20Sarajevo" data-map="Sacred Heart Cathedral Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-orthodox"><summary>24 · Orthodox Cathedral｜鄂圖曼晚期的宗教能見度</summary><div class="guide-body"><p class="guide-lead">這座大教堂開始建造時，Sarajevo 仍在鄂圖曼統治下。</p><h4>歷史背景</h4><p>1863 年開始興建，地方塞族商人是主要出資者，也有跨境及蘇丹的捐助。它提醒你，帝國晚期的宗教生活比『穆斯林統治／基督徒不存在』複雜得多。</p><h4>站在現場，看這些</h4><p>看穹頂、鐘樓與較寬的建築量體；若入內，看 iconostasis 聖像屏如何分隔聖所與會眾空間。不要與東側較小的舊東正教教堂混淆。</p><h4>導覽故事與理解角度</h4><p>商人的捐款不只買石材，也表達社群在城市中的地位。用『誰出資、谁使用、誰允許興建』三個問題，比只背建築風格更容易看懂它。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Cathedral_of_the_Nativity_of_the_Theotokos,_Sarajevo" target="_blank" rel="noopener">建造與捐助背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cathedral%20Church%20of%20the%20Nativity%20of%20the%20Theotokos%20Sarajevo" data-map="Cathedral Church of the Nativity of the Theotokos Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-ferhadija"><summary>25 · Ferhadija｜帝國交界並不是一條直線</summary><div class="guide-body"><p class="guide-lead">走路時把視線從招牌移到二、三樓。</p><h4>歷史背景</h4><p>這條步行商業街串起老城和近代街區，周圍建築讓你看見 Sarajevo 不同年代的城市生活。現在的店鋪用途與歷史建築用途可能不同。</p><h4>站在現場，看這些</h4><p>觀察樓高、窗框、立面對稱與街道寬度，回頭對照剛走過的 Baščaršija。這是現場閱讀方法，不把每一棟房子都武斷歸入同一時代。</p><h4>導覽故事與理解角度</h4><p>咖啡館、宗教建築與商業混在一起，才是『交會』真正的樣貌。地上的 Meeting of Cultures 標誌方便記憶，但日常生活從來不只分成東與西兩邊。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Sarajevo" target="_blank" rel="noopener">城市歷史背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ferhadija%20Sarajevo" data-map="Ferhadija Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-markale"><summary>26 · Markale／Gradska Tržnica｜生活市場與圍城記憶</summary><div class="guide-body"><p class="guide-lead">先分清：戶外市場與室內市場大樓是兩個相鄰但不同的空間。</p><h4>歷史背景</h4><p>室內市場大樓呈現奧匈時期城市市場建設；戶外市場及市場附近在 1994、1995 年兩次砲擊中有大量平民死傷。今天的生鮮交易與戰爭記憶在同一地區並存。</p><h4>站在現場，看這些</h4><p>室內看市場立面與攤位秩序，戶外看居民採買及紀念標示。下午收攤後也可讀建築，但不要期待清晨一樣的活力。</p><h4>導覽故事與理解角度</h4><p>紀念地點提醒人：圍城時排隊、買菜這些普通行為也可能致命。拍攝紀念牌與逛市場可以並存，但不在悼念位置擺戲劇化姿勢。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://de.wikipedia.org/wiki/Markale" target="_blank" rel="noopener">市場建築</a> · <a href="https://en.wikipedia.org/wiki/Markale_massacres" target="_blank" rel="noopener">兩次市場砲擊背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Markale%20Sarajevo" data-map="Markale Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-flame"><summary>27 · Eternal Flame｜這一團火紀念哪場戰爭？</summary><div class="guide-body"><p class="guide-lead">先看碑文中的年份，再拍火焰。</p><h4>歷史背景</h4><p>永恆之火於 1946/4/6 設立，紀念 Sarajevo 在二戰中的解放與犧牲；它的起源不是 1992–1996 年圍城。</p><h4>站在現場，看這些</h4><p>看碑文如何以共同努力描述不同社群的抵抗，再看它位於日常繁忙街口的位置。紀念不是被放到遙遠角落，而是在人們每天走過之處。</p><h4>導覽故事與理解角度</h4><p>把它與刺殺街角相比：一處的紀念隨政治體制反覆變動，一處強调反法西斯共同記憶。兩者都在問『城市要如何記住歷史』。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Eternal_flame_(Sarajevo)" target="_blank" rel="noopener">紀念碑歷史</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Eternal%20Flame%20Sarajevo" data-map="Eternal Flame Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-piva"><summary>28 · Piva 峽谷與 Plužine｜你看到的湖是工程改造的風景</summary><div class="guide-body"><p class="guide-lead">這片藍綠不是單純的天然高山湖。</p><h4>歷史背景</h4><p>Mratinje 水壩與水力發電工程改變 Piva 河谷，形成大型水庫，也改變聚落與交通。湖景之下有能源建設與搬遷的歷史。</p><h4>站在現場，看這些</h4><p>看水岸高度、岩壁、隧道與公路彼此的位置。水色受光線、水位與角度影響；陰天不一定呈鮮綠。</p><h4>導覽故事與理解角度</h4><p>停在 Plužine 時，不妨把問題從『哪裡拍最美』換成『這座湖出現之前，人住在哪裡？』稍後的修道院，是這個問題最具體的回答。沿途不為讀導覽臨停彎道，請由乘客閱讀或停妥再看。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Piva_Lake" target="_blank" rel="noopener">水庫背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Pluzine%20Montenegro" data-map="Pluzine Montenegro">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-monastery"><summary>29 · Piva Monastery｜連壁畫一起搬家的修道院</summary><div class="guide-body"><p class="guide-lead">外觀不張揚，進入後的壁畫才是重點。</p><h4>歷史背景</h4><p>修道院主要建於 16 世紀後期。為避開水庫淹沒區，20 世紀的大型保存工程將石材及壁畫拆卸、記錄、搬遷和重組，工程至 1982 年完成。</p><h4>站在現場，看這些</h4><p>先看樸素石牆，再看內部繪畫如何覆蓋建築表面。想像壁畫不是可直接捲起的畫布：搬遷必須處理顏料層、底層與牆體的關係。</p><h4>導覽故事與理解角度</h4><p>常說『逐石搬遷』，但最難的不只是搬石頭，而是保持結構、畫面與宗教使用的連續性。它讓 Piva 湖的風景多了一層代價與保存選擇；至今仍是宗教場所，攝影先問。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Piva_Monastery" target="_blank" rel="noopener">修道院建造與遷移</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Piva%20Monastery%20Montenegro" data-map="Piva Monastery Montenegro">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-durmitor"><summary>30 · Žabljak／Durmitor｜冰川留下的山形</summary><div class="guide-body"><p class="guide-lead">今天抵達只要認識地形，真正探索留給休息之後。</p><h4>歷史背景</h4><p>Durmitor 的高山、冰川地形與河谷共同構成國家公園，1980 年列入 UNESCO 世界遺產。Žabljak 是常用的旅遊基地；城鎮本身不能與整個公園或世界遺產邊界畫等號。</p><h4>站在現場，看這些</h4><p>天氣好時看山體輪廓；翌日進入山區再比較峽谷切割與冰川塑造的地貌。今晚不用硬加一座湖或一個山口來『補進度』。</p><h4>導覽故事與理解角度</h4><p>從 Piva 人工水庫到 Durmitor 冰川山景，兩天看到的是不同力量塑造的地表：工程、河流與冰。保留明天的精神，比今天多一張暗光照片更值得。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://whc.unesco.org/en/list/100/" target="_blank" rel="noopener">UNESCO Durmitor</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Zabljak%20Montenegro" data-map="Zabljak Montenegro">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-food"><summary>31 · Aščinica 與波士尼亞咖啡｜把午餐當成生活史</summary><div class="guide-body"><p class="guide-lead">不用把所有名菜一次點齊，先問今天鍋裡有什麼。</p><h4>歷史背景</h4><p>Aščinica 是供應熟食與家常菜的食堂類型。鑲菜、慢燉與湯類讓你看到超越烤肉的地方飲食，菜色供應會隨餐館和當天情況改變。</p><h4>站在現場，看這些</h4><p>看洋蔥鑲肉如何成形、燉鍋裡肉與蔬菜的比例，再比較咖啡壺、杯與托盤的上桌方式。這是文化觀察，不代表每間店都同樣傳統。</p><h4>導覽故事與理解角度</h4><p>咖啡的重點常在坐下聊天。細粉咖啡喝到底會遇到沉澱，不需要把杯底全部喝完；想少甜可先不加糖。銅匠街的器物、Morića Han 的客廳與你手中這一杯，可以串成同一段導覽。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://wanderlog.com/list/geoCategory/376313/best-restaurants-to-have-dinner-in-sarajevo-canton" target="_blank" rel="noopener">Sarajevo 餐飲背景</a> · <a href="https://begovadzamija.ba/morica-han/" target="_blank" rel="noopener">商旅館咖啡生活</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ascinica%20Hadzibajric%20Sarajevo" data-map="Ascinica Hadzibajric Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-brusa"><summary>32 · Brusa Bezistan｜絲綢交易變成城市收藏</summary><div class="guide-body"><p class="guide-lead">看屋頂六個穹頂，先把它與另一條有頂市場分開。</p><h4>歷史背景</h4><p>建築由 Rustem Pasha 於 16 世紀興建，名稱與絲綢來源地 Bursa 有關；今日成為 Sarajevo 博物館分館。</p><h4>站在現場，看這些</h4><p>外觀先看穹頂組合與厚實量體。若入館，把建築原來的商業功能和今天保存文物的用途作比較。</p><h4>導覽故事與理解角度</h4><p>商品與故事都曾流經這裡：以前是絲綢和貨物，現在是不同年代的城市記憶。本版不強迫加館，只提供經過時能讀的背景。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Brusa_bezistan" target="_blank" rel="noopener">建築背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Brusa%20Bezistan%20Sarajevo" data-map="Brusa Bezistan Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-gallery"><summary>33 · Gallery 11/07/95｜用影像面對 Srebrenica</summary><div class="guide-body"><p class="guide-lead">名字是日期：1995 年 7 月 11 日。</p><h4>歷史背景</h4><p>紀念藝廊以 Srebrenica 種族滅絕及其前後的歷史為中心，使用照片、地圖與影音等資料；不是 Sarajevo 圍城的另一個同名展館。</p><h4>站在現場，看這些</h4><p>先建立事件地理與時間，再看肖像及證言。影像有拍攝者的選擇，說明文字與被攝者身份同樣重要。</p><h4>導覽故事與理解角度</h4><p>這裡適合想進一步理解 Srebrenica 的人。若已參觀 War Childhood Museum，留待另一次比勉強在同一天看完更好；閱讀這篇不代表要把原行程再加滿。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://en.wikipedia.org/wiki/Gallery_11/07/95" target="_blank" rel="noopener">藝廊背景</a></p><p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Gallery%2011%2007%2095%20Sarajevo" data-map="Gallery 11 07 95 Sarajevo">開啟地圖</a> <a class="guide-return" href="#d9">返回行程 ↑</a></p></div></details><details class="guide-card" id="guide-inat"><summary>34 · Inat Kuća｜一棟不願讓路的房子</summary><div class="guide-body"><p class="guide-lead">站在河對岸，把小房子和巨大的市政廳一起看。</p><h4>歷史背景</h4><p>這棟房子以「倔強之家」聞名，故事連結奧匈市政廳工程與民居搬遷。今天作為傳統餐館，也成為地方性格的象徵。</p><h4>站在現場，看這些</h4><p>看房子的住宅尺度、斜屋頂與對岸行政建築的對比：一邊代表帝國工程，一邊代表個人住家的堅持。不進餐也可從公共空間觀察外觀。</p><h4>故事與理解角度</h4><p>流傳最廣的版本說，屋主 Benderija 不肯讓房子被拆，最後要求補償並把住宅逐塊搬到河對岸；還有他坐在橋上監督搬家的細節。這些應作為地方敘事理解，不把每句對白、金幣數量與戲劇化細節當成有檔案佐證。故事之所以流傳，是因為它讓一個普通人的堅持，能和強大的帝國並列在同一幅城市風景中。</p><p class="guide-cite">資料與延伸閱讀：<a href="https://www.atlasobscura.com/places/sarajevo-spite-house">Atlas Obscura：房屋搬遷的地方故事</a></p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Inat+Kuca+Sarajevo">開啟地圖</a> <a class="guide-return" href="#d10">返回行程 ↑</a></div></details></section><section id="sources" class="links"><h2>查核來源與資訊界線</h2><p>以波士尼亞語／黑山當地道路報告及英語官方參觀頁為主，並做德語及其他語言旅遊資料搜尋。沒有任何搜尋能代表「所有語言、所有網站」；缺乏當日官方菜單的餐廳只列預算，不捏造確定價。</p><ol><li><a href="https://www.zicara.ba/bs/servisne-informacije">Trebević 纜車官方營運時間</a>；<a href="https://www.zicara.ba/bs/promotivna-ponuda">2026/9/3 聯票公告</a>。主文到 12/31，末尾仍有 8/31 舊文，已揭露衝突。</li><li><a href="https://www.vijecnica.ba/en/home">市政廳官方時間</a>。本次未取得清楚的單買票價，故分買價格列預算。</li><li><a href="https://zemaljskimuzej.ba/en/">國家博物館首頁</a>；<a href="https://zemaljskimuzej.ba/en/information-for-visitors/tickets/">正式票價與 Haggadah 時段</a>；<a href="https://zemaljskimuzej.ba/en/the-sarajevo-haggadah-available-for-visits-again/">2026/5/27 重新開放公告</a>。兩頁預約措辭不同，已列電話查證方案。</li><li><a href="https://www.mcsarajevo.ba/tunel-spasa">Tunnel of Hope 官方票價、現金規則、時間與保存段說明</a>。</li><li><a href="https://warchildhood.org/visitor-information/">War Childhood Museum 官方參觀資訊</a>。</li><li><a href="https://www.muzejsarajeva.ba/en/Depandansi/muzej-sarajevo/">1878–1918 分館</a>；<a href="https://www.muzejsarajeva.ba/en/2026/09/04/otvorena-izlozba-od-doma-do-bastine/">Svrzo’s House 特展 9/4–10/4</a>。</li><li><a href="https://begovadzamija.ba/turizam/">Gazi Husrev-beg Mosque：波士尼亞語季節時段與票价</a>。</li><li><a href="https://bihamk.ba/spi/stanje-na-cesti-u-bih">BIHAMK 9/8 20:11 路況</a>；<a href="https://www.dan.co.me/crna-gora/na-vise-dionica-izmijenjen-rezim-saobracaja-najavljene-obustave/">DAN 9/8 引述 AMSCG：Tara 大橋封閉等工程</a>。AMSCG 主站本次回傳 403，封橋資訊保留為具日期的地方媒體轉述，不冒稱直接取得官方原文。</li><li>天氣：9/8 查詢回傳的 Sarajevo 9/9–9/11 逐日預報，屬查詢時快照；<a href="https://www.fhmzbih.gov.ba/">FHMZ</a>／<a href="https://www.meteo.co.me/">ZHMS Montenegro</a> 為出發前更新入口，不宣稱其頁面與本次快照逐字相同。</li><li><a href="https://www.tripadvisor.com/Restaurant_Review-g294450-d1524643-Reviews-Dveri-Sarajevo_Sarajevo_Canton_Federation_of_Bosnia_and_Herzegovina.html">Dveri 旅客評論</a>；<a href="https://wanderlog.com/list/geoCategory/376313/best-restaurants-to-have-dinner-in-sarajevo-canton">餐飲經驗彙整</a>。用於餐廳性質與體驗，沒有把彙整網站星數當成客觀排名。</li></ol><button onclick="document.querySelectorAll('details').forEach(d=>d.open=true);window.print()">列印／另存 PDF</button><p class="muted">HTML 可離線閱讀；地圖、來源與最新天氣須連網。價格與營業可能臨時變動，已確認、待核與估算均分別標示。</p></section>
</main><footer>Sarajevo → Piva → Žabljak · 9–11 September 2026<br>留時間理解一座城市，也留餘裕走完一段山路。</footer></template>
<template id="content-montenegro-north-2026"><nav><a href="#mn11">09-11 Piva 與跨境</a><a href="#mn12">09-12 黑湖與限定賽事</a><a href="#mn13">09-13 環線／雨天備案</a><a href="#mn14">09-14 Tara 南岸至 Peja</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="decisions"><h2>先讀：這次真正改了什麼</h2><p>2026/9/10 查核；時間均為當地 CEST。9/11 從 Apartment Nina and Nino 出發，9/11–9/13 住 ViS，9/14 前往 Peja。住宿地圖以名稱搜尋，請以自己的訂房定位選定正確入口；這份公開行程不包含房號或入住密碼。</p><p>9/11 採 06:45 出發，經 Foča、Hum／Šćepan Polje、Plužine、Piva Monastery、Jasenovo Polje、Šavnik。Zaborje–Jasenovo Polje 已有 7/18 完工報導，不再拿舊的 11:00–17:00 封路要求 05:45 趕路。完工不代表日後沒有臨時管制。</p><p>9/12 改以黑湖、森林短走與賽事氣氛為主；9/13 暫留給 Durmitor Ring，但週日也有雨，環線只是條件式安排。兩天都不適合時，就取消完整高山環線，不為打卡硬開。</p><p>Tara Bridge 官方公告 8/10 06:00 至 10/26 12:00 全面封閉。9/14 刪除過橋與預設 Zipline。沿南岸 R10 去 Mojkovac 未必需要過橋，但 Sokolovina 路段目前未取得可靠的 9/10 通行確認，9/13 晚上必須查明。</p><p>Blacklake Xtreme Triathlon 官方列在 9/12，9/13 10:00 有完賽儀式。2026 賽事手冊仍寫自行車跨 Tara Bridge，與封橋公告矛盾：賽事日期有官方依據，最終路線、是否改賽及觀眾可進區域仍須以主辦現場公告確認。不能拿賽事路線當作道路開放證明。</p><a class="map" target="_blank" rel="noopener" href="https://www.gov.me/clanak/od-10-avgusta-potpuna-obustava-saobracaja-preko-mosta-durdevica-tara">橋梁封閉公告</a><a class="map" target="_blank" rel="noopener" href="https://en.vijesti.me/news-b/economy-d/818219/The-Traffic-Administration-published-a-video-of-the-completed-section-of-Zaborje-Jasenovo-Polje.">Zaborje 完工報導</a><a class="map" target="_blank" rel="noopener" href="https://blackxtri.com/race-info">賽事官方時程</a><a class="map" target="_blank" rel="noopener" href="https://amscg.org/">AMSCG 路況</a></section><section id="weather-plan"><h2>四天天氣與出發門檻</h2><p>下表是 9/10 取得的 Žabljak 城鎮預報，不是整段跨國道路或山口的逐時預報。Sedlo、Sušica 與 Kula 需另外注意低雲、風及能見度；不把城鎮溫度直接當成山頂實況。</p><p>完整環線的門檻：當天上午至預計回城時段沒有雷暴警示，路面無冰雪、落石封路，能見度足夠看清彎道與會車點，住宿或公園人員確認通行。只有「雨比較少」不算合格。出現雷聲就停止湖岸、山口及森林步行，回到硬頂車輛或建築內；樹下不是避雷處。</p><p>帶防水外套、中層保暖衣、防滑鞋、乾襪、薄手套；出城前下載離線道路與健行圖。午後天氣不穩，拍照與步行優先安排上午。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>Žabljak 預報</th><th>行程調整</th></tr></thead><tbody><tr><td>9/11 五</td><td>23／12°C；午後局部雷雨</td><td>早離開 Sarajevo；Piva 停靠短而少；不追加高山路</td></tr><tr><td>9/12 六</td><td>17／8°C；多雲、陣雨及雷雨，較晚明顯</td><td>黑湖短走；Zminje 只在天氣穩定時加入</td></tr><tr><td>9/13 日</td><td>16／4°C；多雲、少量降雨</td><td>環線須通過天氣與路況門檻；否則留城／短走</td></tr><tr><td>9/14 一</td><td>16／6°C；局部雷陣雨</td><td>提早跨境；不要在 Kula 山口久停</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.meteo.co.me/">黑山官方氣象與警示</a></section><section id="maps-explained"><h2>Google Maps 為何比較快？</h2><p>截圖只設定「你的位置 → ViS」，藍線在 Plužine 往東切進山區；依位置判斷，很可能是 Trsa／Sedlo 方向，但沒有逐段道路清單，無法只憑截圖確認每條路名。地圖上的 5、6、7、8、9 圖釘不代表全部已加入這次導航的停靠點。</p><p>Google 的 4 小時 8 分是該時刻選中路線的行車估算，不含你的午餐、拍照、採買及不確定的邊境等候。原案多繞南側，是為把高山留給獨立一天、降低長途駕駛後再跑窄路的壓力，同時避免重複；不是因為最短路線一定不能走。</p><p>這次仍建議 9/11 經 Šavnik：下午雷雨風險加上跨境疲勞，不適合臨時追加 Sedlo。若後來因連日惡劣天氣取消 Ring，也不代表明天就應冒雨走捷徑。相反地，若主要道路封閉、官方建議替代且山路天候合格，避免重複的偏好可以讓位。</p><p>導航操作：一次只開下一段；先 Foča，再 Hum／Šćepan Polje，再 Plužine，再 Piva Monastery，再 Jasenovo Polje，再 Šavnik，最後訂房中的 ViS 定位。尤其 Jasenovo Polje 不能省略。每段開始前看一下全線，確認未被改導 Trsa／Sedlo。</p><div class="tablewrap"><table><thead><tr><th>9/11 選項</th><th>優點</th><th>代價／本次判斷</th></tr></thead><tbody><tr><td>Plužine → Trsa → Sedlo → Žabljak</td><td>較短，高山景觀直接</td><td>窄路、會車、山口天氣；本次不採</td></tr><tr><td>Plužine → Jasenovo Polje → Šavnik → Žabljak</td><td>把山口留到精神好的一天</td><td>路程較長；本次採用，仍有山路與隧道</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Fo%C4%8Da%20Bosnia">下一段：Foča Bosnia</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Hum%20border%20crossing%20Bosnia%20Montenegro">下一段：Hum border crossing Bosnia Montenegro</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Plu%C5%BEine%20Montenegro">下一段：Plužine Montenegro</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Piva%20Monastery">下一段：Piva Monastery</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Jasenovo%20Polje%20Nik%C5%A1i%C4%87%20Montenegro">下一段：Jasenovo Polje Nikšić Montenegro</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%A0avnik%20Montenegro">下一段：Šavnik Montenegro</a></section><section id="fuel-food"><h2>加油、補貨與高 CP 值吃法</h2><p>以下按柴油車計算，實際油種以油箱蓋與租車文件為準。黑山 9/8–9/14 Eurodiesel 官方最高 €1.87/L。波赫 9/10 全國柴油平均約 3.44 KM/L（約 €1.76），不是 Sarajevo 或 Foča 某一站的即時报價。沒有足夠的同日站價證據，不能宣稱某站最便宜。</p><p>比較門檻是 3.66 KM/L：波赫站牌低於此價就比黑山上限低。若加 40L，3.44 KM 與 €1.87 的差額約 €4.45，沒有必要繞十多公里省油錢。一般柴油即可，不因店員推薦就改加 premium。</p><p>今晚在 Sarajevo 順路加到油槍第一次自動跳停最省事；不要反覆補到瓶口。若已超過 3/4 桶，明天直接出發，Foča 看油量再決定。若少於半桶，在進 Foča–Hum 前補滿。Foča 可查 Nešković Brod na Drini 或 NIS Petrol Južni most slobode；這是沿途候選，不是已核實最低價排名。</p><p>Plužine 不必再次硬加滿：若仍有半桶以上且續航有餘裕，直接去 Žabljak。跑 Ring 前至少半桶，舒適做法約 3/4 桶；9/14 若需長繞路則出發前加滿。不要把偏遠環線當成找油站的地方。Rožaje 只補到足夠進 Peja 並留餘量，不為「最後一站」再強制加滿。</p><p>9/11 抵達後先去 Voli Žabljak。官方店表列 07:30–21:30，但星期日不要依賴超市營業；星期五買週末用品，星期六補星期一早餐。兩人兩天先買約 8L 飲水，另加車內備用、麵包、水果、堅果、能量棒；有冰箱再買優格、起司等冷藏食品。生鮮在黑山買，避免把不必要的肉乳品帶著跨境。</p><p>吃法：午餐採麵包店／烤肉店，晚餐挑一餐當地料理。Žabljak 的 Podgora 可作簡餐候選；Hotel MB 餐廳適合羊肉與高地料理，與橋邊 Motel Tara MB 是不同地方；Or’O 可作市中心方便備選，未必最便宜。沒有取得同日完整菜單，下面餐費均為預算，不是店家報價。</p><p>建議兩人點一份湯或兩碗小湯、一份 kačamak 共享，再配一份肉或魚及沙拉；先問份量，避免兩大盤澱粉加兩大盤肉。慢烤羊肉想吃才請 ViS 前一天協助詢問供應、份量、價格與出餐時間。一般麵包、烤肉簡餐不需預訂。</p><a class="map" target="_blank" rel="noopener" href="https://www.gov.me/clanak/nove-cijene-goriva-od-08092026">黑山柴油價格</a><a class="map" target="_blank" rel="noopener" href="https://nafta.hr/cijene-goriva-bih/">波赫油價比較</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Voli%20%C5%BDabljak">Voli Žabljak 地圖</a><a class="map" target="_blank" rel="noopener" href="https://mbturist.com/">Hotel MB 官方／菜色</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Restoran%20Podgora%20%C5%BDabljak">Podgora 地圖</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Ne%C5%A1kovi%C4%87%20Brod%20na%20Drini%20Fo%C4%8Da">Foča 油站</a></section><section id="reservations"><h2>現在值得先確認的預約</h2><p>優先順序：租車文件及新車跨境保險 → 9/13 環線當日能否通行 → 9/14 R10/Sokolovina → 想吃的慢烤羊肉。不要先付不可退的 Ring 或 Zipline，因為天氣與施工仍有變數。</p><p>國家公園常規散步、Piva 修道院一般不需提前預約；入園與停車按現場售票。舊表中的 Ring van €20／jeep €30、導遊 €40／4 小時不是已確認可訂到的 2026 服務；若想請司機，請住宿代詢總價、是否含門票、天氣取消與乘客數後再決定。</p><p>9/12 Blacklake Xtreme 是正式極限三鐵，不能把現場觀賽當成臨時報名活動。04:30 起跑不值得讓剛開完跨境山路的你們再少睡；選正常起床後經過公共湖岸，是否開放看現場。轉換區有限制，不闖入選手區。9/13 10:00 完賽儀式若想看，就放棄那天早出發的完整環線，兩者不要都塞。</p><p>未查到能確認落在 9/11–9/14 的市慶演唱會；9/17 市慶及泛稱活動週不能當成這幾天確定節目。</p><a class="map" target="_blank" rel="noopener" href="https://blackxtri.com/s/BLACKLAKE-Event-manual-2026.pdf">Blacklake 2026 手冊</a><a class="map" target="_blank" rel="noopener" href="https://zabljak.travel/me/">Žabljak 旅遊局</a></section><section class="day" id="mn11"><span class="tag">2026-09-11</span><h2>9/11｜Sarajevo → Piva → Šavnik → Žabljak</h2><p>06:45 出發，目標 16:30–17:30 入住。規畫時間已留停靠與通關緩衝，不是導航保證。今天不進 Trsa／Sedlo。</p><div class="slot" id="departure"><div class="time">06:00–06:45</div><div><h3>Apartment Nina and Nino｜早餐與出發</h3><p>吃完早餐、裝車，確認護照、車輛登記、租車跨境授權和保險在副駕可取得的位置。帶好午餐備糧，避免邊境排隊時還餓著找店。</p><p><b>交通：</b>先導航 Foča；市區離開加山路先抓約 2 小時。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Apartment%20Nina%20and%20Nino%20Sarajevo" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="foca"><div class="time">08:45–09:05</div><div><h3>Foča／Brod na Drini｜功能性休息</h3><p>洗手間、咖啡、必要時加油，最多 20 分鐘。9/9 BIHAMK 公告 Dobro Polje–Miljevina 僅允許 3.5 噸以下車輛；一般小客車仍須以登記總重及現場指示為準。</p><p><b>費用：</b>咖啡／簡單早餐預算 €3–6／人；油另計</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Fo%C4%8Da%20Bosnia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://bihamk.ba/spi/stanje-na-cesti-u-bih" target="_blank" rel="noopener">官方資訊</a></div></div><div class="slot" id="hum"><div class="time">09:05–11:15</div><div><h3>Hum／Šćepan Polje｜慢山路與跨境</h3><p>Foča–Hum 不按平地速度估算。通關預留約 30–60 分鐘只是規畫緩衝，旺時可更久；停靠與排隊時間會直接影響午餐、修道院是否保留。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hum%20border%20crossing%20Bosnia%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-hum">導覽</a></div></div><div class="slot" id="piva-canyon"><div class="time">11:15–12:15</div><div><h3>Piva Canyon｜隧道、峽谷與水庫</h3><p>全段最多兩次各 5–10 分鐘正式安全停靠。沒有停車灣就不拍；隧道口、落石坡及彎道都不適合停。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Piva%20Lake%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://parkpiva.com/listing/pivsko-jezero/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-piva-canyon">導覽</a></div></div><div class="slot" id="pluzine"><div class="time">12:15–13:00</div><div><h3>Plužine｜午餐與湖岸短走</h3><p>找有清楚菜單的簡餐店，肉湯／烤肉／鱒魚任選；若服務忙就吃車上備糧。此處不加遊船或長午餐，也不因「補給站」就無條件再加滿油。</p><p><b>費用：</b>簡餐預算 €8–15／人；不是店家即時報價</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Plu%C5%BEine%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-pluzine">導覽</a></div></div><div class="slot" id="piva-monastery"><div class="time">13:15–13:45</div><div><h3>Piva Monastery｜會搬家的修道院</h3><p>只有離開 Plužine 不晚於 13:15、駕駛精神與天氣都好才停。它在往南通過 Zaborje 之前，不能先過工程區又回頭參觀。</p><p><b>費用：</b>固定門票未確認；可自願小額捐獻</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Piva%20Monastery" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-piva-monastery">導覽</a></div></div><div class="slot" id="savnik"><div class="time">13:45–16:30</div><div><h3>Jasenovo Polje → Šavnik → Žabljak</h3><p>明確把 Jasenovo Polje 與 Šavnik 設成下一站。這段仍是山區，不把「主路」理解成高速公路；下長坡用合適低檔減少持續踩煞車。</p><p><b>交通：</b>約 2.5–3 小時含一次短休息，遇工程與慢車再加緩衝。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%A0avnik%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-savnik">導覽</a></div></div><div class="slot" id="vis-supply"><div class="time">16:30–18:30</div><div><h3>ViS 入住 → Voli 補貨</h3><p>先入住、確認次日天氣與公園通行，再採買兩天早餐／午餐。若入住較晚，先超市再晚餐；不要等星期日補貨。</p><p><b>費用：</b>兩人兩天飲水與簡易早餐／午餐預算 €25–40</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Voli%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://kompanija.voli.me/voli-marketi/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="slot" id="mb-dinner"><div class="time">18:30–19:30</div><div><h3>Žabljak 晚餐｜Hotel MB 或簡餐</h3><p>有精神選 Hotel MB 的湯、共享 kačamak、羊肉或鱒魚；疲倦就到 Podgora 一類簡餐店，吃完早休息。</p><p><b>費用：</b>兩人正餐預算 €30–45；簡餐約 €20–30</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hotel%20MB%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://mbturist.com/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mb-dinner">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>午後下雨即取消路肩拍照；雷暴或能見度惡化時在城鎮安全休息，不改走高山捷徑。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>延誤 45 分鐘：午餐縮短；延誤 60–90 分鐘：取消修道院。原則是保留白天山路與休息，不能靠超速補回。</p></div></section><section class="day" id="mn12"><span class="tag">2026-09-12</span><h2>9/12｜黑湖、Zminje 森林與限定賽事</h2><p>本次預報不適合把完整環線鎖在星期六。主行程是黑湖；Zminje 及觀賽都屬可刪除項。</p><div class="slot" id="blacklake-morning"><div class="time">07:15–09:00</div><div><h3>Black Lake／Crno Jezero｜早晨湖景</h3><p>07:15 早餐，07:45 左右到入口；有賽事工作車與選手動線，按現場安排停車。先走主入口湖岸與部分環湖，濕滑時不強求完整一圈。</p><p><b>費用：</b>入園先抓 €5／人／日、停車 €1／小時作暫估，2026 售票須現場確認</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Crno%20Jezero%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nparkovi.me/parks/Durmitor/active_holidays" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-blacklake-morning">導覽</a></div></div><div class="slot" id="zminje"><div class="time">09:00–12:00｜條件式</div><div><h3>Mlinski Potok → Zminje Lake</h3><p>只有上午逐時預報穩定、未聞雷聲且步道狀況良好才走。單程抓 60–80 分鐘，湖邊休息 20 分鐘再回；不把此線與完整環湖全部硬塞到正午前。</p><p><b>交通：</b>由黑湖走標示步道，依實走路線全日可達約 8–10 公里、4–5 小時。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Zminje%20jezero%20Durmitor" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-zminje">導覽</a></div></div><div class="slot" id="race-watch"><div class="time">上午短看／下午視公告</div><div><h3>Blacklake Xtreme｜只在公共區域感受氣氛</h3><p>官方 2026 時程是今天 04:30 起跑。正常起床到場時，游泳可能已結束，不能保證看到起跑。若主辦確認照常舉行，可看公共區域與後段抵達氣氛；不預設某時刻一定有冠軍衝線。</p><p><b>費用：</b>公共區域觀看未查到獨立觀眾票；國家公園門票另依現場，不能承諾免費入園</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Black%20Lake%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://blackxtri.com/race-info" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-race-watch">導覽</a><p><b>預約：</b>不替使用者報名。賽事手冊的過橋路線與封閉公告矛盾，出門前確認賽事是否改線、延期及公共動線。</p></div></div><div class="slot" id="sat-lunch"><div class="time">12:30–14:00</div><div><h3>Žabljak 午餐與休息</h3><p>回市區吃湯、烤肉或麵包店簡餐；下午若有雷雨就在室內休息。不把划船安排成必做。</p><p><b>費用：</b>午餐預算 €8–15／人</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Restoran%20Podgora%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="sat-stock"><div class="time">16:00–18:00</div><div><h3>補星期一早餐；確認週日環線</h3><p>趁星期六完成缺少的水、早餐及行車零食。想吃明日慢烤羊肉，今天先問；若環線無法確定回城時刻，就不要預訂太早的晚餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Voli%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>請 ViS 或公園確認 Sedlo、Sušica 是否通行；沒有可靠答覆時，不將完整環線視為已確認。</p></div></div><div class="soft"><b>雨天備案</b><p>有雷雨或持續降雨時取消 Zminje，黑湖也只在安全天氣空檔短看。訪客中心是否開門先問，不能把森林當成全天候室內備案。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>賽事擁擠就離開湖口，優先保留安靜短走與休息；不在入口排長隊只為拍一張照片。</p></div></section><section class="day" id="mn13"><span class="tag">2026-09-13</span><h2>9/13｜Durmitor Ring：通過天氣門檻才出發</h2><p>星期日仍預報少量雨，並非保證好天。07:15 做決策；合格才跑下列逆時針環線。取消時保留黑湖短走／休息與 10:00 完賽儀式選配。</p><div class="slot" id="ring-start"><div class="time">07:15–08:00</div><div><h3>ViS｜決策、早餐與油量</h3><p>看山口能見度、逐時雷雨與官方／在地道路確認。油量至少半桶、建議約 3/4；帶足整日飲食。今天不加 Ćurevac 支線，讓環線有緩衝。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=ViS%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://zabljak.travel/me/panoramski-putevi/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ring-start">導覽</a></div></div><div class="slot" id="mala"><div class="time">08:00–09:15</div><div><h3>Žabljak → Mala Crna Gora</h3><p>經北側高地向偏遠村落行駛，只在真正可停的地方下車。剛出城就遇濃霧，立刻原路折返，不以「前面也許會晴」賭完整環線。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mala%20Crna%20Gora%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mala">導覽</a></div></div><div class="slot" id="susica"><div class="time">09:15–10:30</div><div><h3>Sušica Canyon → Nedajno</h3><p>下切峽谷再上升至 Nedajno，高差與會車是這段重點。安排一次 15–20 分鐘安全觀景，其餘時間留給慢開。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Nedajno%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nparkovi.me/parks/Durmitor/active_holidays" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-susica">導覽</a></div></div><div class="slot" id="trsa"><div class="time">10:30–12:15</div><div><h3>Nedajno → Trsa｜提早午餐</h3><p>午餐最多 45–60 分鐘，Milogora 一帶餐館作候選，未確認營業時吃自備餐。不要下切至 Plužine 湖岸。</p><p><b>費用：</b>餐館預算 €10–18／人；備糧已列採買預算</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Milogora%20Trsa%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-trsa">導覽</a><p><b>預約：</b>想吃慢烤羊肉需前一天確認供應；不為等一鍋肉拖過山口的合適天氣窗口。</p></div></div><div class="slot" id="prutas"><div class="time">12:15–14:00</div><div><h3>Pišče → Todorov Do／Prutaš</h3><p>保留山谷觀景時間，停止額外支線。若雲開始壓低，在還有安全回撤選項時作決定，不能把「快到山口」當成硬闖理由。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Pruta%C5%A1%20viewpoint%20Durmitor" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://parkpiva.com/listing/prutas-2393m/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-prutas">導覽</a></div></div><div class="slot" id="sedlo"><div class="time">14:00–15:15</div><div><h3>Dobri Do → Sedlo｜山口短停</h3><p>先經 Dobri Do 一帶再到 Sedlo，避免原案把 Dobri Do 放在山口後造成回頭。山口停約 20–30 分鐘，風雨起就直接走。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sedlo%20Durmitor" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nparkovi.me/parks/Durmitor/active_holidays" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-sedlo">導覽</a></div></div><div class="slot" id="ring-return"><div class="time">15:15–17:00</div><div><h3>Pošćenska 谷地 → Žabljak</h3><p>順路返回，不再繞湖岸或滑雪場。17:00 前回城是目標，留出洗澡、早晚餐與明日道路查核。</p><p><b>費用：</b>入園範圍／驗票依現場；暫留 €5／人作第二日預算</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%BDabljak%20Montenegro" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="r10-check"><div class="time">17:00–18:00</div><div><h3>確認明天 R10 與 Kula</h3><p>問題要問清楚：「明天從 Žabljak 到 Đurđevića Tara 南岸，經 Dobrilovina／Sokolovina 到 Mojkovac，小客車是否全程可走？有沒有封閉時段？」只問 Tara Bridge 會得到另一件事的答案。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%BDabljak%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://amscg.org/" target="_blank" rel="noopener">官方資訊</a><p><b>預約：</b>若沒有明確通行確認，今晚選定替代路線與提早出發時間，不到橋邊才臨時決定。</p></div></div><div class="soft"><b>雨天備案</b><p>取消完整環線。若沒雷雨且步道可行，在前日未完成的黑湖短走；或 10:00 到主辦允許的公共區域看完賽儀式。不要把上午 10:00 儀式、完整 Ring、晚餐都排進同一天。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>環線中段天气轉差按安全路況折返或沿已確認出口離開；不為省幾公里接受導航未查核的小路。晚餐簡化，保留跨境前睡眠。</p></div></section><section class="day" id="mn14"><span class="tag">2026-09-14</span><h2>9/14｜Tara 南岸 → Kula → Peja</h2><p>只有 R10／Sokolovina 已確認可通行才採下列時程。Tara Bridge 本體不過、不步行上橋、不預設 Zipline。</p><div class="slot" id="mn14-start"><div class="time">06:15–07:00</div><div><h3>ViS 退房與出發</h3><p>吃昨天買好的早餐，確認油量與車況；先導航橋的 Žabljak／南岸側，不把對岸 Pljevlja 設為目的地。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=ViS%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="tara-view"><div class="time">07:40–08:05</div><div><h3>Đurđevića Tara｜南岸安全觀景</h3><p>只到施工區外、允許進入的公共觀景位置。沒有可用停車點就取消；封閉橋面不作攝影平台。</p><p><b>費用：</b>路邊公共觀景是否有停車費依現場；本次不預訂 Zipline</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C4%90ur%C4%91evi%C4%87a%20Tara%20Bridge" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.gov.me/clanak/od-10-avgusta-potpuna-obustava-saobracaja-preko-mosta-durdevica-tara" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-tara-view">導覽</a></div></div><div class="slot" id="mojkovac"><div class="time">08:05–10:00</div><div><h3>R10／Dobrilovina／Sokolovina → Mojkovac</h3><p>已確認開放才走南岸河谷線；橋本體封閉不等於這條線必然封閉。預留慢車與一次洗手間，不加入修道院等觀光。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mojkovac%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://whc.unesco.org/en/list/100/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mojkovac">導覽</a></div></div><div class="slot" id="berane"><div class="time">10:00–12:15</div><div><h3>Ribarevine → Berane｜休息與午餐</h3><p>在主路附近找麵包店、肉湯或烤肉簡餐，不進城尋找必吃名店。每 1.5–2 小時左右安排短休息，時間可隨路況調整。</p><p><b>費用：</b>午餐預算 €7–13／人</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Berane%20Montenegro" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="rozaje"><div class="time">12:15–13:30</div><div><h3>Rožaje｜最後補水與油量確認</h3><p>水、洗手間與文件都在山口前處理。油量若已足夠到 Peja 並有餘量，就不需加滿；網路與離線地圖應出發前已下載。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ro%C5%BEaje%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-rozaje">導覽</a></div></div><div class="slot" id="kula"><div class="time">13:30–15:30</div><div><h3>Kula／Kulina → Kosovo</h3><p>山口路段留意低雲與慢車；通關時間只是緩衝估計，沒有可靠的未來排隊承諾。核對現車車牌、租車授權與 MTPL，尤其換過車時不能沿用不相符的舊文件。</p><p><b>費用：</b>有效 Albania 車牌 MTPL 符合 BKS 互認時，不應自動重買一份邊境責任險；不符合者須依 BKS 報價</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kula%20border%20crossing%20Montenegro%20Kosovo" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://bks-ks.org/pagemodels/open?id=256e0671-2a5a-444e-a3e1-cceffc9b4b8e" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-kula">導覽</a></div></div><div class="slot" id="peja"><div class="time">16:00–17:30</div><div><h3>Peja 抵達｜入住與輕鬆晚餐</h3><p>先去自己的住宿，不加 Rugova 山路或修道院趕場。抵達後用簡單晚餐結束四天山區駕駛。</p><p><b>費用：</b>晚餐暫抓 €8–15／人；住宿依既有訂房，不含在本表</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Peja%20Kosovo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-peja">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Kula 濃霧降低速度，必要時在 Rožaje 安全等待；不要因延誤選未確認的山口捷徑。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>R10 不確認可通時，取消 Tara 全部活動。替代一：經 Šavnik → Boan／Tušina → Semolj → Mioska → Kolašin → Mojkovac → Ribarevine → Berane，這仍是窄山路，只有通行與天氣合格才採。替代二：經 Šavnik → Jasenovo Polje → Nikšić → Danilovgrad → Smokovac → A1 → Mateševo → Kolašin → Mojkovac → Ribarevine → Berane → Rožaje → Kula → Peja，路程顯著更長；06:00 左右出發，整日先留 10–12 小時並按導航與官方公告修訂，A1 通行費另計。若天氣或延誤使山口將入夜，不硬守 Peja 當晚抵達，先在有服務的城鎮停留。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>黑山普通柴油</td><td>€1.87 上限</td><td>公升</td><td>官方 9/8–9/14；9/15 可能調價</td></tr><tr><td>四天
