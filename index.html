</section><details class="original-plan"><summary>原規劃保留｜吉薩金字塔日（與新版GEM時段重疊，勿同時照走）</summary><div class="slot" id="eg1014-1"><div class="time">07:15–08:00</div><div><h3>前往當日開放入口</h3><p>讓住宿確認新遊客入口／Fayoum Road方向的實際上車點；Google地圖景點中心不是保證可用的入口。先買基本票，再按體力決定一座金字塔內部加票。</p><p><b>費用：</b>基本外國成人EGP 700／人；內部墓室另計，2026/10/12核對部會頁。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Giza%20Pyramids%20Visitor%20Centre" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/archaeological-sites/giza-plateau" target="_blank" rel="noopener">官方資訊</a><p><b>預約：</b>入園前核對接駁範圍、末班車、離場口；入口定位以當日正式通知為準。</p></div></div><div class="slot" id="eg1014-2"><div class="time">08:00–09:00</div><div><h3>Great Sphinx＋Khafre Valley Temple</h3><p>可達時優先清晨面東的獅身人面像；若接駁先到金字塔，接受順序調整，不自行走未開放通道。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Great%20Sphinx%20of%20Giza" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1014-2">導覽</a></div></div><div class="slot" id="eg1014-3"><div class="time">09:00–10:45</div><div><h3>Khufu＋Queens’ Pyramids</h3><p>古夫內部是工程與空間體驗，並非彩色壁畫墓；選擇入內可多留45–60分鐘，王后金字塔開放與收費不預設。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Great%20Pyramid%20of%20Giza" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1014-3">導覽</a></div></div><div class="slot" id="eg1014-4"><div class="time">10:45–12:00</div><div><h3>Khafre → Menkaure</h3><p>卡夫拉看頂端白色包面，孟卡拉看底部花崗岩及較小王室建築群。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Pyramid%20of%20Menkaure" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1014-4">導覽</a></div></div><div class="slot" id="eg1014-5"><div class="time">12:00–13:00</div><div><h3>午餐、陰影與補水</h3><p>9 Pyramids Lounge僅在有預約、可到達且時間合適時使用；否則園內合法休息點簡餐，不為餐廳錯過參觀。</p><p><b>費用：</b>餐飲另計；景觀餐廳須查當日消費與接駁。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=9%20Pyramids%20Lounge%20Giza" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1014-6"><div class="time">13:00–15:30</div><div><h3>Panorama／Nine Pyramids Viewpoint</h3><p>選一到兩處園方允許的全景點，15:30左右往出口移動。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Panoramic%20View%20of%20the%20Pyramids" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1014-6">導覽</a></div></div><div class="slot" id="eg1014-7"><div class="time">16:30–日落後</div><div><h3>住宿休息／屋頂光影</h3><p>先確認住宿確有可使用、朝向適合的屋頂。日落前45分鐘到位；東側住宿向西拍塔群通常偏剪影，不是金字塔正面順光。</p><a class="guide-link" href="#guide-eg1014-7">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>若接駁慢，先刪園內長午餐及第二個全景點；不要為九座全景趕上最後一班車。</p></div></details></section><section class="day" id="eg1015"><span class="tag">2026-10-15</span><h2>GEM｜從王權到日常生活的完整博物館日</h2><p>住宿：Brassbell | By the Pyramids。09:00–17:00，安排約7小時含午餐。官方週四展廳09:00–18:00、園區08:30–19:00、最後入場17:00。依展館動線調整，展品位置以當日標籤為準。</p><p class="soft"><a href="#gem-full-guide">日期更新｜GEM新版為10/14 14:00–21:00，點此閱讀完整導覽；下方10/15為原規劃。</a></p><div class="slot" id="eg1015-1"><div class="time">08:30–09:00</div><div><h3>GEM入場</h3><p>使用官方tickets.gem.eg購票，選正確外國成人票、日期及時段；不是已代購。大型揹包先寄放。</p><p><b>費用：</b>外國成人即時票價以官方選日結帳為準；不把網上舊價當報價。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Grand%20Egyptian%20Museum" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://tickets.gem.eg/" target="_blank" rel="noopener">官方資訊</a><p><b>預約：</b>票為單次入場；一般不退換。私人攝影遵守各展區禁拍標示，尤其圖坦卡門指定區域。</p></div></div><div class="slot" id="eg1015-2"><div class="time">09:00–10:00</div><div><h3>Grand Hall＋Grand Staircase</h3><p>先看巨像與建築，再進文物密集展廳。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Grand%20Egyptian%20Museum" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1015-2">導覽</a></div></div><div class="slot" id="eg1015-3"><div class="time">10:00–12:30</div><div><h3>Tutankhamun Galleries｜圖坦卡門完整觀看法</h3><p>至少兩小時，依現場開放展品順序，不承諾每件都在某一固定櫃。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Grand%20Egyptian%20Museum" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1015-3">導覽</a></div></div><div class="slot" id="eg1015-4"><div class="time">12:30–13:30</div><div><h3>館內午餐與休息</h3><p>保留完整坐下休息時間。外食飲料政策以安檢執行為準；官方對館區攜入食物有限制，別預設可以攜大份便當。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Grand%20Egyptian%20Museum" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1015-5"><div class="time">13:30–14:30</div><div><h3>Khufu’s Boats Museum｜太陽船</h3><p>官方現行門票範圍列入古夫船館；當日展出及動線依館方。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Grand%20Egyptian%20Museum" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1015-5">導覽</a></div></div><div class="slot" id="eg1015-6"><div class="time">14:30–17:00</div><div><h3>Main Galleries｜跨王朝比較與金字塔窗景</h3><p>不用每櫃平均分配時間；按王權、社會、信仰挑六件文物比較。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Grand%20Egyptian%20Museum" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1015-6">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>疲累先減少主要展廳數量；Grand Hall、圖坦卡門、太陽船與一段跨王朝展廳保留。</p></div></section><section class="day" id="eg1016"><span class="tag">2026-10-16</span><h2>Saqqara → Memphis → Dahshur｜金字塔如何被發明</h2><p>住宿：Brassbell | By the Pyramids。包車約07:00–17:30。為避免Unas等墓室較早停止開放，改先Saqqara；前日請導遊核對每座墓與Serapeum票種、當日輪替，依結果微調。</p><div class="slot" id="eg1016-1"><div class="time">07:00–08:00</div><div><h3>前往Saqqara售票處</h3><p>書麵包車列出三處、等待、停車、過路費、接送地址及最後返回時間；導遊、票、午餐是否另付要清楚。</p><p><b>費用：</b>原稿估車EGP 2,500–4,000／車，導遊EGP 1,500–3,000另計；僅議價預算，未取得現時報價。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Saqqara%20Necropolis" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1016-2"><div class="time">08:00–09:00</div><div><h3>Unas金字塔＋Djoser複合體入口</h3><p>Unas當日開門就先進；若尚未開先逛Djoser，請導遊留意時間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Pyramid%20of%20Unas" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1016-2">導覽</a></div></div><div class="slot" id="eg1016-3"><div class="time">09:00–10:00</div><div><h3>Djoser階梯金字塔與Heb-Sed庭院</h3><p>先看圍牆與入口柱廊，再到南庭院和祭典建築。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Pyramid%20of%20Djoser" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1016-3">導覽</a></div></div><div class="slot" id="eg1016-4"><div class="time">10:00–11:00</div><div><h3>Ti或Mereruka墓｜普通工作的來世用途</h3><p>依當日開放選一座仔細看。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Tomb%20of%20Mereruka%20Saqqara" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1016-4">導覽</a></div></div><div class="slot" id="eg1016-5"><div class="time">11:00–12:00</div><div><h3>Serapeum｜阿匹斯公牛的地下石棺</h3><p>票種與開放確認後進長廊，至少保留45分鐘。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Serapeum%20of%20Saqqara" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1016-5">導覽</a></div></div><div class="slot" id="eg1016-6"><div class="time">12:30–13:15</div><div><h3>Memphis Open-Air Museum＋簡餐</h3><p>時間不足可縮短；不是可步行一整座古城的遺址。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Memphis%20Open%20Air%20Museum%20Egypt" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1016-6">導覽</a></div></div><div class="slot" id="eg1016-7"><div class="time">14:00–16:15</div><div><h3>Dahshur｜Bent＋Red Pyramid</h3><p>彎曲金字塔外觀，紅色金字塔視體力入內；兩者都進會增加俯身階梯負擔。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Dahshur%20Pyramids" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1016-7">導覽</a></div></div><div class="slot" id="eg1016-8"><div class="time">16:15–17:30</div><div><h3>返回Giza／準備沙漠行李</h3><p>留下露營小包，厚外套、長褲、頭燈、行動電源、必要藥品、濕紙巾與垃圾袋。大行李寄放必須跟團商／住宿確認交接。</p></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>Saqqara若看得深入，Memphis縮短30分鐘；Dahshur只進一座。不要為固定清單犧牲墓室開放。</p></div></section><section class="day" id="eg1017"><span class="tag">2026-10-17</span><h2>Giza → Bahariya → Black &amp; White Desert｜綠洲與古海床</h2><p>住宿：黑白沙漠露營。併團2天1夜；時間與點位為建議順序，業者依許可、路況與日落調整。沒有核實成團／接送就不能當成已安排完成。</p><div class="slot" id="eg1017-1"><div class="time">06:30–07:00</div><div><h3>Giza接送與併團</h3><p>前晚確認Brassbell門口、接人時間、聯絡人、公路車及4WD每車人數。10/18必須送到Zamalek Studio 18；不得只承諾「Cairo」而送回Giza。</p><p><b>費用：</b>併團原稿USD 130–200／兩人僅預算；保護區費、次日午餐、小費可能另計。以所選團商書面總價為準。</p><p><b>預約：</b>核對許可、正式嚮導、車況、飲水、帳篷睡袋毯子、廁所、取消與回程時間；本頁未代訂。</p></div></div><div class="slot" id="eg1017-2"><div class="time">11:00–12:30</div><div><h3>Bahariya Oasis｜午餐、換4WD</h3><p>只帶當晚需要物品上沙漠車；確認行李留置處與返程交接。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bahariya%20Oasis%20Egypt" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1017-2">導覽</a></div></div><div class="slot" id="eg1017-3"><div class="time">13:00–15:30</div><div><h3>Black Desert → El Heiz → Crystal Mountain</h3><p>火山碎屑山丘、綠洲泉與晶體露頭；泉池能否泡、衛生與水溫以現場判斷，不必為清單強行下水。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Black%20Desert%20Egypt" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1017-3">導覽</a></div></div><div class="slot" id="eg1017-4"><div class="time">15:30–日落</div><div><h3>Agabat → White Desert營地</h3><p>白色殘丘、沙丘與經典岩石；滑沙視時間與風況，不把抵達營地壓到夜間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Agabat%20Valley%20Egypt" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1017-4">導覽</a></div></div><div class="slot" id="eg1017-5"><div class="time">晚間</div><div><h3>晚餐、露營與觀星</h3><p>保暖層和頭燈放手邊；想上洗手間先問範圍，不在無標示沙漠獨走。觀星取決於月光、雲與沙塵，不保證銀河。</p><a class="guide-link" href="#guide-eg1017-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>風沙、道路管制或無許可時由正式團商取消／改期並啟動退款條款；不要自行駕入保護區。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>長途接送延誤先減少滑沙和重複停靠；營地抵達、飲水和晚餐優先。</p></div></section><section class="day" id="eg1018"><span class="tag">2026-10-18</span><h2>White Desert日出 → Cairo／Zamalek</h2><p>住宿：Studio 18 Airbnb_Abu Al Feda。回程可能17:00–19:00或更晚，今晚沒有預付演出。10/18午餐是否包含必須看團商確認，不沿用舊稿自動視為已含。</p><div class="slot" id="eg1018-1"><div class="time">日出–09:00</div><div><h3>White Desert岩石與早餐</h3><p>依嚮導安排看Mushroom／Chicken或相近地貌，不保證特定石頭能在許可路線內到達。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=White%20Desert%20National%20Park%20Egypt" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1018-1">導覽</a></div></div><div class="slot" id="eg1018-2"><div class="time">09:00–13:00</div><div><h3>返回Bahariya／換車與午餐</h3><p>順序依團商安排；上車前清點大行李、護照與充電裝置，向司機再次展示Zamalek精確地址。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bahariya%20Oasis%20Egypt" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1018-3"><div class="time">13:00–19:00</div><div><h3>公路返回Studio 18</h3><p>車程規劃約4–6小時加休息與市區交通，不與晚餐訂位綁死。入住、洗衣、補水與睡眠。</p><a class="guide-link" href="#guide-eg1018-3">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>優先保留當日主景點與住宿移動；延誤先刪自由散步、購物和次要外觀，門票最後入場前留緩衝。</p></div></section><section class="day" id="eg1019"><span class="tag">2026-10-19</span><h2>Egyptian Museum → Downtown｜考古史與近代開羅</h2><p>住宿：Studio 18 Airbnb_Abu Al Feda。舊館與GEM互補；主要文物已移館者不重複尋找，館藏以當日展出為準。</p><div class="slot" id="eg1019-1"><div class="time">08:15–09:00</div><div><h3>Zamalek → Tahrir</h3><p>Uber或正式計程車，預留塞車及安檢。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=The%20Egyptian%20Museum%20Cairo" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1019-2"><div class="time">09:00–13:00</div><div><h3>Egyptian Museum Tahrir｜四條觀看線</h3><p>外國成人EGP 550；官方09:00–17:00、售票至16:00，10/12查核。</p><p><b>費用：</b>EGP 550／外國成人；10/12官方頁</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=The%20Egyptian%20Museum%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/museums/egyptian-museum/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1019-2">導覽</a></div></div><div class="slot" id="eg1019-3"><div class="time">13:15–15:30</div><div><h3>Tahrir → Talaat Harb → Abou Tarek</h3><p>午餐吃koshari，之後慢看Downtown建築；Groppi視當日營業只作外觀候選。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Abou%20Tarek%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1019-3">導覽</a></div></div><div class="slot" id="eg1019-4"><div class="time">16:30–傍晚</div><div><h3>Zamalek河岸／休息</h3><p>選有合法人行空間的河段，並非全島河邊都可連續走。晚餐可吃taameya、ful、hawawshi或molokhiya。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Zamalek%20Cairo" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>優先保留當日主景點與住宿移動；延誤先刪自由散步、購物和次要外觀，門票最後入場前留緩衝。</p></div></section><section class="day" id="eg1020"><span class="tag">2026-10-20</span><h2>Coptic Cairo＋NMEC｜基督教、伊斯蘭與木乃伊</h2><p>住宿：Studio 18 Airbnb_Abu Al Feda。08:00抵達老開羅外圍；各教堂依當日門口開放與禮拜調整。20:00音樂節為可選活動，若買票就16:00離館回住宿休息。</p><div class="slot" id="eg1020-1"><div class="time">08:00–10:15</div><div><h3>Hanging Church → St Sergius → Ben Ezra</h3><p>從堡壘與巷道進入宗教社群；Ben Ezra是否開放以現場為準。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=The%20Hanging%20Church%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1020-1">導覽</a></div></div><div class="slot" id="eg1020-2"><div class="time">10:15–12:00</div><div><h3>Coptic Museum｜影象如何跨宗教延續</h3><p>挑木雕、石雕、織品、手稿四類，不必每廳平均停留。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Coptic%20Museum%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/museums/the-coptic-museum/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1020-2">導覽</a></div></div><div class="slot" id="eg1020-3"><div class="time">12:00–13:15</div><div><h3>Amr Ibn al-As外觀／午餐 → NMEC</h3><p>避開禮拜時段；需要入內就縮短午餐，否則外觀已可理解Fustat位置。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Amr%20Ibn%20Al%20Aas%20Mosque%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1020-3">導覽</a></div></div><div class="slot" id="eg1020-4"><div class="time">13:30–16:00／17:00</div><div><h3>NMEC｜文明長時段與皇家木乃伊</h3><p>先主展廳再皇家木乃伊廳；若買20:00演出票，16:00離館。</p><p><b>費用：</b>EGP 550／外國成人；10/12官方頁</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=National%20Museum%20of%20Egyptian%20Civilization" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nmec.gov.eg/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1020-4">導覽</a></div></div><div class="slot" id="eg1020-5"><div class="time">可選 19:15報到／20:00</div><div><h3>Cairo Opera｜Arab Music Festival開幕</h3><p>官方已列10/20 20:00 Main Hall；售票、演出者、服裝及餘票需另核對，尚未代購。若太累留10/22候選。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20Opera%20House" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://cairoopera.org/en/calendar/opening-ceremony-of-arab-music-festival-conference-34th-edition/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1020-5">導覽</a><p><b>預約：</b>可選、尚未訂票；10/12官方日期核對。</p></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>若進度慢，刪Ben Ezra與Amr入內，保留科普特博物館和NMEC；兩館各留足時間。</p></div></section><section class="day" id="eg1021"><span class="tag">2026-10-21</span><h2>Historic Cairo｜堡壘、馬穆魯克與工藝街</h2><p>住宿：Studio 18 Airbnb_Abu Al Feda。UNESCO歷史開羅。舊稿一天排得過滿：今天以Citadel、Sultan Hassan、Al-Muizz為核心；Bab Zuweila改10/22條件式補訪，保留午後休息。</p><div class="slot" id="eg1021-1"><div class="time">08:00–10:15</div><div><h3>Citadel＋Muhammad Ali Mosque</h3><p>前往城堡約留45–75分鐘含塞車；時間以當日開門為準。</p><p><b>費用：</b>EGP 550／外國成人基本票；10/12官方頁</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20Citadel" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/archaeological-sites/cairo-citadel/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1021-1">導覽</a></div></div><div class="slot" id="eg1021-2"><div class="time">10:45–12:30</div><div><h3>Sultan Hassan＋Al-Rifa’i</h3><p>兩座相鄰，卻相隔多個世紀。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mosque-Madrasa%20of%20Sultan%20Hassan%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1021-2">導覽</a></div></div><div class="slot" id="eg1021-3"><div class="time">12:45–14:30</div><div><h3>Al-Azhar Park｜午餐與休息</h3><p>若高溫或塞車，改有冷氣餐廳，公園非必須全走。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Al%20Azhar%20Park%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1021-3">導覽</a></div></div><div class="slot" id="eg1021-4"><div class="time">15:00–17:30</div><div><h3>Al-Muizz｜Qalawun一帶與sabil-kuttab</h3><p>以Qalawun建築群附近核心段慢走；付費建築先進，外街留傍晚。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Al%20Muizz%20Street%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1021-4">導覽</a></div></div><div class="slot" id="eg1021-5"><div class="time">17:30–19:30</div><div><h3>Khan el-Khalili｜市集與咖啡</h3><p>亮燈後的市集不等於古建築延長營業；Naguib Mahfouz Café只作休息候選。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Khan%20el%20Khalili%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1021-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>若午餐後已15:00，Al-Azhar Park改短停或取消；不要把Sultan Hassan與Al-Muizz全部壓成外觀。</p></div></section><section class="day" id="eg1022"><span class="tag">2026-10-22</span><h2>Manial＋Nilometer → Zamalek｜王室品味與尼羅河資料</h2><p>住宿：Studio 18 Airbnb_Abu Al Feda。保留半天緩衝、採買和行李。可補Bab Zuweila或看20:00音樂節，不同時把所有候選塞滿。</p><div class="slot" id="eg1022-1"><div class="time">09:00–11:30</div><div><h3>Manial Palace｜Prince Muhammad Ali的收藏世界</h3><p>確認當天哪些館舍可進，庭園與主建築留足時間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Manial%20Palace%20Museum%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1022-1">導覽</a></div></div><div class="slot" id="eg1022-2"><div class="time">11:45–12:30</div><div><h3>Rhoda Nilometer｜洪水、糧食與稅收</h3><p>先請住宿／司機確認當日可入場；關閉就不在門口久等。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Nilometer%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1022-2">導覽</a></div></div><div class="slot" id="eg1022-3"><div class="time">下午擇一</div><div><h3>Zamalek藝廊／Bab Zuweila補訪／休息</h3><p>Manial與Nilometer後不再排大型遠端景點。若10/21未完成且想登城門，午餐後先去Bab Zuweila，建築售票時間另核對；否則Aisha Fahmy Palace臨時展覽或住宿整理。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bab%20Zuweila%20Cairo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1022-3">導覽</a></div></div><div class="slot" id="eg1022-4"><div class="time">可選 20:00</div><div><h3>Cairo Opera Small Hall｜Arab Music Festival</h3><p>官方列10/22 20:00小廳；比未知的El Sawy節目更可具體追蹤。10/20若已看，今晚可休息。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20Opera%20House" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://cairoopera.org/en/calendar/arab-music-festival-and-conference-22-10-2026/" target="_blank" rel="noopener">官方資訊</a><p><b>預約：</b>日期場地已核對；票價、餘票、曲目及演出者需售票頁確認，非已訂。</p></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>優先保留當日主景點與住宿移動；延誤先刪自由散步、購物和次要外觀，門票最後入場前留緩衝。</p></div></section><section class="day" id="eg1023"><span class="tag">2026-10-23</span><h2>Cairo → Aswan｜尼羅河第一瀑布與努比亞門戶</h2><p>住宿：Pajama Hostel Nile View。Air Cairo SM94 14:30–15:50依使用者已訂航班。上午不排景點。</p><div class="slot" id="eg1023-1"><div class="time">10:15–11:30</div><div><h3>Studio 18退房 → CAI</h3><p>出發時間按住宿定位與即時路況提前；約11:30抵達正確國內線航廈。不可從上次國際線抵達航廈推定SM94。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20International%20Airport" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>前一天查Air Cairo訂單的航廈、行李額度與報到截止；別只輸入「機場」。</p></div></div><div class="slot" id="eg1023-2"><div class="time">14:30–17:00</div><div><h3>SM94 → ASW → Pajama Hostel</h3><p>15:50預定抵達；ASW接送為使用者提供安排，仍需確認司機集合點、費用及住宿是否需另接船。</p><a class="guide-link" href="#guide-eg1023-2">導覽</a></div></div><div class="slot" id="eg1023-3"><div class="time">17:30–19:30</div><div><h3>Corniche＋Aswan Souk</h3><p>只安排晚餐、河岸散步、飲水和早餐。Abu Simbel在10/26–27，不需為舊稿10/24日歸凌晨起床。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Aswan%20Souk" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1023-3">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>優先保留當日主景點與住宿移動；延誤先刪自由散步、購物和次要外觀，門票最後入場前留緩衝。</p></div></section><section class="day" id="eg1024"><span class="tag">2026-10-24</span><h2>Aswan｜Philae、花崗岩與努比亞博物館</h2><p>住宿：Pajama Hostel Nile View。移除舊稿Abu Simbel日歸，把Aswan主要景點分兩天，避免重複開車600公里。</p><div class="slot" id="eg1024-1"><div class="time">07:00–10:00</div><div><h3>Philae｜碼頭 → Agilkia島神殿</h3><p>車先到Philae正式售票與渡船碼頭，另談整船來回價；不要把島上圖釘當汽車終點。</p><p><b>費用：</b>EGP 550／外國成人；船費另計，10/12官方頁</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Philae%20Temple%20Marina" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/archaeological-sites/philae/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1024-1">導覽</a></div></div><div class="slot" id="eg1024-2"><div class="time">10:30–11:30</div><div><h3>Unfinished Obelisk｜未完成方尖碑</h3><p>採石坑曝曬，水與帽子備好。</p><p><b>費用：</b>EGP 220／外國成人；10/12官方頁</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Unfinished%20Obelisk%20Aswan" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/monuments/the-unfinished-obelisk" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1024-2">導覽</a></div></div><div class="slot" id="eg1024-3"><div class="time">11:45–14:00</div><div><h3>午餐與午休／High Dam選配</h3><p>高壩若想看現代水利，可與早上包車預先報價，否則直接休息；不為湊景點多搭車。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Aswan%20High%20Dam" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1024-3">導覽</a></div></div><div class="slot" id="eg1024-4"><div class="time">14:00–16:00</div><div><h3>Nubian Museum｜古蹟搬遷背後的人</h3><p>若當日午休關館，改官方確認的晚間時段，午後休息；不要依舊攻略假設連續營業。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Nubian%20Museum%20Aswan" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1024-4">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>高壩列選配；時間不足不壓縮Philae與Nubian Museum。</p></div></section><section class="day" id="eg1025"><span class="tag">2026-10-25</span><h2>Elephantine＋Felucca｜河流、社群與慢旅行</h2><p>住宿：Pajama Hostel Nile View。留白補足昨日未開館的Nubian Museum。當天只選Elephantine、博物館補訪、帆船三項，不再去Abu Simbel。</p><div class="slot" id="eg1025-1"><div class="time">08:30–11:30</div><div><h3>Elephantine Island｜聚落、Khnum與測水</h3><p>由正式公共渡船／談妥的船抵達；島上村落、考古區與博物館可能分開收費及開放。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Elephantine%20Island%20Aswan" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1025-1">導覽</a></div></div><div class="slot" id="eg1025-2"><div class="time">12:00–15:00</div><div><h3>午餐、博物館補訪與休息</h3><p>若昨天Nubian Museum已完成，今日午後空出。明日長途移動前確認Abu Simbel去程、次日回程與Hllol行李寄放。</p></div></div><div class="slot" id="eg1025-3"><div class="time">15:30–日落</div><div><h3>Felucca｜有風才有帆船體驗</h3><p>約1.5–2小時候選；出發前按當日日落往前排。無風可能需縮線，不承諾固定到所有島。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Aswan%20Corniche" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1025-3">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>優先保留當日主景點與住宿移動；延誤先刪自由散步、購物和次要外觀，門票最後入場前留緩衝。</p></div></section><section class="day" id="eg1026"><span class="tag">2026-10-26</span><h2>Aswan → Abu Simbel｜納瑟湖邊住一晚</h2><p>住宿：Hllol Hotel Abu Simbel。按已訂住宿保留過夜優勢：今天移動與湖景，明日06:00主參觀取得東向立面晨光。若擔心翌日開放或返程，今日14:00可先主參觀；再次入場通常需新票。</p><div class="slot" id="eg1026-1"><div class="time">約08:00–13:00</div><div><h3>Aswan → Abu Simbel｜陸路轉移</h3><p>約280–300公里，規劃4–5小時含檢查站與休息。實際出發可依巴士／拼車／包車的已確認班次調整，不虛構固定巴士時刻。</p><p><b>交通：</b>住宿安排車或核實巴士；不得自行繞過檢查站。</p><p><b>費用：</b>交通未提供已訂價；先確認兩人行李、去回程總價及10/27返Aswan時刻。</p><p><b>預約：</b>將Aswan寄存大行李與Hllol入住協調好，只帶一晚小包；貴重物隨身。</p></div></div><div class="slot" id="eg1026-2"><div class="time">13:00–14:00</div><div><h3>Hllol入住／午餐</h3><p>使用住宿訂單精確定位，安排次日05:30前後早餐或外帶；先確認到神廟的車程與接回方式。</p></div></div><div class="slot" id="eg1026-3"><div class="time">14:00–16:00 可選</div><div><h3>Abu Simbel提前主參觀／小鎮與湖景</h3><p>正常主方案明晨入內；若今天先看，明晨可選再次付費為攝影，不預設票可隔日重複使用。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Abu%20Simbel%20Temples" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/archaeological-sites/abu-simbel/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1026-3">導覽</a></div></div><div class="slot" id="eg1026-4"><div class="time">晚間</div><div><h3>晚餐／Sound &amp; Light條件式</h3><p>聲光秀未核實10/26場次、語言、成團人數及票價，不列必成行。若沒有演出，早睡比等不確定夜場更重要。</p></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>晚抵達不追日落入場，保留明晨核心參觀；聲光秀只有核實場次、語言和票後才加入。</p></div></section><section class="day" id="eg1027"><span class="tag">2026-10-27</span><h2>Abu Simbel晨光 → Aswan｜帝國宣傳與保存工程</h2><p>住宿：Pajama Hostel Nile View。主參觀06:00–08:45，再回Hllol早餐／退房；返程依已確認交通，不安排黃昏前必到Aswan的付費活動。</p><div class="slot" id="eg1027-1"><div class="time">05:30–06:00</div><div><h3>Hllol → 神廟售票處</h3><p>由住宿確認開門與接送；清晨照明、狗隻與空曠道路不熟悉時搭車，不按地圖直線估步行。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Abu%20Simbel%20Temples" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1027-2"><div class="time">06:00–07:30</div><div><h3>Great Temple｜四巨像、戰爭與內殿</h3><p>先外觀晨光，再入柱廳與聖所；團車抵達時間會影響人潮，不能保證無人。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Abu%20Simbel%20Great%20Temple" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1027-2">導覽</a></div></div><div class="slot" id="eg1027-3"><div class="time">07:30–08:45</div><div><h3>Small Temple｜Nefertari與Hathor</h3><p>王后是Nefertari，不是Nefertiti；兩者相隔不同時代。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Temple%20of%20Nefertari%20Abu%20Simbel" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1027-3">導覽</a></div></div><div class="slot" id="eg1027-4"><div class="time">09:00–15:00左右</div><div><h3>早餐／退房 → 返回Aswan</h3><p>交通時間按實際班次；預留4–5小時，回Pajama取寄放行李。下午不加Philae或重複市集團。</p></div></div><div class="slot" id="eg1027-5"><div class="time">下午–晚上</div><div><h3>休息、補給、確認10/28包車</h3><p>明日行李隨車到Luxor。要求司機確認06:30接人、Kom Ombo與Edfu、等待、午餐、檢查站、最終住宿送達；若住宿跨河，確認車可到哪個門口。</p></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>優先保留當日主景點與住宿移動；延誤先刪自由散步、購物和次要外觀，門票最後入場前留緩衝。</p></div></section><section class="day" id="eg1028"><span class="tag">2026-10-28</span><h2>Aswan → Kom Ombo → Edfu → Luxor｜包車神廟日</h2><p>住宿：Temple &amp; Nile view。已指定包車移動，約9–11小時含參觀與休息。Esna不列標準站，避免趕夜路；不沿用河輪、馬車或水閘等待動線。</p><div class="slot" id="eg1028-1"><div class="time">06:30–08:00</div><div><h3>Aswan退房 → Kom Ombo</h3><p>車上帶水與早餐、行李不外露；跨城檢查站與當日通行由司機安排，純導航時間不能當抵達保證。</p><p><b>費用：</b>原稿USD 120–180／車僅舊預算；兩神廟、等待、行李、停車、過路、住宿門口、導遊是否另計需本次書面報價。</p></div></div><div class="slot" id="eg1028-2"><div class="time">08:00–09:30</div><div><h3>Kom Ombo｜雙神殿＋Crocodile Museum</h3><p>若博物館晚開，先神廟再館；以可用時間安排。</p><p><b>費用：</b>EGP 450／外國成人，含鱷魚博物館；10/12核對</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kom%20Ombo%20Temple" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/museums/crocodile-museum" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1028-2">導覽</a></div></div><div class="slot" id="eg1028-3"><div class="time">09:30–11:30</div><div><h3>Kom Ombo → Edfu</h3><p>車程含村鎮與檢查約1.5–2小時規劃，路況可能更慢。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Temple%20of%20Horus%20at%20Edfu" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1028-4"><div class="time">11:30–13:30</div><div><h3>Edfu｜從明亮庭院走向神的內室</h3><p>包車直接安排可停車入口，無需套用河輪碼頭馬車。</p><p><b>費用：</b>EGP 550／外國成人；10/12官方頁</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Temple%20of%20Horus%20at%20Edfu" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/monuments/temple-of-edfu" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1028-4">導覽</a></div></div><div class="slot" id="eg1028-5"><div class="time">13:30–17:30</div><div><h3>午餐 → Luxor → Temple &amp; Nile view</h3><p>約2.5–3.5小時車程加午餐與路況緩衝；預計17:00–18:00入住，晚餐後休息。確認10/28及10/29兩筆訂單能否同房連住。</p><a class="guide-link" href="#guide-eg1028-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>若路況延誤，先減午餐停留與鱷魚館時間；Edfu至少90分鐘，Esna一律刪除。</p></div></section><section class="day" id="eg1029"><span class="tag">2026-10-29</span><h2>Dendera → Luxor Temple夜景｜Hathor與王權更新</h2><p>住宿：Temple &amp; Nile view。把原11/1的Dendera提前，早上往返Qena，下午休息，傍晚Luxor Temple。今晚埃及結束夏令時間，明日鬧鐘與司機時間要重新確認。</p><div class="slot" id="eg1029-1"><div class="time">07:00–09:00</div><div><h3>Luxor → Dendera</h3><p>包車往返，單程約1.5–2小時作規劃；景區開門、等待、票與午餐分項確認。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Dendera%20Temple%20Complex" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1029-2"><div class="time">09:00–12:00</div><div><h3>Dendera｜柱廳、天文天花、地下室與屋頂</h3><p>地下室與全景／屋頂可能另收費或區域性封閉；先票口問清再決定。</p><p><b>費用：</b>基本EGP 300／人；panorama、serdab官方各列100，最多先抓500，另項並非保證開放。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Dendera%20Temple%20Complex" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/monuments/temple-of-dendera/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1029-2">導覽</a></div></div><div class="slot" id="eg1029-3"><div class="time">12:00–16:15</div><div><h3>返回Luxor／午餐與午休</h3><p>不要在Qena臨時再加Abydos；晚上還有神廟。</p></div></div><div class="slot" id="eg1029-4"><div class="time">16:30–19:00</div><div><h3>Luxor Temple｜白天到藍調</h3><p>買票入內，先看白天細節，再等開燈；官方實際夜間最後入場須到訪前核對。</p><p><b>費用：</b>EGP 500／外國成人；10/12官方頁</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Luxor%20Temple" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/monuments/luxor-temple/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1029-4">導覽</a></div></div><div class="slot" id="eg1029-5"><div class="time">睡前</div><div><h3>夏令時間結束｜核對明早接送</h3><p>Africa/Cairo於10/29跨至10/30時由UTC+3回UTC+2，鐘回撥一小時。保持手機自動時區，和司機以「10/30埃及新當地時間」確認，避免手動再調一次。</p></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>Dendera若逛到中午，回Luxor後只休息與夜遊；不再加Karnak。</p></div></section><section class="day" id="eg1030"><span class="tag">2026-10-30</span><h2>Luxor West Bank｜帝王谷、女性法老與工匠</h2><p>住宿：Temple &amp; Nile view。06:00左右出發按住宿岸別調整；今日日出及接送時間已是UTC+2。西岸較熱，午後回去休息。</p><div class="slot" id="eg1030-1"><div class="time">06:00–06:45</div><div><h3>前往帝王谷售票區</h3><p>住宿如果在東岸，車須經橋，不能拿渡船純過河時間估計包車車程。當日開放墓單先拍照。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Valley%20of%20the%20Kings" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1030-2"><div class="time">06:45–09:30</div><div><h3>Valley of the Kings｜普通票三墓＋KV9候選</h3><p>普通票依當日規則選指定數量墓穴，常見三墓；KV9、Tutankhamun與Seti I各自加票，不因電子票而自由進所有墓。</p><p><b>費用：</b>基本EGP 750／人；加票與電瓶車另列，不以舊加價保証。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Valley%20of%20the%20Kings" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/archaeological-sites/valley-of-the-kings/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1030-2">導覽</a></div></div><div class="slot" id="eg1030-3"><div class="time">09:45–11:00</div><div><h3>Hatshepsut Temple｜Deir el-Bahari</h3><p>三層平臺與山壁，至少一小時。</p><p><b>費用：</b>預算EGP 440／外國成人；官方頁面存在360與440差異。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mortuary%20Temple%20of%20Hatshepsut" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/en/monuments/hatshepsut-temple/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1030-3">導覽</a></div></div><div class="slot" id="eg1030-4"><div class="time">11:15–11:35</div><div><h3>Colossi of Memnon｜兩尊像後的消失神廟</h3><p>短停拍照，不當完整神廟參觀。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Colossi%20of%20Memnon" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1030-4">導覽</a></div></div><div class="slot" id="eg1030-5"><div class="time">11:50–13:15</div><div><h3>Medinet Habu｜深刻浮雕與拉美西斯三世</h3><p>比趕完五座更值得慢看一座，午餐可往後移。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Medinet%20Habu" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1030-5">導覽</a></div></div><div class="slot" id="eg1030-6"><div class="time">13:30–14:30 條件式</div><div><h3>Deir el-Medina｜王陵工匠村</h3><p>體力夠才做，否則移10/31；選開放小墓一兩座與村落遺址。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Deir%20el%20Medina" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1030-6">導覽</a></div></div><div class="slot" id="eg1030-7"><div class="time">14:30後</div><div><h3>午餐、回住宿與休息</h3><p>和熱氣球業者確認次日接送、實際起飛窗、取消退款及飛後送達地；天氣未放行不預設必飛。</p></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Memnon長停和Deir el-Medina，移明日熱氣球後；保留帝王谷＋Hatshepsut＋Medinet Habu。</p></div></section><section class="day" id="eg1031"><span class="tag">2026-10-31</span><h2>熱氣球候選＋Karnak＋Luxor Museum｜旅程收束</h2><p>住宿：Temple &amp; Nile view。Karnak安排今日，不與Dendera搶10/29時間。若熱氣球延誤，優先Karnak，額外西岸墓與下午選配刪減。</p><div class="slot" id="eg1031-1"><div class="time">約04:00–08:30 條件式</div><div><h3>Luxor Hot Air Balloon｜第一飛候選</h3><p>接送時間由業者按日出及新當地時間確認；舊稿04:30不當固定班次。</p><p><b>費用：</b>原稿USD 50–90／人僅舊估價；以本次正式報價為準。</p><a class="guide-link" href="#guide-eg1031-1">導覽</a><p><b>預約：</b>候選未代訂；有飛行就不再追加西岸多個墓地。</p></div></div><div class="slot" id="eg1031-2"><div class="time">09:30–13:00／無飛行07:00</div><div><h3>Karnak｜一千多年累積的石造政治史</h3><p>至少3小時。從Amun區主軸，再依開放去Open-Air Museum與聖湖。</p><p><b>費用：</b>EGP 600／外國成人，部會列含Open Museum；Mut另票。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Karnak%20Temple" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://egymonuments.gov.eg/archaeological-sites/karnak/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-eg1031-2">導覽</a></div></div><div class="slot" id="eg1031-3"><div class="time">13:00–16:00</div><div><h3>午餐與休息／最後補給</h3><p>整理行李，買11/1機場可攜帶點心；液體依安檢。確認明早接車、LXR實際報到入口與行李直掛。</p></div></div><div class="slot" id="eg1031-4"><div class="time">16:00–18:00候選</div><div><h3>Luxor Museum／昨日未完成工匠村二擇一</h3><p>先確認博物館當日分段營業；若下午尚未開就依官方晚間時段調整，不熬到太晚。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Luxor%20Museum" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1031-4">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>沒有熱氣球就07:00–10:30 Karnak；有飛行則約09:30開始。Deir el-Medina未完成也只作二擇一，不加入王后谷和所有補點。</p></div></section><section class="day" id="eg1101"><span class="tag">2026-11-01</span><h2>LXR → CAI → AMM｜離開埃及</h2><p>住宿：—。依已訂EgyptAir：08:55 LXR→10:05 CAI；17:05 CAI→19:25 AMM。今天無Dendera、無Hurghada；全程採航班所在地當地時間。</p><div class="slot" id="eg1101-1"><div class="time">05:30–06:30</div><div><h3>退房 → Luxor Airport</h3><p>建議05:30左右接車，約06:00–06:30到報到區；跨河住宿或路況需更早。前一天取得接送確認。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Luxor%20International%20Airport" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>原資料標LXR T2／CAI T3／TS含不明標記；不直接當作確定航廈。以EgyptAir訂單、登機證與機場告示確認，公開頁不放訂位程式碼。</p></div></div><div class="slot" id="eg1101-2"><div class="time">08:55–10:05</div><div><h3>EgyptAir LXR → CAI</h3><p>依已訂時刻；在LXR問清兩段是否同一票、行李是否直掛AMM、是否有兩張登機證。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20International%20Airport" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="eg1101-3"><div class="time">10:05–17:05</div><div><h3>CAI轉機｜機場內休息</h3><p>預留國內轉國際、證照檢查及可能換航廈。約7小時轉機不等於可使用7小時市區觀光；不安排Giza／市中心折返。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Cairo%20International%20Airport" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-eg1101-3">導覽</a></div></div><div class="slot" id="eg1101-4"><div class="time">17:05–19:25</div><div><h3>CAI → Amman</h3><p>AMM抵達以約旦當地時間。埃及已UTC+2、約旦UTC+3，兩端表面時間差包含1小時時差；不要自行把機票時刻改算兩次。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Queen%20Alia%20International%20Airport" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>高溫、風沙或臨時關閉時，優先室內展館、午休與已確認交通；不把未開放區域當成替代入口。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>當日唯一目標是航班與轉機。任何延誤直接洽航空公司，不自行離開機場補景點。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>Giza基本票</td><td>EGP 700</td><td>每位外國成人</td><td>2026/10/12｜官方部會；不含金字塔內部</td></tr><tr><td>GEM</td><td>待官方選日票價</td><td>每位外國成人</td><td>2026/10/12｜官方售票已核對，頁面動態價格不臆測</td></tr><tr><td>Egyptian Museum</td><td>EGP 550</td><td>每位外國成人</td><td>2026/10/12｜官方部會</td></tr><tr><td>NMEC</td><td>EGP 550</td><td>每位外國成人</td><td>2026/10/12｜官方部會</td></tr><tr><td>Cairo Citadel</td><td>EGP 550</td><td>每位外國成人</td><td>2026/10/12｜官方部會</td></tr><tr><td>Philae</td><td>EGP 550</td><td>每位外國成人</td><td>2026/10/12｜官方部會；渡船另計</td></tr><tr><td>Unfinished Obelisk</td><td>EGP 220</td><td>每位外國成人</td><td>2026/10/12｜官方部會</td></tr><tr><td>Abu Simbel</td><td>EGP 750基本／舊稿822待拆項</td><td>每位外國成人</td><td>2026/10/12｜官方介紹與舊稿不同，現場總額為準；若二次入場另票</td></tr><tr><td>Kom Ombo＋Crocodile Museum</td><td>EGP 450</td><td>每位外國成人</td><td>2026/10/12｜官方合票</td></tr><tr><td>Edfu</td><td>EGP 550</td><td>每位外國成人</td><td>2026/10/12｜官方部會</td></tr><tr><td>Dendera</td><td>EGP 300＋附加100＋100</td><td>每位外國成人</td><td>2026/10/12｜地下室／全景開放與適用另確認</td></tr><tr><td>Luxor Temple</td><td>EGP 500</td><td>每位外國成人</td><td>2026/10/12｜官方部會</td></tr><tr><td>Karnak</td><td>EGP 600</td><td>每位外國成人</td><td>2026/10/12｜含Open Museum；Mut另計</td></tr><tr><td>Valley of the Kings</td><td>EGP 750</td><td>每位外國成人</td><td>2026/10/12｜基本票，特殊墓與車另計</td></tr><tr><td>Hatshepsut</td><td>按EGP 440預算</td><td>每位外國成人</td><td>2026/10/12｜兩官方頁360／440不一致</td></tr><tr><td>Saqqara／Dahshur／Memphis／Coptic／Manial／Nubian／Luxor Museum／Medinet Habu／Deir el-Medina</td><td>待當日票種確認</td><td>每位外國成人</td><td>2026/10/12｜未核實即時價格；未知不是免費</td></tr><tr><td>10/16三遺址包車</td><td>EGP 2,500–4,000</td><td>每車；導遊另估1,500–3,000</td><td>使用者舊稿預算或待報價；非已訂價格</td></tr><tr><td>黑白沙漠併團</td><td>USD 130–200</td><td>兩人；依團商確認國家公園費與次日午餐</td><td>使用者舊稿預算或待報價；非已訂價格</td></tr><tr><td>Aswan Felucca</td><td>EGP 500–900</td><td>整船／小時，需當次議價</td><td>使用者舊稿預算或待報價；非已訂價格</td></tr><tr><td>10/28包車轉移</td><td>USD 120–180</td><td>每車，待本次報價</td><td>使用者舊稿預算或待報價；非已訂價格</td></tr><tr><td>熱氣球</td><td>USD 50–90</td><td>每人，待本次報價</td><td>使用者舊稿預算或待報價；非已訂價格</td></tr><tr><td>Abu Simbel去回交通／Dendera往返</td><td>待報價</td><td>每車／每人依所選交通</td><td>使用者舊稿預算或待報價；非已訂價格</td></tr><tr><td>歌劇院音樂節</td><td>待售票頁</td><td>每人</td><td>使用者舊稿預算或待報價；非已訂價格</td></tr></tbody></table></div><p>外國成人、EGP與USD分開列，不使用未查核匯率加總。門票來源於2026/10/12可讀官方頁，但售票結帳／現場可能更新。住宿與已訂機票不重估；包車、船、導遊、小費、接送、附加墓票與重複入場分開核對。文化導覽以使用者上傳《Egypt_2026_Guide(1).pdf》36頁為底稿，依已訂版本重新分配及補充；保留原附件，不公開訂位程式碼。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-eg1013-2"><summary>入境、行李、提款與SIM｜導覽</summary><h3>現場看什麼</h3><p>先看清航廈、正式櫃臺與上車集合點。SIM方案寫下總流量和可使用的一般上網量，避免把社羣專用流量當成全部通用。</p><p>【路上的第一個地理問題】留意何時跨河、住宅密度如何變化、遠處乾燥高原與灌溉綠地如何交接。夜間未必看得到金字塔，不需要為了第一張照片繞路。先抵達、休息，明早再把這些地形看清楚。</p><h3>歷史背景</h3><p>換匯與 SIM 的背景埃及現金使用仍普遍，小額鈔票對廁所、小費與市集很重要。SIM 登記需護照，是政府實名制度的一部分。不要把所有現金放同一處，也不要在街上展示大量美元。</p><p>【第一晚先建立城市尺度】CAI位於開羅東側，吉薩金字塔區在尼羅河西側，機場到住宿是一段橫越大都會的移動。Greater Cairo不只單一老城，而是歷史核心、密集住宅、河島與沙漠新城交錯的都市區。車窗外的高架道路與新開發區，同樣屬於今日埃及。</p><h3>相關故事</h3><p>第一晚的文化觀察機場櫃臺與司機常會稱呼你 my friend，這不一定表示欺騙，也不等於真正承諾。所有價格、接送地點、是否含過路費與行李，都要用訊息確認。埃及人習慣以茶、咖啡和聊天建立關係，效率常建立在人際互動而不是流程上。</p><h3>實用提醒</h3><p>小額EGP供小費與市集使用；不要把所有現金放在同一處。機場車資在App或書面確認總價。</p><a class="guide-return" href="#eg1013-2">回到行程</a></details><details class="guide-card" id="guide-eg1013-3"><summary>機場 → Brassbell｜導覽</summary><h3>現場看什麼</h3><p>從車窗看高架道路、密集住宅與西岸吉薩；金字塔周圍也是居民的生活區。</p><p>【明天看邊界】從住宿周邊到景區，觀察商店、工作者、交通與遊客如何共享有限空間。不要把現代城市出現在古蹟旁邊視為純粹破壞，它也反映長期人口增長與居民生計；實際保存壓力需要更具體地理解。</p><h3>歷史背景</h3><p>開羅與吉薩的城市關係尼羅河東岸是歷代開羅核心，西岸的吉薩則因金字塔高原、農地與現代都市擴張形成另一個龐大城市。你住的 Al Haram 並不是「沙漠中的金字塔旅館區」，而是高密度住宅、商店、旅館與馬廄混合的城市邊緣。從房頂看金字塔時，前景的磚樓、電線與街道不是破壞畫面，而是提醒你：古蹟從未離開現代人的生活。</p><p>【Giza不是孤立沙漠景點】現代住宅與道路已緊貼金字塔區周邊；照片常把城市排除，才讓人以為古蹟遠離生活。古代王室工程本來也需要港口、聚落、倉庫與田地支持，並非只有幾座石塔站在荒野。</p><h3>相關故事</h3><p>屋頂裸露鋼筋可能與分期擴建及家庭居住計畫有關，不能憑外觀判斷每一棟房子的法律或經濟狀態。</p><h3>實用提醒</h3><p>附近超市若已關門，先用住宿飲水與簡單點心，翌日補貨；不假設Carrefour深夜仍開。</p><a class="guide-return" href="#eg1013-3">回到行程</a></details><details class="guide-card" id="guide-eg1014-2"><summary>Great Sphinx＋Khafre Valley Temple｜導覽</summary><h3>現場看什麼</h3><p>先拍獅身人面像東側正面，再看獅身與王頭的比例、兩爪間夢碑可見範圍，以及河谷神廟巨石、花崗巖柱與地面。從較低角度把人像和後方金字塔分開，避免頭部與石塔重疊。</p><p>【沿三個層次看】先看獅身人面像與卡夫拉金字塔的地勢關係，再看前爪間夢碑的位置，最後看河谷神廟的方形柱、巨石接縫與地坪。河谷神廟與獅身人面像前的神廟是不同建築，不要把它們混稱一座。</p><p>【河谷神廟為什麼這麼樸素】厚重花崗巖、筆直立柱與封閉量體，和幾天後滿牆雕刻的Edfu差別很大。這不是古王國工匠不會裝飾，而是這個空間以石材、尺度及王像營造永久秩序。想像當年神像、光線和祭司活動，再看如今空出的底座，會比只說「石頭很大」更有內容。</p><h3>歷史背景</h3><p>卡夫拉與視覺欺騙卡夫拉金字塔因地勢較高、坡度略陡，常看起來比古夫更大；頂部仍保留部分外殼石。它與獅身人面像、河谷神廟的關係，使整個複合體格外完整。河谷神廟用巨石與花崗巖營造穩定、永恆與王權的感覺。</p><p>獅身人面像獅身人面像通常與卡夫拉時代相關，身體是獅子、頭部為王，結合力量與統治智慧。它面向東方日出，後來的圖特摩斯四世在兩爪間立「夢碑」，宣稱自己清除沙土後獲得王位承諾，顯示古蹟在古代也會被重新解釋與政治利用。</p><p>【先把神像放回地圖】獅身人面像不是從遠處運來的獨立雕塑，而是利用高原原有石灰岩直接雕成；頭部、身體、周圍凹槽與神廟石材因此能一起研究。高原不同巖層硬度不同，風化程度也不同。看見身體橫向凹陷，不能僅憑照片就推算一個比王朝更早的神祕年代。</p><p>【同一尊像，不同年代的神】第四王朝的獅身人面像通常與卡夫拉的王權計畫相連；到一千多年後的新王國，又被理解為地平線上的荷魯斯 Horemakhet。也就是說，圖特摩斯四世來到這裡時，眼前已是古蹟。他不是與卡夫拉同時代的人，夢碑屬於後來對古蹟的新詮釋。</p><h3>相關故事</h3><p>圖特摩斯四世用清沙與夢中承諾敘述自己取得王位的合法性；它比金字塔晚很多，說明古代人也會重新使用更古老的遺產。</p><p>【夢碑：一份王位合法性的自述】碑文說，年輕王子打獵後在被沙掩埋的神像旁休息，夢中神向他要求清沙，並承諾王位。可以把它當王朝宣傳與神聖王權的故事來讀，而不能當作夢確實預知未來的證據。現場值得問的是：新國王為何需要讓一尊古老神像替自己背書？</p><p>【常見誤解】鼻子的毀損不能歸咎於拿破崙士兵開炮；這種流行說法不是可靠的損壞史。也不要把神像各部位所有修補都視為現代，古代人已多次維護、清沙與重新利用它。</p><h3>實用提醒</h3><p>08:00–09:30通常是面東正面較有利的光；不可跨欄接近夢碑，不保證能看清全部碑文。</p><a class="guide-return" href="#eg1014-2">回到行程</a></details><details class="guide-card" id="guide-eg1014-3"><summary>Khufu＋Queens’ Pyramids｜導覽</summary><h3>現場看什麼</h3><p>外面看失去包面後的石塊層與保留包面差別；選擇入內時看上升廊道、大走廊的逐層內收和國王墓室花崗巖。抬頭觀察構造，不將狹窄通道當成快速通行路。王后小金字塔從外面比較尺度、相對位置與獨立祭祀功能。</p><p>【入內前先決定你想體驗什麼】古夫內部不是彩色壁畫展，重點是狹長上行通道、大走廊的高度、承重方式，以及石棺所在空間的簡潔。把牆上沒有裝飾和Unas墓室的文字對照，你會看到皇家來世建築的轉變。狹道中請先收相機、注意低頂，不要為拍完整空景擋住雙向人流。</p><p>【女王金字塔與周邊墓地】站在小金字塔附近，觀察大金字塔之外的整齊墓區。靠近國王的安葬位置本身就是地位；親屬、官員、祭祀人員與土地制度把這裡變成長期運作的墓城。小型建築不等於不重要，其主人身分也不能一概用「三位老婆」解釋。</p><h3>歷史背景</h3><p>古王國與金字塔時代吉薩三大金字塔主要建於第四王朝，約公元前 26 世紀。這時中央王權能徵集農業剩餘、石材、船隻、糧食與熟練勞動者。現代考古證據顯示，建造者不是電影裡被鞭打的外國奴隸大軍，而是有組織的勞動隊伍、工匠與季節性人力； 他們有糧食配給、墓地與醫療照護。這不代表工程沒有強制性，而是比「奴隸拉石頭」複雜得多。</p><p>古夫大金字塔古夫金字塔原高約 146.6 公尺，外覆白色圖拉石灰岩，頂端可能有金字塔尖。入口與內部通道不等於「尋寶密道」； 王室墓室的空曠、精確與封閉，本身就是讓國王在來世轉化的空間。進入內部的價值主要是感受尺度與工程，而不是看壁畫。</p><p>孟卡拉與王后金字塔孟卡拉金字塔規模較小，底部可見花崗巖外殼的工程痕跡。王后金字塔提醒我們，王室女性在王權延續與祭祀體系中不是附屬人物；但每一座小金字塔的確切主人仍可能有學術爭議。</p><p>【工程其實從農田開始】古夫要建金字塔，先得讓人種出多餘糧食、徵調船隻、安排採石、管理倉庫及發放配給。石塊的堆疊只是最後可見的一段。AERA在吉薩研究的建造者聚落，使我們能從居住、生產與管理空間理解工程背後的社會；它不是供所有旅客自由進入的額外景點。</p><p>【外殼與核心不是同一種石頭】主要核心使用石灰岩，原本平滑明亮的外殼另用精選材料；部分重要內部空間使用來自南方的花崗巖。不同材料對應不同運輸成本與象徵效果。今日粗糙階梯狀外表不是竣工時的設計，請把它想像成有整齊外皮的幾何形體。</p><h3>相關故事</h3><p>工程需要徵集糧食、運河船運、採石與熟練勞動，不能只用「外國奴隸」一種印象概括。工人有組織與配給，也不代表當時不存在強制勞役。</p><p>【Merer日誌：比神祕傳說更精彩的運貨紀錄】在紅海岸Wadi el-Jarf找到的紙草，記錄Merer及船員運送圖拉石灰岩到古夫工程區的工作。這不是完整的「金字塔施工說明書」，卻把抽象巨型工程變成有人名、航程與工作日的日常。看到高原與河谷的距離時，想像人工水路與港口怎樣接起石場和工地。</p><p>【不要把所有問題說成已經解完】考古已能說明大量採石、運輸、組織與建造證據，但各階段坡道的精確配置仍有討論。合理導覽既不需要外星人，也不需要假裝每一塊石頭的上升路徑都已知道。</p><h3>實用提醒</h3><p>基本票不含古夫內部。幽閉、悶熱或身體不適就只看外觀；不需要為了完整打卡三座都進。</p><a class="guide-return" href="#eg1014-3">回到行程</a></details><details class="guide-card" id="guide-eg1014-4"><summary>Khafre → Menkaure｜導覽</summary><h3>現場看什麼</h3><p>先找卡夫拉高地造成的視覺效果，再比較三塔坡角、包面材料與各自通往河谷的軸線。孟卡拉底部有粗麵與較精修的花崗巖，能看見工程不同階段。</p><p>【現場比較任務】選同一角度各拍一張：古夫的巨大量體、卡夫拉頂端留下的外殼、孟卡拉底部石材。回看照片時比較基座高度、坡面、材質與周邊附屬建築，比三張近乎相同的三角形合照更能留下記憶。</p><h3>歷史背景</h3><p>卡夫拉與視覺欺騙卡夫拉金字塔因地勢較高、坡度略陡，常看起來比古夫更大；頂部仍保留部分外殼石。它與獅身人面像、河谷神廟的關係，使整個複合體格外完整。河谷神廟用巨石與花崗巖營造穩定、永恆與王權的感覺。</p><p>孟卡拉與王后金字塔孟卡拉金字塔規模較小，底部可見花崗巖外殼的工程痕跡。王后金字塔提醒我們，王室女性在王權延續與祭祀體系中不是附屬人物；但每一座小金字塔的確切主人仍可能有學術爭議。</p><p>【卡夫拉與孟卡拉不是古夫的縮小複製】三組建築各有河谷神廟、堤道、祭祀區和墓葬安排。卡夫拉選址較高，所以視覺上常勝過古夫；孟卡拉體積較小，卻在部分外殼使用花崗巖，不能只憑高度替三位統治者的財力或地位排名。</p><p>【從材料看施工階段】孟卡拉外殼部分石面不完全平整，能提示精修加工與安裝流程並非每處都同步完成。先看可見表面，再讀現場說明；不要把粗糙面全部歸因於現代破壞。</p><h3>相關故事</h3><p>三代法老以各自複合體延續王權，也各有資源與設計選擇；塔較小不等於墓主人不重要。</p><p>【國王不只用墓說話】你在博物館看到的坐像、三人組像，原本往往與這些祭祀建築的程序相連；石像可以接受祭祀、讓王的存在延續。到了GEM或舊埃及博物館，遇到相關王像時，請把它重新放回今天看過的神廟，而不是當孤立美術品。</p><h3>實用提醒</h3><p>接駁移動加步行，避免沿車道硬走。午前光線較硬，適合拍接縫、包面與材質細節。</p><a class="guide-return" href="#eg1014-4">回到行程</a></details><details class="guide-card" id="guide-eg1014-6"><summary>Panorama／Nine Pyramids Viewpoint｜導覽</summary><h3>現場看什麼</h3><p>先用廣角收三大金字塔，再用中焦壓縮塔羣層次；加入沙漠前景與少量人物交代尺度。九座視角取決於站位，並非每個標示Panorama的點都能看見全部小塔。</p><p>【五分鐘導覽法】第一分鐘認出三位國王的金字塔；第二分鐘找較小衛星金字塔；第三分鐘想像各自向東的神廟與堤道；第四分鐘看城市邊界；最後一分鐘才拍全景。所謂「九座」是特定角度把大小金字塔收進畫面的名稱，不代表九座同等規模的法老大墓。</p><h3>歷史背景</h3><p>全景觀景臺的真正意義在西南方看三大金字塔時，你看到的是刻意安排的王室地景。它們並非單純排成一列，而是各自有軸線、神廟與通往古代河岸的堤道。今天城市已逼近高原，正好讓你理解世界遺產面對的現代都市壓力。</p><p>【讀一張沒有畫出的古地圖】遠方水道與耕地、近處高原與墓地，分屬不同環境。古代人把巨大永久陵墓設在較乾燥地帶，也需要河運把物資送近工地。尼羅河河道與支流曾經改變，不能用今天河岸的位置判定古人一定要陸運同樣距離。</p><h3>相關故事</h3><p>高原看似純沙漠，祭祀系統原本卻和水道、港口與農業剩餘相連；遠方現代城市顯示遺產保存與都市擴張的拉鋸。</p><p>【獵戶座說要怎麼聽】天空與王權確實有深厚關係，但「整片吉薩精確複製某一年代獵戶座、因此證明失落文明」是超出證據的延伸。地形、前代建築、祭祀動線與施工條件也是排列的重要因素；不要讓一個好記的星座故事蓋過眼前整套地景。</p><h3>實用提醒</h3><p>西南側向東北拍塔羣，下午較容易取得側順光；13:30–15:30是可執行視窗，不是日落視窗。大風沙塵時優先清晰能見度，勿追求駱駝越界取景。</p><a class="guide-return" href="#eg1014-6">回到行程</a></details><details class="guide-card" id="guide-eg1014-7"><summary>住宿休息／屋頂光影｜導覽</summary><h3>現場看什麼</h3><p>保留塔尖、天空與城市前景，曝光以天空為主；天暗後可補城市燈光，注意欄杆安全。</p><p>【用夕照讀地形】先找西側天空、金字塔輪廓與前景街區，不要只把太陽置中。金字塔與城市同框能提醒你：今天看到的是仍有人居住的大都會邊緣，而非停止時間的考古舞臺。不同屋頂朝向與視線遮擋會影響構圖，住宿名稱不代表每個房間都有相同景觀。</p><h3>歷史背景</h3><p>吉薩是現代都市與古墓地的交界，不是與人隔絕的沙漠遺址。</p><h3>相關故事</h3><p>屋頂照片可同時記錄古王國與21世紀城市。</p><p>【傍晚的第二種吉薩】白天看王室的石材與幾何，晚上聽周邊城市生活的聲音。兩者放在一起，纔是此次抵達的真實地點，而不是隻有明信片取景。</p><h3>實用提醒</h3><p>不要把18:30固定當日落；以當日天文時間與住宿視野為準，園內不等真正夕陽。</p><a class="guide-return" href="#eg1014-7">回到行程</a></details><details class="guide-card" id="guide-eg1015-2"><summary>Grand Hall＋Grand Staircase｜導覽</summary><h3>現場看什麼</h3><p>拉美西斯二世巨像：先遠看比例與動線，再找王冠、王名框、手持物與腳邊尺寸。大階梯按人物、神祇、神廟構件與來世主題慢看，挑四件不同材質；從上層回望，理解博物館如何把你帶向吉薩方向。</p><p>【不要一路只仰頭】從腳部看雕像承重與基座，再看雙手、王冠、腰帶與王名框。可以問：這尊像在向誰呈現王？為什麼雙腿、手臂採穩定姿勢？巨像的表情往往是理想王者，不宜當成現代證件照。</p><p>【大階梯的比較方法】每層停一件就好：一尊王像、一件神像、一塊帶文字的建築構件、一件棺槨。比較尺寸、石材和觀看距離。大型構件離開原建築後，原來的高度與光線可能消失，展館標籤和出土地資訊能替你補回環境。</p><h3>歷史背景</h3><p>建築與位置博物館位於吉薩高原邊緣，建築軸線、巨大玻璃面與金字塔視野把現代國家與古代王權放在同一畫面。入口的拉美西斯二世巨像原在孟菲斯出土，後來立於開羅市區，再搬到 GEM；它的移動史本身就是現代埃及如何利用古代遺產的故事。</p><p>【從孟菲斯到現代首都，再到新館】拉美西斯二世巨像的移動，讓同一件古物先後成為古代神廟王像、現代城市地標與博物館迎賓者。古代王權、共和國的國家形象和觀光展示並非同一件事，卻共同借用巨像的尺度。你昨天看金字塔，今天又被巨像包圍，這也是展館刻意安排的觀看情緒。</p><h3>相關故事</h3><p>巨像在孟菲斯出土、曾立於開羅市區、再移入新館；文物搬遷本身就是現代國家如何展示古代的歷史。</p><p>【博物館也是一種作者】同一尊像放在城市交通中，像公共紀念碑；放在高大中庭中，像文明的開場。你可以欣賞新館的效果，同時注意展覽怎麼安排先後次序，哪些人物一直出現、哪些普通人的生活要自己刻意尋找。</p><h3>實用提醒</h3><p>拍建築軸線時避開人羣通道；玻璃櫃近拍稍偏角減反光，不用閃光。</p><a class="guide-return" href="#eg1015-2">回到行程</a></details><details class="guide-card" id="guide-eg1015-3"><summary>Tutankhamun Galleries｜圖坦卡門完整觀看法｜導覽</summary><h3>現場看什麼</h3><p>第一輪看外棺、內棺、面具與多層保護，理解木乃伊如何被層層包裹。第二輪選牀、椅、涼鞋、衣物、遊戲或戰車中的三類，問它是生前使用、葬禮特製或象徵用途。第三輪看卡諾卜罐與保護女神、沙布提小像：身體保存、器官照護、替死者勞動各有功能。</p><p>黃金不只是財富，耐久與光澤也連結神聖和不朽。不要讓「少年法老」掩蓋宮廷制度：這份墓葬由大量工匠、祭司與官員完成。</p><p>【第一站：臉與身體】若面具和棺槨正在展出，先看王冠、眼線、鬍鬚及保護動物，再讀標籤上的材料；藍色不一定全是同一種寶石。比較自然人的臉和理想王者形象：作品在建立神聖身分，而不是單純追求像本人。</p><p>【第二站：三件生活用品】從鞋、杖、椅、衣物或遊戲中各挑一件。看磨耗、結構、尺寸與裝飾是否兼顧實用。不要看到很多手杖就自己下醫學診斷，也不要把墓中所有物件都當成王每天用過的私物；製作、修補與再利用必須看研究或標籤。</p><p>【第三站：來世的勞動與保護】沙布提小像不是玩偶，而是承擔來世勞役的代理者；卡諾卜相關容器不是一般收納罐。將它們與王的牀、船、食物放在一起看，這座墓更像一套確保王能持續存在的完整制度。</p><h3>歷史背景</h3><p>如何看圖坦卡門圖坦卡門在歷史上不是最偉大的征服者，他的重要性主要來自墓葬保存相對完整。看黃金面具之外，更要看日常器物、衣物、遊戲、戰車、牀、容器與宗教小像；這些物品共同建立一位年輕國王在來世需要的完整世界。</p><p>阿瑪納時代背景圖坦卡門的父輩時代與阿肯那頓宗教改革相關，王室曾提高 Aten 太陽圓盤的地位、改變藝術與首都。圖坦卡門即位後恢復 Amun 等傳統神祇，名字也從 Tutankhaten 改為 Tutankhamun。這讓他的短暫統治成為政治修復與宗教回歸的一部分。</p><p>【把年輕國王放回政治轉折】圖坦卡門承接的是阿瑪納宗教與宮廷調整後的王朝，不是突然出現的童話少年。名字中的Aten改為Amun，連結神祇地位、祭司資源與統治中心的再安排。陵墓財物非常豐富，但財物多少與生前軍事成就不能直接畫等號。</p><p>【墓葬不是一隻黃金面具】棺槨、神龕、包裹層、護符、器官容器、牀、食物與服務小像各有功能。看不同尺寸的保護層如何嵌套，再看它們如何把身體、名字、形象與供養接起來，才能明白「保存肉身」只是來世工程的一部分。</p><h3>相關故事</h3><p>阿肯那頓提升Aten地位、改變首都與藝術；圖坦卡門恢復傳統神祇，王名由Tutankhaten轉為Tutankhamun。墓葬保存狀況而非軍事成就，使他成為今日最有名的法老之一。</p><p>【1922年的發現也有一羣人】Howard Carter與贊助者Carnarvon最常出現在故事裡，但清理、攝影、搬運、修復與記錄依賴許多埃及工人及專業成員。墓室的發現並不等於隔天就把所有東西搬走，脆弱器物需要長期紀錄與處理。</p><p>【詛咒與死因不要當定論】「法老詛咒」是大眾媒體非常成功的故事，不能取代可檢驗證據；圖坦卡門死因也不是看到一張掃描圖就能簡化成確定謀殺。最值得記住的發現，是大量通常散失的物件在同一墓中共同留下脈絡。</p><h3>實用提醒</h3><p>圖坦卡門指定區域可能禁拍，先看標誌。順著參觀人流停留，不在面具前堵住所有人。</p><a class="guide-return" href="#eg1015-3">回到行程</a></details><details class="guide-card" id="guide-eg1015-5"><summary>Khufu’s Boats Museum｜太陽船｜導覽</summary><h3>現場看什麼</h3><p>看船體長度、船板接縫、繩索連線方式、槳與艙棚，不把它只當大木模型。木材來源、拆解埋藏與現代復原三件事要分開：你看見的是古代工程經考古整理後呈現的整體。</p><p>【先看船骨架，不要只看船頭】沿船側觀察船板、接合、綁紮與舵的關係。想像它在水中受力，而不是停在展示支架上的狀態；再看長船與人物的比例，理解操船、載重與儀式隊伍所需的人力。</p><p>【拆解與重組】博物館若提供零件、修復或第二艘船的工作展示，注意編號、支撐與濕度控制。考古不是找到「完整模型」後擦乾淨，而是判斷許多分離構件原來怎樣共同工作。</p><h3>歷史背景</h3><p>古王國葬祭船與水路運輸、國王來世及太陽航行意象相連；實際生前用途和各船的象徵功能仍須按具體文物研究理解。</p><p>【船為什麼要埋在金字塔旁】尼羅河是古埃及的大道，船也是太陽神移動與王者旅行的重要象徵。古夫船同時引出實用、葬禮與神聖航行等解釋；「太陽船」是常用名稱，不表示每一段實際使用史都已有唯一答案。</p><p>【木材能說出另一張地圖】埃及不是到處都有適合長船板的大樹，木材取得反映遠距資源與交換網絡。船體比石金字塔更容易腐壞，能保存並重組，本身就是重要的考古與修復成果。</p><h3>相關故事</h3><p>把昨天的船坑、河谷神廟與今日船隻連起來，金字塔就從靜止石塔變成有水路和祭祀程式的系統。</p><p>【和Merer接在一起】吉薩的石材運輸與墓旁埋船提醒你：金字塔文明不只擅長石工，也依賴造船、繩索、碼頭、水道與熟練船員。今天看的是木船，昨天看到的巨石卻同樣離不開河流。</p><h3>實用提醒</h3><p>由船側斜拍交代長度，再拍接縫；遵守玻璃與護欄界線。</p><a class="guide-return" href="#eg1015-5">回到行程</a></details><details class="guide-card" id="guide-eg1015-6"><summary>Main Galleries｜跨王朝比較與金字塔窗景｜導覽</summary><h3>現場看什麼</h3><p>王像：比較古王國穩定對稱、中王國面部表情、阿瑪納身形與家庭場景；不要把藝術形象直接當醫學診斷。書吏、工具與家庭用品：找誰負責記錄、誰生產、誰被畫得最小。棺槨與來世用品：看不同時期的文字、材料和負擔能力。最後到允許的窗景位置，把實際金字塔和館內王權敘事連上。</p><p>【用同一題看三個展區】選「誰在工作」：找書吏、農業、紡織與運輸材料。再選「誰得到永恆」：比較皇家、官員與較普通墓葬的用品。最後選「誰與埃及交流」：看材料、器形與文字如何顯示南方努比亞、地中海及近東聯繫。</p><p>【怎麼讀人物的大小】大人物不一定站得近，小人物不一定是小孩；王、墓主人、配偶、僕役的尺寸常以地位安排。側面頭部、正面眼睛與肩部、側面腿的組合，是為清楚呈現各部分，不是畫家不懂立體。</p><p>【一張照片留住一個問題】拍文物旁的標籤，再拍物件細節，記下出土地與年代。只留下華麗正面照，很難在Luxor遇到相似圖像時知道究竟相隔多久。</p><h3>歷史背景</h3><p>王權之外的觀看方式博物館容易讓人只記得國王與黃金。請刻意尋找工匠工具、書吏、農業、家庭、飲食、女性、兒童與外國人的形象。 古埃及文明持續三千年，不是單一民族與固定文化，而是在尼羅河、努比亞、利比亞、黎凡特、希臘與羅馬交流中變化。</p><p>博物館與文物返還大量埃及文物因殖民時期考古分配、購買、掠奪與早期法律制度而散佈全球。GEM 強化了埃及要求重要文物回歸的論述。你不必在館內得出單一答案，但可以思考：文物應屬於出土地、全人類、收藏機構，還是共享管理？</p><p>【三千年不能壓成同一種「埃及風」】古王國、中王國、新王國，再到晚期與托勒密時代，相隔的時間極長。借用早期形式可能是在宣告承續，換一種臉部與身體表現也可能是新的王權選擇；風格差異不應簡單排成從原始到進步的直線。</p><h3>相關故事</h3><p>同一件文物可同時有古代用途、出土史與收藏史；問「誰選擇把它放在這裡」能讀懂現代博物館。</p><p>【文物流散不能用單一故事概括】海外收藏可能涉及考古分配、當時法律下的交易、殖民權力、盜掘或戰利品，不同物件的來歷各不相同。理解文物返還爭議，要從具體出土與轉移紀錄開始；新館的存在也讓「原產地沒有展示能力」一類籠統說法受到重新檢視。</p><h3>實用提醒</h3><p>17:00結束是自訂節奏；不把當天開放到18:00當成必須看滿。晚上不排跨城活動。</p><a class="guide-return" href="#eg1015-6">回到行程</a></details><details class="guide-card" id="guide-eg1016-2"><summary>Unas金字塔＋Djoser複合體入口｜導覽</summary><h3>現場看什麼</h3><p>墓室先看成行象形文字和星空天花，這不是歷史故事連環畫，而是協助王昇天、獲食物和避開危險的文字。用位置、重複公式與星空理解空間，比試圖逐字猜譯更好。</p><p>【入室後依這個順序】先看天花上的星空，再看文字成列覆蓋牆面的位置，最後看石棺與通道關係。把頭抬向星空時，想像墓不是隻有地下方向，也朝向天界。古夫的空曠石室與Unas的文字密度，是你這三天最清楚的一組比較。</p><h3>歷史背景</h3><p>烏納斯與金字塔文烏納斯金字塔外觀不大，但內部保留早期金字塔文。這些咒文原本專屬國王，協助他昇天、與神合一、避開危險。後來類似內容逐漸進入棺槨文與《死者之書》，顯示來世知識慢慢向更廣泛階層擴散。</p><p>【文字成為墓的建築材料】Unas外觀遠不如吉薩巨大，墓室文字卻把王在來世應說什麼、去何處、如何接受食物與避險刻成持久形式。這些是迄今最早一批刻於皇家金字塔內的金字塔文，不代表埃及宗教到此才開始，也不是一本按章節統一編成的故事書。</p><p>【從口頭儀式到可永久生效的石文】有的段落是祈求與讚美，有的像指令或保護公式。文字在這裡不是向遊客解說墓主人生平，而是幫助亡王完成轉化。</p><h3>相關故事</h3><p>從國王專屬金字塔文，到後來棺槨文和《死者之書》，來世知識的使用物件逐漸改變；不是某一天突然對所有人免費開放。</p><p>【金字塔文不等於《死者之書》】兩者相隔很久，使用者與載體也不同。可以說它們屬於埃及長期發展的來世知識，但不能說所有版本都是同一本書改名，或每個埃及人都能享有相同規格。</p><h3>實用提醒</h3><p>小墓室人數有限；以票面與入口人員確認入內資格、最後時間及拍攝，不接受付小費就可超規的說法。</p><a class="guide-return" href="#eg1016-2">回到行程</a></details><details class="guide-card" id="guide-eg1016-3"><summary>Djoser階梯金字塔與Heb-Sed庭院｜導覽</summary><h3>現場看什麼</h3><p>柱子像束起的植物、石造入口仍模仿早期建材；看有些建築只有外觀或封閉空間，說明用途可偏重永恆儀式而非日常居住。沿庭院想像國王更新統治能力的Heb-Sed祭典。</p><p>【順著入口柱廊慢走】觀察石柱如何與旁邊牆體結合，再進開闊庭院感受由狹至廣的轉換。看階梯金字塔時，不只數六層，也看它與庭院、圍牆及附屬設施組成的整體。周邊仿建築立面看似可進，部分其實是象徵性空間。</p><p>【Serdab與觀看】若觀覽點可及，留意小孔與封閉王像室的關係。王像不需要像美術館作品般四面開放；它要在受保護的環境中維持王的存在與祭祀聯繫。</p><h3>歷史背景</h3><p>孟菲斯與墓地帶孟菲斯位於尼羅河谷與三角洲交界，是統治上下埃及的戰略中心。城市在沃土，墓地則放在西方沙漠邊緣，既避開洪水，又與日落和死者世界相關。從吉薩、阿布西爾、薩卡拉到達舒爾形成長達數十公里的王室墓地帶。</p><p>左塞爾階梯金字塔與伊姆特普第三王朝的左塞爾建築羣把早期長方形 mastaba 逐層堆高，形成階梯金字塔。傳統上歸功於伊姆霍特普，他後來被神格化為智慧與醫療人物。整個圍牆、庭院、假門與祭典建築，像把王宮永久化，讓死後國王永遠舉行更新王權的 Heb-Sed 祭典。</p><p>【石頭模仿原本不耐久的世界】Djoser建築羣的一個突破，是將木、蘆葦、泥磚等早期建築語彙轉成石造。柱子有植物束的形狀，牆面與門廊延續宮殿的記憶。它不是一位天才忽然想出三角形，而是多次擴建、材料實驗與國家組織結合的結果。</p><p>【Heb-Sed是王權更新】這類祭典透過儀式重申國王仍能治理上下埃及。陵墓中的庭院與象徵性建築，讓這項更新在死後也能繼續。對古埃及人來說，並非每座門都需要供活人實際通行，象徵用途本身可以有效。</p><h3>相關故事</h3><p>伊姆霍特普後來被神格化，建築師與智慧／醫療的連結是跨越很長時期形成，不能全投射回建造當日。</p><p>【伊姆霍特普的第二生命】後世把他尊為智慧與醫療人物，遠超過建築行政角色。這是跨世紀的崇敬發展，不宜把後來所有傳說都塞回Djoser工地當作 同時代 事實。古人也會創造自己的文化英雄。</p><h3>實用提醒</h3><p>拍階梯輪廓用斜側角看六層形態；禁止攀爬。是否進金字塔內部另看票種，不等同園區基本票。</p><a class="guide-return" href="#eg1016-3">回到行程</a></details><details class="guide-card" id="guide-eg1016-4"><summary>Ti或Mereruka墓｜普通工作的來世用途｜導覽</summary><h3>現場看什麼</h3><p>依序找捕魚、畜牧、搬運與工坊場景：誰畫最大？手上拿什麼工具？成排人員朝哪個方向送祭品？最後找假門與祭臺，理解浮雕如何把勞動轉成永遠供養墓主的世界。</p><p>【找一項工作，讀完整流程】看田間、運送、處理與堆放是否分成數層；不要從一個工人的姿勢直接跳到另一面牆。圖像中的水平帶是畫面組織，不必每一層都當作不同樓層。</p><p>【假門與祭品桌】假門像門卻不通往可走進的房間，它讓生者供養與死者世界產生聯繫。祭品桌、食物清單、姓名與頭銜不是附帶裝飾：知道「為誰供養」與「供養什麼」，對儀式非常重要。</p><h3>歷史背景</h3><p>貴族墓與日常生活 Ti、Mereruka 等墓中的農耕、捕魚、畜牧、工藝與宴會畫面不是寫實紀錄片，而是讓墓主人在來世永遠取得食物與服務。不過它們仍提供服裝、工具、動物、階級與勞動分工的重要線索。</p><p>【墓地裡的農業是來世供應鏈】墓主人需要麵包、啤酒、肉、布料與祭品，牆上收割、捕魚、製作和運送的圖像，讓這些供應可以永續。它們是精心選擇的理想世界，不會平均呈現所有社會階層的生活，卻保存非常具體的工具與分工線索。</p><h3>相關故事</h3><p>大小代表身分，不完全是透視。這些畫面能提供勞動線索，但不是古代生活的中立攝影紀錄。</p><p>【畫得最大的人通常最有權】Ti或Mereruka的主體形象可能遠大於周圍工作者，這是地位尺度。你可以看見工人努力做事，卻也要看到敘事權握在出資建墓者手上。這與GEM裡一排國王巨像形成有趣呼應：誰付錢，誰最容易在記憶裡被放大。</p><h3>實用提醒</h3><p>低光用手機穩住慢拍，不碰刻痕，不用閃光。</p><a class="guide-return" href="#eg1016-4">回到行程</a></details><details class="guide-card" id="guide-eg1016-5"><summary>Serapeum｜阿匹斯公牛的地下石棺｜導覽</summary><h3>現場看什麼</h3><p>站在開放走道看石棺與通道寬度，想像搬運、轉向及下放所需的勞動組織；觀察石材、棺蓋、銘文，不用體積直接推論超自然科技。</p><p>【先看廊道與側室】讓眼睛適應暗處，觀察主通道怎麼分出安葬空間，再看石棺與坑位的關係。拍攝時保留一段走廊，比把畫面全部塞滿黑色石棺更能顯示地下系統的尺度。</p><p>【巨石不等於不可能】思考採石、搬運、安置與精修可能是分階段完成，不應因狹道看來困難便跳到失落科技。研究者仍有具體工程問題要處理，但未知不會自動變成外星證據。</p><h3>歷史背景</h3><p>Serapeum 與阿匹斯公牛 Serapeum 地下長廊安放神聖阿匹斯公牛的巨大石棺。阿匹斯與孟菲斯主神 Ptah 相關，死後又與 Osiris 結合成 Osiris-Apis，希臘化時代進一步影響 Serapis 崇拜。巨大石棺展現的不只是工程，也是一套國家支援的動物神聖化制度。</p><p>【並不是每頭牛都享有這座墓】Apis是經挑選、具有宗教地位的聖牛，生前與孟菲斯的Ptah崇拜相連，死後葬儀又帶有Osiris的意義。供養、確認繼任聖牛、朝聖與葬禮，需要人員、土地、材料及資金；你看見的巨石棺，是整套神殿制度最後的一環。</p><h3>相關故事</h3><p>特定聖獸經辨認、飼養、祭祀與埋葬；這套制度牽動祭司、香料、工匠和土地收入。</p><p>【一個名稱跨越宗教世界】Apis、Osiris-Apis與希臘化時代的Serapis有歷史聯繫，但它們不是任何時代都完全相同的神。你之後在托勒密神廟看到希臘統治者穿法老服飾時，可以想起：政治更替往往伴隨宗教翻譯，而不只是全部推倒重來。</p><h3>實用提醒</h3><p>地下路面與臺階注意腳下，不自行下到限制區。與導遊約好地面集合點。</p><a class="guide-return" href="#eg1016-5">回到行程</a></details><details class="guide-card" id="guide-eg1016-6"><summary>Memphis Open-Air Museum＋簡餐｜導覽</summary><h3>現場看什麼</h3><p>看拉美西斯二世倒臥巨像的面部、雙冠殘部、腰帶與王名，再看雪花石膏獅身像。因雕像倒放，你能從高處近看原本站立時難見的工藝。</p><p>【倒臥巨像的好處】你能在較接近平視的位置看王冠、臉部、腰帶與王名框，這在直立巨像旁通常做不到。請先看人物比例，再看雕刻表面的處理，最後想像它原先站立時如何控制觀看者的距離。</p><p>【和GEM做配對】兩地都出現拉美西斯二世，提醒你他積極把自身形象放進早已重要的宗教中心。看見他的名字，不等於附近全部建築都由他初創。</p><h3>歷史背景</h3><p>孟菲斯與 Ptah 孟菲斯主神 Ptah 被視為工匠與創造之神，透過心與言語創造世界。城市遺跡今天看來分散，是因為尼羅河改道、建材再利用與長期居住；不要期待像龐貝一樣完整街道。倒臥拉美西斯二世像則反映後世國王如何把自己放入古老首都的權力記憶。</p><p>【首都不在最壯觀的地方】孟菲斯靠近河谷與三角洲的接點，適合交通、管理與資源集散；王墓則在較乾燥的西側。低地建築經河道變動、居住累積、地下水及石材再利用而變得破碎。今天墓地較宏偉，不能反推古代城市不重要。</p><p>【Ptah與製作的力量】孟菲斯主神Ptah與創造和工匠密切相關。當地神學用心與言語理解創造，不代表所有埃及城市都採同一創世版本。埃及宗教容許多種地方傳統相互並存、結合。</p><h3>相關故事</h3><p>古代首都在洪泛平原，墓地在乾燥沙漠，材料再利用與居住延續使今日墓地往往比城市保存得完整。</p><p>【不要急著尋找一座完整古城】這裡更像古代大城市留下的幾扇窗口。半小時也能有收穫：把巨像、主神、河流與墓地位置連成一張圖，便能將前兩天吉薩和Saqqara放回同一個政治區域。</p><h3>實用提醒</h3><p>餐後上洗手間、補水；不要把紀念品店停留算入必要文化導覽。</p><a class="guide-return" href="#eg1016-6">回到行程</a></details><details class="guide-card" id="guide-eg1016-7"><summary>Dahshur｜Bent＋Red Pyramid｜導覽</summary><h3>現場看什麼</h3><p>先在彎曲塔側面辨認坡角轉折與連續外殼；再到紅色塔比較低坡角與紅色石灰岩。入內抬頭看逐層內收的疊澀頂，重量如何藉石層轉移，比空墓室有沒有棺材更重要。</p><p>【彎曲金字塔先看皮膚】它保留較多外殼，最適合理解吉薩竣工時何以不是今天的階梯石面。從較遠處看角度轉折，再從允許靠近的位置看石材接縫；兩種距離各回答不同問題。</p><p>【紅色金字塔看體感】長下降通道、悶熱、狹小出入口與突然升高的墓室，會讓你理解「外面幾何簡單、裡面受力複雜」。若已感到疲勞，外觀與剖面圖同樣能理解建築，不必連續鑽多座內室。</p><h3>歷史背景</h3><p>彎曲金字塔斯尼夫魯的彎曲金字塔下半部角度陡、上半部變緩，可能與結構壓力、施工安全或設計調整有關。它不是單純「失敗品」，而是保留了外殼石、內部結構與工程轉折的珍貴實驗紀錄。</p><p>紅色金字塔紅色金字塔被視為最早成功完成的大型平滑金字塔之一，較低坡度讓結構更穩定。走進內部時，注意階梯狀假拱頂如何分散重量；強烈氣味、狹窄通道與高溫都是體驗的一部分。</p><p>【斯尼夫魯時代是一組工程計畫】彎曲與紅色金字塔都與同一位國王相關，讓我們可以比較不同設計選擇。下陡上緩的轉折能反映施工調整，但原因不能只用「設計師算錯」一句結案；結構、安全、工期與儀式需求可能相互影響。</p><p>【假拱頂不是圓拱】紅色金字塔室內石層逐層內伸，直到頂部合攏，把上方荷重向兩側傳遞。它和後來用楔形石形成的真正拱券不同。你不用背工程名詞，只要抬頭看每層比下一層伸出多少，就能看懂施工策略。</p><h3>相關故事</h3><p>把Djoser的階梯、Sneferu的坡角試驗與昨日Khufu放回年代順序；今天行車順序不等於建築發展順序。</p><p>【把今天倒著回想】先有早期墓冢與階梯，再有真金字塔的大規模探索，之後纔是吉薩；今日參觀順序不必等於建造順序。離開前用Djoser—Snefru—Khufu這條短線，把三天現場經驗排回時間軸。</p><h3>實用提醒</h3><p>內部悶熱、陡梯與氣味可能不適，選擇外觀同樣能理解建築。若末班關閉時間較早，司機與導遊提前刪減，不壓線。</p><a class="guide-return" href="#eg1016-7">回到行程</a></details><details class="guide-card" id="guide-eg1017-2"><summary>Bahariya Oasis｜午餐、換4WD｜導覽</summary><h3>現場看什麼</h3><p>找泉水灌溉、棗椰、村落邊界與補給站。荒漠中的綠色不是無限水源，地下水使用決定聚落與農業規模。</p><p>【午餐時看聚落，而不只看吉普車】觀察井、灌溉溝、田地與住屋的距離；也留意公路補給如何把燃料、食物、觀光用品帶進來。你見到的居民不應一律貼上「遊牧民族」標籤，定居農業、道路運輸與旅遊早已交織。</p><h3>歷史背景</h3><p>綠洲為何存在埃及西部沙漠的綠洲位於低地與含水層可被利用之處。棗椰、橄欖與小規模農業依賴泉水和地下水。綠洲不是浪漫孤島，而是古代商路、軍事監控、農業與人口遷徙的節點。</p><p>Bahariya 的居民與歷史 Bahariya 在法老、希臘羅馬、基督教與伊斯蘭時代都有人居住。現代居民的生活與農業、採礦、旅遊和公路運輸相關。進入沙漠前換車、補水、分配物資，正是綠洲作為「門戶」的功能。</p><p>【綠洲不是沙漠裡碰巧下雨的一片綠】Bahariya是一個較低的盆地，地下含水層與泉、井共同支撐定居。棕櫚樹、耕地和聚落看似孤立，實際透過地下水系、道路、商貿與國家服務連到更大區域。今日開井取水也牽涉資源更新速度，不能把地下水想成永遠抽不完的水箱。</p><p>【河谷與綠洲的不同】河谷歷來面對洪水過多或不足，綠洲則必須經營有限水源與遮蔭。多層農作安排能使高大棕櫚、果樹與較低作物利用不同高度的空間；現場是否可見某種組合，依當地農地與季節判斷。</p><h3>相關故事</h3><p>綠洲是古代商路與現代公路的節點，司機換車、補水和備餐就是它作為門戶的日常功能。</p><p>【從水開始問一個問題】同樣是沙漠，為什麼有的地方長出密集棕櫚，有的地方幾乎沒有植物？答案常在地面以下。這會讓午餐站變成理解西部沙漠的第一堂地理課，而不只是換車等待。</p><h3>實用提醒</h3><p>2026/10/12查覈FCDO：白沙漠、黑沙漠及Bahariya在廣泛限制的例外範圍內，仍要求事先許可及正式嚮導；例外不是無風險或保證保險理賠。</p><a class="guide-return" href="#eg1017-2">回到行程</a></details><details class="guide-card" id="guide-eg1017-3"><summary>Black Desert → El Heiz → Crystal Mountain｜導覽</summary><h3>現場看什麼</h3><p>黑色丘面與白堊區對照，辨認它不是所有地方都由沙堆成。晶體露頭看透光、晶面與周圍沉積巖差別；Crystal Mountain不宜一概寫成石英寶石礦，常見介紹強調方解石等礦物，不能只靠肉眼名稱確定礦種。</p><p>【靠近與遠看各一次】先用遠景看孤丘、盆地與道路，再在允許步行處看碎石形狀、顏色與基岩。到泉水地區看植物邊界，不要把任何泉眼自動視為可飲用或可泡湯。當地供旅行團使用的設施與天然地貌，也要分開理解。</p><h3>歷史背景</h3><p>黑沙漠黑色山丘與地表主要來自火山岩與鐵質碎屑覆蓋。它和白沙漠形成強烈對比，提醒你西部沙漠不是單調沙丘，而有火山地貌、石灰岩、白堊、古海洋沉積與風蝕地形。</p><p>【三站看三種過程】Black Desert的暗色丘與覆蓋碎石、El Heiz的水與植物、Crystal Mountain的晶體與巖層，不能只用「沙漠被風吹成這樣」統一解釋。地質歷史、巖性、地下水及侵蝕共同決定外觀；黑色不代表整片沙漠都被火燒過。</p><p>【Crystal Mountain不是寶石礦場】旅遊名稱很容易讓人想成石英寶山，但現場晶體涉及碳酸鹽礦物，不能僅憑透明閃光就定為石英。帶走小晶體會破壞眾人反覆靠近的地表，名字再美也不是採集許可。</p><h3>相關故事</h3><p>短短一段路能遇到古海洋沉積、火山碎屑、地下水與風蝕，撒哈拉並非單一成因地貌。</p><p>【不要把每座黑山稱活火山】地表有火成岩材料，並不表示眼前山丘是一座仍活躍的火山；同樣，岩石看來像城堡，也不是人工遺跡。好的沙漠故事能讓人看懂形成過程，而不是隻替每個形狀取名字。</p><h3>實用提醒</h3><p>不敲、不撿晶體；停車與徒步點由嚮導決定，地圖只供認識地理，不是沙漠自駕導航。</p><a class="guide-return" href="#eg1017-3">回到行程</a></details><details class="guide-card" id="guide-eg1017-4"><summary>Agabat → White Desert營地｜導覽</summary><h3>現場看什麼</h3><p>先看白色巖峯相對沙面高度，再用人作比例。繞同一岩石看不同形狀，日落前30–60分鐘低角度光最能表現質感；要拍順光，就站太陽與岩石同一側，轉另一側則是剪影。</p><p>【Agabat看尺度，營地看光】在開闊谷地用遠處車輛作比例，讀出白色孤峯與沙地的高差；營地附近則用側光找表面細紋。人可以站在岩石旁，不能攀上脆弱頂端替照片增加戲劇性。</p><p>【觀察地面的紀錄】車轍、足跡、碎屑與垃圾都留得比城市久。所謂荒野不是沒有管理需求，而是損傷不容易被雨水和植物遮掉。請跟著業者指定範圍活動，不另闢拍照車道。</p><h3>歷史背景</h3><p>沙漠露營文化晚餐、手鼓與營火是旅遊團對沙漠待客文化的重構。尊重嚮導與司機的勞動，但不要把所有表演都當成「古老貝都因傳統」。真正重要的是水、車況、許可、垃圾處理與營地選擇。</p><p>【白沙漠曾是海洋沉積環境】白堊與石灰岩主要由碳酸鹽沉積形成，後來海退、地層出露，再經風化、溶蝕與風沙改造。它不是白色沙粒堆起來的「雪地」，更不是鹽原；不同白色巖層也不應一律給同一個精確年代。</p><p>【為何像蘑菇】巖層硬度差異、裂隙與接近地面的搬沙磨蝕，可以讓巖體下部較快退縮，留下較寬的帽狀部分。但個別形狀往往有多階段形成史，不宜把一條簡單機制套在所有岩石。</p><h3>相關故事</h3><p>蘑菇與動物名稱是觀看者的想像；地貌來自長期侵蝕與不同巖層硬度，並非刻意雕成。</p><p>【動物造型是人給的名字】蘑菇、小雞、駱駝等名字是辨識地標的方式，不是地質分類。試著換一個角度看同一巖體，會發現形象立即改變；自然的時間尺度比我們替它命名的故事長得多。</p><h3>實用提醒</h3><p>不要攀上脆弱白堊巖、刻字或以食物引誘狐狸；營地坐標依許可，非固定觀光旅館。</p><a class="guide-return" href="#eg1017-4">回到行程</a></details><details class="guide-card" id="guide-eg1017-5"><summary>晚餐、露營與觀星｜導覽</summary><h3>現場看什麼</h3><p>關掉白光數分鐘讓眼睛適應；觀察地平線亮度、星點與岩石輪廓，手機固定低位拍攝。</p><p>【把眼睛交給黑暗】先關掉不必要白光，等視覺適應，再看星空與巖體剪影。滿月前後可能較容易走路和拍岩石，卻不利觀察淡弱星空；不要把任何夜晚都宣傳成一定看到壯觀銀河。</p><h3>歷史背景</h3><p>沙漠夜間散熱快，氣溫與城市不同；高低溫差是季節特性，不是本次實測預報。</p><p>【沙漠夜間為何冷】乾燥空氣、雲量少和缺乏城市蓄熱，常使日夜體感差異明顯；風會進一步帶走熱。這是環境條件，不表示可以依「埃及很熱」推論露營不需要保暖。實際夜溫仍依當日預報和營地高度。</p><h3>相關故事</h3><p>待客餐飲可瞭解當代嚮導生活，不把所有音樂表演說成幾千年未變的傳統。</p><p>【有人照料的荒野體驗】晚餐、帳篷、水與返回城市的交通背後都有勞動。可以問嚮導他如何辨方向、選避風地、處理垃圾；不要要求為了氛圍就任意取用野生灌木生火。</p><h3>實用提醒</h3><p>飲水要留次日用量；垃圾含濕紙巾和廚餘都帶走。</p><a class="guide-return" href="#eg1017-5">回到行程</a></details><details class="guide-card" id="guide-eg1018-1"><summary>White Desert岩石與早餐｜導覽</summary><h3>現場看什麼</h3><p>日出前後看陰影方向與長度，一張順光交代白堊質感、一張側光交代凹凸；不要為了「沒有人」離開營地看不到同伴。</p><p>【離營前的三張照片】一張全景記谷地與巖峯；一張側光細節記巖性與侵蝕；一張在既有步道的比例照。拍完看營地是否回復整潔，垃圾、濕紙巾和食物殘渣都應帶走。</p><h3>歷史背景</h3><p>白色地貌如何形成白沙漠位於 Farafra 低地附近，白色白堊與石灰岩來自古代海洋沉積。較硬部分抵抗侵蝕，較軟部分被風沙磨蝕，形成蘑菇、柱體與奇巖。形狀並非永恆，幾十年後可能崩塌或改變。</p><p>沙漠生態看似無生命的沙漠仍有狐狸、羚羊、昆蟲、爬蟲與耐旱植物。動物多在夜間活動，不應用食物引誘野生狐狸，也不要追逐或包圍。營地廚餘會改變動物行為。</p><p>【同一塊岩石，早晨換一種讀法】低角度陽光拉長陰影、顯露細紋；太陽升高後，地貌看來扁平，但岩石沒有在一小時內變形。攝影光線能改變感受，不能取代地質證據。</p><p>【荒漠不是無生命】動物可能在夜間或黎明活動，留下足跡比看到本體更常見。營地食物會把野生動物拉進人車附近，改變行為；請不要用「幫牠找食物」合理化餵食。</p><h3>相關故事</h3><p>岩石形狀仍會改變；狐狸因廚餘接近營地，不代表需要遊客餵食。</p><p>【帶走的最好是問題】白色巖體為何沒有被所有風沙完全磨平？哪個部分較硬？附近是否有巖層水平延伸？把它與昨天所見連在一起，你就不是隻完成一晚露營，而是讀了一段海洋變成陸地、陸地再被改造的歷史。</p><h3>實用提醒</h3><p>早餐後檢查營地垃圾與遺落物；不帶走石頭或沙。</p><a class="guide-return" href="#eg1018-1">回到行程</a></details><details class="guide-card" id="guide-eg1018-3"><summary>公路返回Studio 18｜導覽</summary><h3>現場看什麼</h3><p>回城看綠洲農地如何消失、再接上高密度住宅；Zamalek的樹蔭、使館與公寓展示另一種開羅。</p><p>【今晚只做小觀察】買早餐時看麵包、優格、豆類與當季水果在店裡的位置，明天把它們和神廟畫面裡的供物、農業與食物保存比較。古今不能直接畫等號，但「人需要如何取得食物」是一條好用的導覽主線。</p><h3>歷史背景</h3><p>返回城市的心理落差從無燈光沙漠回到開羅交通，感官反差會很大。這天不適合安排博物館；洗澡、洗衣、補水與睡眠是必要行程。 Zamalek 較綠、使館與餐廳較多，會讓你看到另一種中上階層開羅生活。</p><p>【從沙漠回到河島】前一晚看到岩石、星空與地下水支持的綠洲，回到Zamalek則是河流、橋梁、密集住宅和供應網絡。兩種環境都依賴水，卻以完全不同方式組織生活。這段轉換本身能幫你理解埃及人口為何高度集中在狹長尼羅河走廊與三角洲。</p><h3>相關故事</h3><p>同一座城市的生活節奏會隨住宅區、交通與階層不同而改變。</p><h3>實用提醒</h3><p>若抵達較早，只在住宿附近買水、早餐與水果；藝廊留10/22。</p><a class="guide-return" href="#eg1018-3">回到行程</a></details><details class="guide-card" id="guide-eg1019-2"><summary>Egyptian Museum Tahrir｜四條觀看線｜導覽</summary><h3>現場看什麼</h3><p>先向詢問臺問當日代表藏品位置，不依舊攻略固定展室。</p><p>①王權形成：若展出Narmer Palette，看兩面不同王冠、較大的王與被控制的人，理解統一敘事；它是儀式性器物，不能逐圖當作新聞報導。②人物：古王國王像、書吏、私人像比較姿勢、視線、石材與服裝。③政治變化：中王國臉部風格與阿瑪納藝術對比，討論國王希望被怎樣看見。④死亡與保存：棺槨、模型、祭品與動物材料，理解為什麼日常用品也進墓。</p><p>不再把圖坦卡門全套與皇家木乃伊列為這裡的必看；分別在GEM與NMEC完成。</p><p>【一條能走完的看展線】先找一件統一王權相關展品，接一件官員或書吏像，再找一組中王國與新王國王像比較，最後以一件棺槨、模型或日常器物結尾。當日未展出的作品就跳過，不追著舊攻略找空位置。</p><p>【Narmer調色板若展出】看兩面王冠差異、國王較大的尺度、被控制的人及成列秩序。這種大型儀式性器物不等於每日化妝用品，也不能把所有場面都當成某一天戰役的現場新聞。</p><p>【王像的臉不是單純美醜】年輕、理想化、嚴肅或帶疲態的造型，可能傳達不同統治理念。不要看到某時期較細膩，就說之前的人技術較差。衣著、身體姿態、材料與文字同樣是辨讀線索。</p><h3>歷史背景</h3><p>舊館的歷史角色埃及文物管理在十九世紀逐步制度化，舊館於二十世紀初在 Tahrir 附近開放。它長期是埃及古物研究與觀光的象徵， 也經歷文物搬遷至 NMEC 與 GEM。不要把它視為被新館淘汰；它仍保留獨特藏品與「老博物館」氛圍。</p><p>觀看方法先找 Narmer Palette 理解上下埃及統一的王權影象，再看古王國人物像、中王國寫實王像、阿瑪納藝術與晚期王室珍寶。比較不同時代臉部、身體與材質，比逐件讀標籤更有收穫。</p><p>【舊館不是新館的剩餘倉庫】Tahrir館舍在1902年開放，延續十九世紀以降埃及古物管理、發掘、分類與公開展示的制度。它曾長期承擔保存國家重要古物的中心角色。隨藏品遷移，今天的觀看重點要依現場調整，但館史本身仍值得讀。</p><p>【埃及學也有權力關係】誰能挖掘、誰替古物命名、誰能把文物帶出國、哪些研究者被記住，涉及國家與殖民時代制度。讀一張出土地標籤時，也可以問收藏如何形成；不要把所有發現史都寫成單一外國探險家的英雄故事。</p><h3>相關故事</h3><p>1902年開館的建築與密集展櫃承載埃及學制度史；現代館藏調整不等於舊館失去價值。</p><p>【和GEM、NMEC分工】GEM可用完整大型展覽理解王權與藏品脈絡；Tahrir讓你接觸埃及學與國家收藏形成的歷史；NMEC把身體和日常技術放進文明長時段。三館的價值在互補，不是用「哪間黃金最多」決定另外兩間是否值得。</p><h3>實用提醒</h3><p>預留椅子休息；標籤有新舊差異，跨館搬遷以館方為準。手機拍照遵照當日各區規定，不用閃光。</p><a class="guide-return" href="#eg1019-2">回到行程</a></details><details class="guide-card" id="guide-eg1019-3"><summary>Tahrir → Talaat Harb → Abou Tarek｜導覽</summary><h3>現場看什麼</h3><p>抬頭看弧角公寓、陽臺、招牌與街道放射軸線；廣場與殖民時期商業街不是同一個歷史層。Koshari先試不加辣版本，再少量加入辣醬與蒜醋調整。</p><p>【抬頭與平視分開】抬頭看樓層窗戶、轉角、露臺與舊招牌，再平視看修理店、食物店與行人如何重新使用空間。拍攝只選一般街景，不把政府門口、警戒點與陌生人當作構圖道具。</p><p>【koshari的四種口感】米與麵提供主體，豆類添厚度，炸洋蔥帶脆感，番茄與醋蒜汁讓澱粉變得清爽。先嚐原味再加辣酸，比把醬全部倒入更能辨識每一層。</p><h3>歷史背景</h3><p>Tahrir 與近現代政治 Tahrir 意為「解放」，廣場周邊承載殖民時代、1952 革命、國家官僚與 2011 年抗議記憶。不要在敏感政府設施附近隨意拍攝警察或出入口。</p><p>Khedival Cairo Talaat Harb 與 Downtown 的放射街道、陽臺、公寓與咖啡館，源於十九世紀伊斯梅爾帕夏希望把開羅塑造成現代首都的計畫。它不是純粹「歐洲風」，而是埃及菁英、外國社羣、商業與帝國影響混合的產物。</p><p>Koshari 的城市文化 Koshari 把米、義大利麵、扁豆、鷹嘴豆、炸洋蔥、番茄醬與醋蒜汁混在一起，是工人、學生與上班族都熟悉的飽足食物。它的混合性也像開羅本身：原料來源多元，最後變成非常埃及。</p><p>【開羅不是一座古城向外均勻長大】Fustat、法蒂瑪的al-Qahira、城堡及十九世紀Downtown，各有不同政治與交通核心。伊斯梅爾時代的新街廓展現對現代首都的想像，舊城卻沒有因此停止生活。你從Tahrir步行到Talaat Harb，主要讀的是近代商業都市，而不是法老時代。</p><p>【歐式立面裡的埃及社會】放射道路、陽臺、公寓與咖啡館受國際建築語彙影響，但出資、使用及後來改造它們的社羣多元。保養良好或破舊外表只顯示某個階段，不能直接等同建築最初的社會地位。</p><h3>相關故事</h3><p>近代都市規劃、銀行、旅館與咖啡館連結埃及菁英、外國社羣及商業網路，不是單純「仿巴黎」。</p><p>【一道料理不必只有一個純粹起源】koshari常被講成某國帶來某種材料，最後由埃及組合；具體起源說法並不都同樣可靠。最能現場觀察的，是它如何用廉價、可快速供餐的材料，成為學生、工人、家庭都熟悉的城市食物。</p><h3>實用提醒</h3><p>不拍軍警及政府設施入口。餐廳價以選單，不採網路舊套餐價。</p><a class="guide-return" href="#eg1019-3">回到行程</a></details><details class="guide-card" id="guide-eg1020-1"><summary>Hanging Church → St Sergius → Ben Ezra｜導覽</summary><h3>現場看什麼</h3><p>懸空教堂先找堡壘門樓與地板視窗所示高差，再看木聖像屏、十字架和聖像。St Sergius地下空間是朝聖記憶，照工作人員動線走。Ben Ezra用手稿保存的故事理解中世紀猶太社羣，不把今天人少當作歷史上沒有繁榮。</p><p>【教堂讀三層】先看柱列如何界定信徒空間，再看聖像屏如何分隔聖所，最後看木工、鑲嵌與繪畫。聖像不是隨意裝飾，蠟燭、親吻和禱告顯示它仍在信仰生活裡。請不要為拍「無人畫面」要求信徒讓開。</p><p>【St Sergius的地下空間】先理解聖家逃亡傳統，再看教堂如何安排人們接近被紀唸的地點。宗教地景是信徒的記憶與朝聖網絡；歷史證據不能證明的精確停留細節，應說成傳統而非確證。</p><h3>歷史背景</h3><p>Babylon Fortress 與 Old Cairo 羅馬時代堡壘控制尼羅河交通，後來教堂依城牆與塔樓發展。懸空教堂得名於建築部分跨在堡壘門樓上，而不是漂浮。狹窄巷道與宗教建築靠得很近，顯示社羣長期共存又各有界線。</p><p>科普特基督宗教 「Copt」一詞與 Egypt 同源，今日主要指埃及本土基督徒。科普特語是古埃及語的晚期階段，使用希臘字母並加上額外字母，現在主要保留在禮儀中。教堂內的聖像、屏風、香、唱誦與東正教傳統不同於西方天主教。</p><p>聖家逃亡傳統 St. Sergius 教堂地下空間傳統上與聖家逃往埃及停留相關。這是重要宗教記憶與朝聖傳統，但不能把傳統地點等同可考古證明的精確住所。導遊應尊重信仰，也區分歷史證據與宗教傳說。</p><p>Ben Ezra 與猶太社羣 Ben Ezra 會堂與著名的 Cairo Geniza 文獻相關；大量廢棄手稿保存中世紀地中海猶太人的商業、家庭與宗教生活。 開放可能受修繕與安全限制。</p><p>【先認出地下那座羅馬城防】Babylon在這裡是埃及的堡壘名稱，不是你突然到了兩河流域巴比倫。城牆與塔樓為後來建築提供基礎，現代地面逐漸升高，所以古代構造可能比你腳下低。Hanging Church的「懸空」來自跨在舊堡壘構造之上，不是懸崖奇觀。</p><p>【科普特不是外來教會在埃及的分店】科普特語延續古埃及語的晚期階段，書寫結合希臘字母與增補符號。今日科普特正教屬東方正統教會 Oriental Orthodox，與希臘或俄羅斯的Eastern Orthodox不能直接視為同一制度；共同的香、聖像與祭儀不代表沒有歷史差異。</p><h3>相關故事</h3><p>科普特教會屬東方正統教會傳統，與希臘／俄羅斯的東正教不是同一教會體系；科普特語是古埃及語的晚期形態，今日主要在禮儀使用。</p><p>【Ben Ezra：被捨不得丟掉的紙保存的世界】Genizah是存放不再使用文字材料的空間。這裡累積的文件除了宗教書，也包括交易、書信、婚姻和生活紀錄，讓研究者接近中世紀一般人的聲音。Cambridge的相關研究說明，這批材料的重要性不只在「古老」，而在日常生活留下了連續細節。</p><p>【三種宗教相鄰不等於歷史永無衝突】教堂、會堂與清真寺的接近，呈現交流、共同城市生活，也包含法律差別、政治轉變與社羣遷移。避免用一句「從來和諧」或「一直對立」替代一千多年的複雜歷史。</p><h3>實用提醒</h3><p>聖家曾在此停留是宗教傳統，不是已證實的精確住宿紀錄；拍信徒先問，依現場服裝與攝影規則。</p><a class="guide-return" href="#eg1020-1">回到行程</a></details><details class="guide-card" id="guide-eg1020-2"><summary>Coptic Museum｜影象如何跨宗教延續｜導覽</summary><h3>現場看什麼</h3><p>先找葡萄藤、鳥、十字架、人物正面眼睛；比較同一圖案如何在希臘羅馬、晚期古代和基督教情境中換意義。織品看織法、染色與服裝用途；木雕看門板與聖像屏如何建立內外界線。</p><p>【挑四種材料比較】石雕看葡萄藤、植物、動物及人物如何組織；織物看色彩與圖樣如何進入衣著；木件看門、屏風及可再利用構件；手稿看書寫材料、字體與裝訂。先分辨功能，再問哪些圖像延續舊傳統、哪些已被基督宗教重新解釋。</p><p>【不要把藝術轉變想成關燈再開燈】宗教變化不會使所有工匠立刻改用完全不同工具或技法。相似的藤蔓、鳥類與幾何紋，可在不同信仰環境中重新取得意義；但相似外觀也不能直接證明某個教義由另一宗教複製。</p><h3>歷史背景</h3><p>科普特藝術形成於多語、多宗教的埃及，沒有在某一天把所有古代圖案清空。用材料與用途讀展品，比把每件都叫「教堂裝飾」更準確。</p><p>【一座博物館替哪段歷史留位置】Marcus Simaika推動的科普特博物館於1910年開館，使埃及基督教藝術得到專門保存與展示空間。這補足了常被法老古物和伊斯蘭建築分走注意力的中間時段；其意義也涉及近代埃及人如何理解自己的多重文化。</p><h3>相關故事</h3><p>從昨天古王國雕像到今日十字架，可看到工藝技術與視覺語彙的延續。</p><p>【從工坊理解文化延續】一位木工可能服務不同建築，一套雕刻語彙也能被不同社羣喜愛。這讓你看到文化交會不只發生在皇帝詔令，還發生在材料、手藝、市場與人的日常工作中。</p><h3>實用提醒</h3><p>成人票以官方當日售票為準；館外教堂與博物館不是同一張門票。</p><a class="guide-return" href="#eg1020-2">回到行程</a></details><details class="guide-card" id="guide-eg1020-3"><summary>Amr Ibn al-As外觀／午餐 → NMEC｜導覽</summary><h3>現場看什麼</h3><p>看庭院、柱列與寬廣禮拜空間，並注意現存建築經多次重修。</p><p>【用這裡練習辨認清真寺】qibla方向由朝向麥加的禮拜牆表明；mihrab是標示方向的壁龕，不是供奉神像的祭壇；minbar是講壇。先認清三者，再到Sultan Hassan看它們如何被更大型、精緻的建築重新安排。</p><h3>歷史背景</h3><p>Amr Ibn al-As 與 Fustat 阿拉伯征服後建立 Fustat，成為新的行政與商業城市。Amr Ibn al-As 清真寺多次重建，現貌不是七世紀原建築，但地點象徵伊斯蘭城市起點。 NMEC 的文明敘事 NMEC 用史前、法老、希臘羅馬、科普特、伊斯蘭、近現代與生活文化串起埃及。皇家木乃伊廳刻意營造墓谷氛圍， 應以觀看人類遺體的尊重進入，不嬉鬧或做誇張自拍。</p><p>【Fustat比法蒂瑪開羅早】七世紀阿拉伯征服後的Fustat，是新的行政、軍事與商業核心；十世紀的al-Qahira是後來的發展。兩者在現代都會裡相連，不應把不同成立年代壓成「開羅建於某一年」就結束。</p><p>【歷史地點不等於原建物全留下】Amr Ibn al-As清真寺經歷多次擴建與重建，今天看到的柱列和庭院不能全部標成七世紀原件。古蹟的價值也包括宗教功能與城市記憶長期延續，不只有原石比例。</p><h3>相關故事</h3><p>今日「Old Cairo」包含不同年代的城市起點，名稱老不等於全部同一時代。</p><p>【城市與軍營】Fustat的名稱與營地傳統相連，提醒你軍事、稅收、宗教和商業常共同建立新城市。別把清真寺當唯一孤立紀念物，它原本是人流、政治與社羣生活的重要節點。</p><h3>實用提醒</h3><p>車到NMEC另抓20–40分鐘含候車，交通實際較慢就減少外觀停留。</p><a class="guide-return" href="#eg1020-3">回到行程</a></details><details class="guide-card" id="guide-eg1020-4"><summary>NMEC｜文明長時段與皇家木乃伊｜導覽</summary><h3>現場看什麼</h3><p>主展廳沿史前、王朝、希臘羅馬、科普特、伊斯蘭與現代看技術和日常延續；織品把服裝、勞動及身分連起來。木乃伊廳先讀姓名、年代與出土地，再想此人如何被重新包裹、集中藏匿、發現和研究，避免只找「最完整的臉」。</p><p>【皇家木乃伊廳慢看兩位就夠】先讀姓名與時代，再把這個人接回你將去的建築。例如Hatshepsut與Deir el-Bahari，Ramesses II與Abu Simbel及Luxor。遺體是曾生活過的人，展示也有倫理與尊重的考量，不適合當獵奇自拍背景。</p><p>【辨認科學可以與不可以說什麼】影像與分析可提供年齡、疾病及保存處理線索，但辨識、親緣與死因有時仍帶不確定性。不要把導遊一句傳奇故事，當作所有研究一致的醫學結論。</p><h3>歷史背景</h3><p>皇家木乃伊與政治這些國王生前擁有神聖權力，死後卻被盜墓、重新包裹、藏匿、研究與公開展示。你可以思考：科學研究、國家教育、旅遊與死者尊嚴如何平衡？</p><p>【文明史把焦點從國王拉回技術】紡織、陶器、農業、工藝與書寫，串起不同統治者更替之間的生活。看展時可一路追問：食物怎樣保存、身體怎樣照料、文字誰能使用？這些問題能穿過法老、希臘羅馬、基督宗教與伊斯蘭時期。</p><p>【木乃伊化不只有乾燥】古代防腐涉及處理遺體、乾燥、包裹與儀式，各時期和社會階層做法不同。身體保存與名字、圖像、供養共同服務死後延續；因此不能把所有喪葬文化說成對死亡的恐懼。</p><h3>相關故事</h3><p>木乃伊既是研究材料，也是人的遺體；國家教育、科學與死者尊嚴需要同時考慮。</p><p>【王沒有一直安靜躺在原墓】部分皇家遺體在古代已被重新安置保護，近代又經發現、研究與遷館。今天看見的展示位置是漫長搬遷史的一站；你之後在帝王谷走入空墓時，也就知道「墓裡沒有木乃伊」不等於墓沒有故事。</p><h3>實用提醒</h3><p>皇家木乃伊廳以禁拍標誌為準，不開閃光與補光。官方09:00–17:00、最後售票16:00；不要16:00才抵達想看兩小時。</p><a class="guide-return" href="#eg1020-4">回到行程</a></details><details class="guide-card" id="guide-eg1020-5"><summary>Cairo Opera｜Arab Music Festival開幕｜導覽</summary><h3>現場看什麼</h3><p>留意樂隊如何在旋律線周圍作變化、獨唱與合奏的呼應，以及觀眾對樂句的反應；不同曲目節奏與音階差異比「聽不懂歌詞」更值得注意。</p><p>【未買票前分清節目】樂團、獨唱、舞蹈、民俗團體與商業晚宴不是相同體驗。實際場次未確認時保留晚餐或休息，不把舊活動文章當作已開演的保證。</p><h3>歷史背景</h3><p>開羅是20世紀阿拉伯錄音、電影與大眾音樂的重要中心；音樂節讓古蹟行程接上當代文化生活。</p><p>【文化生活沒有停在博物館裡】埃及音樂包含古典阿拉伯演唱、地方傳統、宗教聲音與當代創作，不是同一種背景配樂。若有合適演出，先查演出者、語言與形式，會比只挑最觀光化的「埃及之夜」更容易理解內容。</p><h3>相關故事</h3><p>不要先把節目名稱當作完整曲目表，實際演出內容以售票頁和當晚節目單為準。</p><h3>實用提醒</h3><p>預留市區交通、安檢及坐席時間；演出攝影按館方規定。</p><a class="guide-return" href="#eg1020-5">回到行程</a></details><details class="guide-card" id="guide-eg1021-1"><summary>Citadel＋Muhammad Ali Mosque｜導覽</summary><h3>現場看什麼</h3><p>先從開放觀景區辨認尼羅河方向、Moqattam丘陵與清真寺天際線；再比較城防外牆與19世紀圓頂清真寺。主殿看中央圓頂、半圓頂和細長宣禮塔的鄂圖曼語彙，別把整個城堡都當薩拉丁原作。</p><p>【外面看防禦，裡面看權力儀式】先看高地、城牆與市區相對位置，再看清真寺庭院的過渡，最後進主殿看穹頂如何集中視線。面向禮拜牆時辨認mihrab與minbar，別把大型吊燈誤認為建築唯一重點。</p><p>【看城市不是隻找金字塔】能見度允許纔可能望遠；更容易讀的是密集屋頂、宣禮塔、道路與Mokattam高地。把下面的Sultan Hassan放進畫面，能將今天上下山的路線與不同政權連起來。</p><h3>歷史背景</h3><p>Citadel 與 Saladin 薩拉丁在十二世紀興建城堡，利用 Moqattam 丘陵控制城市並防禦十字軍威脅。之後不同統治者持續擴建，直到十九世紀仍是權力中心。從城堡俯瞰可理解開羅沿尼羅河、丘陵與沙漠邊緣擴張。</p><p>Muhammad Ali Mosque 十九世紀的 Muhammad Ali 清真寺採鄂圖曼中央圓頂與細長宣禮塔，與馬穆魯克開羅風格不同。雪花石膏內牆與宏大空間宣告新王朝權力，也讓城堡輪廓成為現代開羅最醒目的天際線之一。</p><p>【城堡與清真寺相隔數百年】薩拉丁時代的防禦工程把政權放到俯瞰城市的高地；今天最醒目的Muhammad Ali Mosque主要是十九世紀的統治宣言。兩者共同使用城堡空間，但不是薩拉丁下令建了這座大穹頂。</p><p>【為何像伊斯坦堡】中央穹頂、半穹頂與細長宣禮塔帶出鄂圖曼建築語言。Muhammad Ali建立新的軍事行政體系時，既處在鄂圖曼政治世界，也追求更大的自主權。建築讓他把自己的王朝寫在城市天際線上。</p><h3>相關故事</h3><p>城堡被多個政權長期使用；Muhammad Ali用新建築把自己的王朝放到整座城市都看見的位置。</p><p>【同名的Muhammad Ali不要混淆】今天城堡清真寺關聯的是十九世紀王朝奠基者Muhammad Ali Pasha；明天Manial Palace的主人是後來王族Prince Muhammad Ali Tewfik。名字相似，年代、身分與政治經歷不同。</p><h3>實用提醒</h3><p>視野受霾與沙塵影響；清晨不保證看得到金字塔。遮肩膝、入殿依規脫鞋。</p><a class="guide-return" href="#eg1021-1">回到行程</a></details><details class="guide-card" id="guide-eg1021-2"><summary>Sultan Hassan＋Al-Rifa’i｜導覽</summary><h3>現場看什麼</h3><p>Sultan Hassan從入口轉折走入中央庭院，找四個巨大iwan朝向中心的佈局；再看宣讀、禮拜、教學與陵墓如何在同一建築組合。Al-Rifa’i比較較晚的仿歷史語彙與近代王室陵寢，理解「看起來古老」不等於同年代。</p><p>【Sultan Hassan的進入節奏】狹長或轉折入口讓外界聲音漸遠，進中央庭院後才突然展開。四面iwan是向庭院敞開的拱廳，朝拜方向的一面通常更具主導性。看彩色石材、銘文帶與尺度的關係，別只拍中央噴泉。</p><p>【站在兩座建築之間】各拍一張入口細節，再看時代、材料與紀念功能。Sultan Hassan的教育宗教複合體，和Al-Rifa’i的王室、名人墓葬記憶，不是同一種社會用途。</p><h3>歷史背景</h3><p>Sultan Hassan 十四世紀 Sultan Hassan 建築羣結合清真寺與四大遜尼法學派 madrasa。高牆、巨大入口、中央庭院與四個 iwan 製造壓倒性尺度；建築也是政治宣言與宗教教育機構。</p><p>Al-Rifa’i Al-Rifa’i 建於近代，卻刻意與對面的 Sultan Hassan 形成歷史對話。內有埃及王室與伊朗末代國王墓葬，反映近代王朝如何藉馬穆魯克風格建立正統性。</p><p>【Sultan Hassan是一整套制度】十四世紀建築包含禮拜、法學教育、住宿與紀念功能，四所madrasa對應四大遜尼派法學學派。這不是四個互相排斥的宗教，而是伊斯蘭法學傳統內不同解釋體系。捐資與宗教基金讓學習、服務和統治者紀念得以長期運作。</p><p>【Al-Rifa’i刻意和中世紀對話】旁邊的建築晚得多，採取能與Sultan Hassan呼應的外觀。十九至二十世紀王室藉歷史風格與墓葬空間建立連續性；外觀看來一樣古老，恰好是你應該停下來比較的原因。</p><h3>相關故事</h3><p>馬穆魯克由軍事奴隸菁英發展出統治王朝，巨型教育慈善建築與waqf捐產幫助建立正當性。</p><p>【王室與流亡】Al-Rifa’i與近代埃及王室及伊朗末代沙王的安葬相關，使這裡連到二十世紀政治。若相關墓室當日開放，讀姓名比只看華麗棺罩有意義；沒有開放就不必追著人要求「特別開門」。</p><h3>實用提醒</h3><p>先確認合票／分票與陵墓開放；不要在祈禱者前方走動。庭院聲響可聽，不必大叫測迴音。</p><a class="guide-return" href="#eg1021-2">回到行程</a></details><details class="guide-card" id="guide-eg1021-3"><summary>Al-Azhar Park｜午餐與休息｜導覽</summary><h3>現場看什麼</h3><p>選一個能看城堡與密集民居的視角，比較宣禮塔高度和街區尺度。</p><p>【一張能說明城市層次的照片】用近處庭園、中景密集住宅、遠景城堡或宣禮塔構圖。不是所有漂亮圓頂都是同一時代；你上午看過的地標能幫這張全景加上時間座標。</p><h3>歷史背景</h3><p>Al-Azhar Park 與城市再生公園建在舊有廢棄地上，提供難得綠地與歷史城區視野。從這裡看城堡、宣禮塔與密集住宅，可以討論保存古蹟、居民生活與觀光開發之間的張力。</p><p>【公園不是古城本來就有的綠地】Al-Azhar Park所在位置長期堆積廢棄土與瓦礫，AKTC的工程把它轉成大型公共景觀，也連到阿尤布城牆修復和Darb al-Ahmar社區改善。其價值不只在花木，而在城市能否把修復與居民的居住、工作機會一起考慮。</p><h3>相關故事</h3><p>景觀公園、歷史城區修復與居民生活同時存在，保存並不等於把社羣清空。</p><p>【保存不只是把外牆洗乾淨】若修復使原住居民無法負擔生活、傳統工坊沒有生意，街區可能只剩觀光外殼。公園讓人思考古蹟、公共空間、工作與日常生活如何一起延續，而不必把城市變成空的博物館。</p><h3>實用提醒</h3><p>餐飲與公園門票另計；別把這裡當免費穿越的捷徑。</p><a class="guide-return" href="#eg1021-3">回到行程</a></details><details class="guide-card" id="guide-eg1021-4"><summary>Al-Muizz｜Qalawun一帶與sabil-kuttab｜導覽</summary><h3>現場看什麼</h3><p>辨認四種功能：清真寺的禮拜、madrasa的教育、sabil的供水窗、kuttab的上層課堂。再看muqarnas蜂巢拱、交替色石材、木格窗與石雕。若Qalawun或另一主要建築開放，選一處完整進入，不追求沿線全部蓋章。</p><p>【Qalawun一帶別只看穹頂】先看建築與窄街的關係，再讀門口銘文與幾何裝飾；內部開放時，辨識教學、陵墓等不同部分。不是每個歷史功能區都能自由進入，依售票範圍走。</p><p>【sabil-kuttab的上下分工】下方施水空間與上方初等教學常結合：水服務身體，讀寫與宗教教育服務社羣。注意臨街窗與人手能接近的高度，建築形式能透露它如何與路人互動。</p><p>【抹去的名字、再利用的石材】如果看到改刻、不同材質或立面不對稱，先查說明。改造可能來自擴建、修繕、制度變化或材料再利用，不必每一處都套上戰爭破壞。</p><h3>歷史背景</h3><p>Bab Zuweila 與 Al-Muizz Bab Zuweila 是法蒂瑪城南門，也是公開儀式與處刑記憶場所。Al-Muizz 街串起清真寺、madrasa、sabil-kuttab、 宮宅與商業；sabil 免費供水，kuttab 教兒童誦讀，常以同一建築把慈善、教育與紀念結合。</p><p>馬穆魯克文化馬穆魯克原為軍事奴隸菁英，後建立強大王朝。他們透過宗教建築、慈善基金 waqf 與城市商業來展示統治正當性。 精緻石雕、muqarnas、彩色大理石與高聳宣禮塔是其特色。</p><p>【Al-Muizz是一條制度的街】法蒂瑪城市的中軸，後來不斷被其他朝代增建。清真寺、madrasa、陵墓、醫療與施水設施，讓統治者的虔誠、公共服務和身後聲名都能留在高人流地段。街道上的建築不是彼此獨立的收藏品，而是在競逐注意力與社會影響。</p><p>【waqf：讓建築有收入】宗教或公益基金可用房產、店鋪等收益維持機構。這有助理解為何商業街與宗教建築緊密相連：生意與信仰不是兩個完全隔絕的世界。實際制度隨年代而變，不能當成所有建築都用同一份合約。</p><h3>相關故事</h3><p>免費供水不是零成本；捐產、維護和管理把慈善、宗教功德與統治者的長期聲望連在一起。</p><p>【權力更替為何不把舊街全部拆掉】保留既有宗教名望、人流與商業機能，往往比另建空城更有效。新統治者在同一條街加一座建築，便能與前代競爭、借用前代聲望，也讓今天的遊客在短距離內穿越多個時代。</p><h3>實用提醒</h3><p>各建築停止售票時間可能早於街道亮燈，不能將18:30散步理解為室內都能進。</p><a class="guide-return" href="#eg1021-4">回到行程</a></details><details class="guide-card" id="guide-eg1021-5"><summary>Khan el-Khalili｜市集與咖啡｜導覽</summary><h3>現場看什麼</h3><p>先找本地人買生活用品的區域，再看燈具、金工和布料。問材料、重量、是否機製及產地，而不是隻問「打幾折」。拍工坊先詢問，再看工人使用工具的細節。</p><p>【挑一個工藝看過程】問材料、製法與製作地，比只問「最低多少」更有收穫。若看銅器，分辨壓模、手工敲打、表面鍍層與裝飾；若看布料，問機織、印花或手繡。先徵求同意再拍工坊及人。</p><h3>歷史背景</h3><p>Khan el-Khalili 市集區從商隊旅館、金銀、香料、布料與朝聖路線發展而來。今天有大量觀光商品，也仍有金工、香水、燈具與宗教用品。議價時先辨別手工、機製與進口貨，別把所有「埃及製」說法照單全收。</p><p>【市集是流通系統】khan／商旅客棧提供貨物、住宿、交易與資訊交換空間。今日觀光店密集，背後仍可用金工、布料、香料、餐飲與運輸的分工來讀。商品來自本地製作、外地批發或進口，不能因在老城買到就自動叫傳統手工。</p><h3>相關故事</h3><p>商隊旅館提供住宿、倉儲與交易資訊，市集是城市經濟網路的一部分，不只旅客紀念品街。</p><p>【咖啡館的時間】傳統咖啡館容納聊天、看人、遊戲與長時間停留；它的價值未必是每分鐘都有新節目。小說家Naguib Mahfouz與開羅街區生活的連結，可作為理解城市故事的入口，但以他命名的餐廳不等於所有室內細節都直接出自他的年代。</p><h3>實用提醒</h3><p>價格先講清總額；不接受不需要的帶路或「免費」禮物。返回車叫到可停車的大路邊，與司機核對車牌。</p><a class="guide-return" href="#eg1021-5">回到行程</a></details><details class="guide-card" id="guide-eg1022-1"><summary>Manial Palace｜Prince Muhammad Ali的收藏世界｜導覽</summary><h3>現場看什麼</h3><p>用「材料」來走：瓷磚和幾何→木雕與天花→書法→織品→花園。不同房間如何把鄂圖曼、敘利亞、摩洛哥與其他歷史風格拼在一起？再看接待空間與私生活區如何區分。</p><p>【三組空間各問一題】接待區問「要讓客人看見什麼身分」；居住區問「哪裡接近日常生活」；王座空間問「權力如何被傢俱、高度與軸線展示」。再看清真寺、時鐘與門面如何連接不同用途，不把整座宮殿只當一間裝飾華麗的客廳。</p><p>【材料比較】挑一面木作、一塊瓷磚或石材、一扇窗，分別看紋樣、反光與尺度。這能幫你分辨多種風格如何共處，而不是每看到尖拱就統稱阿拉伯式。</p><h3>歷史背景</h3><p>Manial Palace Prince Muhammad Ali 在二十世紀初建造宮殿，混合鄂圖曼、摩洛哥、波斯、馬穆魯克、敘利亞與歐洲元素。它不是某一時代的復原，而是近代王室收藏與歷史想像。看彩色瓷磚、木作、地毯、書法與花園如何共同製造一個理想化東方世界。</p><p>【一位王族在選擇自己的歷史】Manial Palace由Prince Muhammad Ali Tewfik於二十世紀初逐步營建，集合不同伊斯蘭藝術語彙。它不是保存完好的一座中世紀宮殿，而是近代人對歷史風格的主動組合。波斯、馬穆魯克、敘利亞、安達盧西亞與鄂圖曼元素，都可以成為主人表達文化身分的工具。</p><h3>相關故事</h3><p>這位20世紀的Prince Muhammad Ali不是城堡清真寺的19世紀王朝建立者；相似姓名容易混淆兩個不同人物。</p><p>【沒有登上王位也能建王權舞臺】宮殿的展示與主人實際政治命運不必一致；宏偉王座廳表達的可能是家族地位、文化理想或未實現的期待。這能和你在羅馬尼亞看過的皇家與貴族住宅形成比較，但不要把兩國制度直接當作相同。</p><h3>實用提醒</h3><p>館舍開放與攝影分割槽確認後再拍；不預設每棟宅邸都能進。</p><a class="guide-return" href="#eg1022-1">回到行程</a></details><details class="guide-card" id="guide-eg1022-2"><summary>Rhoda Nilometer｜洪水、糧食與稅收｜導覽</summary><h3>現場看什麼</h3><p>找中央測柱、刻度、井壁階梯和河水連線方式。想像觀測值如何變成農業預期：太低可能乾旱、太高可能損害村田；「好洪水」需要適當範圍。它是一套測量制度，不只是漂亮水井。</p><p>【看井、柱、階梯與連通】中央有刻度的柱子提供讀數，井室與河水的聯通讓水位可被觀察；周圍階梯和牆面則讓你看出測量者工作的空間。注意今天水流條件和古代洪泛已不相同，現場未必呈現你想像中的滿井河水。</p><h3>歷史背景</h3><p>Nilometer Nilometer 用刻度與水位判斷洪水高低，過低意味乾旱，過高意味災害；水位也與農業稅收相關。它說明古代與中世紀國家如何把自然轉化為行政資料。高壩建成後，年度洪水被控制，這套制度失去原來功能。</p><p>【水位是一個國家的預算消息】水太少，灌溉與產量不足；水太多，又會破壞聚落和作物。測量水位有助安排堤防、渠道與對收成的估計，也牽涉稅收。它既是工程設施，也是一種把自然變化轉成行政資訊的方法。</p><p>【現存建築的時代】Rawda現存重要測水設施屬九世紀阿拔斯時期，而尼羅河測水傳統更古老。不要因它測的是法老也依賴的河流，就把現場整棟建物叫成法老遺跡。</p><h3>相關故事</h3><p>對擅長風險判斷的人，這是很直觀的歷史例子：一個水位指標影響產量預期、稅負與治理，但單一讀數不等於完整損益。</p><p>【從測水柱想到Aswan高壩】古人設法適應季節洪水，現代大型水壩則大幅調整流量與供水。兩者都回應同一條河，卻改變人如何理解風險、農業時間與國家責任。到亞斯文後再回想今天，整趟地理線就連起來了。</p><h3>實用提醒</h3><p>濕滑臺階不勉強下行。未確認票價標待確認，不當免費。</p><a class="guide-return" href="#eg1022-2">回到行程</a></details><details class="guide-card" id="guide-eg1022-3"><summary>Zamalek藝廊／Bab Zuweila補訪／休息｜導覽</summary><h3>現場看什麼</h3><p>城門看法蒂瑪城防與後來上方宣禮塔的歷史疊加；街道工藝與日常使用同樣重要。Zamalek則看藝廊、咖啡店和住宅環境，不把每間畫廊都當歷史博物館。</p><p>【兩種走法各有目的】Zamalek選兩間藝廊或一段街道慢看當代作品與居民生活；Bab Zuweila選城門、街道尺度與布料工藝。不要把它們當同一方向一路順走的景點清單，下午只能依體力選一組。</p><h3>歷史背景</h3><p>Zamalek Zamalek 位於 Gezira 島，十九、二十世紀逐漸成為宮殿、俱樂部、使館、住宅與文化機構集中地。街道綠蔭、咖啡店與藝廊呈現不同於 Downtown 與歷史城區的中上階層生活。</p><p>當代文化場所 El Sawy Culturewheel 位於橋下與尼羅河邊，是民營文化場域，節目可能包含獨立音樂、詩歌、講座與展覽。參加時可觀察年輕觀眾、家庭與表演文化，不必期待每場都具有「傳統埃及」特色。</p><p>【Zamalek是島上都市生活】Gezira島上的綠地、外交機構、公寓、文化場館與餐飲，讓這裡的街景不同於Old Cairo。這是開羅的一種社會地理，不代表全城都享有同樣公共空間和生活條件。</p><p>【若補訪Bab Zuweila】城門提示法蒂瑪城界，而鄰近後來的清真寺與街區又超越了原本城牆。城門是管制、防禦與交通的界線，也可能成為公開展示權力的場所。附近帳篷布工藝街的裝飾，則把目光拉回手藝與市場。</p><h3>相關故事</h3><p>Aisha Fahmy與El Sawy的價值在當代展覽和演出，需要看當期節目，不能只靠建築名稱確定值得去。</p><p>【當代文化不是法老文明的附錄】現代藝術、音樂與咖啡館裡談論的城市，可能涉及家庭、政治、身分和日常困境。即使看不懂所有阿拉伯文字，也可以先問作品年代與媒材，讓埃及不只停在三千年前。</p><h3>實用提醒</h3><p>Bab Zuweila攀塔、Aisha Fahmy展覽及El Sawy未查得適用當日完整節目，皆列候選。</p><a class="guide-return" href="#eg1022-3">回到行程</a></details><details class="guide-card" id="guide-eg1023-2"><summary>SM94 → ASW → Pajama Hostel｜導覽</summary><h3>現場看什麼</h3><p>飛行下降看沙漠、河谷和花崗巖島嶼，辨認綠帶比開羅周邊更狹窄。</p><p>【從空中或地圖找綠帶】若座位與天氣允許，觀察河道旁農地與外側沙漠的界線；落地後再看花崗巖島與帆船。不要因有一條大河，就認為周邊可以無限擴張農地，地形、灌溉與土壤都有限制。</p><h3>歷史背景</h3><p>為什麼亞斯文是邊境城市亞斯文古稱 Syene，位於尼羅河第一瀑布附近。瀑布與花崗巖島嶼讓航運受限，因此成為埃及與努比亞之間的軍事、 貿易與稅收節點。象牙、黃金、木材、香料與非洲商品由南方進入。</p><p>花崗巖與城市景觀亞斯文周圍出產紅色花崗巖，古埃及許多方尖碑、雕像與建築構件來自此地。尼羅河中的島嶼、岩石與帆船形成比開羅更開闊的景觀。</p><p>【從首都飛到古代南方門戶】亞斯文古名Syene，周邊花崗巖、島嶼與第一瀑布區使它成爲交通與資源的重要節點。它不只是更熱的小開羅：地形、河景、努比亞文化和與南方的往來，都不同於三角洲附近的首都。</p><p>【花崗巖把旅程接起來】吉薩河谷神廟、王像與
