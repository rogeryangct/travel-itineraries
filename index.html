=1&amp;query=45.6033%2C24.6172" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro26-4">導覽</a></div></div><div class="slot" id="ro26-5"><div class="time">12:50–15:00</div><div><h3>山頂隧道 → 北側髮夾彎 → Bâlea Cascadă</h3><p>13:00–14:15觀景；14:30–15:00咖啡與洗手間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Balea%20Cascada" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro26-5">導覽</a></div></div><div class="slot" id="ro26-6"><div class="time">16:30–17:30入住；18:30晚餐</div><div><h3>Sibiu入住與夜景</h3><p>Crama Sibiul Vechi可作晚餐候選，先確認座位。劇場節若有適合語言及時間的節目才加入，不為活動壓縮山路。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.7963%2C24.1518" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="ro26-unesco-arutela"><div class="time">僅Olt河谷備案｜途中20–30分鐘</div><div><h3>UNESCO條件式新增｜Arutela羅馬軍營</h3><p>僅當DN7C不適合而南返改走DN7時加入；高山版不去。Arutela為「羅馬帝國疆界—達契亞」構成點1718-237，可讓本次路線多涵蓋一項正式世界遺產。時間取決於改道，勿與Bâlea排在同一天。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.276411%2C24.312425" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://romania-atractiva.ro/ro/profiles/castrul-roman-arutela" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro26-unesco-arutela">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>道路關閉或積雪結冰、強風濃霧不宜通行：Hotel → Curtea de Argeș → Pitești → Râmnicu Vâlcea → DN7 Olt Valley → Sibiu。當天也查DN7施工與管制，按導航加入休息，直接前往住宿。 可在Căciulata附近加入Arutela20–30分鐘（另留進出緩衝）；晚出發、雨勢大或施工限制就直接赴Sibiu。不加入Hurezi繞路。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪高處步道，再縮短湖邊停留；道路條件不適合就改線，不以已付款住宿作為冒險理由。</p></div></section><section class="day" id="ro27"><span class="tag">2026-09-27</span><h2>Sibiu＋ASTRA｜城市自治與農村技術</h2><p>住宿：Zenith Apartament Old Town Piata Mare。ASTRA保留約4小時45分鐘；不與17:00音樂會重疊。</p><div class="slot" id="ro27-1"><div class="time">07:10–08:00；08:30早餐</div><div><h3>Piața Mare → Council Tower → Piața Mică</h3><p>先拍空景與屋頂眼睛；登塔留到正式開放後。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.7963%2C24.1518" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro27-1">導覽</a></div></div><div class="slot" id="ro27-2"><div class="time">09:00–11:30</div><div><h3>Huet Square、Lutheran Cathedral與Lower Town</h3><p>Council Tower視開放登塔 → Bridge of Lies → Huet → Evangelical Cathedral → Passage of Stairs → Lower Town。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bridge%20of%20Lies%20Sibiu" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro27-2">導覽</a></div></div><div class="slot" id="ro27-3"><div class="time">11:45–12:20</div><div><h3>午餐與前往ASTRA</h3><p>Piata Mica簡餐；開車或叫車到露天博物館，勿把步行路程算成市中心景點距離。</p></div></div><div class="slot" id="ro27-4"><div class="time">12:30–17:15</div><div><h3>ASTRA Museum</h3><p>選水力／風力、牧民住宅、木教堂與湖畔路線，預留步行距離。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.75394%2C24.11459" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzeulastra.ro/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro27-4">導覽</a></div></div><div class="slot" id="ro27-5"><div class="time">選配17:00；主線18:15–19:15</div><div><h3>Duo Noema或老城黃昏</h3><p>Duo Noema「Beethoven &amp; Enescu」9/27 17:00 Sala Oglinzilor，主辦方列免費。要參加需15:45離ASTRA；主線則17:15離館後回老城拍照。</p><a class="map" href="https://stagiuneacamerala.ro/event/odae-cum-harmoniis-duo-noema/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="soft"><b>雨天備案</b><p>老城以教堂與咖啡休息穿插；ASTRA可看有開放的室內展示，雷雨時縮短露天段。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>保留ASTRA重點，先刪音樂會選項與重複夜景；如很想聽Enescu，15:45離館。</p></div></section><section class="day" id="ro28"><span class="tag">2026-09-28</span><h2>Biertan → Sighișoara｜教堂堡壘與行會城牆</h2><p>住宿：Gloria Apartments。Biertan星期一可依公布時段參觀；Clock Tower室內改明早。</p><div class="slot" id="ro28-1"><div class="time">08:20出發；10:00–12:00</div><div><h3>UNESCO｜Biertan Fortified Church</h3><p>【主線｜第4項防禦教堂村落群】09:50抵達。市政府列9–10月每天10–17，13–14午休；12–13午餐與村落散步，13:10離開。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.13694%2C24.52694" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://comunabiertan.ro/turism/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro28-1">導覽</a></div></div><div class="slot" id="ro28-2"><div class="time">14:20–14:40入住；15:00–16:15</div><div><h3>UNESCO｜Sighișoara歷史中心與Clock Tower外觀</h3><p>【主線｜第6項歷史中心】Citadel Square → Vlad Dracul House → Venetian House → 行會塔樓。今天星期一不安排History Museum內部。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro28-2">導覽</a></div></div><div class="slot" id="ro28-3"><div class="time">16:15–18:20</div><div><h3>Covered Scholars’ Stairs → Church on the Hill → Saxon Cemetery</h3><p>先確認教堂當日最後入場，關閉則外觀；下山拍彩色屋頂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Church%20on%20the%20Hill%20Sighisoara" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro28-3">導覽</a></div></div><div class="slot" id="ro28-4"><div class="time">18:20–19:30</div><div><h3>Clock Tower與廣場黃昏、晚餐</h3><p>日落前拍側光，日落後拍藍調；Joseph T、Alte Post或Casa Georgius Krauss作餐廳候選，依當天營業。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>村落步行縮短，教堂按開放參觀；墓園與陡階濕滑時跳過。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>午餐縮短，不拖到13:00才進Biertan；Sighișoara優先城堡主街與教堂，塔內留明早。</p></div></section><section class="day" id="ro29"><span class="tag">2026-09-29</span><h2>Clock Tower → Viscri → Rupea → Brașov</h2><p>住宿：Cosmo Studio。Viscri按修復狀況縮短；Rupea保留為可刪支線，保住Black Church室內。 新增Saschiz20分鐘外觀，Viscri與午餐稍縮短。</p><div class="slot" id="ro29-1"><div class="time">07:15–08:00晨拍；09:00–10:00</div><div><h3>Clock Tower／History Museum</h3><p>【第6項歷史中心內的地標，非獨立一項】早餐、退房後參觀，行李寄放或安全收妥；10:10出發。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.21929%2C24.79332" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://visitmures.com/sighisoara/patrimoniu/muzee/muzeul-de-istorie-sighisoara" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro29-1">導覽</a></div></div><div class="slot" id="ro29-unesco-saschiz"><div class="time">10:35–10:55｜新增外觀短停</div><div><h3>UNESCO｜Saschiz防禦教堂村落</h3><p>10:10離開Sighișoara後沿DN13短停；9/29星期二，官方頁列室內關閉，只看公共街道可見的St. Stephen教堂及鐘塔。10:55離開，約11:40到Viscri。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.194722%2C24.956111" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://turism.saschiz.ro/locatii/biserica-sfantul-stefan" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro29-unesco-saschiz">導覽</a></div></div><div class="slot" id="ro29-2"><div class="time">11:40–12:40；12:40–13:15午餐</div><div><h3>UNESCO｜Viscri村落與修復中的防禦教堂</h3><p>【主線｜第4項防禦教堂村落群】主教堂及主塔關閉。看村落博物館、陶器展、South Bastion上層、Bacon Tower；成人20 RON，村外官方停車免費。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.0549%2C25.0886" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.biserica-fortificata-viscri.ro/en/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro29-2">導覽</a></div></div><div class="slot" id="ro29-3"><div class="time">14:00–15:00</div><div><h3>Rupea Fortress</h3><p>新增山丘堡壘，15:10前離開；約16:20到Brașov。公布時段需購票前再核對，遇延誤可整站刪除。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=46.03715%2C25.21241" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro29-3">導覽</a></div></div><div class="slot" id="ro29-4"><div class="time">17:00–18:00</div><div><h3>Black Church室內</h3><p>停車入住後步行／叫車进老城；週二公布時段至19:00，宗教活動可能調整，先入館再拍廣場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.6410%2C25.5880" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro29-4">導覽</a></div></div><div class="slot" id="ro29-5"><div class="time">18:10–19:05</div><div><h3>White Tower → Council Square</h3><p>天乾且有體力才走上觀景步道，否則在廣場拍夕照。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.6429%2C25.5866" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro29-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Rupea高處濕滑或雷雨則取消；Viscri看可開放展示與短村街。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Saschiz短停，再刪Rupea；保留Viscri短訪與Brașov Black Church入館，不能為新增景點壓縮行車安全。</p></div></section><section class="day" id="ro30"><span class="tag">2026-09-30</span><h2>Libearty＋Seven Ladders｜保育與峽谷</h2><p>住宿：Cosmo Studio。上午導覽先訂；下午戶外依當日開放與天候，不把長程模型寫成確定晴雨。</p><div class="slot" id="ro30-1"><div class="time">08:15出發；09:45–11:00</div><div><h3>Libearty Bear Sanctuary</h3><p>官方Classic Tour週二至日09:45／11:15，約75分鐘、2公里；成人95 RON起，語言與日期購票選定。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.593020%2C25.385220" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://millionsoffriends.org/en/amp-libearty/visit-the-sanctuary/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro30-1">導覽</a><p><b>預約：</b>建議09:45英文場；尚未購票，容量有限。</p></div></div><div class="slot" id="ro30-2"><div class="time">11:10決策；約12:00起登</div><div><h3>Dâmbul Morii → Seven Ladders入口</h3><p>先吃自備簡餐，查當日峽谷／滑索開放。正常潮濕不等於必須取消，但持續雨、雷暴、水勢異常及工作人員警告均不進入。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Dambul%20Morii%20Seven%20Ladders%20trailhead" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro30-2">導覽</a></div></div><div class="slot" id="ro30-3"><div class="time">13:00–14:00；14:00–16:00返程</div><div><h3>Seven Ladders Canyon與可選Zipline</h3><p>全程抓3–4小時，不把峽谷本體長度當成總健行距離。滑索依當天時間、體重限制與營運確認。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.5674%2C25.64368" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro30-3">導覽</a></div></div><div class="slot" id="ro30-4"><div class="time">替代峽谷｜13:00–14:15 Prejmer；15:00後Șchei</div><div><h3>UNESCO替代版｜Prejmer＋Șchei</h3><p>【第4項防禦教堂村落群】Libearty後經交通與午餐，改走Prejmer。雨天或想優先完整防禦教堂都可採用；與Seven Ladders互斥。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.722500%2C25.775556" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://kirchenburgen.org/en/location/tartlau-prejmer/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro30-4">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Libearty後改Prejmer Fortified Church → Șchei → First Romanian School／St. Nicholas；各館依開放。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先取消Zipline，再縮短峽谷外步道；有雷暴、持續雨、水量警告或官方封閉，整段峽谷取消。</p></div></section><section class="day" id="ro01"><span class="tag">2026-10-01</span><h2>Cantacuzino → Peleș → Sinaia｜貴族與王室</h2><p>住宿：Upon Boutique。Cantacuzino 10:00才入場；Pelișor室內維護關閉，外觀移至Peleș結束後，時間不重疊。</p><div class="slot" id="ro01-1"><div class="time">07:45退房；08:20出發；09:25–09:55</div><div><h3>Brașov → Bușteni</h3><p>咖啡與山景；道路時間留彈性，未到開門時間不安排入館。</p></div></div><div class="slot" id="ro01-2"><div class="time">10:00–11:00</div><div><h3>Cantacuzino Castle</h3><p>週一至四10:00開始，室內票依當期展示選擇；11:00離開前往Sinaia。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.41395%2C25.54292" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.cantacuzinocastle.com/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro01-2">導覽</a></div></div><div class="slot" id="ro01-3"><div class="time">11:00–11:50交通；11:50–12:35外觀</div><div><h3>Peleș庭園與入場準備</h3><p>包含停車及步行，先拍外觀，提早到售票指定入口。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.35972%2C25.54278" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro01-3">導覽</a></div></div><div class="slot" id="ro01-4"><div class="time">12:45–14:30</div><div><h3>Peleș Castle室內｜中文逐房間導覽</h3><p>成人100 RON，官方目前路線為Ground Floor＋First Floor。目標12:45英文導覽（入口依到達順序組團、無額外導覽費）；12:45–14:30是購票入場時窗，不代表保證12:45有席位。下方「導覽」完整收錄18段中文現場解說與8大必看重點。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.35972%2C25.54278" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://peles.ro/en/program-si-taxe/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro01-4">導覽</a><p><b>預約：</b>需購票；英文12:45組團不等於購買時窗就保證席位。</p></div></div><div class="slot" id="ro01-5"><div class="time">14:30–14:50；14:50–15:30午餐</div><div><h3>Pelișor僅外觀</h3><p>2026/9/28–11/3全館清潔及預防性維護；不安排室內，也不與Peleș導覽重疊。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Pelisor%20Castle%20Sinaia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://peles.ro/en/anunturi/in-perioada-28-septembrie-3-noiembrie-2026-castelul-pelisor-va-fi-inchis-pentru-curatenie-generala-si-conservare-preventiva/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro01-5">導覽</a></div></div><div class="slot" id="ro01-6"><div class="time">15:45–16:30</div><div><h3>Sinaia Monastery</h3><p>午餐後參觀，16:45–17:15入住。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=45.35533%2C25.54962" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro01-6">導覽</a></div></div><div class="slot" id="ro01-7"><div class="time">17:30–19:00</div><div><h3>Dimitrie Ghica Park與Casino外觀</h3><p>步行散步、晚餐；隔天09:30還車版需早睡。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Sinaia%20Casino" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro01-7">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>山景看不到仍可看建築；庭園縮短、優先已訂Peleș時窗。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>若DN1延誤，先縮短或刪Cantacuzino，保留Peleș；下午再刪Casino散步。</p></div></section><section class="day" id="ro02"><span class="tag">2026-10-02</span><h2>Sinaia → Bucharest｜還車與Spring Palace</h2><p>住宿：New Boutique Central 2 camere Chic。預設09:30還車；延至12:00須已有SIXT書面確認，不能把建議當成已修改。</p><div class="slot" id="ro02-1"><div class="time">05:50起床；06:10出發；09:30完成</div><div><h3>SIXT還車｜主方案</h3><p>08:30–08:45補至合約要求油量，08:45–09:00到指定門市，09:30完成。DN1車流與事故留彈性；記錄車況、里程油量並保留交車文件。</p><p><b>預約：</b>確切門市、截止時間、燃油及費用以租约為準。</p></div></div><div class="slot" id="ro02-2"><div class="time">替代：07:30早餐；08:15出發</div><div><h3>僅限已確認12:00還車</h3><p>約11:30–12:00還車，12:30後才寄放行李及午餐；Spring Palace應改14:30或15:00且先取得票。不能套用主方案10:30寄物時間。</p></div></div><div class="slot" id="ro02-3"><div class="time">主方案10:30–12:45</div><div><h3>寄放行李、咖啡與午餐</h3><p>提早寄物需住宿同意，不預設房間已能入住。準備下午導覽票及翌日巴士站點。</p></div></div><div class="slot" id="ro02-4"><div class="time">主方案13:30–14:30</div><div><h3>Spring Palace／Ceaușescu Mansion</h3><p>Bulevardul Primăverii 50；隨英文或羅文導覽，約45分鐘，留報到緩衝。室內不攝影，依當日館規。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Casa%20Ceausescu%20Bulevardul%20Primaverii%2050" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://casaceausescu.ro/en/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-ro02-4">導覽</a><p><b>預約：</b>需確認英文場與報到時間。</p></div></div><div class="slot" id="ro02-5"><div class="time">15:15–17:15</div><div><h3>King Michael I Park → Arcul de Triumf</h3><p>公園休息後看凱旋門外觀；18:00後回勝利大道晚餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=44.467278%2C26.078361" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-ro02-5">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>公園與凱旋門縮短，保留已預訂室內導覽；沒票則美術館／咖啡。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>還車優先於觀光。若延時還車版拖晚，改晚一場Spring Palace或取消，不趕路。</p></div></section><section class="day" id="ro03"><span class="tag">2026-10-03</span><h2>Bucharest → Veliko Tarnovo</h2><p>FlixBus 10:10。電子票完整站名、地址與營運更新為唯一上車點依據，本站不猜Militari或Filaret。</p><div class="slot" id="ro03-1"><div class="time">07:30–09:20</div><div><h3>早餐、退房與抵達票面站點</h3><p>07:30起床、08:00早餐、08:40退房；08:45–09:00叫車為市區估算，先按電子票地址重新計算。最晚09:20到站。</p><a class="guide-link" href="#guide-ro03-1">導覽</a></div></div><div class="slot" id="ro03-2"><div class="time">10:10</div><div><h3>FlixBus出發</h3><p>發車時間依提供車票；到達時間未提供，不補猜。羅馬尼亞與保加利亞當時同為UTC+3。</p></div></div><div class="soft"><b>雨天備案</b><p>雨天提前叫車，行李防水；車站候車條件依票面站點。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>取消所有早餐後觀光，保留最晚09:20到站；遠郊站點或交通差需再提早。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>人民宮</td><td>約85 RON</td><td>成人</td><td>提供資料參考，預約再確認</td></tr><tr><td>Kadouch獨奏會</td><td>159.08 RON起</td><td>每人</td><td>9/22售票頁；未購票</td></tr><tr><td>Poenari</td><td>約30 RON</td><td>成人</td><td>參考；團體與開放再確認</td></tr><tr><td>Viscri修復期間</td><td>20 RON</td><td>成人</td><td>官方公告；主教堂與主塔關閉</td></tr><tr><td>Libearty Classic</td><td>95 RON起</td><td>成人</td><td>官方價格起點；依日期語言結帳</td></tr><tr><td>Peleș</td><td>100 RON</td><td>成人</td><td>官網；指定時窗，不可退改</td></tr><tr><td>Biertan、Clock Tower、Rupea、ASTRA、Black Church</td><td>依各場館現場／購票頁</td><td>每人</td><td>不沿用未核實舊票價</td></tr><tr><td>Seven Ladders與Zipline</td><td>依路線與當日營運報價</td><td>每人</td><td>未預訂，滑索非必選</td></tr><tr><td>SIXT延時還車</td><td>依書面報價</td><td>每筆合約</td><td>未申請變更，可能按租車日計費</td></tr></tbody></table></div><p>使用RON結帳並保留適量現金。景點、停車、餐飲與租車延時分開計算；住宿與交通已訂不代表活動門票已訂。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-ro23-2"><summary>Piața Unirii → Manuc’s Inn → Curtea Veche｜導覽</summary><h3>現場看什麼</h3><p>在Unirii先看巨大街廓與整治河道，再走入Manuc庭院：環形走廊把住宿、貨物與商人活動包在可控制的空間裡。Curtea Veche注意宮廷與市場距離，理解城市如何圍繞王公據點生長。</p><h3>歷史背景</h3><p>Bucharest老城結合瓦拉幾亞宮廷、巴爾幹市場與後來的銀行商業街。Vlad Țepeș與Bucharest王公據點有歷史聯繫；他處在鄂圖曼、匈牙利與本地貴族競爭的政治環境。</p><h3>相關故事</h3><p>Manuc的商旅驛站格局可和Skopje的han比較：防護貨物、集中旅客與商業交易都比今天的飯店休閒功能重要。Dracula是19世紀小說角色，不能拿來解釋15世紀所有政治暴力。</p><h3>實用提醒</h3><p>庭院餐廳可能需消費或受活動限制；遺址內部不預設開放。</p><a class="guide-return" href="#ro23-2">回到行程</a></details><details class="guide-card" id="guide-ro23-3"><summary>Stavropoleos → Cărturești Carusel｜導覽</summary><h3>現場看什麼</h3><p>Stavropoleos由柱頭、拱廊、纏繞植物石雕開始看，再看尺度緊湊的庭院。書店則看修復後的採光、樓梯與舊商業樓層如何轉為文化零售。</p><h3>歷史背景</h3><p>Brâncovenesc風格將東正教空間、巴爾幹裝飾與文藝復興語彙結合，與17至18世紀瓦拉幾亞王公文化相關。今天書店代表的是21世紀老城再利用，而非中古圖書館。</p><h3>相關故事</h3><p>庭院保存的碑石與建築碎片提醒人，城市遺產經歷拆除、地震與重建；精緻小教堂常比巨型建築更能保留工匠手藝。</p><h3>實用提醒</h3><p>禮拜中不拍信徒；書店樓梯留通行空間。</p><a class="guide-return" href="#ro23-3">回到行程</a></details><details class="guide-card" id="guide-ro23-4"><summary>CEC Palace → Macca–Villacrosse Passage｜導覽</summary><h3>現場看什麼</h3><p>CEC看穹頂、柱式與銀行立面的對稱性；廊道看黃玻璃如何把自然光變暖，店面連續排列如何延長街道生活。</p><h3>歷史背景</h3><p>19世紀末的銀行、旅館與大道，是羅馬尼亞王國借用法國城市語言表現現代化的方式。「小巴黎」指特定時期的菁英文化，不代表整座城完全仿巴黎。</p><h3>相關故事</h3><p>有頂商業街在雨雪與泥濘年代提供遮蔽的購物、社交空間；今天水煙、餐飲與觀光則是另一層使用史。</p><h3>實用提醒</h3><p>CEC朝東主立面早晨較順光，今晚重點是藍調而非正面夕照。</p><a class="guide-return" href="#ro23-4">回到行程</a></details><details class="guide-card" id="guide-ro23-5"><summary>晚餐與早餐補給｜導覽</summary><h3>現場看什麼</h3><p>兩人可共享酸湯、sarmale與mici，再決定是否加甜點。Caru’ cu Bere可觀察木作、彩繪與歷史餐廳空間。</p><h3>歷史背景</h3><p>Ciorbă的酸味可來自發酵麥麩液、醋或酸菜汁；mămăligă是玉米主食，sarmale反映巴爾幹共享飲食。</p><h3>相關故事</h3><p>Papanași是乳酪麵糰甜點，酸奶油與果醬平衡油炸口感；通常先點一份共享。</p><h3>實用提醒</h3><p>餐廳未預訂；先看菜單與總份量。</p><a class="guide-return" href="#ro23-5">回到行程</a></details><details class="guide-card" id="guide-ro24-1"><summary>Palace of Parliament｜導覽</summary><h3>現場看什麼</h3><p>進門後比較樓梯寬度、天花高度與人的尺度。觀察石材、地毯、木作與水晶：材料來源與巨大用量本身就是政治訊息。</p><h3>歷史背景</h3><p>1977年地震後，Ceaușescu政權推動大規模都市改造，拆除舊街區、住宅及宗教建築。人民宮與Civic Centre建立可供集會與權力展示的首都軸線。</p><h3>相關故事</h3><p>普通居民面臨能源與消費限制時，國家把大量資源投入宏大工程；參观只見建築一部分，也足以比較公共口號與實際資源分配。</p><h3>實用提醒</h3><p>約85 RON為提供資料參考價，購票再核對。小團需提前電話確認；尚未預約。</p><a class="guide-return" href="#ro24-1">回到行程</a></details><details class="guide-card" id="guide-ro24-2"><summary>Constitution Square → 午餐 → Cișmigiu｜導覽</summary><h3>現場看什麼</h3><p>從廣場回望巨大軸線，再在公園看彎曲步道、長椅與湖岸。兩種公共空間如何對待人的尺度，現場很容易比較。</p><h3>歷史背景</h3><p>廣場服務政治儀式與建築視線；19世紀城市公園則與公共衛生、休閒和市民生活相關。</p><h3>相關故事</h3><p>公園下棋、遛狗與長時間聊天的居民，是首都歷史之外仍在延續的日常。</p><h3>實用提醒</h3><p>人民宮東面上午較利正面光；不在車道中央取景。</p><a class="guide-return" href="#ro24-2">回到行程</a></details><details class="guide-card" id="guide-ro24-3"><summary>Revolution Square → 國家美術館／咖啡｜導覽</summary><h3>現場看什麼</h3><p>辨認Royal Palace、舊共產黨中央大樓與革命紀念物，三者分別代表王國、威權政權與轉型後記憶。</p><h3>歷史背景</h3><p>1989年12月21日，Ceaușescu公開演說遭到騷動與噓聲，直播中的失控打破受安排的支持場景；次日他從屋頂搭直升機離開。</p><h3>相關故事</h3><p>同一廣場的建築不是和諧年代陳列，而是不同行政與政治制度留下的空間。紀念物如何詮釋革命，也属于後來的公共討論。</p><h3>實用提醒</h3><p>若人民宮延誤，美術館改咖啡，保留晚上入場緩衝。</p><a class="guide-return" href="#ro24-3">回到行程</a></details><details class="guide-card" id="guide-ro24-4"><summary>Calea Victoriei向北步行與早晚餐｜導覽</summary><h3>現場看什麼</h3><p>比較相鄰法式宮殿、共產公寓與當代玻璃店面，留意立面後方建築實際深度。</p><h3>歷史背景</h3><p>勝利大道前身是連接王宮與外圍道路的交通線，王國時期成為飯店、精品、政治與文化機構聚集的社交舞台。</p><h3>相關故事</h3><p>Casa Capșa等咖啡餐飲場所曾讓文人、政治人物與商界共用一個公共客廳；喝咖啡也能是觀察社會的方式。</p><h3>實用提醒</h3><p>不為追完整日落耽誤音樂會。</p><a class="guide-return" href="#ro24-4">回到行程</a></details><details class="guide-card" id="guide-ro24-5"><summary>David Kadouch｜Bucharest International Piano Festival｜導覽</summary><h3>現場看什麼</h3><p>入場看圓形音樂廳的環形歷史壁畫與座席如何包圍舞台，再以聲音感受建築。節目包括Chopin、Liszt、Ravel、Fauré、Barber、Tchaikovsky，實際曲目以主辦方當日為準。</p><h3>歷史背景</h3><p>Athenaeum於19世紀末興建，是羅馬尼亞王國文化認同的象徵。公共募款口號「給Athenaeum一個leu」表達文化建設也需要社會參與。</p><h3>相關故事</h3><p>與上午人民宮比較：兩者都表現國家形象，但募款音樂殿堂與獨裁政權的巨型工程，在資源來源與公民關係上很不同。</p><h3>實用提醒</h3><p>若不購票，改查當日白天參觀時段；不能假設可於演出前免費參觀。演出結束時間依節目，不虛設21:00準時結束。</p><a class="guide-return" href="#ro24-5">回到行程</a></details><details class="guide-card" id="guide-ro25-2"><summary>Curtea de Argeș Monastery｜導覽</summary><h3>現場看什麼</h3><p>先繞外牆看幾何雕刻、裝飾帶與扭轉塔，再看王室墓葬的敘事。把石雕當成細工閱讀，比只拍整棟更能理解工藝。</p><h3>歷史背景</h3><p>16世紀Neagoe Basarab時期的修道院連結瓦拉幾亞王權與東正教；後來王室修復、安葬於此，把現代王國與中世紀正統相接。</p><h3>相關故事</h3><p>Master Manole為讓牆不再倒塌而犧牲妻子Ana，是民間傳說，不是建築史紀錄。其「創作以生命換永恆」的母題，在巴爾幹其他地方也可見。</p><h3>實用提醒</h3><p>與10/1 Peleș比較：此處是王室死亡與國家記憶，Peleș則是生活、外交和國家形象。</p><a class="guide-return" href="#ro25-2">回到行程</a></details><details class="guide-card" id="guide-ro25-3"><summary>Princely Church of Saint Nicholas｜導覽</summary><h3>現場看什麼</h3><p>看教堂空間與殘存宮廷位置，內部若開放，留意壁畫人物層次與統治者形象。</p><h3>歷史背景</h3><p>Curtea意為宮廷；14世紀城市是瓦拉幾亞政治與宗教中心，1359年設立都主教座。後來政治重心轉移，仍留下早期國家形成的證據。</p><h3>相關故事</h3><p>與裝飾華麗的修道院相比，王公教堂更接近早期王庭的政治核心；大小不等於歷史重要性。</p><h3>實用提醒</h3><p>不得以閃光燈拍壁畫；內部開放依現場。</p><a class="guide-return" href="#ro25-3">回到行程</a></details><details class="guide-card" id="guide-ro25-5"><summary>Poenari Fortress｜導覽</summary><h3>現場看什麼</h3><p>從河谷看山脊如何控制通道，登頂後辨認城牆與坡度的配合；防禦視野比豪華室內更重要。</p><h3>歷史背景</h3><p>此處有較早堡壘基礎，Vlad Țepeș在15世紀加固、使用它，與Vlad的聯繫比Bran的小說包裝直接。</p><h3>相關故事</h3><p>山頂堡壘需要糧食、水與守軍補給，最陡不一定最實用；把樓梯當成今天的進出條件，也能想像過去運輸的成本。</p><h3>實用提醒</h3><p>官方2026年8月公告10:00–18:00、最後上山17:00、僅組織團體；9/25出發前再確認。不能自己湊人便擅自上山。30 RON為參考，現場核對。</p><a class="guide-return" href="#ro25-5">回到行程</a></details><details class="guide-card" id="guide-ro25-6"><summary>Vidraru Dam → Hotel Valea cu Pești｜導覽</summary><h3>現場看什麼</h3><p>壩的一側是平靜蓄水湖，另一側是深谷；看弧形壩如何把水壓傳至兩側山體。</p><h3>歷史背景</h3><p>1966年完工的水力工程體現社會主義工業化、能源與控制水系的企圖。今日休閒湖景來自人造蓄水，而非天然高山湖。</p><h3>相關故事</h3><p>從水壩到隔天冰斗湖，能比較兩種完全不同的湖泊生成方式：工程阻水與冰河侵蝕。</p><h3>實用提醒</h3><p>只在正式停車處停靠；若登堡後延誤，不為湖畔夕照加速。</p><a class="guide-return" href="#ro25-6">回到行程</a></details><details class="guide-card" id="guide-ro26-2"><summary>Vidraru沿湖北上｜導覽</summary><h3>現場看什麼</h3><p>留意森林帶、河谷與聚落逐漸消失；在合法休息點觀察坡度，不在盲彎臨停。</p><h3>歷史背景</h3><p>Transfăgărășan主要在1970–1974年間興建，兼具軍事交通、山區基礎建設與政權展示功能，常與1968年後的國防焦慮相聯。</p><h3>相關故事</h3><p>把它簡化成領袖為觀光蓋的路會倒置歷史；風景公路是後來的第二生命，工程背後還有艱苦施工與人命代價。</p><h3>實用提醒</h3><p>熊可能把汽車與食物連結。保持車窗關閉、不要跟停餵食，也不要靠近熊後再找角度拍照。</p><a class="guide-return" href="#ro26-2">回到行程</a></details><details class="guide-card" id="guide-ro26-3"><summary>Capra Waterfall與南坡地形｜導覽</summary><h3>現場看什麼</h3><p>由闊葉林、針葉林、矮灌木到草甸與裸岩，觀察海拔變化如何縮短植物生長季。</p><h3>歷史背景</h3><p>山脈既是自然屏障，也是瓦拉幾亞與外西凡尼亞歷史交通的阻隔；公路打通的是地形，也是區域交流。</p><h3>相關故事</h3><p>山下舒適不代表山頂同樣溫暖。風、陰影和雨雪會讓短短數百公尺的步行也成為不同等級的活動。</p><h3>實用提醒</h3><p>沒合法停車空間就略過瀑布；不跨護欄、不進行車線。</p><a class="guide-return" href="#ro26-3">回到行程</a></details><details class="guide-card" id="guide-ro26-4"><summary>Bâlea Lake｜導覽</summary><h3>現場看什麼</h3><p>先看湖後方碗狀山壁、碎石坡與樹線，再看湖泊與隧道的位置。這是閱讀冰斗地形的最佳停點。</p><h3>歷史背景</h3><p>冰河在山谷上端侵蝕出盆狀凹地，冰退後水留在凹地形成湖泊。約2,000公尺高度的低溫、短生長季與強風限制高大樹木。</p><h3>相關故事</h3><p>與昨天Vidraru對照：一座湖由人築壩形成，一座由長時間地質作用形成；兩者都改變交通與人的使用方式。</p><h3>實用提醒</h3><p>有能見度就拍，不硬等夕照。鞋底抓地、保暖防風；路面結冰與天候警告不是可用熱情克服的條件。</p><a class="guide-return" href="#ro26-4">回到行程</a></details><details class="guide-card" id="guide-ro26-5"><summary>山頂隧道 → 北側髮夾彎 → Bâlea Cascadă｜導覽</summary><h3>現場看什麼</h3><p>穿隧道後看公路如何以髮夾彎消化高度，山谷突然開闊；用車輛作比例尺，但只在安全公共觀景區構圖。</p><h3>歷史背景</h3><p>北側開始進入Transylvania的文化地理。公路的工程幾何和冰河地形共同形成今天經典畫面。</p><h3>相關故事</h3><p>照片常讓人以為彎道可以隨便停車；實際是仍在使用的交通線，攝影者只是短暫訪客。</p><h3>實用提醒</h3><p>不跨護欄、不把車停在彎道或入口。雲霧遮擋時縮短停留，安全下山。</p><a class="guide-return" href="#ro26-5">回到行程</a></details><details class="guide-card" id="guide-ro26-unesco-arutela"><summary>UNESCO條件式新增｜Arutela羅馬軍營｜導覽</summary><h3>現場看什麼</h3><p>辨認城門、低矮牆基與軍營布局，再看Olt河谷通道。現存可辨識部分包含現代重建，不把完整門樓當作未曾改動的羅馬原件。</p><h3>歷史背景</h3><p>軍營屬羅馬占領Dacia後的邊疆交通與防禦網絡。國家文化旅遊平台記載其建立於Hadrian時代，任務與控制Cozia通道有關。</p><h3>相關故事</h3><p>平台介紹曾有來自敘利亞的弓箭部隊在此服務，提醒人羅馬軍隊與邊疆社會是跨地域流動的系統。它和征服前的達契亞山堡是不同歷史階段。</p><h3>實用提醒</h3><p>平台同時標示可參觀及修復中，列自由入場、附近停車，但非當日全面開放保證。以施工圍設為準，受限則僅看合法可見區或跳過。GPS是遺址中心，不是安全停車點。</p><a class="guide-return" href="#ro26-unesco-arutela">回到行程</a></details><details class="guide-card" id="guide-ro27-1"><summary>Piața Mare → Council Tower → Piața Mică｜導覽</summary><h3>現場看什麼</h3><p>大廣場看市政、貴族宅邸、教會與商業功能相鄰；小廣場看底層拱廊與狹长店屋。</p><h3>歷史背景</h3><p>Sibiu德名Hermannstadt。中世紀匈牙利王室招募德語移民發展邊境城鎮，商業、工匠、自治制度與教會共同塑造城市。</p><h3>相關故事</h3><p>屋頂眼睛本質是閣樓通風口，幫助儲存商品、穀物與物品，並控制雨雪進入；不是監視居民的秘密機關。</p><h3>實用提醒</h3><p>每個立面不同朝向，清晨先選受光面；不把所有廣場都稱為順光。</p><a class="guide-return" href="#ro27-1">回到行程</a></details><details class="guide-card" id="guide-ro27-2"><summary>Huet Square、Lutheran Cathedral與Lower Town｜導覽</summary><h3>現場看什麼</h3><p>看Upper與Lower Town高差、教堂尖塔與通道；拱廊為交易遮雨，階梯把象徵權力中心與生產運輸區相接。</p><h3>歷史背景</h3><p>16世紀宗教改革讓德語社群轉向路德宗，禮拜語言、教育與城市身份一起改變。行會既管品質、學徒與市場，也分擔防禦責任。</p><h3>相關故事</h3><p>Bridge of Lies讓說謊者墜落的故事屬城市傳說；真正可看的，是19世紀鑄鐵橋如何跨越通往下城的道路。</p><h3>實用提醒</h3><p>教堂礼拜可能限制參觀；若想登塔，先確認票務與樓梯狀況。</p><a class="guide-return" href="#ro27-2">回到行程</a></details><details class="guide-card" id="guide-ro27-4"><summary>ASTRA Museum｜導覽</summary><h3>現場看什麼</h3><p>每棟建築問四題：能源從哪裡來？水如何取得？食物如何保存？這戶靠什麼維生？比較磨坊的傳動系統，不只看外形。</p><p>水車與風車把自然能量轉成磨麵、鋸木、處理羊毛或製油的勞動；牧民住宅則反映季節移動與乳製品保存。</p><h3>歷史背景</h3><p>博物館以不同地區移建及保存的建築、工具與工坊呈現工業化前的生產系統。農戶不只是消費者，也生產衣物、食物與日用品。</p><h3>相關故事</h3><p>木教堂除了禮拜，也是婚喪、消息與社群記憶中心。磨坊控制者在地方經濟中往往重要，因為許多人的糧食加工都依賴它。</p><h3>實用提醒</h3><p>9月露天區長時段開放不等於每棟室內全天開門。園區大，先看入口當日圖與展示開放；17:15返程保留晚餐。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro27-4">回到行程</a></details><details class="guide-card" id="guide-ro28-1"><summary>UNESCO｜Biertan Fortified Church｜導覽</summary><h3>現場看什麼</h3><p>由外牆、塔樓、坡度、儲藏空間依序看到中央教堂；聖器室門的多點鎖具說明教堂也保管重要財產與文書。</p><h3>歷史背景</h3><p>現存晚期哥德教堂及環繞防禦系統服務村落避難，1572–1867為薩克森路德宗主教座所在地。居民無法每戶築城，便集中保護公共核心。</p><h3>相關故事</h3><p>「婚姻監獄」適合用來理解宗教社群的調解與社會壓力；網路流傳幾百年只有一對離婚，不能當可靠統計。</p><h3>實用提醒</h3><p>午休前完成室內；高地石階濕時放慢。從院落往下看長形農舍與田地，不只拍紅瓦。</p><a class="guide-return" href="#ro28-1">回到行程</a></details><details class="guide-card" id="guide-ro28-2"><summary>UNESCO｜Sighișoara歷史中心與Clock Tower外觀｜導覽</summary><h3>現場看什麼</h3><p>認出Tailors、Butchers、Tinsmiths等塔名，把城牆當成一張行會責任地圖；時鐘塔同時是城門、市政權力與公共時間的象徵。</p><h3>歷史背景</h3><p>世界遺產城堡區仍有人居住、上學與經商。工匠行會控制學徒、商品品質與市場，也維修城市特定防禦段落。</p><h3>相關故事</h3><p>黃色Vlad Dracul House是與家族歷史相關的地方傳統；Vlad出生於此城的說法，不等於可精確證明現有房間就是出生房。</p><h3>實用提醒</h3><p>不要為吸血鬼情境消費犧牲歷史街區；登塔票明早處理。</p><a class="guide-return" href="#ro28-2">回到行程</a></details><details class="guide-card" id="guide-ro28-3"><summary>Covered Scholars’ Stairs → Church on the Hill → Saxon Cemetery｜導覽</summary><h3>現場看什麼</h3><p>有頂階梯連接學校、教堂與墓園，雨雪季仍能通行。教堂看哥德拱頂、壁畫殘跡與宗教改革後的改動。</p><h3>歷史背景</h3><p>德文墓碑保存家族的世代記憶。20世紀戰爭、遷徙與1989年後移民改變薩克森人口，但不能把今日城鎮想成無人的德語遺址。</p><h3>相關故事</h3><p>教育、宗教與死亡在同一條山路上相連，反映社群生活比觀光景點分類更緊密。</p><h3>實用提醒</h3><p>墓園保持安靜；不用恐怖或吸血鬼框架理解墓地。</p><a class="guide-return" href="#ro28-3">回到行程</a></details><details class="guide-card" id="guide-ro29-1"><summary>Clock Tower／History Museum｜導覽</summary><h3>現場看什麼</h3><p>先看城市模型，再從高處辨認昨日的城門、教堂、學校和行會防禦線。機械人偶把宗教與公共時間變成可見的城市秩序。</p><h3>歷史背景</h3><p>塔樓不只為看風景而建；報時協調交易、禮拜與社會活動，也展示市政機構對公共生活的管理。</p><h3>相關故事</h3><p>昨天在巷弄看的零碎點，今天從高處連成完整城市結構。這比只拍屋頂更能讀懂城堡城。</p><h3>實用提醒</h3><p>區域旅遊資料列星期二09:00開，星期一閉館；臨時維修依現場。</p><a class="guide-return" href="#ro29-1">回到行程</a></details><details class="guide-card" id="guide-ro29-unesco-saschiz"><summary>UNESCO｜Saschiz防禦教堂村落｜導覽</summary><h3>現場看什麼</h3><p>看教堂外部扶壁、上方防禦層與獨立鐘塔，再把街道住宅一起拍入。這次不爬遠處山丘避難堡；從村中心就能比較宗教核心與聚落關係。</p><h3>歷史背景</h3><p>Saschiz是「特蘭西瓦尼亞防禦教堂村落」七個列名構成村之一。中世紀晚期，宗教建築兼有避難、防守功能，與Biertan的多重院牆形成不同的空間解法。</p><h3>相關故事</h3><p>鐘塔容易讓人想到剛離開的Sighișoara；把兩座放在一起看，可理解小村落如何借用區域中心的城市形象。不要把同一項中的多個村落算成多項世界遺產。</p><h3>實用提醒</h3><p>官方旅遊頁列週二、三室內閉館，無需為此次外觀短停預設購票。若交通延誤先刪這站；若要入內且現場例外開放，須用Rupea時間交換。上午東南方光，沿公共道路找側順光，勿站DN13車流中。</p><a class="guide-return" href="#ro29-unesco-saschiz">回到行程</a></details><details class="guide-card" id="guide-ro29-2"><summary>UNESCO｜Viscri村落與修復中的防禦教堂｜導覽</summary><h3>現場看什麼</h3><p>按「街道→立面→大門→院落→穀倉→長形地塊」觀察，每戶其實是一個生產單位。高大木門讓馬車、牲畜與農產品通行。</p><h3>歷史背景</h3><p>Viscri德名Weisskirch，村落的防禦教堂把宗教、储糧與避難集中；社區修復與傳統工藝延續比單棟藍房子更重要。</p><h3>相關故事</h3><p>移民後的村落曾面臨人口與維護問題，保育和旅遊帶來收入，也改變房屋用途。暫時關閉修復是保存工作的一部分，不是世界遺產失去價值。</p><h3>實用提醒</h3><p>GPS指教堂範圍，不能直接開入居民道路。照村外停車指示，勿推開私人院門。</p><a class="guide-return" href="#ro29-2">回到行程</a></details><details class="guide-card" id="guide-ro29-3"><summary>Rupea Fortress｜導覽</summary><h3>現場看什麼</h3><p>由下往上看不同高度防禦區、城牆轉折與玄武岩基座；觀察它如何利用孤立丘體控制附近交通。</p><h3>歷史背景</h3><p>與村落教堂不同，Rupea是依山丘地形發展的防禦聚落，分期擴張讓不同高度形成多層保護。</p><h3>相關故事</h3><p>比較四種防禦：Viscri農村避難、Biertan宗教中心、Sighișoara城鎮行會、Rupea山丘交通控制。它們不是四次重複看城牆。</p><h3>實用提醒</h3><p>風大、雨後石路滑時不上高處。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro29-3">回到行程</a></details><details class="guide-card" id="guide-ro29-4"><summary>Black Church室內｜導覽</summary><h3>現場看什麼</h3><p>先找鄂圖曼／安納托利亞地毯，再看哥德空間、管風琴與商人捐贈。地毯出現在路德宗教堂，正說明宗教邊界不等於商業邊界。</p><h3>歷史背景</h3><p>Brașov德名Kronstadt，靠跨山貿易富裕。16世紀Johannes Honterus推動宗教改革，德語教育與教會制度也隨之轉變。</p><h3>相關故事</h3><p>Black Church之名通常與1689年大火後建築外觀相聯；真正值得看的並不只是顏色，而是商業財富如何轉成宗教藝術。</p><h3>實用提醒</h3><p>攝影與音樂會另依館規；勿為拍外觀錯過最後入場。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro29-4">回到行程</a></details><details class="guide-card" id="guide-ro29-5"><summary>White Tower → Council Square｜導覽</summary><h3>現場看什麼</h3><p>向東南看廣場、紅瓦與Tâmpa，城市緊貼山體；與較開闊的Sibiu比較自然地形如何限制城市。</p><h3>歷史背景</h3><p>城牆曾控制貿易與居住權。Catherine’s Gate、Șchei Gate另一側的羅馬尼亞社區，補足德語老城之外的歷史。</p><h3>相關故事</h3><p>Rope Street窄巷與消防、通行需求相關，不必追逐「歐洲最窄」排名；城市密度與居民使用更有意義。</p><h3>實用提醒</h3><p>White Tower向東南拍，傍晚太陽在側後方；山影可能早於天文日落。</p><a class="guide-return" href="#ro29-5">回到行程</a></details><details class="guide-card" id="guide-ro30-1"><summary>Libearty Bear Sanctuary｜導覽</summary><h3>現場看什麼</h3><p>觀察森林、水池與動物能否自行退開；保育中心的空間不應迫使熊為每位付費觀眾表演。</p><h3>歷史背景</h3><p>園區接納曾遭私人圈養、展演或不當飼養的熊。長期圈養可能造成傷病、依賴人工餵養與失去對人的警戒，並非所有救援動物都適合野放。</p><h3>相關故事</h3><p>看不到近距離熊不代表服務失敗，反而可能表示牠能按自己的行為選擇隱蔽處。保育是改善一生的福利，不只是放回森林的單一結局。</p><h3>實用提醒</h3><p>不叫喊、餵食、引誘或使用閃光；相機規則與額外費用購票時核對。</p><a class="guide-return" href="#ro30-1">回到行程</a></details><details class="guide-card" id="guide-ro30-2"><summary>Dâmbul Morii → Seven Ladders入口｜導覽</summary><h3>現場看什麼</h3><p>林間步道到狹谷可感受局部微氣候：日照減少、空氣變涼、石面長期潮濕。</p><h3>歷史背景</h3><p>水沿石灰岩裂隙侵蝕，形成狹窄通道、瀑布與垂直落差；人工梯和平台只是讓人穿越地貌的工具。</p><h3>相關故事</h3><p>主角不是「七」這個數字，而是流水、岩層與時間；梯子則讓安全條件受水量與摩擦力直接影響。</p><h3>實用提醒</h3><p>此站地圖搜尋步道起點，下一站GPS是峽谷。不要開車導航到峽谷座標。</p><a class="guide-return" href="#ro30-2">回到行程</a></details><details class="guide-card" id="guide-ro30-3"><summary>Seven Ladders Canyon與可選Zipline｜導覽</summary><h3>現場看什麼</h3><p>金屬梯旁看瀑布、水蝕凹槽與層理；穩定站位才拍照，不一邊爬梯一邊操作手機。</p><h3>歷史背景</h3><p>狹谷撤退空間有限，降雨會同時改變水量、落石、金屬表面摩擦力與保暖條件。</p><h3>相關故事</h3><p>滑索提供橫越森林的另一種感受，但不是必須完成的第二張門票；留下體力安全返回比湊滿活動重要。</p><h3>實用提醒</h3><p>穿抓地鞋，雙手保持可用；雨衣和保暖層收在防水袋，裝備與路線遵循現場人員。</p><a class="guide-return" href="#ro30-3">回到行程</a></details><details class="guide-card" id="guide-ro30-4"><summary>UNESCO替代版｜Prejmer＋Șchei｜導覽</summary><h3>現場看什麼</h3><p>先穿入口通道，看厚重圍牆內多層家庭房間與儲藏室，再走允許開放的木廊。教堂本體由外圍巨大防禦圈保護，與Viscri直接強化教堂的方式比較。室內留意哥德式翼狀祭壇。</p><h3>歷史背景</h3><p>Prejmer把避難與儲糧高度制度化；Șchei的宗教及教育傳統提醒人，城牆內外曾有不同居住與經濟權利。</p><h3>相關故事</h3><p>三座防禦教堂可比較規模：Viscri農村、Biertan主教中心、Prejmer大型避難系統。</p><h3>實用提醒</h3><p>出發前致電+40 268 362 042確認9/30開放；此次不寫未核實的新票價。走廊昏暗、木階窄，拍照先讓人通行。票價與房間開放依現場。</p><a class="guide-return" href="#ro30-4">回到行程</a></details><details class="guide-card" id="guide-ro01-2"><summary>Cantacuzino Castle｜導覽</summary><h3>現場看什麼</h3><p>看拱廊、柱式、石雕、木作與家族徽章，再從露台向西望Bucegi。上午較利看清山壁，雲層仍可能完全遮擋。</p><h3>歷史背景</h3><p>1911年完成的貴族宮邸屬Gheorghe Grigore Cantacuzino，不是王室夏宮。Neo-Romanian從Brâncovenesc、修道院與傳統建築提取國家風格。</p><h3>相關故事</h3><p>富有主人被稱為Nabob；《Wednesday》取景是今日附加故事，影集畫面還包含影像製作，不等於現場每一棟建築。</p><h3>實用提醒</h3><p>與Bucharest的法式宮殿比較：前者尋求國際西化，Neo-Romanian則追問本國現代建築應有何種樣貌。</p><a class="guide-return" href="#ro01-2">回到行程</a></details><details class="guide-card" id="guide-ro01-3"><summary>Peleș庭園與入場準備｜導覽</summary><h3>現場看什麼</h3><p>看陡屋頂、半木構、塔樓與山林莊園意象；與Cantacuzino拱廊語彙比較，不把兩棟都簡化成同樣的城堡。</p><h3>歷史背景</h3><p>Carol I出身Hohenzollern-Sigmaringen，Peleș的德國新文藝復興語彙反映王朝背景，也服務羅馬尼亞新王國的歐洲形象。</p><h3>相關故事</h3><p>它既是家，也是外交舞台；來訪者看到的工藝、收藏與技術都傳遞統治者的文化權威。</p><h3>實用提醒</h3><p>正午光較硬，找局部側光與木作細節；勿在拍照中錯過時窗。 UNESCO辨識：此景點本身不屬羅馬尼亞目前11項正式世界遺產，仍保留原本參觀價值。</p><a class="guide-return" href="#ro01-3">回到行程</a></details><details class="guide-card" id="guide-ro01-4"><summary>Peleș Castle室內｜中文逐房間導覽｜導覽</summary><h3>現場看什麼</h3><p>Peleș Castle 中文現場導覽｜2026/10/1
這份導覽依 Ground Floor（地面層）＋First Floor（Etaj I，上層）的房間名稱整理，供現場對照；編號是閱讀順序，不是館方保證的當日參觀動線。實際可進入房間、展品與路線以當天開放及工作人員指示為準。</p><p>先記一個核心：Peleș並不是中世紀防禦城堡，而是Carol I國王在19世紀末打造的現代皇家夏宮。工程從1873年延續至1914年，1883年已正式投入使用；它同時是住所、王室接待場所、政治活動空間與藝術收藏館。城堡很早就有中央暖氣、浴室自來水與排污；1884年裝上電力系統與自己的發電機，1897年又有水力發電設施，1906年已有電影放映設備。</p><p>01｜進城堡前：先站遠一點看整體
不要一到門口就急著進去。先看它為什麼不像Bran或Biertan防禦教堂：這裡不是以抵禦戰爭的巨大城牆為主，而是讓塔樓、木骨架、彩繪、陽台與山林融合。
Carol I來自德國Hohenzollern-Sigmaringen家族，所以核心美學有強烈的德國文藝復興與阿爾卑斯山莊氣息，後來又加入義大利、法國、摩爾和土耳其風格。把它理解為國王將偏愛的歐洲文化收藏進一棟房子，同時用這些工藝展示新王國的文化地位。
拍攝：不要貼近正門，從較低的進場步道取景，讓主塔、森林和山體一起入畫；保留建築頂端，不把塔尖切掉。抵達時間接近正午，光線較硬，可補拍半木構、石雕和陽台細節。</p><p>02｜內院 Courtyard：外牆彩繪與木骨架
進內院先抬頭：深色木骨架、白牆、壁畫、突出陽台與斜屋頂，比正面更容易讀出德國及中歐風格。外觀看似古堡，內部運作卻是工業時代的豪宅。
影視連結：Netflix《A Christmas Prince》系列把Peleș用作虛構王國Aldovia的王宮，外觀、進場道路及內院最容易辨認。電影場景還使用其他建築，不能把所有銀幕室內都當成Peleș。別和《Wednesday》混淆：你當日上午參觀的Cantacuzino Castle才是該劇知名外觀取景地。
拍攝：用院角斜拍木骨架與上層陽台，或垂直拍立面和天空；先讓出入場隊伍動線。</p><p>03｜Holul de Onoare／Hall of Honor 榮譽大廳 ★★★★★
建築空間的首要重點。進去先感受木雕的密度，再按「深色雕刻木牆→多層陽台→大型樓梯→彩繪玻璃→天花板」往上看。
1907–1911年間，原本第二座內院被改造成主要王室接待空間。德國文藝復興語彙混合巴洛克元素，維也納裝飾師Bernhard Ludwig與建築師Karel Liman合作，靈感與Lübeck的Fredenhagen Hall相關。
最容易漏掉的是可開啟的玻璃天頂：歷史風格外表包住當時先進的採光、通風機械設計。若當天沒有運作，不表示這套設計不存在。
拍攝：在允許停留的位置退到角落，以0.5×或1×垂直拍，將下層木雕、上層陽台和玻璃天頂同框。超廣角容易讓柱子歪斜，盡量保持手機直立，不為取景越過繩線。</p><p>04｜Cabinetul Regelui／King Carol I’s Private Cabinet 國王書房
從大廳的國家展示轉入國王工作世界。看書桌、會客座位、深色木作、彩繪玻璃與壁爐，判斷工作、閱讀及接見如何在同一空間安排。
這不是純裝飾房，而是處理政務與工作之處。1883年前後，Hamburg的Julius Daniel Heymann工坊已參與書房及圖書館室內工程。相較接待大廳的炫目，書房給人較沉穩、德式而有秩序的感受；這是觀察空間氣質，不必把每件家具都當作國王性格的證據。
故事：王室夏季移到Sinaia不等於停止工作，官員、接見及政治活動也跟著移動；夏宮可以同時是夏季政治中心。
拍攝：以書桌和後方木櫃交代空間關係，別只拍孤立桌面；不越線尋找「國王視角」。</p><p>05｜Biblioteca Regală／Royal Library 皇家圖書館 ★★★★
不要只看書。先看深色木櫃與皮革書背，再找書架中隱藏門的接縫。若工作人員沒有指出位置，不自行推拉書架。
這類隱藏門連接私人內部動線和樓梯，不應直接稱為電影式逃生隧道。它讓大型宮殿的工作與私人區域互相連通，也能讓國王避免每次都穿越公開接待空間。
值得記住的故事：秘密門不必解釋成「怕刺客」；私人性、禮儀與動線效率已足以說明設計價值，真正用途仍以館方解說為準。
拍攝：如果能辨认而且允許拍攝，拍書櫃整體與門縫的位置關係，比只拍一排書更有故事。</p><p>06｜Sălile de Arme／Armory Halls 武器廳 ★★★★★
若Hall of Honor是建築亮點，武器與盔甲則是館藏重點。Carol I收藏逾4,000件武器與盔甲，跨約14–20世紀，來源包括德國、奧地利、義大利、西班牙、法國、波蘭、匈牙利及鄂圖曼世界；不代表全部同時展出。
類型包括頭盔、盾、劍、匕首、長矛、斧、弩、早期火器、步槍、手槍和狩獵裝備。別平均分配注意力，先挑三類：
①全身甲：看肩、肘、膝關節的重疊與活動方式。
②騎士及馬匹裝備：盔甲不是一件衣服，而是人、馬、武器與戰術組成的系統。
③Ottoman／Oriental weapons：比較刀刃形狀、裝飾、握柄與西歐武器的差別。
連回旅程：你在Transylvania看過防禦塔樓，這裡可補足軍事物件的概念；但不能假定每件王室收藏都曾由那些城鎮守軍使用。禮儀、狩獵與實戰用途也要分開。
拍攝：先取完整人馬或盔甲輪廓，再拍關節和金工；玻璃反光時移動角度，不加補光、不贴近展櫃。</p><p>07｜Sala Veche de Muzică／Old Music Room 舊音樂廳
從Carol I轉向Queen Elisabeth的文化世界。她以Carmen Sylva為筆名寫詩、小說與劇本，也熱愛音樂；Peleș的文學與音樂沙龍接待音樂家、作家和演員。
這間房不是僅以音樂為裝飾主題，而是能想像鋼琴、室內樂、朗誦與文學交流如何發生的地方。先看樂器、座位和演奏者之間的距離，再看牆面藝術。
若見女性、傳說或浪漫主義題材的繪畫，可多停一下，理解王后的文學趣味如何參與宮殿形象；具體作者與作品名稱以標牌為準。
拍攝：樂器與房間同框，呈現沙龍尺度；不要只拍鍵盤特寫，也不觸碰樂器。</p><p>08｜跨房間線索：Gustav Klimt與Künstler-Compagnie
年輕、尚未畫出《The Kiss》的Gustav Klimt，與弟弟Ernst Klimt及Franz Matsch組成Künstler-Compagnie，1883–1886年間為Peleș工作。
官方館方將相關作品分為Hohenzollern祖先肖像、古典大師作品仿作，以及Theater Hall和大型樓梯天花等處的原創裝飾。這些是早期工坊合作階段，不能看到一幅裝飾畫就全部歸給Gustav本人。
看點：找作品標籤、導遊指認的位置，比較歷史題材、古典人物造型與後來熟悉的金色裝飾風格。這裡的重要性正是看見大師成名前的訓練和委託工作。
Theater Hall若未開放，不為尋找作品離開路線。遇到Klimt或Künstler-Compagnie名字就停下來聽，能把散落不同房間的藝術串起來。</p><p>09｜Sala Florentină／Florentine Hall 佛羅倫斯廳 ★★★★★
風格切換最鮮明的房間之一。1908–1911年前後完成的室內與Karel Liman、Ferdinand von Tiersch參與的工程階段相關，以義大利文藝復興宮殿語彙打造華麗接待空間。
進去先抬頭看天花板，然後依序看金色雕刻、義大利式裝飾、大吊燈、石材／壁爐和家具。注意材質與色彩如何把前面厚重木作的感受轉成另一種宮廷氣氛。
故事：不是宮殿突然「變成義大利」，而是王室以不同文化語彙展示收藏趣味和接待能力。房間風格也是訪客在宮內移動時經歷的一連串情緒。
拍攝：房間角落斜拍較有深度，納入天花與壁爐；若只能沿單一路線走，以可停位置取景，不逆向穿過團體。</p><p>10｜Sala Maură／Moorish Hall 摩爾廳 ★★★★
1890–1892年前後改造階段的重要空間，與Émile André Lecomte du Noüy相關。Moorish在這裡是19世紀歐洲對安達盧西亞及北非伊斯蘭藝術的想像與再創造。
找馬蹄形拱券、幾何及植物紋、密集裝飾表面，再觀察武器、地毯與色彩。和德式房間相比，不只家具不同，整個牆面和拱形的觀看方式都改變。
它不是忠實重建Marrakech或Granada，而是歐洲王室眼中的「Orient」。把建築模仿、真實收藏品和後來陳設分開理解。
拍攝：利用拱券作框景，或拍重複紋樣的細節；不要用這個房間代表所有伊斯蘭建築。</p><p>11｜Sala Coloanelor／Columns Room 柱廳
適合讀懂空間銜接，不一定需要久停。看柱子如何分隔動線、鏡面如何擴展視覺，以及光線怎樣引導你進入相鄰房間。
這一帶與Florentine、Moorish、Old Music等空間的連接，是Carol I後期持續重建擴充的結果，1906年前後曾有重要重新配置。
故事：大宮殿不是房間目錄而已，過渡區決定訪客先看到什麼、誰能進哪裡，以及不同風格如何相接。
拍攝：順柱列取透視，注意鏡子裡不要只剩自己與手機。時間不足可快速通過，把停留留給重點廳室。</p><p>12｜Salonul Francez／French Room 法國廳
看宮廷社交的另一種語言：相較深色德式房間，留意較淡色調、曲線、家具比例與沙龍座位如何讓空間显得輕盈。
不用只找名畫；把座椅間距與交談動線也當成展品。這種房間服務的是會面、社交和待客，不只是展示財力。
比較記法：德式房間常給人厚重權威感，法式沙龍偏輕巧社交，Moorish／Turkish rooms則營造異國趣味。這是閱讀這座宮殿的捷徑，不是各國藝術固定不變的性格。
拍攝：讓一組家具與牆面裝飾同框，保留曲線和留白，比只追吊燈更能表現房間氣質。</p><p>13｜Salonul Turcesc／Turkish Room 土耳其廳
和Moorish Hall分開看：Moorish的建築表面與拱券較突出；Turkish Room更容易從地毯、織品、低矮家具、銅器和圖案讀出19世紀上流社會的東方風格沙龍。
當時歐洲宫廷流行Turkish、Chinese、Moorish等主題空間，代表國際收藏趣味與文化想像，而不是原封不動移植某國日常家庭。
看織物圖案如何重複到家具表面、牆面與地面，讓房間形成整體氣氛。若現場稱為吸菸室，理解這是當時社交用途，不表示今天可吸菸。
拍攝：拍織品、地毯和低家具的組合；避免以手機靠近脆弱表面。</p><p>14｜Sufrageria／Royal Dining Room 皇家餐廳
不要只看餐桌：想像國王與來賓的位置、階級排序、服務人員入口，以及菜餚如何送進來。正式宴會也是外交和禮儀的一部分。
早期家具與Mainz的August Bembé工坊相關，1906年餐廳又擴建。家具、牆面、照明和服務動線共同支撐王室接待。
故事：這一間讓Peleș從靜態藝術收藏館回到真正有人吃飯、工作、接待的住宅。餐桌陳設也可能是博物館展示安排，不把當天擺法直接當成某次歷史宴會原貌。
拍攝：斜拍長桌、椅列和房間深度；不隔著繩線伸手取餐具細節。</p><p>15｜上到First Floor：住宿與私人生活的尺度
羅馬尼亞Etaj I是Ground Floor上面的樓層，中文閱讀時以「上層」辨認，避免與台灣所說一樓混淆。
官方房間式語音導覽列出Marble Gallery、Guest Library、Rococo Suite、Yellow Room、Small Music Room、Breakfast Room、Imperial Suite、Maid of Honour’s Suite、Guard Room、Great Music Hall及Royal Suite。列在語音網站不表示2026/10/1每一間都一定開放。
樓下以國家、儀式與接待為主要閱讀線索；上層則轉向賓客住宿、王室私人生活與較內部的文化活動。沿路看走廊、房門、服務空間怎樣管理公私界線。
快速辨認：Marble Gallery看材質與連接；Guest Library看賓客閱讀；Rococo Suite看曲線與輕巧裝飾；Yellow Room先看色彩；Breakfast Room和正式餐廳比較；Maid of Honour與Guard房間則讓你看見王室生活背後的侍從與安全系統。具體展品依現場標牌，不自行推測未開放房間內容。</p><p>16｜Apartament Imperial／Imperial Suite 帝國套房 ★★★★
上層重點之一。1905–1906年完成的大型套房組包括大客廳、小客廳、臥室、boudoir、浴室和valet room，並非只有一間豪華睡房。
看家具、牆面、織物、壁爐和燈具如何整套設計，再看正式接待、休息、更衣與服務如何分區。Boudoir偏私人起居／梳妝空間；valet room則涉及侍從服務。
故事：王室為最高等級來賓準備的住宿，也是一場外交體驗。Gesamtkunstwerk「整體藝術作品」是好用的閱讀概念：房間各種工藝互相配合，而不是昂貴物件隨意堆滿。
拍攝：選能連結兩個空間的門框透視，或家具、壁爐、牆面三者同框；只在開放動線上取景。</p><p>17｜Sala de Concerte／Great Music Hall 大音樂廳
把Queen Elisabeth想回來：她的音樂與文學沙龍讓宮殿成為歐洲文化網絡的一部分，而不只服務政治。館方也曾在這類歷史音樂空間安排演出，能幫助想像房間被使用的樣子；不表示參觀當天有音樂會。
看演出布局、木雕、座位與演奏者距離，以及房間尺度如何影響聲音和觀看。別把它和地面層Old Music Room混成同一間。
故事：私人沙龍與大型正式音樂空間對應不同社交場合。王室文化贊助讓作家、音樂家與政治訪客在宮殿相遇。
拍攝：以演奏區和座位關係為主，不只拍樂器；演出或工作人員測試時保持安靜。</p><p>18｜Apartament Regal／Royal Suite 王室套房
最後看生活細節：床、桌椅、浴室／更衣區、私人通道、窗外景觀。房間的舒適、暖氣、供水和服務，才能解釋這座夏宮如何長期居住。
不要把窗外風景當純背景：採光、山林視野與安靜位置，也是王室生活的設計條件。若浴室或附屬空間未開放，就用館方圖示理解，不越線寻找。
走到這裡，前面看到的「藝術博物館」逐漸還原成有人每天起床、工作、用餐與接待的房子。宮殿的先進設備和私人動線，與前面展示給訪客的權威形象共同構成Peleș。
拍攝：用床與窗、桌與門的相對位置表現生活尺度，尊重禁止攝影的個別文物標示。</p><h3>歷史背景</h3><p>參觀完，再回頭看一次外觀</p><p>第一次看，可能只覺得是漂亮的歐洲童話城堡；走完房間後，可以把它看成一位德國出身、參與建立現代羅馬尼亞王國的國王，運用當時科技與歐洲藝術打造的政治、文化和私人生活舞台。住所、外交接待、藝術收藏與現代設備在同一棟建築裡結合。</p><p>上層與地面層的房間不是彼此無關的景點：從公開接待、收藏、文化沙龍，走到賓客與王室住宿，就是從國家形象逐步進入私人生活。</p><h3>相關故事</h3><p>時間有限，優先找這8處（以實際開放為準）</p><p>①Hall of Honor：木雕、陽台與玻璃天頂，建築首選。</p><p>②Royal Library：書櫃中的隱藏門與私人動線。</p><p>③Armory Halls：盔甲、人馬裝備與不同文化的武器。</p><p>④Old Music Room：Queen Elisabeth／Carmen Sylva的沙龍世界。</p><p>⑤Florentine Hall：義大利式華麗工藝与風格切換。</p><p>⑥Moorish Hall：拱券、幾何紋與19世紀東方想像。</p><p>⑦Imperial Suite：完整皇家賓客住宿與整體設計。</p><p>⑧Great Music Hall：王室文化活動、演奏布局與房間尺度。</p><p>跨房間任務：一路找Klimt／Künstler-Compagnie標示。重點是早期工坊合作作品，不是後來《The Kiss》的金色成熟期。若作品所在空間不開放，不擅自離開參觀路線。</p><h3>實用提醒</h3><p>2026/9/30核對：官方成人100 RON含Ground Floor＋First Floor；2026/10/1星期四09:15–17:00，最後個人入場16:00。12:45英文團在入口按到達順序組團；可以配合館方房間式網頁語音導覽使用本中文版本，戴耳機、不外放。</p><p>攝影：官方允許業餘無閃光拍攝，禁止補光及三腳架；自拍棒是否可用請依現場，建議不使用。個別文物禁拍時優先遵守。照片／影片限私人用途，官方條款另限制公開上網，公開發表須先詢問館方並取得所需同意；不能因可拍照就認為可自由發布。</p><p>取景不越過繩線、不觸摸木雕、壁板、織物或樂器，也不擋住團體。0.5×只是手機取景建議，不必為湊齊照片站到房間中央或逆向走。</p><p>室內結束時間依實際動線調整午餐與Pelișor外觀。Pelișor於2026/9/28–11/3室內維護關閉，這份上層導覽指Peleș，不是Pelișor。</p><p>官方逐房間語音導覽：https://peles.ro/en/viziteaza/ghid-audio/（可由本頁底部「查核來源」直接開啟）。</p><a class="guide-return" href="#ro01-4">回到行程</a></details><details class="guide-card" id="guide-ro01-5"><summary>Pelișor僅外觀｜導覽</summary><h3>現場看什麼</h3><p>從較小尺度及住宅感理解它與Peleș的差別，現場只看開放外圍。</p><h3>歷史背景</h3><p>Pelișor與Queen Marie的Art Nouveau、拜占庭與凱爾特美學相關，呈現比Carol I正式國家舞台更私人的王室世界。</p><h3>相關故事</h3><p>不能進去時，保留這個比較就足夠：不是每一處歷史都必須透過當天入內才有意義。</p><h3>實用提醒</h3><p>施工圍設及禁行區以現場為準。</p><a class="guide-return" href="#ro01-5">回到行程</a></details><details class="guide-card" id="guide-ro01-6"><summary>Sinaia Monastery｜導覽</summary><h3>現場看什麼</h3><p>比較兩個庭院與不同時期教堂；門牆、封閉院落與宗教空間也反映山路上的保護與接待需求。</p><h3>歷史背景</h3><p>Mihail Cantacuzino於1695年創建修道院，名稱源自西奈山聖凱薩琳修道院，城鎮後來以它命名。</p><h3>相關故事</h3><p>皇家山城並非先有宮殿才有歷史；修道院是王國旅遊與避暑興起前的重要節點。</p><h3>實用提醒</h3><p>不打斷禮拜；看17世紀舊教堂與19世紀大教堂的差異。</p><a class="guide-return" href="#ro01-6">回到行程</a></details><details class="guide-card" id="guide-ro01-7"><summary>Dimitrie Ghica Park與Casino外觀｜導覽</summary><h3>現場看什麼</h3><p>看公園、旅館、Casino與車站如何共同服務避暑社交生活。</p><h3>歷史背景</h3><p>1913年落成的Casino代表王室、政治與富裕階層的山城娛樂，Sinaia既是自然避暑地，也是身分展示場。</p><h3>相關故事</h3><p>今天悠閒公園背後曾有音樂、舞會、博彩與精英社交網絡。</p><h3>實用提醒</h3><p>不預設Casino室內開放；Kuib或其他餐廳依當日營業選擇。</p><a class="guide-return" href="#ro01-7">回到行程</a></details><details class="guide-card" id="guide-ro02-4"><summary>Spring Palace／Ceaușescu Mansion｜導覽</summary><h3>現場看什麼</h3><p>看家庭成員房間、泳池、服務與生活動線，不只數昂貴家具與浴室。住宅如何隔離一般社會，本身就是權力結構。</p><h3>歷史背景</h3><p>最高統治家庭享有和一般配給、能源限制不同的生活條件。它與人民宮互補：一個是對外公共權力舞台，一個是封閉私人特權。</p><h3>相關故事</h3><p>昨天Peleș公開以王室工藝及科技展示國家；今天住宅讓人比較另一種制度如何安排統治者生活。兩者皆豪華，並不代表政治意義相同。</p><h3>實用提醒</h3><p>未訂票；若12:00還車採14:30以後場次。無票改美術館，不到門口賭導覽名額。</p><a class="guide-return" href="#ro02-4">回到行程</a></details><details class="guide-card" id="guide-ro02-5"><summary>King Michael I Park → Arcul de Triumf｜導覽</summary><h3>現場看什麼</h3><p>公園看居民慢跑、遛狗與湖岸生活，凱旋門則看法式紀念形式如何用於本國歷史。</p><h3>歷史背景</h3><p>Herăstrău公園更名為King Michael I，反映後共產時代重新評估王室記憶；凱旋門連結戰爭、統一與王國時代首都形象。</p><h3>相關故事</h3><p>從Athenaeum到銀行宮殿再到凱旋門，現代國家透過文化、金融與軍事紀念形成一套城市語言。</p><h3>實用提醒</h3><p>不要越過圓環車道拍照。晚間買巴士用水、食物與少量現金，不囤需冷藏食品。</p><a class="guide-return" href="#ro02-5">回到行程</a></details><details class="guide-card" id="guide-ro03-1"><summary>早餐、退房與抵達票面站點｜導覽</summary><h3>現場看什麼</h3><p>護照、手機、行動電源、藥物與貴重品放隨身包，車牌、目的地與司機確認後再放大行李。</p><h3>歷史背景</h3><p>羅馬尼亞與保加利亞同属東正教傳統影響的區域，但前者以羅曼語為主，後者以斯拉夫語為主。共同經歷帝國、王國與社會主義，不代表歷史認同完全一樣。</p><h3>相關故事</h3><p>從Bucharest前往Veliko Tarnovo，可把接下來的中世紀保加利亞國家敘事，與羅馬尼亞王國及瓦拉幾亞故事比較。</p><h3>實用提醒</h3><p>不因邊境常規檢查變動而把護照放行李艙；承運人及警方仍可能查驗身份。</p><a class="guide-return" href="#ro03-1">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://www.biserica-fortificata-viscri.ro/en/" target="_blank" rel="noopener">Viscri官方｜修復與部分開放</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://peles.ro/en/program-si-taxe/" target="_blank" rel="noopener">Peleș官方｜時段、英文導覽、票價</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://peles.ro/en/anunturi/in-perioada-28-septembrie-3-noiembrie-2026-castelul-pelisor-va-fi-inchis-pentru-curatenie-generala-si-conservare-preventiva/" target="_blank" rel="noopener">Pelișor官方｜9/28–11/3關閉</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://millionsoffriends.org/en/amp-libearty/visit-the-sanctuary/" target="_blank" rel="noopener">Libearty官方｜新時段</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://www.iabilet.ro/bilete-david-kadouch-recital-de-pian-bucharest-international-piano-festival-128514/" target="_blank" rel="noopener">Kadouch正式售票頁</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://comunabiertan.ro/turism/" target="_blank" rel="noopener">Biertan市政府｜秋季每日開放與午休</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://visitmures.com/sighisoara/patrimoniu/muzee/muzeul-de-istorie-sighisoara" target="_blank" rel="noopener">Mureș區域旅遊｜Sighișoara博物館</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://www.stb.ro/info.php?P=9" target="_blank" rel="noopener">STB｜機場站工程調整公告</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://tvrinfo.ro/prima-ninsoare-pe-transfagarasan-drumarii-spun-ca-nu-a-fost-nevoie-sa-intervina-iar-traficul-nu-este-afectat/" target="_blank" rel="noopener">TVR 9/22｜初雪當時未影響交通</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://www.cjarges.ro/en/programul-evenimentelor-cultural-artistice-in-perioada-15-23-august-2026" target="_blank" rel="noopener">Argeș官方8月公告｜Poenari團體參觀</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://stagiuneacamerala.ro/event/odae-cum-harmoniis-duo-noema/" target="_blank" rel="noopener">Duo Noema主辦方｜9/27 17:00</a> · 2026-09-22查核；實際出發日仍依公告</li><li><a href="https://muzeulastra.ro/" target="_blank" rel="noopener">ASTRA官方</a> · 2026-09-22｜前11項已查核；其餘為官方後續查詢入口。歷史導覽整合使用者提供文本，GPS沿用提供座標。</li><li><a href="https://www.cantacuzinocastle.com/" target="_blank" rel="noopener">Cantacuzino官方｜出發前確認售票</a> · 預約前再確認，未把提供時段當作當日保證</li><li><a href="https://casaceausescu.ro/en/" target="_blank" rel="noopener">Spring Palace官方｜英文導覽確認</a> · 預約前再確認，未把提供時段當作當日保證</li><li><a href="https://whc.unesco.org/en/statesparties/ro" target="_blank" rel="noopener">UNESCO｜Romania正式名錄</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/596/maps/" target="_blank" rel="noopener">UNESCO｜七村構成點</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/902/" target="_blank" rel="noopener">UNESCO｜Sighișoara</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/597/" target="_blank" rel="noopener">UNESCO｜Hurezi</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/1718/maps/" target="_blank" rel="noopener">UNESCO｜羅馬疆界構成點與座標</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://whc.unesco.org/en/list/1133/maps/" target="_blank" rel="noopener">UNESCO｜山毛櫸林邊界</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://turism.saschiz.ro/locatii/biserica-sfantul-stefan" target="_blank" rel="noopener">Saschiz官方旅遊中心｜週二三閉館</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://kirchenburgen.org/en/location/tartlau-prejmer/" target="_blank" rel="noopener">防禦教堂基金會｜Prejmer</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://romania-atractiva.ro/ro/profiles/castrul-roman-arutela" target="_blank" rel="noopener">國家文化旅遊平台｜Arutela</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://ich.unesco.org/en/state/romania-RO" target="_blank" rel="noopener">UNESCO非物質文化遺產｜Romania</a> · 2026-09-24｜UNESCO路線補充；開放狀況以到訪日為準</li><li><a href="https://peles.ro/en/viziteaza/ghid-audio/" target="_blank" rel="noopener">Peleș官方｜逐房間語音導覽（Ground Floor＋First Floor）</a> · 2026-09-30｜中文逐房間導覽對照</li><li><a href="https://peles.ro/en/despre/istoricul-castelului-peles/" target="_blank" rel="noopener">Peleș官方｜建築與室內擴建史</a> · 2026-09-30｜建築史核對</li><li><a href="https://peles.ro/en/program-si-taxe/" target="_blank" rel="noopener">Peleș官方｜開放時間、票價與攝影規定</a> · 2026-09-30｜10/1參觀及攝影提醒</li></ul></section></main></template>
<template id="content-albania-second-2026"><nav><a href="#al20">09-20 Ohrid → Lin → Berat｜湖岸與千窗黃昏</a><a href="#al21">09-21 Berat｜活城堡、聖像與住宅城市</a><a href="#al22">09-22 Durrës → Laknas → TIFF｜海港考古與當代電影</a><a href="#al23">09-23 Laknas → TIA → Bucharest｜提前還車搭機</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="al-overview"><h2>阿爾巴尼亞第二段｜湖村、千窗山城與羅馬港口</h2><p>2026/9/20–9/23。銜接北馬其頓天氣調整版：9/19已遊Ohrid南岸；9/20 07:30由Ohrid北線出境，經Lin前往Berat。Berat住兩晚，9/22經Durrës至Laknas，9/23搭機。全部時間為當地夏令時間CEST（UTC+2）。</p><p>這段保留Berat完整文化日，不加入Gjirokastër。Lin是跨境日的彈性停點；TIFF是已公布場次、尚未購票的晚間選項。每站「導覽」可展開歷史、現場看法與故事，拍照位置集中於下方攝影表。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>主線</th><th>住宿</th></tr></thead><tbody><tr><td>9/20（日）</td><td>Ohrid → Qafë Thanë → Lin → Berat</td><td>Apartment Geart｜9/20–22，Berat，Rruga Petrit Lulo一帶</td></tr><tr><td>9/21（一）</td><td>Berat Castle、Onufri、Kala、下城與Gorica</td><td>Apartment Geart｜第2晚</td></tr><tr><td>9/22（二）</td><td>Durrës → Laknas → TIFF候選場次</td><td>Beautifull Apartament｜9/22–23，Laknas，Rruga Gryka e Kaçanikut一帶</td></tr><tr><td>9/23（三）</td><td>07:45還車目標 → 08:25航廈 → 11:35 TIA–OTP</td><td>航班時間依使用者提供；出發前以航空公司訂位核對</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Apartment%20Geart%20Berat">Apartment Geart（核對房東提供入口）</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Beautifull%20Apartament%20Laknas">Beautifull Apartament（核對訂單位置）</a></section><section id="al-practical"><h2>入住、票務與交通要點</h2><p>住宿名稱與日期按已提供預訂整理；公開搜尋可能有同名房源。停車入口、車位是否保留、提早入住及行李寄放以各自房東訊息為準，Google Maps搜尋結果不能代替訂單定位。</p><p>Onufri與Ethnographic：博物館中心官網列5/1–9/30 09:00–18:00，但夏季欄未明列星期一。9/20請住宿協助確認9/21；電話+355 32 232224。若星期一無法確認且週日15:30前抵達，改在9/20 15:45–16:45先看Onufri，King Mosque／Halveti移到9/21。</p><p>TIFF官網已公布2026節目。9/22 18:00 Kino Piramida：《The Proletariat’s Platini》，Arian Çuliqi，57分鐘，阿爾巴尼亞紀錄片。票價、英文字幕、入場與映後活動須購票前確認；不是已預約。</p><p>9/23以07:45到還車點、08:15–08:25進航廈為目標。這是待租車公司確認的新時間，不是已修改完成。汽油補至租約要求的歸還油量；若合約為同油量歸還，不必盲目加滿。</p><p>9/20車程是含過境及休息的規劃時窗，不是即時路況保證。導航優先正式鋪面幹道；Elbasan後經Cërrik／Belsh方向須按當日路況選路，雨天或小路不明時比較經Rrogozhinë／Lushnjë幹道方案，避免跟隨未鋪面捷徑。</p><a class="map" target="_blank" rel="noopener" href="https://muzeumet-berat.al/en/visit/">Berat博物館中心｜時段與票價</a><a class="map" target="_blank" rel="noopener" href="https://tiranafilmfest.org/program-2026/">TIFF 2026逐日節目</a><a class="map" target="_blank" rel="noopener" href="https://www.tirana-airport.com/en/article/1121/Important-Announcements-and-Info-for-Passengers">TIA出發提醒</a></section><section id="al-photo"><h2>必拍點｜Google Maps座標、方向與順光時間</h2><p>座標以公開地標位置為導航參考，精度依來源而異；P03借用Gorica Bridge作步行起點，不冒充已勘查的精確機位。各連結可直接開Google Maps；到場只在公開道路及開放步道取景。Lin半島遺址、Gorica Hill未取得可靠精確機位，不提供猜測座標。</p><p>順光＝太陽在攝影者背後；側光適合表現石材與住宅層次；朝太陽方向為逆光；藍調是日落後天空光。表列是依日期、地理方位推算的攝影建議，並非雲量預報或現場日照保證。Berat山丘可能提早遮住低角度太陽。</p><p>Astral天文計算（地平線無遮擋）：Berat 9/20日出06:25、日落18:40、民用暮光結束19:08；9/21日出06:26、日落18:39、暮光19:06。Lin 9/20日出06:22、日落18:38；Durrës 9/22日出06:29、日落18:39。時間取整分；拍建築暖光應比日落更早就位。</p><div class="tablewrap"><table><thead><tr><th>拍攝點</th><th>緯度,經度</th><th>站位／朝向</th><th>順光與側光建議（CEST）</th><th>本次使用</th></tr></thead><tbody><tr><td>P01 Lin湖村</td><td>41.06611,20.63861</td><td>村落定位；由公共湖岸取景，向西／西北拍住宅</td><td>09:20–10:30可獲順／側光；向東拍湖與對岸則多為逆光</td><td>9/20上午；遺址按現場標示上坡，不把此點當鑲嵌入口</td></tr><tr><td>P02 Gorica Bridge</td><td>40.703,19.944</td><td>橋體定位；移至南端公共河岸，向北／東北拍橋與山城</td><td>約09:00–11:00較順／側光；17:30後偏側逆光</td><td>9/20 17:35、9/21 06:35；清晨主打無人街景，非保證照亮白屋</td></tr><tr><td>P03 Mangalem千窗全景</td><td>40.703,19.944</td><td>以Gorica橋作導航起點，沿南岸向東找公開步道，鏡頭向北</td><td>10:00–15:00較順光；15:00–17:00側光；暮光不是順光</td><td>9/20 18:00–19:08；9/21午休前可補白牆順光。座標非精確腳架位</td></tr><tr><td>P04 King Mosque院落</td><td>40.7056,19.9521</td><td>清真寺定位；由南側可通行區朝北拍，室內依許可</td><td>10:00–14:00較順光；下午轉西／西南側取景可有側光</td><td>9/20 15:45；院落陰影依建築遮蔽，室內不依日落安排</td></tr><tr><td>P05 Berat Castle高處</td><td>40.708,19.945</td><td>城堡區定位，入內沿標示到開放觀景處，南向拍河谷</td><td>上午偏側光；11:00–14:00南向易逆光；下午西南光可側逆光</td><td>9/21 08:00–12:15；改向北／西拍城牆可得較順光</td></tr><tr><td>P06 Holy Trinity Church</td><td>40.70472,19.94667</td><td>教堂定位；上方合法步道取景，教堂與坡地同框</td><td>09:00–11:00以側光造型為主，是否順光取決於所站一側</td><td>9/21 10:00–10:40；禁止為構圖越過護欄</td></tr><tr><td>P07 Durrës考古博物館／近岸</td><td>41.311389,19.440278</td><td>館址定位；公共海濱朝西拍海，進館按攝影規定</td><td>09:00–11:00朝西海景較順光；午後對海漸轉逆光</td><td>9/22 10:30；海濱照片可在入館前花5分鐘完成</td></tr><tr><td>P08 Durrës Amphitheatre</td><td>41.31222,19.44500</td><td>遺址定位；南側獲准通道朝北拍橢圓觀眾席</td><td>10:00–12:30朝北較順光；地下通道光差大</td><td>9/22 11:50–12:45；避免正午強光過曝，畫面納入城市住宅</td></tr><tr><td>P09 Venetian Tower</td><td>41.3097,19.4470</td><td>塔樓定位；南側公共空間向北拍塔身</td><td>11:00–14:00較順光；換東西側可拍立體側光</td><td>9/22 12:45–13:20；不站車道，登塔非必要</td></tr><tr><td>P10 Tirana Pyramid</td><td>41.32306,19.82139</td><td>建築定位；片場入口另依票券標示</td><td>西側朝東拍立面，16:30–18:00較順／側光；入夜改拍照明</td><td>9/22 17:30進場前或19:15散場後；不為攝影遲到</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.06611%2C20.63861">P01 Lin湖村｜41.06611,20.63861</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944">P02 Gorica Bridge｜40.703,19.944</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944">P03 Mangalem千窗全景｜40.703,19.944</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.7056%2C19.9521">P04 King Mosque院落｜40.7056,19.9521</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.708%2C19.945">P05 Berat Castle高處｜40.708,19.945</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=40.70472%2C19.94667">P06 Holy Trinity Church｜40.70472,19.94667</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.311389%2C19.440278">P07 Durrës考古博物館／近岸｜41.311389,19.440278</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.31222%2C19.44500">P08 Durrës Amphitheatre｜41.31222,19.44500</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.3097%2C19.4470">P09 Venetian Tower｜41.3097,19.4470</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=41.32306%2C19.82139">P10 Tirana Pyramid｜41.32306,19.82139</a></section><section id="al-food"><h2>採買、點餐與口袋語句</h2><p>Berat兩晚採買：雞蛋、優格、白起司、麵包／byrek、番茄、小黃瓜、葡萄或無花果、飲水與堅果。選住宿附近營業中的SPAR、Big Market或小店，依實際位置與時間，不為連鎖品牌繞路。</p><p>9/22抵達Laknas前買齊隔天06:40早餐；不要假設清晨住宅區有早餐店。市場、停車、小館備ALL現金；刷卡前看幣別，歐元現付先問清匯率。</p><p>Faleminderit＝謝謝；Mirëdita＝日安；Ju lutem＝請；Faturën, ju lutem＝請給帳單。拍照先以手勢與簡單詢問取得同意，宗教場所穿著遮肩過膝。</p><p>可替換活動：Osumi Canyon須按業者確認的9月水況、路程與出團內容另排；不把泛舟、溯溪、tubing混成同一活動，也不保證半天下午能往返。這次完整Berat日優先保留文化主線。</p></section><section class="day" id="al20"><span class="tag">2026-09-20</span><h2>Ohrid → Lin → Berat｜湖岸與千窗黃昏</h2><p>07:30出發；Lin依過境時間取捨。下午入城後以步行為主，兩晚住Apartment Geart。</p><div class="slot" id="al20-border"><div class="time">07:00–09:10</div><div><h3>RUPE退房 → Qafë Thanë／Kjafasan</h3><p>07:00早餐裝車，07:30出發。08:10–09:10作過境時窗；依排隊調整。護照、駕照及國際駕照、車籍、租約、書面跨境許可與適用阿爾巴尼亞的車險放隨手處。</p><p><b>交通：</b>Ohrid北線經Struga方向至口岸；不再南下St. Naum。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Qafe%20Thane%20Border%20Crossing" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-border">導覽</a></div></div><div class="slot" id="al20-lin"><div class="time">09:20–10:35</div><div><h3>Lin湖村與早期基督教遺址</h3><p>停在村口合法車位，步行湖岸、石屋巷弄，再依標示上坡看遺址與半島。若遺址未開，保留村落及湖景，不等待。P01：41.06611,20.63861為村落定位。</p><p><b>費用：</b>遺址票價、停車費待現場確認；備ALL現金。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Lin%20Albania" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-lin">導覽</a></div></div><div class="slot" id="al20-drive"><div class="time">10:35–14:45</div><div><h3>Lin → Librazhd午餐 → Elbasan → Berat</h3><p>12:00–12:45簡餐、洗手間、補水；後段預留市鎮慢車與彎道。14:45是目標，延誤先刪下午小點。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Librazhd%20Albania" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-drive">導覽</a></div></div><div class="slot" id="al20-checkin"><div class="time">14:45–15:20</div><div><h3>Apartment Geart｜入住與停車</h3><p>放行李、換抓地鞋、帶水薄外套。取得房東停車指引；確認兩座博物館星期一營業及Lili等晚餐候選。若Onufri週一無法確認，啟用週日下午替換。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Apartment%20Geart%20Berat" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>住宿依既有預訂；餐廳與博物館確認尚待自行辦理。</p></div></div><div class="slot" id="al20-king"><div class="time">15:45–16:05</div><div><h3>King Mosque｜王者清真寺</h3><p>先看院落、柱廊與木作；入內須取得許可。P04：40.7056,19.9521。若下午先去Onufri，本點移9/21。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.7056%2C19.9521" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-king">導覽</a></div></div><div class="slot" id="al20-tekke"><div class="time">16:05–16:30</div><div><h3>Halveti Tekke｜蘇菲修行空間</h3><p>與King Mosque相鄰，依開門狀況看內部木雕、壁畫及住宅尺度的空間。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Halveti%20Tekke%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-tekke">導覽</a></div></div><div class="slot" id="al20-mangalem"><div class="time">16:30–17:35</div><div><h3>Mangalem｜千窗街區</h3><p>從下城沿公共巷道慢走，安排40–60分鐘坡道；不要走入私人院落。拍窗戶、突出上層、門廊與石板街。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mangalem%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-mangalem">導覽</a></div></div><div class="slot" id="al20-gorica"><div class="time">17:35–19:08</div><div><h3>Gorica Bridge → 南岸千窗黃昏</h3><p>17:35看橋，17:50沿南岸找公開站位。18:00前先拍仍有光的白屋；18:40日落，18:45–19:08拍亮窗與天空。P02／P03導航起點：40.703,19.944。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-gorica">導覽</a></div></div><div class="slot" id="al20-dinner"><div class="time">19:15–21:20</div><div><h3>傳統晚餐 → Bulevardi Republika xhiro</h3><p>Antigoni可作景觀晚餐候選；Lili或Tradita e Beratit可留明晚。20:45散步，補給早餐、飲水、水果。餐廳未代訂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bulevardi%20Republika%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al20-dinner">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Lin只走安全湖岸，取消濕滑遺址上坡；Berat改博物館或宗教建築（須開放），河岸短拍，不上Gorica Hill。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>10:00後過境Lin縮45分鐘，11:00後直接Berat。入住晚於16:00，刪宗教建築與部分巷弄，保留河岸黃昏、晚餐與休息。Onufri週一未確認且週日抵達早，先看Onufri再去河岸。</p></div></section><section class="day" id="al21"><span class="tag">2026-09-21</span><h2>Berat｜活城堡、聖像與住宅城市</h2><p>上午上城堡，下午博物館與午休，晚間河岸。Onufri／Ethnographic星期一以實際確認為前提；09:00–18:00為官網夏季時段。</p><div class="slot" id="al21-morning"><div class="time">06:35–07:45</div><div><h3>Gorica晨拍與早餐</h3><p>日出06:26，但山丘遮陽會延後直射光。06:35–07:15拍空橋、街道甦醒；07:15早餐。若疲累可直接07:15起床。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.703%2C19.944" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-morning">導覽</a></div></div><div class="slot" id="al21-castle"><div class="time">07:50–09:00</div><div><h3>計程車上山 → Berat Castle城牆與遺址</h3><p>07:50由住宿叫車到城堡入口附近，08:00開始戶外區；城門收費與可進時段依現場。先看城牆、Red Mosque與蓄水設施。P05：40.708,19.945為城堡區定位。</p><p><b>費用：</b>城堡可能另收門票；不包含於Onufri票的假設中。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Berat%20Castle" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-castle">導覽</a></div></div><div class="slot" id="al21-onufri"><div class="time">09:00–10:00</div><div><h3>Onufri Iconographic Museum｜聖像的閱讀方法</h3><p>以已確認星期一營業為前提；夏季官網09:00–18:00。一般票400 ALL；audio guide ticket列500 ALL，先確認是否含門票，不直接相加900。館內依官網禁一般攝影錄影。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Onufri%20Iconographic%20Museum%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzeumet-berat.al/en/onufri-iconographic-museum/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al21-onufri">導覽</a></div></div><div class="slot" id="al21-trinity"><div class="time">10:00–10:40</div><div><h3>Holy Trinity Church｜磚石與河谷</h3><p>沿開放步道到教堂周邊；外觀即值得。P06：40.70472,19.94667。上午以側光表現磚石和屋頂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=40.70472%2C19.94667" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-trinity">導覽</a></div></div><div class="slot" id="al21-kala"><div class="time">10:40–13:15</div><div><h3>Kala活城堡巷弄、觀景與午餐</h3><p>10:40–12:15慢走住宅與城牆，12:15在城堡內午餐。若早上已疲累，提早坐下，不再增加教堂。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kala%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-kala">導覽</a></div></div><div class="slot" id="al21-rest1"><div class="time">13:15–14:00</div><div><h3>下山與短休息</h3><p>返回下城補水；晴天且有餘力，可由Gorica南岸補拍Mangalem白牆順光，最多15分鐘。博物館營業未確認時依上午結果調整。</p></div></div><div class="slot" id="al21-ethno"><div class="time">14:00–14:50</div><div><h3>Ethnographic Museum｜走進傳統家庭</h3><p>開館已確認才入內；夏季官網09:00–18:00，300 ALL。看住宅格局、手工業與家庭生活；若關門改Mangalem住宅外觀導覽。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ethnographic%20Museum%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://muzeumet-berat.al/en/ethnographic-museum/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al21-ethno">導覽</a></div></div><div class="slot" id="al21-solomon"><div class="time">15:00–15:40</div><div><h3>Solomon Museum候選｜猶太社群與庇護</h3><p>先由住宿確認營業；未確認或閉館直接咖啡，不等待。之後15:40–16:40回住宿休息。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Solomon%20Museum%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-solomon">導覽</a></div></div><div class="slot" id="al21-mosques"><div class="time">16:50–17:30</div><div><h3>Bachelors’ Mosque、Lead Mosque與下城</h3><p>依體力選一至兩處外觀；若週日跳過King Mosque／Halveti，優先補那一組，不硬塞全部。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Bachelors%20Mosque%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-mosques">導覽</a></div></div><div class="slot" id="al21-sunset"><div class="time">17:35–19:06</div><div><h3>Gorica河岸｜第二次黃昏；山丘僅乾燥時選配</h3><p>預設河岸中長焦拍窗戶與屋頂。若選Gorica Hill，須白天確認合法路徑、天乾且體力足；18:30前下撤，不把日落後走山路當主線。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Gorica%20Bridge%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-sunset">導覽</a></div></div><div class="slot" id="al21-dinner"><div class="time">19:15–21:00</div><div><h3>Berat第二晚｜家庭料理與補給</h3><p>已訂到Lili再依時間赴約；否則Antigoni、Tradita e Beratit或住宿推薦。晚餐後準備9/22行李與早餐。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Home%20Made%20Food%20Lili%20Berat" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al21-dinner">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>計程車往返城堡，優先已開放室內館；取消城牆邊緣、Gorica Hill與陡巷。兩館若未開，改下城宗教建築、住宅外觀與咖啡，勿硬闖關閉古蹟。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>先刪Solomon、部分下城清真寺與山丘；保留城堡、已開放Onufri和休息。Osumi Canyon不併入本日，若另選業者活動須按完整接送時長替換文化行程，不能承諾13:30–18:00足夠。</p></div></section><section class="day" id="al22"><span class="tag">2026-09-22</span><h2>Durrës → Laknas → TIFF｜海港考古與當代電影</h2><p>白天Durrës，下午機場周邊住宿整理；TIFF採已公布18:00場次候選，優先提早返回。</p><div class="slot" id="al22-transfer"><div class="time">07:15–10:30</div><div><h3>Berat早餐、退房 → Durrës</h3><p>07:15早餐，07:45短散步可省；08:30出發，約10:30抵達。車停合法有人管理停車區，行李置於看不見處；貴重物隨身。</p><p><b>交通：</b>以主要鋪面道路北上；預留約2–2.5小時與市區停車。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Durres%20Archaeological%20Museum" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="al22-museum"><div class="time">10:30–11:45</div><div><h3>Durrës Archaeological Museum｜港口的物質世界</h3><p>2026/4/28重新開放已有報導；尚未取得可確認9/22的官方即時時段與票價。到門口先核對；關門立刻改遺址步行線。P07：41.311389,19.440278。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.311389%2C19.440278" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-museum">導覽</a></div></div><div class="slot" id="al22-amphi"><div class="time">11:50–12:45</div><div><h3>Roman Amphitheatre｜羅馬娛樂與基督教再利用</h3><p>沿城市街道步行前往，留45–55分鐘；含地下通道及小禮拜空間是否可入依現場。P08：41.31222,19.44500。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.31222%2C19.44500" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-amphi">導覽</a></div></div><div class="slot" id="al22-walls"><div class="time">12:45–13:20</div><div><h3>城牆與Venetian Tower｜海港防線</h3><p>一路步行看城牆與塔樓外觀。P09：41.3097,19.4470；若塔樓展示需排隊則略過。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.3097%2C19.4470" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-walls">導覽</a></div></div><div class="slot" id="al22-lunch"><div class="time">13:20–14:05</div><div><h3>海鮮午餐與海濱短走</h3><p>選菜單價格清楚的餐廳。可共享魚、沙拉、淡菜或小卷，14:05左右出發往Laknas。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Durres%20seaside" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-lunch">導覽</a></div></div><div class="slot" id="al22-laknas"><div class="time">14:05–16:30</div><div><h3>Durrës → Beautifull Apartament, Laknas</h3><p>約15:00–15:30入住，先整理行李、買9/23早餐，確認還車公司07:45接車及接駁。依租約補至所需油量；所有還車確認先完成，再決定影展。</p><p><b>交通：</b>約1–1.5小時加塞車彈性；Laknas不是Tirana市中心。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Beautifull%20Apartament%20Laknas" target="_blank" rel="noopener">Google Maps</a><p><b>預約：</b>提前安排雙程計程車；只列交通安排，未代叫車或更改還車預約。</p></div></div><div class="slot" id="al22-tiff"><div class="time">16:30–19:10</div><div><h3>計程車進城 → TIFF 18:00紀錄片候選</h3><p>16:30–16:45離開Laknas，目標17:30–17:40抵達Kino Piramida。18:00《The Proletariat’s Platini》／Arian Çuliqi／Albania 2026／57分鐘。按票券核對入口、字幕與入場；片長不含介紹或映後。</p><p><b>費用：</b>票價待確認；計程車以實際報價。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kino%20Piramida%20Tirana" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://tiranafilmfest.org/program-2026/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al22-tiff">導覽</a></div></div><div class="slot" id="al22-pyramid"><div class="time">19:10–21:15</div><div><h3>Pyramid外觀、最後晚餐與返回Laknas</h3><p>P10：41.32306,19.82139。散場短拍外觀，19:30左右晚餐；20:30–20:45搭預約車返回，21:15左右休息。若映後延誤，縮短晚餐／取消攝影。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=41.32306%2C19.82139" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-al22-pyramid">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>優先已開放考古博物館；競技場通道依現場安全開放。大雨縮短戶外牆段、海濱；Tirana直接車到場館，不登Pyramid。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>Durrës遲於14:30離開則先刪海濱與長午餐；16:30仍未處理好還車／行李就取消TIFF。考古館關門改競技場→城牆→塔樓，拜占庭Forum僅餘裕時外觀；不為未確認Durrës Fest演出延後入住。</p></div></section><section class="day" id="al23"><span class="tag">2026-09-23</span><h2>Laknas → TIA → Bucharest｜提前還車搭機</h2><p>07:10出發、07:45還車、08:25進航廈、11:35起飛。還車時間須租車公司確認；航班依個人訂位複核。</p><div class="slot" id="al23-depart"><div class="time">06:30–07:10</div><div><h3>Laknas早餐、最後檢查與出發</h3><p>06:30起床，06:40–07:00早餐，07:10出發。核對護照、手機、充電器、隨身液體及航空公司訂位；早餐前一晚買好。</p></div></div><div class="slot" id="al23-return"><div class="time">07:25–08:15</div><div><h3>依合約補油 → 07:45還車目標</h3><p>預約07:45，最遲08:00開始；不是08:45才驗車。實際還車點可能在航廈外，必須把接駁算入。若對方未同意早班接車，提前取得書面自助還車流程。</p><a class="guide-link" href="#guide-al23-return">導覽</a></div></div><div class="slot" id="al23-flight"><div class="time">08:15–11:35</div><div><h3>進入TIA航廈 → 托運、安檢 → OTP</h3><p>目標08:15–08:25進航廈；TIA官網建議至少提前3小時，11:35起飛對應08:35以前。依使用者提供為Ryanair TIA→OTP；實際航班、報到與登機截止時間以航空公司訂位為準。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Tirana%20International%20Airport" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.tirana-airport.com/en/article/1121/Important-Announcements-and-Info-for-Passengers" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-al23-flight">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>清晨下雨或道路擁塞時再提前出門；不在機場前額外採買。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>刪所有拍照與咖啡，先交車及接駁。若交車延誤，立即依租車公司已確認流程處理，不自行把車棄在未授權位置。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>Onufri一般票</td><td>400 ALL</td><td>人</td><td>官網頁面現列；星期一與當日狀況再確認</td></tr><tr><td>Onufri audio guide ticket</td><td>500 ALL</td><td>票</td><td>官網另列；確認是否含門票，勿直接加400</td></tr><tr><td>Ethnographic</td><td>300 ALL</td><td>人</td><td>官網頁面現列；開館再確認</td></tr><tr><td>Durrës兩處考古參觀</td><td>約1,000 ALL</td><td>人／預留</td><td>規劃額度，非已確認售價</td></tr><tr><td>Berat簡餐</td><td>800–1,500 ALL</td><td>人／餐</td><td>預算</td></tr><tr><td>Berat正式晚餐</td><td>1,500–2,500 ALL</td><td>人／餐</td><td>預算</td></tr><tr><td>Durrës海鮮午餐</td><td>1,500–2,500 ALL</td><td>人／餐</td><td>預算；整魚先確認重量</td></tr><tr><td>Lin／城堡／小館／停車</td><td>另備小額ALL</td><td>按現場</td><td>未確認，不能視為免費</td></tr><tr><td>TIFF與Laknas往返Tirana</td><td>按票務與計程車報價</td><td>兩人</td><td>未購票、未叫車</td></tr></tbody></table></div><p>兩人不含住宿、油費的總額會受餐廳、影展及計程車報價影響；不以未確認的單價拼出假精確總價。博物館官網現有價格為2026/9/19查閱，不等於當日營運保證。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-al20-border"><summary>RUPE退房 → Qafë Thanë／Kjafasan｜導覽</summary><h3>現場看什麼</h3><p>從湖盆逐漸爬向山口，留意道路如何避開陡坡，再把湖岸與西側內陸接起來。現代國境切過同一湖區，自然環境延續，行政、貨幣與招牌卻立刻轉換。</p><h3>歷史背景</h3><p>Ohrid湖區的自然與文化遺產跨越兩國，阿爾巴尼亞一側在2019年納入世界遺產範圍。Lin的早期基督教遺址提醒我們，湖岸的信仰、交易與聚落網絡早於今日國界。</p><h3>相關故事</h3><p>接下來往Librazhd、Elbasan的山谷，讓人容易理解Via Egnatia為何選擇可通行的走廊。古代道路運送的不只有軍隊，也包括陶器、貨幣、書信與思想；今日公路只是部分延續相近交通方向，不代表每段柏油下都是羅馬原路。</p><h3>實用提醒</h3><p>兩國此時都用UTC+2，不需調時鐘。進入Albania後用ALL／lek；導航預估不含邊檢。09:30前入境照常，10:00後Lin縮45分鐘，11:00後略過Lin。</p><a class="guide-return" href="#al20-border">回到行程</a></details><details class="guide-card" id="guide-al20-lin"><summary>Lin湖村與早期基督教遺址｜導覽</summary><h3>現場看什麼</h3><p>先在湖岸看屋舍、庭院、菜園和船，再上坡回望：狹長陸地伸進湖中，聚落沿能通行的岸線與坡度擴展。拍廣景時讓村屋與山體同框，才能表現半島尺度；近拍則找石牆、門框、屋瓦與湖水之間的材質差異。</p><p>遺址內先找平面界線、室內分區與鑲嵌邊框，再辨認鳥類、植物、葡萄藤及幾何紋。被覆蓋的區域是保護措施，不能自行揭開。</p><h3>歷史背景</h3><p>山上的早期基督教教堂及鑲嵌約屬6世紀，見證晚期古代湖岸社群。這與湖中更早的史前樁上聚落是不同年代、不同性質的遺址，不能把眼前教堂說成數千年前的水上村落。</p><p>教堂裝飾沿用古典世界熟悉的自然圖像，又放入新的禮拜空間。建築與圖像的改變，反映宗教制度逐漸成為地方公共生活的重要力量。</p><h3>相關故事</h3><p>葡萄、鳥與植物可以帶出豐饒、生命與天堂的聯想，但不能看到每隻鳥就斷言特定經文。比較有意思的看法是：工匠如何用小石塊的色差做出葉片、羽毛與曲線？在限制很大的材料中，節奏與輪廓比逼真透視更重要。</p><h3>實用提醒</h3><p>09:20朝東湖面可能逆光；改向西拍被晨光照亮的住宅，或保留亮水剪影。上坡約需另留步行時間；雨天只走村內平坦路段。遺址開放與鑲嵌揭示範圍以管理員為準，未核實固定營業時間。</p><a class="guide-return" href="#al20-lin">回到行程</a></details><details class="guide-card" id="guide-al20-drive"><summary>Lin → Librazhd午餐 → Elbasan → Berat｜導覽</summary><h3>現場看什麼</h3><p>觀察湖盆如何收束成山口，再進入Shkumbin流域的交通走廊。道路、河流和聚落常爭取同一片有限平地，這比行政地圖更能解釋城鎮的位置。</p><h3>歷史背景</h3><p>Via Egnatia把亞得里亞海港口與巴爾幹內陸連接，Durrës是其西端的重要門戶之一。Elbasan一帶延續了古代交通節點的功能；本段與9/22海港參觀，可以串成一條從湖區回到地中海的歷史路線。</p><h3>相關故事</h3><p>午餐點byrek、qofte、烤雞、番茄沙拉或dhallë。byrek薄麵皮包餡容易攜帶，dhallë是偏鹹的優格飲；這些食物適合交通城鎮的工作日節奏，不必每餐都吃正式宴席。</p><h3>實用提醒</h3><p>駕駛不飲酒。依現場導航比較主要鋪面道路，Cërrik方向不可盲從狹窄捷徑；下雨時寧可多留幹道時間。</p><a class="guide-return" href="#al20-drive">回到行程</a></details><details class="guide-card" id="guide-al20-king"><summary>King Mosque｜王者清真寺｜導覽</summary><h3>現場看什麼</h3><p>由院落看門廊如何連接街道與禮拜空間。進入後找mihrab壁龕所指的禮拜方向，以及minbar講壇的位置；再抬頭觀察木構與裝飾，而非只拍宣禮塔。</p><p>把視線從大構件移到細部：柱子承托、窗戶引光、天花的重複幾何，分別處理承重、採光與精神秩序。</p><h3>歷史背景</h3><p>這座清真寺與15世紀末鄂圖曼統治的城市建設有關，後來經破壞、重建與修繕。現今看到的材料並非全部出自最初年代，建築的延續更多體現在場所與社群功能。</p><h3>相關故事</h3><p>「King／Sultan」名稱把捐建權力帶進地方地景。清真寺周圍常與教育、商業、供水、慈善生活相連，捐助公共設施既是信仰實踐，也能建立統治者與地方社會的關係。</p><h3>實用提醒</h3><p>男女均遮肩過膝；依指示脫鞋。避開禮拜，不穿越祈禱者前方。庭院可拍不等於室內可拍；先詢問，別為開門等待壓縮河岸黃昏。</p><a class="guide-return" href="#al20-king">回到行程</a></details><details class="guide-card" id="guide-al20-tekke"><summary>Halveti Tekke｜蘇菲修行空間｜導覽</summary><h3>現場看什麼</h3><p>比較剛才的清真寺：Tekke更像聚會、教學與修行的場所。若獲准進入，從門檻、座位與房間關係辨認集體活動空間，再看天花木雕和植物裝飾。</p><p>拍攝時讓門框包住室內，能表現由城市街道走進安靜空間的轉換；不要只把繁複天花裁成失去建築尺度的圖案。</p><h3>歷史背景</h3><p>Halveti是蘇菲傳統中的一支。蘇菲修行強調精神教導、師徒傳承與內在修養，Tekke則是相關社群的聚集場所。阿爾巴尼亞另有Bektashi等傳統；兩者不能因都屬蘇菲文化就混為同一教團。</p><h3>相關故事</h3><p>「隱修／退修」是理解Halveti名稱與修行精神的線索。安靜的空間、反覆的祈禱與集體儀式可以形成社群認同，但不是每個現存房間都每天舉行儀式；應區分建築的歷史功能與今日管理方式。</p><h3>實用提醒</h3><p>服裝端莊、安靜詢問。無管理員或正在宗教活動時只看外觀，不自行推門。室內散射光往往比強烈直射光更適合木雕細節。</p><a class="guide-return" href="#al20-tekke">回到行程</a></details><details class="guide-card" id="guide-al20-mangalem"><summary>Mangalem｜千窗街區｜導覽</summary><h3>現場看什麼</h3><p>先從低處看一整面坡：下層房屋的屋頂，成為上層房屋窗前的視野。再進入巷子，注意地基如何咬合岩坡、石階如何解決高差、窗與門如何避開對望。</p><p>下層較封閉的石構適合儲物與防護，上層較輕的木構、灰泥與成排窗戶增加光線和生活面積。突出上層讓狹小基地向空中擴展，但也需要木作技術與持續維修。</p><h3>歷史背景</h3><p>Berat的山頂Kala、坡地Mangalem及河對岸Gorica共同構成歷史城市。大量18、19世紀住宅保留鄂圖曼—巴爾幹城市生活的痕跡；世界遺產價值來自整體街區、地形與生活延續，不是只有某一棟最漂亮的白屋。</p><h3>相關故事</h3><p>「千窗」是形容層疊立面造成的視覺印象，不是戶籍式窗數統計。富裕家庭的接待空間、裝飾木作與窗戶比例，也會把社會身分寫在住宅外觀上。白牆看似整齊，其實每戶仍有修補、擴建和使用上的差異。</p><h3>實用提醒</h3><p>下午巷內陰影多，曝光以白牆保留紋理為準。手機2倍或中焦可壓縮窗戶層次；不要把相機伸進開窗住宅。雨天石板很滑，減少上下折返。</p><a class="guide-return" href="#al20-mangalem">回到行程</a></details><details class="guide-card" id="guide-al20-gorica"><summary>Gorica Bridge → 南岸千窗黃昏｜導覽</summary><h3>現場看什麼</h3><p>橋的弧線把南岸住宅區與北岸山城接起來。先拍橋拱、河流及城堡的全景，再用中焦拍住宅的重複窗格。若河水流量小或水面被風吹皺，改用橋面行人與岸線構圖，不必執著完美倒影。</p><p>站在南岸向北看，可以讀出一張城市剖面：山頂防禦、山坡住宅、河岸交通，再到平地的新城。</p><h3>歷史背景</h3><p>Gorica Bridge的歷史與鄂圖曼時代的跨河通行相關，橋體經後世修復與重建。橋不只是觀景台，也服務每天過河工作、購物與探親的居民。Gorica與Mangalem的宗教社群歷史不同，但生活往來並不能簡化成固定不變的兩個世界。</p><h3>相關故事</h3><p>黃昏時白牆的反差降低，窗內燈光讓建築重新呈現家庭生活。拍攝的主角由整齊立面轉為人與房子的關係：亮起的一盞燈、開著的窗、走過橋的人，都能讓照片超越建築明信片。</p><h3>實用提醒</h3><p>向北拍Mangalem，10:00–15:00較容易順光；晚間是側光／藍調，不應標為順光。山勢可能在18:40前遮陽。腳架不擋橋，手機夜景模式靠穩欄杆但不探出河岸。</p><a class="guide-return" href="#al20-gorica">回到行程</a></details><details class="guide-card" id="guide-al20-dinner"><summary>傳統晚餐 → Bulevardi Republika xhiro｜導覽</summary><h3>現場看什麼</h3><p>兩人共享tavë kosi、pispili或蔬菜料理、沙拉與橄欖即可，不必一次點完所有地方菜。tavë kosi是羊肉配優格、蛋的焗烤；pispili常以玉米麵與綠葉蔬菜製作，家庭版本不盡相同。</p><h3>歷史背景</h3><p>河谷適合蔬菜、水果、葡萄與橄欖，山區牧業提供羊肉與乳製品。這些食材在Berat餐桌上相遇，能比「哪一國發明某道菜」更具體地說明地方環境。</p><h3>相關故事</h3><p>gliko是一小份糖漬水果，常搭水或咖啡招待客人。xhiro則是晚間散步：人們出門遇熟人、聊天、讓孩子活動，路線可能反覆經過同一段大道。這種社交的目的不一定是購物或抵達某處。</p><h3>實用提醒</h3><p>先問當日有什麼家常菜與份量。若主人提供raki，可以禮貌婉拒；駕駛不喝。超市別等到21:20才假設仍開門，遇到合適店家先買隔日早餐。</p><a class="guide-return" href="#al20-dinner">回到行程</a></details><details class="guide-card" id="guide-al21-morning"><summary>Gorica晨拍與早餐｜導覽</summary><h3>現場看什麼</h3><p>與前晚比較相同的河岸：清晨主角是搬貨、開店、過橋與買早餐的人。用一張廣角交代環境，再用中焦拍人的活動與門窗關係，不必等待街道完全無人。</p><h3>歷史背景</h3><p>活的歷史街區既需要保存，也需要水電、運輸與工作機會。觀光照片常把現代生活裁掉，但居民的日常才說明Berat為何仍是一座城市。</p><h3>相關故事</h3><p>白屋不一定在日出瞬間變金色；山丘可能仍投下大片陰影。此時柔和天空光反而容易保留牆面細節，用畫面氣氛取代對金色光線的期待。</p><h3>實用提醒</h3><p>P02與P03沿用前晚定位。不要為追晨光翻牆或走到河床。早餐可買byrek、優格、水果；上城堡前帶水、帽與有抓地力的鞋。</p><a class="guide-return" href="#al21-morning">回到行程</a></details><details class="guide-card" id="guide-al21-castle"><summary>計程車上山 → Berat Castle城牆與遺址｜導覽</summary><h3>現場看什麼</h3><p>先看主入口的轉折、牆厚與坡度，想像進城的人流如何被放慢、觀察和控制。再找Red Mosque殘存結構與蓄水設施：軍事防禦不只是高牆，也需要水、糧食、燃料與可維修的通道。</p><p>在觀景處把河谷、橋與道路連起來：城堡控制高地，居民和商業則在河岸與坡地下方發展。不同方向的牆面、補砌材料與門洞，提示它不是單次建成的完整作品。</p><h3>歷史背景</h3><p>城堡所在地長期被利用，今天可見的防禦、教堂與住宅包含中世紀及後來多個階段。鄂圖曼時代增添清真寺與行政軍事需求，但原有基督教社群與教堂生活仍有延續。</p><h3>相關故事</h3><p>Red Mosque遺址打破「城堡一定是純東正教區」的簡化印象。蓄水池則提供另一條讀史線索：圍城時最先成為問題的可能是飲水，而不是城牆是否夠雄偉。從實用設施理解歷史，往往比記住戰役年份更有感。</p><h3>實用提醒</h3><p>選計程車上山、步行下山可減少停車與會車壓力；費用先詢價。各城牆、台階開放不同，不跨封鎖線。08:00若入口未開，先在合法外圍等候或早餐，不自行闖入。</p><a class="guide-return" href="#al21-castle">回到行程</a></details><details class="guide-card" id="guide-al21-onufri"><summary>Onufri Iconographic Museum｜聖像的閱讀方法｜導覽</summary><h3>現場看什麼</h3><p>進入原聖母安息教堂後，先用幾分鐘理解空間：信徒區與祭壇區之間的聖像屏、燭台、木雕與出入口共同服務禮拜，不是一幅幅彼此無關的展品。再選三件作品慢看：基督或聖母、敘事場景、較晚期聖像。</p><p>閱讀順序可由臉部、手勢、衣褶到背景。金色弱化日常時間與空間；正面凝視建立信徒與神聖人物的關係；人物身旁的文字、物件與手勢則協助辨認身分。不要只用「畫得像不像真人」評價它。</p><h3>歷史背景</h3><p>Onufri是16世紀重要聖像畫家，作品在既有拜占庭圖像規範中呈現強烈色彩與表情。館藏跨多個世紀與不同畫家，能看出傳承和改變，而不是一間全部由Onufri親手創作的個人展。</p><p>1807年的木雕聖像屏把繁密裝飾與宗教圖像結合；看葡萄藤、葉片、鳥獸或幾何如何引導眼睛，再看主要人物所占的位置。</p><h3>相關故事</h3><p>「Onufri紅」是理解其色彩風格的入口，卻不必相信每種鮮紅都來自失傳祕方。更值得比較的是紅色如何和金色、暗背景、膚色互相襯托，讓衣褶和人物更有情緒。</p><p>Berat抄本的故事連接教堂與文字保存。紫色、金色抄本曾與此城宗教機構密切相關；展板提及的抄本不等於原件就在眼前，先看標籤區分原件、複製與說明。</p><h3>實用提醒</h3><p>預留約55–60分鐘。關掉快門與提示音，遵守禁止攝影；用筆記記下作品名稱更實用。若週日已看完，這一小時改給Kala住宅、城牆與教堂，無須重買票。</p><a class="guide-return" href="#al21-onufri">回到行程</a></details><details class="guide-card" id="guide-al21-trinity"><summary>Holy Trinity Church｜磚石與河谷｜導覽</summary><h3>現場看什麼</h3><p>從稍高、可合法停留的步道先拍教堂與坡地，再靠近看磚與石的交替、拱券、鼓座和屋頂。高差使基座、牆面與天空形成不同層次，建築與地形的關係比單一正面照更鮮明。</p><p>若開門，先讓眼睛適應暗處；依現場規定看圖像，別以手機補光燈照壁畫。</p><h3>歷史背景</h3><p>Holy Trinity是Berat城堡中世紀東正教建築的重要例子。磚石混用同時有結構與裝飾效果，與巴爾幹拜占庭建築的工匠傳統相連。城堡不是只留下軍事設施，也容納日常宗教生活。</p><h3>相關故事</h3><p>從遠處看教堂很小，近看卻能發現屋頂、牆面與不同高度的量體層層組合。這種小建築也能建立莊重感的方式，來自比例與位置，不一定靠巨大尺寸。</p><h3>實用提醒</h3><p>不為同框河谷越過護欄。教堂本身與河谷方向不同，09:00–11:00只能說常有側光，不能保證每一面都順光。入口是否開放由現場管理決定。</p><a class="guide-return" href="#al21-trinity">回到行程</a></details><details class="guide-card" id="guide-al21-kala"><summary>Kala活城堡巷弄、觀景與午餐｜導覽</summary><h3>現場看什麼</h3><p>沿公共巷道觀察房門、院牆、葡萄棚、菜園與小店。石板、門檻及房屋高差展示如何在不規則地形中使用每一塊土地。不要把所有通道都當遊客環線，有些路只通住家。</p><h3>歷史背景</h3><p>城堡的歷史延續不只是建築材料保存，也來自仍居住其中的人。住宅逐代改修、餐館與旅宿進入，帶來生計，也改變原有社區；「活城堡」因此同時是一種吸引力與保護難題。</p><h3>相關故事</h3><p>用「誰住在這裡，怎麼買菜、搬重物、修屋頂？」代替只找最古老的石頭，會發現城市的另一種尺度。晾衣與停車雖不一定符合明信片，卻是生活必需。</p><h3>實用提醒</h3><p>拍人像先詢問、讓居民車輛通行。午餐可用蔬菜派、釀甜椒、湯與沙拉平衡晚餐羊肉；先確認當日供應和份量。13:15後步行下城，濕滑時改搭車。</p><a class="guide-return" href="#al21-kala">回到行程</a></details><details class="guide-card" id="guide-al21-ethno"><summary>Ethnographic Museum｜走進傳統家庭｜導覽</summary><h3>現場看什麼</h3><p>先把房子當展品：樓層怎樣分工，通風與採光從哪裡來，哪些房間面向客人，哪些處理家庭勞作？再看織機、農具、器皿與衣物，想像它們原本被誰、在何時使用。</p><p>開放木廊chardak連接室內外；暖季可工作、休息與聚會。客房較精緻的天花、壁爐、坐墊與櫃子，則展現待客所需的秩序與體面。</p><h3>歷史背景</h3><p>傳統家庭既消費也生產：食物保存、紡織、修補和工具使用都可能發生在家中。館內的市集與手工藝展示，把家庭與城鎮交易連接起來；住宅不是孤立的民俗物件。</p><h3>相關故事</h3><p>可選一件小物深入看：腰扣與刺繡表現穿戴者身分，銅製火盆回應冬季取暖，榨油器連接周邊橄欖種植。物品旁的磨痕往往比裝飾更能說明日常使用。</p><h3>實用提醒</h3><p>約40–50分鐘即可完整看格局；依館方攝影規範，勿坐展示家具。若想比較上午Onufri，可想「宗教空間如何接待神聖，家庭空間如何接待客人」，但不要把兩者功能混同。</p><a class="guide-return" href="#al21-ethno">回到行程</a></details><details class="guide-card" id="guide-al21-solomon"><summary>Solomon Museum候選｜猶太社群與庇護｜導覽</summary><h3>現場看什麼</h3><p>小館適合讀人物、家庭、地名與具體事件，而非快速看完展板標題。若有照片、信件或見證，分辨哪些是當事人記錄，哪些是後來的回憶與紀念敘事。</p><h3>歷史背景</h3><p>館舍以Berat猶太社群及二戰期間的庇護故事為主題。阿爾巴尼亞的公共記憶常把救援行動與besa相連：承諾、保護受託者和待客責任。</p><h3>相關故事</h3><p>最值得記住的是具體家庭如何提供藏身、食物或身分掩護，以及這些選擇帶來什麼風險。besa能幫助理解道德語言，但不應把每個人的行動都歸結成天生的民族性格；歷史是個人在特定情境下的選擇。</p><h3>實用提醒</h3><p>私人小館的時間與票價待確認；不保證隨到隨開。不拍可辨識個人資料的展件特寫，是否可攝影先問管理員。</p><a class="guide-return" href="#al21-solomon">回到行程</a></details><details class="guide-card" id="guide-al21-mosques"><summary>Bachelors’ Mosque、Lead Mosque與下城｜導覽</summary><h3>現場看什麼</h3><p>Bachelors’ Mosque從名稱即可聯想到城市青年與工匠社群；看外牆裝飾、街面入口與周邊商業的關係。Lead Mosque則注意屋頂、量體及院落，比較兩座建築在城市中占據的位置。</p><h3>歷史背景</h3><p>地方宗教建築可能由統治者、富商或特定社群支持。名稱、規模與材料因此反映不同資源網絡；鉛材屋頂也涉及成本、耐候與維護，不能只當外觀色彩。</p><h3>相關故事</h3><p>把今天看過的城堡教堂、下城清真寺與Tekke放在同一張心中地圖，就能看見不同社群如何共享河谷城市。這種並存不代表歷史從無衝突，也不等於每一區自古只住一種宗教人口。</p><h3>實用提醒</h3><p>依現場開放與禮拜情況參觀；外觀足以完成比較。17:30前收尾，別為湊景點在下城來回急走。</p><a class="guide-return" href="#al21-mosques">回到行程</a></details><details class="guide-card" id="guide-al21-sunset"><summary>Gorica河岸｜第二次黃昏；山丘僅乾燥時選配｜導覽</summary><h3>現場看什麼</h3><p>第一晚已完成大景，今晚找較小的畫面：一列亮窗、橋上人物、白牆與紅瓦、老屋與新樓接壤處。固定一個構圖等光線變化，比不停換點更容易看到時間如何改變城市。</p><h3>歷史背景</h3><p>Gorica高處能展現河谷，但遠景也讓居民生活變得抽象。河岸視角能把交通、住宅與人放在一起，兩者是不同閱讀方式，不是越高越好。</p><h3>相關故事</h3><p>同一扇窗在白天是建築比例，黃昏變成光點，夜裡則可能透露一個家庭正在用餐。保持距離，只拍城市整體，不把可辨識的室內生活當題材。</p><h3>實用提醒</h3><p>9/21日落18:39、暮光19:06。河岸穩定取景即可。山丘坡道若濕滑、未確認路線或沒有照明，就取消；不提供未查證的精確登山機位。</p><a class="guide-return" href="#al21-sunset">回到行程</a></details><details class="guide-card" id="guide-al21-dinner"><summary>Berat第二晚｜家庭料理與補給｜導覽</summary><h3>現場看什麼</h3><p>這餐補上前晚沒吃到的家常菜：釀甜椒、pispili、qofte或tavë kosi擇其一兩道。gliko少量收尾；不喜歡葡萄葉包飯就不用為打卡硬點japrak。</p><h3>歷史背景</h3><p>家庭餐館常依採買與
