與內陸聚落；不要期待 Kotor 式海岸老城。</p><h3>歷史背景</h3><p>Bijelo Polje 意為白色田野；此區屬黑山北部內陸生活圈。</p><h3>相關故事</h3><p>烤肉、麵餅、優格與濃咖啡適合短暫補給。</p><a class="guide-return" href="#ks14-rest">回到行程</a></details><details class="guide-card" id="guide-ks14-lunch"><summary>Rožaje 簡單午餐｜導覽</summary><h3>現場看什麼</h3><p>山城的清真寺、商店與森林邊緣聚落。</p><h3>歷史背景</h3><p>Rožaje 位於黑山內陸、多社群文化交會區，與海岸型 Montenegro 風貌不同。</p><h3>相關故事</h3><p>Burek 配優格是一份日常正餐，適合跨境日快速吃飽。</p><a class="guide-return" href="#ks14-lunch">回到行程</a></details><details class="guide-card" id="guide-ks14-border"><summary>Kula／Kullë → Peja｜導覽</summary><h3>現場看什麼</h3><p>從高地下降到西 Kosovo 較寬闊的平原，城市背後山牆仍十分突出。</p><h3>歷史背景</h3><p>Peja／Peć 位在山區產品交易、宗教中心與現代戶外旅遊三種網絡的交會處。</p><h3>相關故事</h3><p>沿途海外車牌、新住宅與咖啡館，可作觀察移民及返鄉經濟的線索，不能由單棟房屋外觀斷定其資金來源。</p><a class="guide-return" href="#ks14-border">回到行程</a></details><details class="guide-card" id="guide-ks14-peja"><summary>Peja 採買＋老城短走｜導覽</summary><h3>現場看什麼</h3><p>店舖、金工、食品與咖啡館共同構成生活巴扎；可順看 Bajrakli Mosque 外觀、Haxhi Zeka Mill 周邊。</p><h3>歷史背景</h3><p>巴扎是鄂圖曼城市經濟與社交核心，不等於觀光夜市。Peja 老城經戰爭破壞及重建，今天仍服務居民。</p><h3>相關故事</h3><p>Qebapa 配洋蔥麵包、pite 餡餅與 flia 都可嘗試。Flia 需反覆分層烘烤，未必隨點隨有；起司較鹹，配蔬菜與麵包。</p><h3>實用提醒</h3><p>晚到先保留採買，省略老城；不要入住山區後再為巴扎折返。</p><a class="guide-return" href="#ks14-peja">回到行程</a></details><details class="guide-card" id="guide-ks14-patriarchate"><summary>Patriarchate of Peć｜佩奇宗主教修道院｜導覽</summary><h3>現場看什麼</h3><p>相連教堂、圓頂、紅色外牆與不同年代壁畫；先看建築如何逐步擴建，再看室內圖像層次。</p><h3>歷史背景</h3><p>13 世紀起的教堂群是塞爾維亞東正教的重要宗教中心，後續擴建保留多期藝術。它同時是 UNESCO 遺產與持續使用的信仰空間。</p><h3>相關故事</h3><p>下層聖人、中層故事、高處圓頂的天界形象，可作初步閱讀圖像的線索，但不是每面牆都遵循同一配置。</p><h3>實用提醒</h3><p>先詢問攝影；不碰壁畫、聖像與祭壇屏風，禮拜時安靜站後方。</p><a class="guide-return" href="#ks14-patriarchate">回到行程</a></details><details class="guide-card" id="guide-ks14-canyon"><summary>Rugova Canyon → Chalet Kujta｜導覽</summary><h3>現場看什麼</h3><p>用河流作引導線，讓岩壁、公路與橋梁入鏡；人物可以表現峽谷尺度。</p><h3>歷史背景</h3><p>Lumbardhi i Pejës 河切入石灰岩山地，公路與河流共享狹窄谷底，岩壁裂隙及洞口可讀出水蝕作用。</p><h3>相關故事</h3><p>岩壁上的鋼索和踏點預告隔日活動；峽谷也連接山區牧業、森林與乳製品生活。</p><h3>實用提醒</h3><p>深峽谷可能提早遮光，不能保證日落前固定45分鐘仍有直射光。</p><a class="guide-return" href="#ks14-canyon">回到行程</a></details><details class="guide-card" id="guide-ks14-hotel"><summary>Hotel Chalet Kujta Apartment 入住｜導覽</summary><h3>現場看什麼</h3><p>山區木屋、林地與牧業景觀；晚上適合休息。</p><h3>歷史背景</h3><p>Rugova 的山地旅遊與乳製品文化延續了山村和 Peja 平原間的交流。</p><h3>相關故事</h3><p>晚餐可問 qebapa、pite、flia 或當日湯品；不為必吃清單夜駕往返市區。</p><h3>實用提醒</h3><p>手機、行動電源充好；快乾長褲、抓地鞋、防風層、飲水與貴重物品整理在隨身包。</p><a class="guide-return" href="#ks14-hotel">回到行程</a></details><details class="guide-card" id="guide-ks15-ferrata"><summary>BNA Via Ferrata｜Ari／Shpellat 待確認｜導覽</summary><h3>現場看什麼</h3><p>在安全停靠點觀察水蝕裂隙、洞口、河谷與稀疏岩壁植被。把手機收好，不在移動或換鉤時自拍。</p><h3>歷史背景</h3><p>Via ferrata 是有固定鋼索、鐵踏點與梯子的岩壁路線；仍有墜落風險，需合適裝備及嚮導指導。Mat、Ari、Shpellat、Marimangat 的難度與特徵不同。</p><h3>相關故事</h3><p>原始選 Mat 的理由是保留體力；施工時應保留「適合能力」這個原則，而非直接升級難線。BNA 對首次參加 Shpellat 持較審慎建議。</p><h3>實用提醒</h3><p>穿戴與連接依嚮導示範及裝備規範；一次只移一鉤，保持保護與間距。用腿踩穩、少以手臂硬拉，出現恐懼或疲勞立即告知嚮導。</p><a class="guide-return" href="#ks15-ferrata">回到行程</a></details><details class="guide-card" id="guide-ks15-zip"><summary>Rugova Zipline｜導覽</summary><h3>現場看什麼</h3><p>橫越時看河谷寬窄、公路與崖壁比例，不只拍自拍影片。</p><h3>歷史背景</h3><p>Zipline 與攀岩、健行等活動共同形成現代 Rugova 戶外旅遊。</p><h3>相關故事</h3><p>Via Ferrata 是慢速閱讀岩壁，Zipline 是快速感受谷地尺度；時間不足保留已預約核心。</p><h3>實用提醒</h3><p>聽從工作人員指令，出發前核對起終點與回到車輛方式。</p><a class="guide-return" href="#ks15-zip">回到行程</a></details><details class="guide-card" id="guide-ks15-decani"><summary>Visoki Dečani Monastery｜導覽</summary><h3>現場看什麼</h3><p>先看不同色調石材的水平層次、雕刻門窗與東方圓頂；進入後讓眼睛適應暗處，再看聖經敘事、王朝人物與最後審判主題。</p><h3>歷史背景</h3><p>14世紀國王 Stefan Dečanski 的修道院與陵墓，融合羅馬式雕刻、哥德元素和拜占庭空間及壁畫，展示亞得里亞海工匠與內陸王權的交流。</p><h3>相關故事</h3><p>壁畫不只裝飾，也是信仰、王權與歷史的圖像系統。修道院仍有祈禱、農業與工藝生活，蜂蜜、起司、酒與聖像商店延續勞動傳統。</p><h3>實用提醒</h3><p>帶護照、預留入口查驗；遮肩過膝，內部拍照先問。勿拍警衛特寫或以政治話題打趣。</p><a class="guide-return" href="#ks15-decani">回到行程</a></details><details class="guide-card" id="guide-ks15-gjakova"><summary>Gjakova Old Bazaar｜選配｜導覽</summary><h3>現場看什麼</h3><p>木造店面、庭院、金工與咖啡館；看Hadum Mosque與市場的空間關係。</p><h3>歷史背景</h3><p>Gjakova 巴扎曾是重要手工業街區，1999年戰爭重創後重建。</p><h3>相關故事</h3><p>值得看的是商業、戰爭與文化重建如何疊在一條街，不只是漂亮木屋。</p><h3>實用提醒</h3><p>這是備選，不犧牲Prizren第一晚。</p><a class="guide-return" href="#ks15-gjakova">回到行程</a></details><details class="guide-card" id="guide-ks15-river"><summary>League 外觀 → Marash 河岸｜導覽</summary><h3>現場看什麼</h3><p>水岸樹蔭、山坡住宅與堡壘的相對位置。</p><h3>歷史背景</h3><p>Prizren 位在 Sharr 山麓，河流連結平原與山地；Marash 是老城重要休憩地帶。</p><h3>相關故事</h3><p>清真寺、學校、商業與政治活動並非分開世界，聯盟建築群正反映這些網絡的交會。</p><a class="guide-return" href="#ks15-river">回到行程</a></details><details class="guide-card" id="guide-ks15-blue"><summary>Sinan Pasha Mosque → Shadërvan → Stone Bridge｜導覽</summary><h3>現場看什麼</h3><p>從河岸斜角讓橋拱、清真寺與山坡同框；加入行人增加生活感。</p><h3>歷史背景</h3><p>石橋是鄂圖曼老城跨河交通的一部分，曾受損重建。Shadërvan 的噴泉兼具供水、辨識與社交意義。</p><h3>相關故事</h3><p>藍調以日落後約10–25分鐘作攝影經驗值，實際受雲量、山勢與亮燈影響；橋正中央不一定是最好角度。</p><h3>實用提醒</h3><p>人像先取得同意；沿合法步道拍攝，不為低角度走入河道。</p><a class="guide-return" href="#ks15-blue">回到行程</a></details><details class="guide-card" id="guide-ks15-dinner"><summary>老城晚餐｜導覽</summary><h3>現場看什麼</h3><p>看家庭、朋友與情侶反覆沿河散步，廣場是社交空間。</p><h3>歷史背景</h3><p>Prizren同時保存東正教、天主教、伊斯蘭與阿爾巴尼亞民族運動的城市記憶。</p><h3>相關故事</h3><p>咖啡館不必急著喝完離開；Kosovo macchiato常比義式版本更奶、更像一杯慢慢聊的咖啡。</p><a class="guide-return" href="#ks15-dinner">回到行程</a></details><details class="guide-card" id="guide-ks16-dawn"><summary>清晨 Stone Bridge → Shadërvan → Marash｜導覽</summary><h3>現場看什麼</h3><p>清晨低角度光、山坡層次、清掃街道與居民的日常。</p><h3>歷史背景</h3><p>石橋、河流、堡壘構成Prizren最容易閱讀的城市骨架。</p><h3>相關故事</h3><p>不用一直等待完全無人的空景；經同意拍到日常人物，常比明信片式照片更有城市感。</p><h3>實用提醒</h3><p>9月清晨光線受地形影響；06:45是出門窗，不保證那一刻已順光。</p><a class="guide-return" href="#ks16-dawn">回到行程</a></details><details class="guide-card" id="guide-ks16-league"><summary>Albanian League of Prizren Museum｜導覽</summary><h3>現場看什麼</h3><p>先讀1878年與人物／地圖，再看建築群如何結合宗教、教育與政治空間。</p><h3>歷史背景</h3><p>1877–1878俄土戰爭後，巴爾幹領土重劃。1878年6月10日Prizren的集會最初重在領土防衛，後來發展阿爾巴尼亞自治與民族政治訴求。</p><h3>相關故事</h3><p>不要把它簡化成2008年Kosovo獨立博物館：它處理的是更早、跨今日國界的阿爾巴尼亞民族形成。讀展板時把地方、宗教、帝國與民族四種身份分開思考。</p><h3>實用提醒</h3><p>展覽多從阿爾巴尼亞民族史出發；比較地圖年代與用詞，比單純背英雄姓名更有收穫。</p><a class="guide-return" href="#ks16-league">回到行程</a></details><details class="guide-card" id="guide-ks16-hamam"><summary>Gazi Mehmet Pasha Hamam｜導覽</summary><h3>現場看什麼</h3><p>多個大小圓頂對應更衣、溫浴、熱浴等空間；屋頂小孔引光並維持隱私。</p><h3>歷史背景</h3><p>16世紀鄂圖曼公共浴室屬男女分區的雙浴室類型。其角色包括清潔、宗教潔淨、婚前儀式與社交，不只是泡澡。</p><h3>相關故事</h3><p>可把傳統更衣休息 → 溫暖過渡 → 熱浴 → 小浴間的動線，與地板下加熱系統一起想像。隔日Skopje的Daut Pasha Hamam可作比較。</p><h3>實用提醒</h3><p>不把舊建築的用途當成現場仍有浴場服務。</p><a class="guide-return" href="#ks16-hamam">回到行程</a></details><details class="guide-card" id="guide-ks16-sinan"><summary>Sinan Pasha Mosque 內部｜導覽</summary><h3>現場看什麼</h3><p>大圓頂、吊燈、窗光、指向麥加的 mihrab 壁龕、講道的 minbar 講壇，以及花卉、幾何與書法。</p><h3>歷史背景</h3><p>建於17世紀初，通常以1615年為建成年份。不同修繕階段留下彩繪層次，不能把全室色彩都當成同時完成。</p><h3>相關故事</h3><p>宗教空間的視覺中心多為文字、幾何與植物紋樣。這可與前一天Dečani的人物敘事壁畫比較：兩種藝術用不同方式建立神聖空間。</p><h3>實用提醒</h3><p>遮肩過膝、脫鞋，女性備頭巾依現場要求；不直接拍正在禮拜的人。</p><a class="guide-return" href="#ks16-sinan">回到行程</a></details><details class="guide-card" id="guide-ks16-ljevis"><summary>Our Lady of Ljeviš｜外觀優先｜導覽</summary><h3>現場看什麼</h3><p>磚石交錯、拱券、不同施工階段與教堂周圍的現代城市。</p><h3>歷史背景</h3><p>14世紀初國王Milutin在更早宗教建築基礎上重建，後曾轉作清真寺，再恢復教堂用途。壁畫是晚期拜占庭藝術的重要例證，列入UNESCO中世紀古蹟群。</p><h3>相關故事</h3><p>同一建築的用途變化，呈現政權、社群與信仰交錯；不把來源未充分證實的古代神廟細節當成必然史實。</p><h3>實用提醒</h3><p>以外觀參觀為預設，尊重保護措施；想看內部先安排，不在門口臨時爭取。</p><a class="guide-return" href="#ks16-ljevis">回到行程</a></details><details class="guide-card" id="guide-ks16-george"><summary>St. George Orthodox Cathedral｜導覽</summary><h3>現場看什麼</h3><p>院落、教堂量體與鄰近街區的相對位置。</p><h3>歷史背景</h3><p>現有較大的主教座堂屬19世紀建築，提醒Prizren在鄂圖曼晚期仍有東正教社群。</p><h3>相關故事</h3><p>宗教多樣性不只存在郊外修道院，也在老城街巷中；今天的人口與可見古蹟不一定一一對應。</p><h3>實用提醒</h3><p>遇關門安靜看外觀即可。</p><a class="guide-return" href="#ks16-george">回到行程</a></details><details class="guide-card" id="guide-ks16-catholic"><summary>Cathedral of Our Lady of Perpetual Succour｜導覽</summary><h3>現場看什麼</h3><p>外牆、鐘樓與街區尺度；不要把它與東正教座堂混淆。</p><h3>歷史背景</h3><p>阿爾巴尼亞族群並非全部信伊斯蘭教，天主教社群也是其歷史的一部分。</p><h3>相關故事</h3><p>這能幫助理解隔日Mother Teresa：出生地、語言、宗教與國族不是同一組分類。</p><a class="guide-return" href="#ks16-catholic">回到行程</a></details><details class="guide-card" id="guide-ks16-arasta"><summary>Arasta Minaret → 手工藝／甜點｜導覽</summary><h3>現場看什麼</h3><p>孤立宣禮塔與周邊商業街的反差。</p><h3>歷史背景</h3><p>Arasta 指與市場相關的商業空間；殘存建築構件留下城市改造前的座標。</p><h3>相關故事</h3><p>城市不是保存完整的展示櫃；火災、拆除、戰爭與重建造成今天看見的斷裂與拼接。</p><a class="guide-return" href="#ks16-arasta">回到行程</a></details><details class="guide-card" id="guide-ks16-fortress"><summary>Prizren Fortress｜城市全景｜導覽</summary><h3>現場看什麼</h3><p>老城屋頂、河流、石橋、清真寺與遠山的空間關係。拍西方落日與拍城市／Sharr山景是不同方向，不必強求同框。</p><h3>歷史背景</h3><p>這座高地保留多時期防禦利用，包含晚期古代、中世紀與鄂圖曼的變化，並非一次建成的城堡。</p><h3>相關故事</h3><p>從上面讀懂城市：山口帶來交通、河流帶來水源、平原提供農業腹地、橋梁聚集交易，宗教建築則呈現不同社群。黃昏看山坡變暗、宣禮塔與河岸逐步亮燈。</p><h3>實用提醒</h3><p>手機照明充足；天雨石路滑就取消。不把日落後拍照的20分鐘算成已回到老城，另留25–40分鐘下山。</p><a class="guide-return" href="#ks16-fortress">回到行程</a></details><details class="guide-card" id="guide-ks17-start"><summary>Prizren 早餐、最後散步、退房｜導覽</summary><h3>現場看什麼</h3><p>離城後注意平原向中部交通走廊延伸，再由Kaçanik谷地向南。</p><h3>歷史背景</h3><p>道路與鐵路長期利用Kaçanik的狹窄天然通道連接Kosovo盆地與Vardar谷地。</p><h3>相關故事</h3><p>Pristina的Newborn、國家圖書館與咖啡文化有其價值，但本次加入它會耗掉Skopje唯一的下午。</p><a class="guide-return" href="#ks17-start">回到行程</a></details><details class="guide-card" id="guide-ks17-border"><summary>Hani i Elezit／Blace 邊境｜導覽</summary><h3>現場看什麼</h3><p>過境後馬其頓語西里爾字母增加，阿爾巴尼亞語仍常見；道路與河谷聚落的變化。</p><h3>歷史背景</h3><p>Han 概念與鄂圖曼商旅驛站有關，地名顯示交通節點在這一帶的長期重要性。</p><h3>相關故事</h3><p>國界切換不代表文化立即整齊分開；Skopje同樣有多語、多宗教的城市空間。</p><a class="guide-return" href="#ks17-border">回到行程</a></details><details class="guide-card" id="guide-ks17-teresa"><summary>Mother Teresa Memorial House｜導覽</summary><h3>現場看什麼</h3><p>照片、文字與小教堂；紀念館不是她完整保留的出生住宅。</p><h3>歷史背景</h3><p>Mother Teresa於1910年生於Skopje的阿爾巴尼亞天主教家庭，當時城市仍屬鄂圖曼帝國，後在印度從事宗教與慈善工作。</p><h3>相關故事</h3><p>她的家庭語言、宗教、出生地與工作地跨越今日國界。用複合身份理解她，比只問「是哪一國人」更貼近巴爾幹歷史。</p><h3>實用提醒</h3><p>官方旅遊頁列平日09:00–20:00、週末09:00–14:00；9/17是週四，但臨時活動仍可能調整。</p><a class="guide-return" href="#ks17-teresa">回到行程</a></details><details class="guide-card" id="guide-ks17-square"><summary>Macedonia Street → Macedonia Square｜導覽</summary><h3>現場看什麼</h3><p>雕像、圓柱、立面尺度與行人活動之間的反差。</p><h3>歷史背景</h3><p>Skopje經1963年大地震及國際重建，留下南斯拉夫現代主義；21世紀Skopje 2014又增添大量紀念性雕塑與仿古立面。</p><h3>相關故事</h3><p>城市景觀是多次重寫的結果。可思考公共建築如何建立國家形象，也如何引發美學、成本與歷史詮釋的討論。</p><a class="guide-return" href="#ks17-square">回到行程</a></details><details class="guide-card" id="guide-ks17-bridge"><summary>Stone Bridge｜跨 Vardar 河｜導覽</summary><h3>現場看什麼</h3><p>南岸寬廣場、大雕像與新立面；北岸小店、han、hamam、清真寺和窄巷。</p><h3>歷史背景</h3><p>現有橋梁主要承接鄂圖曼時期的形態，歷經災害與修繕，仍是Skopje核心跨河連結。</p><h3>相關故事</h3><p>幾分鐘步行就能比較不同尺度與歷史層次；兩岸不是完全隔離的族群分界，只是最直觀的城市對比。</p><a class="guide-return" href="#ks17-bridge">回到行程</a></details><details class="guide-card" id="guide-ks17-hamam"><summary>Daut Pasha Hamam｜導覽</summary><h3>現場看什麼</h3><p>多圓頂屋頂與厚牆形成的量體。</p><h3>歷史背景</h3><p>15世紀鄂圖曼浴室後轉作藝術展示空間，原本不同溫度與用途的房間在外觀仍留有線索。</p><h3>相關故事</h3><p>與Prizren的Hamam比較公共清潔、社交與當代再利用，不用以「哪個更大」判定城市文化高低。</p><a class="guide-return" href="#ks17-hamam">回到行程</a></details><details class="guide-card" id="guide-ks17-hans"><summary>Kapan Han → Suli Han 與老巴扎巷道｜導覽</summary><h3>現場看什麼</h3><p>中央院落、厚牆、入口及上下層的空間分工；Suli Han同樣可觀察商旅建築再利用。</p><h3>歷史背景</h3><p>Han是前現代的物流基地，常結合住宿、貨物存放、牲畜安置與交易。各建築實際格局依年代和後續改造而異。</p><h3>相關故事</h3><p>把它想像成旅館、倉庫與商務中心的組合，就能理解它為何緊鄰市場與交通路徑。</p><h3>實用提醒</h3><p>店舖、展間與私人空間不要預設都能自由進入。</p><a class="guide-return" href="#ks17-hans">回到行程</a></details><details class="guide-card" id="guide-ks17-mustafa"><summary>Mustafa Pasha Mosque｜導覽</summary><h3>現場看什麼</h3><p>大圓頂、門廊、宣禮塔與庭院的比例。</p><h3>歷史背景</h3><p>建於1492年的鄂圖曼清真寺，是Skopje重要歷史宗教建築。</p><h3>相關故事</h3><p>與Prizren的Sinan Pasha比較：前者庭院平台較安靜，後者與河岸天際線的關係更突出。</p><a class="guide-return" href="#ks17-mustafa">回到行程</a></details><details class="guide-card" id="guide-ks17-kale"><summary>Kale Fortress 外圍或 Stone Bridge 黃昏｜導覽</summary><h3>現場看什麼</h3><p>Vardar河、北岸老巴扎、南岸中心與遠方Vodno山。</p><h3>歷史背景</h3><p>Kale在土耳其語有堡壘之意；高地長期控制河谷與城市交通。</p><h3>相關故事</h3><p>城市既有鄂圖曼遺產，也有地震後重建、現代主義與新國家紀念物；其魅力在多層並存。</p><h3>實用提醒</h3><p>延誤時第一個刪除；不為進堡壘攀越關閉入口。</p><a class="guide-return" href="#ks17-kale">回到行程</a></details><details class="guide-card" id="guide-ks17-dinner"><summary>Old Bazaar 晚餐 → Stone Bridge 夜景｜導覽</summary><h3>現場看什麼</h3><p>老巴扎夜間小店與河岸新古典立面形成不同氛圍。</p><h3>歷史背景</h3><p>焗豆、烤肉、白起司沙拉與烤椒醬跨巴爾幹流通，各地有自己的家庭版本。</p><h3>相關故事</h3><p>Ajvar以烤紅椒為主，配方可能加茄子；pindjur常有番茄、椒與茄子。Pastrmajlija是肉塊烤麵餅，份量通常適合分享。</p><h3>實用提醒</h3><p>確認供應與份量再點，不必一餐湊齊清單。</p><a class="guide-return" href="#ks17-dinner">回到行程</a></details><details class="guide-card" id="guide-ks18-matka"><summary>Matka Canyon｜步道／遊船擇一｜導覽</summary><h3>現場看什麼</h3><p>水面、陡壁與狹窄谷地的尺度，近岸步道可拍倒影。</p><h3>歷史背景</h3><p>Matka是Skopje西側的峽谷與水庫景觀，與此前Rugova的公路河谷可作地貌及人為利用比較。</p><h3>相關故事</h3><p>把它放離城日是行程取捨，仍有進出峽谷支路，不是毫無繞路的高速公路休息站。</p><h3>實用提醒</h3><p>車位滿、雨大或船班等太久即縮短；不把行李放車內顯眼處。</p><a class="guide-return" href="#ks18-matka">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://rogeryangct.github.io/travel-itineraries/#trip/kosovo-2026" target="_blank" rel="noopener">使用者提供的行程、住宿更新與9/15 08:00預約；整合日期2026/9/13，未附可公開訂單連結</a> · 2026-09-13｜使用者資料；原稿導覽整合，未聲稱逐項重新核實</li><li><a href="https://bnadventure.com/" target="_blank" rel="noopener">BNA｜路線難度與業者資訊</a> · 2026-09-13｜搜尋摘要；最終集合與路線須以業者訊息為準，€35為先前回覆</li><li><a href="https://www.decani.org/en/" target="_blank" rel="noopener">Visoki Dečani｜官方訪客資訊與修道院</a> · 2026-09-13｜官方頁；臨時宗教與安全管制另核對</li><li><a href="https://whc.unesco.org/en/list/724/" target="_blank" rel="noopener">UNESCO｜Medieval Monuments in Kosovo</a> · 2026-09-13｜遺產背景</li><li><a href="https://memorialhouseofmotherteresa.com/" target="_blank" rel="noopener">Mother Teresa Memorial House｜官方</a> · 2026-09-13｜官方搜尋摘要；當日開放需再確認</li><li><a href="https://roads.org.mk/en/2026/05/11/corridor-viii-under-the-spotlight-how-is-construction-of-the-motorway-sections-progressing/" target="_blank" rel="noopener">北馬其頓公路局｜Kičevo–Ohrid工程進度</a> · 2026-09-13｜頁面發布2026-05-11，非即時路況</li></ul></section></main></template>
<template id="content-montenegro-north-2026"><nav><a href="#mn11">09-11 Piva 與跨境</a><a href="#mn12">09-12 三鐵與草原文化</a><a href="#mn13">09-13 黑湖與北段往返</a><a href="#mn14">09-14 Tara 南岸至 Peja</a><a href="#budget">費用</a><a href="#guidebook">景點導覽</a><a href="#sources">來源</a></nav><main><section id="weekend-update"><h2>9/11 晚更新：南段已完成，週末不重跑整圈</h2><p>依你回報，今天已走 Plužine → Trsa → Pišče／Todorov Do → Sedlo → Žabljak。9/11 下方保留的是先前規畫，不能當成你今天實際走過的道路紀錄。接下來取消完整 Ring，週六以休息、可取消的草原文化短線與觀賽為主；週日優先黑湖＋Ćurevac。</p><p>9/11 查得的城鎮預報：週六約 14／6°C、局部雷暴；週日約 16／5°C、多雲少量雨；週一約 17／9°C、局部雷陣雨。週六山區有雷暴與風黃色警示。你提供的官方高解析模型「週日幾乎全乾」本次未能重新讀取驗證，不能宣稱已確定晴朗無風。週日較值得保留大景，但早上仍要看雲底、風及路面。</p><p>Vražje、Riblje 與兩處 stećci 都在開闊高原，不是雷暴避難景點。只有陰天／輕微短雨、沒有雷暴逼近、視距良好時才短停；雷雨時改室內，不躲墓碑、孤樹或湖岸。</p><p>北半圈不是不走南段就能自動回城。跨 Sušica 到 Nedajno 後，原路回程要再下降與爬升一次；繼續向 Trsa 則重複南段。此次主線到 Mala Crna Gora 一帶看景後折返；谷底與 Nedajno 不列必去。</p><p>黑湖完整環湖再加 Zminje，包含停車步行、拍照與雨後路面，不能壓成短短兩三小時。週日要看遠景就先刪 Zminje；Sedlena Greda 也刪出主線，若改登山需整個下午取代北段，不能加碼。</p><a class="map" target="_blank" rel="noopener" href="https://blackxtri.com/race-info">官方賽程</a><a class="map" target="_blank" rel="noopener" href="https://blackxtri.com/s/BLACKLAKE-Event-manual-2026.pdf">2026 比賽手冊</a><a class="map" target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/1504/maps/">UNESCO 正式座標</a></section><section id="race-spectator"><h2>9/12 三鐵：到哪裡看，什麼是確定時間？</h2><p>Blacklake Xtreme 是長距離極限三鐵，結合冷水游泳、公路自行車及山地跑。2026 手冊列 3.8km 游泳、182km 自行車、約42km 跑步。參賽者分散在整條賽道，不會在黑湖讓你連續看完整三項。</p><p>官方確定：9/12 04:30 黑湖起跑；手冊游泳關門 06:45。05:30–06:30 在湖岸公共區域有機會看游泳上岸、穿裝備與自行車出發，是不必04:00到場的折衷；這是觀賽建議，不是主辦保證每分鐘都有選手。08:30才到已不是看游泳的時段。</p><p>T1 是黑湖游泳轉自行車；手冊 T2 在 Ski Center Durmitor 停車區（Savin Kuk 滑雪基地一帶），看自行車進站換跑鞋。只有現場確認基地位置與今年改線後才去；大約中午至下午是推估觀察窗，出門前看主辦資訊，不按預估時間乾等。</p><p>今年官方首頁和2026手冊都把終點寫在黑湖，不是 Savin Kuk 山頂。傍晚可回黑湖看跑步抵達；17:30–19:00 只是候選等候窗，不能用歷年紀錄保證首名時間，改線也可能更早。週日10:00是完賽儀式，不是另一場三鐵。</p><p>2026 手冊仍寫自行車跨施工中的 Tara Bridge，且跑步關門表內也有不一致。本次沒有取得主辦最終改線公告或即時選手定位，不能據此保證自行車路線、T2 抵達時間與山段照常。主辦聯絡 info@blackxtri.com；手冊列賽事辦公室 +382 67 285 549（Viber／WhatsApp）。可詢問：明天是否照常04:30起跑、公共觀眾區在哪、T2與終點是否改動。未代你發訊息。</p><p>T1 游泳出口與轉換區受管制，手冊僅准配戴識別的一名支援者進特定區域；一般遊客站工作人員允許的公共位置。不要開車追自行車、占用選手通道或為觀賽上雨中的山口。雷暴時取消湖邊等候，退回建築／硬頂車。</p><div class="tablewrap"><table><thead><tr><th>時段</th><th>地点</th><th>可能看到／確定程度</th></tr></thead><tbody><tr><td>04:00到場；04:30開賽</td><td>黑湖餐廳附近公共湖岸</td><td>官方起跑；漆黑、冷、需確認可進</td></tr><tr><td>05:30–06:30</td><td>黑湖 T1 外圍</td><td>推估可見上岸與騎車出發；06:45游泳關門</td></tr><tr><td>中午至下午，先確認</td><td>Ski Center Durmitor／Savin Kuk 基地 T2</td><td>手冊位置；今年最終改線與抵達時間待確認</td></tr><tr><td>17:30–19:00候選</td><td>黑湖終點外圍</td><td>跑步完賽，按當日進度調整</td></tr><tr><td>9/13 10:00</td><td>黑湖</td><td>官方完賽儀式；與北段出發時間取捨</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Restoran%20Crno%20Jezero%20%C5%BDabljak">黑湖餐廳／起終點區域搜尋</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Savin%20Kuk%20ski%20centre%20%C5%BDabljak">滑雪基地 T2 區域搜尋（先確認）</a><a class="map" target="_blank" rel="noopener" href="https://blackxtri.com/s/BLACKLAKE-Event-manual-2026.pdf">官方手冊</a></section><section id="decisions"><h2>9/10 規畫背景（週末以 9/11 更新為準）</h2><p>2026/9/10 查核；時間均為當地 CEST。9/11 從 Apartment Nina and Nino 出發，9/11–9/13 住 ViS，9/14 前往 Peja。住宿地圖以名稱搜尋，請以自己的訂房定位選定正確入口；這份公開行程不包含房號或入住密碼。</p><p>9/11 改採 06:30 出發，前半段用 Sarajevo → Sumbulovac → Podromanija → Rogatica → Ustiprača → Goražde → Foča → Brod na Drini → Hum／Šćepan Polje → Plužine → Jasenovo Polje → Šavnik → ViS。這是為避開 Trnovo 火場周邊與 Dobro Polje–Miljevina 限制路段的保守選擇，不代表官方認證全程最安全。Zaborje 舊的 11:00–17:00 封路不再作為凌晨趕路理由。</p><p>9/12 改以黑湖、森林短走與賽事氣氛為主；9/13 暫留給 Durmitor Ring，但週日也有雨，環線只是條件式安排。兩天都不適合時，就取消完整高山環線，不為打卡硬開。</p><p>Tara Bridge 官方公告 8/10 06:00 至 10/26 12:00 全面封閉。9/14 刪除過橋與預設 Zipline。沿南岸 R10 去 Mojkovac 未必需要過橋，但 Sokolovina 路段目前未取得可靠的 9/10 通行確認，9/13 晚上必須查明。</p><p>Blacklake Xtreme Triathlon 官方列在 9/12，9/13 10:00 有完賽儀式。2026 賽事手冊仍寫自行車跨 Tara Bridge，與封橋公告矛盾：賽事日期有官方依據，最終路線、是否改賽及觀眾可進區域仍須以主辦現場公告確認。不能拿賽事路線當作道路開放證明。</p><a class="map" target="_blank" rel="noopener" href="https://www.gov.me/clanak/od-10-avgusta-potpuna-obustava-saobracaja-preko-mosta-durdevica-tara">橋梁封閉公告</a><a class="map" target="_blank" rel="noopener" href="https://en.vijesti.me/news-b/economy-d/818219/The-Traffic-Administration-published-a-video-of-the-completed-section-of-Zaborje-Jasenovo-Polje.">Zaborje 完工報導</a><a class="map" target="_blank" rel="noopener" href="https://blackxtri.com/race-info">賽事官方時程</a><a class="map" target="_blank" rel="noopener" href="https://amscg.org/">AMSCG 路況</a></section><section id="fire-road-update"><h2>9/10 追加查核：火災、煙霾與道路差異</h2><p>與前版的差別：出發改 06:30，新增 Rogatica／Goražde 繞行與煙霾決策。原有「不走 Sedlo 捷徑」「不跨 Tara Bridge」「週六黑湖、週日環線須天氣合格」保持一致。</p><p>BIHAMK 一般路況頁標示 9/10 12:43、主幹道頁標示 13:57：Dobro Polje–Miljevina 仍只准 3.5 噸以下；Brod na Drini–Hum 因多處落石與滑坡風險，小客車通行困難、貨車不能通過。不能把這段描述成只有超長車才受限。Romanija／Podromanija–Sumbulovac 也有施工交替放行。</p><p>Presjenica／Trnovo 的近期火災有新聞依據，但未取得火場即時周界、逐段煙霧或官方要求所有小客車繞 Goražde 的命令。因此繞行是降低靠近火場與原路限制的不確定性，不是已證實原主路全面封閉。經 Rogatica 到 Foča 改抓約 3–3.5 小時含慢行緩衝，不沿用 08:30 必到的樂觀時間。</p><p>EPA 9/9 公告：11:00 Pljevlja PM10 為 399.3 µg/m³、Nikšić 為 225 µg/m³，並認為野火煙霧是主要原因之一。這些是有時間戳的歷史觀測，不是明天預報。你貼出的 142／115 未能確認同一測站與時刻，不抄為現在讀值，也不把濃度與 AQI 混用。</p><p>本次未取得足以逐一驗證所貼各火場控制狀態的 MUP 最新原文，也沒有完成衛星火點與道路的即時疊圖；不能因此宣稱 Piva／Šavnik 無煙、火場全受控或一定比任何替代線安全。Nikšić 也有嚴重空污，9/14 若採南側大繞路同樣要注意。</p><p>只有薄霾、道路視距正常且無警戒時：縮短景觀停靠，近距離岩壁或水面仍可能有細節，但不能保證水色與遠景。若煙濃到看不清道路、附近有火焰、消防作業或封路：不要按「路線不變」硬穿，停在火煙區外有服務的安全城鎮，遵從警方安排，必要時延後移動。</p><p>不要單靠沒有煙味判斷空氣安全。煙霾明顯時減少戶外停留、關窗並按情況用車內循環；不在林地、草坡或落石區找拍照捷徑。9/12 湖泊與9/13環線的出發門檻也加入煙霧能見度、官方火災警戒與戶外空污情況。</p><p>Tara Bridge 封閉不直接證明南岸 R10 也封閉或已開通。AMSCG 本次入口仍無法讀取，Sokolovina 的 9/14 通行保持待確認；所貼 Pljevlja 大繞路最後同樣依賴這段，不能當作已確認可通的萬用替代。</p><a class="map" target="_blank" rel="noopener" href="https://bihamk.ba/spi/stanje-na-cesti-u-bih/magistralne-ceste">BIHAMK 主幹道 9/10</a><a class="map" target="_blank" rel="noopener" href="https://epa.org.me/2026/09/09/saopstenje-povodom-aktuelne-situacije-sa-kvalitetom-vazduha-u-crnoj-gori/">EPA 9/9 空污公告</a><a class="map" target="_blank" rel="noopener" href="https://www.klix.ba/vijesti/bih/veliki-pozar-kod-trnova-prosirio-se-na-minsko-polje-vatrogasci-ga-opkolili-da-zastite-objekte/260907181">Presjenica 火災報導</a></section><section id="weather-plan"><h2>四天天氣與出發門檻</h2><p>9/11 晚更新的城鎮預報，不是山口逐時預報；仍須核對雲底、風與雷暴。</p><p>完整環線的門檻：當天上午至預計回城時段沒有雷暴警示，路面無冰雪、落石封路，能見度足夠看清彎道與會車點，住宿或公園人員確認通行。只有「雨比較少」不算合格。出現雷聲就停止湖岸、山口及森林步行，回到硬頂車輛或建築內；樹下不是避雷處。</p><p>帶防水外套、中層保暖衣、防滑鞋、乾襪、薄手套；出城前下載離線道路與健行圖。午後天氣不穩，拍照與步行優先安排上午。</p><div class="tablewrap"><table><thead><tr><th>日期</th><th>Žabljak 預報</th><th>行程調整</th></tr></thead><tbody><tr><td>9/12 六</td><td>14／6°C；局部雷暴，山區風／雷黃色警示</td><td>戶外短線只在安全空檔；否則休息</td></tr><tr><td>9/13 日</td><td>16／5°C；多雲，仍有少量雨可能</td><td>黑湖＋Ćurevac 優先；北段可刪</td></tr><tr><td>9/14 一</td><td>17／9°C；局部雷陣雨</td><td>南岸 R10 通行仍須確認</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.meteo.co.me/">黑山官方氣象與警示</a></section><section id="maps-explained"><h2>Google Maps 為何比較快？</h2><p>截圖只設定「你的位置 → ViS」，藍線在 Plužine 往東切進山區；依位置判斷，很可能是 Trsa／Sedlo 方向，但沒有逐段道路清單，無法只憑截圖確認每條路名。地圖上的 5、6、7、8、9 圖釘不代表全部已加入這次導航的停靠點。</p><p>Google 的 4 小時 8 分是該時刻選中路線的行車估算，不含你的午餐、拍照、採買及不確定的邊境等候。原案多繞南側，是為把高山留給獨立一天、降低長途駕駛後再跑窄路的壓力，同時避免重複；不是因為最短路線一定不能走。</p><p>這次仍建議 9/11 經 Šavnik：下午雷雨風險加上跨境疲勞，不適合臨時追加 Sedlo。若後來因連日惡劣天氣取消 Ring，也不代表明天就應冒雨走捷徑。相反地，若主要道路封閉、官方建議替代且山路天候合格，避免重複的偏好可以讓位。</p><p>導航不要只輸入 Pale → Goražde，可能被帶往另一條山區路線。此次明確用 Sumbulovac → Podromanija → Rogatica → Ustiprača → Goražde → Foča；不必為經過 Pale 這個名稱特地進市中心。下半段保留 Hum、Plužine、Jasenovo Polje、Šavnik，分段開始前核對全線。Romanija 有工程交替放行，繞行也要留緩衝。</p><div class="tablewrap"><table><thead><tr><th>9/11 選項</th><th>優點</th><th>代價／本次判斷</th></tr></thead><tbody><tr><td>Plužine → Trsa → Sedlo → Žabljak</td><td>較短，高山景觀直接</td><td>窄路、會車、山口天氣；本次不採</td></tr><tr><td>Plužine → Jasenovo Polje → Šavnik → Žabljak</td><td>把山口留到精神好的一天</td><td>路程較長；本次採用，仍有山路與隧道</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Sumbulovac%20Bosnia">1. Sumbulovac</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Podromanija%20Bosnia">2. Podromanija</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Rogatica%20Bosnia">3. Rogatica</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Ustipra%C4%8Da%20Bosnia">4. Ustiprača</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Gora%C5%BEde%20Bosnia">5. Goražde</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Fo%C4%8Da%20Bosnia">6. Foča</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Hum%20border%20crossing%20Bosnia%20Montenegro">7. Hum border crossing Bosnia Montenegro</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Plu%C5%BEine%20Montenegro">8. Plužine Montenegro</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Jasenovo%20Polje%20Nik%C5%A1i%C4%87%20Montenegro">9. Jasenovo Polje Nikšić Montenegro</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%A0avnik%20Montenegro">10. Šavnik Montenegro</a></section><section id="fuel-food"><h2>加油、補貨與高 CP 值吃法</h2><p>以下按柴油車計算，實際油種以油箱蓋與租車文件為準。黑山 9/8–9/14 Eurodiesel 官方最高 €1.87/L。波赫 9/10 全國柴油平均約 3.44 KM/L（約 €1.76），不是 Sarajevo 或 Foča 某一站的即時报價。沒有足夠的同日站價證據，不能宣稱某站最便宜。</p><p>比較門檻是 3.66 KM/L：波赫站牌低於此價就比黑山上限低。若加 40L，3.44 KM 與 €1.87 的差額約 €4.45，沒有必要繞十多公里省油錢。一般柴油即可，不因店員推薦就改加 premium。</p><p>今晚在 Sarajevo 順路加到油槍第一次自動跳停最省事；不要反覆補到瓶口。若已超過 3/4 桶，明天直接出發，Foča 看油量再決定。若少於半桶，在進 Foča–Hum 前補滿。Foča 可查 Nešković Brod na Drini 或 NIS Petrol Južni most slobode；這是沿途候選，不是已核實最低價排名。</p><p>Plužine 不必再次硬加滿：若仍有半桶以上且續航有餘裕，直接去 Žabljak。跑 Ring 前至少半桶，舒適做法約 3/4 桶；9/14 若需長繞路則出發前加滿。不要把偏遠環線當成找油站的地方。Rožaje 只補到足夠進 Peja 並留餘量，不為「最後一站」再強制加滿。</p><p>9/11 抵達後先去 Voli Žabljak。官方店表列 07:30–21:30，但星期日不要依賴超市營業；星期五買週末用品，星期六補星期一早餐。兩人兩天先買約 8L 飲水，另加車內備用、麵包、水果、堅果、能量棒；有冰箱再買優格、起司等冷藏食品。生鮮在黑山買，避免把不必要的肉乳品帶著跨境。</p><p>吃法：午餐採麵包店／烤肉店，晚餐挑一餐當地料理。Žabljak 的 Podgora 可作簡餐候選；Hotel MB 餐廳適合羊肉與高地料理，與橋邊 Motel Tara MB 是不同地方；Or’O 可作市中心方便備選，未必最便宜。沒有取得同日完整菜單，下面餐費均為預算，不是店家報價。</p><p>建議兩人點一份湯或兩碗小湯、一份 kačamak 共享，再配一份肉或魚及沙拉；先問份量，避免兩大盤澱粉加兩大盤肉。慢烤羊肉想吃才請 ViS 前一天協助詢問供應、份量、價格與出餐時間。一般麵包、烤肉簡餐不需預訂。</p><a class="map" target="_blank" rel="noopener" href="https://www.gov.me/clanak/nove-cijene-goriva-od-08092026">黑山柴油價格</a><a class="map" target="_blank" rel="noopener" href="https://nafta.hr/cijene-goriva-bih/">波赫油價比較</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Voli%20%C5%BDabljak">Voli Žabljak 地圖</a><a class="map" target="_blank" rel="noopener" href="https://mbturist.com/">Hotel MB 官方／菜色</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Restoran%20Podgora%20%C5%BDabljak">Podgora 地圖</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Ne%C5%A1kovi%C4%87%20Brod%20na%20Drini%20Fo%C4%8Da">Foča 油站</a></section><section id="reservations"><h2>現在值得先確認的預約</h2><p>優先順序：租車文件及新車跨境保險 → 9/13 北段當日能否通行 → 9/14 R10/Sokolovina → 想吃的慢烤羊肉。不要先付不可退的 Ring 或 Zipline，因為天氣與施工仍有變數。</p><p>國家公園常規散步、Piva 修道院一般不需提前預約；入園與停車按現場售票。舊表中的 Ring van €20／jeep €30、導遊 €40／4 小時不是已確認可訂到的 2026 服務；若想請司機，請住宿代詢總價、是否含門票、天氣取消與乘客數後再決定。</p><p>9/12 Blacklake Xtreme 是正式極限三鐵，不能把現場觀賽當成臨時報名活動。04:30 起跑不值得讓剛開完跨境山路的你們再少睡；選正常起床後經過公共湖岸，是否開放看現場。轉換區有限制，不闖入選手區。9/13 10:00 完賽儀式若想看，就放棄那天早出發的北段觀景，兩者不要都塞。</p><p>未查到能確認落在 9/11–9/14 的市慶演唱會；9/17 市慶及泛稱活動週不能當成這幾天確定節目。</p><a class="map" target="_blank" rel="noopener" href="https://blackxtri.com/s/BLACKLAKE-Event-manual-2026.pdf">Blacklake 2026 手冊</a><a class="map" target="_blank" rel="noopener" href="https://zabljak.travel/me/">Žabljak 旅遊局</a></section><section id="sat-stock"><h2>補星期一早餐；確認週日環線｜原方案已取消</h2><p>9/11 已完成南段後，此項不再列入週末主線。請使用 mn12／mn13 日期選單查看新版；不重跑完整環線。</p></section><section id="ring-start"><h2>ViS｜決策、早餐與油量｜原方案已取消</h2><p>9/11 已完成南段後，此項不再列入週末主線。請使用 mn12／mn13 日期選單查看新版；不重跑完整環線。</p></section><section id="trsa"><h2>Nedajno → Trsa｜提早午餐｜原方案已取消</h2><p>9/11 已完成南段後，此項不再列入週末主線。請使用 mn12／mn13 日期選單查看新版；不重跑完整環線。</p></section><section id="prutas"><h2>Pišče → Todorov Do／Prutaš｜原方案已取消</h2><p>9/11 已完成南段後，此項不再列入週末主線。請使用 mn12／mn13 日期選單查看新版；不重跑完整環線。</p></section><section id="sedlo"><h2>Dobri Do → Sedlo｜山口短停｜原方案已取消</h2><p>9/11 已完成南段後，此項不再列入週末主線。請使用 mn12／mn13 日期選單查看新版；不重跑完整環線。</p></section><section id="ring-return"><h2>Pošćenska 谷地 → Žabljak｜原方案已取消</h2><p>9/11 已完成南段後，此項不再列入週末主線。請使用 mn12／mn13 日期選單查看新版；不重跑完整環線。</p></section><section class="day" id="mn11"><span class="tag">2026-09-11</span><h2>9/11｜Sarajevo → Piva → Šavnik → Žabljak</h2><p>06:30 出發，經 Rogatica／Goražde 避開 Trnovo 方向。Foča 暫抓 09:30–10:00，目標 17:00–18:00 入住；17:00 不是最晚抵達保證。先備妥午餐與油，修道院改選配。</p><div class="slot" id="departure"><div class="time">05:45–06:30</div><div><h3>Apartment Nina and Nino｜早餐與出發</h3><p>吃完早餐、裝車，確認護照、車輛登記、租車跨境授權和保險在副駕可取得的位置。帶好午餐備糧，避免邊境排隊時還餓著找店。 今晚先補油與午餐最省時；不要在 Goražde 加觀光。</p><p><b>交通：</b>明確依 Sumbulovac → Podromanija → Rogatica → Ustiprača → Goražde → Foča 分段；含 Romanija 工程先留約 3–3.5 小時。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Apartment%20Nina%20and%20Nino%20Sarajevo" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="foca"><div class="time">09:30–10:15</div><div><h3>Foča／Brod na Drini｜功能性休息</h3><p>到達時間暫抓 09:30–10:00，停靠限 15 分鐘。若前半段已延誤，咖啡改外帶，但不省必要洗手間與駕駛休息。今天改從 Goražde 進 Foča，避開 Dobro Polje–Miljevina；不表示那條路對小客車已全面封閉。</p><p><b>費用：</b>咖啡／簡單早餐預算 €3–6／人；油另計</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Fo%C4%8Da%20Bosnia" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://bihamk.ba/spi/stanje-na-cesti-u-bih" target="_blank" rel="noopener">官方資訊</a></div></div><div class="slot" id="hum"><div class="time">10:15–12:15</div><div><h3>Hum／Šćepan Polje｜慢山路與跨境</h3><p>BIHAMK 9/10 13:57：Brod na Drini–Hum 小客車因落石及滑坡風險通行困難，貨車不可通過。慢行、留會車空間，不只把某 12 公里當成全段風險。通關留 30–60 分鐘仍可能不足；當天公告 Hum 入境波赫較忙，不能反推明天出境等待。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hum%20border%20crossing%20Bosnia%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-hum">導覽</a></div></div><div class="slot" id="piva-canyon"><div class="time">12:15–13:15</div><div><h3>Piva Canyon｜隧道、峽谷與水庫</h3><p>視煙、雨與實際到達時間，最多一至兩次各 5–10 分鐘安全停靠。薄霾可縮短拍照；若煙影響行車視距或有火災管制，留在危險區外等待，不強行穿越。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Piva%20Lake%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://parkpiva.com/listing/pivsko-jezero/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-piva-canyon">導覽</a></div></div><div class="slot" id="pluzine"><div class="time">13:15–13:45</div><div><h3>Plužine｜午餐與湖岸短走</h3><p>午餐約 30 分鐘，忙就吃自備食物。今天不預訂遊船或長午餐。若到達已超過 14:00，取消修道院與其他景觀支線，但保留必要休息。</p><p><b>費用：</b>簡餐預算 €8–15／人；不是店家即時報價</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Plu%C5%BEine%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-pluzine">導覽</a></div></div><div class="slot" id="piva-monastery"><div class="time">14:00–14:25｜可刪</div><div><h3>Piva Monastery｜會搬家的修道院</h3><p>只在 13:45 前離開 Plužine、天氣與煙況合格且駕駛不累時停。任何明顯延誤就取消；修道院在往南通過 Zaborje 之前，不回頭補景點。</p><p><b>費用：</b>固定門票未確認；可自願小額捐獻</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Piva%20Monastery" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-piva-monastery">導覽</a></div></div><div class="slot" id="savnik"><div class="time">13:45／14:25–17:00／18:00</div><div><h3>Jasenovo Polje → Šavnik → Žabljak</h3><p>導航 Jasenovo Polje → Šavnik → ViS。不要為守 17:00 入住而加速；路況正常時目標17:00–18:00，重大延誤另作安全停留。</p><p><b>交通：</b>從 Plužine 起，依是否停修道院及工程／慢車，先留約 3–3.5 小時。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%A0avnik%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-savnik">導覽</a></div></div><div class="slot" id="vis-supply"><div class="time">17:00–19:00</div><div><h3>ViS 入住 → Voli 補貨</h3><p>先入住、確認次日天氣與公園通行，再採買兩天早餐／午餐。若入住較晚，先超市再晚餐；不要等星期日補貨。</p><p><b>費用：</b>兩人兩天飲水與簡易早餐／午餐預算 €25–40</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Voli%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://kompanija.voli.me/voli-marketi/" target="_blank" rel="noopener">官方資訊</a></div></div><div class="slot" id="mb-dinner"><div class="time">18:30–20:00</div><div><h3>Žabljak 晚餐｜Hotel MB 或簡餐</h3><p>有精神選 Hotel MB 的湯、共享 kačamak、羊肉或鱒魚；疲倦就到 Podgora 一類簡餐店，吃完早休息。</p><p><b>費用：</b>兩人正餐預算 €30–45；簡餐約 €20–30</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Hotel%20MB%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://mbturist.com/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mb-dinner">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>薄霾／小雨且行車安全：取消拍照與修道院。濃煙、火焰、封路或能見度不足：在危險區外等待官方安排，必要時延後抵達；不轉進 Sedlo 或 Pljevlja 捷徑。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>Foča 10:15 後才離開，或 Plužine 14:00 後才到：刪修道院、改快速午餐與零景觀支線。導航時間不含所有休息與邊境；17:00–18:00 是目標，不靠超速補回。</p></div></section><section class="day" id="mn12"><span class="tag">2026-09-12</span><h2>9/12｜三鐵選配、草原湖泊與中世紀石墓碑</h2><p>正常版08:30早餐；想看游泳改05:30到黑湖、06:45前離開後回ViS補眠。兩版擇一，白天戶外均看雷雨空檔。</p><div class="slot" id="race-watch"><div class="time">05:30–06:30｜早起選配</div><div><h3>黑湖 T1 外圍｜游泳上岸與自行車出發</h3><p>官方04:30起跑、06:45游泳關門。想看起跑需04:00前後到湖岸；不早起就選傍晚終點。當天主辦天氣決定優先。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Restoran%20Crno%20Jezero%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="weather-gate"><div class="time">08:30–09:00</div><div><h3>ViS 早餐與雷雨判斷</h3><p>若看了早場，回住宿早餐／補眠，把短線延後或刪掉。雷暴接近時留室內；不是撐傘就照走。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=ViS%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="devils-lake"><div class="time">09:15–09:40｜安全空檔</div><div><h3>Vražje Lake</h3><p>不要求繞湖。陰天可看草原與近岸線；座標43.08400,19.14564為你提供的湖區位置，不是已查明停車位，停車依現場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Vra%C5%BEje%20jezero%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-devils-lake">導覽</a></div></div><div class="slot" id="fish-lake"><div class="time">09:45–10:00｜可刪</div><div><h3>Riblje Lake</h3><p>只做10–15分鐘近景停靠。與下一個墓碑點合併，天氣空檔短時直接選墓碑，兩湖不必都走。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Riblje%20jezero%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-fish-lake">導覽</a></div></div><div class="slot" id="greek-tombs"><div class="time">10:05–10:35</div><div><h3>Grčko groblje｜UNESCO 石墓碑</h3><p>UNESCO組成點1504-023。官方位置換算43.094817,19.149183，與你提供的點一致；這是遺址座標，不代表停車場。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=43.094817%2C19.149183" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-greek-tombs">導覽</a></div></div><div class="slot" id="bare-tombs"><div class="time">10:50–11:20｜選配</div><div><h3>Bare Žugića｜第二處世界遺產</h3><p>官方組成點1504-024，座標43.107600,19.168117。與前一處擇一也足夠，別為收集兩個點延長風雨暴露。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=43.107600%2C19.168117" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-bare-tombs">導覽</a></div></div><div class="slot" id="sat-lunch"><div class="time">12:00–16:30</div><div><h3>Žabljak 午餐、補貨與休息</h3><p>補星期日與星期一早餐。若上午雷雨不外出，今天就當休息日；黑湖完整環湖留週日。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Voli%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="race-finish"><div class="time">17:30–19:00｜先查進度</div><div><h3>黑湖終點｜跑步完賽候選時段</h3><p>今年手冊終點是黑湖。只有主辦確認開放、已有選手接近且無雷暴才去，等候上限約45分鐘；不是保證17:30有冠軍。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Restoran%20Crno%20Jezero%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a></div></div><div class="soft"><b>雨天備案</b><p>雷雨時湖泊、墓碑、觀賽全部可取消，改ViS／市區室內用餐休息。沒有室內文化館開放確認，不另編一個必開訪客中心。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>早場觀賽後疲倦：兩湖擇一、墓碑擇一；傍晚選手尚遠不等，為週日留睡眠。</p></div></section><section class="day" id="mn13"><span class="tag">2026-09-13</span><h2>9/13｜黑湖＋Ćurevac，北段有時間才往返</h2><p>不重跑 Trsa–Sedlo。06:25出發不代表06:35已站湖岸；留停車、入口至湖岸步行。以黑湖＋Ćurevac為完成目標。</p><nav><a href="#mn13-original-a">方案 A｜原行程</a><a href="#mn13-photo-b">方案 B｜攝影時段優先・下午再回黑湖</a></nav><section class="soft" id="mn13-photo-b"><h3>方案 B｜攝影時段優先・下午再回黑湖</h3><h3>9/13 晴天攝影安排</h3><p>新增方案 B｜2026-09-12 整理。適用晴朗、能見度良好且步道安全的情況；原方案 A 留在下方。9/11 已走過南段高山公路，9/12 已訪 Vražje、Riblje、Grčko groblje，本方案不再重複，也不安排 10:00 儀式。</p><p>先把上午留給黑湖倒影與 Ćurevac 峽谷，下午回森林湖。這個方案不再加 Sušica、Nedajno 或 Sedlo，以免來回山路和健行擠壓休息時間。日出約 06:20；到湖岸 07:00 並不算晚，也不必摸黑到湖岸等待。倒影取決於風、雲及山影，日出時間不是湖面完全受光的時間。</p><div class="tablewrap"><table><thead><tr><th>時間</th><th>安排</th><th>執行細節</th></tr></thead><tbody><tr><td>06:30–07:00</td><td>ViS → 黑湖入口停車 → 徒步湖岸</td><td>自駕約 5–10 分鐘，停妥後留 15–20 分鐘步行；採市區免費停車則需更早出門。</td></tr><tr><td>07:00–08:00</td><td>Black Lake 主湖岸攝影</td><td>先拍 Međed 山體與森林倒影，再拍岸邊石塊前景；湖面平靜時多留，不急著環湖。</td></tr><tr><td>08:00–08:40</td><td>短程湖岸步行、返回停車處</td><td>不做完整環湖，保留上午峽谷時段；準備當日公園票。</td></tr><tr><td>08:40–09:15</td><td>自駕 Ćurevac 登山口</td><td>狹窄地方道路，預留會車；停登山口，不導航到山頂。</td></tr><tr><td>09:15–10:45</td><td>Ćurevac 往返步道與拍照</td><td>約 1–1.5 小時含停留；約 09:45–10:15 到觀景處，安全乾燥處停留。</td></tr><tr><td>11:15–12:15</td><td>Žabljak 午餐、補水</td><td>一般簡餐估 €8–15／人；選當日營業且有標價的店。</td></tr><tr><td>12:30–16:30</td><td>再赴黑湖 → Mlinski Potok → Zminje Lake → 返回</td><td>包含停車、入口步行及拍照緩衝；跟隨標記／離線健行地圖。不要同時加完整黑湖環湖。</td></tr><tr><td>16:30–17:00</td><td>回 ViS</td><td>整理隔天 Peja 跨境文件，核對 R10、Kula 道路資訊。</td></tr></tbody></table></div><h3>停車座標｜免費候選與付費備案分開</h3><p>以下經緯度格式為緯度、經度。免費是可核對的候選資訊，不代表保證有空位或沒有臨時管制。現場收費牌、禁停牌、管理人員及施工管制優先。免費停車不等於免公園門票。</p><p>若 ViS 訂房已含停車，住宿車位最確定不需額外找位，但到黑湖須增加徒步。市區候選離湖數公里，為省停車費而使用它們，就無法照表在 30 分鐘內從住宿抵達湖岸。</p><div class="tablewrap"><table><thead><tr><th>停車地點</th><th>Google Maps 經緯度</th><th>免費確認程度</th><th>限制與代價</th></tr></thead><tbody><tr><td>Ćurevac 登山口</td><td>43.19390, 19.08965</td><td>實訪稱免費；較舊資料</td><td>2021 俄文遊記記錄免費碎石空地。車位少，現場重新核對；仍需公園票。</td></tr><tr><td>Žabljak 市區公共停車候選</td><td>43.15381, 19.12729</td><td>地圖標示免費</td><td>OSM fee=no、24/7；未取得當日實訪確認。離黑湖岸數公里，步行時間不可忽略。</td></tr><tr><td>P5／體育館周邊候選</td><td>43.15830, 19.13170</td><td>旅客報告免費，但限制有爭議</td><td>2026 多語評論有人免費停；也有要求移車或先詢問館方。只停獲准區域，不當作保證全天免費。</td></tr><tr><td>市區公共車庫候選</td><td>43.15681, 19.12047</td><td>免費狀態未確認</td><td>2026 夏季新聞稱公共車庫免費，但 OSM 標 €0.50／時；公告未說夏季截止日，也須核對是否同一車庫。不能直接當免費車位。</td></tr><tr><td>黑湖入口道路停車</td><td>43.15445, 19.10238</td><td>付費備案</td><td>OSM 標 €3／小時；現場價牌優先。往湖岸仍需步行，不把車開過限制車輛的入口。</td></tr></tbody></table></div><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.19390,19.08965">Ćurevac 免費停車候選｜43.19390,19.08965</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.15381,19.12729">市區免費候選｜43.15381,19.12729</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.15830,19.13170">P5 體育館候選・先詢問｜43.15830,19.13170</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.15681,19.12047">公共車庫・費用待核對｜43.15681,19.12047</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.15445,19.10238">黑湖入口付費停車｜43.15445,19.10238</a><h3>下午回黑湖，還要再買票嗎？</h3><p>按官方 €5／人／日的計價及當地使用說明，同一人持 9/13 的當日票，下午返回黑湖通常不需再買一張；兩位成人當日公園門票合計 €10，而非 €20。保留原票／QR code，在 Ćurevac 與下午入園時出示。官方公開價表未詳列重入園驗票程序，早上購票時請確認是否需要蓋章或其他證明。</p><p>票務人員尚未上班不等於免費開放；不能把清晨無人收票當免票政策。售票處開門後或遇巡查人員時，依規定購買／出示票券。</p><p>停車另外計費：上午離場、下午重新入場可能重新起算。上午約 2–2.5 小時、下午約 4–4.5 小時，若每小時 €3 且不足一小時進位，合計先留 €18–24／車。上午停車收據不代表下午免付；先問進位、再次進場及上限。</p><p>兩人本日參考：公園 €10＋入口停車 €18–24＋午餐 €16–30＝€44–64，不含晚餐、油費。若使用合法免費停車可省停車費，但會增加走路與行程時間。</p><a class="map" target="_blank" rel="noopener" href="https://nparkovi.me/sections/27/durmitor">官方 Durmitor 每日票價</a><a class="map" target="_blank" rel="noopener" href="https://ivrentacar.com/de/blog/black-lake-montenegro-drivers-guide-to-crno-jezero-durmitor/">當地自駕指南：保留全日公園票</a><h3>黑湖｜上午經典倒影，下午森林湖</h3><p>主湖岸拍照：43.14756, 19.09604。這是步行拍照點，不是停車位。面向 Međed 山體，先用標準廣角拍湖、森林與山，找平靜水面；風起時改拍岸石、水色與樹林，不必一直等待倒影。</p><p>Zminje Lake 湖畔參考點：43.15527, 19.07094，僅供徒步定位。下午沿 Mlinski Potok 方向的標記步道往返；Google Maps 景點釘不是完整健行導航，出發前下載離線步道圖。雨後樹根、泥地會滑，14:30 尚未到湖就評估折返。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.14756,19.09604">黑湖必拍主湖岸・步行｜43.14756,19.09604</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.15527,19.07094">Zminje Lake 湖畔・步行｜43.15527,19.07094</a><details><summary>導覽</summary><p>黑湖 Crno Jezero 位於海拔約 1,416 公尺，由大、小兩個湖盆組成，水位變動會改變兩湖連接的樣貌。「黑」的視覺來自深水與森林、山影，並不是湖水骯髒。</p><p>上午的開闊倒影與下午的 Zminje 森林湖是兩種畫面：前者用山水對稱，後者用樹幹層次和柔和林光。Mlinski Potok 名稱與磨坊溪流有關，沿途可留意水道及磨坊地景；不要為尋找遺跡離開步道。</p></details><h3>Ćurevac｜上午比下午更合這次拍攝目的</h3><p>觀景處參考座標：43.20155, 19.09298。從登山口徒步過去；不要把這個座標當停車點。推薦 09:30–11:00，俄文實訪指出上午河谷色彩較明亮，午後部分峽谷逐漸進入陰影。這是地形與經驗判斷，不是所有取景方向都能完全順光。</p><p>必拍：Tara 深切河谷的縱深、對岸坡面與 Tepca 聚落層次。廣角表現峽谷尺度，中長焦擷取河道彎曲及聚落。不為了避開樹枝靠近崖邊；仍有霧或強陣風就縮短停留。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.20155,19.09298">Ćurevac 觀景處・徒步終點｜43.20155,19.09298</a><a class="map" target="_blank" rel="noopener" href="https://www.balkanstravel.ru/2021/11/curevac.html">俄文實訪：免費停車與早午光線</a><details><summary>導覽</summary><p>Ćurevac 約海拔 1,625 公尺。它最值得看的不是一座孤立山峰，而是 Tara 河切穿高原形成的深谷；與你們已看過 Sedlo 的裸岩山口完全不同。</p><p>拍攝峽谷時，中午前後的明暗落差也可能很大。先保留亮部細節，讓岩壁與林坡呈現自然層次；全景不一定比把河道與對岸聚落放在同一張照片更有故事。</p></details><h3>電影橋保留 9/14｜同側拍五拱，再往 Mojkovac</h3><p>本方案不在 9/13 專程往返電影橋。9/14 ViS 約 07:00 出發，07:40–08:20 在 Žabljak 側合法開放區拍照，再沿 Dobrilovina／Sokolovina → Mojkovac → Ribarevine → Berane → Rožaje → Kula → Peja。橋頭附近可接往 Mojkovac 的道路，不需要跨橋；仍須前晚確認 R10 當日狀況。</p><p>橋面依公告封閉至 10/26，包含行人；不能上橋、穿過圍欄，也不能跨橋找免費車位。經典五拱應從側面取景，避免沿橋軸把橋拱疊在一起。Žabljak 側「Pogled na most」43.14888, 19.29215 是可定位的觀景候選，並非保證施工期間開放或五拱完全無遮擋；合法範圍內調整角度。</p><p>同側付費停車參考 43.14878, 19.29151，地圖標第一小時 €2。對岸地圖雖有免費車位，但封橋期間不能當作本路線的免費停車方案。橋照＋停靠預留 40 分鐘，不加 Zipline。</p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.14888,19.29215">電影橋側面觀景候選・先看封鎖範圍｜43.14888,19.29215</a><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=43.14878,19.29151">電影橋 Žabljak 側付費停車｜43.14878,19.29151</a><a class="map" target="_blank" rel="noopener" href="https://www.gov.me/clanak/od-10-avgusta-potpuna-obustava-saobracaja-preko-mosta-durdevica-tara">官方橋梁封閉公告</a><a class="map" target="_blank" rel="noopener" href="https://rtcg.me/vijesti/drustvo/873021/dok-je-zatvoren-most-djurdjevica-tara-izmedju-zabljaka-i-pljevalja-preko-mojkovca-slijepac-mosta-i-vrulje.html">RTCG：往 Mojkovac 替代道路說明</a><details><summary>導覽</summary><p>Đurđevića Tara Bridge 與 1969 年南斯拉夫電影《Most》（橋）相關。電影借用二戰游擊隊炸橋題材；真實人物工程師 Lazar Jauković 參與 1942 年破壞橋跨，之後被義大利軍隊處決。不要把他與橋梁設計者 Mijat Trojanović 混為一人。</p><p>五個拱跨與深谷共同構成經典畫面。電影故事、戰時損毀及戰後重建是不同層次的歷史；今天看見的橋也正在維修，施工設備可能入鏡，不能為取得舊照片般的角度進入工區。</p></details><h3>停車與攝影查核來源｜2026-09-12</h3><p>停車資訊綜合俄文實訪、法／德／英／羅馬尼亞語旅客留言、當地新聞及 OpenStreetMap。實訪年份與爭議已在表中標明；沒有現場重新確認的車位，不標成「保證免費」。</p><a class="map" target="_blank" rel="noopener" href="https://roadtripster.net/montenegro/curevac-tara-river-canyon">Ćurevac 登山口座標實訪</a><a class="map" target="_blank" rel="noopener" href="https://park4night.com/fr/place/545681">P5 體育館多語旅客留言</a><a class="map" target="_blank" rel="noopener" href="https://www.openstreetmap.org/way/1197203760">市區公共停車 OSM</a><a class="map" target="_blank" rel="noopener" href="https://www.openstreetmap.org/way/1445802414">公共車庫 OSM</a><a class="map" target="_blank" rel="noopener" href="https://verige.net/vijesti/bojovic-parking-servis-zabljak-stabilno-posluje-uvodi-besplatnu-garazu-i-rampu-ka-crnom-jezeru/">夏季公共車庫免費新聞</a><a class="map" target="_blank" rel="noopener" href="https://www.openstreetmap.org/way/1086138763">黑湖入口停車 OSM</a><a class="map" target="_blank" rel="noopener" href="https://www.openstreetmap.org/node/1448533356">電影橋觀景點 OSM</a><a class="map" target="_blank" rel="noopener" href="https://www.openstreetmap.org/way/241247513">電影橋同側停車 OSM</a><a class="map" target="_blank" rel="noopener" href="https://nparkovi.me/parks/Durmitor/active_holidays">官方 Durmitor 戶外活動</a><a class="map" target="_blank" rel="noopener" href="https://kinotuskanac.hr/movie/most">電影 Most 資料</a></section><h3 id="mn13-original-a">方案 A｜原行程（保留）</h3><div class="slot" id="blacklake-morning"><div class="time">06:25出發；約06:50–08:30湖岸</div><div><h3>Black Lake／Crno Jezero｜早晨湖景</h3><p>留停車與入口步行20–30分鐘。先拍倒影，再選局部環湖；完整環湖與長時間攝影無法同時壓進一小時。清晨不保證無風，雲低時不要久等。</p><p><b>費用：</b>入園先抓 €5／人／日、停車 €1／小時作暫估，2026 售票須現場確認</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Crno%20Jezero%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nparkovi.me/parks/Durmitor/active_holidays" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-blacklake-morning">導覽</a></div></div><div class="slot" id="curevac"><div class="time">08:30–10:45</div><div><h3>Ćurevac｜Tara 峽谷短健行</h3><p>回停車場後開車至標示登山口，步行、觀景與返回共留60–90分鐘，加轉場緩衝。43.20155,19.09298是使用者提供的觀景區參考，不是停車點；導航找登山口。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C4%86urevac%20trailhead%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-curevac">導覽</a></div></div><div class="slot" id="mala"><div class="time">11:00–12:30｜条件式</div><div><h3>Žabljak → Mala Crna Gora</h3><p>只有谷底能見度好、道路與火災警戒無問題、駕駛精神好才開往Mala Crna Gora。帶野餐，沿北側高地慢行；此路本身仍有高海拔與窄路，不是低風險平路。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mala%20Crna%20Gora%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-mala">導覽</a></div></div><div class="slot" id="susica"><div class="time">12:30–13:30｜到安全觀景處折返</div><div><h3>Sušica 方向｜不預設跨到 Nedajno</h3><p>主方案僅從Mala Crna Gora一侧可安全到達的觀景位置看谷，13:30前開始原路返回。若想下谷底或到Nedajno，必須刪Zminje並另外保留約3–4小時往返與停靠；不把到Nedajno當成已回到Žabljak。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Nedajno%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://nparkovi.me/parks/Durmitor/active_holidays" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-susica">導覽</a></div></div><div class="slot" id="north-return"><div class="time">13:30–16:00</div><div><h3>原路返回 Žabljak</h3><p>預留慢車、會車及短休息；不從Nedajno臨時接受不明捷徑，不為不重複南段而走未確認支路。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%BDabljak%20Montenegro" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="zminje"><div class="time">替代北段；不加碼</div><div><h3>Mlinski Potok → Zminje Lake</h3><p>只有放棄Mala Crna Gora／Sušica北段，且無雷雨、林道可走時，才從黑湖往返Zminje。單程60–80分鐘，含休息留至少2.5–3小時；不要排08:10–10:20後又假設10:30已能開車去Ćurevac。</p><p><b>交通：</b>由黑湖走標示步道，依實走路線全日可達約 8–10 公里、4–5 小時。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Zminje%20jezero%20Durmitor" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-zminje">導覽</a></div></div><div class="slot" id="r10-check"><div class="time">17:00–18:00</div><div><h3>確認明天 R10 與 Kula</h3><p>9/14仍不跨Tara Bridge。南岸R10／Dobrilovina／Sokolovina需要當日確認；舊替代公告證明道路連接方向，不保證下週一沒有落石或管制。晚上核對，不到橋邊才決定。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C5%BDabljak%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://amscg.org/" target="_blank" rel="noopener">官方資訊</a><p><b>預約：</b>若沒有明確通行確認，今晚選定替代路線與提早出發時間，不到橋邊才臨時決定。</p></div></div><div class="soft"><b>雨天備案</b><p>低雲只留黑湖近景；雷暴／明顯煙霾則不健行。若週日也不合格，刪北段，不能因今天是最後一天硬開。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>主線保留黑湖＋Ćurevac；依序刪Zminje、谷底／Nedajno、Mala Crna Gora。Sedlena Greda不列本次主行程，雨後岩面與暴露路段不因爬升少就變容易。</p></div></section><section class="day" id="mn14"><span class="tag">2026-09-14</span><h2>9/14｜Tara 南岸 → Kula → Peja</h2><p>只有 R10／Sokolovina 已確認可通行才採下列時程。Tara Bridge 本體不過、不步行上橋、不預設 Zipline。</p><div class="slot" id="mn14-start"><div class="time">06:15–07:00</div><div><h3>ViS 退房與出發</h3><p>吃昨天買好的早餐，確認油量與車況；先導航橋的 Žabljak／南岸側，不把對岸 Pljevlja 設為目的地。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=ViS%20%C5%BDabljak" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="tara-view"><div class="time">07:40–08:05</div><div><h3>Đurđevića Tara｜南岸安全觀景</h3><p>只到施工區外、允許進入的公共觀景位置。沒有可用停車點就取消；封閉橋面不作攝影平台。</p><p><b>費用：</b>路邊公共觀景是否有停車費依現場；本次不預訂 Zipline</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=%C4%90ur%C4%91evi%C4%87a%20Tara%20Bridge" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://www.gov.me/clanak/od-10-avgusta-potpuna-obustava-saobracaja-preko-mosta-durdevica-tara" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-tara-view">導覽</a></div></div><div class="slot" id="mojkovac"><div class="time">08:05–10:00</div><div><h3>R10／Dobrilovina／Sokolovina → Mojkovac</h3><p>已確認開放才走南岸河谷線；橋本體封閉不等於這條線必然封閉。預留慢車與一次洗手間，不加入修道院等觀光。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Mojkovac%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://whc.unesco.org/en/list/100/" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-mojkovac">導覽</a></div></div><div class="slot" id="berane"><div class="time">10:00–12:15</div><div><h3>Ribarevine → Berane｜休息與午餐</h3><p>在主路附近找麵包店、肉湯或烤肉簡餐，不進城尋找必吃名店。每 1.5–2 小時左右安排短休息，時間可隨路況調整。</p><p><b>費用：</b>午餐預算 €7–13／人</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Berane%20Montenegro" target="_blank" rel="noopener">Google Maps</a></div></div><div class="slot" id="rozaje"><div class="time">12:15–13:30</div><div><h3>Rožaje｜最後補水與油量確認</h3><p>水、洗手間與文件都在山口前處理。油量若已足夠到 Peja 並有餘量，就不需加滿；網路與離線地圖應出發前已下載。</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Ro%C5%BEaje%20Montenegro" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-rozaje">導覽</a></div></div><div class="slot" id="kula"><div class="time">13:30–15:30</div><div><h3>Kula／Kulina → Kosovo</h3><p>山口路段留意低雲與慢車；通關時間只是緩衝估計，沒有可靠的未來排隊承諾。核對現車車牌、租車授權與 MTPL，尤其換過車時不能沿用不相符的舊文件。</p><p><b>費用：</b>有效 Albania 車牌 MTPL 符合 BKS 互認時，不應自動重買一份邊境責任險；不符合者須依 BKS 報價</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Kula%20border%20crossing%20Montenegro%20Kosovo" target="_blank" rel="noopener">Google Maps</a><a class="map" href="https://bks-ks.org/pagemodels/open?id=256e0671-2a5a-444e-a3e1-cceffc9b4b8e" target="_blank" rel="noopener">官方資訊</a><a class="guide-link" href="#guide-kula">導覽</a></div></div><div class="slot" id="peja"><div class="time">16:00–17:30</div><div><h3>Peja 抵達｜入住與輕鬆晚餐</h3><p>先去自己的住宿，不加 Rugova 山路或修道院趕場。抵達後用簡單晚餐結束四天山區駕駛。</p><p><b>費用：</b>晚餐暫抓 €8–15／人；住宿依既有訂房，不含在本表</p><a class="map" href="https://www.google.com/maps/search/?api=1&amp;query=Peja%20Kosovo" target="_blank" rel="noopener">Google Maps</a><a class="guide-link" href="#guide-peja">導覽</a></div></div><div class="soft"><b>雨天備案</b><p>Kula 濃霧降低速度，必要時在 Rožaje 安全等待；不要因延誤選未確認的山口捷徑。</p></div><div class="soft"><b>延誤時怎麼刪減</b><p>R10 不確認可通時，取消 Tara 全部活動。替代一：經 Šavnik → Boan／Tušina → Semolj → Mioska → Kolašin → Mojkovac → Ribarevine → Berane，這仍是窄山路，只有通行與天氣合格才採。替代二：經 Šavnik → Jasenovo Polje → Nikšić → Danilovgrad → Smokovac → A1 → Mateševo → Kolašin → Mojkovac → Ribarevine → Berane → Rožaje → Kula → Peja，路程顯著更長；06:00 左右出發，整日先留 10–12 小時並按導航與官方公告修訂，A1 通行費另計。若天氣或延誤使山口將入夜，不硬守 Peja 當晚抵達，先在有服務的城鎮停留。</p></div></section><section id="budget"><h2>費用與預算</h2><div class="tablewrap"><table><thead><tr><th>項目</th><th>價格</th><th>計價單位</th><th>確認狀態</th></tr></thead><tbody><tr><td>黑山普通柴油</td><td>€1.87 上限</td><td>公升</td><td>官方 9/8–9/14；9/15 可能調價</td></tr><tr><td>四天燃油預算</td><td>€120–165</td><td>一車</td><td>新增 Rogatica／Goražde 繞行，約 65–90L 留額；非車型實測，9/14 大繞路另核算</td></tr><tr><td>Voli 週末早餐／午餐飲水</td><td>€25–40</td><td>兩人兩天</td><td>估算；週六補週一用品另留 €5–10</td></tr><tr><td>9/11 餐飲＋採買</td><td>€70–115</td><td>兩人／日</td><td>含簡餐與晚餐，不含住宿燃油</td></tr><tr><td>9/12 餐飲＋入園／停車</td><td>€50–85</td><td>兩人／日</td><td>早餐備糧不重算；門票停車為待確認暫估</td></tr><tr><td>9/13 餐飲＋入園</td><td>€55–90</td><td>兩人／日</td><td>自駕環線／一般餐；未含包車或昂貴羊肉大份</td></tr><tr><td>9/14 餐飲</td><td>€35–60</td><td>兩人／日</td><td>不含住宿、保險例外與長繞高速費</td></tr><tr><td>Durmitor 入園</td><td>暫估 €5</td><td>人／日</td><td>本次未取得適用 2026/9 的完整新價目；現場確認</td></tr><tr><td>Black Lake 停車</td><td>暫估 €1</td><td>車／小時</td><td>舊參考；實際看所選停車場</td></tr><tr><td>划船</td><td>舊參考 €10</td><td>船／小時</td><td>未確認現價；本次天氣不列必做</td></tr><tr><td>Piva Monastery</td><td>待確認／自願捐獻</td><td>人</td><td>不把未知門票視為固定免費</td></tr><tr><td>Ring 包車／嚮導</td><td>詢價</td><td>按車／人確認</td><td>舊 €20 van、€30 jeep 不當成可預訂報價</td></tr><tr><td>Tara Zipline</td><td>本次刪除</td><td>—</td><td>施工、接駁與跨境時間未確認，不先付費</td></tr></tbody></table></div><p>兩人四天先留約 €330–515，涵蓋上表一般餐飲、採買、暫估入園停車及 €120–165 燃油；不含住宿、原租車費、額外保險、包車、Zipline 與大繞路高速費。這是留餘裕的旅費範圍，不是已訂服務的總報價。餐飲列每日預算與採買列有重疊說明，合計時不能把採買再次加進去。</p></section><section id="guidebook"><h2>景點導覽</h2><details class="guide-card" id="guide-hum"><summary>Hum／Šćepan Polje｜慢山路與跨境｜導覽</summary><h3>現場看什麼</h3><p>留意河谷道路逐步收窄，過境後再找正式停車位置。</p><h3>歷史背景</h3><p>Tara 與 Piva 在 Šćepan Polje 一帶匯成 Drina，河流在這裡既連接山區，也構成國界的一部分。</p><h3>相關故事</h3><p>接下來看到的是 Piva 系統；不要把所有藍綠水面都叫作 Tara。這個匯流點是理解兩天峽谷地理的起點。</p><h3>實用提醒</h3><p>邊境設施內不隨意拍照；租車文件需與現車車牌一致。</p><a class="guide-return" href="#hum">回到行程</a></details><details class="guide-card" id="guide-piva-canyon"><summary>Piva Canyon｜隧道、峽谷與水庫｜導覽</summary><h3>現場看什麼</h3><p>看湖面與峭壁垂直落差、鑿岩隧道，以及水位線。不要為完整大壩照片找危險路肩。</p><h3>歷史背景</h3><p>Piva 自然公園資料把水庫形成記為 1975 年水電工程；這不是天然冰河湖。</p><h3>相關故事</h3><p>水壩改變了河谷、聚落與文化遺產的位置。你現在看到的平靜水面下，原本是一段更深切的河谷景觀。</p><h3>實用提醒</h3><p>雨剛開始時油膜與灰塵可能讓路面更滑；拍照由副駕觀察，駕駛專心。</p><a class="guide-return" href="#piva-canyon">回到行程</a></details><details class="guide-card" id="guide-pluzine"><summary>Plužine｜午餐與湖岸短走｜導覽</summary><h3>現場看什麼</h3><p>從公共湖岸看小城與水面的高度關係。</p><h3>歷史背景</h3><p>水庫工程讓舊聚落居民遷到較高的新城；今日 Plužine 的格局與近代水電開發密切相關。</p><h3>相關故事</h3><p>旅行時很容易只稱讚水色，這裡也適合想一想：新湖景的形成，同時意味著舊家園改變。</p><a class="guide-return" href="#pluzine">回到行程</a></details><details class="guide-card" id="guide-piva-monastery"><summary>Piva Monastery｜會搬家的修道院｜導覽</summary><h3>現場看什麼</h3><p>先看低調的石造外觀，再看室內壁畫如何包覆牆面；不只拍外觀就離開。</p><h3>歷史背景</h3><p>修道院建於 1573–1586 年。為避開水庫蓄水，20 世紀後期把建築拆解、編號與重建，並搬移壁畫，工程在 1982 年完成。</p><h3>相關故事</h3><p>真正值得看的是保存方法：石塊能拆，壁畫卻與灰泥、牆體相連，需要分片處理。今天看似安靜完整的空間，是大量保護工程重新拼合的結果。</p><h3>實用提醒</h3><p>遮肩遮膝、安靜參觀；拍攝先詢問。禮拜時以信眾使用為優先。</p><a class="guide-return" href="#piva-monastery">回到行程</a></details><details class="guide-card" id="guide-savnik"><summary>Jasenovo Polje → Šavnik → Žabljak｜導覽</summary><h3>現場看什麼</h3><p>看河谷、坡地聚落逐漸轉成高原草地與森林。</p><h3>歷史背景</h3><p>Šavnik 是黑山內陸河谷與山地路網的節點。經這裡上 Žabljak，海拔變化是這天景觀的一部分。</p><h3>相關故事</h3><p>這段繞行的價值是把「抵達」與「高山遊覽」分開：今天完成移動，等精神與天氣合格再看山口。</p><a class="guide-return" href="#savnik">回到行程</a></details><details class="guide-card" id="guide-mb-dinner"><summary>Žabljak 晚餐｜Hotel MB 或簡餐｜導覽</summary><h3>現場看什麼</h3><p>高地料理重視乳酪、馬鈴薯、玉米與肉湯，先問份量再點。</p><h3>歷史背景</h3><p>kačamak 常把馬鈴薯與玉米粉煮合再拌乳製品；cicvara 更偏向乳脂與玉米粉煮成的濃稠料理，兩者不必同餐各點一大份。</p><h3>相關故事</h3><p>寒冷山區的食物設計重在飽足。兩人共享一道高熱量主食，通常更能吃到不同菜色。</p><a class="guide-return" href="#mb-dinner">回到行程</a></details><details class="guide-card" id="guide-devils-lake"><summary>Vražje Lake｜導覽</summary><h3>現場看什麼</h3><p>看開闊草原包圍的水面，與黑湖森林景觀對比。</p><h3>歷史背景</h3><p>此區湖泊位於高原冰河地形中。Devil’s Lake 是地名，不必把網路流傳傳說當成確定史實。</p><h3>實用提醒</h3><p>湖邊暴露；雷聲、強陣風或道路視距變差立即取消。</p><a class="guide-return" href="#devils-lake">回到行程</a></details><details class="guide-card" id="guide-fish-lake"><summary>Riblje Lake｜導覽</summary><h3>現場看什麼</h3><p>拍湖岸、草坡與天空層次，不必等遠山全露。</p><h3>歷史背景</h3><p>Riblje 的地名與魚相關；小湖的價值是與高原生活地景連在一起。</p><h3>實用提醒</h3><p>不要把湖中心座標當成可開車抵達的點。</p><a class="guide-return" href="#fish-lake">回到行程</a></details><details class="guide-card" id="guide-greek-tombs"><summary>Grčko groblje｜UNESCO 石墓碑｜導覽</summary><h3>現場看什麼</h3><p>看石碑形狀、排列、風化與仍可辨認的雕刻；不攀坐、不拓印。</p><h3>歷史背景</h3><p>Stećci 是12–16世紀跨國中世紀墓碑傳統，不能只歸屬單一現代國家或宗派。</p><h3>實用提醒</h3><p>名稱中的「希臘墓地」不等於已證實墓主都是古希臘人。陰天適合看表面，但草地雷雨時仍須取消。</p><a class="guide-return" href="#greek-tombs">回到行程</a></details><details class="guide-card" id="guide-bare-tombs"><summary>Bare Žugića｜第二處世界遺產｜導覽</summary><h3>現場看什麼</h3><p>比較墓碑群的規模和排列；不移動石塊。</p><h3>歷史背景</h3><p>同屬跨波赫、黑山、塞爾維亞與克羅埃西亞的系列世界遺產。</p><h3>實用提醒</h3><p>保持在既有通路；停車不壓牧草、墓地或私人土地。</p><a class="guide-return" href="#bare-tombs">回到行程</a></details><details class="guide-card" id="guide-blacklake-morning"><summary>Black Lake／Crno Jezero｜早晨湖景｜導覽</summary><h3>現場看什麼</h3><p>主入口湖岸看 Međed 山與森林倒影；風起後改拍樹幹、岸線及水面層次。</p><h3>歷史背景</h3><p>黑湖位於冰河塑造的山地，包含相連的大小湖盆，連通狀態隨水位變化。</p><h3>相關故事</h3><p>兩個湖盆不像游泳池固定同一水位；夏末水位降低時，原本不明顯的岸線和連接處會更清楚。湖名不代表水永遠黑色，樹影、深度與光線共同改變觀感。</p><h3>實用提醒</h3><p>完整環湖約 3.6 公里，拍照與濕路抓 1.5–2 小時；入口到湖岸也有步行距離。</p><a class="guide-return" href="#blacklake-morning">回到行程</a></details><details class="guide-card" id="guide-curevac"><summary>Ćurevac｜Tara 峽谷短健行｜導覽</summary><h3>現場看什麼</h3><p>看Tara深谷與對岸山坡；晴天的大尺度與黑湖近景互補。</p><h3>歷史背景</h3><p>Tara是Durmitor世界遺產的重要峽谷地形，觀景台不在施工中的Tara Bridge上。</p><h3>實用提醒</h3><p>步道有石塊與邊緣暴露，雨後滑、強風或雲遮谷底就取消，不是「一定要」。</p><a class="guide-return" href="#curevac">回到行程</a></details><details class="guide-card" id="guide-mala"><summary>Žabljak → Mala Crna Gora｜導覽</summary><h3>現場看什麼</h3><p>看聚落與夏季草場相隔的尺度，留意木屋、牲畜和山坡利用。</p><h3>歷史背景</h3><p>這一帶高地聚落生活受到季節與交通限制，夏天開闊的道路與牧場，冬天可能是完全不同的生活條件。</p><h3>相關故事</h3><p>它不是供觀光搭建的布景；牧場與家屋仍有使用者。拍人、入院子、靠近牲畜前先尊重居民。</p><a class="guide-return" href="#mala">回到行程</a></details><details class="guide-card" id="guide-susica"><summary>Sušica 方向｜不預設跨到 Nedajno｜導覽</summary><h3>現場看什麼</h3><p>由高處看峽谷深度、對岸村落與森林，對比剛剛的高原草地。</p><h3>歷史背景</h3><p>Durmitor 的冰河谷、河流峽谷與喀斯特作用交疊。Sušica 的水文具有季節性，不能保證任何時間都看到充滿水的湖。</p><h3>相關故事</h3><p>最有意思的是尺度轉換：同一條道路會讓人從開闊牧場下降到封閉谷底，再回到高處；不要只在某個「網紅點」找一模一樣的照片。</p><h3>實用提醒</h3><p>不靠近碎石邊緣；峽谷下坡使用合適低檔，會車時先觀察安全退讓處。</p><a class="guide-return" href="#susica">回到行程</a></details><details class="guide-card" id="guide-zminje"><summary>Mlinski Potok → Zminje Lake｜導覽</summary><h3>現場看什麼</h3><p>沿溪谷看森林、潮濕地面與湖邊倒木；小湖適合安靜停留，不是追求巨大山峰全景。</p><h3>歷史背景</h3><p>Durmitor 的地形同時受到冰河、流水與石灰岩溶蝕影響。Zminje 隱在森林，與開闊的黑湖形成不同尺度的湖泊經驗。</p><h3>相關故事</h3><p>Mlinski Potok 的名字與磨坊溪相關，提醒這不是只有現代遊客使用的森林；水流也曾是地方日常生產的一部分。</p><h3>實用提醒</h3><p>樹根、濕石很滑。岔路看步道標記與離線健行圖；Google 道路導航不能代替步道圖。</p><a class="guide-return" href="#zminje">回到行程</a></details><details class="guide-card" id="guide-tara-view"><summary>Đurđevića Tara｜南岸安全觀景｜導覽</summary><h3>現場看什麼</h3><p>從允許的安全位置看拱橋與峽谷的比例；不追求橋中央的對稱構圖。</p><h3>歷史背景</h3><p>橋建於 1937–1940 年，由五個拱跨組成，全長約 365 公尺，反映當時在深峽谷建立交通連接的工程能力。</p><h3>相關故事</h3><p>二戰期間橋的一部分被破壞以阻止軍事通行，戰後重建。今日又因維修暫停使用，提醒橋梁是持續維護的基礎設施，而非永遠不變的觀景道具。</p><h3>實用提醒</h3><p>Zipline 的起終點、接回停車場方式及施工影響未獲確認，這個跨境日直接刪除。</p><a class="guide-return" href="#tara-view">回到行程</a></details><details class="guide-card" id="guide-mojkovac"><summary>R10／Dobrilovina／Sokolovina → Mojkovac｜導覽</summary><h3>現場看什麼</h3><p>這段在河谷行駛，和前一天從山頂俯視是不同角度。</p><h3>歷史背景</h3><p>Tara 峽谷屬 Durmitor 世界遺產的重要自然景觀；石灰岩山地與河流下切共同塑造長尺度峽谷。</p><h3>相關故事</h3><p>不要把照片裡的一座拱橋當成整個 Tara：真正的主角是穿過不同地貌的河流。</p><a class="guide-return" href="#mojkovac">回到行程</a></details><details class="guide-card" id="guide-rozaje"><summary>Rožaje｜最後補水與油量確認｜導覽</summary><h3>現場看什麼</h3><p>如只經過主路，留意城市清真寺與內陸山地聚落的風貌，不特意穿進市中心。</p><h3>歷史背景</h3><p>這一帶的宗教與文化地景，與黑山西北高地有所不同，反映巴爾幹邊界兩側長期交錯的生活。</p><h3>相關故事</h3><p>今天以實用停靠為主，深入社區導覽留給有時間的行程，避免為文化標籤把跨境日塞滿。</p><a class="guide-return" href="#rozaje">回到行程</a></details><details class="guide-card" id="guide-kula"><summary>Kula／Kulina → Kosovo｜導覽</summary><h3>現場看什麼</h3><p>國界並不是到最高點就立即完成全部查驗，跟著正式口岸動線走。</p><h3>歷史背景</h3><p>BKS 說明 Kosovo 不屬 Green Card 體系，但與 Albania 的有效 MTPL 有互認安排。互認解決第三人責任保障，不自動涵蓋租車車身、底盤、輪胎損傷。</p><h3>相關故事</h3><p>真正容易忽略的是換車：目的地一樣、駕駛一樣，文件上的車牌卻必須跟現在開的車一致。</p><h3>實用提醒</h3><p>租車公司允許入境與保險有效是兩個問題，都要有文件支持。</p><a class="guide-return" href="#kula">回到行程</a></details><details class="guide-card" id="guide-peja"><summary>Peja 抵達｜入住與輕鬆晚餐｜導覽</summary><h3>現場看什麼</h3><p>從山口下降後，留意山地邊緣城市與平地交通的變化。</p><h3>歷史背景</h3><p>Peja／Peć 位於 Rugova 山區入口一帶，是銜接山地與 Kosovo 城市生活的起點。</p><h3>相關故事</h3><p>兩種常見地名在不同語言資料中並存；導航核對同一地點即可，不要把它們誤認成不同城市。</p><a class="guide-return" href="#peja">回到行程</a></details></section><section id="sources"><h2>查核來源</h2><ul><li><a href="https://www.gov.me/clanak/od-10-avgusta-potpuna-obustava-saobracaja-preko-mosta-durdevica-tara" target="_blank" rel="noopener">黑山交通管理局：8/10–10/26 Tara Bridge 全面封閉</a> · 2026-09-10</li><li><a href="https://en.vijesti.me/news-b/economy-d/818219/The-Traffic-Administration-published-a-video-of-the-completed-section-of-Zaborje-Jasenovo-Polje." target="_blank" rel="noopener">Vijesti 7/18：Zaborje–Jasenovo Polje 完工</a> · 2026-09-10</li><li><a href="https://bihamk.ba/spi/stanje-na-cesti-u-bih" target="_blank" rel="noopener">BIHAMK 一般路況：9/10 12:43；Hum 繁忙資訊為入境波赫方向</a> · 2026-09-10</li><li><a href="https://amscg.org/" target="_blank" rel="noopener">AMSCG 路況入口（本次未取得 Sokolovina 當日確認）</a> · 2026-09-10</li><li><a href="https://www.meteo.co.me/" target="_blank" rel="noopener">黑山官方氣象入口；本文城鎮四日數值為 9/10 天氣服務快照</a> · 2026-09-10</li><li><a href="https://www.gov.me/clanak/nove-cijene-goriva-od-08092026" target="_blank" rel="noopener">黑山能源部 9/8 起燃油最高價</a> · 2026-09-10</li><li><a href="https://nafta.hr/cijene-goriva-bih/" target="_blank" rel="noopener">波赫油價比較，全國平均非單站報價</a> · 2026-09-10</li><li><a href="https://kompanija.voli.me/voli-marketi/" target="_blank" rel="noopener">Voli 官方門市表</a> · 2026-09-10</li><li><  2026-09-10</li><li><a href="https://blackxtri.com/s/BLACKLAKE-Event-manual-2026.pdf" target="_blank" rel="noopener">2026 賽事手冊重新下載核對：T1／T2／黑湖終點</a> · 2026-09-11</li><li><a href="https://whc.unesco.org/en/list/1504/maps/" target="_blank" rel="noopener">UNESCO 組成點與精確座標</a> · 2026-09-11</li><li><a href="https://whc.unesco.org/en/list/1504/" target="_blank" rel="noopener">UNESCO stećci 背景</a> · 2026-09-11</li></ul></section></main></template>
<template id="content-balkans-2026"><header><div class="eyebrow">Bosnia & Herzegovina → Montenegro · 自駕雙人旅行</div><h1>Sarajevo 的兩張面孔，<br>與前往群山的一天。</h1><p>2026 年 9 月 9–11 日｜把較晴的一天留給街巷與 Trebević，把雨天留給城市記憶。9/11 07:00 出發，固定經 Šavnik，不走 Trsa／Sedlo。</p><span class="pill">核查日期 2026/9/8</span><span class="pill">全程當地時間 CEST · UTC+2</span><span class="pill">兩位成人 · 自有租車</span></header>
